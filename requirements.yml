# Ansible Galaxy collections — install: ansible-galaxy collection install -r requirements.yml -p collections
# Pinned so installs are deterministic. Transport roles use community.crypto (openssh_keypair, ssh_known_hosts), ansible.windows, community.windows.
---
collections:
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.windows
    version: ">=2.0.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: community.general
    version: ">=6.0.0"
  - name: community.windows
    version: ">=2.0.0"