# Ansible Galaxy dependencies — install both sections:
#   ansible-galaxy collection install -r requirements.yml -p collections
#   ansible-galaxy role install -r requirements.yml -p roles/galaxy
# Pinned so installs are deterministic.
---
collections:
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.windows
    version: ">=2.0.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: community.docker
    version: ">=4.0.0"
  - name: community.general
    version: ">=6.0.0"
  - name: community.windows
    version: ">=2.0.0"
  - name: https://github.com/myllynen/windows-ansible-roles
    type: git
    version: master

roles:
  - name: geerlingguy.docker
    version: "7.4.1"