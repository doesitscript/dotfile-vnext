# Ansible Galaxy dependencies — install both sections:
#   ansible-galaxy collection install -r requirements.yml -p collections
#   ansible-galaxy role install -r requirements.yml -p roles/galaxy
# Pinned so installs are deterministic.
# ansible-galaxy collection install -r requirements.yml -p collections
# ansible-galaxy role install -r requirements.yml -p roles/galaxy
# ---he second pulls roles (like geerlingguy.docker). Add --force if you need to upgrade an already-installed collection to a newer version:
# ansible-galaxy collection install -r requirements.yml -p collections --force
collections:
  - name: kubernetes.core
    version: ">=5.0.0"
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.windows
    version: ">=3.3.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: community.docker
    version: ">=4.0.0"
  - name: netbox.netbox
    version: ">=3.22.0"
  - name: awx.awx
    version: ">=24.6.1"
  - name: community.general
    version: ">=6.0.0"
  - name: community.windows
    version: ">=2.0.0"
  - name: chocolatey.chocolatey
    version: ">=1.0.0"
  - name: ansible.mcp
    version: ">=1.0.0"
  - name: gocallag.hyperv
    version: ">=0.4.0"
  - name: https://github.com/k3s-io/k3s-ansible.git
    type: git
    version: 1.1.1

roles:
  - name: geerlingguy.docker
    version: "7.4.1"
  - name: hosts_file
    src: https://github.com/loz-hurst/ansible-role-hosts_file.git
    version: v1.0.0
