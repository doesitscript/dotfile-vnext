# Ansible Galaxy collections (install once: ansible-galaxy collection install -r requirements.yml)
# Required for: bootstrap_mac (community.crypto), bootstrap_windows (ansible.windows + community.windows for win_firewall_rule), roles using Homebrew (community.general), bootstrap local authorized_key (ansible.posix)
---
collections:
  - name: ansible.posix
  - name: ansible.windows
  - name: community.crypto
  - name: community.general
  - name: community.windows
