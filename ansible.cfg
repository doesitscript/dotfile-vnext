# Ansible Configuration
# Conservative defaults for FuzLang Infrastructure
# This config is used when present in repo root (set by bin/fz)

[defaults]
# Inventory is passed explicitly via -i flag, not set here
# inventory = inventory/inventory.yaml

# Enable YAML inventory plugin to avoid "declined parsing" warnings
enable_plugins = yaml, ini, auto

# Vault password: script reads .vault_pass (avoids WSL exec-format error when .vault_pass is executable on Windows mount).
# Create .vault_pass in repo root if missing; see config/README_vault_pass.md.
vault_password_file = vault_pass.sh

# Disable retry files (cleaner workspace)
retry_files_enabled = false

# Standardized controller output and callback behavior.
# community.general.yaml callback was removed; use builtin default with YAML result format.
stdout_callback = default
bin_ansible_callbacks = true
result_format = yaml
# Log under repo logs/ (no write to ~/logs required).
# log_path = ~/logs/ansible.log
log_path = logs/ansible.log

# Disable host key checking (LAN-only posture)
# WARNING: This is safe only for trusted LAN environments
# Do not use this setting for internet-facing hosts
host_key_checking = false

# Connection timeout (seconds)
timeout = 60

# Forks (parallel execution)
forks = 10

# Display skipped tasks
display_skipped_hosts = false

# Display ok tasks
display_ok_hosts = true

# Show task timing
show_custom_stats = true

# Use persistent connections where possible
pipelining = true

# Suppress deprecation warnings (internal Ansible module warnings, not our code)
deprecation_warnings = False

# SSH settings
[ssh_connection]
# Use ControlPersist for faster connections
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
# SSH timeout
timeout = 30
# Pipelining for SSH (faster execution)
pipelining = true

# WinRM settings
[winrm]
# Connection timeout (increased to handle slow connections)
connection_timeout = 60
# Read timeout (increased to handle slow responses)
read_timeout = 60
# Operation timeout (increased to handle long operations)
operation_timeout = 60
# Pipelining for WinRM - DISABLED to fix "worker dead state" error
# Direct pywinrm test works, but Ansible connection pooling has issues
pipelining = TRUE
# Use NTLM authentication (default; can be overridden in host_vars)
# transport = ntlm
# ansible_winrm_transport: basic|certificate|kerberos|ntlm|credssp
ansible_winrm_transport: NTLM
# transport = Basic
# Ignore certificate validation (LAN-only)
server_cert_validation = ignore
# Connection retries (helps with transient connection issues)
connection_retry_count = 3

# Privilege escalation
[privilege_escalation]
# Do not use become by default (explicit in playbooks)
become = false

# Colors
[colors]
# Use colors for output
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow

