---
# bootstrap/local/bootstrap.yml
# Canonical local bootstrap, runs inside WSL on each node.

- name: Local bootstrap (WSL side, generic per node)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Use the repo venv Python for this local run (no discovery). SSH/WinRM runs later use
    # interpreters installed by Ansible on remote hosts or set in inventory.
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python3"
    # Override with -e bootstrap_node=<node-slug> when needed.
    # Use ansible_facts to avoid INJECT_FACTS_AS_VARS deprecation (ansible-core 2.24+).
    physical_node: "{{ bootstrap_node | default(ansible_facts['hostname'] | lower) }}"
    facts_path_windows: "{{ playbook_dir }}/../../facts/{{ physical_node }}.json"
    host_vars_dir: "{{ playbook_dir }}/../../inventory/host_vars"
    windows_hostvars_path: "{{ host_vars_dir }}/{{ physical_node }}-win.yaml"
    wsl_hostvars_path: "{{ host_vars_dir }}/{{ physical_node }}-wsl.yaml"
    wsl_ssh_port: 22
    mac_public_key_path: "{{ playbook_dir }}/files/mac_dev_id_ed25519.pub"
    # Project vault for controller SSH key (generated by bootstrap if missing; other setups load from here).
    controller_ssh_vault_path: "{{ playbook_dir }}/../../vault/controller_ssh.vault.yml"
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Ensure host_vars directory exists
      ansible.builtin.file:
        path: "{{ host_vars_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Windows facts file exists for this node
      ansible.builtin.stat:
        path: "{{ facts_path_windows }}"
      register: windows_facts_file

    - name: Stop when Windows facts file is missing
      ansible.builtin.fail:
        msg: >-
          Missing facts file {{ facts_path_windows }}.
          Run one of these to create it:
          From Windows (Admin): .\bin\bootstrap-local.ps1 -FactsOnly
          From WSL (then elevate PowerShell for full collect): ./bin/fz collect-facts
          Or pass -e bootstrap_node=<node-slug> if facts exist under a different node name.
      when: not windows_facts_file.stat.exists

    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
      become: true

    - name: Enable and start SSH
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true
      become: true

    - name: Allow passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_facts['user_id'] }}"
        content: |
          {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD:ALL
        mode: "0440"
      become: true

    - name: Ensure sshd allows pubkey authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
      become: true

    - name: Restart ssh service
      ansible.builtin.service:
        name: ssh
        state: restarted
      become: true

    # Controller SSH key: use project vault (generated here if missing), then fallback file/shared vault.
    - name: Check whether project controller SSH vault exists
      ansible.builtin.stat:
        path: "{{ controller_ssh_vault_path }}"
      register: controller_ssh_vault_stat

    - name: Load controller SSH key from project vault when present
      ansible.builtin.include_vars:
        file: "{{ controller_ssh_vault_path }}"
      ignore_errors: true
      when: controller_ssh_vault_stat.stat.exists

    - name: Set controller SSH public key from project vault
      ansible.builtin.set_fact:
        controller_ssh_public_key: "{{ vault_controller_ssh_public_key | default('') | trim }}"
      when: controller_ssh_vault_stat.stat.exists and (vault_controller_ssh_public_key | default('') | trim | length > 0)

    - name: Generate controller SSH key pair when project vault missing
      ansible.builtin.shell: |
        umask 077
        KEY="/tmp/controller_ssh_ansible_$$"
        ssh-keygen -t ed25519 -f "$KEY" -N "" -C "controller@dotfile-vnext" 2>/dev/null
        echo "$KEY"
      when: not controller_ssh_vault_stat.stat.exists
      register: controller_ssh_generate
      changed_when: true

    - name: Set generated key path (last line of output; ssh-keygen may print banner to stdout)
      ansible.builtin.set_fact:
        controller_ssh_key_path: "{{ (controller_ssh_generate.stdout_lines | default([]) | last) | trim }}"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_generate.stdout_lines | default([]) | length > 0)

    - name: Read generated controller private key
      ansible.builtin.slurp:
        src: "{{ controller_ssh_key_path }}"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_key_path | default('') | length > 0)
      register: controller_ssh_private_slurp

    - name: Read generated controller public key
      ansible.builtin.slurp:
        src: "{{ controller_ssh_key_path }}.pub"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_key_path | default('') | length > 0)
      register: controller_ssh_public_slurp

    - name: Set generated controller key content for vault
      ansible.builtin.set_fact:
        controller_ssh_private_key_content: "{{ (controller_ssh_private_slurp.content | b64decode) }}"
        controller_ssh_public_key_content: "{{ (controller_ssh_public_slurp.content | b64decode) | trim }}"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_key_path | default('') | length > 0)

    - name: Ensure vault directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}/vault"
        state: directory
        mode: "0755"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_key_path | default('') | length > 0)

    - name: Write plain controller SSH vault for encryption
      ansible.builtin.template:
        src: controller_ssh_vault.yml.j2
        dest: "{{ repo_root }}/vault/controller_ssh.plain.yml"
        mode: "0600"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_generate.stdout | default('') | length > 0)

    - name: Encrypt controller SSH vault and remove plain file
      ansible.builtin.shell: |
        cd "{{ repo_root }}"
        .venv/bin/ansible-vault encrypt vault/controller_ssh.plain.yml --output=vault/controller_ssh.vault.yml --vault-password-file=vault_pass.sh
        rm -f vault/controller_ssh.plain.yml
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_generate.stdout | default('') | length > 0)

    - name: Set controller SSH public key from generated key
      ansible.builtin.set_fact:
        controller_ssh_public_key: "{{ controller_ssh_public_key_content | trim }}"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_generate.stdout | default('') | length > 0)

    - name: Remove temporary generated key files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ controller_ssh_generate.stdout }}"
        - "{{ controller_ssh_generate.stdout }}.pub"
      when: not controller_ssh_vault_stat.stat.exists and (controller_ssh_generate.stdout | default('') | length > 0)

    # Fallback: file or shared vault when project controller vault not used
    - name: Check whether mac-dev public key file exists
      ansible.builtin.stat:
        path: "{{ mac_public_key_path }}"
      register: mac_public_key_file
      when: controller_ssh_public_key is not defined or controller_ssh_public_key | length == 0

    - name: Set controller SSH public key from file when present
      ansible.builtin.set_fact:
        controller_ssh_public_key: "{{ lookup('file', mac_public_key_path) }}"
      when: (controller_ssh_public_key is not defined or controller_ssh_public_key | length == 0) and mac_public_key_file is defined and mac_public_key_file.stat.exists

    - name: Load shared vault for controller key when file missing
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vault/shared.vault.yml"
      ignore_errors: true
      when: controller_ssh_public_key is not defined or controller_ssh_public_key | length == 0

    - name: Set controller SSH public key from shared vault when available
      ansible.builtin.set_fact:
        controller_ssh_public_key: "{{ vault_controller_ssh_public_key | default('') | trim }}"
      when: controller_ssh_public_key is not defined or controller_ssh_public_key | length == 0

    - name: Ensure ~/.ssh directory exists for bootstrap user
      ansible.builtin.file:
        path: "/home/{{ ansible_facts['user_id'] }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
      become: true

    - name: Install controller public key for bootstrap user
      ansible.posix.authorized_key:
        user: "{{ ansible_facts['user_id'] }}"
        key: "{{ controller_ssh_public_key }}"
        state: present
      become: true
      when: controller_ssh_public_key is defined and controller_ssh_public_key | length > 0

    - name: Report missing controller SSH public key
      ansible.builtin.debug:
        msg: >-
          No controller SSH public key. To fix:
          (1) Remove vault/controller_ssh.vault.yml and re-run bootstrap so it generates a new key and vault file; or
          (2) Add vault_controller_ssh_public_key to vault/shared.vault.yml; or
          (3) Add the public key file at {{ mac_public_key_path }}.
          Then re-run: ./bin/fz bootstrap --limit server-225-win
      when: controller_ssh_public_key is not defined or controller_ssh_public_key | length == 0

    - name: Read Windows facts JSON
      ansible.builtin.slurp:
        src: "{{ facts_path_windows }}"
      register: winfacts_raw

    - name: Parse Windows facts
      ansible.builtin.set_fact:
        winfacts: "{{ (winfacts_raw.content | b64decode) | from_json }}"

    - name: Choose host IP from Windows facts
      ansible.builtin.set_fact:
        host_ip: "{{ winfacts.windows.host_ip }}"

    - name: Read existing Windows host_vars to preserve credentials
      ansible.builtin.slurp:
        src: "{{ windows_hostvars_path }}"
      register: existing_win_hostvars_raw
      ignore_errors: true

    - name: Parse existing Windows host_vars
      ansible.builtin.set_fact:
        existing_win_hostvars: "{{ (existing_win_hostvars_raw.content | default('') | b64decode | default('') | regex_replace('\\x00', '')) | from_yaml }}"
      when: existing_win_hostvars_raw is defined and existing_win_hostvars_raw.content is defined

    - name: Set win_user for templating
      ansible.builtin.set_fact:
        win_user: "{{ existing_win_hostvars.win_user | default('josh') }}"
      when: existing_win_hostvars is defined

    - name: Set default win_user when existing file missing
      ansible.builtin.set_fact:
        win_user: "josh"
      when: win_user is not defined

    - name: Set win_password for templating
      ansible.builtin.set_fact:
        win_password: "{{ existing_win_hostvars.win_password | default('') }}"
      when: existing_win_hostvars is defined

    - name: Set default win_password when existing file missing
      ansible.builtin.set_fact:
        win_password: ""
      when: win_password is not defined

    - name: Choose WSL user
      ansible.builtin.set_fact:
        wsl_user: "{{ ansible_facts['user_id'] }}"

    - name: Choose WSL distro name
      ansible.builtin.shell: |
        (wsl.exe -l -q 2>/dev/null || true) | head -n 1 | tr -d '\r'
      register: distro_name
      changed_when: false

    - name: Read existing WSL host_vars to preserve credentials
      ansible.builtin.slurp:
        src: "{{ wsl_hostvars_path }}"
      register: existing_wsl_hostvars_raw
      ignore_errors: true

    - name: Parse existing WSL host_vars
      ansible.builtin.set_fact:
        existing_wsl_hostvars: "{{ (existing_wsl_hostvars_raw.content | default('') | b64decode | default('') | regex_replace('\\x00', '')) | from_yaml }}"
      when: existing_wsl_hostvars_raw is defined and existing_wsl_hostvars_raw.content is defined

    - name: Set wsl_password for templating
      ansible.builtin.set_fact:
        wsl_password: "{{ existing_wsl_hostvars.wsl_password }}"
      when: existing_wsl_hostvars is defined and (existing_wsl_hostvars.wsl_password | default('')) | length > 0

    - name: Write host_vars for Windows surface
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/host_vars_windows.yml.j2"
        dest: "{{ windows_hostvars_path }}"
        mode: "0644"

    - name: Write host_vars for WSL surface
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/host_vars_wsl.yml.j2"
        dest: "{{ wsl_hostvars_path }}"
        mode: "0644"
