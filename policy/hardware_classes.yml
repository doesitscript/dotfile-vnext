---
# Controlled vocabulary for inventory host_vars: hardware_classes: [...]
# Peer of inventory groups windows_nvidia_gpu_hosts / windows_amd_gpu_hosts.
# Cooling classes (liquid_cooled | air_cooled) pair with host_vars
# cooling_contract — see docs/reference/host-thermal-cooling-contracts.md.
# depends_on: none (leaf vocabulary). Consumed by execution_roles + classify_host.
# See policy/process_order.yml.
schema_version: 1
updated_at: "2026-09-22"

hardware_classes:
  liquid_cooled:
    description: >-
      Chassis heat rejection is liquid (AIO or custom loop). Radiator /
      chassis fans (often vendor-curve controlled, e.g. Corsair iCUE) are the
      primary acoustic and airflow signal. GPU onboard fan percent from
      nvidia-smi is frequently 0% or disconnected and MUST NOT be used alone
      to infer idle vs load.
    k8s:
      labels:
        homelab.hardware/cooling: liquid
    mutually_exclusive_with:
      - air_cooled

  air_cooled:
    description: >-
      Chassis heat rejection is air (heatsink + case/GPU fans). GPU fan.speed
      and case fan RPM are meaningful load/acoustic proxies when paired with
      temperature and power.
    k8s:
      labels:
        homelab.hardware/cooling: air
    mutually_exclusive_with:
      - liquid_cooled

  nvidia_gpu:
    description: NVIDIA CUDA / driver / GPU Operator path
    vendor: nvidia
    inventory_groups_example:
      - windows_nvidia_gpu_hosts
    mutually_exclusive_with:
      - amd_gpu
    k8s:
      labels:
        homelab.hardware/gpu-vendor: nvidia
      resource_hint: nvidia.com/gpu

  amd_gpu:
    description: AMD Vulkan (or ROCm when commissioned) path; never feed NVIDIA roles
    vendor: amd
    inventory_groups_example:
      - windows_amd_gpu_hosts
    mutually_exclusive_with:
      - nvidia_gpu
    k8s:
      labels:
        homelab.hardware/gpu-vendor: amd
      resource_hint: amd.com/gpu

  high_vram:
    description: Enough VRAM for primary local coding / large models
    k8s:
      labels:
        homelab.hardware/vram-tier: high

  bulk_storage:
    description: Storage-authoritative disks / NAS role
    k8s:
      labels:
        homelab.hardware/storage: bulk
