---
# Salvaged from contracts/fuzlang.contract.yaml promoted_patterns.netbox_service_metadata
# + capability selector tag vocabulary. Tag seed: roles/ipam_netbox/tasks/seed_tags.yml
schema_version: 1
updated_at: "2026-07-24"
depends_on:
  - netbox_api_reachable
  - vault_yml_decryptable

netbox_service_metadata:
  model: ipam.service
  native_fields_first: true
  custom_fields_already_seeded:
    - compose_project
    - deployed_by_role
    - stack_name
  recommended_tags:
    - companion-ui
    - openai-compatible-edge
    - authoritative-storage
    - low-tier-gpu
    - primary-ai-compute
    - desktop-amd-runtime
    - k3s-ai-plane
    - k3s-storage-plane
  service_template_concept: >-
    NetBox application service templates (name/protocol/ports) for repeatable
    instantiation; prefer tags before new custom fields.
  do_not_encode_in_object_name: runtime placement hints that belong in CF/tags
  open_webui_example:
    on_vm: hom-lab-ctl-dkr-02
    compose_project: openwebui
    deployed_by_role: open_webui
