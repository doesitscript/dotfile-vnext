#:schema https://developers.openai.com/codex/config-schema.json
sandbox_mode = "danger-full-access"
approval_policy = "never"

profile = "experimental_multi_agent"
project_doc_max_bytes = 65536
project_doc_fallback_filenames = [".agents.md", ".cursorrules"]

developer_instructions = """
In this repo, AGENTS.md is the primary project instruction source and this
project-scoped config is the secondary runtime layer.

Do not assume `.cursorrules` or `.cursor/rules/*.mdc` were auto-injected at
startup. Treat them as repo guidance to load when AGENTS.md or the task calls
for them.

For Codex/OpenAI/MCP/subagent questions in this repo, prefer official OpenAI
docs. Use the `openaiDeveloperDocs` MCP server only when it is enabled and
healthy; otherwise use official OpenAI docs fallback paths.
"""

[shell_environment_policy]

[shell_environment_policy.set]
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
LC_CTYPE = "en_US.UTF-8"

[features]
multi_agent = false

[agents]
max_threads = 6
max_depth = 1

[agents.default]
description = "Main repo collaboration role. Own planning/stewardship in the primary thread, preserve the user's target, and bootstrap the repo framework before work."
config_file = "agents/default.toml"

[agents.explorer]
description = "Read-heavy research and evidence role. Use for repo inspection, official docs, logs, diagnostics, and concise evidence summaries."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Bounded execution role. Use for focused implementation, verification, and follow-through on a clearly scoped slice of work."
config_file = "agents/worker.toml"

[profiles.stable_single_agent.features]
multi_agent = false

[profiles.experimental_multi_agent.features]
multi_agent = true
