---
repos:
  - repo: local
    hooks:
      - id: ansible-quality-gate
        name: ansible quality gate
        entry: ./bin/ansible-quality-gate.sh
        language: system
        pass_filenames: true
        files: >-
          (^playbooks/.*\.(yml|yaml)$)|
          (^roles/.*/(tasks|handlers|defaults|vars|meta)/.*\.(yml|yaml)$)|
          (^inventory/.*\.(yml|yaml)$)

      - id: project-skill-runtime-bridge
        name: synchronize project skills for Cursor and Codex
        entry: bin/codex-env python skills/implementation/project-skill-runtime-bridge/scripts/link_project_skills_to_cursor.py
        language: system
        pass_filenames: false
        files: ^skills/
