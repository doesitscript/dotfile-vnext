---
# windows_pnp_driver_install — stage a pnputil driver package and install on a Windows host.

windows_pnp_driver_install_state: absent

# official_vendor_zip (preferred) or host_export (fallback only).
windows_pnp_driver_install_source_mode: official_vendor_zip

# Official TP-Link Archer TX3000E V4.60 MediaTek package (Win10/Win11 only per vendor).
windows_pnp_driver_install_official_vendor_zip_url: >-
  https://static.tp-link.com/upload/driver/2024/202411/20241104/00.034_240620.zip
windows_pnp_driver_install_official_vendor_zip_filename: 00.034_240620.zip
windows_pnp_driver_install_official_vendor_inf_name: mtkwl6ex.inf
windows_pnp_driver_install_official_vendor_wifi_path_preference: Windows_11_64bit
windows_pnp_driver_install_official_vendor_inner_zip_glob: MT7922*.zip

# When true on Windows Server, duplicate desktop INF decorations. Disabled by default
# on Server 2025+ because editing the INF invalidates the catalog and pnputil rejects
# the patched package even with /force ("does not contain digital signature information").
# The signed vendor package installs without patch when build >= 16299.
windows_pnp_driver_install_patch_inf_for_windows_server: false

# Required when Server INF is patched (catalog no longer matches edited INF).
windows_pnp_driver_install_pnputil_force: "{{ windows_pnp_driver_install_patch_inf_for_windows_server | bool }}"

# host_export fallback — not recommended for Server targets.
windows_pnp_driver_install_source_host: ""
windows_pnp_driver_install_source_export_published_name: ""
windows_pnp_driver_install_source_export_root: 'D:\ai\driver-staging'

windows_pnp_driver_install_package_name: "pnp-driver-package"

windows_pnp_driver_install_target_staging_dir: >-
  {{ 'F:\\shares\\public\\driver-staging\\' ~ windows_pnp_driver_install_package_name }}

windows_pnp_driver_install_controller_cache_dir: >-
  {{ playbook_dir }}/.cache/windows_pnp_driver_install/{{ windows_pnp_driver_install_package_name }}

windows_pnp_driver_install_inf_name: "*.inf"
windows_pnp_driver_install_verify_interface_description: ""
