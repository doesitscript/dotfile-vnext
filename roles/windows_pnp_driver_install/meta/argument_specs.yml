---
argument_specs:
  main:
    short_description: Stage and install a Windows PnP driver package via pnputil.
    options:
      windows_pnp_driver_install_state:
        type: str
        choices: [present, absent]
        default: absent
      windows_pnp_driver_install_source_mode:
        type: str
        choices: [official_vendor_zip, host_export]
        default: official_vendor_zip
      windows_pnp_driver_install_patch_inf_for_windows_server:
        type: bool
        default: true
      windows_pnp_driver_install_pnputil_force:
        type: bool
        default: true
      windows_pnp_driver_install_official_vendor_zip_url:
        type: str
        default: ""
      windows_pnp_driver_install_official_vendor_inf_name:
        type: str
        default: mtkwl6ex.inf
      windows_pnp_driver_install_source_host:
        type: str
        default: ""
      windows_pnp_driver_install_controller_cache_root:
        type: str
        default: ""
        description: >-
          Controller-side cache root for downloaded and expanded vendor packages.
          Defaults to XDG_CACHE_HOME or HOME/.cache outside the repository.
      windows_pnp_driver_install_controller_cache_dir:
        type: str
        default: ""
        description: >-
          Full controller-side package cache directory. Overrides the derived
          controller cache root/package path when set.
      windows_pnp_driver_install_verify_interface_description:
        type: str
        default: ""
