---
# ============================================================
# Role: docker_engine
# Implements: compose/docker/docker-engine-resources.md (from stage-from-chat.md)
# Resources: prerequisite apt packages, /etc/apt/keyrings, Docker GPG key,
#   Docker CE apt repo, docker-ce + plugins, docker group, user in group,
#   systemd docker enabled + started. Official Docker CE; no snap.
# ============================================================
#
# Playbook: playbooks/docker_engine.yaml  (hosts: wsl_hosts)
# Run: ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml
# After run: log out of WSL and reconnect, then docker version / docker compose version
# ============================================================

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  become: true

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
  become: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes
  become: true

- name: Enable docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
  become: true

- name: Start docker service
  ansible.builtin.systemd:
    name: docker
    state: started
  become: true
