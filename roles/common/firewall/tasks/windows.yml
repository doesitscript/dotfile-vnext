---
# common/firewall — Windows firewall rules
# Manages universal base connectivity: ICMP echo (ping).
# Future universal rules (RDP admin, WinRM) add keys to firewall_rules_config.

- name: Allow ICMPv4 echo request (ping)
  community.windows.win_firewall_rule:
    name: "ICMP Allow incoming V4 echo request"
    enabled: "{{ firewall_rules_config['icmp_v4_echo'] | default(true) | bool }}"
    state: present
    profiles: domain,private,public
    action: allow
    direction: in
    protocol: icmpv4
    icmp_type_code:
      - '8:*'
  tags: [firewall, firewall_icmp]

- name: Allow ICMPv6 echo request (ping)
  community.windows.win_firewall_rule:
    name: "ICMP Allow incoming V6 echo request"
    enabled: "{{ firewall_rules_config['icmp_v6_echo'] | default(true) | bool }}"
    state: present
    profiles: domain,private,public
    action: allow
    direction: in
    protocol: icmpv6
    icmp_type_code:
      - '128:*'
  tags: [firewall, firewall_icmp]
