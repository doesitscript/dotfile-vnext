---
# common/firewall — base Windows firewall rules
# Manages universal connectivity rules for all Windows hosts.
# SSH-specific rules stay in access_identity_windows/tasks/firewall.yml.

# #region agent log H-B: capture os_family and connection before when condition
- name: Debug log - firewall main.yml entered
  ansible.builtin.shell: >-
    echo '{"sessionId":"40ad65","hypothesisId":"H-B","location":"firewall/tasks/main.yml","message":"main_entered","data":{"host":"{{ inventory_hostname }}","os_family":"{{ ansible_facts[\"os_family\"] | default(\"UNDEFINED\") }}","connection":"{{ ansible_connection | default(\"unknown\") }}"}}' >> /Users/joshc/develop/dotfile-vnext/.cursor/debug-40ad65.log
  delegate_to: localhost
  tags: [firewall, firewall_icmp]
# #endregion

- name: Apply base Windows firewall rules
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['os_family'] == "Windows"
  tags: [firewall]
