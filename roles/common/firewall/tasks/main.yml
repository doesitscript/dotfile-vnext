---
# common/firewall — base Windows firewall rules
# Manages universal connectivity rules for all Windows hosts.
# SSH-specific rules stay in access_identity_windows/tasks/firewall.yml.

- name: Apply base Windows firewall rules
  ansible.builtin.import_tasks: windows.yml
  when: (ansible_os_family | default(ansible_facts['os_family'] | default(''))) == "Windows"
  tags: [firewall]
