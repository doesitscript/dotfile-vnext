---
# Common Secrets Rendering Role
# Renders .env files from vault + templates
# Does not print secret values

- name: Load shared vault
  include_vars:
    file: "{{ playbook_dir }}/../vault/shared.vault.yml"
    name: vault_shared
  when: vault_shared is not defined

- name: Load network vault
  include_vars:
    file: "{{ playbook_dir }}/../vault/network.vault.yml"
    name: vault_network
  when: 
    - vault_network is not defined
    - inventory_hostname in groups['network_node'] or 'network' in inventory_hostname

- name: Load main vault
  include_vars:
    file: "{{ playbook_dir }}/../vault/main.vault.yml"
    name: vault_main
  when: 
    - vault_main is not defined
    - inventory_hostname in groups['main_server'] or 'server-225' in inventory_hostname

- name: Load dev vault
  include_vars:
    file: "{{ playbook_dir }}/../vault/dev.vault.yml"
    name: vault_dev
  when: 
    - vault_dev is not defined
    - inventory_hostname in groups['dev_gpu'] or 'dev-3090' in inventory_hostname

