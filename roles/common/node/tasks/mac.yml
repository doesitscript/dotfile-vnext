---
# macOS-specific tasks for node

- name: Install nvm {{ nvm_version }} from upstream script
  ansible.builtin.shell: >-
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | PROFILE=/dev/null bash
  args:
    creates: "{{ dotfiles_user_home }}/.nvm/nvm.sh"
    executable: /bin/bash

- name: Install default Node.js version via nvm
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install {{ node_default_version }}
    nvm alias default {{ node_default_version }}
  args:
    creates: "{{ dotfiles_user_home }}/.nvm/alias/default"
    executable: /bin/bash

- name: Install global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    npm install -g {{ item }}
  loop: "{{ npm_global_packages }}"
  args:
    executable: /bin/bash
  register: _npm_global
  changed_when: "'added' in _npm_global.stdout or 'updated' in _npm_global.stdout"

# Resolve the nvm alias to the real installed binary path and expose it as a
# play-scoped fact. Downstream roles use {{ node_npm_executable }} — they must
# never construct nvm paths themselves. See 101-ansible--canonical-coding.md §npm.
- name: Resolve nvm default alias to actual installed node path
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm which {{ node_default_version }}
  register: _node_which
  changed_when: false
  args:
    executable: /bin/bash

- name: Set node_npm_executable fact for downstream roles
  ansible.builtin.set_fact:
    node_npm_executable: "{{ _node_which.stdout | trim | dirname }}/npm"
