---
common_bash_completion_state: present
common_bash_completion_formula: auto
common_bash_completion_formula_legacy: bash-completion
common_bash_completion_formula_modern: bash-completion@2
common_bash_completion_loader_path: "{{ ansible_env.HOME }}/.bashrc.d/bash_completion.bash"
common_bash_completion_managed_files:
  - gonzo
  - dstl8
  - kubectl
  - kubectx
  - kubens
  - k9s
  - stern
  - helm
  - kustomize
  - k8sgpt
common_bash_completion_verify: true
