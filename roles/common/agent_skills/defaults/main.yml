---
agent_skills_state: present
agent_skills_manage: "{{ ansible_facts['system'] == 'Darwin' }}"

agent_skills_links:
  - name: Cursor managed global skills
    src: "{{ dotfiles_home }}/roles/common/agent_skills/files/cursor/skills-cursor"
    dest: "{{ dotfiles_user_home }}/.cursor/skills-cursor"
  - name: Cursor personal global skills
    src: "{{ dotfiles_home }}/roles/common/agent_skills/files/cursor/skills"
    dest: "{{ dotfiles_user_home }}/.cursor/skills"
  - name: Codex Gemini model chooser skill
    src: "{{ dotfiles_home }}/roles/common/agent_skills/files/codex/skills/gemini-free-tier-model-chooser"
    dest: "{{ dotfiles_user_home }}/.codex/skills/gemini-free-tier-model-chooser"
