---
# macOS-specific tasks for tmux

ame: Install tmux with homebrew
  homebrew: name=tmux state=present

- name: Install reattach-to-user-namespace
  homebrew: name=reattach-to-user-namespace state=present

- name: Install urlview for tmux-urlview
  homebrew: name=urlview state=present


