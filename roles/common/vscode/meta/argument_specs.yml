---
argument_specs:
  main:
    short_description: Install Visual Studio Code and extensions on macOS and Windows.
    description: >
      Installs VS Code via Homebrew cask (macOS) or Chocolatey (Windows).
      Installs extensions via code --install-extension. Supports Mac and Windows only.
    options:
      vscode_extensions:
        type: list
        elements: str
        required: false
        description: >
          List of VS Code extension IDs to install via code --install-extension.
          Default includes GitHub.vscode-pull-request-github, Continue.continue,
          and saoudrizwan.claude-dev (Cline).
