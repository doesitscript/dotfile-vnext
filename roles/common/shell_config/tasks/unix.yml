---
# Unix-like systems (macOS, Linux)

- name: Ensure managed login shell path is configured when login-shell management is enabled
  ansible.builtin.assert:
    that:
      - shell_config_login_shell_path | length > 0
    fail_msg: "shell_config_login_shell_path must be set when shell_config_manage_login_shell=true."
  when: shell_config_manage_login_shell | bool

- name: Verify managed login shell binary exists
  ansible.builtin.stat:
    path: "{{ shell_config_login_shell_path }}"
  register: shell_config_login_shell_binary_stat
  when: shell_config_manage_login_shell | bool

- name: Assert managed login shell binary exists
  ansible.builtin.assert:
    that:
      - shell_config_login_shell_binary_stat.stat.exists | default(false)
      - shell_config_login_shell_binary_stat.stat.executable | default(false)
    fail_msg: "Managed login shell binary {{ shell_config_login_shell_path }} is missing or not executable."
  when: shell_config_manage_login_shell | bool

- name: Ensure managed login shell is listed in /etc/shells on macOS
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ shell_config_login_shell_path }}"
    state: present
  become: true
  when:
    - shell_config_manage_login_shell | bool
    - ansible_facts['system'] == 'Darwin'

- name: Set managed login shell for current user on macOS
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: "{{ shell_config_login_shell_path }}"
  become: true
  when:
    - shell_config_manage_login_shell | bool
    - ansible_facts['system'] == 'Darwin'

- name: Ensure ~/.bashrc.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.bashrc.d"
    state: directory
    mode: "0755"

- name: Ensure .bash_profile sources .bashrc (login shells)
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bash_profile"
    marker: "# {mark} ANSIBLE MANAGED - DO NOT EDIT BETWEEN MARKERS"
    block: |
      # Run .bashrc so login shells get .bashrc.d (direnv, aliases, path)
      if [ -f ~/.bashrc ]; then
        source ~/.bashrc
      fi
    create: true
    mode: "0644"

- name: Ensure .bashrc sources .bashrc.d directory
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - DO NOT EDIT BETWEEN MARKERS"
    block: |
      # Source modular shell configs from .bashrc.d
      if [ -d ~/.bashrc.d ]; then
        for file in ~/.bashrc.d/*.bash; do
          [ -f "$file" ] && source "$file"
        done
      fi
    create: true
    mode: "0644"

- name: Deploy PATH configuration (cross-platform)
  ansible.builtin.template:
    src: path.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/path.bash"
    mode: "0644"

- name: Deploy common aliases
  ansible.builtin.template:
    src: aliases.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/aliases.bash"
    mode: "0644"

# Role-owned ~/.bashrc.d/*.bash files are deployed and removed by their owning
# roles (present/absent tasks). shell_config only manages the directory, sourcing
# block, path.bash, and aliases.bash. See roles/SHELL-CONFIG-PATTERN.md.
