---
# Unix-like systems (macOS, Linux, WSL)

- name: Ensure ~/.bashrc.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.bashrc.d"
    state: directory
    mode: "0755"

- name: Ensure .bash_profile sources .bashrc (login shells)
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bash_profile"
    marker: "# {mark} ANSIBLE MANAGED - DO NOT EDIT BETWEEN MARKERS"
    block: |
      # Run .bashrc so login shells get .bashrc.d (direnv, aliases, path)
      if [ -f ~/.bashrc ]; then
        source ~/.bashrc
      fi
    create: true

- name: Ensure .bashrc sources .bashrc.d directory
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - DO NOT EDIT BETWEEN MARKERS"
    block: |
      # Source modular shell configs from .bashrc.d
      if [ -d ~/.bashrc.d ]; then
        for file in ~/.bashrc.d/*.bash; do
          [ -f "$file" ] && source "$file"
        done
      fi
    create: true

- name: Deploy PATH configuration (cross-platform)
  ansible.builtin.template:
    src: path.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/path.bash"
    mode: "0644"

- name: Deploy WSL PATH reordering
  ansible.builtin.template:
    src: wsl_path.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/wsl_path.bash"
    mode: "0644"
  when: ansible_facts['kernel'] is defined and 'microsoft' in (ansible_facts['kernel'] | lower)

- name: Deploy common aliases
  ansible.builtin.template:
    src: aliases.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/aliases.bash"
    mode: "0644"
