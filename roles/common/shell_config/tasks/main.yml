---
# Shell Configuration Role
# Sets up .bashrc.d pattern for modular shell configuration

- name: Process shell_config role for Unix-like systems
  ansible.builtin.import_tasks: unix.yml
  when: ansible_facts['system'] != "Windows"

- name: Process shell_config role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"
