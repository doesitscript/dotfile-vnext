---
# Windows systems (PowerShell profile management would go here if needed)
# For now, shell_config is Unix-only

- name: Shell config not applicable to Windows
  ansible.builtin.debug:
    msg: "Shell configuration role skipped on Windows (PowerShell profile management not implemented)"

- name: Deploy user PowerShell profile
  ansible.windows.win_copy:
    dest: "{{ ansible_env.USERPROFILE }}\\Documents\\WindowsPowerShell\\profile.ps1"
    content: |
      $PSDefaultParameterValues['*:Encoding'] = 'utf8'
