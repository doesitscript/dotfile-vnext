---
argument_specs:
  main:
    short_description: Install the PostgreSQL client (psql) for diagnostics and DB checks
    options:
      postgresql_client_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the PostgreSQL client tooling
      postgresql_client_mac_package:
        type: str
        default: libpq
        description: Homebrew formula that provides psql on macOS
      postgresql_client_ubuntu_packages:
        type: list
        elements: str
        default:
          - postgresql-client
        description: apt packages that provide psql on Ubuntu
