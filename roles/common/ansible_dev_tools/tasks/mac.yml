---
# macOS tasks for common/ansible_dev_tools

- name: Install ansible-dev-tools via pip (macOS)
  ansible.builtin.pip:
    name: ansible-dev-tools
    state: present
    executable: "{{ ansible_dev_tools_pip }}"
  become: false
  when: ansible_dev_tools_install | bool
  tags: [ansible-dev-tools]

- name: Install ansible-navigator via pip (macOS)
  ansible.builtin.pip:
    name: ansible-navigator
    state: present
    executable: "{{ ansible_dev_tools_pip }}"
  become: false
  when: ansible_navigator_install | bool
  tags: [ansible-navigator]

- name: Install ansible-builder via pip (macOS)
  ansible.builtin.pip:
    name: ansible-builder
    state: present
    executable: "{{ ansible_dev_tools_pip }}"
  become: false
  when: ansible_builder_install | bool
  tags: [ansible-builder]
