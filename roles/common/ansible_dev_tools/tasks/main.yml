---
# common/ansible_dev_tools — install Ansible development tooling via pip.
#
# Installs: ansible-dev-tools, ansible-navigator, ansible-builder.
# Each is individually gated by a boolean variable and tagged so you can
# skip selectively via --skip-tags or override the variable to false.
#
# Depends on: python role (declared in meta/main.yml).

- name: Dispatch ansible_dev_tools for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == "Darwin"

- name: Dispatch ansible_dev_tools for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Dispatch ansible_dev_tools for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"
