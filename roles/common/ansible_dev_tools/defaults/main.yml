---
# common/ansible_dev_tools — API contract.
#
# Each tool can be toggled independently via boolean variables.
# Set false in host_vars/group_vars to skip a specific install.
ansible_dev_tools_install: true
ansible_navigator_install: true
ansible_builder_install: true

# pip executable (override if using a virtualenv or alternate pip)
ansible_dev_tools_pip: pip3
