---
# <role_name> – main task dispatcher
# Keep the role name capability-focused; handle OS targeting here instead of
# encoding the OS into the role name.
# If multiple distinct capabilities are needed together, prefer playbook
# composition with tags over turning this role into a generic wrapper.

- name: Process <role_name> role for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == "Darwin"

- name: Process <role_name> role for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Process <role_name> role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"
