---
- name: Remove HWiNFO CSV logging scheduled task
  community.windows.win_scheduled_task:
    name: "{{ gpu_diagnostics_windows_scheduled_task_name }}"
    state: absent
  tags: [gpu_diagnostics, gpu_diagnostics_install]

- name: Set Chocolatey package list for GPU diagnostics removal
  ansible.builtin.set_fact:
    gpu_diagnostics_windows_chocolatey_packages: >-
      {{
        ([gpu_diagnostics_windows_chocolatey_package] + (gpu_diagnostics_windows_extra_chocolatey_packages | default([])))
        | reject('equalto', '')
        | unique
        | list
      }}
  tags: [gpu_diagnostics, gpu_diagnostics_install]

- name: Uninstall GPU diagnostics Chocolatey packages
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ gpu_diagnostics_windows_chocolatey_packages }}"
    state: absent
  failed_when: false
  tags: [gpu_diagnostics, gpu_diagnostics_install]

- name: Remove diagnostics log tree when purge requested
  ansible.windows.win_file:
    path: "{{ gpu_diagnostics_windows_root }}"
    state: absent
  when: gpu_diagnostics_windows_purge_logs_on_absent | bool
  tags: [gpu_diagnostics, gpu_diagnostics_install]
