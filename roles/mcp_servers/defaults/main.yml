---
# mcp_servers role defaults — image tags, server registry, and credential paths.

# Container image tags (built locally via docker compose build)
mcp_aws_image: "mcp-aws:latest"
mcp_iac_image: "mcp-iac:latest"

# AWS MCP servers bundled in mcp-aws image.
# Each entry becomes a separate mcpServers block in mcp.json.
mcp_aws_servers:
  - name: aws-core
    package: "awslabs.core_mcp_server"
    module: "awslabs.core_mcp_server"
  - name: aws-cdk
    package: "awslabs.cdk_mcp_server"
    module: "awslabs.cdk_mcp_server"
  - name: aws-ccapi
    package: "awslabs.ccapi_mcp_server"
    module: "awslabs.ccapi_mcp_server"

# IaC MCP server (mcp-sysoperator) bundled in mcp-iac image
mcp_sysoperator_repo: "https://github.com/tarnover/mcp-sysoperator.git"
mcp_sysoperator_version: "main"

# Path to env file with AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION).
# This file is NOT managed by Ansible — create it manually or via vault.
mcp_aws_credentials_env_file: "{{ ansible_env.HOME }}/.aws/mcp.env"

# Build directory on the Docker host where Dockerfiles are staged
mcp_build_dir: "/tmp/mcp-server-build"

# Docker binary path (Mac Homebrew)
mcp_docker_bin: "{{ '/usr/local/bin/docker' if ansible_facts['system'] == 'Darwin' else 'docker' }}"
