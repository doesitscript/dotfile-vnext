---
- name: Clone vscode-ansible repository (macOS)
  ansible.builtin.git:
    repo: "{{ redhat_ansible_repo }}"
    dest: "{{ redhat_ansible_install_dir }}"
    version: "{{ redhat_ansible_version }}"
    update: true

- name: Ensure Node 24 is available for MCP build (macOS)
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install 24
  args:
    executable: /bin/bash

- name: Install vscode-ansible yarn dependencies (macOS)
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm exec 24 bash -c 'corepack enable 2>/dev/null || true; yarn install'
  args:
    chdir: "{{ redhat_ansible_install_dir }}"
    creates: "{{ redhat_ansible_install_dir }}/node_modules"
    executable: /bin/bash

- name: Build Red Hat Ansible MCP package (macOS)
  ansible.builtin.shell: |
    export NVM_DIR="{{ dotfiles_user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm exec 24 bash -c 'corepack enable && yarn run build'
  args:
    chdir: "{{ redhat_ansible_install_dir }}"
    creates: "{{ redhat_ansible_entry_point }}"
    executable: /bin/bash
