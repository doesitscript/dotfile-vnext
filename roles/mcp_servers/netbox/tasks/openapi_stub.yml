---
- name: Fail fast when NetBox MCP OpenAPI target is requested
  ansible.builtin.fail:
    msg: >-
      The OpenAPI target for NetBox MCP server is not yet implemented.
      Use 'cursor' or 'codex' targets instead. To enable OpenAPI later,
      implement the OpenAPI config merge pattern in this role and update
      mcp_contract.yml to mark openapi_target as supported.
