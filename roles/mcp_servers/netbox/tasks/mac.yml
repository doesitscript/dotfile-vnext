---
- name: Clone NetBox MCP repository on macOS
  ansible.builtin.git:
    repo: "{{ netbox_mcp_repo_url }}"
    dest: "{{ netbox_mcp_install_path }}"
    version: "{{ netbox_mcp_repo_version }}"
    update: true
  register: _netbox_mcp_git_clone

- name: Create Python virtual environment for NetBox MCP on macOS
  ansible.builtin.command:
    cmd: python3 -m venv "{{ netbox_mcp_venv_dir }}"
    creates: "{{ netbox_mcp_venv_dir }}/bin/python"

- name: Upgrade pip inside NetBox MCP venv on macOS
  ansible.builtin.command:
    cmd: "{{ netbox_mcp_venv_dir }}/bin/pip install -U pip"
  register: _pip_upgrade
  changed_when: "'Successfully installed' in _pip_upgrade.stdout"

- name: Install NetBox MCP package in venv on macOS
  ansible.builtin.command:
    cmd: "{{ netbox_mcp_venv_dir }}/bin/pip install ."
    chdir: "{{ netbox_mcp_install_path }}"
  register: _pip_install
  changed_when: "'Successfully installed' in _pip_install.stdout"

- name: Report NetBox MCP installation status on macOS
  ansible.builtin.debug:
    msg: >-
      NetBox MCP server installed at {{ netbox_mcp_install_path }}.
      Version: {{ netbox_mcp_repo_version }}.
      Git clone: {{ 'updated' if _netbox_mcp_git_clone.changed else 'already present' }}.
      Dependencies: {{ 'installed' if _pip_install.changed else 'already installed' }}.
