---
# NetBox MCP Server - read-only natural language query interface to NetBox

- name: Capture requested NetBox MCP target tags
  ansible.builtin.set_fact:
    _netbox_requested_target_tags: >-
      {{
        (ansible_run_tags | default([]))
        | intersect(['mcp_target_cursor', 'mcp_target_codex', 'mcp_target_openapi'])
      }}
  tags:
    - mcp
    - netbox
    - mcp_target_cursor
    - mcp_target_codex
    - mcp_target_openapi

- name: Validate configured NetBox MCP targets
  ansible.builtin.assert:
    that:
      - (netbox_mcp_targets | difference(netbox_mcp_supported_targets)) | length == 0
    fail_msg: >-
      netbox_mcp_targets contains unsupported values:
      {{ netbox_mcp_targets | difference(netbox_mcp_supported_targets) | to_json }}
  tags:
    - mcp
    - netbox
    - mcp_target_cursor
    - mcp_target_codex
    - mcp_target_openapi

- name: Determine active NetBox MCP client targets
  ansible.builtin.set_fact:
    _netbox_target_cursor_selected: >-
      {{
        ('mcp_target_cursor' in _netbox_requested_target_tags)
        or
        (
          (_netbox_requested_target_tags | length) == 0
          and ('cursor' in netbox_mcp_targets)
        )
      }}
    _netbox_target_codex_selected: >-
      {{
        ('mcp_target_codex' in _netbox_requested_target_tags)
        or
        (
          (_netbox_requested_target_tags | length) == 0
          and ('codex' in netbox_mcp_targets)
        )
      }}
    _netbox_target_openapi_selected: >-
      {{
        ('mcp_target_openapi' in _netbox_requested_target_tags)
        or
        (
          (_netbox_requested_target_tags | length) == 0
          and ('openapi' in netbox_mcp_targets)
        )
      }}
  tags:
    - mcp
    - netbox
    - mcp_target_cursor
    - mcp_target_codex
    - mcp_target_openapi

- name: Fail fast for the NetBox OpenAPI target stub
  ansible.builtin.import_tasks: openapi_stub.yml
  when: _netbox_target_openapi_selected | bool
  tags:
    - mcp
    - netbox
    - mcp_target_openapi

- name: Ensure NetBox MCP server is present
  ansible.builtin.import_tasks: present.yml
  when:
    - (ansible_facts['system'] | default('')) not in ['Windows', 'Win32NT']
    - netbox_mcp_state == "present"
  tags:
    - mcp
    - netbox
    - mcp_target_cursor
    - mcp_target_codex
    - mcp_target_openapi

- name: Ensure NetBox MCP server is absent
  ansible.builtin.import_tasks: absent.yml
  when:
    - (ansible_facts['system'] | default('')) not in ['Windows', 'Win32NT']
    - netbox_mcp_state == "absent"
  tags:
    - mcp
    - netbox
    - mcp_target_cursor
    - mcp_target_codex
    - mcp_target_openapi
