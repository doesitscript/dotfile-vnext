---
- name: Ensure target directory exists for {{ _netbox_target_name }}
  ansible.builtin.file:
    path: "{{ _netbox_target_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Check whether mcp.json exists for {{ _netbox_target_name }}
  ansible.builtin.stat:
    path: "{{ _netbox_target_config_path }}"
  register: _netbox_target_mcp_json_stat
  when: _netbox_target_name in ['cursor', 'vscode']

- name: Create mcp.json with NetBox entry for {{ _netbox_target_name }}
  ansible.builtin.copy:
    dest: "{{ _netbox_target_config_path }}"
    mode: "0644"
    content: "{{ {'mcpServers': {(netbox_mcp_server_key): _netbox_entry}} | to_nice_json }}\n"
  vars:
    _netbox_entry:
      command: "{{ netbox_mcp_command }}"
      args: "{{ netbox_mcp_args }}"
      disabled: false
      env: "{{ netbox_mcp_env }}"
  when:
    - _netbox_target_name in ['cursor', 'vscode']
    - not _netbox_target_mcp_json_stat.stat.exists

- name: Merge NetBox entry into existing mcp.json for {{ _netbox_target_name }}
  when:
    - _netbox_target_name in ['cursor', 'vscode']
    - _netbox_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _netbox_target_name }}
      ansible.builtin.slurp:
        src: "{{ _netbox_target_config_path }}"
      register: _netbox_target_mcp_json_raw

    - name: Write merged mcp.json for {{ _netbox_target_name }}
      ansible.builtin.copy:
        dest: "{{ _netbox_target_config_path }}"
        content: "{{ _netbox_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _netbox_target_existing: "{{ _netbox_target_mcp_json_raw.content | b64decode | from_json }}"
        _netbox_entry:
          command: "{{ netbox_mcp_command }}"
          args: "{{ netbox_mcp_args }}"
          disabled: false
          env: "{{ netbox_mcp_env }}"
        _netbox_target_servers: >-
          {{
            (_netbox_target_existing.mcpServers | default({}))
            | combine({(netbox_mcp_server_key): _netbox_entry})
          }}
        _netbox_target_merged: "{{ _netbox_target_existing | combine({'mcpServers': _netbox_target_servers}) }}"

- name: Ensure NetBox entry exists in Codex config for {{ _netbox_target_name }}
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/configure_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ _netbox_target_config_path }}"
    _mcp_codex_server_key: "{{ netbox_mcp_server_key }}"
    _mcp_codex_entry: "{{ netbox_mcp_codex_entry }}"
  when: _netbox_target_name == 'codex'
