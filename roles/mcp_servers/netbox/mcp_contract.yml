server_key: netbox
runtime: other
install_method: git-clone-pip
interaction_model: launcher
supported_targets:
  - cursor
  - codex
default_targets:
  - cursor
  - codex
verify_mode: tool_listing
supports_absent: true
openapi_target: stub
codex_target: project_config_toml
upstream:
  docs: https://netboxlabs.com/docs/mcp/
  repo: https://github.com/netboxlabs/netbox-mcp-server
notes:
  - Read-only NetBox query MCP server
  - Requires live NetBox instance with read-only API token
  - Uses standard pip/venv pattern (matches ansible-mcp)
  - Pinned to v1.1.0 release tag
