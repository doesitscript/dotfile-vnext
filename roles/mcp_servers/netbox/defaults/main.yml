---
netbox_mcp_state: present
netbox_mcp_server_key: netbox
netbox_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
netbox_mcp_targets:
  - cursor
  - codex
netbox_mcp_supported_targets:
  - cursor
  - codex
netbox_mcp_cursor_config_path: "{{ netbox_mcp_project_root }}/.cursor/mcp.json"
netbox_mcp_codex_config_path: "{{ netbox_mcp_project_root }}/.codex/config.toml"
netbox_mcp_role_path: roles/mcp_servers/netbox

# Installation - git clone + pip/venv (follows ansible-mcp pattern)
netbox_mcp_repo_url: https://github.com/netboxlabs/netbox-mcp-server.git
netbox_mcp_repo_version: v1.1.0  # Pin to release tag (not "main")
netbox_mcp_install_path: "{{ dotfiles_user_home }}/.local/lib/netbox-mcp-server"
netbox_mcp_venv_dir: "{{ netbox_mcp_install_path }}/.venv"
netbox_mcp_entry_point: "{{ netbox_mcp_venv_dir }}/bin/netbox-mcp-server"

# NetBox connection (prefers ipam_netbox_api_url). Fallback must not assume
# parent inventory hosts exist — export packets (work-laptop) only have
# work-laptop in hostvars. Prefer DNS name from /etc/hosts when HVH-02 is absent.
netbox_mcp_url: >-
  {{
    ipam_netbox_api_url
    | default(
        'http://'
        ~ (
          (
            hostvars['HOM-LAB-HVH-02'].host_ip
            | default(hostvars['HOM-LAB-HVH-02'].ansible_host)
          )
          if ('HOM-LAB-HVH-02' in hostvars)
          else 'netbox.hom.lab'
        )
        ~ ':'
        ~ ((ipam_netbox_http_port | default('8000:8080')).split(':')[0])
      )
  }}
netbox_mcp_token: ""  # Set via vault_vars.vault_netbox_api_token in present.yml
netbox_mcp_verify_ssl: false

# MCP entry generation - uses installed script
netbox_mcp_command: "{{ netbox_mcp_entry_point }}"
netbox_mcp_args: []
netbox_mcp_env:
  NETBOX_URL: "{{ netbox_mcp_url }}"
  NETBOX_TOKEN: "{{ netbox_mcp_token }}"
  VERIFY_SSL: "{{ netbox_mcp_verify_ssl | string | lower }}"
  _MCP_ANSIBLE_ROLE_PATH: "{{ netbox_mcp_role_path }}"

# Codex MCP entry
netbox_mcp_codex_entry:
  command: "{{ netbox_mcp_command }}"
  args: "{{ netbox_mcp_args }}"
  env: "{{ netbox_mcp_env }}"
  required: false
