---
argument_specs:
  main:
    short_description: Install Playwright MCP and configure repo-local Cursor, Codex, or VS Code targets.
    description: >
      Installs @playwright/mcp via npm and configures local MCP clients for a
      browser-capable MCP server. Defaults to headed, persistent browser mode.
    options:
      playwright_mcp_state:
        type: str
        default: present
        choices: [present, absent]
        description: Ensure the Playwright MCP package and local config are present or absent.
      playwright_mcp_targets:
        type: list
        elements: str
        default: [cursor]
        description: Target client configs to manage.
      playwright_mcp_headless:
        type: bool
        default: false
        description: Add --headless to Playwright MCP args.
      playwright_mcp_isolated:
        type: bool
        default: false
        description: Add --isolated to Playwright MCP args.
      playwright_mcp_browser:
        type: str
        default: ""
        description: Optional browser selector such as chrome, firefox, webkit, or msedge.
      playwright_mcp_user_data_dir:
        type: str
        default: ""
        description: Optional persistent browser profile directory.
      playwright_mcp_extra_args:
        type: list
        elements: str
        default: []
        description: Additional arguments passed to playwright-mcp.
