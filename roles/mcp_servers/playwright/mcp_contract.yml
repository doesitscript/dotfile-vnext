---
server_key: playwright
runtime: node
install_method: npm
interaction_model: interactive/browser
supported_targets:
  - cursor
  - vscode
  - codex
  - openapi
default_targets:
  - cursor
  - codex
verify_mode: manual_browser_validation
supports_absent: true
openapi_target: stub
upstream:
  docs: https://playwright.dev/docs/getting-started-mcp
  repo: https://github.com/microsoft/playwright-mcp
