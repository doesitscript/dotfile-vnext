---
- name: Install Playwright MCP package via npm on macOS
  community.general.npm:
    name: "{{ playwright_mcp_package_name }}"
    global: true
    state: present
    executable: "{{ node_npm_executable }}"
  timeout: 300

- name: Check Playwright MCP binary candidates on macOS
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _playwright_bin_candidates }}"
  register: _playwright_mcp_bin_stats_mac
  vars:
    _playwright_bin_candidates: >-
      {{
        playwright_mcp_bin_candidates
        if (playwright_mcp_bin_candidates | length > 0)
        else [
          (node_npm_executable | dirname) ~ '/playwright-mcp'
        ]
      }}

- name: Set Playwright MCP command path for MCP clients on macOS
  ansible.builtin.set_fact:
    playwright_mcp_command: "{{ (_playwright_mcp_bin_stats_mac.results | selectattr('stat.exists') | map(attribute='item') | first) | default('') }}"

- name: Fail if Playwright MCP binary was not found on macOS
  ansible.builtin.fail:
    msg: >-
      Playwright MCP package installed, but no executable was found in
      playwright_mcp_bin_candidates={{ _playwright_bin_candidates | to_json }}.
  when: not (playwright_mcp_command | default(''))
  vars:
    _playwright_bin_candidates: >-
      {{
        playwright_mcp_bin_candidates
        if (playwright_mcp_bin_candidates | length > 0)
        else [
          (node_npm_executable | dirname) ~ '/playwright-mcp'
        ]
      }}
