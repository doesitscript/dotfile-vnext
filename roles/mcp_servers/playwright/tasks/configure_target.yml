---
- name: Ensure target directory exists for {{ _playwright_target_name }}
  ansible.builtin.file:
    path: "{{ _playwright_target_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Check whether mcp.json exists for {{ _playwright_target_name }}
  ansible.builtin.stat:
    path: "{{ _playwright_target_config_path }}"
  register: _playwright_target_mcp_json_stat

- name: Create mcp.json with Playwright entry for {{ _playwright_target_name }}
  ansible.builtin.copy:
    dest: "{{ _playwright_target_config_path }}"
    mode: "0644"
    content: "{{ {'mcpServers': {(playwright_mcp_server_key): _playwright_entry}} | to_nice_json }}\n"
  vars:
    _playwright_entry:
      command: "{{ playwright_mcp_command }}"
      args: "{{ playwright_mcp_args }}"
      env: "{{ playwright_mcp_env }}"
  when: not _playwright_target_mcp_json_stat.stat.exists

- name: Merge Playwright entry into existing mcp.json for {{ _playwright_target_name }}
  when: _playwright_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _playwright_target_name }}
      ansible.builtin.slurp:
        src: "{{ _playwright_target_config_path }}"
      register: _playwright_target_mcp_json_raw

    - name: Write merged mcp.json for {{ _playwright_target_name }}
      ansible.builtin.copy:
        dest: "{{ _playwright_target_config_path }}"
        content: "{{ _playwright_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _playwright_target_existing: "{{ _playwright_target_mcp_json_raw.content | b64decode | from_json }}"
        _playwright_entry:
          command: "{{ playwright_mcp_command }}"
          args: "{{ playwright_mcp_args }}"
          env: "{{ playwright_mcp_env }}"
        _playwright_target_servers: >-
          {{
            (_playwright_target_existing.mcpServers | default({}))
            | combine({(playwright_mcp_server_key): _playwright_entry})
          }}
        _playwright_target_merged: "{{ _playwright_target_existing | combine({'mcpServers': _playwright_target_servers}) }}"
