---
argument_specs:
  main:
    short_description: Install and configure the AWS Labs AWS IaC MCP server.
    options:
      aws_iac_mcp_state:
        type: str
        default: present
        choices:
          - present
          - absent
      aws_iac_mcp_package_name:
        type: str
        default: awslabs.aws-iac-mcp-server@latest
      aws_iac_mcp_targets:
        type: list
        elements: str
        default:
          - cursor
      aws_iac_mcp_command:
        type: str
        required: false
      aws_iac_mcp_aws_profile:
        type: str
        required: false
      aws_iac_mcp_aws_region:
        type: str
        required: false
      aws_iac_mcp_cursor_config_path:
        type: str
        required: false
      aws_iac_mcp_vscode_config_path:
        type: str
        required: false
      aws_iac_mcp_codex_config_path:
        type: str
        required: false
