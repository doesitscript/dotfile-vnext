---
- name: Remove AWS IaC MCP entry from Cursor mcp.json
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _aws_iac_target_name: "cursor"
    _aws_iac_target_config_path: "{{ aws_iac_mcp_cursor_config_path }}"
  when: _aws_iac_mcp_target_cursor_selected | bool

- name: Remove AWS IaC MCP entry from VS Code mcp.json
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _aws_iac_target_name: "vscode"
    _aws_iac_target_config_path: "{{ aws_iac_mcp_vscode_config_path }}"
  when: _aws_iac_mcp_target_vscode_selected | bool

- name: Remove AWS IaC MCP entry from Codex config
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/remove_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ aws_iac_mcp_codex_config_path }}"
    _mcp_codex_server_key: "{{ aws_iac_mcp_server_key }}"
  when: _aws_iac_mcp_target_codex_selected | bool
