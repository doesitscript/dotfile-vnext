---
# Merge two MCP server blocks into .cursor/mcp.json:
# 1) openaiDeveloperDocs: { "url": "..." } (streamable HTTP)
# 2) codex: { "command": "<path>" } when Codex app is installed (mac/ubuntu) and enabled
- name: Ensure .cursor directory exists in project root
  ansible.builtin.file:
    path: "{{ openai_docs_project_dir }}"
    state: directory
    mode: "0755"
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Check whether .cursor/mcp.json exists
  ansible.builtin.stat:
    path: "{{ openai_docs_project_dir }}/mcp.json"
  register: _mcp_json_stat
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Create .cursor/mcp.json with openaiDeveloperDocs and optional codex entries
  ansible.builtin.copy:
    dest: "{{ openai_docs_project_dir }}/mcp.json"
    mode: "0644"
    content: "{{ {'mcpServers': _initial_servers} | to_nice_json }}\n"
  vars:
    _openai_docs_entry:
      url: "{{ openai_docs_mcp_url }}"
    _codex_enabled: "{{ (openai_docs_codex_command | default('')) and (openai_docs_codex_enabled | default(true) | bool) }}"
    _codex_entry: "{{ {'codex': {'command': openai_docs_codex_command}} if _codex_enabled else {} }}"
    _initial_servers: "{{ {(openai_docs_server_key): _openai_docs_entry} | combine(_codex_entry) }}"
  when: not _mcp_json_stat.stat.exists
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Ensure openaiDeveloperDocs and codex entries exist in .cursor/mcp.json
  when: _mcp_json_stat.stat.exists
  block:
    - name: Read existing .cursor/mcp.json
      ansible.builtin.slurp:
        src: "{{ openai_docs_project_dir }}/mcp.json"
      register: _mcp_json_raw
      tags:
        - mcp
        - openai-docs
        - codex
        - openai
        - development
        - research

    - name: Merge openaiDeveloperDocs and codex entries into existing config
      ansible.builtin.copy:
        dest: "{{ openai_docs_project_dir }}/mcp.json"
        content: "{{ _merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _existing: "{{ _mcp_json_raw.content | b64decode | from_json }}"
        _openai_docs_entry:
          url: "{{ openai_docs_mcp_url }}"
        _codex_enabled: "{{ (openai_docs_codex_command | default('')) and (openai_docs_codex_enabled | default(true) | bool) }}"
        _codex_entry: "{{ {'codex': {'command': openai_docs_codex_command}} if _codex_enabled else {} }}"
        _servers: "{{ (_existing.mcpServers | default({})) | combine({(openai_docs_server_key): _openai_docs_entry}) | combine(_codex_entry) }}"
        _merged: "{{ _existing | combine({'mcpServers': _servers}) }}"
      tags:
        - mcp
        - openai-docs
        - codex
        - openai
        - development
        - research
