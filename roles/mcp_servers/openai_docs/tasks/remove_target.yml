---
- name: Check whether mcp.json exists for {{ _openai_docs_target_name }}
  ansible.builtin.stat:
    path: "{{ _openai_docs_target_config_path }}"
  register: _openai_docs_remove_target_mcp_json_stat

- name: Remove OpenAI Docs entry from mcp.json for {{ _openai_docs_target_name }}
  when: _openai_docs_remove_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _openai_docs_target_name }}
      ansible.builtin.slurp:
        src: "{{ _openai_docs_target_config_path }}"
      register: _openai_docs_remove_target_mcp_json_raw

    - name: Write mcp.json without the OpenAI Docs entry for {{ _openai_docs_target_name }}
      ansible.builtin.copy:
        dest: "{{ _openai_docs_target_config_path }}"
        content: "{{ _openai_docs_remove_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _openai_docs_remove_target_existing: "{{ _openai_docs_remove_target_mcp_json_raw.content | b64decode | from_json }}"
        _openai_docs_remove_target_filtered_servers: >-
          {{
            (_openai_docs_remove_target_existing.mcpServers | default({}))
            | dict2items
            | rejectattr('key', 'equalto', _openai_docs_target_server_key)
            | items2dict
          }}
        _openai_docs_remove_target_merged: >-
          {{
            _openai_docs_remove_target_existing
            | combine({'mcpServers': _openai_docs_remove_target_filtered_servers})
          }}
