---
# Ensure ~/.codex/config.toml exists with [mcp_servers.openaiDeveloperDocs] url block.
# Ref: docs/plan/homelab_smarter_agents_who_read_the_docs.md
- name: Ensure .codex directory exists in user home
  ansible.builtin.file:
    path: "{{ openai_docs_codex_config_dir }}"
    state: directory
    mode: "0755"
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Check whether ~/.codex/config.toml exists
  ansible.builtin.stat:
    path: "{{ openai_docs_codex_config_dir }}/config.toml"
  register: _codex_config_stat
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Create ~/.codex/config.toml with openaiDeveloperDocs block
  ansible.builtin.copy:
    dest: "{{ openai_docs_codex_config_dir }}/config.toml"
    content: |
      [mcp_servers.openaiDeveloperDocs]
      url = "https://developers.openai.com/mcp"
    mode: "0644"
  when: not _codex_config_stat.stat.exists
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Ensure openaiDeveloperDocs block in existing ~/.codex/config.toml
  when: _codex_config_stat.stat.exists
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research
  block:
    - name: Read ~/.codex/config.toml
      ansible.builtin.slurp:
        src: "{{ openai_docs_codex_config_dir }}/config.toml"
      register: _codex_config_raw
      tags:
        - mcp
        - openai-docs
        - codex
        - openai
        - development
        - research

    - name: Append openaiDeveloperDocs block if missing
      ansible.builtin.blockinfile:
        path: "{{ openai_docs_codex_config_dir }}/config.toml"
        block: |
          [mcp_servers.openaiDeveloperDocs]
          url = "https://developers.openai.com/mcp"
        marker: "# {mark} ANSIBLE MANAGED BLOCK openaiDeveloperDocs"
        create: false
      when: "'[mcp_servers.openaiDeveloperDocs]' not in (_codex_config_raw.content | b64decode)"
      tags:
        - mcp
        - openai-docs
        - codex
        - openai
        - development
        - research
