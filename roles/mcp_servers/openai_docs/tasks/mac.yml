---
# Install Codex app via nvm-managed npm (macOS). Includes the Codex MCP server.
# Upgrade: npm i -g @openai/codex@latest
# Requires: roles/common/node must run first — provides node_npm_executable.
- name: Install Codex app via npm (macOS)
  community.general.npm:
    name: "{{ openai_docs_codex_package_name }}"
    global: true
    state: "{{ openai_docs_codex_package_state | default('present') }}"
    executable: "{{ node_npm_executable }}"
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"
  timeout: 300
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Set Codex command path for mcp.json (macOS)
  ansible.builtin.set_fact:
    openai_docs_codex_command: "{{ node_npm_executable | dirname }}/codex"
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Remove quarantine attribute from Codex npm module (macOS Gatekeeper)
  ansible.builtin.command:
    argv:
      - xattr
      - -dr
      - com.apple.quarantine
      - "{{ node_npm_executable | dirname | dirname }}/lib/node_modules/@openai/codex"
  register: openai_docs_codex_quarantine_remove
  changed_when: openai_docs_codex_quarantine_remove.rc == 0
  failed_when: false
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research
