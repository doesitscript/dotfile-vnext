---
# Install Codex app (Homebrew). Includes the Codex MCP server.
# Binary path is resolved via 'brew --prefix codex' — the authoritative Homebrew path source.
- name: Install Codex app via Homebrew (macOS)
  community.general.homebrew:
    name: codex
    state: present
  timeout: 120
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Get Codex install prefix from Homebrew (macOS)
  ansible.builtin.command: brew --prefix codex
  register: _codex_brew_prefix
  changed_when: false
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research

- name: Set Codex command path for mcp.json (macOS)
  ansible.builtin.set_fact:
    openai_docs_codex_command: "{{ _codex_brew_prefix.stdout | trim }}/bin/codex"
  tags:
    - mcp
    - openai-docs
    - codex
    - openai
    - development
    - research
