---
# OpenAI Docs MCP — streamable HTTP, no local install.
# Ref: https://developers.openai.com/resources/docs-mcp
openai_docs_mcp_url: "https://developers.openai.com/mcp"

# Cursor project directory for .cursor/mcp.json
openai_docs_project_dir: "{{ dotfiles_home }}/.cursor"

# Server key in mcp.json (Cursor / Codex)
openai_docs_server_key: "openaiDeveloperDocs"

# Codex app (includes Codex MCP server). Set by mac.yml/ubuntu.yml after install.
openai_docs_codex_command: ""

# Set to false to omit the codex MCP server block from mcp.json.
openai_docs_codex_enabled: true

# Codex app config directory (for ~/.codex/config.toml)
openai_docs_codex_config_dir: "{{ dotfiles_user_home | default(ansible_user_dir) }}/.codex"

# Codex binary path is derived at runtime: {{ node_npm_executable | dirname }}/codex
# Set by mac.yml and ubuntu.yml after npm install. Requires roles/common/node.
