---
openai_docs_mcp_state: present
openai_docs_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
openai_docs_mcp_targets:
  - cursor
  - codex
openai_docs_mcp_supported_targets:
  - cursor
  - codex
  - openapi
openai_docs_mcp_cursor_config_path: "{{ openai_docs_mcp_project_root }}/.cursor/mcp.json"
openai_docs_mcp_codex_config_path: "{{ openai_docs_mcp_project_root }}/.codex/config.toml"
openai_docs_mcp_role_path: "roles/mcp_servers/openai_docs"

openai_docs_server_key: "openaiDeveloperDocs"
openai_docs_codex_server_key: "codex"
openai_docs_mcp_url: "https://developers.openai.com/mcp"
openai_docs_codex_package_base_name: "@openai/codex"
openai_docs_codex_version: "{{ codex_tooling_version_contract.cli | default('') }}"
openai_docs_codex_package_name: >-
  {{
    openai_docs_codex_package_base_name
    if (openai_docs_codex_package_state | default('present')) == 'absent'
    else (
      openai_docs_codex_package_base_name
      ~ (
        '@' ~ openai_docs_codex_version
        if (openai_docs_codex_version | default('') | length) > 0
        else ''
      )
    )
  }}

# Local Codex runtime binary. Set by mac.yml/ubuntu.yml after install.
openai_docs_codex_command: ""
openai_docs_codex_enabled: true

# Structured Codex config entries for the project .codex/config.toml target.
openai_docs_docs_codex_entry:
  url: "{{ openai_docs_mcp_url }}"
  enabled: false
  required: false
openai_docs_codex_entry:
  enabled: false
  required: false
