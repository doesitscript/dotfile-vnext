---
argument_specs:
  main:
    short_description: Install OpenAI Docs MCP support and manage Cursor/Codex project targets.
    description: >
      Installs the local Codex runtime on macOS and Ubuntu, manages the
      openaiDeveloperDocs and codex entries in repo-local Cursor config, and
      manages per-server blocks in project .codex/config.toml through the shared
      Codex target helper pattern.
    options:
      openai_docs_mcp_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Ensure the openai_docs MCP capability is present or absent.

      openai_docs_mcp_project_root:
        type: str
        required: false
        description: Repo root used to derive the default config target paths.

      openai_docs_mcp_targets:
        type: list
        elements: str
        default:
          - cursor
          - codex
        description: >
          Target configs to manage. Supported values are cursor, codex, and
          openapi. openapi is a stub in this pass and fails fast if selected.

      openai_docs_mcp_supported_targets:
        type: list
        elements: str
        default:
          - cursor
          - codex
          - openapi
        description: Supported target names for validation and guardrails.

      openai_docs_mcp_cursor_config_path:
        type: str
        required: false
        description: Path to the Cursor mcp.json file.

      openai_docs_mcp_codex_config_path:
        type: str
        required: false
        description: Path to the project Codex config.toml file.

      openai_docs_server_key:
        type: str
        default: "openaiDeveloperDocs"
        description: Server key used for the OpenAI docs MCP entry.

      openai_docs_codex_server_key:
        type: str
        default: "codex"
        description: Server key used for the local Codex MCP entry.

      openai_docs_mcp_url:
        type: str
        default: "https://developers.openai.com/mcp"
        description: Streamable HTTP MCP endpoint for OpenAI developer docs.

      openai_docs_codex_package_base_name:
        type: str
        default: "@openai/codex"
        description: Base npm package name for the local Codex runtime.

      openai_docs_codex_version:
        type: str
        required: false
        description: >
          Optional pinned npm version for the local Codex runtime installed by
          this role.

      openai_docs_codex_package_name:
        type: str
        required: false
        description: >
          Fully resolved npm package spec used for install/remove operations.
          Defaults to @openai/codex or @openai/codex@version depending on the
          configured runtime contract.

      openai_docs_codex_command:
        type: str
        default: ""
        description: Path to the local Codex binary. Set by mac.yml/ubuntu.yml after install.

      openai_docs_codex_enabled:
        type: bool
        default: true
        description: >
          Whether the local Codex MCP entry should be managed alongside the docs
          entry for supported targets.

      openai_docs_docs_codex_entry:
        type: dict
        required: false
        default:
          url: "https://developers.openai.com/mcp"
          enabled: false
          required: false
        description: Structured Codex entry for the OpenAI docs MCP server.

      openai_docs_codex_entry:
        type: dict
        required: false
        default:
          enabled: false
          required: false
        description: >
          Structured Codex entry for the local Codex MCP server. The Codex-side
          self-MCP entry is disabled by default; define overrides only when
          deliberately enabling it for a probe.

      node_default_version:
        type: str
        required: false
        default: "20"
        description: >
          Node.js version installed by nvm (roles/common/node). Keep in sync
          with the common/node defaults.

      openai_docs_codex_bin_candidates:
        type: list
        required: false
        description: >
          Ordered list of candidate paths for the Codex binary on Ubuntu. The
          first existing path is used as the MCP command.
