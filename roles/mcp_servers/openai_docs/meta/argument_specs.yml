---
argument_specs:
  main:
    short_description: Add OpenAI Docs MCP and Codex MCP to Cursor mcp.json; install Codex on Mac/Ubuntu.
    description: >
      Two MCP server blocks: (1) openaiDeveloperDocs (streamable HTTP, URL only);
      (2) codex (command from Codex app binary). Installs Codex on macOS (Homebrew)
      and Ubuntu (npm); skips Windows. Merges into .cursor/mcp.json; ensures
      ~/.codex/config.toml has openaiDeveloperDocs URL. Ref: https://developers.openai.com/resources/docs-mcp
    options:
      openai_docs_mcp_url:
        type: str
        required: false
        default: "https://developers.openai.com/mcp"
        description: >
          Streamable HTTP MCP endpoint for OpenAI developer docs.

      openai_docs_project_dir:
        type: str
        required: false
        description: >
          Directory containing mcp.json. Defaults to dotfiles_home/.cursor.

      openai_docs_server_key:
        type: str
        required: false
        default: "openaiDeveloperDocs"
        description: >
          Key under mcpServers in mcp.json (Cursor / Codex).

      openai_docs_codex_command:
        type: str
        required: false
        default: ""
        description: >
          Path to codex binary. Set by mac.yml/ubuntu.yml after install.

      openai_docs_codex_enabled:
        type: bool
        required: false
        default: true
        description: >
          If false, the codex MCP server block is omitted from mcp.json.

      openai_docs_codex_config_dir:
        type: str
        required: false
        description: >
          Directory for ~/.codex/config.toml. Defaults to dotfiles_user_home/.codex.

      node_default_version:
        type: str
        required: false
        default: "20"
        description: >
          Node.js version installed by nvm (roles/common/node). Used to resolve the
          nvm npm executable path on Ubuntu. Keep in sync with common/node defaults.

      openai_docs_codex_bin_candidates:
        type: list
        required: false
        description: >
          Ordered list of candidate paths for the Codex binary on Ubuntu.
          ansible.builtin.stat checks each; first existing path is used as the MCP command.
          Primary path is the nvm-managed node bin; system paths are fallbacks.
