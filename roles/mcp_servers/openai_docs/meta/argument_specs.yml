---
argument_specs:
  main:
    short_description: Add OpenAI Docs MCP to Cursor mcp.json (streamable HTTP, no local install).
    description: >
      Merges the OpenAI developer documentation MCP server (openaiDeveloperDocs)
      into .cursor/mcp.json. Read-only, streamable HTTP; no local install.
      Uses the same create-or-merge pattern as other mcp_servers roles.
      Ref: https://developers.openai.com/resources/docs-mcp
    options:
      openai_docs_mcp_url:
        type: str
        required: false
        default: "https://developers.openai.com/mcp"
        description: >
          Streamable HTTP MCP endpoint for OpenAI developer docs.

      openai_docs_project_dir:
        type: str
        required: false
        description: >
          Directory containing mcp.json. Defaults to dotfiles_home/.cursor.

      openai_docs_server_key:
        type: str
        required: false
        default: "openaiDeveloperDocs"
        description: >
          Key under mcpServers in mcp.json (Cursor / Codex).

