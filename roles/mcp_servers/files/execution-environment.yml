---
version: 3

images:
  base_image:
    name: docker.io/redhat/ubi9:latest

dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner

additional_build_steps:
  prepend_base: |
    RUN dnf module enable -y nodejs:20
    RUN dnf install -y nodejs npm git
    RUN dnf clean all
  append_final: |
    RUN git clone --depth 1 https://github.com/tarnover/mcp-sysoperator.git /opt/mcp-sysoperator
    RUN cd /opt/mcp-sysoperator && npm install && npm run build

options:
  tags:
    - mcp-sysoperator-ee:latest
