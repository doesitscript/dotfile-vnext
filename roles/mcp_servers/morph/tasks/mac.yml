---
- name: Resolve npm global prefix for Morph MCP on macOS
  ansible.builtin.command:
    argv:
      - "{{ node_npm_executable }}"
      - prefix
      - -g
  register: _morph_mcp_npm_prefix_mac
  changed_when: false
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"

- name: Install Morph MCP package via npm on macOS
  community.general.npm:
    name: "{{ morph_mcp_npm_spec }}"
    global: true
    state: present
    executable: "{{ node_npm_executable }}"
  timeout: 300

- name: Check Morph MCP binary candidates on macOS
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _morph_bin_candidates }}"
  register: _morph_mcp_bin_stats_mac
  vars:
    _morph_bin_candidates: >-
      {{
        morph_mcp_bin_candidates
        if (morph_mcp_bin_candidates | length > 0)
        else [
          (_morph_mcp_npm_prefix_mac.stdout | trim) ~ '/bin/morph-mcp',
          (node_npm_executable | dirname) ~ '/morph-mcp'
        ]
      }}

- name: Set Morph MCP command path for MCP clients on macOS
  ansible.builtin.set_fact:
    morph_mcp_command: "{{ (_morph_mcp_bin_stats_mac.results | selectattr('stat.exists') | map(attribute='item') | first) | default('') }}"

- name: Fail if Morph MCP binary was not found on macOS
  ansible.builtin.fail:
    msg: >-
      Morph MCP package installed, but no executable was found in
      morph_mcp_bin_candidates={{ _morph_bin_candidates | to_json }}.
  when: not (morph_mcp_command | default(''))
  vars:
    _morph_bin_candidates: >-
      {{
        morph_mcp_bin_candidates
        if (morph_mcp_bin_candidates | length > 0)
        else [
          (_morph_mcp_npm_prefix_mac.stdout | trim) ~ '/bin/morph-mcp',
          (node_npm_executable | dirname) ~ '/morph-mcp'
        ]
      }}
