---
- name: Check whether mcp.json exists for {{ _morph_target_name }}
  ansible.builtin.stat:
    path: "{{ _morph_target_config_path }}"
  register: _morph_remove_target_mcp_json_stat

- name: Remove Morph entry from mcp.json for {{ _morph_target_name }}
  when: _morph_remove_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _morph_target_name }}
      ansible.builtin.slurp:
        src: "{{ _morph_target_config_path }}"
      register: _morph_remove_target_mcp_json_raw

    - name: Write mcp.json without the Morph entry for {{ _morph_target_name }}
      ansible.builtin.copy:
        dest: "{{ _morph_target_config_path }}"
        content: "{{ _morph_remove_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _morph_remove_target_existing: "{{ _morph_remove_target_mcp_json_raw.content | b64decode | from_json }}"
        _morph_remove_target_filtered_servers: >-
          {{
            (_morph_remove_target_existing.mcpServers | default({}))
            | dict2items
            | rejectattr('key', 'equalto', morph_mcp_server_key)
            | items2dict
          }}
        _morph_remove_target_merged: >-
          {{
            _morph_remove_target_existing
            | combine({'mcpServers': _morph_remove_target_filtered_servers})
          }}
