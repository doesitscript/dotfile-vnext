---
- name: Ensure target directory exists for {{ _morph_target_name }}
  ansible.builtin.file:
    path: "{{ _morph_target_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Check whether mcp.json exists for {{ _morph_target_name }}
  ansible.builtin.stat:
    path: "{{ _morph_target_config_path }}"
  register: _morph_target_mcp_json_stat

- name: Create mcp.json with Morph entry for {{ _morph_target_name }}
  ansible.builtin.copy:
    dest: "{{ _morph_target_config_path }}"
    mode: "0644"
    content: "{{ {'mcpServers': {(morph_mcp_server_key): _morph_entry}} | to_nice_json }}\n"
  vars:
    _morph_entry: "{{ morph_mcp_client_entry }}"
  when: not _morph_target_mcp_json_stat.stat.exists

- name: Merge Morph entry into existing mcp.json for {{ _morph_target_name }}
  when: _morph_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _morph_target_name }}
      ansible.builtin.slurp:
        src: "{{ _morph_target_config_path }}"
      register: _morph_target_mcp_json_raw

    - name: Write merged mcp.json for {{ _morph_target_name }}
      ansible.builtin.copy:
        dest: "{{ _morph_target_config_path }}"
        content: "{{ _morph_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _morph_target_existing: "{{ _morph_target_mcp_json_raw.content | b64decode | from_json }}"
        _morph_entry: "{{ morph_mcp_client_entry }}"
        _morph_target_servers: >-
          {{
            (_morph_target_existing.mcpServers | default({}))
            | combine({(morph_mcp_server_key): _morph_entry})
          }}
        _morph_target_merged: "{{ _morph_target_existing | combine({'mcpServers': _morph_target_servers}) }}"
