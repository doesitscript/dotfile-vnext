---
- name: Ensure Morph routing block exists inside Codex agent developer_instructions
  ansible.builtin.blockinfile:
    path: "{{ _mcp_codex_agent_routing_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: {{ morph_mcp_routing_marker_name }}"
    insertbefore: '^"""$'
    block: "{{ _morph_mcp_routing_block_content | trim }}"
