---
server_key: huggingface
runtime: other
install_method: none
interaction_model: launcher
supported_targets:
  - cursor
  - codex
  - openapi
default_targets:
  - cursor
  - codex
verify_mode: codex_exec_tool_call
supports_absent: true
openapi_target: stub
codex_target: project_config_toml
upstream:
  docs: https://huggingface.co/docs/hub/hf-mcp-server
  endpoint: https://huggingface.co/mcp
notes:
  - Official Hugging Face Hub MCP server.
  - Provides Hub search, documentation semantic search, repository details,
    papers search, and optionally selected Spaces tools.
  - Codex may report Auth as Not logged in; public documentation search works
    anonymously, while account-scoped tools may require Hugging Face login.
