---
huggingface_mcp_state: present
huggingface_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
huggingface_mcp_targets:
  - cursor
  - codex
huggingface_mcp_supported_targets:
  - cursor
  - codex
  - openapi
huggingface_mcp_cursor_config_path: "{{ huggingface_mcp_project_root }}/.cursor/mcp.json"
huggingface_mcp_codex_config_path: "{{ huggingface_mcp_project_root }}/.codex/config.toml"
huggingface_mcp_role_path: "roles/mcp_servers/huggingface"

huggingface_mcp_server_key: "huggingface"
huggingface_mcp_url: "https://huggingface.co/mcp"
huggingface_mcp_required: false
huggingface_mcp_codex_entry:
  url: "{{ huggingface_mcp_url }}"
  required: "{{ huggingface_mcp_required }}"
