---
argument_specs:
  main:
    short_description: Configure the official Hugging Face MCP server.
    options:
      huggingface_mcp_state:
        type: str
        choices: [present, absent]
        default: present
        description: Whether the MCP server client configuration should exist.
      huggingface_mcp_targets:
        type: list
        elements: str
        default: [cursor, codex]
        description: MCP client targets to configure.
      huggingface_mcp_url:
        type: str
        default: "https://huggingface.co/mcp?login"
      huggingface_mcp_legacy_server_keys:
        type: list
        elements: str
        default:
          - huggingface
        description: Official Hugging Face MCP streamable HTTP endpoint.
      huggingface_mcp_required:
        type: bool
        default: false
        description: Whether Codex should fail startup if this MCP server is unavailable.
