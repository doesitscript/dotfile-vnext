---
# Git ref to pin (tag, branch, or sha). Pin to a release tag when available.
mcp_ansible_version: "main"

# Upstream repository
mcp_ansible_repo: "https://github.com/bsahane/mcp-ansible.git"

# Install location (XDG-aligned ~/.local/lib)
mcp_ansible_install_dir: "{{ dotfiles_user_home }}/.local/lib/ansible-mcp"

# Python virtual environment inside the clone
mcp_ansible_venv_dir: "{{ mcp_ansible_install_dir }}/.venv"

# Entry point used in the MCP client configuration
mcp_ansible_entry_point: "{{ mcp_ansible_venv_dir }}/bin/python"
mcp_ansible_server_script: "{{ mcp_ansible_install_dir }}/src/ansible_mcp/server.py"

# Cursor project directory for .cursor/mcp.json
mcp_ansible_project_dir: "{{ dotfiles_home }}/.cursor"

# Relative path from project root (for tracking/debugging)
mcp_ansible_role_path: "roles/mcp_servers/ansible-mcp"

# PATH exported to the MCP server so it can find ansible CLIs in ~/.local/bin
mcp_ansible_server_path: "{{ dotfiles_user_home }}/.local/bin:{{ dotfiles_user_home }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Environment variables passed to the MCP server at runtime
mcp_ansible_project_root: "{{ dotfiles_home }}"
mcp_ansible_inventory: "{{ dotfiles_home }}/inventory/inventory.yaml"
mcp_ansible_project_name: "dotfile-vnext"
mcp_ansible_collections_paths: "{{ dotfiles_home }}/collections"
mcp_ansible_roles_path: "{{ dotfiles_home }}/roles:{{ dotfiles_home }}/roles/galaxy:{{ dotfiles_home }}/playbooks/roles"
mcp_ansible_config: "{{ dotfiles_home }}/ansible.cfg"
mcp_ansible_runtime_env:
  PATH: "{{ mcp_ansible_server_path }}"
  MCP_ANSIBLE_PROJECT_ROOT: "{{ mcp_ansible_project_root }}"
  MCP_ANSIBLE_INVENTORY: "{{ mcp_ansible_inventory }}"
  MCP_ANSIBLE_PROJECT_NAME: "{{ mcp_ansible_project_name }}"
  MCP_ANSIBLE_COLLECTIONS_PATHS: "{{ mcp_ansible_collections_paths }}"
  MCP_ANSIBLE_ROLES_PATH: "{{ mcp_ansible_roles_path }}"
  MCP_ANSIBLE_ENV_ANSIBLE_CONFIG: "{{ mcp_ansible_config }}"
  OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "yes"
  no_proxy: "*"
  NO_PROXY: "*"
  _MCP_ANSIBLE_ROLE_PATH: "{{ mcp_ansible_role_path }}"
