---
argument_specs:
  main:
    short_description: Configure the public Langfuse Docs MCP server.
    options:
      langfuse_docs_mcp_state:
        type: str
        choices: [present, absent]
        default: present
        description: Whether the MCP server client configuration should exist.
      langfuse_docs_mcp_targets:
        type: list
        elements: str
        default: [cursor, codex]
        description: MCP client targets to configure.
      langfuse_docs_mcp_url:
        type: str
        default: "https://langfuse.com/api/mcp"
        description: Public Langfuse Docs MCP streamable HTTP endpoint.
      langfuse_docs_mcp_required:
        type: bool
        default: false
        description: Whether Codex should fail startup if this MCP server is unavailable.
