---
langfuse_docs_mcp_state: present
langfuse_docs_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
langfuse_docs_mcp_targets:
  - cursor
  - codex
langfuse_docs_mcp_supported_targets:
  - cursor
  - codex
  - openapi
langfuse_docs_mcp_cursor_config_path: "{{ langfuse_docs_mcp_project_root }}/.cursor/mcp.json"
langfuse_docs_mcp_codex_config_path: "{{ langfuse_docs_mcp_project_root }}/.codex/config.toml"
langfuse_docs_mcp_role_path: "roles/mcp_servers/langfuse_docs"

langfuse_docs_mcp_server_key: "langfuse-docs"
langfuse_docs_mcp_url: "https://langfuse.com/api/mcp"
langfuse_docs_mcp_required: false
langfuse_docs_mcp_codex_entry:
  url: "{{ langfuse_docs_mcp_url }}"
  required: "{{ langfuse_docs_mcp_required }}"
