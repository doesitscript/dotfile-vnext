---
server_key: langfuse-docs
runtime: other
install_method: none
interaction_model: launcher
supported_targets:
  - cursor
  - codex
  - openapi
default_targets:
  - cursor
  - codex
verify_mode: codex_exec_tool_call
supports_absent: true
openapi_target: stub
codex_target: project_config_toml
upstream:
  docs: https://langfuse.com/docs/docs-mcp
  endpoint: https://langfuse.com/api/mcp
notes:
  - Public unauthenticated Langfuse documentation MCP server.
  - Uses streamable HTTP and exposes documentation search/fetch tools.
