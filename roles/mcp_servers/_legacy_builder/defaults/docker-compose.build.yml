# Build-only compose file for MCP server images.
# Usage: docker compose -f docker-compose.build.yml build
services:
  mcp-aws:
    build:
      context: .
      dockerfile: Dockerfile.aws
    image: mcp-aws:latest

  mcp-iac:
    build:
      context: .
      dockerfile: Dockerfile.iac
    image: mcp-iac:latest
