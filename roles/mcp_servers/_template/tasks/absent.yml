---
- name: Uninstall template MCP server
  ansible.builtin.import_tasks: uninstall.yml

- name: Remove the template MCP entry from Cursor config
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _template_target_name: "cursor"
    _template_target_config_path: "{{ template_mcp_cursor_config_path }}"
  when: _template_mcp_target_cursor_selected | bool

- name: Remove the template MCP entry from VS Code config
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _template_target_name: "vscode"
    _template_target_config_path: "{{ template_mcp_vscode_config_path }}"
  when: _template_mcp_target_vscode_selected | bool

- name: Remove the template MCP entry from Codex config
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/remove_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ template_mcp_codex_config_path }}"
    _mcp_codex_server_key: "{{ template_mcp_server_key }}"
  when: _template_mcp_target_codex_selected | bool
