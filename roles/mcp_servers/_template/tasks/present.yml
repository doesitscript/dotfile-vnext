---
- name: Install template MCP server on macOS
  ansible.builtin.import_tasks: mac.yml
  when:
    - not (template_mcp_command | default(''))
    - ansible_facts['system'] == "Darwin"

- name: Install template MCP server on Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when:
    - not (template_mcp_command | default(''))
    - ansible_facts['distribution'] == "Ubuntu"

- name: Fail if the template MCP command is still empty
  ansible.builtin.fail:
    msg: >-
      template_mcp_command is empty. Replace the install stubs in mac.yml /
      ubuntu.yml or set an explicit command override for validation.
  when: not (template_mcp_command | default(''))

- name: Ensure the template MCP entry exists in Cursor config
  ansible.builtin.include_tasks: configure_target.yml
  vars:
    _template_target_name: "cursor"
    _template_target_config_path: "{{ template_mcp_cursor_config_path }}"
  when: _template_mcp_target_cursor_selected | bool

- name: Ensure the template MCP entry exists in VS Code config
  ansible.builtin.include_tasks: configure_target.yml
  vars:
    _template_target_name: "vscode"
    _template_target_config_path: "{{ template_mcp_vscode_config_path }}"
  when: _template_mcp_target_vscode_selected | bool

- name: Ensure the template MCP entry exists in Codex config
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/configure_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ template_mcp_codex_config_path }}"
    _mcp_codex_server_key: "{{ template_mcp_server_key }}"
    _mcp_codex_entry: "{{ template_mcp_codex_entry }}"
  when: _template_mcp_target_codex_selected | bool
