---
template_mcp_state: present
template_mcp_server_key: "template-server"

# Git repository version pinning (REQUIRED for git-cloned servers)
# Pin to a release tag (e.g., "v1.0.0") when available.
# Use "main" only when explicitly choosing to track HEAD.
template_mcp_repo_url: ""
template_mcp_repo_version: ""  # MUST be filled: release tag or "main"
template_mcp_install_path: "{{ dotfiles_user_home }}/.local/lib/template-server"
template_mcp_venv_dir: "{{ template_mcp_install_path }}/.venv"

# Entry points for pip/venv-based servers
template_mcp_entry_point: "{{ template_mcp_venv_dir }}/bin/python"
template_mcp_server_script: ""  # Fill if server uses a script, leave empty if module-based

template_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
template_mcp_targets:
  - cursor
template_mcp_supported_targets:
  - cursor
  - vscode
  - codex
  - openapi
template_mcp_cursor_config_path: "{{ template_mcp_project_root }}/.cursor/mcp.json"
template_mcp_vscode_config_path: "{{ template_mcp_project_root }}/.vscode/mcp.json"
template_mcp_codex_config_path: "{{ template_mcp_project_root }}/.codex/config.toml"
template_mcp_role_path: "roles/mcp_servers/_template"
template_mcp_command: ""
template_mcp_args: []
template_mcp_env:
  _MCP_ANSIBLE_ROLE_PATH: "{{ template_mcp_role_path }}"
template_mcp_codex_entry: {}
