---
argument_specs:
  main:
    short_description: Install the active draw.io MCP server and configure repo-local Cursor, Codex, or VS Code targets on macOS or Ubuntu.
    description: >
      Installs the active draw.io MCP npm package with the nvm-managed npm,
      resolves the installed executable, removes legacy alternative packages,
      and merges a drawio entry into the selected repo-local MCP client
      targets. The openapi target remains an explicit v1 stub and should fail
      fast if selected.
    options:
      drawio_mcp_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Ensure the draw.io MCP package and local config are present or absent.

      drawio_mcp_package_name:
        type: str
        default: "drawio-mcp-server"
        description: npm package name for the active draw.io MCP server.

      drawio_mcp_server_key:
        type: str
        default: "drawio"
        description: Key under mcpServers in target mcp.json files.

      drawio_mcp_project_root:
        type: str
        required: false
        description: Repo root used to derive default Cursor and VS Code target paths.

      drawio_mcp_targets:
        type: list
        elements: str
        default:
          - cursor
          - codex
        description: >
          Target client configs to manage. Supported values are cursor, vscode,
          codex, and openapi. openapi is a deliberate v1 stub and fails fast if selected.

      drawio_mcp_supported_targets:
        type: list
        elements: str
        required: false
        description: Supported target names used for validation and guardrails.

      drawio_mcp_cursor_config_path:
        type: str
        required: false
        description: Path to the repo-local Cursor mcp.json file.

      drawio_mcp_vscode_config_path:
        type: str
        required: false
        description: Path to the repo-local VS Code mcp.json file.

      drawio_mcp_codex_config_path:
        type: str
        required: false
        description: Path to the repo-local Codex config.toml file.

      drawio_mcp_codex_wrapper_path:
        type: str
        required: false
        description: Path to the repo-local wrapper used for Codex stdio startup.

      drawio_mcp_codex_extension_port:
        type: int
        required: false
        description: Dedicated draw.io extension WebSocket port for the Codex target.

      drawio_mcp_codex_http_port:
        type: int
        required: false
        description: Dedicated draw.io editor HTTP port for the Codex target.

      drawio_mcp_codex_startup_timeout_sec:
        type: int
        required: false
        description: Startup timeout used for the Draw.io Codex MCP entry.

      drawio_mcp_codex_asset_path:
        type: str
        required: false
        description: Asset cache path used by the Draw.io Codex MCP entry.

      drawio_mcp_role_path:
        type: str
        default: "roles/mcp_servers/drawio"
        description: Relative repo path for role tracking/debugging.

      drawio_mcp_command:
        type: str
        default: ""
        description: Resolved draw.io MCP executable path. Setting this skips install tasks.

      drawio_mcp_args:
        type: list
        elements: str
        default:
          - "--editor"
        description: Runtime args passed to the draw.io MCP server.

      drawio_mcp_env:
        type: dict
        required: false
        description: Environment variables passed to the draw.io MCP server.

      drawio_mcp_codex_entry:
        type: dict
        required: false
        description: >
          Structured Codex MCP entry override for the draw.io server. Supports
          command or url plus optional args, env, cwd, startup_timeout_sec, and
          required.

      drawio_mcp_bin_candidates:
        type: list
        elements: str
        required: false
        description: Candidate executable paths checked after npm install. First existing path wins.

      drawio_mcp_legacy_packages:
        type: list
        elements: str
        required: false
        description: Alternative draw.io MCP npm packages removed during present-state convergence.
