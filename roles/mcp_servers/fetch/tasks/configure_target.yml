---
- name: Ensure target directory exists for {{ _fetch_target_name }}
  ansible.builtin.file:
    path: "{{ _fetch_target_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Check whether mcp.json exists for {{ _fetch_target_name }}
  ansible.builtin.stat:
    path: "{{ _fetch_target_config_path }}"
  register: _fetch_target_mcp_json_stat

- name: Create mcp.json with Fetch entry for {{ _fetch_target_name }}
  ansible.builtin.copy:
    dest: "{{ _fetch_target_config_path }}"
    mode: "0644"
    content: "{{ {'mcpServers': {(fetch_mcp_server_key): _fetch_entry}} | to_nice_json }}\n"
  vars:
    _fetch_entry:
      command: "{{ fetch_mcp_command }}"
      args: "{{ fetch_mcp_args }}"
      env: "{{ fetch_mcp_env }}"
  when: not _fetch_target_mcp_json_stat.stat.exists

- name: Merge Fetch entry into existing mcp.json for {{ _fetch_target_name }}
  when: _fetch_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _fetch_target_name }}
      ansible.builtin.slurp:
        src: "{{ _fetch_target_config_path }}"
      register: _fetch_target_mcp_json_raw

    - name: Write merged mcp.json for {{ _fetch_target_name }}
      ansible.builtin.copy:
        dest: "{{ _fetch_target_config_path }}"
        content: "{{ _fetch_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _fetch_target_existing: "{{ _fetch_target_mcp_json_raw.content | b64decode | from_json }}"
        _fetch_entry:
          command: "{{ fetch_mcp_command }}"
          args: "{{ fetch_mcp_args }}"
          env: "{{ fetch_mcp_env }}"
        _fetch_target_servers: >-
          {{
            (_fetch_target_existing.mcpServers | default({}))
            | combine({(fetch_mcp_server_key): _fetch_entry})
          }}
        _fetch_target_merged: "{{ _fetch_target_existing | combine({'mcpServers': _fetch_target_servers}) }}"
