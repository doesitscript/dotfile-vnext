---
argument_specs:
  main:
    short_description: Install Fetch MCP and configure repo-local Cursor, Codex, or VS Code targets.
    description: >
      Installs mcp-fetch-server via npm and configures local MCP clients for
      lightweight HTML, Markdown, text, JSON, readable article, and YouTube transcript fetching.
    options:
      fetch_mcp_state:
        type: str
        default: present
        choices: [present, absent]
        description: Ensure the Fetch MCP package and local config are present or absent.
      fetch_mcp_targets:
        type: list
        elements: str
        default: [cursor]
        description: Target client configs to manage.
      fetch_mcp_default_limit:
        type: str
        default: "5000"
        description: DEFAULT_LIMIT env var for fetch response length.
