---
- name: Install mcp-sysoperator on macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_os_family == "Darwin"
  tags: [mcp, mcp-sysoperator]

- name: Install mcp-sysoperator on Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_os_family == "Debian"
  tags: [mcp, mcp-sysoperator]

- name: Install mcp-sysoperator on Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_os_family == "Windows"
  tags: [mcp, mcp-sysoperator]

- name: Configure sysoperator entry in .cursor/mcp.json
  ansible.builtin.import_tasks: configure.yml
  tags: [mcp, mcp-sysoperator]
