---
# mcp_servers: builds MCP container images and configures IDE MCP settings.
# Split into build.yml (Docker host) and configure.yml (client hosts).
# Playbooks import individual task files; this dispatcher runs both.

- name: Build MCP server container images
  ansible.builtin.import_tasks: build.yml
  when: docker_engine_in_wsl | default(false)

- name: Configure MCP server settings for IDE clients
  ansible.builtin.import_tasks: configure.yml
