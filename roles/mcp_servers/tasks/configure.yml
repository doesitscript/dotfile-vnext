---
# mcp_servers/configure.yml — Template Cursor mcp.json on client hosts.
# Runs on docker_clients (mac-dev, server-225-win, etc.).

- name: Ensure ~/.cursor directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.cursor"
    state: directory
    mode: "0755"

- name: Deploy Cursor MCP server configuration
  ansible.builtin.template:
    src: mcp.json.j2
    dest: "{{ ansible_env.HOME }}/.cursor/mcp.json"
    mode: "0644"
  register: _mcp_json_result

- name: Report MCP client configuration
  ansible.builtin.debug:
    msg: >-
      MCP config on {{ inventory_hostname }}:
      {{ 'updated' if _mcp_json_result is changed else 'unchanged' }}
      ({{ ansible_env.HOME }}/.cursor/mcp.json)
