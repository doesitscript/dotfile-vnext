---
- name: Remove Codex MCP block for {{ _mcp_codex_server_key }}
  ansible.builtin.blockinfile:
    path: "{{ _mcp_codex_target_config_path }}"
    create: false
    marker: "# {mark} ANSIBLE MANAGED BLOCK: {{ _mcp_codex_marker_name }}"
    state: absent
  vars:
    _mcp_codex_marker_name: "{{ _mcp_codex_marker_name | default('mcp_server_' ~ _mcp_codex_server_key) }}"
