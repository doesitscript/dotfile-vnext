---
argument_specs:
  main:
    short_description: Install the official HashiCorp Terraform MCP server locally.
    options:
      terraform_mcp_state:
        type: str
        default: present
        choices:
          - present
          - absent
      terraform_mcp_repo_version:
        type: str
        default: v1.3.0
      terraform_mcp_targets:
        type: list
        elements: str
        default:
          - cursor
      terraform_mcp_command:
        type: str
        default: ""
      terraform_mcp_force_reinstall:
        type: bool
        default: false
