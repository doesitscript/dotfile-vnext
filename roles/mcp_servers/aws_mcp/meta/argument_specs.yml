---
argument_specs:
  main:
    short_description: Configure the official AWS MCP server in client config files.
    options:
      aws_mcp_state:
        type: str
        default: present
        choices:
          - present
          - absent
      aws_mcp_url:
        type: str
        default: https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize
      aws_mcp_targets:
        type: list
        elements: str
        default:
          - cursor
      aws_mcp_cursor_config_path:
        type: str
        required: false
      aws_mcp_vscode_config_path:
        type: str
        required: false
      aws_mcp_codex_config_path:
        type: str
        required: false
