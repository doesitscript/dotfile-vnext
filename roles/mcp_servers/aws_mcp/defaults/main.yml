---
aws_mcp_state: present
aws_mcp_server_key: "aws-mcp"
aws_mcp_url: "https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize"
aws_mcp_project_root: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
aws_mcp_targets:
  - cursor
aws_mcp_supported_targets:
  - cursor
  - vscode
  - codex
  - openapi
aws_mcp_cursor_config_path: "{{ aws_mcp_project_root }}/.cursor/mcp.json"
aws_mcp_vscode_config_path: "{{ aws_mcp_project_root }}/.vscode/mcp.json"
aws_mcp_codex_config_path: "{{ aws_mcp_project_root }}/.codex/config.toml"
aws_mcp_role_path: "roles/mcp_servers/aws_mcp"
aws_mcp_client_entry:
  url: "{{ aws_mcp_url }}"
aws_mcp_codex_entry:
  url: "{{ aws_mcp_url }}"
  required: false
