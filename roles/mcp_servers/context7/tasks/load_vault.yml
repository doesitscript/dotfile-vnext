---
- name: Include mac-dev vault variables for Context7 MCP
  ansible.builtin.include_vars:
    file: "{{ context7_mcp_project_root }}/vault/mac_dev.vault.yml"
    name: vault_vars
  no_log: true

- name: Set Context7 API key from vault
  ansible.builtin.set_fact:
    context7_mcp_api_key: "{{ vault_vars.vault_context7_mcp_api_key | default('') }}"
  no_log: true
