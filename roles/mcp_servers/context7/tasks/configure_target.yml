---
- name: Ensure target directory exists for {{ _context7_target_name }}
  ansible.builtin.file:
    path: "{{ _context7_target_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Check whether mcp.json exists for {{ _context7_target_name }}
  ansible.builtin.stat:
    path: "{{ _context7_target_config_path }}"
  register: _context7_target_mcp_json_stat

- name: Create mcp.json with Context7 entry for {{ _context7_target_name }}
  ansible.builtin.copy:
    dest: "{{ _context7_target_config_path }}"
    mode: "0644"
    content: "{{ {'mcpServers': {(context7_mcp_server_key): _context7_entry}} | to_nice_json }}\n"
  vars:
    _context7_entry: "{{ context7_mcp_client_entry }}"
  when: not _context7_target_mcp_json_stat.stat.exists

- name: Merge Context7 entry into existing mcp.json for {{ _context7_target_name }}
  when: _context7_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _context7_target_name }}
      ansible.builtin.slurp:
        src: "{{ _context7_target_config_path }}"
      register: _context7_target_mcp_json_raw

    - name: Write merged mcp.json for {{ _context7_target_name }}
      ansible.builtin.copy:
        dest: "{{ _context7_target_config_path }}"
        content: "{{ _context7_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _context7_target_existing: "{{ _context7_target_mcp_json_raw.content | b64decode | from_json }}"
        _context7_entry: "{{ context7_mcp_client_entry }}"
        _context7_target_servers: >-
          {{
            (_context7_target_existing.mcpServers | default({}))
            | combine({(context7_mcp_server_key): _context7_entry})
          }}
        _context7_target_merged: "{{ _context7_target_existing | combine({'mcpServers': _context7_target_servers}) }}"
