---
- name: Check whether mcp.json exists for {{ _context7_target_name }}
  ansible.builtin.stat:
    path: "{{ _context7_target_config_path }}"
  register: _context7_remove_target_mcp_json_stat

- name: Remove Context7 entry from mcp.json for {{ _context7_target_name }}
  when: _context7_remove_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _context7_target_name }}
      ansible.builtin.slurp:
        src: "{{ _context7_target_config_path }}"
      register: _context7_remove_target_mcp_json_raw

    - name: Write mcp.json without the Context7 entry for {{ _context7_target_name }}
      ansible.builtin.copy:
        dest: "{{ _context7_target_config_path }}"
        content: "{{ _context7_remove_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _context7_remove_target_existing: "{{ _context7_remove_target_mcp_json_raw.content | b64decode | from_json }}"
        _context7_remove_target_filtered_servers: >-
          {{
            (_context7_remove_target_existing.mcpServers | default({}))
            | dict2items
            | rejectattr('key', 'equalto', context7_mcp_server_key)
            | items2dict
          }}
        _context7_remove_target_merged: "{{ _context7_remove_target_existing | combine({'mcpServers': _context7_remove_target_filtered_servers}) }}"
