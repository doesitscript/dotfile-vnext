---
- name: Remove Firecrawl MCP package via npm
  community.general.npm:
    name: "{{ firecrawl_mcp_package_name }}"
    global: true
    state: absent
    executable: "{{ node_npm_executable }}"
  timeout: 300

- name: Remove Firecrawl MCP runtime env file
  ansible.builtin.file:
    path: "{{ firecrawl_mcp_env_file_path }}"
    state: absent

- name: Remove Firecrawl entry from Cursor mcp.json
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _firecrawl_target_name: "cursor"
    _firecrawl_target_config_path: "{{ firecrawl_mcp_cursor_config_path }}"
  when: _firecrawl_target_cursor_selected | bool

- name: Remove Firecrawl entry from VS Code mcp.json
  ansible.builtin.include_tasks: remove_target.yml
  vars:
    _firecrawl_target_name: "vscode"
    _firecrawl_target_config_path: "{{ firecrawl_mcp_vscode_config_path }}"
  when: _firecrawl_target_vscode_selected | bool

- name: Remove Firecrawl entry from Codex config
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/remove_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ firecrawl_mcp_codex_config_path }}"
    _mcp_codex_server_key: "{{ firecrawl_mcp_server_key }}"
  when: _firecrawl_target_codex_selected | bool

- name: Remove Firecrawl entry from user Codex config
  ansible.builtin.include_tasks: "{{ role_path }}/../_shared/tasks/remove_codex_target.yml"
  vars:
    _mcp_codex_target_config_path: "{{ firecrawl_mcp_codex_user_config_path }}"
    _mcp_codex_server_key: "{{ firecrawl_mcp_server_key }}"
  when:
    - _firecrawl_target_codex_selected | bool
    - firecrawl_mcp_configure_codex_user | bool
