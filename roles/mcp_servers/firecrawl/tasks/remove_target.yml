---
- name: Check whether mcp.json exists for {{ _firecrawl_target_name }}
  ansible.builtin.stat:
    path: "{{ _firecrawl_target_config_path }}"
  register: _firecrawl_remove_target_mcp_json_stat

- name: Remove Firecrawl entry from mcp.json for {{ _firecrawl_target_name }}
  when: _firecrawl_remove_target_mcp_json_stat.stat.exists
  block:
    - name: Read existing mcp.json for {{ _firecrawl_target_name }}
      ansible.builtin.slurp:
        src: "{{ _firecrawl_target_config_path }}"
      register: _firecrawl_remove_target_mcp_json_raw

    - name: Write mcp.json without the Firecrawl entry for {{ _firecrawl_target_name }}
      ansible.builtin.copy:
        dest: "{{ _firecrawl_target_config_path }}"
        content: "{{ _firecrawl_remove_target_merged | to_nice_json }}\n"
        mode: "0644"
      vars:
        _firecrawl_remove_target_existing: "{{ _firecrawl_remove_target_mcp_json_raw.content | b64decode | from_json }}"
        _firecrawl_remove_target_filtered_servers: >-
          {{
            (_firecrawl_remove_target_existing.mcpServers | default({}))
            | dict2items
            | rejectattr('key', 'equalto', firecrawl_mcp_server_key)
            | items2dict
          }}
        _firecrawl_remove_target_merged: >-
          {{
            _firecrawl_remove_target_existing
            | combine({'mcpServers': _firecrawl_remove_target_filtered_servers})
          }}
