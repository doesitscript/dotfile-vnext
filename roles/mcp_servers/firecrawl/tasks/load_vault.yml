---
- name: Include vault variables for Firecrawl MCP
  ansible.builtin.include_vars:
    file: "{{ firecrawl_mcp_vault_file_path }}"
    name: vault_vars
  no_log: true

- name: Set Firecrawl API key from vault
  ansible.builtin.set_fact:
    firecrawl_mcp_api_key: "{{ vault_vars.vault_firecrawl_mcp_api_key }}"
  no_log: true

- name: Assert Firecrawl API key is present in vault
  ansible.builtin.assert:
    that:
      - firecrawl_mcp_api_key is defined
      - firecrawl_mcp_api_key | length > 0
    fail_msg: >-
      vault_firecrawl_mcp_api_key is required in {{ firecrawl_mcp_vault_file_path }}
      before Firecrawl MCP can be configured. Obtain a key from
      https://www.firecrawl.dev/app/api-keys and ingest it with ansible-vault.
