---
- name: Install Firecrawl MCP package via npm on Ubuntu
  community.general.npm:
    name: "{{ firecrawl_mcp_package_name }}"
    global: true
    state: present
    executable: "{{ node_npm_executable }}"
  timeout: 300

- name: Check Firecrawl MCP binary candidates on Ubuntu
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _firecrawl_bin_candidates }}"
  register: _firecrawl_mcp_bin_stats_ubuntu
  vars:
    _firecrawl_bin_candidates: >-
      {{
        firecrawl_mcp_bin_candidates
        if (firecrawl_mcp_bin_candidates | length > 0)
        else [
          (node_npm_executable | dirname) ~ '/firecrawl-mcp'
        ]
      }}

- name: Set Firecrawl MCP command path for MCP clients on Ubuntu
  ansible.builtin.set_fact:
    firecrawl_mcp_command: "{{ (_firecrawl_mcp_bin_stats_ubuntu.results | selectattr('stat.exists') | map(attribute='item') | first) | default('') }}"

- name: Fail if Firecrawl MCP binary was not found on Ubuntu
  ansible.builtin.fail:
    msg: >-
      Firecrawl MCP package installed, but no executable was found in
      firecrawl_mcp_bin_candidates={{ _firecrawl_bin_candidates | to_json }}.
  when: not (firecrawl_mcp_command | default(''))
  vars:
    _firecrawl_bin_candidates: >-
      {{
        firecrawl_mcp_bin_candidates
        if (firecrawl_mcp_bin_candidates | length > 0)
        else [
          (node_npm_executable | dirname) ~ '/firecrawl-mcp'
        ]
      }}
