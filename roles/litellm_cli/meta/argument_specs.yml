---
argument_specs:
  main:
    short_description: Install and manage LiteLLM CLI tooling on macOS via pipx
    description:
      - Installs litellm with pipx using the repo Python CLI tool pattern
      - Publishes the litellm binary through pipx into ~/.local/bin
    options:
      litellm_cli_version:
        type: str
        required: false
        description: Pinned version from litellm_tooling_version_contract.cli
      litellm_cli_package_spec:
        type: str
        required: false
        description: Package spec passed to pipx install
      litellm_cli_state:
        type: str
        required: false
        default: present
        choices:
          - present
          - absent
        description: Desired state of the LiteLLM CLI install
      litellm_cli_pipx_executable:
        type: str
        required: false
        default: pipx
        description: pipx executable used to manage the LiteLLM CLI
      litellm_cli_global_bin_dir:
        type: str
        required: false
        description: Directory where pipx publishes CLI binaries
      litellm_cli_verify:
        type: bool
        required: false
        default: true
        description: Verify litellm CLI state after convergence
