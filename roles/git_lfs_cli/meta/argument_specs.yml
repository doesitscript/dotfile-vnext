---
argument_specs:
  main:
    short_description: "Install and manage Git LFS on macOS"
    options:
      git_lfs_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether Git LFS should be installed or removed."
      git_lfs_cli_homebrew_formula:
        type: str
        default: git-lfs
        description:
          - "Homebrew formula used to manage Git LFS."
      git_lfs_cli_binary_path:
        type: str
        default: /opt/homebrew/bin/git-lfs
        description:
          - "Path to the linked Git LFS executable used for verification."
      git_lfs_cli_verify:
        type: bool
        default: true
        description:
          - "Verify the requested Git LFS state after convergence."