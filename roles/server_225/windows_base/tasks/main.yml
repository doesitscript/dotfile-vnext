---
# Server-225 Windows Base Role
# WinRM/PowerShell only - no docker compose operations
# Enables Windows features, configures power settings, creates directories

- name: Check if reboot is required
  win_shell: |
    $rebootRequired = $false
    $features = Get-WindowsOptionalFeature -Online | Where-Object {$_.State -eq 'Enabled' -and $_.RestartNeeded -eq $true}
    if ($features) { $rebootRequired = $true }
    $rebootRequired
  register: reboot_check
  changed_when: false

- name: Enable Hyper-V feature
  win_feature:
    name: Microsoft-Hyper-V-All
    state: present
    include_sub_features: yes
    include_management_tools: yes
  register: hyperv_result

- name: Enable Containers feature
  win_feature:
    name: Containers
    state: present
  register: containers_result

- name: Enable Virtual Machine Platform feature
  win_feature:
    name: VirtualMachinePlatform
    state: present
  register: vmplatform_result

- name: Enable WSL feature
  win_feature:
    name: Microsoft-Windows-Subsystem-Linux
    state: present
  register: wsl_result

- name: Reboot if Windows features were installed
  win_reboot:
    msg: "Rebooting to complete Windows feature installation"
    reboot_timeout: 600
  when: 
    - hyperv_result.changed or 
      containers_result.changed or 
      vmplatform_result.changed or 
      wsl_result.changed

- name: Wait for system to come back online after reboot
  wait_for_connection:
    timeout: 600
  when: 
    - hyperv_result.changed or 
      containers_result.changed or 
      vmplatform_result.changed or 
      wsl_result.changed

- name: Install OpenSSH Server feature
  win_feature:
    name: OpenSSH.Server
    state: present
  register: openssh_result

- name: Start OpenSSH Server service
  win_service:
    name: sshd
    state: started
    start_mode: auto
  when: openssh_result.changed

- name: Verify OpenSSH Server is running
  win_service:
    name: sshd
  register: sshd_status
  changed_when: false

- name: Set power plan to High Performance
  win_shell: |
    powercfg /setactive SCHEME_MIN
  register: power_result
  changed_when: power_result.rc != 0
  failed_when: false

- name: Disable sleep
  win_shell: |
    powercfg -change -standby-timeout-ac 0
    powercfg -change -hibernate-timeout-ac 0
  register: sleep_result
  changed_when: sleep_result.rc != 0
  failed_when: false

- name: Disable USB selective suspend
  win_shell: |
    powercfg -setacvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0
    powercfg -setactive SCHEME_CURRENT
  register: usb_result
  changed_when: usb_result.rc != 0
  failed_when: false

- name: Verify data drive exists
  win_stat:
    path: "{{ windows_data_root | regex_replace('\\\\', '\\') }}"
  register: data_drive_check
  failed_when: not data_drive_check.stat.exists

- name: Create data root directory
  win_file:
    path: "{{ windows_data_root | regex_replace('\\\\', '\\') }}"
    state: directory
  register: data_root_result

- name: Create stacks directory
  win_file:
    path: "{{ stacks_root | regex_replace('\\\\', '\\') }}"
    state: directory
  register: stacks_result

- name: Create data directory
  win_file:
    path: "{{ data_root | regex_replace('\\\\', '\\') }}"
    state: directory
  register: data_dir_result

- name: Disable Windows Defender indexing on data directories
  win_shell: |
    $paths = @("{{ windows_data_root }}", "{{ stacks_root }}", "{{ data_root }}")
    foreach ($path in $paths) {
      if (Test-Path $path) {
        attrib.exe +s $path
      }
    }
  register: indexing_result
  changed_when: indexing_result.rc == 0
  failed_when: false

- name: Add Windows Defender exclusions for data directories
  win_shell: |
    $paths = @("{{ windows_data_root }}", "{{ stacks_root }}", "{{ data_root }}")
    foreach ($path in $paths) {
      if (Test-Path $path) {
        Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
      }
    }
  register: defender_result
  changed_when: defender_result.rc == 0
  failed_when: false

- name: Enable long paths in Windows
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
    name: LongPathsEnabled
    data: 1
    type: dword
  register: longpaths_result

- name: Display Windows base configuration summary
  debug:
    msg:
      - "Windows features enabled: Hyper-V, Containers, Virtual Machine Platform, WSL"
      - "OpenSSH Server: {{ 'Running' if sshd_status.status.ActiveState == 'running' else 'Not running' }}"
      - "Power plan: High Performance"
      - "Data directories created: {{ windows_data_root }}, {{ stacks_root }}, {{ data_root }}"
      - "Long paths enabled: {{ 'Yes' if longpaths_result.changed else 'Already enabled' }}"

