---
# Server-225 Task Scheduler Autostart Role
# WinRM/PowerShell only - creates scheduled task for WSL docker compose autostart
# Uses placeholders for stack path if needed

- name: Check if task scheduler autostart is enabled
  set_fact:
    autostart_enabled: "{{ task_scheduler_enabled | default(true) }}"

- name: Set primary stack path (use wsl_mount_root + stacks/main)
  set_fact:
    primary_stack_path: "{{ primary_stack_path | default(wsl_mount_root + '/stacks/main') }}"

- name: Build WSL command for task scheduler
  set_fact:
    wsl_command: "cd {{ primary_stack_path }} && docker compose up -d"

- name: Check if autostart task already exists
  win_shell: |
    $task = Get-ScheduledTask -TaskName "{{ task_scheduler_task_name | default('autostart-ai-stack') }}" -ErrorAction SilentlyContinue
    if ($task) { "exists" } else { "missing" }
  register: task_check
  changed_when: false
  failed_when: false
  when: autostart_enabled

- name: Create Task Scheduler autostart task
  win_scheduled_task:
    name: "{{ task_scheduler_task_name | default('autostart-ai-stack') }}"
    description: "Starts WSL2 Docker daemon and brings up compose stack on boot"
    actions:
      - path: "C:\\Windows\\System32\\wsl.exe"
        arguments: '-d {{ wsl_distro }} -- bash -lc "{{ wsl_command }}"'
    triggers:
      - type: boot
        delay: "PT{{ task_scheduler_delay_seconds | default(45) }}S"
    username: SYSTEM
    run_level: highest
    state: present
    enabled: "{{ autostart_enabled }}"
    settings:
      multiple_instances: ignore_new
      restart_count: "{{ task_scheduler_restart_count | default(5) }}"
      restart_interval: "PT{{ task_scheduler_restart_interval_seconds | default(60) }}S"
      execution_time_limit: PT0S
  when: 
    - autostart_enabled
    - task_check.stdout != "exists"
  register: task_create_result

- name: Update existing autostart task if needed
  win_scheduled_task:
    name: "{{ task_scheduler_task_name | default('autostart-ai-stack') }}"
    description: "Starts WSL2 Docker daemon and brings up compose stack on boot"
    actions:
      - path: "C:\\Windows\\System32\\wsl.exe"
        arguments: '-d {{ wsl_distro }} -- bash -lc "{{ wsl_command }}"'
    triggers:
      - type: boot
        delay: "PT{{ task_scheduler_delay_seconds | default(45) }}S"
    username: SYSTEM
    run_level: highest
    state: present
    enabled: "{{ autostart_enabled }}"
    settings:
      multiple_instances: ignore_new
      restart_count: "{{ task_scheduler_restart_count | default(5) }}"
      restart_interval: "PT{{ task_scheduler_restart_interval_seconds | default(60) }}S"
      execution_time_limit: PT0S
  when: 
    - autostart_enabled
    - task_check.stdout == "exists"
  register: task_update_result

- name: Verify scheduled task exists and is enabled
  win_shell: |
    $task = Get-ScheduledTask -TaskName "{{ task_scheduler_task_name | default('autostart-ai-stack') }}" -ErrorAction SilentlyContinue
    if ($task) {
      "Name: $($task.TaskName); State: $($task.State); Enabled: $($task.Settings.Enabled)"
    } else {
      "Task not found"
    }
  register: task_verify
  changed_when: false
  when: autostart_enabled

- name: Display task scheduler summary
  debug:
    msg:
      - "Task scheduler autostart: {{ 'Enabled' if autostart_enabled else 'Disabled' }}"
      - "Task name: {{ task_scheduler_task_name | default('autostart-ai-stack') }}"
      - "WSL distro: {{ wsl_distro }}"
      - "Stack path: {{ primary_stack_path }}"
      - "Boot delay: {{ task_scheduler_delay_seconds | default(45) }} seconds"
      - "Task status: {{ task_verify.stdout if autostart_enabled else 'N/A' }}"
  when: autostart_enabled

