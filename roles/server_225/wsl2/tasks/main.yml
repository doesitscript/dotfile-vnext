---
# Server-225 WSL2 Role
# WinRM/PowerShell only - installs and configures WSL2
# No docker compose operations here

- name: Check if WSL is installed
  win_shell: wsl --status
  register: wsl_status
  changed_when: false
  failed_when: false

- name: Set WSL default version to 2
  win_shell: wsl --set-default-version 2
  register: wsl_version_result
  changed_when: "'is already set' not in wsl_version_result.stdout"
  failed_when: false

- name: Check if WSL distro is installed
  win_shell: wsl -l -v
  register: wsl_list
  changed_when: false
  failed_when: false

- name: Install WSL distro if not present
  win_shell: |
    wsl --install -d {{ wsl_distro }} --no-launch
  register: wsl_install_result
  when: wsl_distro not in wsl_list.stdout
  failed_when: false

- name: Wait for WSL distro installation
  pause:
    seconds: 30
  when: wsl_install_result.changed | default(false)

- name: Verify WSL distro is installed and using version 2
  win_shell: wsl -l -v
  register: wsl_verify
  changed_when: false

- name: Configure WSL to use systemd
  win_shell: |
    wsl -d {{ wsl_distro }} -- bash -c "echo '[boot]' | sudo tee /etc/wsl.conf"
    wsl -d {{ wsl_distro }} -- bash -c "echo 'systemd=true' | sudo tee -a /etc/wsl.conf"
  register: systemd_result
  when: systemd_in_wsl | default(true)
  changed_when: systemd_result.rc == 0
  failed_when: false

- name: Shutdown WSL to apply systemd configuration
  win_shell: wsl --shutdown
  when: 
    - systemd_in_wsl | default(true)
    - systemd_result.changed | default(false)
  register: wsl_shutdown_result
  changed_when: wsl_shutdown_result.rc == 0
  failed_when: false

- name: Wait for WSL to restart
  pause:
    seconds: 10
  when: 
    - systemd_in_wsl | default(true)
    - systemd_result.changed | default(false)

- name: Verify WSL distro is accessible
  win_shell: wsl -d {{ wsl_distro }} -- echo "WSL is working"
  register: wsl_test
  changed_when: false
  failed_when: wsl_test.rc != 0

- name: Display WSL2 configuration summary
  debug:
    msg:
      - "WSL default version: 2"
      - "WSL distro installed: {{ wsl_distro }}"
      - "Systemd enabled: {{ 'Yes' if systemd_in_wsl | default(true) else 'No' }}"
      - "WSL status: {{ wsl_test.stdout if wsl_test.rc == 0 else 'Not accessible' }}"

