---
argument_specs:
  main:
    short_description: "Manage Infracost CLI via Homebrew on macOS"
    options:
      infracost_cli_state:
        type: str
        default: present
        choices: [present, absent]
        description: ["Whether infracost_cli should be installed or removed."]
      infracost_cli_homebrew_formula:
        type: str
        default: infracost
        description: ["Homebrew formula used to manage this CLI."]
      infracost_cli_verify:
        type: bool
        default: true
        description: ["Verify requested state after convergence."]
