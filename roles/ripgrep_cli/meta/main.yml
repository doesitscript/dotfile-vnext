---
galaxy_info:
  role_name: ripgrep_cli
  author: dotfile-vnext
  description: >
    Manage ripgrep (rg) via BurntSushi GitHub release on macOS and apt on Ubuntu.
    Homebrew is avoided on older macOS where ripgrep source-builds Rust/LLVM.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: MacOSX
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - macos
    - ubuntu
    - ripgrep
    - cli
    - tooling

dependencies: []
