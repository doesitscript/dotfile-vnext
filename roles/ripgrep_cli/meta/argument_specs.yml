---
argument_specs:
  main:
    short_description: Manage ripgrep (rg) via GitHub release or apt
    options:
      ripgrep_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether ripgrep should be installed or removed.
      ripgrep_cli_release_version:
        type: str
        default: "15.2.0"
        description:
          - BurntSushi/ripgrep GitHub release tag used on macOS.
      ripgrep_cli_binary:
        type: str
        default: rg
        description:
          - Binary name. There is no ripgrep executable.
      ripgrep_cli_install_dir:
        type: str
        required: false
        description:
          - Directory for the rg binary on macOS (default ~/.local/bin).
      ripgrep_cli_apt_package:
        type: str
        default: ripgrep
        description:
          - Debian/Ubuntu package name that provides the rg binary.
      ripgrep_cli_verify:
        type: bool
        default: true
        description:
          - Verify package/binary state after convergence.
