---
# homelab_hosts_file_mac — transform registry rows into /private/etc/hosts lines.

- name: Skip homelab hosts file when disabled
  ansible.builtin.meta: end_host
  when: not (homelab_hosts_file_mac_enabled | bool)
  tags: [homelab_hosts_file_mac]

- name: Initialize hosts file host list
  ansible.builtin.set_fact:
    homelab_hosts_file_mac_hosts_file_hosts: []
  tags: [homelab_hosts_file_mac]

- name: Add web catalog operator hostnames for mac-dev
  ansible.builtin.set_fact:
    homelab_hosts_file_mac_hosts_file_hosts: >-
      {{
        homelab_hosts_file_mac_hosts_file_hosts
        + [
          {
            'hostname': item.hostname,
            'add_short_name': false,
            'ipv4': {'address': item.hosts_ip},
            'verify_url': item.verify_url | default(''),
            'line': (
              item.hosts_ip
              ~ ' '
              ~ item.hostname
              ~ (
                ' # port '
                ~ homelab_hosts_file_mac_verify_port
                if (homelab_hosts_file_mac_verify_port | length > 0)
                else ''
              )
            )
          }
        ]
      }}
  vars:
    homelab_hosts_file_mac_verify_url_tail: >-
      {{ (item.verify_url | default('')).split(':')[-1].split('/')[0] }}
    homelab_hosts_file_mac_verify_port: >-
      {{
        homelab_hosts_file_mac_verify_url_tail
        if (homelab_hosts_file_mac_verify_url_tail is regex('^[0-9]+$'))
        else ''
      }}
  loop: "{{ homelab_hosts_file_mac_web_catalog | rejectattr('mac_hosts_enabled', 'equalto', false) | list }}"
  loop_control:
    label: "{{ item.catalog_key }}"
  tags: [homelab_hosts_file_mac]

- name: Add router workaround guest hostnames for mac-dev
  ansible.builtin.set_fact:
    homelab_hosts_file_mac_hosts_file_hosts: >-
      {{
        homelab_hosts_file_mac_hosts_file_hosts
        + [
          {
            'hostname': item.hostname,
            'add_short_name': false,
            'ipv4': {'address': item.ip},
            'line': item.ip ~ ' ' ~ item.hostname
          }
        ]
      }}
  loop: "{{ homelab_hosts_file_mac_router_workaround }}"
  loop_control:
    label: "{{ item.hostname }}"
  tags: [homelab_hosts_file_mac]

- name: Preview mac-dev hosts file entries
  ansible.builtin.debug:
    var: homelab_hosts_file_mac_hosts_file_hosts
  tags: [homelab_hosts_file_mac]

- name: Ensure mac-dev hosts file entries per hostname
  become: true
  ansible.builtin.lineinfile:
    path: "/private/etc/hosts"
    regexp: '^.*\s{{ item.hostname | regex_escape }}(?:\s+#.*)?$'
    line: "{{ item.line }}"
    state: present
  loop: "{{ homelab_hosts_file_mac_hosts_file_hosts }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: homelab_hosts_file_mac_hosts_file_hosts | length > 0
  tags: [homelab_hosts_file_mac]
