---
k3s_storage_offload_state: present
k3s_storage_offload_apply: false
k3s_storage_offload_mount_path: /mnt/k3s-cache
k3s_storage_offload_containerd_source_path: /var/lib/rancher/k3s/agent/containerd
k3s_storage_offload_containerd_destination_path: /mnt/k3s-cache/containerd
k3s_storage_offload_containerd_backup_path: /var/lib/rancher/k3s/agent/containerd.ansible-pre-offload
k3s_storage_offload_local_path_destination: /mnt/k3s-cache/local-path
k3s_storage_offload_expected_local_path_root: /var/lib/rancher/k3s/storage
k3s_storage_offload_local_path_backup_file: /var/lib/ansible/k3s-storage-offload/local-path-config.json
k3s_storage_offload_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_storage_offload_service_name: k3s.service
k3s_storage_offload_retain_containerd_backup: true
