---
# Legacy scaffold retained only as a handoff note.
# Active Windows backup work now lives in the generic windows_server_backup role
# so the first milestone can target any managed Windows server instead of only
# the network_server namespace.

- name: Report legacy backup scaffold relocation
  ansible.builtin.debug:
    msg: >-
      Deprecated scaffold role. Use playbooks/windows_server_backup.yml and the
      windows_server_backup role. Future service-target ideas now live in
      roles/windows_server_backup/tasks/future_service_targets.yml.
  changed_when: false
