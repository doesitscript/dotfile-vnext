---
- name: Require macOS for K3s client setup
  ansible.builtin.assert:
    that:
      - ansible_system == "Darwin"
      - k3s_mac_client_state in ["present", "absent"]
    fail_msg: "k3s_mac_client must run on macOS with state present or absent."

- name: Resolve managed K3s mac client cluster definitions
  ansible.builtin.set_fact:
    k3s_mac_client_clusters_effective: >-
      {{
        k3s_mac_client_clusters
        if (k3s_mac_client_clusters | default([]) | length > 0)
        else [
          {
            'cluster_host': k3s_mac_client_cluster_host,
            'context_name': k3s_mac_client_cluster_host,
            'connection_mode': k3s_mac_client_connection_mode,
            'tunnel_local_port': k3s_mac_client_tunnel_local_port
          }
        ]
      }}
  changed_when: false

- name: Initialize K3s mac client cluster availability tracking
  ansible.builtin.set_fact:
    k3s_mac_client_available_clusters: []
    k3s_mac_client_unavailable_clusters: []
  changed_when: false

- name: Normalize managed K3s mac client clusters
  ansible.builtin.set_fact:
    k3s_mac_client_clusters_normalized: >-
      {{
        (k3s_mac_client_clusters_normalized | default([]))
        + [
          {
            'cluster_host': _cluster_host,
            'context_name': _context_name,
            'cluster_name': (_cluster.cluster_name | default(_context_name)),
            'user_name': (_cluster.user_name | default(_context_name)),
            'kubeconfig': (_cluster.kubeconfig | default(k3s_mac_client_kube_dir ~ '/' ~ _context_name ~ '.yaml')),
            'source_kubeconfig': (_cluster.source_kubeconfig | default(k3s_mac_client_source_kubeconfig)),
            'api_port': (_cluster.api_port | default(k3s_mac_client_api_port)),
            'connection_mode': (_cluster.connection_mode | default(k3s_mac_client_connection_mode)),
            'tunnel_bind_host': (_cluster.tunnel_bind_host | default(k3s_mac_client_tunnel_bind_host)),
            'tunnel_local_port': (_cluster.tunnel_local_port | default(k3s_mac_client_tunnel_local_port)),
            'tunnel_host': (
              _cluster.tunnel_host
              | default(
                  hostvars[_cluster_host].ssh_proxy_jump_host
                  | default(k3s_mac_client_tunnel_host)
                )
            ),
            'tunnel_remote_host': (_cluster.tunnel_remote_host | default(hostvars[_cluster_host].ansible_host)),
            'tunnel_remote_port': (_cluster.tunnel_remote_port | default(_cluster.api_port | default(k3s_mac_client_api_port)))
          }
        ]
      }}
  vars:
    _cluster: "{{ item }}"
    _cluster_host: "{{ _cluster.cluster_host | default(k3s_mac_client_cluster_host) }}"
    _context_name: "{{ _cluster.context_name | default(_cluster_host) }}"
  loop: "{{ k3s_mac_client_clusters_effective }}"
  changed_when: false

- name: Require configured K3s cluster hosts
  ansible.builtin.assert:
    that:
      - item.cluster_host in groups["k3s_cluster"]
      - hostvars[item.cluster_host].ansible_host is defined
    fail_msg: "Each k3s_mac_client cluster_host must be a reachable k3s_cluster host."
  loop: "{{ k3s_mac_client_clusters_normalized }}"

- name: Set primary K3s mac client compatibility facts
  ansible.builtin.set_fact:
    k3s_mac_client_primary_cluster: "{{ k3s_mac_client_clusters_normalized[0] }}"
    k3s_mac_client_cluster_host: "{{ k3s_mac_client_clusters_normalized[0].cluster_host }}"
    k3s_mac_client_kubeconfig: "{{ k3s_mac_client_clusters_normalized[0].kubeconfig }}"
  changed_when: false

- name: Map macOS architecture for kubectl download
  ansible.builtin.set_fact:
    k3s_mac_client_kubectl_arch: >-
      {{
        'arm64'
        if ansible_architecture == 'arm64'
        else 'amd64'
      }}
  changed_when: false
  when: k3s_mac_client_state == "present"

- name: Resolve Homebrew prefix for kubectl bash completion
  ansible.builtin.command:
    argv:
      - brew
      - --prefix
  register: k3s_mac_client_brew_prefix_cmd
  changed_when: false
  check_mode: false

- name: Set kubectl bash completion derived paths
  ansible.builtin.set_fact:
    k3s_mac_client_kubectl_bash_completion_path_effective: >-
      {{
        k3s_mac_client_kubectl_bash_completion_path
        if (k3s_mac_client_kubectl_bash_completion_path | default('') | length) > 0
        else (k3s_mac_client_brew_prefix_cmd.stdout ~ '/etc/bash_completion.d/kubectl')
      }}
  changed_when: false

- name: Remove kubectl binary from macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_kubectl_path }}"
    state: absent
  when: k3s_mac_client_state == "absent"

- name: Remove kubectl bash completion from macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_kubectl_bash_completion_path_effective }}"
    state: absent
  when:
    - k3s_mac_client_state == "absent"
    - k3s_mac_client_install_bash_completion | bool

- name: Remove managed K3s kubeconfigs from macOS
  ansible.builtin.file:
    path: "{{ item.kubeconfig }}"
    state: absent
  loop: "{{ k3s_mac_client_clusters_normalized }}"
  when:
    - k3s_mac_client_state == "absent"

- name: Remove default K3s kubeconfig from macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_default_kubeconfig }}"
    state: absent
  when:
    - k3s_mac_client_state == "absent"
    - k3s_mac_client_manage_default_kubeconfig | bool

- name: Remove K3s KUBECONFIG shell export from macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_shell_kubeconfig_bashrc }}"
    state: absent
  when: k3s_mac_client_state == "absent"

- name: Ensure kubectl install directory exists on macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_bin_dir }}"
    state: directory
    mode: "0755"
  when: k3s_mac_client_state == "present"

- name: Install kubectl official macOS binary
  ansible.builtin.get_url:
    url: "{{ k3s_mac_client_kubectl_base_url }}/{{ k3s_mac_client_kubectl_arch }}/kubectl"
    dest: "{{ k3s_mac_client_kubectl_path }}"
    mode: "0755"
  when: k3s_mac_client_state == "present"

- name: Generate kubectl bash completion on macOS
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - completion
      - bash
  register: k3s_mac_client_kubectl_bash_completion
  changed_when: false
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_install_bash_completion | bool

- name: Install kubectl bash completion on macOS
  ansible.builtin.copy:
    dest: "{{ k3s_mac_client_kubectl_bash_completion_path_effective }}"
    mode: "0644"
    content: "{{ k3s_mac_client_kubectl_bash_completion.stdout }}"
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_install_bash_completion | bool
    - k3s_mac_client_kubectl_bash_completion.stdout | length > 0

- name: Ensure kubeconfig directory exists on macOS
  ansible.builtin.file:
    path: "{{ k3s_mac_client_kube_dir }}"
    state: directory
    mode: "0700"
  when: k3s_mac_client_state == "present"

- name: Reconcile managed K3s mac client clusters
  ansible.builtin.include_tasks: present_cluster.yml
  loop: "{{ k3s_mac_client_clusters_normalized }}"
  loop_control:
    loop_var: k3s_mac_client_cluster
  when: k3s_mac_client_state == "present"

- name: Build managed KUBECONFIG merge list
  ansible.builtin.set_fact:
    k3s_mac_client_managed_kubeconfigs: "{{ k3s_mac_client_available_clusters | map(attribute='kubeconfig') | list }}"
  changed_when: false
  when: k3s_mac_client_state == "present"

- name: Resolve effective default K3s context on macOS
  ansible.builtin.set_fact:
    k3s_mac_client_effective_default_context: >-
      {{
        k3s_mac_client_default_context
        if (
          k3s_mac_client_available_clusters
          | selectattr('context_name', 'equalto', k3s_mac_client_default_context)
          | list
          | length
        ) > 0
        else (
          (k3s_mac_client_available_clusters | first).context_name
          if (k3s_mac_client_available_clusters | length) > 0
          else ''
        )
      }}
  changed_when: false
  when: k3s_mac_client_state == "present"

- name: Install default kubeconfig for bare kubectl on macOS
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - config
      - view
      - --flatten
  environment:
    KUBECONFIG: "{{ k3s_mac_client_managed_kubeconfigs | join(':') }}"
  register: k3s_mac_client_merged_kubeconfig
  changed_when: false
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_manage_default_kubeconfig | bool
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Write merged default kubeconfig for bare kubectl on macOS
  ansible.builtin.copy:
    dest: "{{ k3s_mac_client_default_kubeconfig }}"
    mode: "0600"
    content: "{{ k3s_mac_client_merged_kubeconfig.stdout }}\n"
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_manage_default_kubeconfig | bool
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Set default kubectl context on macOS
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - config
      - use-context
      - "{{ k3s_mac_client_effective_default_context }}"
      - --kubeconfig
      - "{{ k3s_mac_client_default_kubeconfig }}"
  changed_when: false
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_manage_default_kubeconfig | bool
    - (k3s_mac_client_effective_default_context | default('') | length) > 0

- name: Ensure bashrc.d exists before KUBECONFIG export
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.bashrc.d"
    state: directory
    mode: "0755"
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_shell_kubeconfig_export | bool
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Deploy KUBECONFIG shell export for separate cluster kubeconfigs
  ansible.builtin.template:
    src: k3s-kubeconfig.bash.j2
    dest: "{{ k3s_mac_client_shell_kubeconfig_bashrc }}"
    mode: "0644"
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_shell_kubeconfig_export | bool
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Verify kubectl client is available on macOS
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - version
      - --client=true
  register: k3s_mac_client_kubectl_version
  changed_when: false
  when: k3s_mac_client_state == "present"

- name: Verify kubectl bash completion exists on macOS
  ansible.builtin.stat:
    path: "{{ k3s_mac_client_kubectl_bash_completion_path_effective }}"
  register: k3s_mac_client_kubectl_bash_completion_stat
  when:
    - not ansible_check_mode
    - k3s_mac_client_state == "present"
    - k3s_mac_client_install_bash_completion | bool

- name: Assert kubectl bash completion exists on macOS
  ansible.builtin.assert:
    that:
      - k3s_mac_client_kubectl_bash_completion_stat.stat.exists | default(false)
    fail_msg: "Managed kubectl bash completion missing at {{ k3s_mac_client_kubectl_bash_completion_path_effective }}."
  when:
    - not ansible_check_mode
    - k3s_mac_client_state == "present"
    - k3s_mac_client_install_bash_completion | bool

- name: Verify macOS kubectl contexts are available
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - config
      - get-contexts
  environment:
    KUBECONFIG: >-
      {{
        k3s_mac_client_default_kubeconfig
        if (k3s_mac_client_manage_default_kubeconfig | bool)
        else (k3s_mac_client_managed_kubeconfigs | join(':'))
      }}
  register: k3s_mac_client_contexts
  changed_when: false
  when:
    - k3s_mac_client_state == "present"
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Verify bare kubectl can reach the default K3s context
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - get
      - nodes
      - -o
      - wide
  register: k3s_mac_client_default_nodes
  changed_when: false
  when:
    - k3s_mac_client_state == "present"
    - k3s_mac_client_manage_default_kubeconfig | bool
    - (k3s_mac_client_managed_kubeconfigs | default([]) | length) > 0

- name: Verify macOS kubectl can reach each managed K3s cluster
  ansible.builtin.command:
    argv:
      - "{{ k3s_mac_client_kubectl_path }}"
      - --kubeconfig
      - "{{ item.kubeconfig }}"
      - get
      - nodes
      - -o
      - wide
  register: k3s_mac_client_cluster_nodes
  changed_when: false
  loop: "{{ k3s_mac_client_available_clusters }}"
  when: k3s_mac_client_state == "present"

- name: Report K3s client configuration
  ansible.builtin.debug:
    msg:
      kubeconfig: "{{ k3s_mac_client_kubeconfig }}"
      kubeconfigs: "{{ k3s_mac_client_managed_kubeconfigs | default([k3s_mac_client_kubeconfig]) }}"
      unavailable_clusters: "{{ k3s_mac_client_unavailable_clusters | default([]) }}"
      default_kubeconfig: "{{ k3s_mac_client_default_kubeconfig if k3s_mac_client_manage_default_kubeconfig else omit }}"
      shell_kubeconfig_export: "{{ k3s_mac_client_shell_kubeconfig_bashrc if k3s_mac_client_shell_kubeconfig_export else omit }}"
      connection_modes: "{{ k3s_mac_client_clusters_normalized | map(attribute='connection_mode') | list }}"
      kubectl: "{{ k3s_mac_client_kubectl_path }}"
      contexts: "{{ k3s_mac_client_contexts.stdout_lines | default([]) }}"
      kubectl_client: "{{ k3s_mac_client_kubectl_version.stdout_lines }}"
      nodes: "{{ k3s_mac_client_cluster_nodes.results | map(attribute='stdout_lines') | list }}"
      bare_kubectl_nodes: "{{ k3s_mac_client_default_nodes.stdout_lines | default([]) }}"
  when: k3s_mac_client_state == "present"
