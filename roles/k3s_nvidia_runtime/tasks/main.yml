---
- name: Reject apt NVIDIA guest driver install on GPU-P guests
  ansible.builtin.assert:
    that:
      - not (
          (gpu_contract.passthrough_mode | default('')) == 'gpu_p'
          and (k3s_nvidia_runtime_install_guest_driver | bool)
        )
    fail_msg: >-
      GPU-P guests must not install apt nvidia-driver packages. Set
      k3s_nvidia_runtime_install_guest_driver: false and converge userspace via
      roles/hyperv_ubuntu_gpu_p_linux_guest_runtime. To purge an existing apt
      driver, set k3s_nvidia_runtime_remove_guest_driver: true.
  when: k3s_nvidia_runtime_state == 'present'

- name: Remove apt NVIDIA guest driver packages when GPU-P cleanup is requested
  ansible.builtin.include_tasks: remove_guest_driver.yml
  when:
    - k3s_nvidia_runtime_state == 'present'
    - k3s_nvidia_runtime_remove_guest_driver | bool

- name: Wait for APT and DPKG locks to clear before NVIDIA runtime package operations
  ansible.builtin.shell: |
    python3 - <<'PY'
    import errno
    import fcntl
    import os
    import sys

    lock_paths = [
        "/var/lib/apt/lists/lock",
        "/var/cache/apt/archives/lock",
        "/var/lib/dpkg/lock",
        "/var/lib/dpkg/lock-frontend",
    ]

    blocked = []

    for path in lock_paths:
        if not os.path.exists(path):
            continue
        fd = os.open(path, os.O_RDWR)
        try:
            fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
        except OSError as exc:
            if exc.errno in (errno.EACCES, errno.EAGAIN):
                blocked.append(path)
            else:
                raise
        finally:
            os.close(fd)

    if blocked:
        print("locked:" + ",".join(blocked))
        sys.exit(1)
    PY
  register: k3s_nvidia_runtime_apt_lock_wait
  changed_when: false
  retries: "{{ k3s_nvidia_runtime_apt_lock_wait_retries }}"
  delay: "{{ k3s_nvidia_runtime_apt_lock_wait_delay }}"
  until: k3s_nvidia_runtime_apt_lock_wait.rc == 0
  when: k3s_nvidia_runtime_state in ['present', 'absent']

- name: Ensure APT prerequisites for NVIDIA runtime are present
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ubuntu-drivers-common
    state: present
    update_cache: true
    lock_timeout: "{{ k3s_nvidia_runtime_apt_lock_timeout }}"
  when: k3s_nvidia_runtime_state == 'present'

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  when: k3s_nvidia_runtime_state == 'present'

- name: Download NVIDIA container toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.gpgkey
    mode: "0644"
  when: k3s_nvidia_runtime_state == 'present'

- name: Dearmor NVIDIA container toolkit GPG key into keyring
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor
      -o {{ k3s_nvidia_runtime_keyring_path }}
      /tmp/nvidia-container-toolkit.gpgkey
  args:
    creates: "{{ k3s_nvidia_runtime_keyring_path }}"
  when: k3s_nvidia_runtime_state == 'present'

- name: Download NVIDIA container toolkit repository list
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
    dest: /tmp/nvidia-container-toolkit.list
    mode: "0644"
  when: k3s_nvidia_runtime_state == 'present'

- name: Render NVIDIA container toolkit APT repository list with keyring
  ansible.builtin.shell: >
    sed 's#deb https://#deb [signed-by={{ k3s_nvidia_runtime_keyring_path }}] https://#g'
    /tmp/nvidia-container-toolkit.list
    > {{ k3s_nvidia_runtime_repo_list_path }}
  args:
    creates: "{{ k3s_nvidia_runtime_repo_list_path }}"
  when: k3s_nvidia_runtime_state == 'present'

- name: Ensure apt NVIDIA guest driver package is present on bare-metal GPU guests
  ansible.builtin.apt:
    name: "{{ k3s_nvidia_runtime_driver_package }}"
    state: present
    update_cache: true
    lock_timeout: "{{ k3s_nvidia_runtime_apt_lock_timeout }}"
  register: k3s_nvidia_runtime_driver_package_result
  when:
    - k3s_nvidia_runtime_state == 'present'
    - k3s_nvidia_runtime_install_guest_driver | bool

- name: Hold apt NVIDIA guest driver package to keep the branch pinned
  ansible.builtin.dpkg_selections:
    name: "{{ k3s_nvidia_runtime_driver_package }}"
    selection: hold
  when:
    - k3s_nvidia_runtime_state == 'present'
    - k3s_nvidia_runtime_install_guest_driver | bool
    - k3s_nvidia_runtime_driver_hold | bool

- name: Ensure NVIDIA container toolkit package is present
  ansible.builtin.apt:
    name: "{{ k3s_nvidia_runtime_toolkit_package }}"
    state: present
    update_cache: true
    lock_timeout: "{{ k3s_nvidia_runtime_apt_lock_timeout }}"
  register: k3s_nvidia_runtime_toolkit_package_result
  when: k3s_nvidia_runtime_state == 'present'

- name: Reboot guest after apt NVIDIA guest driver install when package state changed
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when:
    - k3s_nvidia_runtime_state == 'present'
    - k3s_nvidia_runtime_install_guest_driver | bool
    - k3s_nvidia_runtime_driver_package_result is changed

- name: Restart k3s after NVIDIA runtime package changes so containerd runtime is rediscovered
  ansible.builtin.service:
    name: "{{ k3s_nvidia_runtime_k3s_service_name }}"
    state: restarted
  when:
    - k3s_nvidia_runtime_state == 'present'
    - >-
      (k3s_nvidia_runtime_driver_package_result is defined
      and k3s_nvidia_runtime_driver_package_result is changed)
      or (k3s_nvidia_runtime_toolkit_package_result is defined
      and k3s_nvidia_runtime_toolkit_package_result is changed)
      or (k3s_nvidia_runtime_guest_driver_removed is defined
      and k3s_nvidia_runtime_guest_driver_removed is changed)

- name: Validate NVIDIA userspace is available on guest
  ansible.builtin.command:
    cmd: nvidia-smi -L
  register: k3s_nvidia_runtime_nvidia_smi
  changed_when: false
  when:
    - k3s_nvidia_runtime_state == 'present'
    - k3s_nvidia_runtime_validate_nvidia_smi | bool

- name: Validate K3s containerd config exposes an NVIDIA runtime
  ansible.builtin.command:
    cmd: grep nvidia /var/lib/rancher/k3s/agent/etc/containerd/config.toml
  register: k3s_nvidia_runtime_containerd_runtime
  changed_when: false
  when: k3s_nvidia_runtime_state == 'present'

- name: Remove NVIDIA runtime packages when absent requested
  ansible.builtin.apt:
    name:
      - "{{ k3s_nvidia_runtime_driver_package }}"
      - "{{ k3s_nvidia_runtime_toolkit_package }}"
    state: absent
    purge: true
    autoremove: true
    lock_timeout: "{{ k3s_nvidia_runtime_apt_lock_timeout }}"
  when: k3s_nvidia_runtime_state == 'absent'

- name: Report NVIDIA runtime readiness
  ansible.builtin.debug:
    msg:
      install_guest_driver: "{{ k3s_nvidia_runtime_install_guest_driver }}"
      remove_guest_driver: "{{ k3s_nvidia_runtime_remove_guest_driver }}"
      nvidia_smi: "{{ k3s_nvidia_runtime_nvidia_smi.stdout_lines | default([]) }}"
      containerd_nvidia_runtime: "{{ k3s_nvidia_runtime_containerd_runtime.stdout_lines | default([]) }}"
  when: k3s_nvidia_runtime_state == 'present'
