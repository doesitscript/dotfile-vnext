---
k3s_nvidia_runtime_state: present
k3s_nvidia_runtime_driver_package: nvidia-driver-580-server-open
k3s_nvidia_runtime_toolkit_package: nvidia-container-toolkit
k3s_nvidia_runtime_driver_hold: true
k3s_nvidia_runtime_install_guest_driver: true
k3s_nvidia_runtime_remove_guest_driver: false
k3s_nvidia_runtime_validate_nvidia_smi: true
k3s_nvidia_runtime_apt_lock_timeout: 300
k3s_nvidia_runtime_apt_lock_wait_retries: 60
k3s_nvidia_runtime_apt_lock_wait_delay: 5
k3s_nvidia_runtime_guest_driver_packages:
  - "{{ k3s_nvidia_runtime_driver_package }}"
  - nvidia-dkms-580-server-open
k3s_nvidia_runtime_repo_list_path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
k3s_nvidia_runtime_keyring_path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
k3s_nvidia_runtime_k3s_service_name: k3s
