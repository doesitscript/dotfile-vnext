---
argument_specs:
  main:
    short_description: >-
      Install Microsoft Remote Desktop on macOS and manage LAN bookmarks,
      Keychain password, and RDP certificate trust.
    options:
      remote_desktop_mac_tap_name:
        type: str
        default: junian/homebrew-mirrors
      remote_desktop_mac_cask_name:
        type: str
        default: microsoft-remote-desktop-for-macos12
      remote_desktop_mac_app_path:
        type: str
        default: /Applications/Microsoft Remote Desktop.app
      remote_desktop_mac_pkg_id:
        type: str
        default: com.microsoft.rdc.macos
      remote_desktop_mac_verify_install:
        type: bool
        default: true
      remote_desktop_mac_attempt_stabilization:
        type: bool
        default: false
      remote_desktop_mac_enforce_stabilization:
        type: bool
        default: false
      remote_desktop_mac_stabilization_become:
        type: bool
        default: false
      remote_desktop_mac_state:
        type: str
        choices: [present, absent]
        default: present
      remote_desktop_mac_manage_connections:
        type: bool
        default: true
      remote_desktop_mac_trust_certs:
        type: bool
        default: true
      remote_desktop_mac_deploy_rdp_files:
        type: bool
        default: true
      remote_desktop_mac_manage_hosts_aliases:
        type: bool
        default: true
      remote_desktop_mac_username:
        type: str
        required: false
      remote_desktop_mac_password:
        type: str
        required: false
      remote_desktop_mac_connections:
        type: list
        elements: dict
        required: false
      remote_desktop_mac_trust_labels:
        type: list
        elements: str
        required: false
      remote_desktop_mac_cert_cache_dir:
        type: path
        required: false
