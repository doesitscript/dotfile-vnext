- name: Process hub role for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == "Darwin"

- name: Process hub role for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Process hub role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"

- name: Deploy hub shell aliases to .bashrc.d (Unix-like systems)
  ansible.builtin.template:
    src: hub_aliases.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/hub.bash"
    mode: "0644"
  when: ansible_facts['system'] != "Windows"
