---
k3s_firewall_rules:
  - name: k3s-API-Server-In-TCP
    port: 6443
    protocol: tcp
    description: "k3s API server (port 6443)"

  - name: k3s-Flannel-VXLAN-In-UDP
    port: 8472
    protocol: udp
    description: "k3s Flannel VXLAN overlay (port 8472)"

  - name: k3s-Kubelet-In-TCP
    port: 10250
    protocol: tcp
    description: "k3s kubelet metrics/exec (port 10250)"
