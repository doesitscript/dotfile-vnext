# regenerate_controller_ssh_key: true | false (default: false)
# ansible-playbook playbooks/access_controller.yaml -i inventory/inventory.yaml --limit execution_nodes -e regenerate_controller_ssh_key=true -vvv
# ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml  --limit server-225-win  -e regenerate_controller_ssh_key=true
---
- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ controller_ssh_dir }}"
    state: directory
    mode: "0700"

- name: Ensure controller SSH keypair exists
  community.crypto.openssh_keypair:
    path: "{{ controller_ssh_private_key_path }}"
    type: ed25519
    state: present
    force: "{{ regenerate_controller_ssh_key | default(false) }}"
  register: controller_ssh_keypair_result
  delegate_to: "{{ groups['execution_nodes'][0] }}"

- name: Read controller public key file content
  ansible.builtin.slurp:
    src: "{{ controller_ssh_public_key_path }}"
  register: controller_pubkey_slurp
  delegate_to: "{{ groups['execution_nodes'][0] }}"

# controller facts = canonical interface for the rest of the repo
- name: Publish controller public key path (host fact)
  ansible.builtin.set_fact:
    execution_node_pub_key_path: "{{ controller_ssh_public_key_path }}"
    cacheable: true

- name: Publish controller private key path (host fact, for SSH client -i)
  ansible.builtin.set_fact:
    execution_node_private_key_path: "{{ controller_ssh_private_key_path }}"
    cacheable: true

- name: Publish controller public key content (host fact)
  ansible.builtin.set_fact:
    execution_node_pub_key_content: "{{ controller_pubkey_slurp.content | b64decode | trim }}"
    cacheable: true

# optional: known_hosts, OFF by default
- name: Manage known_hosts entries (optional)
  when:
    - controller_manage_known_hosts | bool
    - controller_known_hosts_targets | length > 0
  block:
    - name: Ensure known_hosts file exists
      ansible.builtin.file:
        path: "{{ controller_ssh_dir }}/known_hosts"
        state: touch
        mode: "0644"

    - name: Add target fingerprints
      ansible.builtin.known_hosts:
        path: "{{ controller_ssh_dir }}/known_hosts"
        name: "{{ item.host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -p ' ~ (item.port | default(22)) ~ ' -H ' ~ item.host) }}"
        state: present
      loop: "{{ controller_known_hosts_targets }}"


- name: Debug controller SSH keypair result
  ansible.builtin.debug:
    var: controller_ssh_keypair_result