---
# access_identity_controller: generate SSH keypair on execution node, publish key facts.
#
# regenerate_controller_ssh_key: true | false (default: false)
#   ansible-playbook playbooks/access_controller.yaml -i inventory/inventory.yaml --limit execution_nodes
#   ansible-playbook playbooks/access_controller.yaml -i inventory/inventory.yaml --limit execution_nodes -e regenerate_controller_ssh_key=true -vvv
#

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ controller_ssh_dir }}"
    state: directory
    mode: "0700"

- name: Ensure controller SSH keypair exists
  community.crypto.openssh_keypair:
    path: "{{ controller_ssh_private_key_path }}"
    type: ed25519
    state: present
    force: "{{ regenerate_controller_ssh_key | default(false) }}"
  register: controller_keypair_result

- name: Read controller public key file content
  ansible.builtin.slurp:
    src: "{{ controller_ssh_public_key_path }}"
  register: controller_pubkey_slurp

# Controller facts = canonical interface for the rest of the repo.
# cacheable: true keeps these across plays within the same ansible-playbook invocation.
- name: Publish controller public key path (host fact)
  ansible.builtin.set_fact:
    execution_node_pub_key_path: "{{ controller_ssh_public_key_path }}"
    cacheable: true

- name: Publish controller private key path (host fact)
  ansible.builtin.set_fact:
    execution_node_private_key_path: "{{ controller_ssh_private_key_path }}"
    cacheable: true

- name: Publish controller public key content (host fact)
  ansible.builtin.set_fact:
    execution_node_pub_key_content: "{{ controller_pubkey_slurp.content | b64decode | trim }}"
    cacheable: true

# Optional: known_hosts management (OFF by default)
- name: Manage known_hosts entries (optional)
  when:
    - controller_manage_known_hosts | bool
    - controller_known_hosts_targets | length > 0
  block:
    - name: Ensure known_hosts file exists
      ansible.builtin.file:
        path: "{{ controller_ssh_dir }}/known_hosts"
        state: touch
        mode: "0644"

    - name: Add target fingerprints to known_hosts
      ansible.builtin.known_hosts:
        path: "{{ controller_ssh_dir }}/known_hosts"
        name: "{{ item.host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -p ' ~ (item.port | default(22)) ~ ' -H ' ~ item.host) }}"
        state: present
      loop: "{{ controller_known_hosts_targets }}"

- name: Display controller keypair summary
  ansible.builtin.debug:
    msg:
      keypair_changed: "{{ controller_keypair_result is changed }}"
      fingerprint: "{{ controller_keypair_result.fingerprint | default('n/a') }}"
      public_key_path: "{{ controller_ssh_public_key_path }}"
      public_key_content: "{{ controller_pubkey_slurp.content | b64decode | trim }}"

# --- SSH client config lives in tasks/ssh_config.yml (separate entry point) ---
# Run via: include_role: name=access_identity_controller tasks_from=ssh_config.yml
# See playbooks/access.yaml for the orchestration that calls it after target setup.
