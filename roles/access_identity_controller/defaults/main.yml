---
# access_identity_controller: SSH key path and optional known_hosts. Override via group_vars / -e.
controller_ssh_dir: "{{ lookup('env','HOME') }}/.ssh"
controller_ssh_key_basename: "id_ed25519_ansible"
controller_ssh_private_key_path: "{{ controller_ssh_dir }}/{{ controller_ssh_key_basename }}"
controller_ssh_public_key_path: "{{ controller_ssh_private_key_path }}.pub"

# SSH client config: template ~/.ssh/config from deployed ssh_targets facts.
# Set to false to skip (e.g. if you hand-manage the config).
controller_manage_ssh_config: true

# optional: manage known_hosts (keep default false to avoid "extra" behavior)
controller_manage_known_hosts: false
controller_known_hosts_targets: []   # list of dicts: [{ host: "server-225-win", port: 22 }]
