---
argument_specs:
  main:
    short_description: Manage Hugging Face Hub CLI on macOS via pipx.
    options:
      huggingface_cli_mac_state:
        type: str
        default: absent
        choices:
          - present
          - absent
      huggingface_cli_mac_package_name:
        type: str
        default: huggingface_hub
      huggingface_cli_mac_package_version:
        type: str
        required: false
      huggingface_cli_mac_package_spec:
        type: str
        required: false
      huggingface_cli_mac_pipx_executable:
        type: str
        default: pipx
      huggingface_cli_mac_force_reinstall:
        type: bool
        default: false
      huggingface_cli_mac_global_bin_dir:
        type: str
        required: false
      huggingface_cli_mac_manage_env:
        type: bool
        default: true
      huggingface_cli_mac_env_file:
        type: str
        required: false
      huggingface_cli_mac_hf_home:
        type: str
        required: false
      huggingface_cli_mac_shell_snippet:
        type: str
        required: false
      huggingface_cli_mac_require_token:
        type: bool
        default: true
        description: >-
          When true, present requires vault_hf_token and logs the hf CLI in.
      huggingface_cli_mac_load_vault:
        type: bool
        default: true
        description: >-
          When true, load vault_hf_token from the shared vault file.
      huggingface_cli_mac_vault_file:
        type: str
        required: false
        description: Path to shared vault YAML providing vault_hf_token.
      huggingface_cli_mac_cli_home:
        type: str
        required: false
        description: Local directory for the hf CLI token store. Not the public share.
      huggingface_cli_mac_token_path:
        type: str
        required: false
        description: Local HF_TOKEN_PATH written by hf auth login.
      huggingface_cli_mac_hf_token:
        type: str
        required: false
        description: >-
          Optional HF token override. When empty, vault_hf_token is required.
      huggingface_cli_mac_verify:
        type: bool
        default: true
