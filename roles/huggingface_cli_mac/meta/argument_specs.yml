---
argument_specs:
  main:
    short_description: Manage Hugging Face Hub CLI on macOS via pipx.
    options:
      huggingface_cli_mac_state:
        type: str
        default: absent
        choices:
          - present
          - absent
      huggingface_cli_mac_package_name:
        type: str
        default: huggingface_hub
      huggingface_cli_mac_package_version:
        type: str
        required: false
      huggingface_cli_mac_package_spec:
        type: str
        required: false
      huggingface_cli_mac_pipx_executable:
        type: str
        default: pipx
      huggingface_cli_mac_force_reinstall:
        type: bool
        default: false
      huggingface_cli_mac_global_bin_dir:
        type: str
        required: false
      huggingface_cli_mac_manage_env:
        type: bool
        default: true
      huggingface_cli_mac_env_file:
        type: str
        required: false
      huggingface_cli_mac_hf_home:
        type: str
        required: false
      huggingface_cli_mac_shell_snippet:
        type: str
        required: false
      huggingface_cli_mac_load_vault:
        type: bool
        default: true
        description: >-
          When true, optionally load vault_hf_token from the shared vault file.
          Missing file or empty token does not fail the role.
      huggingface_cli_mac_vault_file:
        type: str
        required: false
        description: Path to shared vault YAML providing vault_hf_token.
      huggingface_cli_mac_hf_token:
        type: str
        required: false
        description: >-
          Optional HF token override. When empty, vault_hf_token is used if
          present. Empty override + empty vault still installs the CLI.
      huggingface_cli_mac_verify:
        type: bool
        default: true
