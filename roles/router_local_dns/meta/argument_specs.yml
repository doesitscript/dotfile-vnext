---
argument_specs:
  main:
    short_description: Stock ASUS GT6 local DNS via manual DHCP assignments (preview)
    description:
      - >-
        Desired-state contract for LAN-wide hostnames on stock GT6 firmware.
        Automation is not implemented; present state fails with operator guidance.
      - >-
        Canonical row data lives in inventory/group_vars/all/homelab_router_gt6.yml.
    options:
      router_local_dns_state:
        type: str
        description: Lifecycle gate for router local DNS capability.
        choices:
          - present
          - absent
        default: absent
      router_local_dns_automation_enabled:
        type: bool
        description: When false, present state only previews and then fails with operator steps.
        default: false
