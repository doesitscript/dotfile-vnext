---
zed_ide_state: absent
zed_ide_install_cask: true
zed_ide_cask_name: "zed"

zed_ide_config_dir: "{{ ansible_env.HOME }}/.config/zed"
zed_ide_settings_path: "{{ zed_ide_config_dir }}/settings.json"
zed_ide_env_path: "{{ zed_ide_config_dir }}/openai.env"
zed_ide_launcher_path: "{{ ansible_env.HOME }}/.local/bin/zed-homelab"

zed_ide_api_key: ""
zed_ide_vault_file_path: "{{ inventory_dir }}/../vault/shared.vault.yml"
zed_ide_gateway_api_url: "http://litellm.hom.lab/v1"
zed_ide_models: []

zed_ide_default_model:
  provider: "openai"
  model: ""
zed_ide_inline_assistant_model:
  provider: "openai"
  model: ""
zed_ide_commit_message_model:
  provider: "openai"
  model: ""
zed_ide_thread_summary_model:
  provider: "openai"
  model: ""
zed_ide_compaction_model:
  provider: "openai"
  model: ""
zed_ide_subagent_model:
  provider: "openai"
  model: ""

zed_ide_inline_alternatives: []
zed_ide_model_parameters: []
zed_ide_commit_message_instructions: ""
zed_ide_auto_compact:
  enabled: true
  threshold: "90%"
zed_ide_edit_predictions_enabled: false

zed_ide_edit_predictions:
  mode: "eager"
  provider: "ollama"
  ollama:
    api_url: "http://127.0.0.1:11434"
    model: "REPLACE_WITH_LOCAL_SMALL_MODEL"
    prompt_format: "qwen"
    max_output_tokens: 512

zed_ide_context_servers: {}
