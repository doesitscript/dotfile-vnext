---
argument_specs:
  main:
    short_description: Optionally install Zed and manage its homelab AI configuration
    options:
      zed_ide_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      zed_ide_install_cask:
        type: bool
        required: false
        default: true
        description: >-
          When true, manage the Zed Homebrew cask. Set false to deploy
          settings/launcher only and leave an existing Zed install untouched.
      zed_ide_cask_name:
        type: str
        required: false
        default: "zed"
      zed_ide_config_dir:
        type: str
        required: false
        default: "{{ ansible_env.HOME }}/.config/zed"
      zed_ide_settings_path:
        type: str
        required: false
        default: "{{ zed_ide_config_dir }}/settings.json"
      zed_ide_env_path:
        type: str
        required: false
        default: "{{ zed_ide_config_dir }}/openai.env"
      zed_ide_launcher_path:
        type: str
        required: false
        default: "{{ ansible_env.HOME }}/.local/bin/zed-homelab"
      zed_ide_api_key:
        type: str
        required: false
        default: ""
      zed_ide_gateway_api_url:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
      zed_ide_models:
        type: list
        elements: dict
        required: false
      zed_ide_default_model:
        type: dict
        required: false
      zed_ide_inline_assistant_model:
        type: dict
        required: false
      zed_ide_commit_message_model:
        type: dict
        required: false
      zed_ide_thread_summary_model:
        type: dict
        required: false
      zed_ide_compaction_model:
        type: dict
        required: false
      zed_ide_subagent_model:
        type: dict
        required: false
      zed_ide_inline_alternatives:
        type: list
        elements: dict
        required: false
      zed_ide_model_parameters:
        type: list
        elements: dict
        required: false
      zed_ide_commit_message_instructions:
        type: str
        required: false
        default: ""
      zed_ide_auto_compact:
        type: dict
        required: false
      zed_ide_edit_predictions_enabled:
        type: bool
        required: false
        default: false
      zed_ide_edit_predictions:
        type: dict
        required: false
      zed_ide_context_servers:
        type: dict
        required: false
