---
# logging_loki — API contract.
#
# Deploys Grafana Loki as a Docker container with filesystem storage.
# Override in host_vars or group_vars/logging_server.yaml.

# Loki server version (grafana/loki Docker image tag)
logging_loki_version: "3.6.7"

# Port Loki listens on (host-mapped)
logging_loki_port: 3100

# Directory on the host for Loki config and persistent data
logging_loki_data_path: "/opt/loki"

# Log retention in days
logging_loki_retention_days: 30

# Whether to also deploy a Grafana container alongside Loki
logging_loki_deploy_grafana: true

# Grafana image tag
logging_loki_grafana_version: "latest"

# Port Grafana listens on (host-mapped)
logging_loki_grafana_port: 3000

# Grafana admin password — NO DEFAULT. Must be set in inventory via vault.
# See inventory/group_vars/logging_server/vars.yml for the reference pattern.
# logging_loki_grafana_admin_password: — intentionally undefined, argument_specs enforces required: true

# Docker network name shared by Loki and Grafana
logging_loki_docker_network: "logging"

# Host-side readiness monitor. The official Loki image is distroless and cannot
# execute an in-container HTTP healthcheck, so systemd probes Loki's /ready
# endpoint from the Docker host.
logging_loki_readiness_monitor_enabled: true
logging_loki_readiness_monitor_interval: "1min"
