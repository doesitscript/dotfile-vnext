---
argument_specs:
  main:
    short_description: LiteLLM gateway on K3s
    options:
      k3s_litellm_gateway_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the LiteLLM gateway capability.
      k3s_litellm_gateway_namespace:
        type: str
        default: litellm
        description: Kubernetes namespace for the LiteLLM Helm release.
      k3s_litellm_gateway_master_key:
        type: str
        default: sk-Pass@w0rd1
        description: Fallback master key when vault_k3s_litellm_gateway_master_key is unset.
      k3s_litellm_gateway_env_secret_name:
        type: str
        default: litellm-env-secret
        description: Kubernetes Secret name exported via Helm environmentSecrets.
      k3s_litellm_gateway_db_port:
        type: int
        default: 5432
        description: TCP port for the external PostgreSQL endpoint used by LiteLLM.
      k3s_litellm_gateway_trim_messages_enabled:
        type: bool
        default: true
        description: >-
          Mount LiteLLM pre-call trim_messages at /etc/litellm/custom_callbacks.py
          (beside config), restart the Deployment after ConfigMap apply (subPath
          remount), and wait up to 600s for rollout under memory pressure.
      k3s_litellm_gateway_trim_messages_max_input_tokens:
        type: int
        default: 24000
        description: >-
          Homelab input budget under the 32k vLLM window (server-tuned).
      k3s_litellm_gateway_trim_messages_safety_tokens:
        type: int
        default: 2048
        description: >-
          Extra headroom for chat-template and LiteLLM vs vLLM tokenizer skew.
      k3s_litellm_gateway_trim_messages_min_completion_tokens:
        type: int
        default: 4096
        description: >-
          Preferred completion when the client sends max_tokens 0; adaptively
          lowered when tools leave less room under the 32k window.
      k3s_litellm_gateway_trim_messages_min_message_tokens:
        type: int
        default: 2048
        description: >-
          Minimum tokens reserved for chat messages after tools/completion.
      k3s_litellm_gateway_trim_messages_chars_per_token:
        type: float
        default: 2.5
        description: >-
          Density for hard-cutting multimodal message content parts.
      k3s_litellm_gateway_trim_messages_skip_models:
        type: list
        elements: str
        required: false
        description: >-
          Client model aliases that skip trim_messages and max_tokens mutation
          (e.g. deepreinforce-ai/Ornith-1.0-35B-GGUF-no-trim).
      k3s_litellm_gateway_trim_messages_callback_configmap:
        type: str
        default: litellm-callback-files
        description: ConfigMap name that holds custom_callbacks.py.
