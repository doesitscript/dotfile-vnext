---
argument_specs:
  main:
    short_description: LiteLLM gateway on K3s
    options:
      k3s_litellm_gateway_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the LiteLLM gateway capability.
      k3s_litellm_gateway_namespace:
        type: str
        default: litellm
        description: Kubernetes namespace for the LiteLLM Helm release.
      k3s_litellm_gateway_master_key:
        type: str
        default: sk-Pass@w0rd1
        description: Fallback master key when vault_k3s_litellm_gateway_master_key is unset.
      k3s_litellm_gateway_env_secret_name:
        type: str
        default: litellm-env-secret
        description: Kubernetes Secret name exported via Helm environmentSecrets.
      k3s_litellm_gateway_db_port:
        type: int
        default: 5432
        description: TCP port for the external PostgreSQL endpoint used by LiteLLM.
      k3s_litellm_gateway_request_inspector_enabled:
        type: bool
        default: true
        description: >-
          Mount LiteLLM Request Inspector at /etc/litellm/custom_callbacks.py
          (beside config), restart the Deployment after ConfigMap apply (subPath
          remount), and wait up to 600s for rollout under memory pressure.
          Observe-only — does not trim messages. Archived trim path:
          archive/trim-messages-callback-2026-07/.
      k3s_litellm_gateway_request_inspector_max_window:
        type: int
        default: 32768
        description: Context window used for budget warnings and report fields.
      k3s_litellm_gateway_request_inspector_safety_tokens:
        type: int
        default: 2048
        description: Safety headroom field included in inspector reports.
      k3s_litellm_gateway_request_inspector_chars_per_token:
        type: float
        default: 2.5
        description: Density estimate for tools[] and message content sizing.
      k3s_litellm_gateway_request_inspector_warn_tools_pct:
        type: float
        default: 0.75
        description: Warn when tools estimate exceeds this fraction of max_window.
      k3s_litellm_gateway_request_inspector_warn_conversation_pct:
        type: float
        default: 0.05
        description: >-
          Warn when conversation share is below this fraction of max_window
          while tools dominate.
      k3s_litellm_gateway_request_inspector_dump_tools_on_warn:
        type: bool
        default: true
        description: Write a small summary JSON dump when warnings fire.
      k3s_litellm_gateway_request_inspector_callback_configmap:
        type: str
        default: litellm-callback-files
        description: ConfigMap name that holds custom_callbacks.py.
