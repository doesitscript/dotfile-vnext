---
# LiteLLM Gateway on K3s configuration
k3s_litellm_gateway_state: present
k3s_litellm_gateway_namespace: litellm
k3s_litellm_gateway_release_name: litellm
k3s_litellm_gateway_chart_repo: https://charts.litellm.ai
k3s_litellm_gateway_chart_name: litellm-helm
k3s_litellm_gateway_chart_version: "" # Empty = latest
k3s_litellm_gateway_replicas: 1
k3s_litellm_gateway_strategy:
  type: Recreate

# Standard proxy image — external Postgres on langfuse platform stack; not litellm-database.
k3s_litellm_gateway_image_repository: docker.litellm.ai/berriai/litellm
k3s_litellm_gateway_image_tag: main-latest

# Upstream LiteLLM images omit Pillow; Ollama vision/image payloads fail with:
#   ModuleNotFoundError: No module named 'PIL'
#   ollama image conversion failed please run `pip install Pillow`
# Bootstrap on container start until the image includes Pillow (BerriAI/litellm#27183).
k3s_litellm_gateway_pillow_bootstrap_enabled: true
k3s_litellm_gateway_command:
  - /bin/bash
  - -lc
k3s_litellm_gateway_args:
  - >-
    set -euo pipefail;
    /app/.venv/bin/python -m ensurepip --upgrade >/dev/null 2>&1 || true;
    /app/.venv/bin/python -m pip install -q 'Pillow';
    exec /app/.venv/bin/litellm --config /etc/litellm/config.yaml

# LiteLLM master key — override via vault/k3s_litellm_gateway_master_key at deploy time.
k3s_litellm_gateway_master_key: "sk-Pass@w0rd1"
k3s_litellm_gateway_env_secret_name: litellm-env-secret

# External PostgreSQL — Bitnami subchart disabled via db.deployStandalone.
# db.endpoint/db.url must use langfuse_platform_external_postgres_connect_address (IP), never inventory_hostname.
k3s_litellm_gateway_db_deploy_standalone: false
k3s_litellm_gateway_db_use_existing: true
k3s_litellm_gateway_db_endpoint: "{{ langfuse_platform_external_postgres_connect_address }}"
k3s_litellm_gateway_db_port: "{{ langfuse_platform_external_postgres_port | default(5432) }}"
k3s_litellm_gateway_db_database: litellm
# Ansible inventory host for delegate_to DB prep tasks — NOT a TCP connect target.
k3s_litellm_gateway_postgres_inventory_host: hom-lab-ctl-dkr-01
k3s_litellm_gateway_postgres_compose_dir: /srv/stacks/network
k3s_litellm_gateway_db_secret_name: litellm-external-postgres
k3s_litellm_gateway_db_secret_username_key: username
k3s_litellm_gateway_db_secret_password_key: password
# Overwritten from vault in tasks/load_vault.yml at deploy time.
k3s_litellm_gateway_db_url: >-
  postgresql://{{ langfuse_platform_external_postgres_user }}:{{ langfuse_platform_external_postgres_password | urlencode
  }}@{{ langfuse_platform_external_postgres_connect_address }}:{{ k3s_litellm_gateway_db_port }}/{{ k3s_litellm_gateway_db_database }}

# Service exposure
k3s_litellm_gateway_service_type: ClusterIP
k3s_litellm_gateway_service_port: 4000
# Supplemental NodePort for LAN/Mac access (Helm chart does not expose nodePort).
k3s_litellm_gateway_lan_node_port_enabled: true
k3s_litellm_gateway_lan_node_port: 30400
k3s_litellm_gateway_lan_service_name: litellm-lan

# Resource limits (single-node cluster)
k3s_litellm_gateway_cpu_limit: "500m"
k3s_litellm_gateway_memory_limit: "2Gi"
k3s_litellm_gateway_cpu_request: "100m"
k3s_litellm_gateway_memory_request: "768Mi"

# Langfuse integration — keys resolved from vault/shared.vault.yml at deploy time.
k3s_litellm_gateway_langfuse_enabled: true
k3s_litellm_gateway_langfuse_host: "http://langfuse-web.langfuse.svc.cluster.local:3000"
k3s_litellm_gateway_langfuse_public_key: "{{ vault_shared_langfuse_public_key | default('lf_pk_Pass@w0rd1') }}"
k3s_litellm_gateway_langfuse_secret_key: "{{ vault_shared_langfuse_secret_key | default('lf_sk_Pass@w0rd1') }}"
k3s_litellm_gateway_proxy_litellm_settings: "{{ {'success_callback': ['langfuse']} if k3s_litellm_gateway_langfuse_enabled | bool else {} }}"
k3s_litellm_gateway_router_settings: {}
k3s_litellm_gateway_enable_pre_call_checks: true
# AI Request Inspector — observe-only LiteLLM callback (no message mutation).
# Mount: /etc/litellm/custom_callbacks.py (beside config.yaml — not /app/).
# Emits structured JSON lines: litellm request_inspector {...}
# Former trim_messages mutate path archived at:
#   archive/trim-messages-callback-2026-07/
# subPath mounts need rollout restart; present.yml waits up to 600s.
k3s_litellm_gateway_request_inspector_enabled: true
k3s_litellm_gateway_request_inspector_callback_configmap: litellm-callback-files
k3s_litellm_gateway_request_inspector_callback_ref: custom_callbacks.proxy_handler_instance
k3s_litellm_gateway_request_inspector_max_window: 32768
k3s_litellm_gateway_request_inspector_safety_tokens: 2048
k3s_litellm_gateway_request_inspector_chars_per_token: 2.5
# Warn when tools[] estimate exceeds this fraction of max_window.
k3s_litellm_gateway_request_inspector_warn_tools_pct: 0.75
# Warn when conversation share is below this fraction (and tools dominate).
k3s_litellm_gateway_request_inspector_warn_conversation_pct: 0.05
# On warning, dump a small summary JSON under /tmp/litellm-request-inspector.
k3s_litellm_gateway_request_inspector_dump_tools_on_warn: true
k3s_litellm_gateway_context_window_fallbacks_with_openai: []
k3s_litellm_gateway_context_window_fallbacks_without_openai: []

# Complexity auto-router (MODEL GROUP) — disabled for Kilo clean setup.
k3s_litellm_gateway_complexity_router_enabled: false

# Local vLLM backend contract. Primary coding + review aliases share vllm-primary
# until a second local vLLM runtime is commissioned.
k3s_litellm_gateway_primary_vllm_api_base: "http://vllm-primary.vllm-runtime.svc.cluster.local:8000/v1" #FIXME: v1 is note part of the base
k3s_litellm_gateway_primary_vllm_model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
k3s_litellm_gateway_secondary_review_runtime_slug: "vllm-primary"
k3s_litellm_gateway_secondary_review_api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
k3s_litellm_gateway_secondary_review_model: "{{ k3s_litellm_gateway_primary_vllm_model }}"

# Homelab local routes — Continue + Kilo (model@host only).
k3s_litellm_gateway_lane_contract:
  - lane: qwen2.5-coder-32b@k3s02-vllm
    state: enabled
    backend_kind: local-vllm
    runtime: vllm-primary
    reason: Continue chat on 5090 — 32B AWQ @ 32k with fp8 KV cache (gpu-memory-utilization 0.92).
  - lane: qwen2.5-coder-7b@desktop
    state: enabled
    backend_kind: ollama-desktop
    runtime: ollama-qwen25-coder-7b-desktop
    reason: Continue edit/apply on desktop Ollama.
  - lane: qwen2.5-coder-1.5b@hvh01
    state: enabled
    backend_kind: ollama-hvh01
    runtime: ollama-autocomplete-1.5b-hvh-01
    reason: Continue autocomplete on HVH-01 (GTX 1060).
  - lane: ministral-3-8b@desktop
    state: enabled
    backend_kind: ollama-desktop
    runtime: ollama-ministral-8b-desktop
    reason: Kilo agent fallback on desktop Ollama.

# RETIRED lane vocabulary — blocked; see git history before re-enabling.
# - lane: smart-router  (MODEL GROUP — removed)
# - lane: coder-primary / code-review / experiment / default  (duplicate vLLM aliases)
# - lane: code-fast / continue-* / open-webui-* / gpt-oss-20b  (non-Kilo downloads)

# Model routes — api_key os.environ/* keys are injected via Kubernetes Secret litellm-env-secret.
#
# Do not confuse this LiteLLM `model_list` with the durable model catalog:
# - `k3s_litellm_gateway_model_list` is the client-facing gateway route list.
# - `inventory/group_vars/model_catalog/manifest.yml` is the HF/storage catalog
#   SSOT for candidate/downloaded/served model weights.
# - `model_info` below carries route metadata exposed by LiteLLM `/model/info`
#   and used by Langfuse/client tracing. Per-request `agent_role` and
#   `context_class` still come from the IDE/agent client metadata.
# Kilo clean setup: static model_list is empty — routes are appended in
# build_helm_values.yml when host_vars commission api_bases (vLLM + Ollama).
k3s_litellm_gateway_model_list: []

# Cloud / Anthropic fragments disabled for Kilo clean setup.
k3s_litellm_gateway_anthropic_model_routes: []

# -----------------------------------------------------------------------------
# Continue / local open-weight lanes (NOT OpenRouter, NOT Mercury).
# Pattern (LiteLLM docs): stable model_name → provider/model + api_base + model_info.
# Autocomplete 1.5B on HVH-01 uses Ollama's OpenAI-compatible /v1 (llama.cpp engine)
# because GTX 1060 is Pascal CC 6.1 — current vLLM wants CC >= 7.5.
# Catalog SSOT: inventory/group_vars/model_catalog/manifest.yml
# -----------------------------------------------------------------------------
k3s_litellm_gateway_autocomplete_1_5b_api_base: ""
# Served model id at the OpenAI-compatible backend (Ollama tag or vLLM --served-model-name).
k3s_litellm_gateway_autocomplete_1_5b_model: "qwen2.5-coder:1.5b"
# LiteLLM provider prefix: openai for Ollama/llama.cpp OpenAI servers; hosted_vllm for vLLM.
k3s_litellm_gateway_autocomplete_1_5b_provider: "openai"
k3s_litellm_gateway_autocomplete_7b_api_base: ""
k3s_litellm_gateway_autocomplete_7b_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
k3s_litellm_gateway_autocomplete_7b_provider: "hosted_vllm"
# Kilo optional 5090 vLLM smoke lanes (mutually exclusive with 32B primary on single GPU).
# Official Qwen AWQ quants — faster cold start / lower VRAM than 32B AWQ.
k3s_litellm_gateway_kilo_lite_vllm_api_base: ""
k3s_litellm_gateway_kilo_lite_vllm_model: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
k3s_litellm_gateway_kilo_lite_vllm_provider: "hosted_vllm"
k3s_litellm_gateway_kilo_smoke_vllm_api_base: ""
k3s_litellm_gateway_kilo_smoke_vllm_model: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
k3s_litellm_gateway_kilo_smoke_vllm_provider: "hosted_vllm"
# Prefer FP8/NVFP4 quantized DiffusionGemma on 32GB GPUs; BF16 recipe expects ~64GB.
k3s_litellm_gateway_diffusiongemma_api_base: ""
k3s_litellm_gateway_diffusiongemma_model: "RedHatAI/diffusiongemma-26B-A4B-it-FP8-dynamic"
k3s_litellm_gateway_diffucoder_api_base: ""
k3s_litellm_gateway_diffucoder_model: "apple/DiffuCoder-7B-cpGRPO"

# Continue edit → desktop AMD Ollama (openai-compatible). When set, takes
# continue-edit alias instead of DiffuCoder wrapper.
k3s_litellm_gateway_continue_edit_api_base: ""
k3s_litellm_gateway_continue_edit_model: "qwen2.5-coder:7b"
k3s_litellm_gateway_continue_edit_provider: "openai"
# Continue apply → HVH-01 Ollama Phi-4 Mini.
k3s_litellm_gateway_continue_apply_api_base: ""
k3s_litellm_gateway_continue_apply_model: "phi4-mini"
k3s_litellm_gateway_continue_apply_provider: "openai"

# Open WebUI chat → desktop Ollama (official library tags).
# Set api_base when the desktop Ollama route should be listed in LiteLLM.
# LiteLLM model_name uses hyphenated aliases; Ollama pull tags keep the colon.
k3s_litellm_gateway_gemma4_chat_api_base: ""
k3s_litellm_gateway_gemma4_chat_model: "gemma4:12b"
k3s_litellm_gateway_gemma4_chat_provider: "ollama"

k3s_litellm_gateway_qwen36_chat_api_base: ""
k3s_litellm_gateway_qwen36_chat_model: "qwen3.6:27b"
k3s_litellm_gateway_qwen36_chat_provider: "ollama"

k3s_litellm_gateway_gpt_oss_chat_api_base: ""
k3s_litellm_gateway_gpt_oss_chat_model: "gpt-oss:20b"
k3s_litellm_gateway_gpt_oss_chat_provider: "ollama"

# Positive/negative prompt assist alias (pixels stay on ComfyUI / A1111).
# Defaults empty; host_vars pin to desktop Ollama (same engine as gemma4:12b).
k3s_litellm_gateway_positive_negative_prompt_assist_chat_api_base: ""
k3s_litellm_gateway_positive_negative_prompt_assist_chat_model: "gemma4:12b"
k3s_litellm_gateway_positive_negative_prompt_assist_chat_provider: "ollama"

# Open WebUI coder lane on desktop Ollama (devstral:24b — not Kilo primary).
k3s_litellm_gateway_devstral_chat_api_base: ""
k3s_litellm_gateway_devstral_chat_model: "devstral:24b"
k3s_litellm_gateway_devstral_chat_provider: "ollama"

k3s_litellm_gateway_kilo_fast_chat_api_base: ""
k3s_litellm_gateway_kilo_fast_chat_model: "ministral-3:8b"
k3s_litellm_gateway_kilo_fast_chat_provider: "ollama"

k3s_litellm_gateway_local_continue_model_routes: []
# Built at runtime in build_helm_values.yml from the api_base vars above.

# Fallback when vault_shared_openai_api_key is unset — proxy still starts; OpenAI routes omitted.
k3s_litellm_gateway_model_list_without_openai: []
