---
# LiteLLM Gateway on K3s configuration
k3s_litellm_gateway_state: present
k3s_litellm_gateway_namespace: litellm
k3s_litellm_gateway_release_name: litellm
k3s_litellm_gateway_chart_repo: https://charts.litellm.ai
k3s_litellm_gateway_chart_name: litellm-helm
k3s_litellm_gateway_chart_version: "" # Empty = latest
k3s_litellm_gateway_replicas: 1
k3s_litellm_gateway_strategy:
  type: Recreate

# Standard proxy image — external Postgres on fuzlang stack; not litellm-database.
k3s_litellm_gateway_image_repository: docker.litellm.ai/berriai/litellm
k3s_litellm_gateway_image_tag: main-latest

# LiteLLM master key — override via vault/k3s_litellm_gateway_master_key at deploy time.
k3s_litellm_gateway_master_key: "sk-Pass@w0rd1"
k3s_litellm_gateway_env_secret_name: litellm-env-secret

# External PostgreSQL — Bitnami subchart disabled via db.deployStandalone.
# db.endpoint/db.url must use fuzlang_external_postgres_connect_address (IP), never inventory_hostname.
k3s_litellm_gateway_db_deploy_standalone: false
k3s_litellm_gateway_db_use_existing: true
k3s_litellm_gateway_db_endpoint: "{{ fuzlang_external_postgres_connect_address }}"
k3s_litellm_gateway_db_port: "{{ fuzlang_external_postgres_port | default(5432) }}"
k3s_litellm_gateway_db_database: litellm
# Ansible inventory host for delegate_to DB prep tasks — NOT a TCP connect target.
k3s_litellm_gateway_postgres_inventory_host: hom-lab-ctl-dkr-01
k3s_litellm_gateway_postgres_compose_dir: /srv/stacks/network
k3s_litellm_gateway_db_secret_name: litellm-external-postgres
k3s_litellm_gateway_db_secret_username_key: username
k3s_litellm_gateway_db_secret_password_key: password
# Overwritten from vault in tasks/load_vault.yml at deploy time.
k3s_litellm_gateway_db_url: >-
  postgresql://{{ fuzlang_external_postgres_user }}:{{ fuzlang_external_postgres_password | urlencode
  }}@{{ fuzlang_external_postgres_connect_address }}:{{ k3s_litellm_gateway_db_port }}/{{ k3s_litellm_gateway_db_database }}

# Service exposure
k3s_litellm_gateway_service_type: ClusterIP
k3s_litellm_gateway_service_port: 4000
# Supplemental NodePort for LAN/Mac access (Helm chart does not expose nodePort).
k3s_litellm_gateway_lan_node_port_enabled: true
k3s_litellm_gateway_lan_node_port: 30400
k3s_litellm_gateway_lan_service_name: litellm-lan

# Resource limits (single-node cluster)
k3s_litellm_gateway_cpu_limit: "500m"
k3s_litellm_gateway_memory_limit: "2Gi"
k3s_litellm_gateway_cpu_request: "100m"
k3s_litellm_gateway_memory_request: "768Mi"

# Langfuse integration — keys resolved from vault/shared.vault.yml at deploy time.
k3s_litellm_gateway_langfuse_enabled: true
k3s_litellm_gateway_langfuse_host: "http://langfuse-web.langfuse.svc.cluster.local:3000"
k3s_litellm_gateway_langfuse_public_key: "{{ vault_shared_langfuse_public_key | default('lf_pk_Pass@w0rd1') }}"
k3s_litellm_gateway_langfuse_secret_key: "{{ vault_shared_langfuse_secret_key | default('lf_sk_Pass@w0rd1') }}"
k3s_litellm_gateway_proxy_litellm_settings: "{{ {'success_callback': ['langfuse']} if k3s_litellm_gateway_langfuse_enabled | bool else {} }}"
k3s_litellm_gateway_router_settings: {}
k3s_litellm_gateway_enable_pre_call_checks: true
# Pre-call trim_messages hook — shrinks oversized Cursor/agent prompts to fit
# local 32k vLLM context. Disable to remove the ConfigMap mount + callback.
# Mount: /etc/litellm/custom_callbacks.py (beside config.yaml — not /app/).
# Tokenize with hosted_vllm/<primary_vllm_model>; budget accounts for tools +
# chat-template + LiteLLM vs vLLM tokenizer skew; hard-cut multimodal content.
# subPath mounts need rollout restart; present.yml waits up to 600s.
k3s_litellm_gateway_trim_messages_enabled: true
k3s_litellm_gateway_trim_messages_callback_configmap: litellm-callback-files
# Cap well below 32k — Cursor Agent tools inflate the real prompt after trim.
k3s_litellm_gateway_trim_messages_max_input_tokens: 24000
k3s_litellm_gateway_trim_messages_callback_ref: custom_callbacks.proxy_handler_instance
k3s_litellm_gateway_context_window_fallbacks_with_openai:
  - deepreinforce-ai/Ornith-1.0-35B-GGUF:
      - gpt-4o-mini
  - smart-router:
      - gpt-4o-mini
  - code-review:
      - gpt-4o-mini
# Local-only: Ornith and code-review share the same vLLM primary runtime (same
# 32k context). Context-overflow fallbacks to another local alias cannot help —
# require OpenAI/Anthropic keys for a larger-context escalation path.
k3s_litellm_gateway_context_window_fallbacks_without_openai: []

# Complexity auto-router (LiteLLM auto_router/complexity_router, requires >= v1.94.x).
# Clients call model name `smart-router`; LiteLLM classifies SIMPLE/MEDIUM/COMPLEX/REASONING
# and routes to the tier model names below. This is not confidence-based handoff.
k3s_litellm_gateway_complexity_router_enabled: true
k3s_litellm_gateway_complexity_router_model_name: smart-router
k3s_litellm_gateway_complexity_router_default_model: deepreinforce-ai/Ornith-1.0-35B-GGUF
# Local-first tiers. code-review shares vllm-primary until a distinct secondary
# vLLM runtime exists; Ollama is retired from this gateway path.
k3s_litellm_gateway_complexity_tiers_local:
  SIMPLE: code-review
  MEDIUM: deepreinforce-ai/Ornith-1.0-35B-GGUF
  COMPLEX: deepreinforce-ai/Ornith-1.0-35B-GGUF
  REASONING: deepreinforce-ai/Ornith-1.0-35B-GGUF
# OpenAI available: keep local for SIMPLE/MEDIUM; escalate COMPLEX/REASONING to gpt-4o.
k3s_litellm_gateway_complexity_tiers_with_openai:
  SIMPLE: code-review
  MEDIUM: deepreinforce-ai/Ornith-1.0-35B-GGUF
  COMPLEX: gpt-4o
  REASONING: gpt-4o
# Anthropic available: escalate COMPLEX/REASONING to Claude (preferred over OpenAI escalation).
k3s_litellm_gateway_complexity_tiers_with_anthropic:
  SIMPLE: code-review
  MEDIUM: deepreinforce-ai/Ornith-1.0-35B-GGUF
  COMPLEX: claude-sonnet
  REASONING: claude-sonnet
k3s_litellm_gateway_complexity_router_keyword_tier_rules:
  - keywords:
      - hi
      - hello
      - thanks
      - ping
    tier: SIMPLE
  - keywords:
      - ansible
      - playbook
      - terraform
      - kubernetes
      - k3s
      - netbox
      - hyperv
    tier: COMPLEX
  - keywords:
      - architecture
      - design review
      - step by step
      - reason through
    tier: REASONING
k3s_litellm_gateway_complexity_router_custom_technical_keywords:
  - ansible
  - playbook
  - netbox
  - hyperv
  - k3s
  - winrm
  - vault
  - traefik
  - langfuse

# Local vLLM backend contract. Primary coding + review aliases share vllm-primary
# until a second local vLLM runtime is commissioned.
k3s_litellm_gateway_primary_vllm_api_base: "http://vllm-primary.vllm-runtime.svc.cluster.local:8000/v1" #FIXME: v1 is note part of the base
k3s_litellm_gateway_primary_vllm_model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
k3s_litellm_gateway_secondary_review_runtime_slug: "vllm-primary"
k3s_litellm_gateway_secondary_review_api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
k3s_litellm_gateway_secondary_review_model: "{{ k3s_litellm_gateway_primary_vllm_model }}"

# Full lane vocabulary stays visible here even while only part of it is
# runtime-enabled. Blocked/deferred rows are explicit so client and validation
# surfaces can preserve the intended contract without inventing backends.
k3s_litellm_gateway_lane_contract:
  - lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
    state: enabled
    backend_kind: local-vllm
    runtime: vllm-primary
    reason: Primary local coding lane on the 5090-backed vLLM service.
  - lane: experiment
    state: enabled
    backend_kind: local-vllm
    runtime: vllm-primary
    reason: Temporary smoke alias sharing the primary local runtime until a second local runtime exists.
  - lane: code-fast
    state: blocked
    backend_kind: pending
    reason: Awaiting a separate local or provider-backed fast lane decision.
  - lane: code-review
    state: enabled
    backend_kind: local-vllm
    runtime: vllm-primary
    reason: >-
      Review lane alias on vllm-primary (same Qwen2.5-Coder-32B AWQ backend as
      Ornith) until a distinct secondary vLLM runtime is commissioned. Ollama
      is retired from the LiteLLM gateway path.
  - lane: code-test
    state: blocked
    backend_kind: pending
    reason: Test-focused backend and retry policy are not declared yet.
  - lane: ripi-private
    state: blocked
    backend_kind: pending
    reason: Private-only lane needs a dedicated backend and privacy guardrails.
  - lane: embeddings-local
    state: blocked
    backend_kind: pending
    reason: Local embeddings service is not commissioned yet.
  - lane: public-research
    state: blocked
    backend_kind: pending
    reason: Public web/provider lane is still a future policy slice.
  - lane: smart-router
    state: enabled
    backend_kind: complexity-router
    runtime: litellm-auto-router
    reason: >-
      LiteLLM complexity auto-router alias. Routes SIMPLE→code-review (vLLM),
      MEDIUM→Ornith, COMPLEX/REASONING→Claude or gpt-4o when provider keys exist.

# Model routes — api_key os.environ/* keys are injected via Kubernetes Secret litellm-env-secret.
#
# Do not confuse this LiteLLM `model_list` with the durable model catalog:
# - `k3s_litellm_gateway_model_list` is the client-facing gateway route list.
# - `inventory/group_vars/model_catalog/manifest.yml` is the HF/storage catalog
#   SSOT for candidate/downloaded/served model weights.
# - `model_info` below carries route metadata exposed by LiteLLM `/model/info`
#   and used by Langfuse/client tracing. Per-request `agent_role` and
#   `context_class` still come from the IDE/agent client metadata.
k3s_litellm_gateway_model_list:
  - model_name: deepreinforce-ai/Ornith-1.0-35B-GGUF
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      routing_policy: local-primary
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: experiment
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: experiment
      routing_policy: local-smoke-compat
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: code-review
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_secondary_review_model }}"
      api_base: "{{ k3s_litellm_gateway_secondary_review_api_base }}"
      api_key: "none"
    model_info:
      model_lane: code-review
      routing_policy: local-review-alias
      project: ripi
      backend_runtime: "{{ k3s_litellm_gateway_secondary_review_runtime_slug }}"
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      model_lane: gpt-4o-mini
      routing_policy: migration
      project: ripi
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      model_lane: gpt-4o
      routing_policy: cloud-escalation
      project: ripi
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: default
    litellm_params:
      model: gpt-4o-mini
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      model_lane: default
      routing_policy: migration
      project: ripi
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml

# Optional Anthropic route fragment — appended when vault_shared_anthropic_api_key is set.
k3s_litellm_gateway_anthropic_model_routes:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: "os.environ/ANTHROPIC_API_KEY"
    model_info:
      model_lane: claude-sonnet
      routing_policy: cloud-escalation
      project: ripi
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml

# Fallback when vault_shared_openai_api_key is unset — proxy still starts; OpenAI routes omitted.
k3s_litellm_gateway_model_list_without_openai:
  - model_name: deepreinforce-ai/Ornith-1.0-35B-GGUF
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      routing_policy: local-primary
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: experiment
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: experiment
      routing_policy: local-smoke-compat
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: code-review
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_secondary_review_model }}"
      api_base: "{{ k3s_litellm_gateway_secondary_review_api_base }}"
      api_key: "none"
    model_info:
      model_lane: code-review
      routing_policy: local-review-alias
      project: ripi
      backend_runtime: "{{ k3s_litellm_gateway_secondary_review_runtime_slug }}"
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: default
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: default
      routing_policy: local-default-fallback
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
