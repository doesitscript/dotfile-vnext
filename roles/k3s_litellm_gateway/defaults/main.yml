    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      routing_policy: local-primary
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
      trim_messages: true
  - model_name: deepreinforce-ai/Ornith-1.0-35B-GGUF-no-trim
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF-no-trim
      routing_policy: local-primary-no-trim
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
      trim_messages: false
      notes: >-
        Same vllm-primary weights as Ornith. model_info.trim_messages=false so
        the LiteLLM callback leaves context untouched. Oversized prompts fail
        at vLLM (32k).
  - model_name: experiment
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_primary_vllm_model }}"
      api_base: "{{ k3s_litellm_gateway_primary_vllm_api_base }}"
      api_key: "none"
    model_info:
      model_lane: experiment
      routing_policy: local-smoke-compat
      project: ripi
      backend_runtime: vllm-primary
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
  - model_name: code-review
    litellm_params:
      model: "hosted_vllm/{{ k3s_litellm_gateway_secondary_review_model }}"
      api_base: "{{ k3s_litellm_gateway_secondary_review_api_base }}"
      api_key: "none"
    model_info:
      model_lane: code-review
      routing_policy: local-review-alias
      project: ripi
      backend_runtime: "{{ k3s_litellm_gateway_secondary_review_runtime_slug }}"
      source_registry: docs/reference/naming-standards/live-object-registry.yml#model_lanes
      model_catalog_manifest: inventory/group_vars/model_catalog/manifest.yml
