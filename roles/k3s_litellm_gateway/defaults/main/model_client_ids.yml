---
# LiteLLM client-facing model_name syntax (gateway `model_list[].model_name`).
# This string is what clients show in model dropdowns (Kilo, Continue, Open WebUI).
#
#   <model-slug>@<host-slug>~<friendly-lane>
#
# Rules:
# - model-slug: REAL backend weight id (`:` and `/` → `-`). Never an invented product
#   name (no ornith-35b, kilo-coder, complexity-router as model-slug).
# - host-slug: homelab server surface (desktop, hvh01, k3s02-vllm, openai, …)
# - friendly-lane: optional homelab purpose suffix ONLY — the only invented segment.
#
# Entry kinds:
# - FRIENDLY ALIAS — one backend model + api_base (not a model group).
# - MODEL GROUP — router entry; model-slug names the router capability on litellm host.
#
# `model_info.model_lane` keeps catalog/trace slug separate from client model_name.

k3s_litellm_gateway_client_model_id_syntax: "<model-slug>@<host-slug>~<friendly-lane>"

k3s_litellm_gateway_client_model_host_desktop: desktop
k3s_litellm_gateway_client_model_host_hvh01: hvh01
k3s_litellm_gateway_client_model_host_k3s02_vllm: k3s02-vllm
k3s_litellm_gateway_client_model_host_openai: openai
k3s_litellm_gateway_client_model_host_anthropic: anthropic
k3s_litellm_gateway_client_model_host_litellm: litellm

