---
# LiteLLM client-facing model_name syntax (gateway `model_list[].model_name`).
#
#   <model-slug>@<host-slug>~<friendly-lane>
#
# - model-slug: backend weight id with `:` and `/` replaced by `-`
# - host-slug: homelab server surface (desktop, hvh01, k3s02-vllm, openai, anthropic, litellm)
# - friendly-lane: invented purpose name (code-fast, kilo-main, smart-router, …)
#
# Entry kinds:
# - FRIENDLY ALIAS — one backend model + api_base (not a model group).
# - MODEL GROUP — router entry; LiteLLM fans out to tier model_name targets.
#
# `model_info.model_lane` keeps the short friendly-lane slug for tracing/catalog.

k3s_litellm_gateway_client_model_id_syntax: "<model-slug>@<host-slug>~<friendly-lane>"

