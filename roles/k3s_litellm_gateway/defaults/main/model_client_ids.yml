# LiteLLM client-facing model_name values (gateway model_list[].model_name).
#
# ACTIVE RULE: use the plain model slug clients compare easily (e.g. qwen3.6-35b-a3b).
# Host/runtime placement is NOT part of the visible id — put it in model_info.notes
# / inventory comments / labels instead of suffixes like @k3s02-vllm.
#
# Historical pattern (retired for k3s02-vllm): model@host
#   qwen3.6-35b-a3b@k3s02-vllm  → now  qwen3.6-35b-a3b
# Prefer plain slugs. Do not use @desktop or @google~lane in client-facing ids
# (placement belongs in model_info / notes). HVH-01 may keep @hvh01 until a
# later plain rename. Do not reintroduce @k3s02-vllm.
#
# Do not invent model slugs (ornith-35b, coder-primary, kilo-coder, …).

