---
- name: Uninstall LiteLLM Helm release
  kubernetes.core.helm:
    name: "{{ k3s_litellm_gateway_release_name }}"
    release_namespace: "{{ k3s_litellm_gateway_namespace }}"
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Delete LiteLLM namespace
  kubernetes.core.k8s:
    name: "{{ k3s_litellm_gateway_namespace }}"
    api_version: v1
    kind: Namespace
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
