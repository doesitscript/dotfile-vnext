---
- name: Resolve LiteLLM base model list when OpenAI key is configured in vault
  ansible.builtin.set_fact:
    k3s_litellm_gateway_resolved_base_model_list: >-
      {{
        k3s_litellm_gateway_model_list
        if (k3s_litellm_gateway_resolved_openai_api_key | default('') | length > 0)
        else k3s_litellm_gateway_model_list_without_openai
      }}
    k3s_litellm_gateway_resolved_context_window_fallbacks: >-
      {{
        k3s_litellm_gateway_context_window_fallbacks_with_openai
        if (k3s_litellm_gateway_resolved_openai_api_key | default('') | length > 0)
        else k3s_litellm_gateway_context_window_fallbacks_without_openai
      }}
    k3s_litellm_gateway_resolved_router_settings: >-
      {{
        k3s_litellm_gateway_router_settings
        | combine(
          {
            'enable_pre_call_checks': k3s_litellm_gateway_enable_pre_call_checks | bool
          },
          recursive=True
        )
      }}
    k3s_litellm_gateway_has_openai: >-
      {{ (k3s_litellm_gateway_resolved_openai_api_key | default('') | length > 0) | bool }}
    k3s_litellm_gateway_has_anthropic: >-
      {{ (k3s_litellm_gateway_resolved_anthropic_api_key | default('') | length > 0) | bool }}
    k3s_litellm_gateway_has_gemini: >-
      {{ (k3s_litellm_gateway_resolved_gemini_api_key | default('') | length > 0) | bool }}

- name: Append cloud provider model routes when vault keys are configured
  ansible.builtin.set_fact:
    k3s_litellm_gateway_resolved_model_list: >-
      {{
        k3s_litellm_gateway_resolved_base_model_list
        + (
          k3s_litellm_gateway_anthropic_model_routes
          if (k3s_litellm_gateway_has_anthropic | bool)
          else []
        )
        + (
          k3s_litellm_gateway_gemini_model_routes
          if (k3s_litellm_gateway_has_gemini | bool)
          else []
        )
      }}

# Homelab local routes — plain logical client IDs; placement is model_info data.
- name: Build homelab LiteLLM routes from commissioned api_bases
  ansible.builtin.set_fact:
    k3s_litellm_gateway_resolved_local_model_routes: >-
      {{
        (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_chat,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.primary.provider ~ '/' ~ k3s_litellm_gateway_local_backends.primary.model,
                'api_base': k3s_litellm_gateway_local_backends.primary.api_base,
                'api_key': 'none',
                'temperature': k3s_litellm_gateway_local_backends.primary.temperature,
                'top_p': k3s_litellm_gateway_local_backends.primary.top_p,
                'top_k': k3s_litellm_gateway_local_backends.primary.top_k,
                'repetition_penalty': k3s_litellm_gateway_local_backends.primary.repetition_penalty
              },
              'model_info': {
                'mode': 'chat',
                'model_lane': k3s_litellm_gateway_client_model_id_chat,
                'routing_policy': 'local-continue-chat-vllm',
                'project': 'ripi',
                'backend_runtime': 'vllm-primary',
                'hf_repo_id': k3s_litellm_gateway_local_backends.primary.model,
                'placement': 'k3s-02 vLLM / RTX 5090 (sequential primary)',
                'max_tokens': 32768,
                'max_input_tokens': 28672,
                'max_output_tokens': 4096,
                'notes': 'Continue/Cline/Codex/OpenCode default (5090 Qwen3-Coder-30B AWQ); '
                         ~ 'placement k3s-02 vLLM — not in model_name; tools via '
                         ~ '--enable-auto-tool-choice + --tool-call-parser qwen3_coder; '
                         ~ 'client max_output 4096 leaves input headroom under 32k',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.primary.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_gpt_oss,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.desktop_gpt_oss.provider ~ '/' ~ k3s_litellm_gateway_local_backends.desktop_gpt_oss.model,
                'api_base': k3s_litellm_gateway_local_backends.desktop_gpt_oss.api_base,
                'api_key': 'none',
                'temperature': k3s_litellm_gateway_local_backends.desktop_gpt_oss.temperature,
                'top_p': k3s_litellm_gateway_local_backends.desktop_gpt_oss.top_p
              },
              'model_info': {
                'mode': 'chat',
                'model_lane': k3s_litellm_gateway_client_model_id_gpt_oss,
                'routing_policy': 'local-gpt-oss',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'dev-workstation-win',
                'ollama_library': k3s_litellm_gateway_local_backends.desktop_gpt_oss.model,
                'notes': 'gpt-oss:20b desktop Ollama; think=low|medium|high via Ollama API',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.desktop_gpt_oss.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_edit,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.desktop_7b.provider ~ '/' ~ k3s_litellm_gateway_local_backends.desktop_7b.model,
                'api_base': k3s_litellm_gateway_local_backends.desktop_7b.api_base,
                'api_key': 'none'
              },
              'model_info': {
                'model_lane': k3s_litellm_gateway_client_model_id_edit,
                'routing_policy': 'local-continue-edit',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'dev-workstation-win',
                'ollama_library': k3s_litellm_gateway_local_backends.desktop_7b.model,
                'notes': 'Continue edit/apply (desktop Ollama)',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.desktop_7b.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_implement,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.desktop_14b.provider ~ '/' ~ k3s_litellm_gateway_local_backends.desktop_14b.model,
                'api_base': k3s_litellm_gateway_local_backends.desktop_14b.api_base,
                'api_key': 'none'
              },
              'model_info': {
                'model_lane': k3s_litellm_gateway_client_model_id_implement,
                'routing_policy': 'local-codex-implement',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'dev-workstation-win',
                'ollama_library': k3s_litellm_gateway_local_backends.desktop_14b.model,
                'notes': 'Codex desktop implementation/review; no fallback group',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.desktop_14b.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_autocomplete,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.fim_1_5b.provider ~ '/' ~ k3s_litellm_gateway_local_backends.fim_1_5b.model,
                'api_base': k3s_litellm_gateway_local_backends.fim_1_5b.api_base,
                'api_key': 'none'
              },
              'model_info': {
                'model_lane': k3s_litellm_gateway_client_model_id_autocomplete,
                'routing_policy': 'local-autocomplete',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'HOM-LAB-HVH-01',
                'hf_repo_id': 'Qwen/Qwen2.5-Coder-1.5B',
                'ollama_library': 'qwen2.5-coder:1.5b-base-q8_0',
                'notes': 'FIM autocomplete Ollama GGUF Q8_0; client id qwen2.5-coder-1.5b-base-q8_0',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.fim_1_5b.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_embed,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.nomic.provider ~ '/' ~ k3s_litellm_gateway_local_backends.nomic.model,
                'api_base': k3s_litellm_gateway_local_backends.nomic.api_base,
                'api_key': 'none'
              },
              'model_info': {
                'model_lane': k3s_litellm_gateway_client_model_id_embed,
                'routing_policy': 'local-embed-ollama',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'HOM-LAB-HVH-01',
                'ollama_library': 'nomic-embed-text',
                'context_class': 'embeddings',
                'notes': 'Continue embed; Ollama nomic-embed-text on GTX 1060',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.nomic.api_base | default('') | length > 0)
          else []
        )
        + (
          [
            {
              'model_name': k3s_litellm_gateway_client_model_id_fast,
              'litellm_params': {
                'model': k3s_litellm_gateway_local_backends.desktop_ministral.provider ~ '/' ~ k3s_litellm_gateway_local_backends.desktop_ministral.model,
                'api_base': k3s_litellm_gateway_local_backends.desktop_ministral.api_base,
                'api_key': 'none'
              },
              'model_info': {
                'model_lane': k3s_litellm_gateway_client_model_id_fast,
                'routing_policy': 'local-kilo-fast',
                'project': 'ripi',
                'backend_runtime': 'ollama',
                'placement_host': 'dev-workstation-win',
                'ollama_library': 'ministral-3:8b',
                'notes': 'friendly: ~kilo-fast',
                'source_registry': 'docs/reference/naming-standards/live-object-registry.yml#model_lanes',
                'model_catalog_manifest': 'inventory/group_vars/model_catalog/manifest.yml'
              }
            }
          ]
          if (k3s_litellm_gateway_local_backends.desktop_ministral.api_base | default('') | length > 0)
          else []
        )
      }}

- name: Append homelab local model routes
  ansible.builtin.set_fact:
    k3s_litellm_gateway_resolved_model_list: >-
      {{
        k3s_litellm_gateway_resolved_model_list
        + (k3s_litellm_gateway_resolved_local_model_routes | default([]))
      }}

- name: Resolve LiteLLM proxy-level fallback settings
  ansible.builtin.set_fact:
    k3s_litellm_gateway_resolved_proxy_litellm_settings: >-
      {{
        k3s_litellm_gateway_proxy_litellm_settings
        | combine(
          {
            'context_window_fallbacks': k3s_litellm_gateway_resolved_context_window_fallbacks
          },
          recursive=True
        )
        | combine(
          {
            'callbacks': k3s_litellm_gateway_request_inspector_callback_ref
          }
          if (k3s_litellm_gateway_request_inspector_enabled | bool)
          else {},
          recursive=True
        )
      }}

- name: Build LiteLLM Helm values from vault-backed configuration
  ansible.builtin.set_fact:
    k3s_litellm_gateway_helm_values: >-
      {{
        {
          'replicaCount': k3s_litellm_gateway_replicas,
          'masterkeySecretName': k3s_litellm_gateway_env_secret_name,
          'masterkeySecretKey': 'PROXY_MASTER_KEY',
          'environmentSecrets': [k3s_litellm_gateway_env_secret_name],
          'image': {
            'repository': k3s_litellm_gateway_image_repository,
            'tag': k3s_litellm_gateway_image_tag
          },
          'strategy': k3s_litellm_gateway_strategy,
          'db': {
            'deployStandalone': false,
            'useExisting': true,
            'endpoint': k3s_litellm_gateway_db_endpoint,
            'database': k3s_litellm_gateway_db_database,
            'url': k3s_litellm_gateway_db_url,
            'secret': {
              'name': k3s_litellm_gateway_db_secret_name,
              'usernameKey': k3s_litellm_gateway_db_secret_username_key,
              'passwordKey': k3s_litellm_gateway_db_secret_password_key
            }
          },
          'service': {
            'type': k3s_litellm_gateway_service_type,
            'port': k3s_litellm_gateway_service_port
          },
          'resources': {
            'limits': {
              'cpu': k3s_litellm_gateway_cpu_limit,
              'memory': k3s_litellm_gateway_memory_limit
            },
            'requests': {
              'cpu': k3s_litellm_gateway_cpu_request,
              'memory': k3s_litellm_gateway_memory_request
            }
          },
          'proxy_config': {
            'model_list': k3s_litellm_gateway_resolved_model_list,
            'router_settings': k3s_litellm_gateway_resolved_router_settings,
            'general_settings': {
              'master_key': 'os.environ/PROXY_MASTER_KEY'
            },
            'litellm_settings': k3s_litellm_gateway_resolved_proxy_litellm_settings
          }
        }
        | combine(
          {
            'volumes': [
              {
                'name': 'callback-files',
                'configMap': {
                  'name': k3s_litellm_gateway_request_inspector_callback_configmap
                }
              }
            ],
            'volumeMounts': [
              {
                'name': 'callback-files',
                'mountPath': '/etc/litellm/custom_callbacks.py',
                'subPath': 'custom_callbacks.py'
              }
            ]
          }
          if (k3s_litellm_gateway_request_inspector_enabled | bool)
          else {},
          recursive=True
        )
        | combine(
          {
            'command': k3s_litellm_gateway_command,
            'args': k3s_litellm_gateway_args
          }
          if (k3s_litellm_gateway_pillow_bootstrap_enabled | bool)
          else {},
          recursive=True
        )
      }}
