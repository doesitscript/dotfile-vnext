---
argument_specs:
  main:
    short_description: "Install Speech Central from the Mac App Store"
    options:
      speech_central_app_id:
        type: str
        default: "1223093645"
        description:
          - "Mac App Store ADAM ID for Speech Central."
      speech_central_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether Speech Central should be installed or removed."
      speech_central_verify_install:
        type: bool
        default: true
        description:
          - "Re-check the requested state after the role runs."
      speech_central_install_timeout_seconds:
        type: int
        default: 120
        description:
          - "Maximum number of seconds to wait for the mas install command."
      speech_central_app_bundle_candidates:
        type: list
        elements: str
        default:
          - "/Applications/Speech Central.app"
          - "{{ ansible_env.HOME }}/Applications/Speech Central.app"
        description:
          - "Candidate app bundle paths used for local verification."
