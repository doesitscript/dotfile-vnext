---
argument_specs:
  main:
    short_description: Install OpenCode CLI and homelab LiteLLM config
    options:
      opencode_cli_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      opencode_cli_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
      opencode_cli_default_model:
        type: str
        required: false
        default: "homelab-litellm/ministral-3-8b@desktop"
      opencode_cli_models:
        type: list
        elements: dict
        required: false
        description: LiteLLM model@host entries for the homelab provider block.
