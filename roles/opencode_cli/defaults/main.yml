---
opencode_cli_state: absent
opencode_cli_install_dir: "{{ ansible_env.HOME }}/.opencode/bin"
opencode_cli_binary_path: "{{ opencode_cli_install_dir }}/opencode"
opencode_cli_config_dir: "{{ ansible_env.HOME }}/.config/opencode"
opencode_cli_config_path: "{{ opencode_cli_config_dir }}/opencode.jsonc"
opencode_cli_install_url: "https://opencode.ai/install"
opencode_cli_gateway_api_base: "http://litellm.hom.lab/v1"
opencode_cli_provider_id: "homelab-litellm"
opencode_cli_provider_npm: "@ai-sdk/openai-compatible"
opencode_cli_provider_display_name: "Homelab LiteLLM"
opencode_cli_api_key_env: "LITELLM_API_KEY"
opencode_cli_default_model: "homelab-litellm/qwen2.5-coder-7b@desktop"
opencode_cli_context_limit: 32768
opencode_cli_output_limit: 4096
# 14B vLLM omitted — chat-only lane (Continue); OpenCode `run` requires tool_calls.
opencode_cli_models:
  - id: "qwen2.5-coder-7b@desktop"
    name: "Qwen2.5 Coder 7B (desktop Ollama)"
  - id: "qwen2.5-coder-1.5b@hvh01"
    name: "Qwen2.5 Coder 1.5B (hvh01 fast)"
