---
# JupyterLab Workbench configuration
dev_jupyterlab_workbench_state: present
dev_jupyterlab_workbench_user: "{{ ansible_user | default('joshc') }}"
dev_jupyterlab_workbench_home: "/home/{{ dev_jupyterlab_workbench_user }}"
dev_jupyterlab_workbench_install_dir: "{{ dev_jupyterlab_workbench_home }}/jupyterlab-workbench"
dev_jupyterlab_workbench_venv_path: "{{ dev_jupyterlab_workbench_install_dir }}/.venv"
dev_jupyterlab_workbench_notebooks_dir: "{{ dev_jupyterlab_workbench_install_dir }}/notebooks"
dev_jupyterlab_workbench_cookbooks_dir: "{{ dev_jupyterlab_workbench_install_dir }}/langfuse-cookbooks"
dev_jupyterlab_workbench_port: 8888
dev_jupyterlab_workbench_token: ""  # Empty = auto-generate, set to specific value to pin
dev_jupyterlab_workbench_bind_address: "0.0.0.0"
dev_jupyterlab_workbench_allow_origin: "*"
dev_jupyterlab_workbench_kernel_name: "langfuse-cookbooks"
dev_jupyterlab_workbench_kernel_display_name: "Langfuse Cookbooks (Python 3)"

# Python packages
dev_jupyterlab_workbench_python_version: "3.11"
dev_jupyterlab_workbench_packages:
  - jupyterlab
  - ipykernel
  - python-dotenv
  - langfuse
  - anthropic
  - openai

# Langfuse cookbook repo
dev_jupyterlab_workbench_cookbooks_repo: "https://github.com/langfuse/langfuse-cookbooks.git"
dev_jupyterlab_workbench_cookbooks_version: "main"

# Service configuration
dev_jupyterlab_workbench_service_enabled: true
dev_jupyterlab_workbench_service_name: "jupyterlab-workbench"
dev_jupyterlab_workbench_service_description: "JupyterLab Workbench for AI/ML Development"
