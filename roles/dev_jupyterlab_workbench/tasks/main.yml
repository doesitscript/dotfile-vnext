---
- name: Include present tasks for JupyterLab workbench
  ansible.builtin.include_tasks: present.yml
  when: dev_jupyterlab_workbench_state == 'present'

- name: Include absent tasks for JupyterLab workbench
  ansible.builtin.include_tasks: absent.yml
  when: dev_jupyterlab_workbench_state == 'absent'
