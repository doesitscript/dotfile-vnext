---
# Module matrix:
# - k3s_node_gpu_prereqs (include_role): GPU resource gate
# - kubernetes.core.k8s / k8s_info: Namespace, PVC, Deployment, Service
# - ansible.builtin.uri: readiness probe against NodePort/ClusterIP

- name: Validate GPU prerequisites before ComfyUI mutation
  ansible.builtin.include_role:
    name: k3s_node_gpu_prereqs
  vars:
    k3s_node_gpu_prereqs_expected_resource: "{{ k3s_comfyui_runtime_gpu_resource }}"
    k3s_node_gpu_prereqs_expected_count: "{{ k3s_comfyui_runtime_gpu_count }}"

- name: Probe vLLM ready replicas when mutual exclusion is required
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_comfyui_runtime_vllm_namespace }}"
    name: "{{ k3s_comfyui_runtime_vllm_name }}"
  register: k3s_comfyui_runtime_vllm_info
  failed_when: false
  when: k3s_comfyui_runtime_require_vllm_absent | bool
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Assert vLLM is not holding the GPU before ComfyUI present
  ansible.builtin.assert:
    that:
      - >-
        (k3s_comfyui_runtime_vllm_info.resources | default([]) | length) == 0
        or (
          (k3s_comfyui_runtime_vllm_info.resources[0].spec.replicas | default(0) | int) == 0
        )
    fail_msg: >-
      ComfyUI and vLLM cannot share the single 5090. Set
      k3s_vllm_runtime_state: absent, apply the vLLM playbook, then retry ComfyUI.
  when: k3s_comfyui_runtime_require_vllm_absent | bool

- name: Ensure ComfyUI namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k3s_comfyui_runtime_namespace }}"
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Ensure ComfyUI models PVC exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ k3s_comfyui_runtime_name }}-models"
        namespace: "{{ k3s_comfyui_runtime_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ k3s_comfyui_runtime_models_pvc_size }}"
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Build ComfyUI resource maps
  ansible.builtin.set_fact:
    _k3s_comfyui_runtime_resource_requests: >-
      {{
        {
          'cpu': k3s_comfyui_runtime_cpu_request,
          'memory': k3s_comfyui_runtime_memory_request
        }
        | combine({k3s_comfyui_runtime_gpu_resource: k3s_comfyui_runtime_gpu_count})
      }}
    _k3s_comfyui_runtime_resource_limits: >-
      {{
        {
          'cpu': k3s_comfyui_runtime_cpu_limit,
          'memory': k3s_comfyui_runtime_memory_limit
        }
        | combine({k3s_comfyui_runtime_gpu_resource: k3s_comfyui_runtime_gpu_count})
      }}
    _k3s_comfyui_runtime_cli_args: >-
      {{ k3s_comfyui_runtime_extra_args | join(' ') }}

- name: Ensure ComfyUI user-scripts ConfigMap exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ k3s_comfyui_runtime_name }}-user-scripts"
        namespace: "{{ k3s_comfyui_runtime_namespace }}"
      data:
        pre-start.sh: "{{ lookup('ansible.builtin.file', 'pre-start.sh') }}"
        set-proxy.sh: "{{ lookup('ansible.builtin.file', 'set-proxy.sh') }}"
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Ensure ComfyUI deployment exists
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ k3s_comfyui_runtime_name }}"
        namespace: "{{ k3s_comfyui_runtime_namespace }}"
        labels:
          app.kubernetes.io/name: comfyui
          app.kubernetes.io/instance: "{{ k3s_comfyui_runtime_name }}"
          app.kubernetes.io/managed-by: ansible
      spec:
        replicas: "{{ k3s_comfyui_runtime_replicas }}"
        strategy:
          type: "{{ k3s_comfyui_runtime_deployment_strategy_type }}"
        selector:
          matchLabels:
            app.kubernetes.io/name: comfyui
            app.kubernetes.io/instance: "{{ k3s_comfyui_runtime_name }}"
        template:
          metadata:
            labels:
              app.kubernetes.io/name: comfyui
              app.kubernetes.io/instance: "{{ k3s_comfyui_runtime_name }}"
          spec:
            runtimeClassName: "{{ k3s_comfyui_runtime_runtime_class_name }}"
            tolerations: "{{ k3s_comfyui_runtime_tolerations }}"
            initContainers:
              - name: seed-user-scripts
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - cp -a /cfg/. /seed/ && chmod +x /seed/*.sh
                volumeMounts:
                  - name: user-scripts-cfg
                    mountPath: /cfg
                  - name: user-scripts
                    mountPath: /seed
            containers:
              - name: comfyui
                image: "{{ k3s_comfyui_runtime_image }}"
                ports:
                  - name: http
                    containerPort: "{{ k3s_comfyui_runtime_container_port }}"
                env:
                  - name: CLI_ARGS
                    value: "{{ _k3s_comfyui_runtime_cli_args }}"
                  - name: NVIDIA_VISIBLE_DEVICES
                    value: "all"
                  - name: NVIDIA_DRIVER_CAPABILITIES
                    value: "compute,utility"
                volumeMounts:
                  # Do NOT mount under /root/ComfyUI — yanwk slim runner git-clones
                  # there on first boot; a models PVC would create the parent dir
                  # and break clone.
                  - name: comfyui-models
                    mountPath: /mnt/comfy-models
                  - name: user-scripts
                    mountPath: /root/user-scripts
                resources:
                  requests: "{{ _k3s_comfyui_runtime_resource_requests }}"
                  limits: "{{ _k3s_comfyui_runtime_resource_limits }}"
                readinessProbe:
                  httpGet:
                    path: /system_stats
                    port: http
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 40
                livenessProbe:
                  httpGet:
                    path: /system_stats
                    port: http
                  initialDelaySeconds: 180
                  periodSeconds: 30
                  failureThreshold: 10
            volumes:
              - name: comfyui-models
                persistentVolumeClaim:
                  claimName: "{{ k3s_comfyui_runtime_name }}-models"
              - name: user-scripts-cfg
                configMap:
                  name: "{{ k3s_comfyui_runtime_name }}-user-scripts"
              - name: user-scripts
                emptyDir: {}
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Ensure ComfyUI Service (ClusterIP + NodePort) exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ k3s_comfyui_runtime_name }}"
        namespace: "{{ k3s_comfyui_runtime_namespace }}"
        labels:
          app.kubernetes.io/name: comfyui
          app.kubernetes.io/instance: "{{ k3s_comfyui_runtime_name }}"
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: comfyui
          app.kubernetes.io/instance: "{{ k3s_comfyui_runtime_name }}"
        ports:
          - name: http
            port: "{{ k3s_comfyui_runtime_service_port }}"
            targetPort: "{{ k3s_comfyui_runtime_container_port }}"
            nodePort: "{{ k3s_comfyui_runtime_node_port }}"
            protocol: TCP
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Wait for ComfyUI deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ k3s_comfyui_runtime_namespace }}"
    name: "{{ k3s_comfyui_runtime_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ k3s_comfyui_runtime_ready_timeout_seconds }}"
  environment:
    KUBECONFIG: "{{ k3s_comfyui_runtime_kubeconfig }}"

- name: Download Phase B model weights into PVC
  ansible.builtin.include_tasks: download_models.yml
  when: k3s_comfyui_runtime_download_models | bool

- name: Report ComfyUI endpoint
  ansible.builtin.debug:
    msg: >-
      ComfyUI API NodePort :{{ k3s_comfyui_runtime_node_port }}
      (publish via HVH-02 portproxy → comfyui.hom.lab).
      In-cluster http://{{ k3s_comfyui_runtime_name }}.{{ k3s_comfyui_runtime_namespace }}.svc.cluster.local:{{ k3s_comfyui_runtime_service_port }}/
