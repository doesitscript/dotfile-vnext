---
argument_specs:
  main:
    short_description: Deploy ComfyUI on K3s GPU lane (Phase B lab stills)
    options:
      k3s_comfyui_runtime_state:
        type: str
        default: absent
        choices:
          - present
          - absent
        description: Lifecycle state for the ComfyUI runtime.
      k3s_comfyui_runtime_namespace:
        type: str
        default: comfyui-runtime
        description: Kubernetes namespace for ComfyUI.
      k3s_comfyui_runtime_models_pvc_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: >-
          Lifecycle state for the model cache PVC and namespace, independent of
          the runtime so weights survive Phase B toggles. Set to absent to
          reclaim the PVC, or to recreate it at a changed size.
      k3s_comfyui_runtime_models_pvc_size:
        type: str
        default: 60Gi
        description: >-
          Requested size of the models PVC. K3s local-path does not enforce
          this and PVCs are not resizeable; purge and re-apply to change it.
      k3s_comfyui_runtime_gpu_count:
        type: int
        default: 1
        description: Number of NVIDIA GPUs requested by the runtime pod.
      k3s_comfyui_runtime_node_port:
        type: int
        default: 30188
        description: LAN NodePort for ComfyUI web UI / API.
