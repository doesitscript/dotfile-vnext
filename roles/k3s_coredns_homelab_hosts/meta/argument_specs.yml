---
argument_specs:
  main:
    short_description: CoreDNS hom.lab hosts from homelab hosts-file catalog
    description:
      - Manages the K3s optional ConfigMap coredns-custom key hom.lab.server.
      - Source of truth is homelab_hosts_file_web_catalog (*.hom.lab entries).
    options:
      k3s_coredns_homelab_hosts_state:
        type: str
        choices:
          - present
          - absent
        default: absent
      k3s_coredns_homelab_hosts_namespace:
        type: str
        default: kube-system
      k3s_coredns_homelab_hosts_configmap_name:
        type: str
        default: coredns-custom
      k3s_coredns_homelab_hosts_server_key:
        type: str
        default: hom.lab.server
      k3s_coredns_homelab_hosts_zone:
        type: str
        default: hom.lab
      k3s_coredns_homelab_hosts_kubeconfig:
        type: str
        default: /etc/rancher/k3s/k3s.yaml
      k3s_coredns_homelab_hosts_restart_coredns:
        type: bool
        default: true
      k3s_coredns_homelab_hosts_verify:
        type: bool
        default: true
      k3s_coredns_homelab_hosts_verify_hostname:
        type: str
        default: ollama-desktop.hom.lab
      k3s_coredns_homelab_hosts_verify_image:
        type: str
        default: busybox:1.36
