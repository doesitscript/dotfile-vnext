---
argument_specs:
  main:
    short_description: Build a managed Hyper-V Ubuntu GPU-P runtime payload from Windows host-visible paths.
    options:
      hyperv_ubuntu_gpu_p_windows_payload_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_ubuntu_gpu_p_windows_payload_wsl_exe_path:
        type: str
        default: C:\Windows\System32\wsl.exe
      hyperv_ubuntu_gpu_p_windows_payload_programfiles_wsl_lib_path:
        type: str
        default: C:\Program Files\WSL\lib
      hyperv_ubuntu_gpu_p_windows_payload_lxss_lib_path:
        type: str
        default: C:\Windows\System32\lxss\lib
      hyperv_ubuntu_gpu_p_windows_payload_driverstore_root:
        type: str
        default: C:\Windows\System32\DriverStore\FileRepository
      hyperv_ubuntu_gpu_p_windows_payload_temp_root:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_gpu_p_runtime\windows_payload
      hyperv_ubuntu_gpu_p_windows_payload_export_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_payload_zip_path:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_payload_expected_driver_version:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_payload_driver_contract_path:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_payload_controller_stage_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_payload_controller_zip_path:
        type: str
        required: false
