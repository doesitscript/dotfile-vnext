---
- name: Ensure controller stage root exists for Windows payload fetch
  delegate_to: "{{ groups['execution_nodes'][0] }}"
  become: false
  ansible.builtin.file:
    path: "{{ hyperv_ubuntu_gpu_p_windows_payload_controller_stage_root }}"
    state: directory
    mode: "0700"

- name: Stat required Windows host-visible payload paths
  ansible.windows.win_stat:
    path: "{{ item }}"
  loop:
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_wsl_exe_path }}"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_programfiles_wsl_lib_path }}"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_lxss_lib_path }}"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_root }}"
  register: hyperv_ubuntu_gpu_p_windows_payload_required_path_stats

- name: Assert required Windows host-visible payload paths exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      Required Windows payload source path is missing: {{ item.item }}
  loop: "{{ hyperv_ubuntu_gpu_p_windows_payload_required_path_stats.results }}"

- name: Stat repo-managed NVIDIA driver contract
  ansible.windows.win_stat:
    path: "{{ hyperv_ubuntu_gpu_p_windows_payload_driver_contract_path }}"
  register: hyperv_ubuntu_gpu_p_windows_payload_driver_contract_stat

- name: Assert repo-managed NVIDIA driver contract exists
  ansible.builtin.assert:
    that:
      - hyperv_ubuntu_gpu_p_windows_payload_driver_contract_stat.stat.exists | bool
    fail_msg: >-
      Managed NVIDIA driver contract is missing at
      {{ hyperv_ubuntu_gpu_p_windows_payload_driver_contract_path }}.

- name: Read repo-managed NVIDIA driver contract
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $path = '{{ hyperv_ubuntu_gpu_p_windows_payload_driver_contract_path }}'
      if (-not (Test-Path $path)) {
        throw "Driver contract not found at $path"
      }
      Get-Content -LiteralPath $path -Raw
  register: hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta

- name: Parse repo-managed NVIDIA driver contract
  ansible.builtin.set_fact:
    hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json: >-
      {{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta.output[0] | from_json }}
  changed_when: false

- name: Assert driver contract version matches expected role version
  ansible.builtin.assert:
    that:
      - >-
        hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.installed_driver_version
        == hyperv_ubuntu_gpu_p_windows_payload_expected_driver_version
    fail_msg: >-
      Driver contract version
      {{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.installed_driver_version }}
      does not match expected version
      {{ hyperv_ubuntu_gpu_p_windows_payload_expected_driver_version }}.
  when: hyperv_ubuntu_gpu_p_windows_payload_expected_driver_version | length > 0

- name: Assert resolved DriverStore subtree exists
  ansible.windows.win_stat:
    path: "{{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_path }}"
  register: hyperv_ubuntu_gpu_p_windows_payload_driverstore_path_stat

- name: Validate resolved DriverStore subtree exists
  ansible.builtin.assert:
    that:
      - hyperv_ubuntu_gpu_p_windows_payload_driverstore_path_stat.stat.exists | default(false)
    fail_msg: >-
      Resolved DriverStore subtree does not exist:
      {{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_path }}

- name: Ensure Windows payload staging directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_temp_root }}"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\wsl-programfiles-lib"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\wsl-lxss-lib"
    - "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\driverstore"

- name: Find existing staged DriverStore subdirectories
  ansible.windows.win_find:
    paths: "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\driverstore"
    file_type: directory
    recurse: false
  register: hyperv_ubuntu_gpu_p_windows_payload_existing_driverstore_dirs

- name: Remove stale staged DriverStore subdirectories
  ansible.windows.win_file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hyperv_ubuntu_gpu_p_windows_payload_existing_driverstore_dirs.files }}"
  when: >-
    (item.path | basename)
    != hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_folder

- name: Mirror Program Files WSL lib into staged payload
  community.windows.win_robocopy:
    src: "{{ hyperv_ubuntu_gpu_p_windows_payload_programfiles_wsl_lib_path }}"
    dest: "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\wsl-programfiles-lib"
    recurse: true
    purge: true
  register: hyperv_ubuntu_gpu_p_windows_payload_programfiles_sync

- name: Mirror lxss WSL lib into staged payload
  community.windows.win_robocopy:
    src: "{{ hyperv_ubuntu_gpu_p_windows_payload_lxss_lib_path }}"
    dest: "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\wsl-lxss-lib"
    recurse: true
    purge: true
  register: hyperv_ubuntu_gpu_p_windows_payload_lxss_sync

- name: Mirror exact DriverStore subtree into staged payload
  community.windows.win_robocopy:
    src: "{{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_path }}"
    dest: >-
      {{
        hyperv_ubuntu_gpu_p_windows_payload_export_root
        ~ '\\driverstore\\'
        ~ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_folder
      }}
    recurse: true
    purge: true
  register: hyperv_ubuntu_gpu_p_windows_payload_driverstore_sync

- name: Stat staged Windows payload zip
  ansible.windows.win_stat:
    path: "{{ hyperv_ubuntu_gpu_p_windows_payload_zip_path }}"
  register: hyperv_ubuntu_gpu_p_windows_payload_zip_stat

- name: Build staged Windows payload zip when payload changed or zip is missing
  community.windows.win_zip:
    src: "{{ hyperv_ubuntu_gpu_p_windows_payload_export_root }}\\*"
    dest: "{{ hyperv_ubuntu_gpu_p_windows_payload_zip_path }}"
  when:
    - hyperv_ubuntu_gpu_p_windows_payload_programfiles_sync is changed or
      hyperv_ubuntu_gpu_p_windows_payload_lxss_sync is changed or
      hyperv_ubuntu_gpu_p_windows_payload_driverstore_sync is changed or
      not (hyperv_ubuntu_gpu_p_windows_payload_zip_stat.stat.exists | default(false))

- name: Build Windows payload SSH copy source spec
  ansible.builtin.set_fact:
    hyperv_ubuntu_gpu_p_windows_payload_scp_source: >-
      {{
        ansible_user
        ~ '@'
        ~ ansible_host
        ~ ':'
        ~ (hyperv_ubuntu_gpu_p_windows_payload_zip_path | replace('\\', '/'))
      }}
  changed_when: false

- name: Copy staged Windows payload zip to controller over SSH
  delegate_to: "{{ groups['execution_nodes'][0] }}"
  become: false
  ansible.builtin.shell: >-
    scp
    -P "{{ ansible_port | default(22) | string }}"
    -i "{{ ansible_ssh_private_key_file }}"
    -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null
    "{{ hyperv_ubuntu_gpu_p_windows_payload_scp_source }}"
    "{{ hyperv_ubuntu_gpu_p_windows_payload_controller_zip_path }}"
  register: hyperv_ubuntu_gpu_p_windows_payload_archive_fetch
  changed_when: true
  retries: 5
  delay: 10
  until: hyperv_ubuntu_gpu_p_windows_payload_archive_fetch.rc == 0

- name: Publish Windows payload metadata
  ansible.builtin.set_fact:
    hyperv_ubuntu_gpu_p_windows_payload_driverstore_folder: >-
      {{ hyperv_ubuntu_gpu_p_windows_payload_driverstore_meta_json.driverstore_folder }}
    hyperv_ubuntu_gpu_p_windows_payload_archive_fetch_changed: >-
      {{ hyperv_ubuntu_gpu_p_windows_payload_archive_fetch.changed | default(false) }}
  changed_when: false
