---
- name: Stop use of deprecated Hyper-V Ubuntu GPU-P Windows payload role
  ansible.builtin.fail:
    msg: |
      roles/hyperv_ubuntu_gpu_p_windows_payload is deprecated.

      It implements the retired ZIP/controller-copy payload path and is no longer
      part of the supported runtime.

      Use the managed share publish + guest rsync flow instead:
      - playbooks/hyperv_ubuntu_gpu_p_artifact_publish.yaml
      - playbooks/hyperv_ubuntu_gpu_p_runtime.yaml
      - playbooks/hyperv_ubuntu_gpu_p_runtime_artifact_pipeline.yaml
