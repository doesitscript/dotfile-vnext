---
argument_specs:
  main:
    short_description: Bootstrap package managers without default mass upgrades
    options:
      package_update:
        type: bool
        default: false
        description:
          - Refresh package indexes (apt update / brew update)
      package_upgrade:
        type: bool
        default: false
        description:
          - Upgrade all packages (apt dist-upgrade / choco all latest / brew upgrade_all)
