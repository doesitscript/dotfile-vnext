---
hyperv_gpu_p_host_precheck_state: present
hyperv_gpu_p_host_precheck_receipt_root: C:\ProgramData\Ansible\hyperv_gpu_p_host_precheck
hyperv_gpu_p_host_precheck_receipt_path: "{{ hyperv_gpu_p_host_precheck_receipt_root }}\\current.json"
hyperv_gpu_p_host_precheck_hyperv_server: >-
  {{
    hyperv_management_endpoint
    | default(ansible_host | default(host_ip | default(os_hostname | default(inventory_hostname))))
  }}
hyperv_gpu_p_host_precheck_require_hypervisor_present: true
hyperv_gpu_p_host_precheck_require_virtualization_firmware_enabled: false
hyperv_gpu_p_host_precheck_require_iov_support: true
hyperv_gpu_p_host_precheck_require_partitionable_gpu: true
hyperv_gpu_p_host_precheck_expected_partitionable_gpu_name_regex: ""
hyperv_gpu_p_host_precheck_require_driver_contract: true
hyperv_gpu_p_host_precheck_driver_contract_path: "{{ llm_compute_windows_driver_contract_path | default('C:\\ProgramData\\Ansible\\llm_compute_windows\\nvidia_driver_contract.json') }}"
hyperv_gpu_p_host_precheck_coreinfo_exe_path: "{{ gpu_diagnostics_windows_coreinfo_exe_path | default('C:\\ProgramData\\Ansible\\gpu_diagnostics\\coreinfo\\sysinternals\\coreinfo.exe') }}"
