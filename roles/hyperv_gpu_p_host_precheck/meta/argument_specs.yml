---
argument_specs:
  main:
    short_description: Validate Windows Hyper-V GPU-P host readiness and publish a receipt.
    options:
      hyperv_gpu_p_host_precheck_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_gpu_p_host_precheck_receipt_root:
        type: str
        default: C:\ProgramData\Ansible\hyperv_gpu_p_host_precheck
      hyperv_gpu_p_host_precheck_receipt_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_gpu_p_host_precheck\current.json
      hyperv_gpu_p_host_precheck_require_hypervisor_present:
        type: bool
        default: true
      hyperv_gpu_p_host_precheck_require_virtualization_firmware_enabled:
        type: bool
        default: false
      hyperv_gpu_p_host_precheck_require_iov_support:
        type: bool
        default: true
      hyperv_gpu_p_host_precheck_require_partitionable_gpu:
        type: bool
        default: true
      hyperv_gpu_p_host_precheck_expected_partitionable_gpu_name_regex:
        type: str
        default: ""
      hyperv_gpu_p_host_precheck_require_driver_contract:
        type: bool
        default: true
      hyperv_gpu_p_host_precheck_driver_contract_path:
        type: str
        default: C:\ProgramData\Ansible\llm_compute_windows\nvidia_driver_contract.json
      hyperv_gpu_p_host_precheck_coreinfo_exe_path:
        type: str
        default: C:\ProgramData\Ansible\gpu_diagnostics\coreinfo\sysinternals\coreinfo.exe
