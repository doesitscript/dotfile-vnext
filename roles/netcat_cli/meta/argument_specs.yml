---
argument_specs:
  main:
    short_description: Manage GNU netcat on macOS through Homebrew
    options:
      netcat_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether the Homebrew netcat formula should be installed or removed.
      netcat_cli_homebrew_formula:
        type: str
        default: netcat
        description:
          - Homebrew formula name that provides the netcat CLI.
      netcat_cli_verify:
        type: bool
        default: true
        description:
          - Verify the requested formula state after convergence.
