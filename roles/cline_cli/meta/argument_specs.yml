---
argument_specs:
  main:
    short_description: >-
      Install Cline CLI (npm) on macOS; LiteLLM config owned by cline_ide
    options:
      cline_cli_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      cline_cli_node_version:
        type: str
        required: false
        default: "24"
        description: nvm Node major (22+) used for npm install -g cline
      cline_cli_npm_package:
        type: str
        required: false
        default: cline
      cline_cli_require_ide_config:
        type: bool
        required: false
        default: true
        description: >-
          When present, assert ~/.cline providers/models/mcp exist (from
          cline_ide).
