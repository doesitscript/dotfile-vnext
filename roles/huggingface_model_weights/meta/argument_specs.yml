---
argument_specs:
  main:
    short_description: Manage selected Hugging Face model weight trees
    options:
      huggingface_model_weights_state:
        type: str
        choices: [present, absent]
        default: absent
      huggingface_model_weights_root:
        type: path
        default: 'F:\shares\public\models\huggingface'
      huggingface_model_weights_script_path:
        type: path
        default: 'C:\ProgramData\dotfile-vnext\download_hf_model.py'
      huggingface_model_weights_staging_path:
        type: path
        default: 'C:\ProgramData\dotfile-vnext'
      huggingface_model_weights:
        type: list
        elements: dict
        default: []
