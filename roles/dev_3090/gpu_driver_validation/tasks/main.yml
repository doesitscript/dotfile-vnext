---
# Dev-3090 GPU Driver Validation Role
# WinRM/PowerShell only - validates NVIDIA GPU driver installation
# Does not install drivers, only validates presence
# Expected GPU: RTX 3090

- name: Check if nvidia-smi is available
  win_shell: nvidia-smi --version
  register: nvidia_smi_check
  changed_when: false
  failed_when: false

- name: Get NVIDIA driver version
  win_shell: |
    $version = nvidia-smi --query-gpu=driver_version --format=csv,noheader
    $version
  register: nvidia_version
  changed_when: false
  failed_when: false
  when: nvidia_smi_check.rc == 0

- name: Get GPU information
  win_shell: |
    nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
  register: gpu_info
  changed_when: false
  failed_when: false
  when: nvidia_smi_check.rc == 0

- name: Get GPU temperature and utilization
  win_shell: |
    nvidia-smi --query-gpu=temperature.gpu,utilization.gpu --format=csv,noheader
  register: gpu_status
  changed_when: false
  failed_when: false
  when: nvidia_smi_check.rc == 0

- name: Fail if GPU driver is not installed
  fail:
    msg: "NVIDIA GPU driver not found. nvidia-smi command failed. Please install NVIDIA Studio Driver."
  when: nvidia_smi_check.rc != 0

- name: Verify expected GPU model
  assert:
    that:
      - gpu_info.stdout is defined
      - gpu_info.stdout != ""
    fail_msg: "GPU information could not be retrieved"
    success_msg: "GPU information retrieved successfully"
  when: nvidia_smi_check.rc == 0

- name: Display GPU driver validation summary
  debug:
    msg:
      - "=== GPU Driver Validation ==="
      - "NVIDIA driver installed: Yes"
      - "Driver version: {{ nvidia_version.stdout | default('Unknown') }}"
      - "GPU information: {{ gpu_info.stdout | default('Unknown') }}"
      - "GPU status: {{ gpu_status.stdout | default('Unknown') }}"
      - "Expected GPU: {{ gpu | default('RTX 3090') }}"
  when: nvidia_smi_check.rc == 0

- name: Warning if GPU driver not found
  debug:
    msg:
      - "WARNING: NVIDIA GPU driver not found"
      - "Please install NVIDIA Studio Driver manually"
      - "Expected GPU: {{ gpu | default('RTX 3090') }}"
  when: nvidia_smi_check.rc != 0

