---
# Dev-3090 Dev Stacks Deployment Role
# Deploys optional dev_ollama and dev_litellm stacks
# Uses WSL2 Docker Engine (if docker_runtime is wsl2-ubuntu-docker-engine)
# Or Windows Docker Engine (if docker_runtime is windows-docker-engine)
# SSH connection to WSL or WinRM for Windows Docker

- name: Determine Docker runtime choice
  set_fact:
    docker_runtime_choice: "{{ docker_runtime | default('wsl2-ubuntu-docker-engine') }}"
    use_wsl2_docker: "{{ docker_runtime | default('wsl2-ubuntu-docker-engine') == 'wsl2-ubuntu-docker-engine' }}"
    use_windows_docker: "{{ docker_runtime | default('wsl2-ubuntu-docker-engine') == 'windows-docker-engine' }}"

- name: Check if dev stacks should be deployed
  set_fact:
    deploy_dev_ollama: "{{ deploy_dev_ollama | default(false) }}"
    deploy_dev_litellm: "{{ deploy_dev_litellm | default(false) }}"

- name: Create dev stacks directory (WSL2 path)
  file:
    path: "{{ wsl_mount_root }}/stacks/dev"
    state: directory
    mode: '0755'
  when: use_wsl2_docker

- name: Create dev stacks directory (Windows path)
  win_file:
    path: "{{ stacks_root | regex_replace('\\\\', '\\') }}\\dev"
    state: directory
  when: use_windows_docker

# ============================================================================
# WSL2 Docker Engine Path
# ============================================================================
- name: Create docker-compose.yml for dev stack (WSL2 path)
  copy:
    content: |
      version: '3.8'
      
      services:
        dev_ollama:
          image: ollama/ollama:latest
          restart: unless-stopped
          volumes:
            - {{ wsl_mount_root }}/data/ollama:/root/.ollama
          ports:
            - "{{ dev_ollama_exposure | default('127.0.0.1:11434:11434') }}"
          networks:
            - fuzlang_dev_net
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
            interval: 30s
            timeout: 10s
            retries: 3
      
        dev_litellm:
          image: ghcr.io/berriai/litellm:main-latest
          restart: unless-stopped
          environment:
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
            LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
            LANGFUSE_HOST: ${LANGFUSE_HOST}
            OLLAMA_API_BASE: ${OLLAMA_API_BASE}
          ports:
            - "{{ dev_litellm_exposure | default('127.0.0.1:4000:4000') }}"
          networks:
            - fuzlang_dev_net
          depends_on:
            - dev_ollama
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
      
      networks:
        fuzlang_dev_net:
          name: fuzlang_dev_net
          driver: bridge
    dest: "{{ wsl_mount_root }}/stacks/dev/docker-compose.yml"
    mode: '0644'
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Create .env file template for dev stack (WSL2 path)
  copy:
    content: |
      # Dev stack environment variables
      # This file will be rendered from vault in Checkpoint 9
      # Placeholder values below
      
      COMPOSE_PROJECT_NAME=fuzlang-dev
      
      # Langfuse connection (shared secrets)
      LANGFUSE_PUBLIC_KEY=<placeholder>
      LANGFUSE_SECRET_KEY=<placeholder>
      LANGFUSE_HOST=http://network-server:3000
      
      # Database connection (if needed)
      DATABASE_URL=<placeholder>
      REDIS_URL=<placeholder>
      
      # Ollama connection
      OLLAMA_API_BASE=http://dev_ollama:11434
    dest: "{{ wsl_mount_root }}/stacks/dev/.env"
    mode: '0644'
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Pull Docker images for dev stack (WSL2 path)
  shell: |
    cd {{ wsl_mount_root }}/stacks/dev
    docker compose pull
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Start dev stack services (WSL2 path)
  shell: |
    cd {{ wsl_mount_root }}/stacks/dev
    docker compose up -d
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Wait for services to be healthy (WSL2 path)
  pause:
    seconds: 30
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Verify services are running (WSL2 path)
  shell: |
    cd {{ wsl_mount_root }}/stacks/dev
    docker compose ps
  register: docker_ps_result
  changed_when: false
  when: 
    - use_wsl2_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

# ============================================================================
# Windows Docker Engine Path
# ============================================================================
- name: Create docker-compose.yml for dev stack (Windows path)
  win_copy:
    content: |
      version: '3.8'
      
      services:
        dev_ollama:
          image: ollama/ollama:latest
          restart: unless-stopped
          volumes:
            - {{ data_root }}\ollama:/root/.ollama
          ports:
            - "{{ dev_ollama_exposure | default('127.0.0.1:11434:11434') }}"
          networks:
            - fuzlang_dev_net
          deploy:
            resources:
              reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
            interval: 30s
            timeout: 10s
            retries: 3
      
        dev_litellm:
          image: ghcr.io/berriai/litellm:main-latest
          restart: unless-stopped
          environment:
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
            LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
            LANGFUSE_HOST: ${LANGFUSE_HOST}
            OLLAMA_API_BASE: ${OLLAMA_API_BASE}
          ports:
            - "{{ dev_litellm_exposure | default('127.0.0.1:4000:4000') }}"
          networks:
            - fuzlang_dev_net
          depends_on:
            - dev_ollama
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
      
      networks:
        fuzlang_dev_net:
          name: fuzlang_dev_net
          driver: nat
    dest: "{{ stacks_root | regex_replace('\\\\', '\\') }}\\dev\\docker-compose.yml"
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Create .env file template for dev stack (Windows path)
  win_copy:
    content: |
      # Dev stack environment variables
      # This file will be rendered from vault in Checkpoint 9
      # Placeholder values below
      
      COMPOSE_PROJECT_NAME=fuzlang-dev
      
      # Langfuse connection (shared secrets)
      LANGFUSE_PUBLIC_KEY=<placeholder>
      LANGFUSE_SECRET_KEY=<placeholder>
      LANGFUSE_HOST=http://network-server:3000
      
      # Database connection (if needed)
      DATABASE_URL=<placeholder>
      REDIS_URL=<placeholder>
      
      # Ollama connection
      OLLAMA_API_BASE=http://dev_ollama:11434
    dest: "{{ stacks_root | regex_replace('\\\\', '\\') }}\\dev\\.env"
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Pull Docker images for dev stack (Windows path)
  win_shell: |
    cd {{ stacks_root }}\dev
    docker compose pull
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Start dev stack services (Windows path)
  win_shell: |
    cd {{ stacks_root }}\dev
    docker compose up -d
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Wait for services to be healthy (Windows path)
  pause:
    seconds: 30
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

- name: Verify services are running (Windows path)
  win_shell: |
    cd {{ stacks_root }}\dev
    docker compose ps
  register: docker_ps_result
  changed_when: false
  when: 
    - use_windows_docker
    - deploy_dev_ollama | default(false) or deploy_dev_litellm | default(false)

# ============================================================================
# Summary
# ============================================================================
- name: Display dev stack deployment summary
  debug:
    msg:
      - "=== Dev Stack Deployment ==="
      - "Docker runtime: {{ docker_runtime_choice }}"
      - "Dev Ollama deployed: {{ 'Yes' if deploy_dev_ollama | default(false) else 'No (optional)' }}"
      - "Dev LiteLLM deployed: {{ 'Yes' if deploy_dev_litellm | default(false) else 'No (optional)' }}"
      - "Service status:"
      - "{{ docker_ps_result.stdout if docker_ps_result is defined else 'N/A' }}"

