---
argument_specs:
  main:
    short_description: Ensure IIS is absent on Windows Server hosts
    description: >-
      Removes the default IIS Web Server feature. The homelab does not publish
      services through IIS.
    options:
      windows_iis_state:
        type: str
        required: false
        description: Lifecycle control point. Only absent is used in steady state.
      windows_iis_feature_name:
        type: str
        required: false
        description: Windows feature name for IIS (Web-Server).
      windows_iis_default_site_name:
        type: str
        required: false
        description: Default IIS site to stop before feature removal.
      windows_iis_reboot_timeout:
        type: int
        required: false
        description: Reboot wait timeout in seconds after feature removal.
