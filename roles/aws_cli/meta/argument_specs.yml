---
argument_specs:
  main:
    short_description: "Install and manage the AWS CLI on macOS"
    options:
      aws_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether AWS CLI should be installed or removed."
      aws_cli_installer_url:
        type: str
        default: https://awscli.amazonaws.com/AWSCLIV2.pkg
        description:
          - "Official AWS CLI v2 pkg installer URL for macOS."
      aws_cli_binary_path:
        type: str
        default: /usr/local/bin/aws
        description:
          - "Expected AWS CLI binary path after pkg install."
      aws_cli_install_root:
        type: str
        default: /usr/local/aws-cli
        description:
          - "AWS CLI v2 install root created by the pkg installer."
      aws_cli_verify:
        type: bool
        default: true
        description:
          - "Verify the requested AWS CLI state after convergence."
