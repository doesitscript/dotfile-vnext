---
storage_capacity_monitor_state: absent
storage_capacity_monitor_warning_percent: 75
storage_capacity_monitor_critical_percent: 90
storage_capacity_monitor_mounts:
  - path: /
    required: true
storage_capacity_monitor_timer_calendar: hourly
storage_capacity_monitor_randomized_delay_seconds: 0
storage_capacity_monitor_require_alloy: true
storage_capacity_monitor_journal_system_max_use: 1G
storage_capacity_monitor_script_path: /usr/local/libexec/storage-capacity-monitor
storage_capacity_monitor_service_name: storage-capacity-monitor.service
storage_capacity_monitor_timer_name: storage-capacity-monitor.timer
