---
- name: Ensure Windows Ollama runtime directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ windows_ollama_runtime_contract_root }}"
    - "{{ windows_ollama_runtime_models_path }}"

- name: Stat repo-managed NVIDIA driver contract
  ansible.windows.win_stat:
    path: "{{ windows_ollama_runtime_driver_contract_path }}"
  register: windows_ollama_runtime_driver_contract_stat

- name: Assert repo-managed NVIDIA driver contract exists when required
  ansible.builtin.assert:
    that:
      - windows_ollama_runtime_driver_contract_stat.stat.exists | bool
    fail_msg: >-
      Managed NVIDIA driver contract is required before deploying the Windows
      Ollama runtime but was not found at
      {{ windows_ollama_runtime_driver_contract_path }}.
  when: windows_ollama_runtime_require_driver_contract | bool

- name: Parse repo-managed NVIDIA driver contract
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Get-Content -LiteralPath '{{ windows_ollama_runtime_driver_contract_path }}' -Raw
  register: windows_ollama_runtime_driver_contract_raw
  changed_when: false
  when: windows_ollama_runtime_driver_contract_stat.stat.exists | bool

- name: Set parsed NVIDIA driver contract
  ansible.builtin.set_fact:
    windows_ollama_runtime_driver_contract: "{{ windows_ollama_runtime_driver_contract_raw.output[0] | from_json }}"
  changed_when: false
  when: windows_ollama_runtime_driver_contract_stat.stat.exists | bool

- name: Stop scheduled Ollama runtime before package refresh
  ansible.windows.win_powershell:
    error_action: continue
    script: |
      $task = Get-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}' -ErrorAction SilentlyContinue
      if ($task) {
        Stop-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}' -ErrorAction SilentlyContinue
      }
      Get-Process ollama -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
  changed_when: false

- name: Install Ollama via Chocolatey community package
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ windows_ollama_runtime_package_name }}"
    version: "{{ windows_ollama_runtime_package_version }}"
    state: "{{ windows_ollama_runtime_package_state }}"
    pinned: "{{ windows_ollama_runtime_package_pinned }}"
    timeout: 2700
  register: windows_ollama_runtime_choco_install

- name: Discover Ollama executable candidates
  ansible.windows.win_stat:
    path: "{{ item }}"
  loop: "{{ windows_ollama_runtime_exe_candidates }}"
  register: windows_ollama_runtime_exe_stats

- name: Resolve Ollama executable from discovered candidates
  ansible.builtin.set_fact:
    windows_ollama_runtime_exe_path: >-
      {{
        windows_ollama_runtime_exe_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
        | first
        | default('')
      }}

- name: Resolve Ollama install root from executable path
  ansible.builtin.set_fact:
    windows_ollama_runtime_install_root: >-
      {{
        windows_ollama_runtime_exe_path
        | regex_replace('[\\\\/][^\\\\/]+$', '')
      }}
  when: windows_ollama_runtime_exe_path | length > 0

- name: Assert Ollama executable was found after Chocolatey install
  ansible.builtin.assert:
    that:
      - windows_ollama_runtime_exe_path | length > 0
    fail_msg: >-
      Chocolatey package {{ windows_ollama_runtime_package_name }} completed but
      ollama.exe was not found in
      {{ windows_ollama_runtime_exe_candidates | join(', ') }}.

- name: Ensure OLLAMA_MODELS machine environment variable is managed
  ansible.windows.win_environment:
    state: present
    name: OLLAMA_MODELS
    value: "{{ windows_ollama_runtime_models_path }}"
    level: machine

- name: Ensure OLLAMA_HOST machine environment variable is managed
  ansible.windows.win_environment:
    state: present
    name: OLLAMA_HOST
    value: "{{ windows_ollama_runtime_listen_address }}"
    level: machine

- name: Ensure Windows Firewall rule exists for Ollama runtime API
  community.windows.win_firewall_rule:
    name: "{{ windows_ollama_runtime_firewall_rule_name }}"
    localport: "{{ windows_ollama_runtime_port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

- name: Configure boot-triggered Ollama runtime scheduled task
  community.windows.win_scheduled_task:
    name: "{{ windows_ollama_runtime_task_name }}"
    description: Host-local Ollama runtime managed by the windows_ollama_runtime role
    actions:
      - path: "{{ windows_ollama_runtime_exe_path }}"
        arguments: serve
        working_directory: "{{ windows_ollama_runtime_install_root }}"
    triggers:
      - type: boot
        delay: "{{ windows_ollama_runtime_task_boot_delay }}"
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    state: present
    enabled: true

- name: Start Ollama runtime scheduled task
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Start-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}'

- name: Wait for Ollama runtime API health
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_healthcheck_url }}"
    method: GET
    status_code: 200
  register: windows_ollama_runtime_healthcheck
  retries: 12
  delay: 10
  until: >-
    (windows_ollama_runtime_healthcheck.status_code | default(0) | int) == 200
    or (windows_ollama_runtime_healthcheck.status | default(0) | int) == 200

- name: Ensure declared Ollama models are present via HTTP API
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_pull_url }}"
    method: POST
    body: "{{ {'name': item, 'stream': false} | to_json }}"
    content_type: application/json
    status_code: 200
    timeout: "{{ windows_ollama_runtime_pull_timeout_seconds }}"
  register: windows_ollama_runtime_model_pull
  retries: "{{ windows_ollama_runtime_pull_retries }}"
  delay: "{{ windows_ollama_runtime_pull_delay }}"
  until: >-
    (windows_ollama_runtime_model_pull.status_code | default(0) | int) == 200
    or (windows_ollama_runtime_model_pull.status | default(0) | int) == 200
  loop: "{{ windows_ollama_runtime_models_present }}"
  loop_control:
    label: "{{ item }}"
  changed_when: >-
    'success' in (
      (windows_ollama_runtime_model_pull.json.status | default(''))
      | string
      | lower
    )
    or 'success' in (
      (windows_ollama_runtime_model_pull.content | default(''))
      | string
      | lower
    )

- name: List locally available Ollama models via HTTP API
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_healthcheck_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: windows_ollama_runtime_model_list
  changed_when: false

- name: Capture Ollama runtime version
  ansible.windows.win_command:
    argv:
      - "{{ windows_ollama_runtime_exe_path }}"
      - "--version"
  register: windows_ollama_runtime_version
  changed_when: false

- name: Persist Windows Ollama runtime contract
  ansible.windows.win_copy:
    dest: "{{ windows_ollama_runtime_contract_path }}"
    content: >-
      {{
        {
          'runtime': 'ollama',
          'runtime_slug': 'ollama-secondary-hvh-01',
          'package_name': windows_ollama_runtime_package_name,
          'package_version': windows_ollama_runtime_package_version,
          'install_root': windows_ollama_runtime_install_root,
          'exe_path': windows_ollama_runtime_exe_path,
          'models_path': windows_ollama_runtime_models_path,
          'api_base': windows_ollama_runtime_api_base,
          'listen_address': windows_ollama_runtime_listen_address,
          'default_model': windows_ollama_runtime_default_model,
          'fallback_model': windows_ollama_runtime_fallback_model,
          'models_present': windows_ollama_runtime_models_present,
          'model_aliases': windows_ollama_runtime_model_aliases,
          'driver_contract_path': windows_ollama_runtime_driver_contract_path,
          'driver_contract': windows_ollama_runtime_driver_contract | default({}),
          'ollama_version': windows_ollama_runtime_version.stdout | default(''),
          'captured_at_utc': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
        } | to_nice_json
      }}

- name: Persist Windows Ollama runtime health receipt
  ansible.windows.win_copy:
    dest: "{{ windows_ollama_runtime_receipt_path }}"
    content: >-
      {{
        {
          'api_base': windows_ollama_runtime_api_base,
          'healthcheck_url': windows_ollama_runtime_healthcheck_url,
          'health_status': (
            windows_ollama_runtime_healthcheck.status_code
            | default(windows_ollama_runtime_healthcheck.status)
            | default('')
          ),
          'model_list_content': windows_ollama_runtime_model_list.content | default(''),
          'captured_at_utc': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
        } | to_nice_json
      }}
