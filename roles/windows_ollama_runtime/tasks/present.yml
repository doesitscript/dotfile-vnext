---
- name: Ensure Windows Ollama runtime directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ windows_ollama_runtime_contract_root }}"
    - "{{ windows_ollama_runtime_models_path }}"

- name: Assert windows_ollama_runtime_model_pull_mode is supported
  ansible.builtin.assert:
    that:
      - windows_ollama_runtime_model_pull_mode in ["inline", "background"]
    fail_msg: >-
      windows_ollama_runtime_model_pull_mode must be "inline" or "background".

- name: Stat repo-managed NVIDIA driver contract when required
  ansible.windows.win_stat:
    path: "{{ windows_ollama_runtime_driver_contract_path }}"
  register: windows_ollama_runtime_driver_contract_stat
  when: windows_ollama_runtime_require_driver_contract | bool

- name: Assert repo-managed NVIDIA driver contract exists when required
  ansible.builtin.assert:
    that:
      - windows_ollama_runtime_driver_contract_stat.stat.exists | bool
    fail_msg: >-
      Managed NVIDIA driver contract is required before deploying the Windows
      Ollama runtime but was not found at
      {{ windows_ollama_runtime_driver_contract_path }}.
  when: windows_ollama_runtime_require_driver_contract | bool

- name: Parse repo-managed NVIDIA driver contract
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Get-Content -LiteralPath '{{ windows_ollama_runtime_driver_contract_path }}' -Raw
  register: windows_ollama_runtime_driver_contract_raw
  changed_when: false
  check_mode: false
  when:
    - windows_ollama_runtime_require_driver_contract | bool
    - windows_ollama_runtime_driver_contract_stat.stat.exists | default(false) | bool

- name: Assert parsed NVIDIA driver contract content was returned
  ansible.builtin.assert:
    that:
      - (windows_ollama_runtime_driver_contract_raw.output | default([]) | length) > 0
    fail_msg: >-
      Managed NVIDIA driver contract read returned no output from
      {{ windows_ollama_runtime_driver_contract_path }}.
  changed_when: false
  when:
    - windows_ollama_runtime_require_driver_contract | bool
    - windows_ollama_runtime_driver_contract_stat.stat.exists | default(false) | bool

- name: Set parsed NVIDIA driver contract
  ansible.builtin.set_fact:
    windows_ollama_runtime_driver_contract: "{{ windows_ollama_runtime_driver_contract_raw.output[0] | from_json }}"
  changed_when: false
  when:
    - windows_ollama_runtime_require_driver_contract | bool
    - windows_ollama_runtime_driver_contract_stat.stat.exists | default(false) | bool

- name: Stop scheduled Ollama runtime before package refresh
  ansible.windows.win_powershell:
    error_action: continue
    script: |
      $task = Get-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}' -ErrorAction SilentlyContinue
      if ($task) {
        Stop-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}' -ErrorAction SilentlyContinue
      }
      Get-Process ollama -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
  changed_when: false

- name: Discover existing Ollama executable candidates before package install
  ansible.windows.win_stat:
    path: "{{ item }}"
  loop: "{{ windows_ollama_runtime_exe_candidates }}"
  register: windows_ollama_runtime_exe_stats_pre

- name: Resolve existing Ollama executable before package install
  ansible.builtin.set_fact:
    windows_ollama_runtime_exe_path_pre: >-
      {{
        windows_ollama_runtime_exe_stats_pre.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
        | first
        | default('')
      }}

- name: Install Ollama via windows_artifact_download + win_package
  ansible.builtin.include_tasks: install_setup_exe.yml
  when: (windows_ollama_runtime_exe_path_pre | length) == 0

- name: Discover Ollama executable candidates
  ansible.windows.win_stat:
    path: "{{ item }}"
  loop: "{{ windows_ollama_runtime_exe_candidates }}"
  register: windows_ollama_runtime_exe_stats

- name: Resolve Ollama executable from discovered candidates
  ansible.builtin.set_fact:
    windows_ollama_runtime_exe_path: >-
      {{
        windows_ollama_runtime_exe_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
        | first
        | default('')
      }}

- name: Resolve Ollama install root from executable path
  ansible.builtin.set_fact:
    windows_ollama_runtime_install_root: >-
      {{
        windows_ollama_runtime_exe_path
        | regex_replace('[\\\\/][^\\\\/]+$', '')
      }}
  when: windows_ollama_runtime_exe_path | length > 0

- name: Assert Ollama executable was found after install path
  ansible.builtin.assert:
    that:
      - windows_ollama_runtime_exe_path | length > 0
    fail_msg: >-
      OllamaSetup.exe install completed but ollama.exe was not found in
      {{ windows_ollama_runtime_exe_candidates | join(', ') }}.

- name: Ensure OLLAMA_MODELS machine environment variable is managed
  ansible.windows.win_environment:
    state: present
    name: OLLAMA_MODELS
    value: "{{ windows_ollama_runtime_models_path }}"
    level: machine

- name: Ensure OLLAMA_HOST machine environment variable is managed
  ansible.windows.win_environment:
    state: present
    name: OLLAMA_HOST
    value: "{{ windows_ollama_runtime_listen_address }}"
    level: machine

- name: Ensure requested Ollama context length is managed
  ansible.windows.win_environment:
    state: present
    name: OLLAMA_CONTEXT_LENGTH
    value: "{{ windows_ollama_runtime_context_length | string }}"
    level: machine
  when: windows_ollama_runtime_context_length | int > 0

- name: Remove managed Ollama context length when no override is requested
  ansible.windows.win_environment:
    state: absent
    name: OLLAMA_CONTEXT_LENGTH
    level: machine
  when: windows_ollama_runtime_context_length | int <= 0

- name: Ensure Windows Firewall rule exists for Ollama runtime API
  community.windows.win_firewall_rule:
    name: "{{ windows_ollama_runtime_firewall_rule_name }}"
    localport: "{{ windows_ollama_runtime_port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

- name: Configure boot-triggered Ollama runtime scheduled task
  community.windows.win_scheduled_task:
    name: "{{ windows_ollama_runtime_task_name }}"
    description: Host-local Ollama runtime managed by the windows_ollama_runtime role
    actions:
      - path: "{{ windows_ollama_runtime_exe_path }}"
        arguments: serve
        working_directory: "{{ windows_ollama_runtime_install_root }}"
    triggers:
      - type: boot
        delay: "{{ windows_ollama_runtime_task_boot_delay }}"
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    # Unlimited: default PT72H terminates long-lived ollama serve and does not restart.
    execution_time_limit: "{{ windows_ollama_runtime_task_execution_time_limit }}"
    state: present
    enabled: true

- name: Remove background model pull task when inline mode is selected
  community.windows.win_scheduled_task:
    name: "{{ windows_ollama_runtime_pull_task_name }}"
    state: absent
  when: windows_ollama_runtime_model_pull_mode != 'background'

- name: Start Ollama runtime scheduled task
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Start-ScheduledTask -TaskName '{{ windows_ollama_runtime_task_name }}'
  when: not ansible_check_mode

- name: Wait for Ollama runtime API health
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_healthcheck_url }}"
    method: GET
    status_code: 200
  register: windows_ollama_runtime_healthcheck
  retries: 12
  delay: 10
  until: >-
    (windows_ollama_runtime_healthcheck.status_code | default(0) | int) == 200
    or (windows_ollama_runtime_healthcheck.status | default(0) | int) == 200
  when: not ansible_check_mode

- name: Ensure declared Ollama models are present via HTTP API
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_pull_url }}"
    method: POST
    body: "{{ {'name': item, 'stream': false} | to_json }}"
    content_type: application/json
    status_code: 200
    timeout: "{{ windows_ollama_runtime_pull_timeout_seconds }}"
  register: windows_ollama_runtime_model_pull
  retries: "{{ windows_ollama_runtime_pull_retries }}"
  delay: "{{ windows_ollama_runtime_pull_delay }}"
  until: >-
    (windows_ollama_runtime_model_pull.status_code | default(0) | int) == 200
    or (windows_ollama_runtime_model_pull.status | default(0) | int) == 200
  loop: "{{ windows_ollama_runtime_models_present }}"
  loop_control:
    label: "{{ item }}"
  changed_when: >-
    'success' in (
      (windows_ollama_runtime_model_pull.json.status | default(''))
      | string
      | lower
    )
    or 'success' in (
      (windows_ollama_runtime_model_pull.content | default(''))
      | string
      | lower
    )
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'inline'

- name: Render background model pull worker
  ansible.windows.win_template:
    src: pull_models.ps1.j2
    dest: "{{ windows_ollama_runtime_pull_script_path }}"
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'background'

- name: Persist background model pull request
  ansible.windows.win_copy:
    dest: "{{ windows_ollama_runtime_pull_request_path }}"
    content: >-
      {{
        {
          'models_present': windows_ollama_runtime_models_present,
          'local_api_base': windows_ollama_runtime_local_api_base,
          'healthcheck_url': windows_ollama_runtime_healthcheck_url,
          'pull_url': windows_ollama_runtime_pull_url,
          'ollama_exe_path': windows_ollama_runtime_exe_path,
          'pull_timeout_seconds': windows_ollama_runtime_pull_timeout_seconds,
          'pull_parallel': windows_ollama_runtime_model_pull_parallel | bool,
          'queued_at_utc': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
        } | to_nice_json
      }}
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'background'

- name: Configure background model pull task
  community.windows.win_scheduled_task:
    name: "{{ windows_ollama_runtime_pull_task_name }}"
    description: Durable background Ollama model pull managed by the windows_ollama_runtime role
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: >-
          -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File "{{ windows_ollama_runtime_pull_script_path }}"
        working_directory: "{{ windows_ollama_runtime_contract_root }}"
    triggers:
      - type: boot
        delay: "{{ windows_ollama_runtime_pull_task_boot_delay }}"
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    allow_demand_start: true
    start_when_available: true
    run_only_if_network_available: true
    execution_time_limit: "{{ windows_ollama_runtime_pull_task_execution_time_limit }}"
    state: present
    enabled: true
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'background'

- name: Start or observe background model pull task
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $taskName = '{{ windows_ollama_runtime_pull_task_name }}'
      $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
      if ($task.State -ne 'Running') {
        Start-ScheduledTask -TaskName $taskName
        Start-Sleep -Seconds 2
        $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
      }
      $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
      [pscustomobject]@{
        task_name = $taskName
        state = [string]$task.State
        last_task_result = $taskInfo.LastTaskResult
        last_run_time = if ($taskInfo.LastRunTime) { $taskInfo.LastRunTime.ToString('o') } else { '' }
        next_run_time = if ($taskInfo.NextRunTime) { $taskInfo.NextRunTime.ToString('o') } else { '' }
      } | ConvertTo-Json -Compress
  register: windows_ollama_runtime_pull_task_status_raw
  changed_when: false
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'background'

- name: Parse background model pull task status
  ansible.builtin.set_fact:
    windows_ollama_runtime_pull_task_status: >-
      {{
        (
          windows_ollama_runtime_pull_task_status_raw.output | default([])
        )[0] | from_json
      }}
  changed_when: false
  when:
    - not ansible_check_mode
    - windows_ollama_runtime_model_pull_mode == 'background'
    - (windows_ollama_runtime_pull_task_status_raw.output | default([]) | length) > 0

- name: List locally available Ollama models via HTTP API
  ansible.windows.win_uri:
    url: "{{ windows_ollama_runtime_healthcheck_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: windows_ollama_runtime_model_list
  changed_when: false
  when: not ansible_check_mode

- name: Capture Ollama runtime version
  ansible.windows.win_command:
    argv:
      - "{{ windows_ollama_runtime_exe_path }}"
      - "--version"
  register: windows_ollama_runtime_version
  changed_when: false

- name: Persist Windows Ollama runtime contract
  ansible.windows.win_copy:
    dest: "{{ windows_ollama_runtime_contract_path }}"
    content: >-
      {{
        {
          'runtime': 'ollama',
          'runtime_slug': 'ollama-secondary-hvh-01',
          'install_method': 'windows_artifact_download+win_package',
          'package_version': windows_ollama_runtime_package_version,
          'setup_url': windows_ollama_runtime_setup_url,
          'setup_sha256': windows_ollama_runtime_setup_sha256,
          'install_root': windows_ollama_runtime_install_root,
          'exe_path': windows_ollama_runtime_exe_path,
          'models_path': windows_ollama_runtime_models_path,
          'api_base': windows_ollama_runtime_api_base,
          'listen_address': windows_ollama_runtime_listen_address,
          'context_length': windows_ollama_runtime_context_length | int,
          'default_model': windows_ollama_runtime_default_model,
          'fallback_model': windows_ollama_runtime_fallback_model,
          'models_present': windows_ollama_runtime_models_present,
          'model_pull_mode': windows_ollama_runtime_model_pull_mode,
          'model_pull_task_name': windows_ollama_runtime_pull_task_name,
          'model_pull_request_path': windows_ollama_runtime_pull_request_path,
          'model_pull_receipt_path': windows_ollama_runtime_pull_receipt_path,
          'model_pull_log_path': windows_ollama_runtime_pull_log_path,
          'model_aliases': windows_ollama_runtime_model_aliases,
          'driver_contract_path': windows_ollama_runtime_driver_contract_path,
          'driver_contract': windows_ollama_runtime_driver_contract | default({}),
          'ollama_version': windows_ollama_runtime_version.stdout | default(''),
          'captured_at_utc': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
        } | to_nice_json
      }}

- name: Persist Windows Ollama runtime health receipt
  ansible.windows.win_copy:
    dest: "{{ windows_ollama_runtime_receipt_path }}"
    content: >-
      {{
        {
          'api_base': windows_ollama_runtime_api_base,
          'healthcheck_url': windows_ollama_runtime_healthcheck_url,
          'context_length': windows_ollama_runtime_context_length | int,
          'health_status': (
            windows_ollama_runtime_healthcheck.status_code
            | default(windows_ollama_runtime_healthcheck.status)
            | default('')
          ),
          'model_pull_mode': windows_ollama_runtime_model_pull_mode,
          'model_pull_task_status': windows_ollama_runtime_pull_task_status | default({}),
          'model_pull_receipt_path': windows_ollama_runtime_pull_receipt_path,
          'model_pull_log_path': windows_ollama_runtime_pull_log_path,
          'model_list_content': windows_ollama_runtime_model_list.content | default(''),
          'captured_at_utc': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
        } | to_nice_json
      }}
