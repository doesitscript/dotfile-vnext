---
# windows_ollama_runtime — managed host-local Ollama runtime for Windows GPU hosts.
#
# Install authority: pinned upstream OllamaSetup.exe via reusable
# windows_artifact_download (resume/async/checksum) then ansible.windows.win_package.
# Chocolatey is deprecated for Ollama in this role.
# Model presence: Ollama HTTP /api/pull via ansible.windows.win_uri (no shell).
# Desktop hosts can queue large pulls into a durable background scheduled task.
# Note: Galaxy role andrewrothstein.ollama is Linux-only and is not used here.

windows_ollama_runtime_state: absent

# Pinned upstream release (version without leading "v")
windows_ollama_runtime_package_version: "0.32.3"
windows_ollama_runtime_version: "v{{ windows_ollama_runtime_package_version }}"
windows_ollama_runtime_setup_url: >-
  https://github.com/ollama/ollama/releases/download/{{ windows_ollama_runtime_version }}/OllamaSetup.exe
# GitHub release asset digest for OllamaSetup.exe @ v0.32.3
windows_ollama_runtime_setup_sha256: >-
  78bc7e1f750882fcee9948561700bf881eb7b30bec95fd37934e6285a368b8b2
windows_ollama_runtime_setup_expected_bytes: 1562770448
windows_ollama_runtime_download_root: 'C:\ProgramData\Ansible\artifacts\ollama'
windows_ollama_runtime_setup_exe_path: >-
  {{ windows_ollama_runtime_download_root }}\OllamaSetup-{{ windows_ollama_runtime_package_version }}.exe
windows_ollama_runtime_setup_silent_args: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
windows_ollama_runtime_setup_async_seconds: 28800
windows_ollama_runtime_setup_async_poll: 30

# Legacy zip vars retained only as migration fallbacks.
windows_ollama_runtime_download_url: >-
  https://github.com/ollama/ollama/releases/download/{{ windows_ollama_runtime_version }}/ollama-windows-amd64.zip
windows_ollama_runtime_install_root: 'C:\Program Files\Ollama'
windows_ollama_runtime_archive_path: '{{ windows_ollama_runtime_download_root }}\ollama-windows-amd64.zip'
windows_ollama_runtime_contract_root: 'C:\ProgramData\Ansible\windows_ollama_runtime'
windows_ollama_runtime_contract_path: '{{ windows_ollama_runtime_contract_root }}\runtime_contract.json'
windows_ollama_runtime_receipt_path: '{{ windows_ollama_runtime_contract_root }}\runtime_receipt.json'

# Candidate binary locations — per-user Setup.exe path first, then Program Files.
windows_ollama_runtime_user_install_root: >-
  C:\Users\joshc\AppData\Local\Programs\Ollama
windows_ollama_runtime_exe_candidates:
  - '{{ windows_ollama_runtime_user_install_root }}\ollama.exe'
  - '{{ windows_ollama_runtime_install_root }}\ollama.exe'
  - 'C:\Program Files\Ollama\ollama.exe'
  - 'C:\Program Files (x86)\Ollama\ollama.exe'

windows_ollama_runtime_bind_host: '0.0.0.0'
windows_ollama_runtime_port: 11434
windows_ollama_runtime_host_loopback: '127.0.0.1'
windows_ollama_runtime_models_path: 'F:\shares\public\models\ollama'
windows_ollama_runtime_default_model: 'qwen2.5-coder:3b'
windows_ollama_runtime_fallback_model: 'qwen2.5-coder:1.5b'
windows_ollama_runtime_models_present:
  - '{{ windows_ollama_runtime_default_model }}'
windows_ollama_runtime_model_aliases:
  - lane: code-review
    runtime_slug: ollama-secondary-hvh-01
    model: '{{ windows_ollama_runtime_default_model }}'
    fallback_model: '{{ windows_ollama_runtime_fallback_model }}'

windows_ollama_runtime_api_base: >-
  http://{{ host_ip | default(ansible_host | default('127.0.0.1')) }}:{{ windows_ollama_runtime_port }}
windows_ollama_runtime_listen_address: '{{ windows_ollama_runtime_bind_host }}:{{ windows_ollama_runtime_port }}'
windows_ollama_runtime_local_api_base: >-
  http://{{ windows_ollama_runtime_host_loopback }}:{{ windows_ollama_runtime_port }}
windows_ollama_runtime_healthcheck_url: '{{ windows_ollama_runtime_local_api_base }}/api/tags'
windows_ollama_runtime_pull_url: '{{ windows_ollama_runtime_local_api_base }}/api/pull'
windows_ollama_runtime_pull_timeout_seconds: 3600
windows_ollama_runtime_model_pull_mode: inline
windows_ollama_runtime_pull_task_name: 'ollama-model-prefetch'
windows_ollama_runtime_pull_task_boot_delay: PT45S
windows_ollama_runtime_pull_script_path: >-
  {{ windows_ollama_runtime_contract_root }}\pull_models.ps1
windows_ollama_runtime_pull_request_path: >-
  {{ windows_ollama_runtime_contract_root }}\model_pull_request.json
windows_ollama_runtime_pull_receipt_path: >-
  {{ windows_ollama_runtime_contract_root }}\model_pull_receipt.json
windows_ollama_runtime_pull_log_path: >-
  {{ windows_ollama_runtime_contract_root }}\model_pull.log
windows_ollama_runtime_task_name: 'ollama-runtime'
windows_ollama_runtime_firewall_rule_name: 'Ollama Runtime API'
windows_ollama_runtime_task_boot_delay: PT15S
# PT0S = unlimited. Win/Task Scheduler default is PT72H, which kills long-lived
# `ollama serve` after three days and leaves it dead until reboot or Start-Task.
windows_ollama_runtime_task_execution_time_limit: PT0S
windows_ollama_runtime_pull_task_execution_time_limit: PT0S
windows_ollama_runtime_pull_retries: 3
windows_ollama_runtime_pull_delay: 10
windows_ollama_runtime_require_driver_contract: true
windows_ollama_runtime_driver_contract_path: >-
  {{ llm_compute_windows_driver_contract_path | default('C:\ProgramData\Ansible\llm_compute_windows\nvidia_driver_contract.json') }}
windows_ollama_runtime_driver_contract_package_name: >-
  {{ llm_compute_windows_driver_contract_package_name | default('nvidia-studio-driver') }}
windows_ollama_runtime_purge_models_on_absent: false
windows_ollama_runtime_exe_path: '{{ windows_ollama_runtime_install_root }}\ollama.exe'
