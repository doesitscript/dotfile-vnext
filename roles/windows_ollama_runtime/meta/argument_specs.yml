---
argument_specs:
  main:
    short_description: Managed host-local Ollama runtime on Windows GPU hosts
    description: >-
      Installs Ollama on Windows via pinned OllamaSetup.exe
      (windows_artifact_download + win_package), manages the machine-scoped
      runtime contract, and enforces a repo-declared set of locally hosted
      models for reuse behind the central LiteLLM gateway.
    options:
      windows_ollama_runtime_state:
        type: str
        required: false
        description: Lifecycle control for the Windows Ollama runtime capability.
      windows_ollama_runtime_package_version:
        type: str
        required: false
        description: Pinned upstream Ollama version (no leading v).
      windows_ollama_runtime_version:
        type: str
        required: false
        description: Upstream release tag derived from package_version.
      windows_ollama_runtime_setup_url:
        type: str
        required: false
        description: HTTPS URL for the pinned OllamaSetup.exe asset.
      windows_ollama_runtime_setup_sha256:
        type: str
        required: false
        description: Expected sha256 for the pinned OllamaSetup.exe asset.
      windows_ollama_runtime_setup_expected_bytes:
        type: int
        required: false
        description: Expected byte size for operator progress checks.
      windows_ollama_runtime_download_root:
        type: str
        required: false
        description: Local artifact cache root for OllamaSetup.exe.
      windows_ollama_runtime_setup_exe_path:
        type: str
        required: false
        description: Published path for the downloaded OllamaSetup.exe.
      windows_ollama_runtime_setup_silent_args:
        type: str
        required: false
        description: Inno Setup silent arguments for win_package.
      windows_ollama_runtime_setup_async_seconds:
        type: int
        required: false
        description: Async timeout for download and install steps.
      windows_ollama_runtime_setup_async_poll:
        type: int
        required: false
        description: Async poll interval seconds.
      windows_ollama_runtime_download_url:
        type: str
        required: false
        description: Legacy standalone zip URL retained for migration reference only.
      windows_ollama_runtime_install_root:
        type: str
        required: false
        description: Machine-wide install root candidate for Ollama binaries.
      windows_ollama_runtime_user_install_root:
        type: str
        required: false
        description: Per-user LocalAppData Programs\\Ollama install root.
      windows_ollama_runtime_archive_path:
        type: str
        required: false
        description: Cached archive path for the standalone Ollama runtime zip.
      windows_ollama_runtime_contract_root:
        type: str
        required: false
        description: Machine-local contract directory for the runtime receipt.
      windows_ollama_runtime_contract_path:
        type: str
        required: false
        description: Machine-local runtime contract JSON path.
      windows_ollama_runtime_receipt_path:
        type: str
        required: false
        description: Machine-local health receipt JSON path.
      windows_ollama_runtime_bind_host:
        type: str
        required: false
        description: Host/interface binding component for the Ollama API listener.
      windows_ollama_runtime_port:
        type: int
        required: false
        description: Host-local Ollama HTTP API port.
      windows_ollama_runtime_models_path:
        type: str
        required: false
        description: Durable model storage path for Ollama models on the Windows host.
      windows_ollama_runtime_default_model:
        type: str
        required: false
        description: Primary model that must be present for this runtime.
      windows_ollama_runtime_fallback_model:
        type: str
        required: false
        description: Explicit fallback model for constrained secondary hosts.
      windows_ollama_runtime_models_present:
        type: list
        elements: str
        required: false
        description: Exact Ollama model tags that must be present locally.
      windows_ollama_runtime_model_pull_mode:
        type: str
        required: false
        description: >-
          Model enforcement mode: inline waits inside Ansible; background queues
          a durable Windows scheduled task for long-running pulls.
      windows_ollama_runtime_model_aliases:
        type: list
        elements: dict
        required: false
        description: Lane/runtime aliases that this host-local runtime is intended to serve.
      windows_ollama_runtime_pull_task_name:
        type: str
        required: false
        description: Scheduled-task name for durable background model pulls.
      windows_ollama_runtime_pull_task_boot_delay:
        type: str
        required: false
        description: ISO-8601 boot delay before a queued model-pull task runs.
      windows_ollama_runtime_pull_script_path:
        type: str
        required: false
        description: Path to the repo-managed PowerShell pull worker on the Windows host.
      windows_ollama_runtime_pull_request_path:
        type: str
        required: false
        description: Path to the current queued model-pull request JSON.
      windows_ollama_runtime_pull_receipt_path:
        type: str
        required: false
        description: Path to the model-pull receipt JSON.
      windows_ollama_runtime_pull_log_path:
        type: str
        required: false
        description: Path to the durable model-pull worker log.
      windows_ollama_runtime_task_name:
        type: str
        required: false
        description: Scheduled-task name used to keep the Ollama runtime running at boot.
      windows_ollama_runtime_firewall_rule_name:
        type: str
        required: false
        description: Windows Firewall rule name for the Ollama HTTP API listener.
      windows_ollama_runtime_task_boot_delay:
        type: str
        required: false
        description: ISO-8601 task boot delay before Ollama serve starts.
      windows_ollama_runtime_task_execution_time_limit:
        type: str
        required: false
        description: >-
          ISO-8601 execution time limit for ollama-runtime. Use PT0S (unlimited)
          so Task Scheduler does not kill long-lived ollama serve after the
          Windows default of 72 hours.
      windows_ollama_runtime_pull_task_execution_time_limit:
        type: str
        required: false
        description: >-
          ISO-8601 execution time limit for the background model-pull task.
          Use PT0S so large pulls are not cut off at the 72-hour default.
      windows_ollama_runtime_require_driver_contract:
        type: bool
        required: false
        description: Require the repo-managed NVIDIA driver contract before runtime install.
      windows_ollama_runtime_driver_contract_path:
        type: str
        required: false
        description: Path to the repo-managed Windows NVIDIA driver contract JSON.
      windows_ollama_runtime_driver_contract_package_name:
        type: str
        required: false
        description: Expected NVIDIA package source recorded in the runtime contract.
      windows_ollama_runtime_purge_models_on_absent:
        type: bool
        required: false
        description: Remove the managed model root during absent if explicitly requested.
