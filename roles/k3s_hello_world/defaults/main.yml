---
k3s_hello_world_state: present
k3s_hello_world_namespace: k3s-smoke
k3s_hello_world_name: hello-world
k3s_hello_world_image: hashicorp/http-echo:1.0
k3s_hello_world_text: "hello from hom-lab-ctl-k3s-01"
k3s_hello_world_port: 5678
k3s_hello_world_kubectl: "{{ hostvars['mac-dev'].k3s_mac_client_kubectl_path | default(ansible_env.HOME ~ '/.local/bin/kubectl') }}"
k3s_hello_world_kubeconfig: "{{ hostvars['mac-dev'].k3s_mac_client_kubeconfig | default(ansible_env.HOME ~ '/.kube/hom-lab-ctl-k3s-01.yaml') }}"
k3s_hello_world_wait_timeout: 120s
k3s_hello_world_curl_image: curlimages/curl:8.10.1
