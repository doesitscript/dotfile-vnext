---
argument_specs:
  main:
    short_description: Install and verify the deprecated Tunnelblick Monterey build on macOS.
    options:
      tunnelblick_mac_state:
        type: str
        default: present
        choices:
          - present
          - absent
      tunnelblick_mac_download_url:
        type: str
        default: https://tunnelblick.net/iprelease/Tunnelblick_3.8.8g_build_5779.3.dmg
      tunnelblick_mac_download_checksum:
        type: str
        default: sha256:b3310a7435543c3047fd8500297fde7825f5ceb89e194f6adec0a3ee773d669d
      tunnelblick_mac_download_path:
        type: str
        default: /tmp/Tunnelblick_3.8.8g_build_5779.3.dmg
      tunnelblick_mac_mount_path:
        type: str
        default: /tmp/Tunnelblick-Legacy
      tunnelblick_mac_app_path:
        type: str
        default: /Applications/Tunnelblick.app
      tunnelblick_mac_app_in_dmg_path:
        type: str
        default: /tmp/Tunnelblick-Legacy/Tunnelblick.app
      tunnelblick_mac_expected_version:
        type: str
        default: 3.8.8g
      tunnelblick_mac_expected_build_version:
        type: str
        default: "5779.3"
      tunnelblick_mac_verify_install:
        type: bool
        default: true
      tunnelblick_mac_attempt_stabilization:
        type: bool
        default: false
      tunnelblick_mac_enforce_stabilization:
        type: bool
        default: false
      tunnelblick_mac_stabilization_become:
        type: bool
        default: false
      tunnelblick_mac_verify_absent:
        type: bool
        default: true
