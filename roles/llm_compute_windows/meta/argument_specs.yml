---
argument_specs:
  main:
    short_description: Install and publish a managed NVIDIA driver contract for Windows LLM hosts.
    options:
      llm_compute_windows_studio_driver_version:
        type: str
        default: "581.29"
      llm_compute_windows_studio_driver_package_version:
        type: str
        required: false
      llm_compute_windows_studio_driver_pinned:
        type: bool
        default: true
      llm_compute_windows_manage_package:
        type: bool
        default: true
      llm_compute_windows_force_reinstall:
        type: bool
        default: false
      llm_compute_windows_enforce_expected_driver_version:
        type: bool
        default: false
      llm_compute_windows_enforce_expected_package_version:
        type: bool
        default: false
      llm_compute_windows_reboot_timeout:
        type: int
        default: 600
      llm_compute_windows_contract_root:
        type: str
        default: C:\ProgramData\Ansible\llm_compute_windows
      llm_compute_windows_driver_contract_path:
        type: str
        default: C:\ProgramData\Ansible\llm_compute_windows\nvidia_driver_contract.json
      llm_compute_windows_driver_discovery_contract_path:
        type: str
        default: C:\ProgramData\Ansible\llm_compute_windows\nvidia_driver_discovery_contract.json
      llm_compute_windows_driver_contract_package_name:
        type: str
        default: nvidia-studio-driver
      llm_compute_windows_nvidia_smi_candidate_paths:
        type: list
        elements: str
        default:
          - C:\Program Files\NVIDIA Corporation\NVSMI\nvidia-smi.exe
          - C:\Windows\System32\nvidia-smi.exe
