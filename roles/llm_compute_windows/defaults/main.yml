---
# llm_compute_windows — default variables.
# Override in group_vars or host_vars per node.

llm_compute_windows_studio_driver_version: "581.29"
llm_compute_windows_studio_driver_package_version: "581.29.0"
# Package semver and live nvidia-smi driver can diverge after Windows updates.
# Override llm_compute_windows_studio_driver_version per host when GPU-P publish
# asserts driver_version_matches against nvidia-smi.
llm_compute_windows_studio_driver_pinned: true
llm_compute_windows_manage_package: true
llm_compute_windows_force_reinstall: false
llm_compute_windows_enforce_expected_driver_version: false
llm_compute_windows_enforce_expected_package_version: false

llm_compute_windows_reboot_timeout: 600
llm_compute_windows_contract_root: C:\ProgramData\Ansible\llm_compute_windows
llm_compute_windows_driver_contract_path: "{{ llm_compute_windows_contract_root }}\\nvidia_driver_contract.json"
llm_compute_windows_driver_discovery_contract_path: "{{ llm_compute_windows_contract_root }}\\nvidia_driver_discovery_contract.json"
llm_compute_windows_driver_contract_package_name: nvidia-studio-driver
llm_compute_windows_nvidia_smi_candidate_paths:
  - C:\Program Files\NVIDIA Corporation\NVSMI\nvidia-smi.exe
  - C:\Windows\System32\nvidia-smi.exe
