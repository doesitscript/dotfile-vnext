---
kilo_ide_state: present

# Live Kilo Code reads ~/.config/kilo/kilo.jsonc (not config.json).
kilo_ide_config_dir: "{{ ansible_env.HOME }}/.config/kilo"
kilo_ide_config_path: "{{ kilo_ide_config_dir }}/kilo.jsonc"
# Legacy path previously written by this role — convert once into kilo.jsonc.
kilo_ide_legacy_config_path: "{{ kilo_ide_config_dir }}/config.json"

# merge (default): convert legacy path if needed, then merge managed slices into
# existing kilo.jsonc so user MCP/custom agents/providers are not wiped.
# overwrite: write the managed template only (recovery / first bootstrap).
kilo_ide_apply_mode: merge

# API key — resolved from vault when empty; written into kilo.jsonc (mode 0600).
kilo_ide_api_key: ""
kilo_ide_api_key_env_var: "LITELLM_API_KEY"
kilo_ide_gateway_api_base: "http://litellm.hom.lab/v1"
kilo_ide_provider_id: "litellm"
kilo_ide_provider_display_name: "Homelab LiteLLM"
kilo_ide_provider_npm: "@ai-sdk/openai-compatible"
kilo_ide_provider_timeout_ms: 300000
kilo_ide_provider_chunk_timeout_ms: 30000

# Vault source for API key when kilo_ide_api_key is unset.
kilo_ide_vault_file_path: "{{ dotfiles_home }}/vault/shared.vault.yml"
kilo_ide_vault_key: "vault_k3s_litellm_gateway_master_key"
kilo_ide_require_api_key: true

# Default + small models use provider_id/model_id form.
kilo_ide_default_model: "litellm/qwen3.6-35b-a3b"
kilo_ide_small_model: "litellm/qwen2.5-coder-7b@desktop"
kilo_ide_default_agent: "code"
kilo_ide_auto_collapse_reasoning: true
kilo_ide_terminal_command_display: collapsed
kilo_ide_code_edit_display: collapsed
kilo_ide_disabled_providers: []

kilo_ide_permission:
  read: allow
  glob: allow
  grep: allow
  list: allow
  bash: allow
  edit: allow
  task: deny
  webfetch: ask
  websearch: ask

kilo_ide_compaction:
  auto: true
  reserved: 8192

# Agent / capability → model map (merged into existing agent block by id).
# Aligns with Continue chat=32B and edit/apply=7B lanes.
kilo_ide_agents:
  code:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Primary coding agent — 5090 vLLM Qwen3.6 (tools)."
    permission:
      task: deny
      bash: allow
      edit: allow
      read: allow
      glob: allow
      grep: allow
  build:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Build / implement — same as code."
  plan:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Planning / architecture on 5090 vLLM."
  ask:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Q&A / conversation on 5090 vLLM."
  general:
    model: "litellm/qwen3.6-35b-a3b"
    description: "General assistant — 5090 vLLM."
  debug:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Debug / hard investigation — 5090 vLLM."
    permission:
      task: deny
  explore:
    model: "litellm/qwen2.5-coder-7b@desktop"
    description: "Explore / search — desktop 7B (faster tool loops)."
    permission:
      task: deny
      read: allow
      glob: allow
      grep: allow
  title:
    model: "litellm/qwen2.5-coder-7b@desktop"
    description: "Session titles — small/fast."
  summary:
    model: "litellm/qwen2.5-coder-7b@desktop"
    description: "Summaries — small/fast."
  compaction:
    model: "litellm/qwen2.5-coder-7b@desktop"
    description: "Context compaction — small/fast."
  orchestrator:
    model: "litellm/qwen3.6-35b-a3b"
    description: "Orchestrator / multi-step — 5090 vLLM."

kilo_ide_models:
  - id: "qwen3.6-35b-a3b"
    name: "Qwen3.6 35B-A3B (5090 vLLM)"
    tool_call: true
    context: 32768
    output: 8192
    input: 28672
