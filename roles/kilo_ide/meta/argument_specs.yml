---
argument_specs:
  main:
    short_description: "Deploy Kilo Code homelab LiteLLM provider + agent model map"
    description: >
      Deploys ~/.config/kilo/kilo.jsonc with a LiteLLM OpenAI-compatible
      provider. Default apply mode merges managed slices and converts legacy
      config.json once so user MCP/custom agents are not wiped.
    options:
      kilo_ide_state:
        type: str
        required: false
        default: present
        description: "present to deploy, absent to remove config"
      kilo_ide_apply_mode:
        type: str
        required: false
        default: merge
        choices:
          - merge
          - overwrite
        description: >-
          merge preserves non-managed keys; overwrite writes the managed
          template only.
      kilo_ide_api_key:
        type: str
        required: false
        default: ""
        description: "LiteLLM gateway master key; loaded from vault when empty"
      kilo_ide_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
        description: "Base URL for the OpenAI-compatible endpoint"
      kilo_ide_default_model:
        type: str
        required: false
        description: "Default model in provider_id/model_id format"
      kilo_ide_small_model:
        type: str
        required: false
        description: "Small model for titles/summaries (provider_id/model_id)"
      kilo_ide_default_agent:
        type: str
        required: false
        default: code
        description: "Primary agent id (e.g. code)"
      kilo_ide_models:
        type: list
        required: false
        description: "List of model objects with id, name, tool_call, context, output"
      kilo_ide_agents:
        type: dict
        required: false
        description: "Map of agent id → {model, description?, permission?}"
      kilo_ide_require_api_key:
        type: bool
        required: false
        default: true
