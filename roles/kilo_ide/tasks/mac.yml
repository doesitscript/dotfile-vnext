---
- name: Check Kilo IDE vault file
  ansible.builtin.stat:
    path: "{{ kilo_ide_vault_file_path }}"
  register: _kilo_vault_stat
  when:
    - kilo_ide_state == "present"
    - kilo_ide_api_key | default('') | length == 0

- name: Load shared vault for Kilo LiteLLM API key when unset
  ansible.builtin.include_vars:
    file: "{{ kilo_ide_vault_file_path }}"
    name: _kilo_vault_vars
  when:
    - kilo_ide_state == "present"
    - kilo_ide_api_key | default('') | length == 0
    - _kilo_vault_stat.stat.exists | default(false)
  no_log: true

- name: Resolve Kilo LiteLLM API key for render
  ansible.builtin.set_fact:
    kilo_ide_render_api_key: >-
      {{
        kilo_ide_api_key
        if kilo_ide_api_key | default('') | length > 0
        else (
          (_kilo_vault_vars | default({}))[kilo_ide_vault_key]
          | default('REPLACE_WITH_LITELLM_KEY')
        )
      }}
  no_log: true
  when: kilo_ide_state == "present"

- name: Resolve Kilo model catalog from commissioned SSOT
  ansible.builtin.set_fact:
    kilo_ide_models: []
  when:
    - kilo_ide_state == "present"
    - ai_cli_commissioned_models is defined

- name: Translate commissioned model rows to Kilo schema
  ansible.builtin.set_fact:
    kilo_ide_models: >-
      {{
        kilo_ide_models
        + [{
          'id': item.id,
          'name': item.display_name | default(item.id),
          'enabled': item.enabled | default(true),
          'tool_call': 'tools' in (item.labels | default([])),
          'context': item.context | default(32768),
          'output': item.max_output | default(4096),
          'input': (item.context | default(32768)) - (item.max_output | default(4096))
        }]
      }}
  loop: "{{ ai_cli_commissioned_models }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - kilo_ide_state == "present"
    - ai_cli_commissioned_models is defined
    - >-
      (
        item.labels | default([])
        | intersect(ai_cli_client_model_contracts.kilo_ide.accept_roles | default(['chat', 'edit', 'apply']))
        | length
      ) > 0

- name: Require Kilo default model in commissioned catalog
  ansible.builtin.assert:
    that:
      - >-
        (kilo_ide_default_model | regex_replace('^[^/]+/', '')) in
        (kilo_ide_models | selectattr('enabled', 'equalto', true) | map(attribute='id') | list)
    fail_msg: >-
      Kilo default model {{ kilo_ide_default_model }} is not in the enabled
      SSOT model catalog accepted by the Kilo client contract.
  when:
    - kilo_ide_state == "present"
    - ai_cli_commissioned_models is defined

- name: Require a real LiteLLM key for Kilo when present
  ansible.builtin.assert:
    that:
      - kilo_ide_default_model | default('') | length > 0
      - kilo_ide_gateway_api_base | default('') | length > 0
      - (kilo_ide_models | default([]) | length) > 0
      - (kilo_ide_agents | default({}) | length) > 0
      - kilo_ide_apply_mode | default('merge') in ['merge', 'overwrite']
      - >-
        (not (kilo_ide_require_api_key | default(true) | bool))
        or (
          (kilo_ide_render_api_key | default('') | length > 0)
          and (kilo_ide_render_api_key | default('') != 'REPLACE_WITH_LITELLM_KEY')
        )
    fail_msg: >-
      kilo_ide_state=present but default model/agents/models are empty, apply
      mode is not merge|overwrite, or the LiteLLM API key is still
      REPLACE_WITH_LITELLM_KEY. Hydrate vault/shared.vault.yml
      ({{ kilo_ide_vault_key }}) or set kilo_ide_api_key.
  when: kilo_ide_state == "present"

- name: Ensure Kilo config directory exists
  ansible.builtin.file:
    path: "{{ kilo_ide_config_dir }}"
    state: directory
    mode: "0700"
  when: kilo_ide_state == "present"

- name: Stat live and legacy Kilo config paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ kilo_ide_config_path }}"
    - "{{ kilo_ide_legacy_config_path }}"
  register: _kilo_config_stats
  when: kilo_ide_state == "present"

- name: Convert legacy config.json → kilo.jsonc once (path migration)
  ansible.builtin.copy:
    src: "{{ kilo_ide_legacy_config_path }}"
    dest: "{{ kilo_ide_config_path }}"
    remote_src: true
    mode: "0600"
    force: false
  when:
    - kilo_ide_state == "present"
    - not (_kilo_config_stats.results[0].stat.exists | default(false))
    - _kilo_config_stats.results[1].stat.exists | default(false)

- name: Render managed Kilo overlay to a temp file
  ansible.builtin.tempfile:
    state: file
    suffix: .kilo-overlay.json
  register: _kilo_overlay_tmp
  when: kilo_ide_state == "present"
  # Ansible check mode does not populate the tempfile result path.  Create
  # this ephemeral controller/host-local staging file so the following
  # template task can still render and preview the managed overlay.
  check_mode: false
  changed_when: false

- name: Write managed Kilo overlay template
  ansible.builtin.template:
    src: kilo_config.json.j2
    dest: "{{ _kilo_overlay_tmp.path }}"
    mode: "0600"
  when: kilo_ide_state == "present"
  no_log: true
  changed_when: false

- name: Capture Kilo config checksum before merge
  ansible.builtin.stat:
    path: "{{ kilo_ide_config_path }}"
    checksum_algorithm: sha256
  register: _kilo_config_before
  when:
    - kilo_ide_state == "present"
    - (kilo_ide_apply_mode | default('merge')) == 'merge'

- name: Merge managed Kilo slices into existing kilo.jsonc
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/scripts/merge_kilo_config.py"
      - --existing
      - "{{ kilo_ide_config_path }}"
      - --overlay
      - "{{ _kilo_overlay_tmp.path }}"
      - --out
      - "{{ kilo_ide_config_path }}"
  when:
    - kilo_ide_state == "present"
    - (kilo_ide_apply_mode | default('merge')) == 'merge'
  register: _kilo_merge_cmd
  changed_when: false

- name: Capture Kilo config checksum after merge
  ansible.builtin.stat:
    path: "{{ kilo_ide_config_path }}"
    checksum_algorithm: sha256
  register: _kilo_config_after
  when:
    - kilo_ide_state == "present"
    - (kilo_ide_apply_mode | default('merge')) == 'merge'

- name: Report whether Kilo merge changed on-disk config
  ansible.builtin.debug:
    msg: >-
      kilo.jsonc
      {{ 'changed' if (
        (_kilo_config_before.stat.checksum | default(''))
        != (_kilo_config_after.stat.checksum | default(''))
      ) else 'unchanged' }}
  changed_when: >-
    (_kilo_config_before.stat.checksum | default(''))
    != (_kilo_config_after.stat.checksum | default(''))
  when:
    - kilo_ide_state == "present"
    - (kilo_ide_apply_mode | default('merge')) == 'merge'

- name: Overwrite kilo.jsonc with managed template only
  ansible.builtin.copy:
    src: "{{ _kilo_overlay_tmp.path }}"
    dest: "{{ kilo_ide_config_path }}"
    remote_src: true
    mode: "0600"
  when:
    - kilo_ide_state == "present"
    - (kilo_ide_apply_mode | default('merge')) == 'overwrite'
  no_log: true

- name: Remove temp Kilo overlay
  ansible.builtin.file:
    path: "{{ _kilo_overlay_tmp.path }}"
    state: absent
  when:
    - kilo_ide_state == "present"
    - _kilo_overlay_tmp.path is defined
  changed_when: false

- name: Remove legacy Kilo config.json after conversion/merge
  ansible.builtin.file:
    path: "{{ kilo_ide_legacy_config_path }}"
    state: absent
  when: kilo_ide_state == "present"

- name: Remove Kilo config managed by this role
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kilo_ide_config_path }}"
    - "{{ kilo_ide_legacy_config_path }}"
  when: kilo_ide_state == "absent"

- name: Report Kilo IDE state
  ansible.builtin.debug:
    msg:
      kilo_ide_state: "{{ kilo_ide_state }}"
      config: "{{ kilo_ide_config_path }}"
      apply_mode: "{{ kilo_ide_apply_mode | default('merge') }}"
      default_model: "{{ kilo_ide_default_model }}"
      small_model: "{{ kilo_ide_small_model }}"
      default_agent: "{{ kilo_ide_default_agent }}"
      agent_count: "{{ kilo_ide_agents | default({}) | length }}"
      model_count: "{{ kilo_ide_models | default([]) | length }}"
      api_key_resolved: >-
        {{
          (kilo_ide_render_api_key | default('') | length > 0)
          and (kilo_ide_render_api_key | default('') != 'REPLACE_WITH_LITELLM_KEY')
        }}
  when: kilo_ide_state == "present"
