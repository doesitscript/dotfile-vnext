---
# MCP Inspector on macOS: ensure npx, optional global install, deploy usage doc.
# Ref: https://modelcontextprotocol.io/docs/tools/inspector
# Requires: roles/common/node must run first — provides node_npm_executable.

- name: Check npx is available for MCP Inspector
  ansible.builtin.stat:
    path: "{{ node_npm_executable | dirname }}/npx"
  register: _mcp_inspector_npx_stat

- name: Fail if npx is not available (run common/node role first)
  ansible.builtin.fail:
    msg: >
      npx not found at {{ node_npm_executable | dirname }}/npx.
      Ensure roles/common/node has run on this host.
  when: not _mcp_inspector_npx_stat.stat.exists
  tags:
    - mcp_inspector

- name: Install MCP Inspector globally via npm (optional, for faster npx runs)
  community.general.npm:
    name: "@modelcontextprotocol/inspector"
    global: true
    state: present
    executable: "{{ node_npm_executable }}"
  when:
    - _mcp_inspector_npx_stat.stat.exists
    - mcp_inspector_install_package | bool
  tags:
    - mcp_inspector
    - mcp_inspector_install

- name: Resolve MCP Inspector usage doc path and parent directory
  ansible.builtin.set_fact:
    _mcp_inspector_doc_resolved: "{{ _path }}"
    _mcp_inspector_doc_dir: "{{ _doc_dir }}"
  vars:
    _path: "{{ mcp_inspector_doc_path | default((dotfiles_user_home | default(ansible_user_dir)) + '/docs/mcp_inspector_usage.md') }}"
    _doc_dir: "{{ (_path.split('/')[:-1] | join('/')) if (_path.split('/') | length > 1) else ((dotfiles_user_home | default(ansible_user_dir)) + '/docs') }}"
  when: mcp_inspector_deploy_doc | bool
  tags:
    - mcp_inspector
    - mcp_inspector_doc

- name: Ensure directory for MCP Inspector usage doc exists
  ansible.builtin.file:
    path: "{{ _mcp_inspector_doc_dir }}"
    state: directory
    mode: "0755"
  when: mcp_inspector_deploy_doc | bool
  tags:
    - mcp_inspector
    - mcp_inspector_doc

- name: Deploy MCP Inspector usage document
  ansible.builtin.template:
    src: mcp_inspector_usage.md.j2
    dest: "{{ _mcp_inspector_doc_resolved }}"
    mode: "0644"
    newline_sequence: '\n'
  when: mcp_inspector_deploy_doc | bool
  tags:
    - mcp_inspector
    - mcp_inspector_doc
