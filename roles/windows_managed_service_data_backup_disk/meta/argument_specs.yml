---
argument_specs:
  main:
    short_description: >-
      Manage the opinionated non-OS data/backup disk layout for Windows service
      nodes.
    options:
      windows_managed_service_data_backup_disk_state:
        type: str
        choices:
          - present
          - absent
      windows_managed_service_data_backup_disk_backup_percent:
        type: float
      windows_managed_service_data_backup_disk_data_percent:
        type: float
      windows_managed_service_data_backup_disk_target_model:
        type: str
      windows_managed_service_data_backup_disk_target_serial_number:
        type: str
      windows_managed_service_data_backup_disk_rebuild_approved:
        type: bool
