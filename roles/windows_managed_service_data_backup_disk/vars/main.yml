---
# Static opinionated contract for the managed service data/backup disk.

__windows_managed_service_data_backup_disk_required_surface_type: "windows_host"
__windows_managed_service_data_backup_disk_required_system_usage_class: "managed_service_node"
__windows_managed_service_data_backup_disk_required_availability_expectation: "expected_continuous"
__windows_managed_service_data_backup_disk_required_automation_management_model: "infrastructure_managed"

__windows_managed_service_data_backup_disk_partition_style: "gpt"
__windows_managed_service_data_backup_disk_filesystem: "ntfs"
__windows_managed_service_data_backup_disk_allocation_unit_size: 4096

__windows_managed_service_data_backup_disk_backup_drive_letter: "E"
__windows_managed_service_data_backup_disk_backup_label: "backups"
__windows_managed_service_data_backup_disk_data_drive_letter: "F"
__windows_managed_service_data_backup_disk_data_label: "data"

# Compare actual provisioned percentages against the physical disk size. Keep a
# small tolerance for partition alignment and reserved metadata overhead.
__windows_managed_service_data_backup_disk_percent_tolerance: 0.10

__windows_managed_service_data_backup_disk_marker_dir: >-
  C:\ProgramData\Ansible\storage
__windows_managed_service_data_backup_disk_marker_path: >-
  C:\ProgramData\Ansible\storage\windows_managed_service_data_backup_disk.json
__windows_managed_service_data_backup_disk_marker_schema: >-
  castle.storage.windows_managed_service_data_backup_disk.v1
