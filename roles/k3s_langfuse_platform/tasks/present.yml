---
- name: Load vault variables for Langfuse platform
  ansible.builtin.include_tasks: load_vault.yml

- name: Install Python Kubernetes library via apt
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: true
  become: true

- name: Probe for existing Helm binary
  ansible.builtin.command:
    cmd: helm version --short
  register: _k3s_langfuse_existing_helm
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Helm
  when:
    - k3s_langfuse_platform_install_helm | bool
    - _k3s_langfuse_existing_helm.rc != 0
  block:
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0700"

    - name: Install Helm via script
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh --version v{{ k3s_langfuse_platform_helm_version }}
      args:
        creates: /usr/local/bin/helm
      become: true
      environment:
        DESIRED_VERSION: v{{ k3s_langfuse_platform_helm_version }}

- name: Add Langfuse Helm repository
  kubernetes.core.helm_repository:
    name: langfuse
    repo_url: "{{ k3s_langfuse_platform_chart_repo }}"
    state: present
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_repo_add
  retries: 3
  delay: 15
  until: _k3s_langfuse_repo_add is succeeded

- name: Create Langfuse namespace
  kubernetes.core.k8s:
    name: "{{ k3s_langfuse_platform_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Reset external Langfuse PostgreSQL database on fresh install
  ansible.builtin.shell: |
    set -euo pipefail
    cid="$(docker ps -q \
      --filter 'label=com.docker.compose.service=postgres' \
      --filter 'label=com.docker.compose.project=fuzlang-net' | head -n1)"
    if [ -z "$cid" ]; then
      echo "fuzlang-net postgres container not found" >&2
      docker ps --filter 'label=com.docker.compose.project=fuzlang-net' >&2 || true
      exit 1
    fi
    docker exec "$cid" psql -U {{ k3s_langfuse_platform_resolved_postgres_user }} -d postgres -c \
      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='{{ k3s_langfuse_platform_resolved_postgres_db }}' AND pid <> pg_backend_pid();" >/dev/null
    docker exec "$cid" psql -U {{ k3s_langfuse_platform_resolved_postgres_user }} -d postgres -c \
      "DROP DATABASE IF EXISTS {{ k3s_langfuse_platform_resolved_postgres_db }};"
  args:
    executable: /bin/bash
  delegate_to: "{{ k3s_langfuse_platform_postgres_inventory_host }}"
  become: true
  changed_when: true
  when:
    - k3s_langfuse_platform_fresh_install | bool
    - k3s_langfuse_platform_reset_external_postgres_db_on_fresh_install | bool

- name: Ensure Langfuse external PostgreSQL database exists
  ansible.builtin.shell: |
    set -euo pipefail
    cid="$(docker ps -q \
      --filter 'label=com.docker.compose.service=postgres' \
      --filter 'label=com.docker.compose.project=fuzlang-net' | head -n1)"
    if [ -z "$cid" ]; then
      echo "fuzlang-net postgres container not found" >&2
      docker ps --filter 'label=com.docker.compose.project=fuzlang-net' >&2 || true
      exit 1
    fi
    exists="$(docker exec "$cid" psql -U {{ k3s_langfuse_platform_resolved_postgres_user }} -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ k3s_langfuse_platform_resolved_postgres_db }}'")"
    if [ "$exists" != "1" ]; then
      docker exec "$cid" psql -U {{ k3s_langfuse_platform_resolved_postgres_user }} -d postgres -c \
        "CREATE DATABASE {{ k3s_langfuse_platform_resolved_postgres_db }};"
    fi
  args:
    executable: /bin/bash
  delegate_to: "{{ k3s_langfuse_platform_postgres_inventory_host }}"
  become: true
  register: _k3s_langfuse_db_create
  changed_when: "'CREATE DATABASE' in _k3s_langfuse_db_create.stdout"

- name: Remove bundled Langfuse PostgreSQL StatefulSet when using external database
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: langfuse-postgresql
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_langfuse_platform_postgres_deploy | bool

- name: Remove bundled Langfuse PostgreSQL PVC when using external database
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-postgresql-0
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_langfuse_platform_postgres_deploy | bool

- name: Remove orphan Langfuse ClickHouse shard PVC when present
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-clickhouse-shard0-1
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_orphan_ch_pvc
  failed_when: false

- name: Query Langfuse Helm release status
  ansible.builtin.command:
    cmd: helm status {{ k3s_langfuse_platform_release_name }} -n {{ k3s_langfuse_platform_namespace }} -o json
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_helm_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove stuck Langfuse Helm release before redeploy
  ansible.builtin.command:
    cmd: helm uninstall {{ k3s_langfuse_platform_release_name }} -n {{ k3s_langfuse_platform_namespace }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  when:
    - _k3s_langfuse_helm_status.rc == 0
    - (_k3s_langfuse_helm_status.stdout | default('') | trim | length) > 0
    - (_k3s_langfuse_helm_status.stdout | from_json).info.status | lower is search('failed|pending')

- name: Deploy Langfuse platform with Helm
  kubernetes.core.helm:
    name: "{{ k3s_langfuse_platform_release_name }}"
    chart_ref: "langfuse/{{ k3s_langfuse_platform_chart_name }}"
    release_namespace: "{{ k3s_langfuse_platform_namespace }}"
    chart_version: "{{ k3s_langfuse_platform_chart_version | default(omit) }}"
    create_namespace: false
    wait: true
    wait_timeout: 10m
    values:
      global:
        security:
          allowInsecureImages: true
        valkey:
          password: "{{ k3s_langfuse_platform_resolved_redis_password }}"

      langfuse:
        deployment:
          strategy:
            type: "{{ k3s_langfuse_platform_deployment_strategy_type }}"
        nextauth:
          url: "{{ k3s_langfuse_platform_nextauth_url }}"
          secret:
            value: "{{ k3s_langfuse_platform_resolved_nextauth_secret }}"
        salt:
          value: "{{ k3s_langfuse_platform_resolved_salt }}"
        encryptionKey:
          value: "{{ k3s_langfuse_platform_resolved_encryption_key }}"
        additionalEnv:
          - name: DATABASE_URL
            value: "{{ k3s_langfuse_platform_resolved_database_url }}"
        web:
          replicas: "{{ k3s_langfuse_platform_web_replicas }}"
          readinessProbe:
            initialDelaySeconds: "{{ k3s_langfuse_platform_web_readiness_initial_delay_seconds }}"
          livenessProbe:
            initialDelaySeconds: "{{ k3s_langfuse_platform_web_liveness_initial_delay_seconds }}"
          resources:
            requests:
              cpu: "{{ k3s_langfuse_platform_web_cpu_request }}"
              memory: "{{ k3s_langfuse_platform_web_memory_request }}"
            limits:
              cpu: "{{ k3s_langfuse_platform_web_cpu_limit }}"
              memory: "{{ k3s_langfuse_platform_web_memory_limit }}"
          service:
            type: "{{ k3s_langfuse_platform_service_type }}"
            port: "{{ k3s_langfuse_platform_service_port }}"
            nodePort: "{{ k3s_langfuse_platform_node_port }}"
        worker:
          replicas: "{{ k3s_langfuse_platform_worker_replicas }}"
          livenessProbe:
            initialDelaySeconds: "{{ k3s_langfuse_platform_worker_liveness_initial_delay_seconds }}"
          resources:
            requests:
              cpu: "{{ k3s_langfuse_platform_worker_cpu_request }}"
              memory: "{{ k3s_langfuse_platform_worker_memory_request }}"
            limits:
              cpu: "{{ k3s_langfuse_platform_worker_cpu_limit }}"
              memory: "{{ k3s_langfuse_platform_worker_memory_limit }}"

      postgresql:
        deploy: false
        host: "{{ k3s_langfuse_platform_postgres_host }}"
        port: "{{ k3s_langfuse_platform_postgres_port }}"
        auth:
          username: "{{ k3s_langfuse_platform_resolved_postgres_user }}"
          password: "{{ k3s_langfuse_platform_resolved_postgres_password }}"
          database: "{{ k3s_langfuse_platform_resolved_postgres_db }}"
        migration:
          autoMigrate: true

      clickhouse:
        deploy: "{{ k3s_langfuse_platform_clickhouse_deploy | bool }}"
        host: "{{ k3s_langfuse_platform_clickhouse_host }}"
        httpPort: "{{ k3s_langfuse_platform_clickhouse_http_port }}"
        nativePort: "{{ k3s_langfuse_platform_clickhouse_native_port }}"
        database: "{{ k3s_langfuse_platform_clickhouse_database }}"
        clusterEnabled: "{{ k3s_langfuse_platform_clickhouse_cluster_enabled | bool }}"
        auth:
          username: "{{ k3s_langfuse_platform_clickhouse_user }}"
          password: "{{ k3s_langfuse_platform_resolved_clickhouse_password }}"
        migration:
          autoMigrate: true
          url: "clickhouse://{{ k3s_langfuse_platform_clickhouse_host }}:{{ k3s_langfuse_platform_clickhouse_native_port }}"
        replicaCount: "1"
        resourcesPreset: none
        resources:
          requests:
            cpu: "{{ k3s_langfuse_platform_clickhouse_cpu_request }}"
            memory: "{{ k3s_langfuse_platform_clickhouse_memory_request }}"
          limits:
            cpu: "{{ k3s_langfuse_platform_clickhouse_cpu_limit }}"
            memory: "{{ k3s_langfuse_platform_clickhouse_memory_limit }}"
        zookeeper:
          replicaCount: "1"
        persistence:
          enabled: true
          size: 20Gi


      s3:
        deploy: "{{ k3s_langfuse_platform_s3_deploy | bool }}"
        bucket: "{{ k3s_langfuse_platform_s3_bucket }}"
        endpoint: "{{ k3s_langfuse_platform_s3_endpoint }}"
        region: "{{ k3s_langfuse_platform_s3_region }}"
        forcePathStyle: "{{ k3s_langfuse_platform_s3_force_path_style | bool }}"
        accessKeyId:
          value: "{{ k3s_langfuse_platform_resolved_s3_access_key }}"
        secretAccessKey:
          value: "{{ k3s_langfuse_platform_resolved_s3_secret_key }}"
        defaultBuckets: "{{ k3s_langfuse_platform_s3_bucket }}"
        image:
          repository: "{{ k3s_langfuse_platform_s3_image_repository }}"
          tag: "{{ k3s_langfuse_platform_s3_image_tag }}"
        command: "{{ k3s_langfuse_platform_s3_command }}"
        args: "{{ k3s_langfuse_platform_s3_args }}"
        auth:
          rootUser: "{{ k3s_langfuse_platform_resolved_s3_root_user }}"
          rootPassword: "{{ k3s_langfuse_platform_resolved_s3_root_password }}"

      redis:
        deploy: "{{ k3s_langfuse_platform_redis_deploy | bool }}"
        host: "{{ k3s_langfuse_platform_redis_host }}"
        port: "{{ k3s_langfuse_platform_redis_port }}"
        auth:
          username: "{{ k3s_langfuse_platform_redis_username }}"
          password: "{{ k3s_langfuse_platform_resolved_redis_password }}"
        primary:
          persistence:
            enabled: true
            size: 8Gi
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_helm_apply
  retries: 3
  delay: 15
  until: _k3s_langfuse_helm_apply is succeeded

- name: Wait for Langfuse web deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    name: "{{ k3s_langfuse_platform_release_name }}-web"
    wait: true
    wait_timeout: 300
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_web_deployment

- name: Display Langfuse access information
  ansible.builtin.debug:
    msg: |
      Langfuse Platform deployed successfully!

      Namespace: {{ k3s_langfuse_platform_namespace }}
      Release: {{ k3s_langfuse_platform_release_name }}

      Access URL: http://{{ ansible_default_ipv4.address }}:{{ k3s_langfuse_platform_node_port }}

      Components deployed:
      - Langfuse Web ({{ k3s_langfuse_platform_web_replicas }} replicas)
      - Langfuse Worker ({{ k3s_langfuse_platform_worker_replicas }} replicas)
      - External PostgreSQL at {{ k3s_langfuse_platform_postgres_host }}:{{ k3s_langfuse_platform_postgres_port }}
      - ClickHouse at {{ k3s_langfuse_platform_clickhouse_host }}:{{ k3s_langfuse_platform_clickhouse_http_port }} / {{ k3s_langfuse_platform_clickhouse_native_port }}
      - Redis at {{ k3s_langfuse_platform_redis_host }}:{{ k3s_langfuse_platform_redis_port }}
      - S3 endpoint {{ k3s_langfuse_platform_s3_endpoint }}

      Check status: kubectl get pods -n {{ k3s_langfuse_platform_namespace }}
