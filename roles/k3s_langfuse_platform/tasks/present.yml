---
- name: Load vault variables for Langfuse platform
  ansible.builtin.include_tasks: load_vault.yml

- name: Install Python Kubernetes library via apt
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: true
  become: true

- name: Install Helm
  when: k3s_langfuse_platform_install_helm | bool
  block:
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0700"

    - name: Install Helm via script
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh --version v{{ k3s_langfuse_platform_helm_version }}
      args:
        creates: /usr/local/bin/helm
      become: true
      environment:
        DESIRED_VERSION: v{{ k3s_langfuse_platform_helm_version }}

- name: Add Langfuse Helm repository
  kubernetes.core.helm_repository:
    name: langfuse
    repo_url: "{{ k3s_langfuse_platform_chart_repo }}"
    state: present
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create Langfuse namespace
  kubernetes.core.k8s:
    name: "{{ k3s_langfuse_platform_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Remove bundled Langfuse PostgreSQL StatefulSet when using external database
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: StatefulSet
    name: langfuse-postgresql
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_langfuse_platform_postgres_deploy | bool

- name: Remove bundled Langfuse PostgreSQL PVC when using external database
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-postgresql-0
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_langfuse_platform_postgres_deploy | bool

- name: Remove orphan Langfuse ClickHouse shard PVC when present
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-clickhouse-shard0-1
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_orphan_ch_pvc
  failed_when: false

- name: Deploy Langfuse platform with Helm
  kubernetes.core.helm:
    name: "{{ k3s_langfuse_platform_release_name }}"
    chart_ref: "langfuse/{{ k3s_langfuse_platform_chart_name }}"
    release_namespace: "{{ k3s_langfuse_platform_namespace }}"
    chart_version: "{{ k3s_langfuse_platform_chart_version | default(omit) }}"
    create_namespace: false
    wait: true
    wait_timeout: 10m
    values:
      global:
        security:
          allowInsecureImages: true
        valkey:
          password: "{{ k3s_langfuse_platform_resolved_redis_password }}"

      langfuse:
        nextauth:
          url: "{{ k3s_langfuse_platform_nextauth_url }}"
          secret:
            value: "{{ k3s_langfuse_platform_resolved_nextauth_secret }}"
        salt:
          value: "{{ k3s_langfuse_platform_resolved_salt }}"
        encryptionKey:
          value: "{{ k3s_langfuse_platform_resolved_encryption_key }}"
        additionalEnv:
          - name: DATABASE_URL
            value: "{{ k3s_langfuse_platform_resolved_database_url }}"
        web:
          replicas: "{{ k3s_langfuse_platform_web_replicas }}"
          resources:
            limits:
              cpu: "{{ k3s_langfuse_platform_web_cpu_limit }}"
              memory: "{{ k3s_langfuse_platform_web_memory_limit }}"
          service:
            type: "{{ k3s_langfuse_platform_service_type }}"
            port: "{{ k3s_langfuse_platform_service_port }}"
            nodePort: "{{ k3s_langfuse_platform_node_port }}"
        worker:
          replicas: "{{ k3s_langfuse_platform_worker_replicas }}"
          resources:
            limits:
              cpu: "{{ k3s_langfuse_platform_worker_cpu_limit }}"
              memory: "{{ k3s_langfuse_platform_worker_memory_limit }}"

      postgresql:
        deploy: false
        host: "{{ k3s_langfuse_platform_postgres_host }}"
        port: "{{ k3s_langfuse_platform_postgres_port }}"
        auth:
          username: "{{ k3s_langfuse_platform_postgres_user }}"
          password: "{{ k3s_langfuse_platform_resolved_postgres_password }}"
          database: "{{ k3s_langfuse_platform_resolved_postgres_db }}"
        migration:
          autoMigrate: true

      clickhouse:
        deploy: true
        auth:
          username: "{{ k3s_langfuse_platform_clickhouse_user }}"
          password: "{{ k3s_langfuse_platform_resolved_clickhouse_password }}"
        replicaCount: "1"
        resourcesPreset: medium
        zookeeper:
          replicaCount: "1"
        persistence:
          enabled: true
          size: 20Gi


      s3:
        deploy: true
        defaultBuckets: "{{ k3s_langfuse_platform_s3_bucket }}"
        image:
          repository: "{{ k3s_langfuse_platform_s3_image_repository }}"
          tag: "{{ k3s_langfuse_platform_s3_image_tag }}"
        command: "{{ k3s_langfuse_platform_s3_command }}"
        args: "{{ k3s_langfuse_platform_s3_args }}"
        auth:
          rootUser: "{{ k3s_langfuse_platform_resolved_s3_root_user }}"
          rootPassword: "{{ k3s_langfuse_platform_resolved_s3_root_password }}"

      redis:
        deploy: true
        auth:
          enabled: true
          password: "{{ k3s_langfuse_platform_resolved_redis_password }}"
        primary:
          persistence:
            enabled: true
            size: 8Gi
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Langfuse web deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    name: "{{ k3s_langfuse_platform_release_name }}-web"
    wait: true
    wait_timeout: 300
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _k3s_langfuse_web_deployment

- name: Display Langfuse access information
  ansible.builtin.debug:
    msg: |
      Langfuse Platform deployed successfully!
      
      Namespace: {{ k3s_langfuse_platform_namespace }}
      Release: {{ k3s_langfuse_platform_release_name }}
      
      Access URL: http://{{ ansible_default_ipv4.address }}:{{ k3s_langfuse_platform_node_port }}
      
      Components deployed:
      - Langfuse Web ({{ k3s_langfuse_platform_web_replicas }} replicas)
      - Langfuse Worker ({{ k3s_langfuse_platform_worker_replicas }} replicas)
      - External PostgreSQL at {{ k3s_langfuse_platform_postgres_host }}:{{ k3s_langfuse_platform_postgres_port }}
      - ClickHouse (persistent storage: 20Gi)
      - Redis (persistent storage: 8Gi)
      
      Check status: kubectl get pods -n {{ k3s_langfuse_platform_namespace }}
