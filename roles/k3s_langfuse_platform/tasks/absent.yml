---
- name: Uninstall Langfuse Helm release
  kubernetes.core.helm:
    name: "{{ k3s_langfuse_platform_release_name }}"
    release_namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ignore_errors: true

- name: Delete Langfuse namespace
  kubernetes.core.k8s:
    name: "{{ k3s_langfuse_platform_namespace }}"
    api_version: v1
    kind: Namespace
    state: absent
    wait: true
    wait_timeout: 300
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ignore_errors: true
