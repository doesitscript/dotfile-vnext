---
- name: Uninstall Langfuse Helm release
  kubernetes.core.helm:
    name: "{{ k3s_langfuse_platform_release_name }}"
    release_namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ignore_errors: true

- name: Delete Langfuse namespace
  kubernetes.core.k8s:
    name: "{{ k3s_langfuse_platform_namespace }}"
    api_version: v1
    kind: Namespace
    state: absent
    wait: true
    wait_timeout: 300
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ignore_errors: true

- name: Remove lingering Langfuse PostgreSQL PVC after namespace delete
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-postgresql-0
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  failed_when: false

- name: Remove lingering Langfuse ClickHouse shard PVC after namespace delete
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-clickhouse-shard0-1
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  failed_when: false

- name: Remove lingering Langfuse ClickHouse primary PVC after namespace delete
  kubernetes.core.k8s:
    api_version: v1
    kind: PersistentVolumeClaim
    name: data-langfuse-clickhouse-shard0-0
    namespace: "{{ k3s_langfuse_platform_namespace }}"
    state: absent
    wait: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  failed_when: false

- name: Discover stranded Langfuse local-path storage directories
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/storage
    file_type: directory
    recurse: false
    patterns:
      - "*_langfuse_data-langfuse-clickhouse-shard0-0"
      - "*_langfuse_data-langfuse-clickhouse-shard0-1"
      - "*_langfuse_data-langfuse-zookeeper-0"
      - "*_langfuse_langfuse-s3"
      - "*_langfuse_valkey-data-langfuse-redis-primary-0"
  register: k3s_langfuse_platform_stranded_storage_dirs
  failed_when: false

- name: Remove stranded Langfuse local-path storage directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ k3s_langfuse_platform_stranded_storage_dirs.files | default([]) }}"
  become: true
