---
# Langfuse Platform on K3s configuration
k3s_langfuse_platform_state: present
k3s_langfuse_platform_namespace: langfuse
k3s_langfuse_platform_release_name: langfuse
k3s_langfuse_platform_chart_repo: https://langfuse.github.io/langfuse-k8s
k3s_langfuse_platform_chart_name: langfuse
k3s_langfuse_platform_chart_version: "" # Empty = latest

# Helm installation
k3s_langfuse_platform_install_helm: true
k3s_langfuse_platform_helm_version: "3.16.3"

# When true, run absent tasks before present (clean redeploy).
k3s_langfuse_platform_fresh_install: false

# Langfuse configuration — secrets resolved from vault in tasks/load_vault.yml
k3s_langfuse_platform_hostname: "langfuse.hom.lab"
k3s_langfuse_platform_nextauth_url: "http://langfuse.hom.lab"

# Database configuration (external PostgreSQL via shared fuzlang data-plane contract)
k3s_langfuse_platform_postgres_enabled: false
k3s_langfuse_platform_postgres_deploy: false
k3s_langfuse_platform_postgres_host: "{{ fuzlang_external_postgres_connect_address }}"
k3s_langfuse_platform_postgres_port: "{{ fuzlang_external_postgres_port | default(5432) }}"
k3s_langfuse_platform_postgres_db: "{{ fuzlang_external_postgres_db }}"
k3s_langfuse_platform_postgres_user: "{{ fuzlang_external_postgres_user }}"
k3s_langfuse_platform_postgres_password: "{{ fuzlang_external_postgres_password }}"
k3s_langfuse_platform_postgres_inventory_host: hom-lab-ctl-dkr-01
k3s_langfuse_platform_reset_external_postgres_db_on_fresh_install: true

# ClickHouse configuration
k3s_langfuse_platform_clickhouse_enabled: true
k3s_langfuse_platform_clickhouse_deploy: false
k3s_langfuse_platform_clickhouse_host: "{{ fuzlang_external_clickhouse_connect_address }}"
k3s_langfuse_platform_clickhouse_http_port: "{{ fuzlang_external_clickhouse_http_port }}"
k3s_langfuse_platform_clickhouse_native_port: "{{ fuzlang_external_clickhouse_native_port }}"
k3s_langfuse_platform_clickhouse_database: "{{ fuzlang_external_clickhouse_db }}"
k3s_langfuse_platform_clickhouse_user: "{{ fuzlang_external_clickhouse_user }}"
k3s_langfuse_platform_clickhouse_cluster_enabled: false
k3s_langfuse_platform_clickhouse_cpu_request: "500m"
k3s_langfuse_platform_clickhouse_cpu_limit: "1500m"
k3s_langfuse_platform_clickhouse_memory_request: "1Gi"
k3s_langfuse_platform_clickhouse_memory_limit: "4Gi"

# Redis configuration
k3s_langfuse_platform_redis_enabled: true
k3s_langfuse_platform_redis_deploy: false
k3s_langfuse_platform_redis_host: "{{ fuzlang_external_redis_connect_address }}"
k3s_langfuse_platform_redis_port: "{{ fuzlang_external_redis_port }}"
k3s_langfuse_platform_redis_username: null
k3s_langfuse_platform_redis_auth_enabled: true

# Storage configuration
k3s_langfuse_platform_s3_enabled: true
k3s_langfuse_platform_s3_deploy: false
k3s_langfuse_platform_s3_image_repository: minio/minio
k3s_langfuse_platform_s3_image_tag: RELEASE.2024-01-31T20-20-33Z
# Bitnami chart mounts /bitnami/minio/data — official minio image needs explicit server command.
k3s_langfuse_platform_s3_command:
  - minio
k3s_langfuse_platform_s3_args:
  - server
  - /bitnami/minio/data
  - --console-address
  - :9001
k3s_langfuse_platform_s3_endpoint: "{{ fuzlang_external_s3_endpoint }}"
k3s_langfuse_platform_s3_access_key: ""
k3s_langfuse_platform_s3_secret_key: ""
k3s_langfuse_platform_s3_bucket: "{{ fuzlang_external_s3_bucket }}"
k3s_langfuse_platform_s3_region: "{{ fuzlang_external_s3_region }}"
k3s_langfuse_platform_s3_force_path_style: "{{ fuzlang_external_s3_force_path_style }}"

# Resource limits
k3s_langfuse_platform_web_replicas: 1
k3s_langfuse_platform_worker_replicas: 1
k3s_langfuse_platform_web_cpu_request: "250m"
k3s_langfuse_platform_web_memory_request: "512Mi"
k3s_langfuse_platform_web_cpu_limit: "1000m"
k3s_langfuse_platform_web_memory_limit: "2Gi"
k3s_langfuse_platform_web_readiness_initial_delay_seconds: 60
k3s_langfuse_platform_web_liveness_initial_delay_seconds: 300
k3s_langfuse_platform_worker_cpu_request: "250m"
k3s_langfuse_platform_worker_memory_request: "512Mi"
k3s_langfuse_platform_worker_cpu_limit: "500m"
k3s_langfuse_platform_worker_memory_limit: "1Gi"
k3s_langfuse_platform_worker_liveness_initial_delay_seconds: 60
# A single-node lab cannot always schedule old and new pods concurrently.
k3s_langfuse_platform_deployment_strategy_type: "Recreate"

# Service exposure
k3s_langfuse_platform_service_type: "NodePort"
k3s_langfuse_platform_service_port: 3000
k3s_langfuse_platform_node_port: 30000
