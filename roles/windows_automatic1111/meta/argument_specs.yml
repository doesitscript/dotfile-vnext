---
argument_specs:
  main:
    short_description: AUTOMATIC1111 Stable Diffusion WebUI on Windows GPU hosts
    options:
      windows_automatic1111_state:
        type: str
        default: absent
        choices:
          - present
          - absent
        description: Lifecycle state for Automatic1111.
      windows_automatic1111_port:
        type: int
        default: 7860
        description: API/UI listen port.
      windows_automatic1111_models_root:
        type: str
        required: false
        description: Checkpoint directory on the model share.
      windows_automatic1111_model_hf_repo:
        type: str
        required: false
        description: Hugging Face repo id for the default SD1.5 checkpoint.
      windows_automatic1111_model_hf_file:
        type: str
        required: false
        description: Checkpoint filename inside the Hugging Face repo.
      windows_automatic1111_controlnet_enabled:
        type: bool
        default: true
        description: Install Mikubill ControlNet extension and OpenPose weights.
      windows_automatic1111_default_width:
        type: int
        default: 768
        description: Documented default generation width for operator workflow.
      windows_automatic1111_default_height:
        type: int
        default: 768
        description: Documented default generation height for operator workflow.
      windows_automatic1111_default_steps:
        type: int
        default: 35
        description: Documented default sampling steps.
      windows_automatic1111_default_cfg_scale:
        type: int
        default: 8
        description: Documented default CFG scale for prompt adherence.
      windows_automatic1111_default_denoising_strength:
        type: float
        default: 0.4
        description: >-
          Documented img2img start denoise (identity keep). Raise in the A1111
          UI when changing pose.
