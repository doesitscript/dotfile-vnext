---
# Active milestone-one implementation path.
# This task file manages the Windows backup baseline only: feature install,
# target validation, and repo-managed structure. It intentionally does not yet
# implement the full Windows Server Backup policy/schedule workflow or
# service-specific backup payloads.
- name: Validate Windows backup baseline metadata eligibility
  ansible.builtin.assert:
    that:
      - operation_model | default("") == __windows_server_backup_required_operation_model
      - management_boundary | default("") == __windows_server_backup_required_management_boundary
      - availability_expectation | default("") == __windows_server_backup_required_availability_expectation
    fail_msg: >-
      {{ inventory_hostname }} is not eligible for the managed Windows backup
      baseline. This role is restricted to infrastructure-managed,
      continuously available Windows service nodes derived from host metadata.

- name: Validate Windows backup baseline inputs
  ansible.builtin.assert:
    that:
      - windows_data_root is defined
      - windows_data_root | length > 0
      - windows_server_backup_work_root | length > 0
      - windows_server_backup_target_drive | default("") | length > 0
      - windows_server_backup_automatic_interval_days | int > 0
      - windows_server_backup_automatic_keep_previous_count | int >= 0
    fail_msg: >-
      windows_server_backup requires windows_data_root and an explicit
      windows_server_backup_target_drive for the first milestone.

- name: Resolve Windows backup working drive
  ansible.builtin.set_fact:
    windows_server_backup_work_drive: "{{ windows_server_backup_work_root[0:2] }}"
    windows_server_backup_staging_drive_root: "{{ windows_server_backup_staging_root[0:2] }}"

- name: Discover Windows backup baseline facts before apply
  ansible.builtin.include_tasks: discover.yml

- name: Install Windows Server Backup feature
  ansible.windows.win_feature:
    name: "{{ windows_server_backup_feature_name }}"
    state: present
    include_management_tools: true
  register: windows_server_backup_feature_result
  when: windows_server_backup_manage_feature | bool

- name: Reboot after Windows backup feature installation
  ansible.windows.win_reboot:
    msg: "Ansible reboot after Windows Server Backup feature installation"
    reboot_timeout: 900
  when:
    - windows_server_backup_manage_feature | bool
    - windows_server_backup_feature_result.reboot_required | default(false)

- name: Wait for Windows host to return after backup-feature reboot
  ansible.builtin.wait_for_connection:
    timeout: 900
  when:
    - windows_server_backup_manage_feature | bool
    - windows_server_backup_feature_result.reboot_required | default(false)

- name: Verify backup work drive exists
  ansible.windows.win_stat:
    path: "{{ windows_server_backup_work_drive }}\\"
  register: windows_server_backup_work_drive_stat
  failed_when: not windows_server_backup_work_drive_stat.stat.exists

- name: Verify backup target drive exists
  ansible.windows.win_stat:
    path: "{{ windows_server_backup_target_drive }}:\\"
  register: windows_server_backup_target_drive_stat
  failed_when: not windows_server_backup_target_drive_stat.stat.exists

- name: Verify backup staging drive exists
  ansible.windows.win_stat:
    path: "{{ windows_server_backup_staging_drive_root }}\\"
  register: windows_server_backup_staging_drive_stat
  failed_when: not windows_server_backup_staging_drive_stat.stat.exists

- name: Collect backup target volume details
  ansible.windows.win_shell: |
    $ProgressPreference = 'SilentlyContinue'
    $volume = Get-Volume -DriveLetter '{{ windows_server_backup_target_drive }}' -ErrorAction Stop
    $volume |
      Select-Object DriveLetter, FileSystemLabel, FileSystem, SizeRemaining, Size |
      ConvertTo-Json -Compress
  register: windows_server_backup_target_volume_raw
  changed_when: false

- name: Parse backup target volume details
  ansible.builtin.set_fact:
    windows_server_backup_target_volume: >-
      {{ windows_server_backup_target_volume_raw.stdout | trim | from_json }}

- name: Validate backup target volume label
  ansible.builtin.assert:
    that:
      - windows_server_backup_target_volume["FileSystemLabel"] == windows_server_backup_target_label
    fail_msg: >-
      Backup target drive {{ windows_server_backup_target_drive }}: label is
      "{{ windows_server_backup_target_volume['FileSystemLabel'] }}", expected
      "{{ windows_server_backup_target_label }}".
  when: windows_server_backup_target_label | length > 0

- name: Create Windows backup working directories
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ windows_server_backup_repository_root }}"
    - "{{ windows_server_backup_catalog_root }}"
    - "{{ windows_server_backup_staging_root }}"
    - "{{ windows_server_backup_context_root }}"
    - "{{ windows_server_backup_catalog_context_root }}"
    - "{{ windows_server_backup_work_root }}"
    - "{{ windows_server_backup_scripts_dir }}"
    - "{{ windows_server_backup_data_dir }}"
    - "{{ windows_server_backup_targets_dir }}"
    - "{{ windows_server_backup_logs_dir }}"
    - "{{ windows_server_backup_manifests_dir }}"
    - "{{ windows_server_backup_runs_root }}"
    - "{{ windows_server_backup_manual_runs_dir }}"
    - "{{ windows_server_backup_automatic_runs_dir }}"

- name: Write Windows backup baseline README
  ansible.windows.win_copy:
    content: |
      # Windows Server Backup Baseline

      > Status: active first-milestone baseline. This host is prepared for the
      > repo's Windows backup foundation, but the full backup program is not
      > yet fully implemented here.

      ## Scope

      This host is managed by the repo's first-milestone Windows backup baseline.
      The managed scope is intentionally narrow:

      - install the Windows Server Backup feature
      - validate the intended target drive
      - create the repo-managed backup working structure
      - support named manual native host-recovery backup requests
      - support an automatic native host-recovery backup task with day-based cadence
      - preserve future service-target ideas outside active execution

      ## Baseline Source

      - Live backup baseline host: {{ windows_server_backup_baseline_source_host }}
      - First active target group: network_server

      ## Managed Paths

      - Native host-recovery root: {{ windows_server_backup_native_host_recovery_root }}
      - Backupsets root: {{ windows_server_backup_repository_root }}
      - Backup-catalog root: {{ windows_server_backup_catalog_root }}
      - Staging root: {{ windows_server_backup_staging_root }}
      - Contract context root: {{ windows_server_backup_context_root }}
      - Catalog context root: {{ windows_server_backup_catalog_context_root }}
      - Work root: {{ windows_server_backup_work_root }}
      - Scripts: {{ windows_server_backup_scripts_dir }}
      - Data: {{ windows_server_backup_data_dir }}
      - Future targets: {{ windows_server_backup_targets_dir }}
      - Logs: {{ windows_server_backup_logs_dir }}
      - Manifests: {{ windows_server_backup_manifests_dir }}
      - Run catalog root: {{ windows_server_backup_runs_root }}
      - Manual run manifests: {{ windows_server_backup_manual_runs_dir }}
      - Automatic run manifests: {{ windows_server_backup_automatic_runs_dir }}

      ## Backup Target

      - Target drive: {{ windows_server_backup_target_drive }}:
      - Target label: {{ windows_server_backup_target_volume["FileSystemLabel"] | default("unknown") }}
      - Native host-recovery path: {{ windows_server_backup_target_path | default("not set") }}
      - Automatic interval days: {{ windows_server_backup_automatic_interval_days }}
      - Automatic start time: {{ windows_server_backup_automatic_start_time }}
      - Automatic seed if missing: {{ windows_server_backup_automatic_seed_if_missing }}
      - Automatic retention: keep latest {{ __windows_server_backup_automatic_total_versions_to_keep }} automatic version(s) total

      ## Naming

      Windows Server Backup does not provide a strong native custom label field
      for each backup version, so this role records the human-facing backup name
      and description in the repo-managed run manifests under the catalog zone.

      ## First-Milestone Boundary

      This milestone does not yet manage:

      - service-specific backups for Postgres, ClickHouse, Redis, or MinIO

      Those future service-target ideas are preserved in:
      roles/windows_server_backup/tasks/future_service_targets.yml
    dest: "{{ windows_server_backup_readme_path }}"

- name: Summarize Windows backup baseline
  ansible.builtin.debug:
    msg:
      - "Windows backup feature: {{ windows_server_backup_feature_name }}"
      - "Native host-recovery root: {{ windows_server_backup_native_host_recovery_root }}"
      - "Backupsets root: {{ windows_server_backup_repository_root }}"
      - "Backup-catalog root: {{ windows_server_backup_catalog_root }}"
      - "Staging root: {{ windows_server_backup_staging_root }}"
      - "Backup work root: {{ windows_server_backup_work_root }}"
      - "Backup target: {{ windows_server_backup_target_drive }}:"
      - "Backup target label: {{ windows_server_backup_target_volume['FileSystemLabel'] | default('unknown') }}"
      - "Native host-recovery path: {{ windows_server_backup_target_path | default('not set') }}"
      - "Automatic cadence: every {{ windows_server_backup_automatic_interval_days }} day(s) at {{ windows_server_backup_automatic_start_time }}"
      - "Automatic seed if missing: {{ windows_server_backup_automatic_seed_if_missing }}"
      - "Manual run requested now: {{ __windows_server_backup_effective_manual_run_now }}"

- name: Write automatic Windows backup runner script
  ansible.windows.win_template:
    src: "automatic_native_host_recovery.ps1.j2"
    dest: "{{ windows_server_backup_automatic_runner_path }}"

- name: Configure automatic native host-recovery scheduled task
  community.windows.win_scheduled_task:
    name: "{{ __windows_server_backup_automatic_task_name }}"
    path: "{{ __windows_server_backup_automatic_task_path }}"
    description: "{{ __windows_server_backup_automatic_task_description }}"
    enabled: true
    hidden: false
    allow_demand_start: true
    allow_hard_terminate: true
    multiple_instances: 2
    execution_time_limit: "PT0S"
    run_level: highest
    logon_type: service_account
    username: SYSTEM
    actions:
      - path: "powershell.exe"
        arguments: >-
          -NoProfile -ExecutionPolicy Bypass
          -File "{{ windows_server_backup_automatic_runner_path }}"
    triggers:
      - type: daily
        start_boundary: >-
          {{ __windows_server_backup_automatic_task_anchor_date }}T{{ windows_server_backup_automatic_start_time }}:00
    state: present

- name: Refresh Windows backup discovery after baseline apply
  ansible.builtin.include_tasks: discover.yml

- name: Initialize Windows backup runtime action summary
  ansible.builtin.set_fact:
    windows_server_backup_runtime_automatic_action: >-
      {{
        'deferred-running-job'
        if (windows_server_backup_discovery["current_job_running"] | bool)
        else (
          'not-needed'
          if windows_server_backup_discovery["automatic_state"] == "healthy"
          else (
            'skipped-seed-disabled'
            if not (windows_server_backup_automatic_seed_if_missing | bool)
            else (
              'planned-reconcile'
              if windows_server_backup_discovery["automatic_state"] == "drifted"
              else 'planned-seed'
            )
          )
        )
      }}
    windows_server_backup_runtime_automatic_action_basis_state: "{{ windows_server_backup_discovery['automatic_state'] }}"
    windows_server_backup_runtime_automatic_action_basis_job_state: "{{ windows_server_backup_discovery['current_job_state_label'] }}"
    windows_server_backup_runtime_automatic_action_basis_seed_if_missing: "{{ windows_server_backup_automatic_seed_if_missing | bool }}"
    windows_server_backup_runtime_automatic_action_basis_task_present: "{{ windows_server_backup_discovery['automatic_task'] is not none }}"
    windows_server_backup_runtime_automatic_action_result: >-
      {{
        'existing job deferred'
        if (windows_server_backup_discovery["current_job_running"] | bool)
        else (
          'automatic backup already healthy'
          if windows_server_backup_discovery["automatic_state"] == "healthy"
          else (
            'automatic seeding disabled'
            if not (windows_server_backup_automatic_seed_if_missing | bool)
            else (
              'automatic reconcile will rebuild managed state'
              if windows_server_backup_discovery["automatic_state"] == "drifted"
              else 'automatic seed will create first managed backup'
            )
          )
        )
      }}
    windows_server_backup_runtime_automatic_action_process_id: ""
    windows_server_backup_runtime_manual_action: >-
      {{ 'requested' if (__windows_server_backup_effective_manual_run_now | bool) else 'not-requested' }}
    windows_server_backup_runtime_manual_action_flag: "{{ __windows_server_backup_effective_manual_run_now | bool }}"
    windows_server_backup_runtime_manual_action_result: >-
      {{
        'manual backup requested by command line'
        if (__windows_server_backup_effective_manual_run_now | bool)
        else 'manual backup not requested by command line'
      }}
    windows_server_backup_runtime_manual_action_name: ""

- name: Clear managed automatic backup manifests when automatic state drifted
  ansible.windows.win_file:
    path: "{{ windows_server_backup_automatic_runs_dir }}"
    state: absent
  when:
    - windows_server_backup_discovery["automatic_state"] == "drifted"
    - not (windows_server_backup_discovery["current_job_running"] | bool)

- name: Recreate managed automatic backup manifest directory after drift cleanup
  ansible.windows.win_file:
    path: "{{ windows_server_backup_automatic_runs_dir }}"
    state: directory
  when:
    - windows_server_backup_discovery["automatic_state"] == "drifted"
    - not (windows_server_backup_discovery["current_job_running"] | bool)

- name: Configure automatic backup workflow
  ansible.builtin.include_tasks: configure_automatic.yml

- name: Seed or rebuild managed automatic backup when state is not healthy
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $runnerPath = '{{ windows_server_backup_automatic_runner_path }}'

      $process = Start-Process `
        -FilePath 'powershell.exe' `
        -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $runnerPath) `
        -WindowStyle Hidden `
        -PassThru

      Start-Sleep -Seconds 8

      $job = $null
      try {
        $job = Get-WBJob | Select-Object JobState, StartTime, EndTime, CurrentOperation, PercentComplete, ErrorDescription
      } catch {
        $job = $null
      }

      $started = $false
      if ($job -and (([int]$job.JobState) -ne 0 -or $job.StartTime -or $job.CurrentOperation)) {
        $started = $true
      }

      $Ansible.Result = [pscustomobject]@{
        started = $started
        process_id = $process.Id
        runner_path = $runnerPath
        job = $job
      }
  register: windows_server_backup_automatic_seed_result
  when:
    - windows_server_backup_automatic_seed_if_missing | bool
    - windows_server_backup_discovery["automatic_task"] is not none
    - not (windows_server_backup_discovery["current_job_running"] | bool)
    - windows_server_backup_discovery["automatic_state"] in ["missing", "drifted"]

- name: Assert automatic seed or reconcile start was observed
  ansible.builtin.assert:
    that:
      - windows_server_backup_automatic_seed_result.result["started"] | default(false)
    fail_msg: >-
      Automatic backup reconcile did not report an active Windows backup job
      after launching the managed runner on {{ inventory_hostname }}.
  when:
    - windows_server_backup_automatic_seed_if_missing | bool
    - windows_server_backup_discovery["automatic_task"] is not none
    - not (windows_server_backup_discovery["current_job_running"] | bool)
    - windows_server_backup_discovery["automatic_state"] in ["missing", "drifted"]

- name: Record automatic reconcile action result for this run
  ansible.builtin.set_fact:
    windows_server_backup_runtime_automatic_action: >-
      {{
        'reconcile-started'
        if windows_server_backup_runtime_automatic_action_basis_state == 'drifted'
        else 'seed-started'
      }}
    windows_server_backup_runtime_automatic_action_result: >-
      {{
        (
          'automatic reconcile runner started'
          if windows_server_backup_runtime_automatic_action_basis_state == 'drifted'
          else 'automatic backup seed runner started'
        )
        ~ ' (process id '
        ~ (windows_server_backup_automatic_seed_result.result["process_id"] | string)
        ~ ')'
      }}
    windows_server_backup_runtime_automatic_action_process_id: "{{ windows_server_backup_automatic_seed_result.result['process_id'] | string }}"
  when:
    - windows_server_backup_automatic_seed_result is defined
    - windows_server_backup_automatic_seed_result.result is defined
    - windows_server_backup_automatic_seed_result.result["started"] | default(false)

- name: Refresh Windows backup discovery after automatic reconcile run
  ansible.builtin.include_tasks: discover.yml
  when:
    - windows_server_backup_automatic_seed_if_missing | bool
    - windows_server_backup_discovery["automatic_task"] is not none
    - not (windows_server_backup_discovery["current_job_running"] | bool)
    - windows_server_backup_discovery["automatic_state"] in ["missing", "drifted"]

- name: Run manual backup workflow when requested
  ansible.builtin.include_tasks: manual_run.yml
  when: __windows_server_backup_effective_manual_run_now | bool

- name: Refresh Windows backup discovery after manual trigger
  ansible.builtin.include_tasks: discover.yml
  when: __windows_server_backup_effective_manual_run_now | bool

- name: Validate Windows backup runtime state after apply
  ansible.builtin.include_tasks: validate_runtime.yml
