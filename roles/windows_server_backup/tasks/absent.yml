---
# Provisional lifecycle cleanup path for the first-milestone baseline.
# This path removes the baseline work owned by this capability:
# - native host-recovery payload path
# - repo-managed backup context and manifests
# - Windows backup feature (by default)
# Shared top-level zone roots remain in place so future backup capabilities do
# not depend on recreating the entire zone tree.
- name: Validate Windows backup baseline metadata eligibility for removal
  ansible.builtin.assert:
    that:
      - operation_model | default("") == __windows_server_backup_required_operation_model
      - management_boundary | default("") == __windows_server_backup_required_management_boundary
      - availability_expectation | default("") == __windows_server_backup_required_availability_expectation
    fail_msg: >-
      {{ inventory_hostname }} is not eligible for the managed Windows backup
      baseline removal path.

- name: Discover Windows backup baseline facts before removal
  ansible.builtin.include_tasks: discover.yml

- name: Assert no Windows backup job is running before removal
  ansible.builtin.assert:
    that:
      - not (windows_server_backup_discovery["current_job_running"] | bool)
    fail_msg: >-
      A Windows backup job is currently running on {{ inventory_hostname }}.
      Wait for that job to finish before running the absent path.

- name: Remove automatic native host-recovery scheduled task
  community.windows.win_scheduled_task:
    name: "{{ __windows_server_backup_automatic_task_name }}"
    path: "{{ __windows_server_backup_automatic_task_path }}"
    state: absent

- name: Remove Windows backup run manifest
  ansible.windows.win_file:
    path: "{{ __windows_server_backup_run_manifest_path }}"
    state: absent

- name: Remove latest automatic Windows backup manifest
  ansible.windows.win_file:
    path: "{{ __windows_server_backup_latest_automatic_manifest_path }}"
    state: absent

- name: Remove automatic runner script
  ansible.windows.win_file:
    path: "{{ windows_server_backup_automatic_runner_path }}"
    state: absent

- name: Remove Windows backup catalog README
  ansible.windows.win_file:
    path: "{{ windows_server_backup_readme_path }}"
    state: absent

- name: Remove Windows native host-recovery root
  ansible.windows.win_file:
    path: "{{ windows_server_backup_native_host_recovery_root }}"
    state: absent

- name: Remove Windows backup catalog context root
  ansible.windows.win_file:
    path: "{{ windows_server_backup_catalog_context_root }}"
    state: absent

- name: Remove Windows backup working context root
  ansible.windows.win_file:
    path: "{{ windows_server_backup_context_root }}"
    state: absent

- name: Remove Windows Server Backup feature
  ansible.windows.win_feature:
    name: "{{ windows_server_backup_feature_name }}"
    state: absent
  register: windows_server_backup_feature_remove_result
  when:
    - windows_server_backup_manage_feature | bool
    - windows_server_backup_remove_feature_on_absent | bool

- name: Reboot after Windows backup feature removal
  ansible.windows.win_reboot:
    msg: "Ansible reboot after Windows Server Backup feature removal"
    reboot_timeout: 900
  when:
    - windows_server_backup_manage_feature | bool
    - windows_server_backup_remove_feature_on_absent | bool
    - windows_server_backup_feature_remove_result.reboot_required | default(false)

- name: Wait for Windows host to return after backup-feature removal reboot
  ansible.builtin.wait_for_connection:
    timeout: 900
  when:
    - windows_server_backup_manage_feature | bool
    - windows_server_backup_remove_feature_on_absent | bool
    - windows_server_backup_feature_remove_result.reboot_required | default(false)
