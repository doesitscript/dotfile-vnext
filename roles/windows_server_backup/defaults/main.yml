---
# windows_server_backup — first-milestone API contract.
#
# Scope for the first milestone:
# - install the Windows Server Backup feature
# - validate the intended backup target drive
# - create the repo-managed backup working structure
# - record the baseline as a host-local README
#
# Later service-specific payload backups stay cordoned off in
# tasks/future_service_targets.yml until they are refined.
windows_server_backup_feature_name: "Windows-Server-Backup"
windows_server_backup_manage_feature: true
windows_server_backup_remove_feature_on_absent: false

windows_server_backup_work_root: "{{ windows_data_root }}\\backups"
windows_server_backup_scripts_dir: "{{ windows_server_backup_work_root }}\\scripts"
windows_server_backup_data_dir: "{{ windows_server_backup_work_root }}\\data"
windows_server_backup_targets_dir: "{{ windows_server_backup_work_root }}\\targets"
windows_server_backup_logs_dir: "{{ windows_server_backup_work_root }}\\logs"
windows_server_backup_readme_path: "{{ windows_server_backup_work_root }}\\README.md"

windows_server_backup_target_drive: ""
windows_server_backup_target_label: ""
windows_server_backup_target_path: >-
  {{
    (windows_server_backup_target_drive ~ ':\\WindowsImageBackup')
    if (windows_server_backup_target_drive | default('') | length > 0)
    else ''
  }}

windows_server_backup_baseline_source_host: "server-225-win"
