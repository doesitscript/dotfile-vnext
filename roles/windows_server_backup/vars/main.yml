---
# Internal constants for the active first-milestone Windows backup baseline.
# Keep these opinionated and narrow so the public role API stays small.
__windows_server_backup_required_operation_model: "service"
__windows_server_backup_required_management_boundary: "infra_managed"
__windows_server_backup_required_availability_expectation: "expected_continuous"

# The active backup flow uses native host recovery for both manual one-time
# runs and the repo-managed automatic cadence wrapper.
__windows_server_backup_runtime_mode: "native-host-recovery"
__windows_server_backup_vss_mode: "copy"
__windows_server_backup_automatic_task_anchor_date: "2000-01-01"
__windows_server_backup_automatic_task_name: "WindowsServerBackupNativeHostRecoveryAutomatic"
__windows_server_backup_automatic_task_path: "\\castle\\backup\\"
__windows_server_backup_automatic_task_description: >-
  Automatic native host-recovery backup for {{ windows_server_backup_node_name }}
  using a {{ windows_server_backup_automatic_interval_days }}-day cadence.
__windows_server_backup_latest_manual_manifest_path: "{{ windows_server_backup_manual_runs_dir }}\\latest.json"
__windows_server_backup_latest_automatic_manifest_path: "{{ windows_server_backup_automatic_runs_dir }}\\latest.json"
__windows_server_backup_run_manifest_path: "{{ __windows_server_backup_latest_manual_manifest_path }}"
__windows_server_backup_effective_manual_run_now: >-
  {{
    (windows_server_backup_manual_run_now | default(false) | bool)
    or (windows_server_backup_run_now | default(false) | bool)
  }}
__windows_server_backup_automatic_total_versions_to_keep: >-
  {{ (windows_server_backup_automatic_keep_previous_count | int) + 1 }}
