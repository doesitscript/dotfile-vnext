---
# Active first-milestone argument contract for the Windows backup baseline.
# This role surface is intentionally narrower than the eventual backup program;
# many later backup payloads remain outside the active validated scope.
argument_specs:
  main:
    short_description: Windows Server Backup baseline
    description: >-
      Installs the Windows Server Backup feature, validates the intended backup
      target, and creates the repo-managed backup working structure for a
      Windows host.
    options:
      windows_server_backup_state:
        type: str
        required: false
        description: Lifecycle control point for the backup baseline role.
      windows_server_backup_feature_name:
        type: str
        required: false
        description: Windows feature name used for Windows Server Backup.
      windows_server_backup_manage_feature:
        type: bool
        required: false
        description: Install or remove the Windows backup feature when true.
      windows_server_backup_remove_feature_on_absent:
        type: bool
        required: false
        description: Remove the Windows backup feature when state=absent.
      windows_server_backup_run_now:
        type: bool
        required: false
        description: >-
          Legacy transient flag to trigger a one-time async native
          host-recovery backup run. Keep false in steady-state inventory.
      windows_server_backup_manual_run_now:
        type: bool
        required: false
        description: >-
          Transient flag to trigger a one-time async manual native
          host-recovery backup run. Keep false in steady-state inventory.
      windows_server_backup_manual_name:
        type: str
        required: false
        description: Optional human-friendly name for the next manual backup run.
      windows_server_backup_manual_description:
        type: str
        required: false
        description: Optional description for the next manual backup run.
      windows_server_backup_work_root:
        type: str
        required: false
        description: Repo-managed working root for backup metadata and helpers.
      windows_server_backup_scripts_dir:
        type: str
        required: false
        description: Directory for future helper scripts or wrappers.
      windows_server_backup_data_dir:
        type: str
        required: false
        description: Directory for temporary backup working data.
      windows_server_backup_targets_dir:
        type: str
        required: false
        description: Directory reserved for future service-target metadata.
      windows_server_backup_logs_dir:
        type: str
        required: false
        description: Directory for backup-related logs collected by this repo.
      windows_server_backup_runs_root:
        type: str
        required: false
        description: Catalog root for per-run backup manifests.
      windows_server_backup_manual_runs_dir:
        type: str
        required: false
        description: Catalog directory for manual backup run manifests.
      windows_server_backup_automatic_runs_dir:
        type: str
        required: false
        description: Catalog directory for automatic backup run manifests.
      windows_server_backup_readme_path:
        type: str
        required: false
        description: Host-local README path describing the managed baseline.
      windows_server_backup_automatic_runner_path:
        type: str
        required: false
        description: Host-local PowerShell runner used by the automatic backup task.
      windows_server_backup_target_drive:
        type: str
        required: false
        description: Intended Windows backup target drive letter, without colon.
      windows_server_backup_staging_drive:
        type: str
        required: false
        description: Intended Windows staging drive letter, without colon.
      windows_server_backup_target_label:
        type: str
        required: false
        description: Expected filesystem label for the backup target drive.
      windows_server_backup_automatic_interval_days:
        type: int
        required: false
        description: >-
          Number of days between automatic backups. Manual backups do not count
          toward this interval gate.
      windows_server_backup_automatic_start_time:
        type: str
        required: false
        description: Local wall-clock start time for the automatic backup task.
      windows_server_backup_automatic_keep_previous_count:
        type: int
        required: false
        description: >-
          Number of previous automatic backups to retain in addition to the
          latest automatic backup.
      windows_server_backup_automatic_seed_if_missing:
        type: bool
        required: false
        description: >-
          When true, seed the first automatic backup during apply if the
          managed automatic task exists but no automatic backup manifest has
          been created yet.
      windows_server_backup_namespace:
        type: str
        required: false
        description: Accepted backup naming contract namespace.
      windows_server_backup_site:
        type: str
        required: false
        description: Accepted backup naming contract site.
      windows_server_backup_environment:
        type: str
        required: false
        description: Accepted backup naming contract environment.
      windows_server_backup_stage:
        type: str
        required: false
        description: Accepted backup naming contract stage.
      windows_server_backup_node_name:
        type: str
        required: false
        description: Accepted backup naming contract node identifier.
      windows_server_backup_native_host_recovery_root:
        type: str
        required: false
        description: Physical root for the native-host-recovery zone.
      windows_server_backup_repository_root:
        type: str
        required: false
        description: Physical root for the backupsets zone.
      windows_server_backup_catalog_root:
        type: str
        required: false
        description: Physical root for the backup-catalog zone.
      windows_server_backup_staging_root:
        type: str
        required: false
        description: Physical root for the staging zone.
      windows_server_backup_context_root:
        type: str
        required: false
        description: Contract-aligned host context root beneath backupsets.
      windows_server_backup_catalog_context_root:
        type: str
        required: false
        description: Contract-aligned host context root beneath backup-catalog.
      windows_server_backup_target_path:
        type: str
        required: false
        description: Expected Windows-native host-recovery artifact path.
      windows_server_backup_baseline_source_host:
        type: str
        required: false
        description: Host whose live backup setup informed this baseline.
