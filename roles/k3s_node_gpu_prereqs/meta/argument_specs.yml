---
argument_specs:
  main:
    short_description: Validate K3s NVIDIA GPU prerequisites for AI runtimes
    options:
      k3s_node_gpu_prereqs_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the prerequisite validation role.
      k3s_node_gpu_prereqs_expected_resource:
        type: str
        default: nvidia.com/gpu
        description: Kubernetes extended resource name expected on the node.
      k3s_node_gpu_prereqs_expected_count:
        type: int
        default: 1
        description: Minimum GPU resource count required before runtime deployment.
