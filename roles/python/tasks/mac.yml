---
# PACKET_PYTHON_MAC_REVISION=openssl-skip-v2
# Detect presence via Homebrew opt prefixes (filesystem), not `brew list`.
# Installing ca-certificates/openssl via brew can re-fetch openssl@3 bottles and
# fail mid-download even when /opt/homebrew/opt/openssl@3 already exists.
- name: Resolve Homebrew prefix for Python tooling paths
  ansible.builtin.command:
    argv: [brew, --prefix]
  register: python_homebrew_prefix
  changed_when: false
  tags: [python, brew]

- name: Probe required Python tooling formula opt prefixes
  ansible.builtin.stat:
    path: "{{ python_homebrew_prefix.stdout | trim }}/opt/{{ item }}"
  loop: "{{ python_macos_brew_packages }}"
  register: python_brew_prefix_stats
  tags: [python, brew]

- name: Install missing required Python tooling Homebrew formulae
  ansible.builtin.command:
    argv: [brew, install, "{{ item.item }}"]
  loop: "{{ python_brew_prefix_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.exists | default(false))
  register: python_brew_installs
  changed_when:
    - python_brew_installs.rc is defined
    - python_brew_installs.rc == 0
  failed_when: false
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "{{ lookup('env', 'HOMEBREW_NO_REQUIRE_TAP_TRUST') | default('1', true) }}"
  tags: [python, brew]

- name: Re-probe required formula opt prefixes after install attempts
  ansible.builtin.stat:
    path: "{{ python_homebrew_prefix.stdout | trim }}/opt/{{ item }}"
  loop: "{{ python_macos_brew_packages }}"
  register: python_brew_prefix_stats_after
  tags: [python, brew]

- name: Require required Python tooling formulae to be present
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      Homebrew formula {{ item.item }} is still missing under
      {{ python_homebrew_prefix.stdout | trim }}/opt/{{ item.item }} after
      brew install. Inspect brew doctor output on this Mac.
  loop: "{{ python_brew_prefix_stats_after.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [python, brew]

- name: Probe soft OpenSSL opt prefix
  ansible.builtin.stat:
    path: "{{ python_homebrew_prefix.stdout | trim }}/opt/openssl@3"
  register: python_openssl_opt_stat
  tags: [python, brew]

- name: Probe Homebrew CA certificate bundle
  ansible.builtin.stat:
    path: "{{ python_homebrew_prefix.stdout | trim }}/share/ca-certificates/cacert.pem"
  register: python_cacert_stat
  tags: [python, brew]

- name: Report existing OpenSSL instead of reinstalling
  ansible.builtin.debug:
    msg: >-
      Using existing Homebrew openssl@3 at
      {{ python_homebrew_prefix.stdout | trim }}/opt/openssl@3
      (install/upgrade of openssl@3 and ca-certificates is intentionally skipped
      to avoid mid-bottle brew failures on work laptops that already have OpenSSL).
  when: python_openssl_opt_stat.stat.exists | default(false)
  tags: [python, brew]

- name: Warn when openssl@3 opt prefix is missing
  ansible.builtin.debug:
    msg: >-
      openssl@3 is not present under
      {{ python_homebrew_prefix.stdout | trim }}/opt/openssl@3.
      Install manually with: brew install openssl@3
      Continuing; pyenv builds may fail later without it.
  when: not (python_openssl_opt_stat.stat.exists | default(false))
  tags: [python, brew]

- name: Ensure Homebrew CA certs are linked into OpenSSL directory
  ansible.builtin.file:
    src: "{{ python_homebrew_prefix.stdout | trim }}/share/ca-certificates/cacert.pem"
    dest: "{{ python_homebrew_prefix.stdout | trim }}/etc/openssl@3/cert.pem"
    state: link
    force: true
  when:
    - python_openssl_opt_stat.stat.exists | default(false)
    - python_cacert_stat.stat.exists | default(false)
  tags: [python, brew]

- name: Check whether pytest.ini already exists
  ansible.builtin.stat:
    path: "{{ dotfiles_user_home }}/pytest.ini"
  register: pytest_stat

- name: Back up existing pytest.ini once
  ansible.builtin.copy:
    src: "{{ dotfiles_user_home }}/pytest.ini"
    dest: "{{ dotfiles_user_home }}/pytest.ini.bak"
    remote_src: true
    force: false
    mode: "0644"
  when: pytest_stat.stat.exists

- name: Ensure pipx path is initialized on macOS
  ansible.builtin.command: pipx ensurepath
  changed_when: false
  failed_when: false
  tags: pipx

- name: Ensure pytest.ini symlink exists on macOS
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/roles/python/files/pytest.ini"
    dest: "{{ dotfiles_user_home }}/pytest.ini"
    state: link
  tags: [python]

- name: Ensure pyenv-virtualenv plugin is installed for pyenv
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv-virtualenv.git
    dest: "{{ ansible_env.HOME }}/.pyenv/plugins/pyenv-virtualenv"
    version: "{{ pyenv_virtualenv_git_version }}"
    update: true
    force: true
  tags: [python, pyenv]

- name: Ensure requested pyenv versions are installed on macOS
  ansible.builtin.command:
    argv:
      - pyenv
      - install
      - "{{ item }}"
      - --skip-existing
    creates: "{{ ansible_env.HOME }}/.pyenv/versions/{{ item | string }}"
  loop: "{{ pyenv_global_versions | default([]) }}"
  tags: [python, pyenv]

- name: Check current pyenv global version file
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.pyenv/version"
  register: pyenv_global_version_stat
  when: (pyenv_global_versions | default([]) | length) > 0
  tags: [python, pyenv]

- name: Read current pyenv global version file
  ansible.builtin.slurp:
    path: "{{ ansible_env.HOME }}/.pyenv/version"
  register: pyenv_global_version_file
  when:
    - (pyenv_global_versions | default([]) | length) > 0
    - pyenv_global_version_stat.stat.exists
  tags: [python, pyenv]

- name: Set pyenv global versions on macOS
  ansible.builtin.command:
    cmd: "pyenv global {{ pyenv_global_versions | map('string') | join(' ') }}"
  when:
    - (pyenv_global_versions | default([]) | length) > 0
    - >
      not pyenv_global_version_stat.stat.exists
      or (pyenv_global_version_file.content | b64decode | trim)
         != (pyenv_global_versions | map('string') | join(' '))
  changed_when: true
  tags: [python, pyenv]

- name: Install Python CLI tools via pipx on macOS
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ pipx_packages }}"
  register: _pipx_result
  changed_when: "'installed package' in _pipx_result.stdout"
  failed_when:
    - _pipx_result.rc != 0
    - "'already seems to be installed' not in _pipx_result.stderr"
  tags: [python, pipx]
