- name: Ensure pyenv dependencies are installed on macOS
  community.general.homebrew:
    name:
      - openssl
      - readline
      - sqlite3
      - xz
      - zlib
    state: present

- name: Install Python versions with pyenv on macOS
  ansible.builtin.shell: "pyenv install {{ item }} --skip-existing"
  loop: "{{ pyenv_global_versions }}"
  args:
    executable: /bin/bash
  changed_when: false
  tags: pyenv

- name: Set global Python versions with pyenv on macOS
  ansible.builtin.copy:
    content: "system\n{% for version in pyenv_global_versions %}{{ version }}\n{% endfor %}"
    dest: "{{ dotfiles_user_home }}/.pyenv/version"
  tags: pyenv

- name: Check whether pytest.ini already exists
  ansible.builtin.stat:
    path: "{{ dotfiles_user_home }}/pytest.ini"
  register: pytest_stat

- name: Back up existing pytest.ini once
  ansible.builtin.copy:
    src: "{{ dotfiles_user_home }}/pytest.ini"
    dest: "{{ dotfiles_user_home }}/pytest.ini.bak"
    remote_src: true
    force: false
  when: pytest_stat.stat.exists

- name: Ensure pytest.ini symlink exists on macOS
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/roles/python/files/pytest.ini"
    dest: "{{ dotfiles_user_home }}/pytest.ini"
    state: link

- name: Ensure pipx is installed on macOS
  ansible.builtin.command: python3 -m pip install --user pipx
  changed_when: false
  tags: pipx

- name: Ensure poetry is installed via pipx on macOS
  ansible.builtin.command: "{{ dotfiles_user_home }}/.local/bin/pipx install poetry"
  changed_when: false
  tags: poetry

- name: Ensure virtualenv is installed on macOS
  ansible.builtin.command: python3 -m pip install --user virtualenv
  changed_when: false
