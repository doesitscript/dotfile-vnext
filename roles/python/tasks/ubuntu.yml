---
- name: Ensure Python tooling packages are installed on Ubuntu
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - pipx
    state: present
    update_cache: true
  become: true

- name: Ensure pipx binary path is initialized on Ubuntu
  ansible.builtin.command: pipx ensurepath
  changed_when: false
  failed_when: false
  tags: pipx

- name: Install Python CLI tools via pipx on Ubuntu
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ pipx_packages }}"
  register: _pipx_result
  changed_when: "'installed package' in _pipx_result.stdout"
  failed_when:
    - _pipx_result.rc != 0
    - "'already seems to be installed' not in _pipx_result.stderr"
  tags: pipx

- name: Ensure pytest.ini symlink exists on Ubuntu
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/roles/python/files/pytest.ini"
    dest: "{{ dotfiles_user_home }}/pytest.ini"
    state: link
