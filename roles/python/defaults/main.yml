---
# Docker-based pyenv configuration
pyenv_docker_image: "pyenv-env:latest"
pyenv_docker_build_dir: "/tmp/pyenv-docker-build"

# pyenv: Python versions to install inside the container (most recent first).
pyenv_global_versions:
  - "3.14.3"
  - "3.13.12"
  - "3.12.9"

# Python CLI tools installed via pipx (isolated venvs, globally available).
pipx_packages:
  - poetry
  - virtualenv

# VS Code / Cursor extensions installed via CLI (bypasses marketplace GUI issues).
python_vscode_extensions:
  - ms-python.python
  - ms-python.debugpy

# Editor CLI binary name — "cursor" for Cursor IDE, "code" for VS Code.
vscode_cli_binary: cursor
