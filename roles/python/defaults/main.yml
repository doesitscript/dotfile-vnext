---
# Python CLI tools installed via pipx (isolated venvs, globally available).
# This is the authoritative list for global Python tools.
# For pattern guidance and decision framework, see:
# - roles/python/README.md (summary)
# - docs/python-dependency-patterns.md (comprehensive)
pipx_packages:
  - poetry
  - virtualenv

# VS Code / Cursor extensions installed via CLI (bypasses marketplace GUI issues).
python_vscode_extensions:
  - ms-python.python
  - ms-python.debugpy

# Editor CLI binary name — "cursor" for Cursor IDE, "code" for VS Code.
vscode_cli_binary: cursor
