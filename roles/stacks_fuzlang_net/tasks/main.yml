---
# Fuzlang network stack — postgres, redis, minio, and related compose services.
# Runs Docker Compose on hom-lab-ctl-dkr-02 (Hyper-V Ubuntu Docker engine on hvh-02).

- name: Load shared vault for network stack
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vault/shared.vault.yml"

- name: Load network vault for network stack
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vault/network.vault.yml"

- name: Build network stack data directory list
  ansible.builtin.set_fact:
    stacks_network_data_dirs: >-
      {{
        [
          'postgres',
          'redis',
          'clickhouse',
          'minio'
        ]
        + (['langfuse'] if stacks_network_langfuse_compose_enabled | bool else [])
      }}

- name: Ensure network stack data directories on Docker engine host
  ansible.builtin.file:
    path: "{{ linux_data_root }}/{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  loop: "{{ stacks_network_data_dirs }}"

- name: Create network stack directory on Docker engine host
  ansible.builtin.file:
    path: "{{ linux_stacks_root }}/network"
    state: directory
    mode: "0755"
  delegate_to: "{{ docker_engine_host }}"
  become: true

- name: Render docker-compose.yml on Docker engine host
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ linux_stacks_root }}/network/docker-compose.yml"
    mode: "0644"
  delegate_to: "{{ docker_engine_host }}"
  become: true

- name: Render .env file on Docker engine host
  ansible.builtin.template:
    src: env.j2
    dest: "{{ linux_stacks_root }}/network/.env"
    mode: "0640"
    owner: root
    group: docker
  delegate_to: "{{ docker_engine_host }}"
  become: true
  no_log: true

- name: Ensure Docker engine admin user is in docker group
  ansible.builtin.user:
    name: "{{ hostvars[docker_engine_host].ansible_user }}"
    groups: docker
    append: true
  delegate_to: "{{ docker_engine_host }}"
  become: true

- name: Verify rendered network stack .env exists and is readable
  ansible.builtin.stat:
    path: "{{ linux_stacks_root }}/network/.env"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  register: stacks_network_env_stat

- name: Assert network stack .env is present with expected permissions
  ansible.builtin.assert:
    that:
      - stacks_network_env_stat.stat.exists
      - stacks_network_env_stat.stat.mode is match('0640')
    fail_msg: "Network stack .env missing or has unexpected permissions at {{ linux_stacks_root }}/network/.env"

- name: Validate docker compose configuration renders with secrets
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  changed_when: false

- name: Pull Docker images on Docker engine host
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  register: docker_pull_result
  changed_when: "'Pull complete' in docker_pull_result.stdout or 'Downloaded' in docker_pull_result.stdout"

- name: Start network stack services on Docker engine host
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  register: docker_up_result
  changed_when: "'Started' in docker_up_result.stdout or 'Created' in docker_up_result.stdout or 'Recreated' in docker_up_result.stdout"

- name: Sync PostgreSQL user password to vault contract on existing volume
  ansible.builtin.shell: |
    set -euo pipefail
    cid="$(docker ps -q \
      --filter 'label=com.docker.compose.service=postgres' \
      --filter 'label=com.docker.compose.project=fuzlang-net' | head -n1)"
    if [ -z "$cid" ]; then
      echo "fuzlang-net postgres container not found" >&2
      exit 1
    fi
    docker exec "$cid" psql -U "$POSTGRES_USER" -d postgres -c \
      "ALTER USER \"$POSTGRES_USER\" WITH PASSWORD '$POSTGRES_PASSWORD';"
  args:
    executable: /bin/bash
  environment:
    POSTGRES_USER: "{{ vault_network_postgres_user | default('langfuse') }}"
    POSTGRES_PASSWORD: "{{ vault_network_postgres_password | default('Pass@w0rd1') }}"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  no_log: true
  register: stacks_network_postgres_password_sync
  changed_when: "'ALTER ROLE' in stacks_network_postgres_password_sync.stdout or 'ALTER USER' in stacks_network_postgres_password_sync.stdout"

- name: Stop MinIO before incompatible data reset
  ansible.builtin.command:
    cmd: docker compose stop minio
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  when: stacks_network_minio_reset_data | bool
  changed_when: false

- name: Remove incompatible MinIO data directory contents
  ansible.builtin.file:
    path: "{{ linux_data_root }}/minio"
    state: absent
  delegate_to: "{{ docker_engine_host }}"
  become: true
  when: stacks_network_minio_reset_data | bool

- name: Recreate MinIO data directory after reset
  ansible.builtin.file:
    path: "{{ linux_data_root }}/minio"
    state: directory
    mode: "0755"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  when: stacks_network_minio_reset_data | bool

- name: Start MinIO after data reset
  ansible.builtin.command:
    cmd: docker compose up -d minio
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  when: stacks_network_minio_reset_data | bool
  register: stacks_network_minio_reset_up
  changed_when: "'Started' in stacks_network_minio_reset_up.stdout or 'Created' in stacks_network_minio_reset_up.stdout"

- name: Wait for services to be healthy
  ansible.builtin.pause:
    seconds: 30

- name: Verify services are running on Docker engine host
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ linux_stacks_root }}/network"
  delegate_to: "{{ docker_engine_host }}"
  become: true
  register: docker_ps_result
  changed_when: false

- name: Display network stack deployment summary
  ansible.builtin.debug:
    msg:
      - "=== Network Stack Deployment ==="
      - "Docker engine: {{ docker_engine_host }}"
      - >-
        Services deployed: postgres, redis, clickhouse, minio{{
        ', langfuse' if stacks_network_langfuse_compose_enabled | bool
        else ' (langfuse compose disabled)' }}
      - "PostgreSQL endpoint: {{ fuzlang_external_postgres_host | default(hostvars[docker_engine_host].host_ip) }}:5432"
      - "Langfuse endpoint: http://{{ lan_ip | default(inventory_hostname) }}:3000"
      - "MinIO API: http://{{ lan_ip | default(inventory_hostname) }}:9000"
      - "MinIO Console: http://{{ lan_ip | default(inventory_hostname) }}:9001"
      - "Service status:"
      - "{{ docker_ps_result.stdout }}"
