---
argument_specs:
  main:
    short_description: "Manage TFLint CLI via Homebrew on macOS"
    options:
      tflint_cli_state:
        type: str
        default: present
        choices: [present, absent]
        description: ["Whether tflint_cli should be installed or removed."]
      tflint_cli_homebrew_tap:
        type: str
        default: terraform-linters/tflint
        description: ["Homebrew tap for this formula."]
      tflint_cli_homebrew_formula:
        type: str
        default: terraform-linters/tflint/tflint
        description: ["Homebrew formula used to manage this CLI."]
      tflint_cli_verify:
        type: bool
        default: true
        description: ["Verify requested state after convergence."]
