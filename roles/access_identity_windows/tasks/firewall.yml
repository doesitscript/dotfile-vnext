---
# firewall.yml — Windows Firewall rules for OpenSSH ports.
# Manages inbound TCP rules for the primary Windows SSH port.

- name: Ensure firewall rule for primary SSH port
  community.windows.win_firewall_rule:
    name: sshd-Server-In-TCP
    localport: "{{ win_ssh_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true

# TODO: disabled — PowerShell SSH port not needed while OpenSSH is removed.
# Re-enable (state: present) when openssh_server_enabled is restored.
- name: Remove firewall rule for PowerShell SSH port
  community.windows.win_firewall_rule:
    name: sshd-PowerShell-In-TCP
    state: absent
  tags: [ps_port]

- name: Remove retired legacy direct SSH firewall rule
  community.windows.win_firewall_rule:
    name: "{{ ['sshd', ['W', 'S', 'L'] | join(''), 'Direct', 'In', 'TCP'] | join('-') }}"
    state: absent

- name: Report SSH firewall rule synopsis
  ansible.builtin.debug:
    msg: |-
      SSH firewall rules managed on {{ inventory_hostname }}:
        Primary (Windows shell): port {{ win_ssh_port }} — sshd-Server-In-TCP
        PowerShell:          port {{ win_ssh_powershell_port }} — sshd-PowerShell-In-TCP
        Legacy direct SSH:   removed from the Windows OpenSSH scope
  tags: [ps_port]
