---
# firewall.yml — Windows Firewall rules for OpenSSH ports.
# Manages inbound TCP rules for the primary Windows SSH port and, only when WSL
# provisioning is explicitly enabled, the separate WSL direct SSH port.

- name: Ensure firewall rule for primary SSH port
  community.windows.win_firewall_rule:
    name: sshd-Server-In-TCP
    localport: "{{ win_ssh_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true

# TODO: disabled — PowerShell SSH port not needed while OpenSSH is removed.
# Re-enable (state: present) when openssh_server_enabled is restored.
- name: Remove firewall rule for PowerShell SSH port
  community.windows.win_firewall_rule:
    name: sshd-PowerShell-In-TCP
    state: absent
  tags: [ps_port]

- name: Ensure firewall rule for WSL direct SSH port
  community.windows.win_firewall_rule:
    name: sshd-WSL-Direct-In-TCP
    localport: "{{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true
    description: "WSL direct SSH (port {{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }})"
  when:
    - wsl_enabled | default(false) | bool
    - wsl_companion is defined

- name: Remove firewall rule for WSL direct SSH port when WSL is out of scope
  community.windows.win_firewall_rule:
    name: sshd-WSL-Direct-In-TCP
    state: absent
  when: not (wsl_enabled | default(false) | bool)

- name: Report SSH firewall rule synopsis
  ansible.builtin.debug:
    msg: |-
      SSH firewall rules managed on {{ inventory_hostname }}:
        Primary (Windows shell): port {{ win_ssh_port }} — sshd-Server-In-TCP
        PowerShell:          port {{ win_ssh_powershell_port }} — sshd-PowerShell-In-TCP
      {% if (wsl_enabled | default(false) | bool) and (wsl_companion is defined) %}
        WSL direct SSH:      port {{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }} — sshd-WSL-Direct-In-TCP
      {% else %}
        WSL direct SSH:      skipped (Windows-only OpenSSH scope)
      {% endif %}
  tags: [ps_port]
