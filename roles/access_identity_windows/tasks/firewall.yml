---
# firewall.yml — Windows Firewall rules for OpenSSH ports.
# Manages inbound TCP rules for the primary SSH port (WSL/bash),
# the secondary PowerShell SSH port, and the WSL direct SSH port.

- name: Ensure firewall rule for primary SSH port
  community.windows.win_firewall_rule:
    name: sshd-Server-In-TCP
    localport: "{{ win_ssh_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true

- name: Ensure firewall rule for PowerShell SSH port
  community.windows.win_firewall_rule:
    name: sshd-PowerShell-In-TCP
    localport: "{{ win_ssh_powershell_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true
    description: "OpenSSH PowerShell session (port {{ win_ssh_powershell_port }})"

- name: Ensure firewall rule for WSL direct SSH port
  community.windows.win_firewall_rule:
    name: sshd-WSL-Direct-In-TCP
    localport: "{{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true
    description: "WSL direct SSH (port {{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }})"
  when: wsl_companion is defined

- name: Report SSH firewall rule synopsis
  ansible.builtin.debug:
    msg: |-
      SSH firewall rules managed on {{ inventory_hostname }}:
        Primary (WSL/bash):  port {{ win_ssh_port }} — sshd-Server-In-TCP
        PowerShell:          port {{ win_ssh_powershell_port }} — sshd-PowerShell-In-TCP
      {% if wsl_companion is defined %}
        WSL direct SSH:      port {{ hostvars[wsl_companion]['wsl_ssh_port'] | default(22) }} — sshd-WSL-Direct-In-TCP
      {% else %}
        WSL direct SSH:      skipped (no wsl_companion defined)
      {% endif %}
