---
# access_identity_windows tasks (admin): OpenSSH install, sshd, firewall, shell, administrators_authorized_keys.
# Run only these tasks: add --tags admin to the playbook command.
#   ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags admin
# Full run (no tags) runs this file then user.yml.

# --- Fetch controller public key (works standalone or combined via access.yaml) ---
- name: Read controller public key from execution node
  ansible.builtin.slurp:
    src: "{{ controller_ssh_public_key_path }}"
  register: _controller_pubkey_slurp
  delegate_to: "{{ groups['execution_nodes'][0] }}"
  tags: [admin, user, wsl, standalone]

- name: Set controller public key content fact
  ansible.builtin.set_fact:
    controller_pub_key_content: "{{ _controller_pubkey_slurp.content | b64decode | trim }}"
  tags: [admin, user, wsl, standalone]

- name: Verify controller public key was loaded
  ansible.builtin.assert:
    that:
      - controller_pub_key_content is defined
      - controller_pub_key_content | length > 0
    fail_msg: >
      Controller public key is empty or missing.
      Ensure {{ controller_ssh_public_key_path }} exists on {{ groups['execution_nodes'][0] }}.
  tags: [admin, user, wsl, standalone]

# --- OpenSSH Server: install, configure, firewall, default shell ---
# 1) Install OpenSSH capability
- name: Ensure OpenSSH Server capability installed
  ansible.windows.win_shell: |
    $capName = "{{ openssh_server_capability }}"
    $state = (Get-WindowsCapability -Online -Name $capName).State
    if ($state -ne "Installed") {
      Add-WindowsCapability -Online -Name $capName | Out-Null
      Write-Output "INSTALLED"
    } else {
      Write-Output "AlreadyInstalled"
    }
  register: ssh_install
  changed_when: "'INSTALLED' in (ssh_install.stdout | default(''))"
  tags: [admin]

# 2) Ensure service running
- name: Ensure sshd service is enabled and started
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started
  tags: [admin]

# 3) Primary SSH port (WSL/bash) — sshd_config + firewall
- name: Ensure sshd listens on the configured port
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?Port\s+(?:22|{{ win_ssh_port }})\s*$'
    line: "Port {{ win_ssh_port }}"
    state: present
  register: sshd_port_result
  tags: [admin]

# 3b) Keepalive — detect dead sessions and clean up stale connections.
# Without this, dropped SSH clients leave zombie sessions indefinitely.
- name: Ensure sshd has ClientAliveInterval configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?ClientAliveInterval\s'
    line: "ClientAliveInterval 60"
    insertafter: '^#? '
    state: present
  register: sshd_keepalive_interval
  tags: [admin]

- name: Ensure sshd has ClientAliveCountMax configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?ClientAliveCountMax\s'
    line: "ClientAliveCountMax 3"
    insertafter: '^ClientAliveInterval'
    state: present
  register: sshd_keepalive_count
  tags: [admin]

- name: Ensure sshd has MaxSessions configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?MaxSessions\s'
    line: "MaxSessions {{ sshd_max_sessions }}"
    insertafter: '^(?:#\s*)?MaxAuthTries\s'
    state: present
  register: sshd_max_sessions_result
  tags: [admin]

- name: Ensure sshd has LoginGraceTime configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?LoginGraceTime\s'
    line: "LoginGraceTime {{ sshd_login_grace_time }}"
    insertafter: '^# Authentication:'
    state: present
  register: sshd_login_grace
  tags: [admin]

# --- Firewall rules for all SSH ports (primary + PowerShell) ---
- name: Configure Windows Firewall rules for SSH
  ansible.builtin.import_tasks: firewall.yml
  tags: [admin]

# 5) Default shell
# DefaultShell is set to PowerShell. Port 2222 lands directly in PowerShell.
# Note: VS Code/Cursor Remote-SSH requires a Unix-like shell — use the
# -wsl SSH alias (port 22 → WSL bash) for Remote-SSH editor connections.
# Use server-225-win (port 2222) for interactive PowerShell sessions only.

- name: Ensure HKLM:\SOFTWARE\OpenSSH registry key exists
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    state: present
  tags: [admin]

- name: Set the default OpenSSH shell to PowerShell
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    type: string
    state: present
  register: sshd_shell_result
  tags: [admin]

- name: Set OpenSSH DefaultShellCommandOption for PowerShell
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShellCommandOption
    data: "-NoLogo -NoProfile -c"
    type: string
    state: present
  register: sshd_shell_opt_result
  tags: [admin]

- name: Reset SSH connection after shell change
  ansible.builtin.meta: reset_connection
  tags: [admin]

# --- Administrator SSH access (authorized_keys + ACL + key deployment) ---
- name: Configure administrator SSH access
  ansible.builtin.import_tasks: administrator.yml
  tags: [admin]

# --- powershell-ssh: secondary SSH port that forces a PowerShell session ---
# Port 2223 listens alongside the primary WSL/bash port (2222).
# A Match LocalPort block at the END of sshd_config sets ForceCommand for this port.
# This block MUST go at the bottom of sshd_config (after all global directives
# and after Match Group administrators) to avoid capturing unrelated directives.
#
# DefaultShell is now PowerShell — port 2222 lands in PowerShell directly.
# Port 2223 Match LocalPort block remains for targeted ForceCommand use.
- block:
  - name: Resolve WSL companion for ps_port (when host has -wsl sibling)
    ansible.builtin.set_fact:
      _ps_wsl_companion: "{{ inventory_hostname | regex_replace('-win$', '-wsl') }}"
      _ps_wsl_distro: "{{ hostvars[inventory_hostname | regex_replace('-win$', '-wsl')]['wsl_distro'] | default('Ubuntu-24.04') }}"
    when: (inventory_hostname | regex_replace('-win$', '-wsl')) in hostvars

  - name: Ensure pwsh-sshd wrapper exists in WSL for ForceCommand
    ansible.windows.win_shell: |
      $distro = '{{ _ps_wsl_distro }}'
      $script = "#!/bin/bash`nexec /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile `"`$@`""
      $script | wsl.exe -d $distro -u root -- bash -c 'cat > /usr/local/bin/pwsh-sshd && chmod +x /usr/local/bin/pwsh-sshd'
    when: _ps_wsl_companion is defined

  # powershell-ssh — sshd_config: add Port listener
  - name: Ensure sshd_config has PowerShell port listener
    community.windows.win_lineinfile:
      path: "{{ sshd_config_path }}"
      regexp: '^Port\s+{{ win_ssh_powershell_port }}\s*$'
      line: "Port {{ win_ssh_powershell_port }}"
      insertafter: "^Port {{ win_ssh_port }}"
      state: present
    register: sshd_ps_port_result

  # powershell-ssh — sshd_config: declare PowerShell subsystem.
  # Native Windows path — runs directly in PowerShell (DefaultShell).
  - name: Ensure sshd_config declares PowerShell subsystem
    community.windows.win_lineinfile:
      path: "{{ sshd_config_path }}"
      regexp: '^Subsystem\s+powershell\s'
      line: "Subsystem    powershell    C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -sshs -NoLogo -NoProfile"
      insertafter: '^Subsystem\s+sftp'
      state: present
    register: sshd_ps_subsystem_result

  # powershell-ssh — sshd_config: Match LocalPort block (must be at EOF)
  - name: Ensure Match LocalPort block for PowerShell exists at end of sshd_config
    community.windows.win_lineinfile:
      path: "{{ sshd_config_path }}"
      regexp: '^Match LocalPort {{ win_ssh_powershell_port }}'
      line: "Match LocalPort {{ win_ssh_powershell_port }}"
      insertafter: EOF
      state: present
    register: sshd_ps_match_result

  # powershell-ssh — sshd_config: ForceCommand under Match block.
  # ForceCommand runs via wsl.exe -e <command>; the whole string is one argv to -e.
  # Use pwsh-sshd wrapper in /usr/local/bin (created above) — single executable, no parsing.
  - name: Ensure ForceCommand powershell under Match LocalPort block
    community.windows.win_lineinfile:
      path: "{{ sshd_config_path }}"
      regexp: '^\s+ForceCommand'
      line: "    ForceCommand pwsh-sshd"
      insertafter: "^Match LocalPort {{ win_ssh_powershell_port }}"
      state: present
    register: sshd_ps_force_result

  tags: [admin, powershell-ssh, ps_port]

# powershell-ssh — restart sshd if any config above changed (outside block so when vars exist)
- name: Restart sshd when PowerShell SSH config changed
  ansible.windows.win_service:
    name: sshd
    state: restarted
  when: >-
    sshd_ps_port_result is changed or
    sshd_ps_subsystem_result is changed or
    sshd_ps_match_result is changed or
    sshd_ps_force_result is changed
  tags: [admin, powershell-ssh, ps_port]

# --- Publish SSH-ready facts (consumed by controller SSH config template) ---
# ssh_configured gates the ssh_config.j2 template loop.
# HostName comes directly from ansible_host in host_vars (no ssh_host fact —
# ansible_host is the SSOT so cache drift cannot occur).
- name: Mark this host as SSH-configured
  ansible.builtin.set_fact:
    ssh_configured: true
    ssh_port: "{{ win_ssh_port }}"
    ssh_powershell_port: "{{ win_ssh_powershell_port }}"
    ssh_user: "{{ win_ssh_user | default(ansible_user) }}"
    cacheable: true
  tags: [admin, ps_port]

# --- WSL: optional reset (nuke and pave) ---
# The 'never' tag ensures this ONLY runs when explicitly requested:
#   ansible-playbook ... --tags wsl-reset,wsl
# A normal full run (no --tags) will skip this entirely.
- name: Reset WSL distro (unregister for clean re-provision)
  ansible.builtin.import_tasks: wsl_reset.yml
  tags: [wsl-reset, never]

# --- WSL: enable feature + install distro ---
- name: Configure WSL and install distribution
  ansible.builtin.import_tasks: ubuntu.yml
  tags: [wsl, standalone]

- name: Verify WSL deployment
  ansible.builtin.import_tasks: verify_wsl.yml
  tags: [wsl, verify]

# Include user tasks; run with --tags user to run only user tasks.
- name: Include user tasks
  ansible.builtin.include_tasks: user.yml
  tags: [user]

# --- Debug output: collect logs and diagnostics from all systems ---
# Run with --tags debug to collect only diagnostics, or automatically at end of full run.
- name: Collect debug diagnostics from all systems
  ansible.builtin.import_tasks: debug_output.yml
  tags: [debug]
