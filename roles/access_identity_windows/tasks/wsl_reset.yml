---
# wsl_reset.yml — Unregister the WSL distro for a clean re-provision.
# Tag: wsl-reset — run with:
#   ansible-playbook playbooks/access.yaml -i inventory/inventory.yaml \
#     --limit server-225-win --tags wsl-reset,wsl
#
# This destroys the distro and ALL its data. The normal wsl/standalone
# flow (ubuntu.yml) will re-install and re-provision it on the same run
# when the wsl tag is also included.

- name: Resolve WSL companion for reset
  ansible.builtin.set_fact:
    _wsl_companion: "{{ inventory_hostname | regex_replace('-win$', '-wsl') }}"
    _wsl_distro: "{{ hostvars[inventory_hostname | regex_replace('-win$', '-wsl')]['wsl_distro'] | default(wsl_distro) }}"

- name: Check if WSL distro is registered
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $list = (wsl.exe -l -q) -replace '\x00', '' | Where-Object { $_ -ne '' }
      $Ansible.Result = @{ registered = ($list -contains $distro) }
  register: _wsl_reset_check

- name: Unregister WSL distro ({{ _wsl_distro }})
  environment:
    WSL_UTF8: "1"
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $distro = '{{ _wsl_distro }}'
      # Terminate any running sessions before unregistering — wsl --unregister
      # hangs indefinitely if the distro has active processes or open sessions.
      # --terminate is safe when the distro is already stopped (exits 0, no-op).
      wsl.exe --terminate $distro 2>&1 | Out-Null
      Start-Sleep -Seconds 3
      wsl.exe --unregister $distro 2>&1 | Out-Null
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Failed = $true
        $Ansible.Result = "Failed to unregister $distro"
        Exit 1
      }
      $Ansible.Changed = $true
      $Ansible.Result = "Unregistered $distro"
  when: _wsl_reset_check.result.registered | default(false) | bool

- name: Report WSL reset result
  ansible.builtin.debug:
    msg: >-
      WSL distro '{{ _wsl_distro }}':
      {{ 'unregistered — will be re-provisioned by the wsl tag'
         if _wsl_reset_check.result.registered | default(false)
         else 'not registered — nothing to reset' }}
