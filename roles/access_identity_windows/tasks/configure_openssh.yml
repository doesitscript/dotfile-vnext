---
# configure_openssh.yml — Install and configure Windows OpenSSH server.
# Called from main.yml when openssh_server_enabled is true.
# Tags on individual tasks are preserved so --tags admin still works.

# 1) Install OpenSSH capability
- name: Ensure OpenSSH Server capability installed
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $capName = "{{ openssh_server_capability }}"
      $cap = Get-WindowsCapability -Online -Name $capName -ErrorAction Stop
      $beforeState = $cap.State.ToString()

      if ($beforeState -ne "Installed") {
        Add-WindowsCapability -Online -Name $capName -ErrorAction Stop | Out-Null
        $cap = Get-WindowsCapability -Online -Name $capName -ErrorAction Stop
        $afterState = $cap.State.ToString()

        if ($afterState -ne "Installed") {
          throw "OpenSSH Server capability install did not converge. Before=$beforeState After=$afterState"
        }

        $Ansible.Changed = $true
        $Ansible.Result = @{
          action = "installed"
          capability = $capName
          before = $beforeState
          after = $afterState
          restart_needed = [bool]$cap.RestartNeeded
        }
      } else {
        $Ansible.Result = @{
          action = "already_installed"
          capability = $capName
          before = $beforeState
          after = $beforeState
          restart_needed = [bool]$cap.RestartNeeded
        }
      }
  register: ssh_install
  become: "{{ openssh_server_capability_become | bool }}"
  become_method: ansible.builtin.runas
  become_user: "{{ openssh_server_capability_become_user }}"
  tags: [admin]

# 2) Ensure service is enabled; start only after config cleanup
- name: Ensure sshd service is enabled
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
  tags: [admin]

- name: Ensure OpenSSH ProgramData directory and config exist
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $configPath = "{{ sshd_config_path }}"
      $configDir = Split-Path -Path $configPath -Parent
      $defaultConfig = "C:\Windows\System32\OpenSSH\sshd_config_default"

      if (-not (Test-Path -LiteralPath $configDir)) {
        New-Item -Path $configDir -ItemType Directory -Force | Out-Null
        $Ansible.Changed = $true
      }

      if (-not (Test-Path -LiteralPath $configPath)) {
        Copy-Item -LiteralPath $defaultConfig -Destination $configPath -Force
        $Ansible.Changed = $true
      }

      $Ansible.Result = @{
        config_path = $configPath
        config_exists = Test-Path -LiteralPath $configPath
        default_config = $defaultConfig
      }
  register: sshd_config_seed_result
  tags: [admin]

- name: Ensure OpenSSH host keys exist
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $keyDir = "C:\ProgramData\ssh"
      $before = @(
        Get-ChildItem -LiteralPath $keyDir -Filter "ssh_host_*_key" -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -notmatch '\.pub$' }
      )

      & C:\Windows\System32\OpenSSH\ssh-keygen.exe -A | Out-Null

      $after = @(
        Get-ChildItem -LiteralPath $keyDir -Filter "ssh_host_*_key" -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -notmatch '\.pub$' }
      )

      if ($after.Count -gt $before.Count) {
        $Ansible.Changed = $true
      }

      $Ansible.Result = @{
        key_dir = $keyDir
        before_count = $before.Count
        after_count = $after.Count
        host_keys = @($after | Select-Object -ExpandProperty Name)
      }
  register: sshd_host_keys_result
  tags: [admin]

- name: Lock down OpenSSH host key ACLs
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $keyDir = "C:\ProgramData\ssh"
      $keyFiles = @(
        Get-ChildItem -LiteralPath $keyDir -Filter "ssh_host_*_key" -ErrorAction Stop |
        Where-Object { $_.Name -notmatch '\.pub$' }
      )
      $results = @()

      foreach ($keyFile in $keyFiles) {
        $before = (Get-Acl -LiteralPath $keyFile.FullName).Sddl

        & icacls.exe $keyFile.FullName /inheritance:r | Out-Null
        & icacls.exe $keyFile.FullName /setowner "SYSTEM" | Out-Null
        & icacls.exe $keyFile.FullName /grant:r "SYSTEM:F" "Administrators:F" | Out-Null

        foreach ($identity in @(
          "$env:COMPUTERNAME\{{ ansible_user }}",
          "$env:USERDOMAIN\{{ ansible_user }}",
          "Authenticated Users",
          "Users",
          "Everyone"
        )) {
          & icacls.exe $keyFile.FullName /remove:g $identity 2>$null | Out-Null
        }

        $after = (Get-Acl -LiteralPath $keyFile.FullName).Sddl
        if ($before -ne $after) {
          $Ansible.Changed = $true
        }
        $results += @{
          name = $keyFile.Name
          changed = ($before -ne $after)
        }
      }

      $Ansible.Result = @{
        key_dir = $keyDir
        host_keys = $results
      }
  register: sshd_host_key_acl_result
  tags: [admin]

- name: Ensure sshd listens on the configured port before any Match block
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $path = '{{ sshd_config_path }}'
      $desired = 'Port {{ win_ssh_port }}'
      $lines = @(Get-Content -Path $path -ErrorAction Stop)

      $withoutPorts = @(
        $lines | Where-Object { $_ -notmatch '^\s*Port\s+\d+\s*$' }
      )

      $matchIndex = -1
      for ($i = 0; $i -lt $withoutPorts.Count; $i++) {
        if ($withoutPorts[$i] -match '^\s*Match\s+') {
          $matchIndex = $i
          break
        }
      }

      if ($matchIndex -ge 0) {
        $newLines = @()
        if ($matchIndex -gt 0) {
          $newLines += $withoutPorts[0..($matchIndex - 1)]
        }
        $newLines += $desired
        $newLines += $withoutPorts[$matchIndex..($withoutPorts.Count - 1)]
      } else {
        $newLines = @($withoutPorts + $desired)
      }

      $currentText = ($lines -join "`n")
      $newText = ($newLines -join "`n")
      if ($currentText -ne $newText) {
        Set-Content -Path $path -Value $newLines -Encoding ascii
        $Ansible.Changed = $true
      }

      $Ansible.Result = @{
        port = '{{ win_ssh_port }}'
        inserted_before_match = [bool]($matchIndex -ge 0)
      }
  register: sshd_port_result
  tags: [admin]

- name: Remove legacy SSH listener ports from sshd_config
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^Port\s+{{ item }}\s*$'
    state: absent
  loop:
    - 22
    - 2222
    - "{{ win_ssh_powershell_port }}"
  when: (item | string) != (win_ssh_port | string)
  register: sshd_legacy_port_cleanup
  tags: [admin]

# 3b) Keepalive — detect dead sessions and clean up stale connections.
# Without this, dropped SSH clients leave zombie sessions indefinitely.
- name: Ensure sshd has ClientAliveInterval configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?ClientAliveInterval\s'
    line: "ClientAliveInterval 60"
    insertafter: '^#? '
    state: present
  register: sshd_keepalive_interval
  tags: [admin]

- name: Ensure sshd has ClientAliveCountMax configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?ClientAliveCountMax\s'
    line: "ClientAliveCountMax 3"
    insertafter: '^ClientAliveInterval'
    state: present
  register: sshd_keepalive_count
  tags: [admin]

- name: Ensure sshd has MaxSessions configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?MaxSessions\s'
    line: "MaxSessions {{ sshd_max_sessions }}"
    insertafter: '^(?:#\s*)?MaxAuthTries\s'
    state: present
  register: sshd_max_sessions_result
  tags: [admin]

- name: Ensure sshd has LoginGraceTime configured
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^(?:#\s*)?LoginGraceTime\s'
    line: "LoginGraceTime {{ sshd_login_grace_time }}"
    insertafter: '^# Authentication:'
    state: present
  register: sshd_login_grace
  tags: [admin]

# --- Firewall rules for Windows SSH ---
- name: Configure Windows Firewall rules for SSH
  ansible.builtin.import_tasks: firewall.yml
  tags: [admin]

# 5) Default shell
# DefaultShell is set to Windows PowerShell so direct SSH lands on Windows and
# cannot be redirected away from the Windows host by shell configuration drift.

- name: Ensure HKLM:\SOFTWARE\OpenSSH registry key exists
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    state: present
  tags: [admin]

- name: Set the default OpenSSH shell to PowerShell
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    type: string
    state: present
  register: sshd_shell_result
  tags: [admin]

- name: Remove custom OpenSSH DefaultShellCommandOption override
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShellCommandOption
    state: absent
  register: sshd_shell_opt_result
  tags: [admin]

- name: Remove legacy PowerShell subsystem from sshd_config
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^Subsystem\s+powershell\s'
    state: absent
  register: sshd_legacy_subsystem_cleanup
  tags: [admin]

- name: Remove legacy Match LocalPort block for PowerShell from sshd_config
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^Match LocalPort {{ win_ssh_powershell_port }}'
    state: absent
  register: sshd_legacy_match_cleanup
  tags: [admin]

- name: Remove legacy ForceCommand pwsh-sshd from sshd_config
  community.windows.win_lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^\s+ForceCommand\s+pwsh-sshd\s*$'
    state: absent
  register: sshd_legacy_forcecommand_cleanup
  tags: [admin]

- name: Ensure sshd service is started after config cleanup
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started
  register: sshd_service_start_result
  tags: [admin]

- name: Reset SSH connection after shell change
  ansible.builtin.meta: reset_connection
  tags: [admin]

# --- Administrator SSH access (authorized_keys + ACL + key deployment) ---
# TODO: disabled — administrators_authorized_keys not needed while OpenSSH is removed.
# Re-enable when OpenSSH is re-enabled (set openssh_server_enabled: true).
- name: Configure administrator SSH access
  ansible.builtin.import_tasks: administrator.yml
  tags: [admin]
