---
# ubuntu.yml — Enable WSL, install a distribution, configure user and SSH on Windows hosts.
# Runs via WinRM against the Windows surface (not SSH into WSL).
# Tag: wsl, standalone
#
# Adapted from myllynen/windows-ansible-roles wsl_configuration role:
#   https://github.com/myllynen/windows-ansible-roles/tree/master/roles/wsl_configuration
# and bootstrap-ansible-local.ps1 cloud-init provisioning logic.
#
# Uses win_powershell with native $Ansible.Changed / $Ansible.Failed tracking,
# WSL_UTF8 environment to avoid UTF-16 null-byte issues from wsl.exe output,
# and wsl.exe --install --no-distribution to let Microsoft's installer handle
# the underlying Windows features (WSL + Virtual Machine Platform).
#
# Variables are resolved from the companion WSL host (e.g. server-225-wsl)
# using the naming convention: <inventory_hostname> with -win replaced by -wsl.
#
# WSL host_vars consumed:
#   wsl_distro           — distribution name (e.g. Ubuntu-24.04)
# Role defaults consumed:
#   wsl_reboot_after     — reboot after WSL feature install (default: true)
#   wsl_config           — dictionary with networking_mode, static_ip, gateway
#
# Commands (via playbooks/access_windows.yaml):
#   WSL install/configure:   --tags wsl
#   WSL standalone SSH:      --tags standalone
#   WSL reset + reinstall:   --tags wsl-reset,wsl   (DESTRUCTIVE: unregisters distro first)

# --- Resolve companion WSL host variables ---

- name: Resolve WSL companion hostname
  ansible.builtin.set_fact:
    _wsl_companion: "{{ inventory_hostname | regex_replace('-win$', '-wsl') }}"

- name: Verify WSL companion host exists in inventory
  ansible.builtin.assert:
    that:
      - _wsl_companion in hostvars
    fail_msg: >
      Cannot find WSL companion host '{{ _wsl_companion }}' in inventory.
      Expected naming convention: {{ inventory_hostname }} → {{ _wsl_companion }}.
      Ensure a matching -wsl host exists in inventory with wsl_distro defined.

# Underscore-prefixed facts (_wsl_*) are internal copies resolved from the companion host's hostvars.
- name: Resolve WSL variables from companion host
  ansible.builtin.set_fact:
    _wsl_distro: "{{ hostvars[_wsl_companion]['wsl_distro'] | default(wsl_distro) }}"
    _wsl_user: "{{ hostvars[_wsl_companion]['wsl_user'] | default(hostvars[_wsl_companion]['ansible_user']) }}"
    _wsl_password: "{{ win_password | default(ansible_password) }}"
    _wsl_ssh_port: "{{ hostvars[_wsl_companion]['wsl_ssh_port'] | default(22) }}"
    _wsl_ssh_dir: "{{ hostvars[_wsl_companion]['ansible_ssh_dir_path'] }}"
    _wsl_authorized_keys: "{{ hostvars[_wsl_companion]['ansible_authorized_keys_path'] }}"

- name: Resolve WSL config contract
  ansible.builtin.set_fact:
    _wsl: "{{ wsl_config | default({}) }}"
    _wsl_networking_mode: "{{ (wsl_config | default({})).networking_mode | default('nat') }}"

- name: Display resolved WSL configuration
  ansible.builtin.debug:
    msg: >-
      WSL companion: {{ _wsl_companion }} |
      distro: {{ _wsl_distro }} |
      user: {{ _wsl_user }} |
      ssh_port: {{ _wsl_ssh_port }} |
      ssh_dir: {{ _wsl_ssh_dir }} |
      authorized_keys: {{ _wsl_authorized_keys }} |
      networking_mode: {{ _wsl_networking_mode }}

- name: Ensure bridged WSL requires Hyper-V bridge infrastructure
  ansible.builtin.assert:
    that:
      - _wsl_networking_mode != 'bridged' or
        (hyperv_config | default({})).external_switch_enabled | default(false) | bool
    fail_msg: >-
      WSL bridged mode requires hyperv_config.external_switch_enabled=true
      in host_vars. The Hyper-V External Switch must be configured as
      infrastructure before WSL can consume it.

# --- Step 1: Install WSL (feature + kernel) ---

- name: Install WSL (Windows Subsystem for Linux)
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $Ansible.Result = @{ action = 'none' }
      $status = (wsl.exe --status) -replace '\x00', '' | ? { $_ -ne '' } | Out-String
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Changed = $true
        $freshInstall = $status -notmatch 'not found'
        $Ansible.Result = @{ action = if ($freshInstall) { 'feature_install' } else { 'kernel_update' } }
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $opts = if (-not $freshInstall) { '--update' } else { '--install', '--no-distribution' }
        $result = Start-Process -FilePath wsl.exe -ArgumentList "$opts" -PassThru -Verb RunAs -Wait
        if ($result.ExitCode -ne 0) {
          $Ansible.Result = "Failed to install WSL: $result"
          $Ansible.Failed = $true
          Exit 1
        }
      }
  register: wsl_install

- name: Reboot after initial WSL feature install
  ansible.windows.win_reboot:
    reboot_timeout: 600
    msg: "Ansible reboot after initial WSL feature install"
  when:
    - wsl_reboot_after | default(true) | bool
    - wsl_install is changed
    - wsl_install.result.action | default('none') == 'feature_install'

# --- Step 1.2: .wslconfig bridged networking (consumer of Hyper-V External Switch) ---
# Deploys .wslconfig to tell WSL to use the External VMSwitch created by
# hyperv_networking. The switch_name comes from hyperv_config in host_vars.
# In NAT mode, no .wslconfig is needed.

- name: Deploy .wslconfig with bridged networking
  ansible.windows.win_template:
    src: wslconfig_bridged.j2
    dest: '%USERPROFILE%\.wslconfig'
    newline_sequence: '\r\n'
  register: _wslconfig_result
  when: _wsl_networking_mode == 'bridged'

- name: Shutdown WSL to apply .wslconfig changes
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $true
      wsl.exe --shutdown
      Start-Sleep -Seconds 8
  when:
    - _wsl_networking_mode == 'bridged'
    - _wslconfig_result is changed

# --- Step 1.3: Hyper-V firewall rule for inbound SSH to WSL VM ---
# The Hyper-V firewall is separate from the Windows Firewall and filters
# traffic for VMs on virtual switches. Without this rule, external hosts
# can ping WSL (ICMP is allowed by default) but TCP connections are blocked.

- name: Ensure Hyper-V firewall allows inbound SSH to WSL
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $ruleName = 'WSL-SSH-Inbound-TCP-22'
      $wslCreatorId = '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}'

      $existing = Get-NetFirewallHyperVRule -Name $ruleName -ErrorAction SilentlyContinue
      if ($existing) {
        $Ansible.Result = @{ action = 'unchanged'; rule = $ruleName }
        Exit 0
      }

      New-NetFirewallHyperVRule -Name $ruleName `
        -DisplayName 'Allow inbound SSH to WSL (TCP 22)' `
        -Direction Inbound -Action Allow `
        -VMCreatorId $wslCreatorId `
        -Protocol TCP -LocalPorts 22 | Out-Null
      $Ansible.Changed = $true
      $Ansible.Result = @{ action = 'created'; rule = $ruleName }
  when: _wsl_networking_mode == 'bridged'

# --- Step 1.5: Create cloud-init user-data on the Windows host ---
# Ubuntu 24.04 WSL reads %USERPROFILE%\.cloud-init\<distro>.user-data on first
# launch to auto-provision the user, password, sudo, and /etc/wsl.conf.
# Adapted from bootstrap-ansible-local.ps1 lines 218-266.

- name: Resolve Windows USERPROFILE path
  ansible.windows.win_powershell:
    script: $Ansible.Result = $env:USERPROFILE
  register: _win_userprofile

- name: Ensure cloud-init directory exists
  ansible.windows.win_file:
    path: "{{ _win_userprofile.result }}\\.cloud-init"
    state: directory

- name: Create cloud-init user-data for WSL distro
  ansible.windows.win_copy:
    force: true
    dest: "{{ _win_userprofile.result }}\\.cloud-init\\{{ _wsl_distro }}.user-data"
    content: |
      #cloud-config
      users:
        - name: {{ _wsl_user }}
          groups: [sudo, adm]
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          shell: /bin/bash
          lock_passwd: false
          passwd: {{ _wsl_password }}

      write_files:
        - path: /etc/wsl.conf
          content: |
            [boot]
            systemd=true
            [user]
            default={{ _wsl_user }}
        - path: /etc/profile.d/wsl-path.sh
          permissions: '0644'
          content: |
            # Ensure core Linux paths are always present in WSL shells.
            # Without this, wsl.exe entry points may only have Windows paths,
            # making systemctl, journalctl, and other system binaries unavailable.
            for _d in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
              case ":$PATH:" in
                *":$_d:"*) ;;
                *) export PATH="$_d:$PATH" ;;
              esac
            done
            unset _d
  register: _cloud_init_result

- name: Normalise cloud-init user-data to LF line endings
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $path = '{{ _win_userprofile.result }}\.cloud-init\{{ _wsl_distro }}.user-data'
      $raw  = [System.IO.File]::ReadAllText($path)
      $fixed = $raw -replace "`r`n", "`n"
      if ($raw -ne $fixed) {
        [System.IO.File]::WriteAllBytes($path,
          [System.Text.Encoding]::UTF8.GetBytes($fixed))
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }

- name: Read cloud-init user-data for verification
  ansible.builtin.slurp:
    src: "{{ _win_userprofile.result }}\\.cloud-init\\{{ _wsl_distro }}.user-data"
  register: _cloud_init_content

- name: Report cloud-init user-data path and contents
  ansible.builtin.debug:
    msg: |-
      Cloud-init user-data: {{ _cloud_init_result.dest | default('unknown') }}
      Status: {{ 'created/updated' if _cloud_init_result is changed else 'already current' }}
      Contents:
      {{ _cloud_init_content.content | b64decode }}

# --- Step 2: Install WSL distribution ---

- name: Check installed WSL distributions
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $Ansible.Result = @((wsl.exe --list --quiet) -replace '\x00', '' | ? { $_ -ne '' })
  register: wsl_distros
  retries: 10
  delay: 3
  until: wsl_distros is not failed

- name: Install WSL distribution ({{ _wsl_distro }})
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $current = @((wsl.exe --list --quiet) -replace '\x00', '' | ? { $_ -ne '' })
      if ($current -notcontains '{{ _wsl_distro }}') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $result = (wsl.exe --install '{{ _wsl_distro }}' --no-launch) -replace '\x00', '' | ? { $_ -ne '' } | Out-String
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to install '{{ _wsl_distro }}': $result"
          $Ansible.Failed = $true
          Exit 1
        }
      }
  register: wsl_distro_install

# --- Step 2.1: First launch + shutdown so cloud-init runs and wsl.conf takes effect ---
# Cloud-init only runs on first boot. We launch the distro, wait for cloud-init
# to create the user and write /etc/wsl.conf, then shutdown so wsl.conf settings
# (default user) take effect on next launch.

- name: First launch and shutdown WSL distro (cloud-init + wsl.conf apply)
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $true
      wsl.exe -d '{{ _wsl_distro }}' -e true
      Start-Sleep -Seconds 10
      wsl.exe --shutdown
      Start-Sleep -Seconds 3
  when: wsl_distro_install is defined and wsl_distro_install is changed

- name: Set default WSL distribution to {{ _wsl_distro }}
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $current = @((wsl.exe --status) -replace '\x00', '' | ? { $_ -ne '' })
      if ($current -notcontains 'Default Distribution: {{ _wsl_distro }}') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $result = (wsl.exe --set-default '{{ _wsl_distro }}') -replace '\x00', '' | ? { $_ -ne '' } | Out-String
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to set default distribution: $result"
          $Ansible.Failed = $true
          Exit 1
        }
      }
  when:
    - wsl_install is not changed or wsl_reboot_after | default(true) | bool

- name: Report WSL distribution status
  ansible.builtin.debug:
    msg: >-
      WSL distro '{{ _wsl_distro }}':
      {{ 'just installed' if (wsl_distro_install is defined and wsl_distro_install is changed) else 'already present' }}

# --- Step 2.6: Pre-warm WSL bridge (bridged mode only) ---
# When WSL first starts with networkingMode=bridged, Windows reconfigures the
# physical NIC into a Hyper-V bridge. That adapter reassignment causes a brief
# WinRM disruption (connection refused). Fire-and-forget the start so the
# disruption happens in a controlled window, then wait for WinRM to recover
# before proceeding with any tasks that require network inside WSL.

- name: Pre-warm WSL to trigger bridged network initialization
  environment:
    WSL_UTF8: "1"
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      wsl.exe -d '{{ _wsl_distro }}' -u root -- bash -c 'exit 0'
  async: 60
  poll: 0
  when: _wsl_networking_mode == 'bridged'

- name: Wait for WinRM to recover after WSL bridged network initialization
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 120
  when: _wsl_networking_mode == 'bridged'

# --- Step 2.5: Update WSL distribution packages ---
# Adapted from myllynen/windows-ansible-roles wsl_configuration update logic.
# Runs apt-get update && apt-get upgrade inside the distro via wsl.exe.

- name: Update WSL distribution packages
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $commands = @('apt-get update', 'apt-get upgrade -y')
      foreach ($cmd in $commands) {
        $result = (wsl.exe --distribution $distro --user root --exec ($cmd -split ' ')) -replace '\x00', '' | ? { $_ -ne '' }
        $rc = $LASTEXITCODE
        if ($cmd -ne 'apt-get update' -and $result -join ',' -notmatch ',0 upgraded') {
          $Ansible.Changed = $true
        }
        if ($rc -ne 0) {
          $Ansible.Result = "Failed to run '$cmd': $($result -join "`n")"
          $Ansible.Failed = $true
          Exit 1
        }
      }

# --- Step 3: Configure passwordless sudo ---
# Ensures /etc/sudoers.d/<user> exists with NOPASSWD:ALL.
# Cloud-init should have done this on first boot, but this is idempotent
# and handles cases where cloud-init didn't run or was skipped.

- name: Configure passwordless sudo for WSL user
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $user = '{{ _wsl_user }}'
      $sudoersFile = "/etc/sudoers.d/$user"
      $expectedLine = "$user ALL=(ALL) NOPASSWD:ALL"

      $current = (wsl.exe -d $distro -u root -- bash -c "cat $sudoersFile 2>/dev/null || true") -replace '\x00', '' | ? { $_ -ne '' }

      if ($current -notcontains $expectedLine) {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $expectedLine | wsl.exe -d $distro -u root -- tee $sudoersFile | Out-Null
        wsl.exe -d $distro -u root -- chmod 440 $sudoersFile
        $rc = $LASTEXITCODE
        if ($rc -ne 0) {
          $Ansible.Result = "Failed to set sudoers for $user"
          $Ansible.Failed = $true
          Exit 1
        }
      }


# --- Step 3.5: Ensure DNS resolution works before package installs ---
# WSL auto-generates resolv.conf on boot, but in bridged mode the initial
# config may not resolve correctly before netplan applies. This safety net
# writes a resolv.conf pointing at the gateway if resolution is broken.

- name: Ensure WSL distro has working DNS before package installs
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $gateway = '{{ _wsl.gateway | default("192.168.50.1") }}'

      $current = (wsl.exe -d $distro -u root -- bash -c 'cat /etc/resolv.conf 2>/dev/null || echo MISSING') -replace '\x00', '' | ? { $_ -ne '' }
      $currentStr = ($current -join "`n").Trim()

      $canResolve = (wsl.exe -d $distro -u root -- bash -c 'getent hosts archive.ubuntu.com >/dev/null 2>&1 && echo OK || echo FAIL') -replace '\x00', '' | ? { $_ -ne '' }

      if ($canResolve -notcontains 'OK') {
        $Ansible.Changed = $true
        wsl.exe -d $distro -u root -- bash -c "rm -f /etc/resolv.conf && echo 'nameserver $gateway' > /etc/resolv.conf"
      }
  when: _wsl_networking_mode == 'bridged'

# --- Step 4: Install and enable OpenSSH server in WSL ---
# Installs openssh-server and enables the ssh service via systemd.
# sshd_config (Port, PubkeyAuthentication, ListenAddress) is set in Step 4.5.
# authorized_keys deployment is handled in Step 5.

- name: Install openssh-server in WSL distro
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'

      $check = (wsl.exe -d $distro -u root -- bash -c 'dpkg -s openssh-server 2>/dev/null || echo NOT_INSTALLED') -replace '\x00', '' | ? { $_ -ne '' }
      $installed = ($check | Where-Object { $_ -match '^Status:.*installed' }).Count -gt 0

      if (-not $installed) {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $result = (wsl.exe -d $distro -u root -- bash -c "DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server") -replace '\x00', '' | ? { $_ -ne '' }
        $rc = $LASTEXITCODE
        if ($rc -ne 0) {
          $Ansible.Result = "Failed to install openssh-server: $($result -join "`n")"
          $Ansible.Failed = $true
          Exit 1
        }
      }
  register: _wsl_openssh_install

- name: Enable and start ssh service in WSL via systemd
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'

      $enabled = (wsl.exe -d $distro -u root -- bash -c 'systemctl is-enabled ssh 2>/dev/null || echo DISABLED') -replace '\x00', '' | ? { $_ -ne '' }
      $active = (wsl.exe -d $distro -u root -- bash -c 'systemctl is-active ssh 2>/dev/null || echo INACTIVE') -replace '\x00', '' | ? { $_ -ne '' }

      if ($enabled -notmatch '^enabled') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- bash -c 'systemctl enable ssh 2>&1'
      }

      if ($active -notmatch '^active') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- bash -c 'systemctl start ssh 2>&1'
      }

- name: Restart ssh service if openssh-server was just installed
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $true
      wsl.exe -d '{{ _wsl_distro }}' -u root -- bash -c 'systemctl restart ssh 2>&1'
  when: _wsl_openssh_install is changed

# --- Step 4.5: Configure WSL sshd — port, PubkeyAuthentication, ListenAddress ---

- name: Configure WSL sshd (port {{ _wsl_ssh_port }}, pubkey auth, listen on all interfaces)
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $config = '/etc/ssh/sshd_config'
      $restartNeeded = $false

      $settings = @{
        'Port'                    = '{{ _wsl_ssh_port }}'
        'ListenAddress'           = '0.0.0.0'
        'PubkeyAuthentication'    = 'yes'
        'PasswordAuthentication'  = 'yes'
        'ClientAliveInterval'     = '60'
        'ClientAliveCountMax'     = '3'
      }

      foreach ($key in $settings.Keys) {
        $val = $settings[$key]
        $current = (wsl.exe -d $distro -u root -- bash -c "grep -E '^\s*$key\s' $config 2>/dev/null || echo NOTFOUND") -replace '\x00', '' | ? { $_ -ne '' }
        if ($current -notmatch "^\s*$key\s+$val\s*$") {
          $Ansible.Changed = $true
          $restartNeeded = $true
          if ('{{ ansible_check_mode }}' -eq 'true') { continue }
          wsl.exe -d $distro -u root -- bash -c "sed -i '/^\s*#\?\s*$key\s/d' $config 2>&1"
          wsl.exe -d $distro -u root -- bash -c "echo '$key $val' >> $config"
        }
      }

      if ($restartNeeded -and '{{ ansible_check_mode }}' -ne 'true') {
        wsl.exe -d $distro -u root -- bash -c 'systemctl restart ssh 2>&1'
      }

# --- Step 4.6: Disable ssh.socket to prevent conflict with boot command ---
# Ubuntu 24.04 enables ssh.socket (systemd socket activation) by default.
# This fights with the [boot] command=service ssh start in wsl.conf.
# Mask it so the boot command cleanly owns port 22.

- name: Disable and mask ssh.socket in WSL distro
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'

      $masked = (wsl.exe -d $distro -u root -- bash -c 'systemctl is-enabled ssh.socket 2>&1') -replace '\x00', '' | ? { $_ -ne '' }
      if ($masked -notmatch '^masked') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- bash -c 'systemctl stop ssh.socket 2>&1; systemctl disable ssh.socket 2>&1; systemctl mask ssh.socket 2>&1'
      }

# --- Step 4.7: Bridged networking — configure WSL guest static IP ---
# Only runs when networking_mode == 'bridged'. Writes a Netplan config
# with the static IP and gateway from wsl_config dictionary.
# DNS is handled by the gateway (router) — systemd-resolved uses it via netplan.
# Persistent across WSL restarts.

- name: Configure Netplan static IP for bridged networking
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $staticIp = '{{ _wsl.static_ip | default("192.168.50.222/24") }}'
      $gateway = '{{ _wsl.gateway | default("192.168.50.1") }}'

      $netplanFile = '/etc/netplan/01-wsl-bridge.yaml'

      $lines = @(
        'network:'
        '  version: 2'
        '  ethernets:'
        '    eth0:'
        '      dhcp4: false'
        '      addresses:'
        "        - $staticIp"
        '      routes:'
        '        - to: default'
        "          via: $gateway"
        '      nameservers:'
        '        addresses:'
        "          - $gateway"
      )
      $expected = $lines -join "`n"

      $current = (wsl.exe -d $distro -u root -- bash -c "cat $netplanFile 2>/dev/null || echo NOTFOUND") -replace '\x00', '' | ? { $_ -ne '' }
      $currentStr = ($current -join "`n").Trim()

      if ($currentStr -ne $expected.Trim()) {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- bash -c "mkdir -p /etc/netplan"
        $expected | wsl.exe -d $distro -u root -- tee $netplanFile | Out-Null
        wsl.exe -d $distro -u root -- chmod 600 $netplanFile
        wsl.exe -d $distro -u root -- bash -c 'netplan apply 2>&1 || true'
      }
  when: _wsl_networking_mode == 'bridged'

# --- Step 4.7.1: Flush pre-boot DHCP address from eth0 (bridged mode) ---
# In WSL2 bridged mode, Hyper-V assigns a DHCP address from the LAN router
# during kernel init, before systemd-networkd/netplan start. This creates a
# duplicate IP (e.g. the Windows host's .158) alongside the intended static IP.
# This one-shot systemd unit flushes all IPv4 on eth0 before networkd runs,
# so only the netplan-configured address ends up on the interface.

- name: Deploy systemd service to flush pre-boot DHCP addresses on eth0
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'

      $unitFile = '/etc/systemd/system/flush-eth0-preboot.service'
      $unitContent = @(
        '[Unit]'
        'Description=Flush pre-boot DHCP addresses from eth0'
        'Before=systemd-networkd.service'
        'After=sys-subsystem-net-devices-eth0.device'
        ''
        '[Service]'
        'Type=oneshot'
        'ExecStart=/usr/sbin/ip addr flush dev eth0'
        'RemainAfterExit=yes'
        ''
        '[Install]'
        'WantedBy=network-pre.target'
      ) -join "`n"

      $current = (wsl.exe -d $distro -u root -- bash -c "cat $unitFile 2>/dev/null || echo NOTFOUND") -replace '\x00', '' | ? { $_ -ne '' }
      $currentStr = ($current -join "`n").Trim()

      if ($currentStr -ne $unitContent.Trim()) {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $unitContent | wsl.exe -d $distro -u root -- tee $unitFile | Out-Null
        wsl.exe -d $distro -u root -- bash -c 'systemctl daemon-reload 2>&1; systemctl enable flush-eth0-preboot.service 2>&1'
      }
  when: _wsl_networking_mode == 'bridged'

# DNS: systemd-resolved handles resolution natively in WSL.
# No manual /etc/resolv.conf override needed — the stub resolver at 127.0.0.53 works.
# The Netplan nameservers config above feeds the gateway (router) to systemd-resolved.

# --- Step 4.8: NAT networking — netsh portproxy for WSL SSH access ---
# FIXME: We are not using portproxy with bridge networking. These tasks are gated
# by networking_mode == 'nat' and will not run in bridged mode. Retained for
# hosts that still use NAT mode. Consider removing once all hosts are bridged.

- name: Configure netsh portproxy for WSL SSH (NAT mode)
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $distro = '{{ _wsl_distro }}'
      $listenPort = '{{ _wsl_ssh_port }}'
      $connectPort = '22'

      $wslIp = ((wsl.exe -d $distro -- bash -c 'hostname -I 2>/dev/null') -replace '\x00', '' | ? { $_ -ne '' }).Trim() -split '\s+' | Select-Object -First 1
      if (-not $wslIp) {
        $Ansible.Result = "Cannot resolve WSL IP for $distro"
        $Ansible.Failed = $true
        Exit 1
      }

      $existing = netsh interface portproxy show v4tov4 2>&1
      $pattern = "0\.0\.0\.0\s+$listenPort\s+$([regex]::Escape($wslIp))\s+$connectPort"
      if ($existing -match $pattern) {
        $Ansible.Result = @{ action = 'unchanged'; wsl_ip = $wslIp }
        Exit 0
      }

      $Ansible.Changed = $true
      if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }

      netsh interface portproxy delete v4tov4 listenport=$listenPort listenaddress=0.0.0.0 2>&1 | Out-Null
      netsh interface portproxy add v4tov4 listenport=$listenPort listenaddress=0.0.0.0 connectport=$connectPort connectaddress=$wslIp 2>&1 | Out-Null
      $Ansible.Result = @{ action = 'created'; wsl_ip = $wslIp; listen = "0.0.0.0:$listenPort"; connect = "${wslIp}:$connectPort" }
  when: _wsl_networking_mode == 'nat'
  register: _portproxy_result

- name: Report portproxy status (NAT mode)
  ansible.builtin.debug:
    msg: >-
      netsh portproxy: {{ _portproxy_result.result | default('skipped') }}
  when: _wsl_networking_mode == 'nat'

- name: Ensure firewall rule for WSL SSH port (NAT mode)
  community.windows.win_firewall_rule:
    name: sshd-WSL-Direct-In-TCP
    localport: "{{ _wsl_ssh_port }}"
    protocol: tcp
    direction: in
    action: allow
    state: present
    enabled: true
    description: "WSL direct SSH via portproxy (port {{ _wsl_ssh_port }})"
  when: _wsl_networking_mode == 'nat'

# --- Step 5: Deploy controller SSH key into WSL distro ---
# Mirrors the logic from user.yml (Windows SSH key deployment) but executes
# inside the distro via wsl.exe. The \\wsl$\ UNC path is NOT accessible
# from WinRM sessions (Plan 9 share is per-interactive-session), so all
# filesystem operations go through wsl.exe commands instead.

- name: Ensure WSL user .ssh directory exists with correct permissions
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $user = '{{ _wsl_user }}'
      $sshDir = '{{ _wsl_ssh_dir }}'
      $distro = '{{ _wsl_distro }}'

      $exists = (wsl.exe -d $distro -u $user -- test -d $sshDir '&&' echo YES '||' echo NO) -replace '\x00', '' | ? { $_ -ne '' }
      if ($exists -match 'NO') {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u $user -- mkdir -p $sshDir
      }

      $dirPerms = (wsl.exe -d $distro -u root -- stat -c '%a %U' $sshDir) -replace '\x00', '' | ? { $_ -ne '' }
      if ($dirPerms -notmatch "^700 $user$") {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- chown "${user}:${user}" $sshDir
        wsl.exe -d $distro -u root -- chmod 700 $sshDir
      }

- name: Install controller public key in WSL authorized_keys
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $user = '{{ _wsl_user }}'
      $authKeys = '{{ _wsl_authorized_keys }}'
      $distro = '{{ _wsl_distro }}'
      $pubKey = '{{ controller_pub_key_content }}'

      $current = (wsl.exe -d $distro -u $user -- cat $authKeys 2>$null) -replace '\x00', '' | ? { $_ -ne '' }
      if ($current -notcontains $pubKey) {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        $pubKey | wsl.exe -d $distro -u $user -- tee -a $authKeys | Out-Null
      }
  register: _wsl_pub_key_result

- name: Ensure correct permissions on WSL authorized_keys
  environment:
    WSL_UTF8: "1"
  check_mode: false
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $user = '{{ _wsl_user }}'
      $authKeys = '{{ _wsl_authorized_keys }}'
      $distro = '{{ _wsl_distro }}'

      $filePerms = (wsl.exe -d $distro -u root -- stat -c '%a %U' $authKeys) -replace '\x00', '' | ? { $_ -ne '' }
      if ($filePerms -notmatch "^600 $user$") {
        $Ansible.Changed = $true
        if ('{{ ansible_check_mode }}' -eq 'true') { Exit 0 }
        wsl.exe -d $distro -u root -- chown "${user}:${user}" $authKeys
        wsl.exe -d $distro -u root -- chmod 600 $authKeys
      }

- name: Report WSL SSH key deployment
  ansible.builtin.debug:
    msg: >-
      WSL SSH key for {{ _wsl_user }}@{{ _wsl_distro }}:
      {{ 'deployed/updated' if _wsl_pub_key_result is changed else 'already present' }}

# --- Step 6: Publish SSH-ready facts for WSL companion host ---
# Mirrors main.yml's "Mark this host as SSH-configured" but targets the
# companion WSL host. These cacheable facts are consumed by the controller's
# ssh_config.j2 template to auto-generate ~/.ssh/config entries.

- name: Mark WSL companion as SSH-configured
  ansible.builtin.set_fact:
    ssh_configured: true
    ssh_port: "{{ _wsl_ssh_port }}"
    ssh_user: "{{ _wsl_user }}"
    ssh_host: "{{ hostvars[_wsl_companion]['ansible_host'] }}"
    cacheable: true
  delegate_to: "{{ _wsl_companion }}"
  delegate_facts: true
