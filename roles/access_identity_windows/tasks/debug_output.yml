---
# debug_output.yml — Collect diagnostic output from Windows host services.
# Tag: debug — run with --tags debug, or included automatically at end of role.
# Collects: WinRM state, Windows OpenSSH events/config, network adapters/IPs,
#           and Hyper-V firewall state on the Windows host.

# ============================================================================
# WINDOWS HOST DIAGNOSTICS
# ============================================================================

- name: "DEBUG: Collect Windows OpenSSH service status and config"
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $out = @{}

      # sshd service
      $svc = Get-Service sshd -ErrorAction SilentlyContinue
      $out['sshd_service'] = @{
        status    = "$($svc.Status)"
        startType = "$($svc.StartType)"
      }

      # sshd processes
      $procs = Get-Process sshd -ErrorAction SilentlyContinue |
        Select-Object Id, StartTime, CPU, WorkingSet64
      $out['sshd_processes'] = @($procs | ForEach-Object {
        @{ pid = $_.Id; started = "$($_.StartTime)"; cpu = $_.CPU; mem_bytes = $_.WorkingSet64 }
      })

      # sshd_config
      $configPath = 'C:\ProgramData\ssh\sshd_config'
      if (Test-Path $configPath) {
        $out['sshd_config_path'] = $configPath
        $out['sshd_config'] = (Get-Content $configPath -Raw)
      }

      # SSH log files
      $logDir = 'C:\ProgramData\ssh\logs'
      if (Test-Path $logDir) {
        $out['ssh_log_files'] = @(Get-ChildItem $logDir -ErrorAction SilentlyContinue |
          ForEach-Object { @{ name = $_.Name; size = $_.Length; modified = "$($_.LastWriteTime)" } })
      } else {
        $out['ssh_log_files'] = @()
        $out['ssh_log_dir_note'] = 'Directory does not exist — file logging not enabled'
      }

      $Ansible.Result = $out
  register: _debug_win_ssh
  tags: [debug]

- name: "DEBUG: Collect Windows OpenSSH event log entries"
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $out = @{}
      $lookback = (Get-Date).AddHours(-6)

      # OpenSSH Operational (last 25)
      try {
        $ops = Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 25 -ErrorAction Stop
        $out['operational'] = @($ops | ForEach-Object {
          @{ time = "$($_.TimeCreated)"; level = $_.LevelDisplayName; id = $_.Id; msg = $_.Message }
        })
      } catch { $out['operational'] = @(); $out['operational_error'] = "$_" }

      # OpenSSH Admin — errors/criticals (last 25)
      try {
        $adm = Get-WinEvent -LogName 'OpenSSH/Admin' -MaxEvents 25 -ErrorAction Stop
        $out['admin'] = @($adm | ForEach-Object {
          @{ time = "$($_.TimeCreated)"; level = $_.LevelDisplayName; id = $_.Id; msg = $_.Message }
        })
      } catch { $out['admin'] = @(); $out['admin_error'] = "$_" }

      $Ansible.Result = $out
  register: _debug_win_ssh_events
  tags: [debug]

- name: "DEBUG: Collect WinRM state and stale sessions"
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $out = @{}

      # WinRM service
      $svc = Get-Service WinRM -ErrorAction SilentlyContinue
      $out['winrm_service'] = @{ status = "$($svc.Status)"; startType = "$($svc.StartType)" }

      # Listener config
      $out['winrm_listener'] = (winrm enumerate winrm/config/listener 2>&1 | Out-String).Trim()

      # Active shells (stale session detection)
      try {
        $shells = Get-WSManInstance -ResourceURI shell -Enumerate 2>&1
        $out['active_shells'] = @($shells | ForEach-Object {
          @{
            shellId     = $_.ShellId
            owner       = $_.Owner
            clientIP    = $_.ClientIP
            runTime     = $_.ShellRunTime
            inactivity  = $_.ShellInactivity
            idleTimeout = $_.IdleTimeOut
          }
        })
        $out['active_shell_count'] = $out['active_shells'].Count
      } catch {
        $out['active_shells'] = @()
        $out['active_shell_count'] = 0
        $out['shells_error'] = "$_"
      }

      # WinRM events (warnings/errors in last 6h)
      try {
        $events = Get-WinEvent -FilterHashtable @{
          LogName = 'System'; ProviderName = 'Microsoft-Windows-WinRM';
          Level = 1,2,3; StartTime = (Get-Date).AddHours(-6)
        } -MaxEvents 10 -ErrorAction Stop
        $out['winrm_system_events'] = @($events | ForEach-Object {
          @{ time = "$($_.TimeCreated)"; level = $_.LevelDisplayName; id = $_.Id; msg = $_.Message }
        })
      } catch { $out['winrm_system_events'] = @(); $out['winrm_events_note'] = 'No WinRM warnings/errors in System log (last 6h)' }

      $Ansible.Result = $out
  register: _debug_winrm
  tags: [debug]

- name: "DEBUG: Collect Windows network state"
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $out = @{}

      # Network adapters
      $out['adapters'] = @(Get-NetAdapter | ForEach-Object {
        @{ name = $_.Name; desc = $_.InterfaceDescription; status = "$($_.Status)"; mac = $_.MacAddress; speed = $_.LinkSpeed }
      })

      # IPv4 addresses
      $out['ipv4'] = @(Get-NetIPAddress -AddressFamily IPv4 | ForEach-Object {
        @{ iface = $_.InterfaceAlias; ip = $_.IPAddress; prefix = $_.PrefixLength; origin = "$($_.PrefixOrigin)" }
      })

      # Firewall rules (SSH + WinRM)
      $out['firewall_ssh_winrm'] = @(
        Get-NetFirewallRule |
          Where-Object { $_.DisplayName -match 'WinRM|SSH|sshd|Remote Management' -and $_.Enabled -eq 'True' } |
          ForEach-Object {
            @{ name = $_.DisplayName; direction = "$($_.Direction)"; action = "$($_.Action)"; profile = "$($_.Profile)" }
          }
      )

      # Hyper-V firewall rules
      try {
        $out['hyperv_fw'] = @(Get-NetFirewallHyperVRule -ErrorAction Stop | ForEach-Object {
          @{ name = $_.DisplayName; direction = "$($_.Direction)"; action = "$($_.Action)"; enabled = $_.Enabled }
        })
      } catch { $out['hyperv_fw'] = @(); $out['hyperv_fw_note'] = "$_" }

      # System events (network-related warnings/errors, last 6h)
      try {
        $events = Get-WinEvent -FilterHashtable @{
          LogName = 'System'; Level = 1,2,3; StartTime = (Get-Date).AddHours(-6)
        } -MaxEvents 50 -ErrorAction Stop |
          Where-Object { $_.ProviderName -match 'Hyper-V|TCPIP|DNS|DHCP|NetBT|vmswitch' }
        $out['network_system_events'] = @($events | ForEach-Object {
          @{ time = "$($_.TimeCreated)"; provider = $_.ProviderName; level = $_.LevelDisplayName; id = $_.Id; msg = $_.Message }
        })
      } catch { $out['network_system_events'] = @() }

      $Ansible.Result = $out
  register: _debug_network
  tags: [debug]

# ============================================================================
# OUTPUT: Print all collected diagnostics
# ============================================================================

- name: "DEBUG OUTPUT: Log locations and sources"
  ansible.builtin.debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════╗
      ║              LOG LOCATIONS & DATA SOURCES                   ║
      ╠══════════════════════════════════════════════════════════════╣
      ║ WINDOWS HOST ({{ inventory_hostname }})                     ║
      ║  • WinRM Event Log:    Microsoft-Windows-WinRM/Operational  ║
      ║  • OpenSSH Operational: OpenSSH/Operational                 ║
      ║  • OpenSSH Admin:       OpenSSH/Admin                      ║
      ║  • sshd_config:         C:\ProgramData\ssh\sshd_config     ║
      ║  • SSH log dir:         C:\ProgramData\ssh\logs\           ║
      ║  • System log:          System (WinRM, Hyper-V, TCPIP)     ║
      ║  • Application log:     Application (sshd provider)        ║
      ╠══════════════════════════════════════════════════════════════╣
      ║ MAC CONTROLLER                                              ║
      ║  • SSH client config:   ~/.ssh/config                      ║
      ║  • SSH mux sockets:     ~/.ssh/ssh_mux_*                   ║
      ║  • Ansible log:         (stdout / callback plugin)         ║
      ╚══════════════════════════════════════════════════════════════╝
  tags: [debug]

- name: "DEBUG OUTPUT: Windows OpenSSH — service and config"
  ansible.builtin.debug:
    var: _debug_win_ssh.result
  when: _debug_win_ssh is defined
  tags: [debug]

- name: "DEBUG OUTPUT: Windows OpenSSH — event log entries"
  ansible.builtin.debug:
    var: _debug_win_ssh_events.result
  when: _debug_win_ssh_events is defined
  tags: [debug]

- name: "DEBUG OUTPUT: WinRM state and sessions"
  ansible.builtin.debug:
    var: _debug_winrm.result
  when: _debug_winrm is defined
  tags: [debug]

- name: "DEBUG OUTPUT: Windows network state"
  ansible.builtin.debug:
    var: _debug_network.result
  when: _debug_network is defined
  tags: [debug]
