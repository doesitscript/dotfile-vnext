---
# access_identity_windows: OpenSSH Server, port, key file path, verification. Override via group_vars / -e.
# explicit capability string avoids null/multi-object mistakes
openssh_server_capability: "OpenSSH.Server~~~~0.0.1.0"

win_ssh_port: 2222

# sshd_config tunables — override in group_vars or host_vars as needed.
# LoginGraceTime: seconds sshd waits for authentication before disconnecting.
# Default upstream is 120s (2m); 60s is tighter without breaking slow links.
sshd_login_grace_time: 60

# MaxSessions: max concurrent sessions per network connection.
# Should be >= ansible.cfg forks so parallel Ansible runs never hit the cap.
# ansible.cfg sets forks = 20; match that here.
sshd_max_sessions: 20

# WARNING: win_ssh_powershell_port is experimental and subject to change.
# This secondary port exists for two purposes:
#   1) Troubleshooting — provides a direct PowerShell session when WSL/bash is broken.
#   2) Enabling SSH access to WSL via the primary port's DefaultShell (wsl.exe).
#
# IMPORTANT: SSH to the primary port (2222) lands in WSL bash, but this is NOT true
# SSH access to the WSL distribution. Windows OpenSSH accepts the connection and
# forwards it to WSL via wsl.exe. The SSH server is Windows sshd, not an sshd
# running inside WSL. Authentication, keys, and sshd_config are all Windows-side.
# The WSL session inherits Windows environment constraints.
win_ssh_powershell_port: 2223

# win_ssh_user: set in host_vars/group_vars (e.g. same as win_user or ansible_user); no hardcoded usernames.

administrators_authorized_keys_path: "C:\\ProgramData\\ssh\\administrators_authorized_keys"

# User SSH config (user.yml): paths follow same pattern as ansible_ssh_private_key_file.
sshd_config_path: "C:\\ProgramData\\ssh\\sshd_config"
ansible_ssh_dir_path: "C:\\Users\\joshc\\.ssh"
ansible_authorized_keys_path: "C:\\Users\\joshc\\.ssh\\authorized_keys"

# Controller public key path — must match access_identity_controller defaults.
# Used by delegate_to + slurp so this role works standalone (without running controller play first).
controller_ssh_public_key_path: "~/.ssh/id_ed25519_ansible.pub"

# --- WSL configuration (ubuntu.yml) ---
# wsl_distro is NOT defaulted here — it comes from the companion -wsl host_vars
# (e.g. host_vars/server-225-wsl.yaml). ubuntu.yml resolves it via hostvars lookup.
# This keeps the WSL distro definition in one authoritative place.
#
# Reboot automatically after enabling WSL feature (set false if you handle reboots externally)
wsl_reboot_after: true

# WSL networking and guest config — API contract dictionary.
# 'nat'     — WSL uses NAT with netsh portproxy for inbound SSH access.
# 'bridged' — WSL gets its own LAN IP via Hyper-V External Switch.
#             Requires hyperv_config.external_switch_enabled=true in host_vars.
# Override the full dict or individual keys in host_vars.
wsl_config:
  networking_mode: "nat"
  # gateway: the default router address used for bridged mode DNS resolution.
  # Override in host_vars if the router is at a different address.
  gateway: "192.168.50.1"

# --- WSL keepalive scheduled task (ubuntu.yml Step 7) ---
# Controls whether Step 7 creates the WSLKeepalive Windows Scheduled Task.
#
# BACKGROUND: WSL 2 shuts down the VM after a short idle period (~8s on WSL
# 2.6.x / Windows 11 24H2) when no active wsl.exe sessions exist. Systemd
# daemons like sshd and dockerd do NOT count as active sessions. The .wslconfig
# setting vmIdleTimeout=-1 is meant to prevent this but is not honored in WSL
# 2.6.3. When the VM shuts down, the distro's bridged IP becomes unreachable,
# breaking SSH from Mac and Docker contexts.
#
# THE FIX: A Scheduled Task running "wsl.exe -d <distro> -- sleep infinity"
# as the logged-in user holds a permanent wsl.exe session open, preventing the
# idle shutdown entirely. It runs at logon and is self-maintaining.
#
# WHY IT IS OFF BY DEFAULT:
# In practice, the idle shutdown only becomes a persistent problem when:
#   1) The distro is used as a Docker engine target from a remote host (Mac)
#   2) The distro is used as an SSH target from a remote host
# If WSL is only used locally on the Windows machine, the idle shutdown is
# harmless — Windows will just reopen WSL on the next wsl.exe call.
#
# WHEN TO ENABLE: Set to true in host_vars for any Windows host whose WSL
# distro serves as a remote Docker engine or persistent SSH endpoint. Example:
#
#   # host_vars/server-225-win.yaml
#   wsl_keepalive_enabled: true
#
# TROUBLESHOOTING: If SSH from Mac or docker --context starts timing out after
# idle periods, this flag is the first thing to check. Set true and re-run
# the access_windows playbook with --tags wsl on the affected Windows host.
# Full context: docs/lessons-learned/windows/wsl-idle-shutdown-and-wslconfig-parsing.md
wsl_keepalive_enabled: false
