---
# access_identity_windows: OpenSSH Server, port, key file path, verification. Override via group_vars / -e.
# explicit capability string avoids null/multi-object mistakes
openssh_server_capability: "OpenSSH.Server~~~~0.0.1.0"

win_ssh_port: 22
# win_ssh_user: set in host_vars/group_vars (e.g. same as win_user or ansible_user); no hardcoded usernames.

administrators_authorized_keys_path: "C:\\ProgramData\\ssh\\administrators_authorized_keys"

# # verification is ON by default because it proves cross-machine capability
# verify_ssh_from_controller: true
# verify_ssh_connect_timeout_seconds: 15
