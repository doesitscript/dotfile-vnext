---
# access_identity_windows: OpenSSH Server, port, key file path, verification. Override via group_vars / -e.
# explicit capability string avoids null/multi-object mistakes
openssh_server_capability: "OpenSSH.Server~~~~0.0.1.0"

win_ssh_port: 22
# win_ssh_user: set in host_vars/group_vars (e.g. same as win_user or ansible_user); no hardcoded usernames.

administrators_authorized_keys_path: "C:\\ProgramData\\ssh\\administrators_authorized_keys"

# User SSH config (user.yml): paths follow same pattern as ansible_ssh_private_key_file.
sshd_config_path: "C:\\ProgramData\\ssh\\sshd_config"
ansible_ssh_dir_path: "C:\\Users\\joshc\\.ssh"
ansible_authorized_keys_path: "C:\\Users\\joshc\\.ssh\\authorized_keys"

# Patterns/lines for commenting out default sshd_config block (so ansible_authorized_keys_path is used). Defined here so user.yml stays free of admin wording.
# sshd_match_regexp: '^\s*Match Group administrators'
# sshd_match_commented_line: '# Match Group administrators'
# sshd_authorizedkeysfile_regexp: '^\s*AuthorizedKeysFile\s+.*administrators_authorized_keys'
# sshd_authorizedkeysfile_commented_line: '# AuthorizedKeysFile (use ansible_authorized_keys_path)'

# # verification is ON by default because it proves cross-machine capability
# verify_ssh_from_controller: true
# verify_ssh_connect_timeout_seconds: 15
