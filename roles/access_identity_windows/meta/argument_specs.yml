---
argument_specs:
  main:
    short_description: Windows identity, OpenSSH, and WSL configuration
    description: >-
      Installs and configures Windows OpenSSH Server, deploys SSH keys,
      manages sshd_config tunables for direct Windows SSH access, and
      optionally configures WSL only when explicitly enabled.
    options:
      openssh_server_state:
        type: str
        required: false
        default: "present"
        choices:
          - present
          - absent
        description: >-
          Desired lifecycle state for the Windows OpenSSH server. `present`
          installs and configures the service; `absent` removes it. Prefer
          this state variable over boolean toggles for new work.

      openssh_server_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Legacy compatibility toggle for the Windows OpenSSH server. When
          `openssh_server_state` is undefined, `true` maps to `present` and
          `false` maps to `absent`. Prefer `openssh_server_state` for new work.

      openssh_server_capability:
        type: str
        required: false
        default: "OpenSSH.Server~~~~0.0.1.0"
        description: >-
          Windows capability string for OpenSSH Server. The explicit string
          avoids null/multi-object lookup errors when querying installed state.

      win_ssh_port:
        type: int
        required: false
        default: 22
        description: >-
          TCP port Windows OpenSSH sshd listens on for the preferred
          direct-to-Windows SSH path.

      win_ssh_powershell_port:
        type: int
        required: false
        default: 2223
        description: >-
          Legacy cleanup variable for older PowerShell-over-SSH experiments.
          Not part of the current preferred Windows-only SSH path.

      sshd_login_grace_time:
        type: int
        required: false
        default: 60
        description: >-
          Seconds sshd waits for authentication before disconnecting
          (LoginGraceTime). Upstream default is 120s; 60s is tighter
          without breaking slow links.

      sshd_max_sessions:
        type: int
        required: false
        default: 20
        description: >-
          Maximum concurrent sessions per network connection (MaxSessions).
          Should be >= ansible.cfg forks value so parallel Ansible runs
          never hit the cap.

      administrators_authorized_keys_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
        description: >-
          Path to the system-wide authorized_keys file for administrator
          accounts, as required by Windows OpenSSH for privileged users.

      sshd_config_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\sshd_config"
        description: Path to the Windows OpenSSH sshd_config file.

      ansible_ssh_dir_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh"
        description: >-
          Path to the user's .ssh directory on the Windows host. Used when
          deploying authorized_keys for the Ansible user account.

      ansible_authorized_keys_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh\\authorized_keys"
        description: >-
          Full path to the authorized_keys file for the Ansible user account
          on the Windows host.

      controller_ssh_public_key_path:
        type: str
        required: false
        default: "~/.ssh/id_ed25519_ansible.pub"
        description: >-
          Path (on the Ansible controller) to the public key that will be
          authorized on Windows and WSL hosts. Must match the key used in
          ansible.cfg ssh_args / IdentityFile. Used with delegate_to + slurp
          so this role works standalone without a preceding controller play.

      wsl_reboot_after:
        type: bool
        required: false
        default: true
        description: >-
          Reboot the Windows host automatically after enabling the WSL
          optional feature. Set false when reboots are managed externally
          (e.g. a separate reboot play with a maintenance window).

      wsl_config:
        type: dict
        required: false
        description: >-
          WSL networking and guest configuration dictionary. Controls
          bridged vs NAT networking mode and gateway address. In bridged mode,
          the WSL distro receives its IP via DHCP from the LAN router. The
          distro hostname (set in wsl.conf) is registered with router DNS —
          no static IP is required or accepted.
        options:
          networking_mode:
            type: str
            required: false
            default: "nat"
            description: >-
              WSL networking mode. 'nat' uses NAT with netsh portproxy for
              inbound SSH. 'bridged' gives WSL its own LAN IP via Hyper-V
              External Switch (requires hyperv_config.external_switch_enabled
              in host_vars). In bridged mode, DHCP is used — address the
              distro by hostname, not by IP.
          gateway:
            type: str
            required: false
            default: "192.168.50.1"
            description: >-
              Default gateway for the WSL distro. Used as the DNS resolver
              address in bridged mode (router handles DNS for DHCP hostnames).

      # wsl_keepalive_enabled removed — WSLKeepalive scheduled task deprecated.
      # Idle shutdown prevention is now handled by keepwsl.service (ubuntu.yml Step 6.5).
