---
argument_specs:
  main:
    short_description: Windows identity and OpenSSH configuration
    description: >-
      Installs and configures Windows OpenSSH Server, deploys SSH keys,
      and manages sshd_config tunables for direct Windows SSH access.
    options:
      openssh_server_state:
        type: str
        required: false
        default: "present"
        choices:
          - present
          - absent
        description: >-
          Desired lifecycle state for the Windows OpenSSH server. `present`
          installs and configures the service; `absent` removes it. Prefer
          this state variable over boolean toggles for new work.

      openssh_server_enabled:
        type: bool
        required: false
        default: true
        description: >-
          Legacy compatibility toggle for the Windows OpenSSH server. When
          `openssh_server_state` is undefined, `true` maps to `present` and
          `false` maps to `absent`. Prefer `openssh_server_state` for new work.

      openssh_server_capability:
        type: str
        required: false
        default: "OpenSSH.Server~~~~0.0.1.0"
        description: >-
          Windows capability string for OpenSSH Server. The explicit string
          avoids null/multi-object lookup errors when querying installed state.

      openssh_server_capability_become:
        type: bool
        required: false
        default: true
        description: >-
          Run Windows capability install/removal through Ansible runas
          escalation. This avoids Windows Update Feature on Demand access
          failures from WinRM network logon tokens.

      openssh_server_capability_become_user:
        type: str
        required: false
        default: "SYSTEM"
        description: >-
          Windows account used for OpenSSH Server capability install/removal
          when openssh_server_capability_become is true.

      win_ssh_port:
        type: int
        required: false
        default: 22
        description: >-
          TCP port Windows OpenSSH sshd listens on for the preferred
          direct-to-Windows SSH path.

      win_ssh_powershell_port:
        type: int
        required: false
        default: 2223
        description: >-
          Legacy cleanup variable for older PowerShell-over-SSH experiments.
          Not part of the current preferred Windows-only SSH path.

      sshd_login_grace_time:
        type: int
        required: false
        default: 60
        description: >-
          Seconds sshd waits for authentication before disconnecting
          (LoginGraceTime). Upstream default is 120s; 60s is tighter
          without breaking slow links.

      sshd_max_sessions:
        type: int
        required: false
        default: 20
        description: >-
          Maximum concurrent sessions per network connection (MaxSessions).
          Should be >= ansible.cfg forks value so parallel Ansible runs
          never hit the cap.

      administrators_authorized_keys_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
        description: >-
          Path to the system-wide authorized_keys file for administrator
          accounts, as required by Windows OpenSSH for privileged users.

      sshd_config_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\sshd_config"
        description: Path to the Windows OpenSSH sshd_config file.

      ansible_ssh_dir_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh"
        description: >-
          Path to the user's .ssh directory on the Windows host. Used when
          deploying authorized_keys for the Ansible user account.

      ansible_authorized_keys_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh\\authorized_keys"
        description: >-
          Full path to the authorized_keys file for the Ansible user account
          on the Windows host.

      controller_ssh_public_key_path:
        type: str
        required: false
        default: "~/.ssh/id_ed25519_ansible.pub"
        description: >-
          Path (on the Ansible controller) to the public key that will be
          authorized on Windows hosts. Must match the key used in
          ansible.cfg ssh_args / IdentityFile. Used with delegate_to + slurp
          so this role can run directly without a preceding controller play.
