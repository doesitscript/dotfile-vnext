---
argument_specs:
  main:
    short_description: Windows identity, OpenSSH, and WSL configuration
    description: >-
      Installs and configures Windows OpenSSH Server, deploys SSH keys,
      configures sshd_config tunables, enables WSL 2, installs a Linux
      distribution, configures bridged networking via .wslconfig, and
      optionally registers a keepalive scheduled task to prevent WSL
      idle-shutdown.
    options:
      openssh_server_capability:
        type: str
        required: false
        default: "OpenSSH.Server~~~~0.0.1.0"
        description: >-
          Windows capability string for OpenSSH Server. The explicit string
          avoids null/multi-object lookup errors when querying installed state.

      win_ssh_port:
        type: int
        required: false
        default: 2222
        description: >-
          TCP port Windows OpenSSH sshd listens on. Default 2222 avoids
          conflict with any WSL sshd that may listen on 22.

      win_ssh_powershell_port:
        type: int
        required: false
        default: 2223
        description: >-
          Secondary OpenSSH port whose DefaultShell is PowerShell.exe.
          Provides a direct PowerShell session for troubleshooting when the
          primary WSL-redirected port is broken. Note: connecting to the
          primary port (win_ssh_port) lands in WSL bash via wsl.exe as the
          DefaultShell — that session is hosted by Windows sshd, not by a
          sshd running inside WSL.

      sshd_login_grace_time:
        type: int
        required: false
        default: 60
        description: >-
          Seconds sshd waits for authentication before disconnecting
          (LoginGraceTime). Upstream default is 120s; 60s is tighter
          without breaking slow links.

      sshd_max_sessions:
        type: int
        required: false
        default: 20
        description: >-
          Maximum concurrent sessions per network connection (MaxSessions).
          Should be >= ansible.cfg forks value so parallel Ansible runs
          never hit the cap.

      administrators_authorized_keys_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
        description: >-
          Path to the system-wide authorized_keys file for administrator
          accounts, as required by Windows OpenSSH for privileged users.

      sshd_config_path:
        type: str
        required: false
        default: "C:\\ProgramData\\ssh\\sshd_config"
        description: Path to the Windows OpenSSH sshd_config file.

      ansible_ssh_dir_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh"
        description: >-
          Path to the user's .ssh directory on the Windows host. Used when
          deploying authorized_keys for the Ansible user account.

      ansible_authorized_keys_path:
        type: str
        required: false
        default: "C:\\Users\\joshc\\.ssh\\authorized_keys"
        description: >-
          Full path to the authorized_keys file for the Ansible user account
          on the Windows host.

      controller_ssh_public_key_path:
        type: str
        required: false
        default: "~/.ssh/id_ed25519_ansible.pub"
        description: >-
          Path (on the Ansible controller) to the public key that will be
          authorized on Windows and WSL hosts. Must match the key used in
          ansible.cfg ssh_args / IdentityFile. Used with delegate_to + slurp
          so this role works standalone without a preceding controller play.

      wsl_reboot_after:
        type: bool
        required: false
        default: true
        description: >-
          Reboot the Windows host automatically after enabling the WSL
          optional feature. Set false when reboots are managed externally
          (e.g. a separate reboot play with a maintenance window).

      wsl_config:
        type: dict
        required: false
        description: >-
          WSL networking and guest configuration dictionary. Controls
          bridged vs NAT networking mode and gateway address.
        options:
          networking_mode:
            type: str
            required: false
            default: "nat"
            description: >-
              WSL networking mode. 'nat' uses NAT with netsh portproxy for
              inbound SSH. 'bridged' gives WSL its own LAN IP via Hyper-V
              External Switch (requires hyperv_config.external_switch_enabled
              in host_vars).
          gateway:
            type: str
            required: false
            default: "192.168.50.1"
            description: >-
              Default gateway for the WSL distro in bridged mode.
          static_ip:
            type: str
            required: false
            description: >-
              Static IP address (CIDR notation, e.g. 192.168.50.222/24) assigned
              to the WSL distro in bridged mode. Used by the Netplan config
              deployed inside the distro. Only relevant when networking_mode
              is 'bridged'.

      wsl_keepalive_enabled:
        type: bool
        required: false
        default: false
        description: >-
          Enable the WSLKeepalive Windows Scheduled Task (ubuntu.yml Step 7).
          The task runs "wsl.exe -d <distro> -- sleep infinity" as the
          logged-in user at logon, holding a permanent wsl.exe session open
          so the WSL 2 VM never reaches the idle-shutdown threshold.

          Set true in host_vars for any Windows host whose WSL distro serves
          as a remote Docker engine target or persistent SSH endpoint from
          another machine (e.g. mac-dev using docker --context or direct SSH).

          Background: WSL 2.6.x on Windows 11 24H2 shuts down the VM after
          ~8s of idle (no active wsl.exe sessions). The .wslconfig setting
          vmIdleTimeout=-1 is parsed correctly but not honored in WSL 2.6.3.
          This scheduled task is the reliable workaround.

          See docs/lessons-learned/windows/wsl-idle-shutdown-and-wslconfig-parsing.md
