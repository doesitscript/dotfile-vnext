---
argument_specs:
  main:
    short_description: Install and manage Langfuse CLI tooling
    description:
      - Installs langfuse-cli npm package globally with version pinning
      - Follows project version contract pattern
    options:
      langfuse_cli_version:
        type: str
        required: false
        description: Pinned version from langfuse_tooling_version_contract.cli
      langfuse_cli_package_name:
        type: str
        required: false
        description: Constructed package name with version (langfuse@version)
      langfuse_cli_state:
        type: str
        required: false
        default: present
        choices:
          - present
          - absent
        description: Desired state of langfuse-cli package
