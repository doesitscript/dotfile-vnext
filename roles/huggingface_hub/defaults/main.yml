---
# huggingface_hub — install Hugging Face Hub Python package + `hf` CLI.
# Lifecycle: huggingface_hub_state: present|absent
# Authority: ansible.windows.win_command → `py -m pip` (same Windows Python pattern
# as roles/python/tasks/windows.yml). Not an SSH one-liner snowflake.
huggingface_hub_state: absent

# Package contract — pin via inventory version contract when set.
huggingface_hub_package_name: huggingface_hub
huggingface_hub_package_version: ""
huggingface_hub_pip_user_install: true

# Verify after converge
huggingface_hub_verify: true
