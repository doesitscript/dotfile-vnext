---
argument_specs:
  main:
    short_description: Manage huggingface_hub (hf CLI) on Windows via pip
    options:
      huggingface_hub_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
        description: Lifecycle control for the huggingface_hub package.
      huggingface_hub_package_name:
        type: str
        required: false
        default: huggingface_hub
        description: PyPI package name.
      huggingface_hub_package_version:
        type: str
        required: false
        default: ""
        description: Optional exact version pin; empty means unpinned present install.
      huggingface_hub_pip_user_install:
        type: bool
        required: false
        default: true
        description: Pass --user to pip install/uninstall scope.
      huggingface_hub_verify:
        type: bool
        required: false
        default: true
        description: Import-check huggingface_hub after present.
