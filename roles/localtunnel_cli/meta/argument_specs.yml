---
argument_specs:
  main:
    short_description: Manage localtunnel on macOS through Homebrew
    options:
      localtunnel_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether the Homebrew localtunnel formula should be installed or removed.
      localtunnel_cli_homebrew_formula:
        type: str
        default: localtunnel
        description:
          - Homebrew formula name that provides the localtunnel CLI (`lt`).
      localtunnel_cli_verify:
        type: bool
        default: true
        description:
          - Verify the requested formula state after convergence.
