---
# stirling_pdf - main task dispatcher

- name: Process stirling_pdf role for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == 'Darwin'

- name: Process stirling_pdf role for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Process stirling_pdf role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == 'Windows'
