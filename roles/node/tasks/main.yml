- name: Install nvm {{ nvm_version }} from upstream script
  ansible.builtin.shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
  args:
    creates: "{{ dotfiles_user_home }}/.nvm/nvm.sh"

