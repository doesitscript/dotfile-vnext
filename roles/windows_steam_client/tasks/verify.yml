---
# Read-only compare of live Steam pointers to inventory. Does not install or
# write config. Intended for: --tags verify
- name: Resolve Steam install path for verify
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $candidates = @(
        'HKLM:\SOFTWARE\WOW6432Node\Valve\Steam',
        'HKLM:\SOFTWARE\Valve\Steam'
      )
      $install = $null
      foreach ($rp in $candidates) {
        if (Test-Path $rp) {
          $p = (Get-ItemProperty $rp).InstallPath
          if ($p -and (Test-Path -LiteralPath $p)) {
            $install = $p
            break
          }
        }
      }
      if (-not $install) {
        $fallback = '{{ windows_steam_client_install_path_default }}'
        if (Test-Path -LiteralPath $fallback) {
          $install = $fallback
        }
      }
      if (-not $install) {
        $Ansible.Failed = $true
        $Ansible.Result = 'Steam install path not found (verify)'
        exit 1
      }
      $Ansible.Changed = $false
      $Ansible.Result = @{ install_path = $install }
  register: windows_steam_client_verify_resolve
  tags: [windows_steam_client, verify, never]

- name: Compare library folder pointers to inventory
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      SteamInstallPath: "{{ windows_steam_client_verify_resolve.result.install_path }}"
      LibraryRoots: "{{ windows_steam_client_library_roots }}"
      WhatIfCompareOnly: true
    script: "{{ lookup('file', role_path ~ '/files/Merge-SteamLibraryFolders.ps1') }}"
  when: windows_steam_client_library_roots | length > 0
  register: windows_steam_client_verify_libraries
  tags: [windows_steam_client, verify, never]

- name: Compare Game Recording pointer to inventory
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      SteamInstallPath: "{{ windows_steam_client_verify_resolve.result.install_path }}"
      RecordingRoot: "{{ windows_steam_client_recording_root }}"
      WhatIfCompareOnly: true
    script: "{{ lookup('file', role_path ~ '/files/Set-SteamBackgroundRecordPath.ps1') }}"
  when: windows_steam_client_recording_root | length > 0
  register: windows_steam_client_verify_recording
  tags: [windows_steam_client, verify, never]

- name: Assert Steam pointers match inventory (verify)
  ansible.builtin.assert:
    that:
      - >-
        windows_steam_client_library_roots | length == 0
        or (windows_steam_client_verify_libraries.result.missing | default([]) | length == 0)
      - >-
        windows_steam_client_recording_root | length == 0
        or (windows_steam_client_verify_recording.result.action | default('match') == 'match')
    fail_msg: >-
      Steam pointer drift vs inventory.
      libraries={{ windows_steam_client_verify_libraries.result | default({}) }}
      recording={{ windows_steam_client_verify_recording.result | default({}) }}
    success_msg: Steam library and recording pointers match inventory.
  tags: [windows_steam_client, verify, never]

- name: Show Steam verify receipt
  ansible.builtin.debug:
    msg:
      install_path: "{{ windows_steam_client_verify_resolve.result.install_path }}"
      libraries: "{{ windows_steam_client_verify_libraries.result | default({}) }}"
      recording: "{{ windows_steam_client_verify_recording.result | default({}) }}"
  tags: [windows_steam_client, verify, never]
