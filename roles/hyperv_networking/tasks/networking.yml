---
# networking.yml — Create External VMSwitch using gocallag.hyperv.switch module.
#
# Uses the hyperv_config API contract (_hyperv resolved by caller).
# Wired into main.yml as Phase 2 (External Virtual Switch creation).
#
# Idempotency: switch_info checks whether the switch already exists.
# If it exists, the entire creation + wait pipeline is skipped.
# If absent, the switch is created async and WinRM reconnection is awaited —
# but only because creation was actually attempted.
#
# Limitation: gocallag.hyperv.switch does not support check mode and does not
# update an existing switch if parameters differ (reports changed: false).

- name: Check if External VMSwitch already exists
  gocallag.hyperv.switch_info:
    name: "{{ _hyperv.switch_name | default('External') }}"
  register: _vmswitch_info
  ignore_errors: true

# adapter_name is a comma-separated fallback list (e.g. "Wi-Fi,Ethernet").
# gocallag.hyperv.switch expects a single adapter name, so resolve the first
# adapter from the list that is currently Up before calling the module.
- name: Resolve first Up adapter from fallback list
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $candidates = '{{ _hyperv.adapter_name | default("Ethernet") }}'.Split(',') | ForEach-Object { $_.Trim() }
      $resolved = $null
      foreach ($name in $candidates) {
        $adapter = Get-NetAdapter -Name $name -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' }
        if ($adapter) {
          $resolved = $name
          break
        }
      }
      if (-not $resolved) {
        $Ansible.Failed = $true
        $Ansible.Result = "No Up adapter found in list: {{ _hyperv.adapter_name }}"
        Exit 1
      }
      $Ansible.Result = $resolved
  register: _resolved_adapter
  when: _vmswitch_info is failed

- name: Create External VMSwitch via gocallag.hyperv.switch
  gocallag.hyperv.switch:
    name: "{{ _hyperv.switch_name | default('External') }}"
    state: present
    switchType: External
    netAdapterName: "{{ _resolved_adapter.result }}"
    allowManagementOS: "{{ _hyperv.allow_management_os | default(true) | string | lower }}"
  async: 120
  poll: 0
  register: _vmswitch_job
  when: _vmswitch_info is failed

# Only wait when creation was actually attempted. _vmswitch_job.ansible_job_id
# is only defined when the creation task ran (i.e. switch was absent).
# Per ansible-content-best-practices: wait for specific conditions, not unconditionally.
- name: Wait for WinRM to reconnect after VMSwitch creation
  ansible.builtin.wait_for_connection:
    delay: 15
    timeout: 120
  when: _vmswitch_job.ansible_job_id is defined

- name: Collect VMSwitch creation result
  ansible.builtin.async_status:
    jid: "{{ _vmswitch_job.ansible_job_id }}"
  register: _vmswitch_create
  until: _vmswitch_create.finished
  retries: 10
  delay: 10
  when: _vmswitch_job.ansible_job_id is defined

- name: Verify External VMSwitch is operational
  gocallag.hyperv.switch_info:
    name: "{{ _hyperv.switch_name | default('External') }}"
  register: _vmswitch_verify
  when: _vmswitch_create is defined and _vmswitch_create is changed
