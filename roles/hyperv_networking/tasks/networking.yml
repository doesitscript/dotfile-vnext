---
# networking.yml — Create or verify an External Hyper-V VMSwitch explicitly.
#
# We avoid relying only on the old module probe path because a host can have
# Windows bridge artifacts without having a real Hyper-V VMSwitch. For this
# project, the actual source of truth is `Get-VMSwitch`.

- name: Probe External VMSwitch state and resolve external adapter selection
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $switchName = {{ (_hyperv.switch_name | default("External")) | to_json }}
      $selectorName = {{ (_hyperv.adapter_name | default("")) | to_json }}
      $selectorNameContains = {{ (_hyperv.adapter_name_contains | default("")) | to_json }}
      $selectorInterfaceDescription = {{ (_hyperv.adapter_interface_description | default("")) | to_json }}
      $selectorMac = {{ (_hyperv.adapter_mac_address | default("")) | to_json }}

      function Normalize-Mac([string]$value) {
        if (-not $value) {
          return ""
        }

        return (($value -replace '[-:\.]', '')).ToUpperInvariant()
      }

      $adapters = @(
        Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue |
          ForEach-Object {
            [PSCustomObject]@{
              name = $_.Name
              interface_description = $_.InterfaceDescription
              status = if ($_.Status) { $_.Status.ToString() } else { $null }
              mac_address = if ($_.MacAddress) { $_.MacAddress.ToUpperInvariant() } else { $null }
              hardware_interface = [bool]$_.HardwareInterface
            }
          }
      )

      $candidatePool = @($adapters | Where-Object { $_.hardware_interface -eq $true })
      if ($candidatePool.Count -eq 0) {
        $candidatePool = @($adapters | Where-Object { $_.interface_description })
      }

      $hasSelectors = [bool](
        $selectorMac -or
        $selectorInterfaceDescription -or
        $selectorName -or
        $selectorNameContains
      )

      $intendedSelection = $null
      $intendedResolutionStatus = "selector_missing"
      $intendedResolutionReason = "No external switch is present and no adapter selector is configured."
      $intendedMatchedCandidates = @()

      if ($hasSelectors) {
        $attempts = New-Object System.Collections.Generic.List[object]
        if ($selectorMac) {
          $matches = @($candidatePool | Where-Object { (Normalize-Mac $_.mac_address) -eq (Normalize-Mac $selectorMac) })
          $attempts.Add([PSCustomObject]@{ basis = "adapter_mac_address"; value = $selectorMac; matches = $matches })
        }
        if ($selectorInterfaceDescription) {
          $matches = @($candidatePool | Where-Object { $_.interface_description -eq $selectorInterfaceDescription })
          $attempts.Add([PSCustomObject]@{ basis = "adapter_interface_description"; value = $selectorInterfaceDescription; matches = $matches })
        }
        if ($selectorName) {
          $matches = @($candidatePool | Where-Object { $_.name -eq $selectorName })
          $attempts.Add([PSCustomObject]@{ basis = "adapter_name"; value = $selectorName; matches = $matches })
        }
        if ($selectorNameContains) {
          $matches = @($candidatePool | Where-Object { $_.name -like "*$selectorNameContains*" })
          $attempts.Add([PSCustomObject]@{ basis = "adapter_name_contains"; value = $selectorNameContains; matches = $matches })
        }

        foreach ($attempt in $attempts) {
          if ($attempt.matches.Count -eq 1) {
            $intendedSelection = $attempt.matches[0]
            $intendedResolutionStatus = "selected"
            $intendedResolutionReason = "Selected one adapter using $($attempt.basis)."
            $intendedMatchedCandidates = @($attempt.matches)
            break
          }

          if ($attempt.matches.Count -gt 1) {
            $intendedResolutionStatus = "ambiguous"
            $intendedResolutionReason = "Selector $($attempt.basis) matched more than one adapter."
            $intendedMatchedCandidates = @($attempt.matches)
            break
          }
        }

        if (-not $intendedSelection -and $intendedResolutionStatus -eq "selector_missing" -and $attempts.Count -gt 0) {
          $intendedResolutionStatus = "not_found"
          $intendedResolutionReason = "No configured adapter selector matched a unique candidate."
        }
      }

      $switch = Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue
      $rebindRequired = $false
      if ($switch -and $hasSelectors -and $intendedSelection) {
        $rebindRequired = $switch.NetAdapterInterfaceDescription -ne $intendedSelection.interface_description
      }

      if ($switch -and -not $rebindRequired) {
        $selected = @(
          $candidatePool |
            Where-Object { $_.interface_description -eq $switch.NetAdapterInterfaceDescription } |
            Select-Object -First 1
        )

        $Ansible.Result = @{
          switch = @{
            exists = $true
            name = $switch.Name
            switch_type = $switch.SwitchType.ToString()
            adapter_interface_description = $switch.NetAdapterInterfaceDescription
          }
          selectors = @{
            adapter_name = $selectorName
            adapter_name_contains = $selectorNameContains
            adapter_interface_description = $selectorInterfaceDescription
            adapter_mac_address = $selectorMac
          }
          resolution_status = "existing_switch"
          resolution_reason = "External switch already exists; current binding is the authoritative source."
          selected = if ($selected) {
            @{
              name = $selected.name
              interface_description = $selected.interface_description
              status = $selected.status
              mac_address = $selected.mac_address
              match_basis = "existing_switch_binding"
            }
          } else {
            @{
              name = $null
              interface_description = $switch.NetAdapterInterfaceDescription
              status = $null
              mac_address = $null
              match_basis = "existing_switch_binding"
            }
          }
          candidate_pool = @($candidatePool)
          rebind_required = $false
        }
        Exit 0
      }

      if ($switch -and $rebindRequired) {
        $Ansible.Result = @{
          switch = @{
            exists = $true
            name = $switch.Name
            switch_type = $switch.SwitchType.ToString()
            adapter_interface_description = $switch.NetAdapterInterfaceDescription
          }
          selectors = @{
            adapter_name = $selectorName
            adapter_name_contains = $selectorNameContains
            adapter_interface_description = $selectorInterfaceDescription
            adapter_mac_address = $selectorMac
          }
          resolution_status = $intendedResolutionStatus
          resolution_reason = "External switch binding drifted from inventory; rebind required."
          selected = @{
            name = $intendedSelection.name
            interface_description = $intendedSelection.interface_description
            status = $intendedSelection.status
            mac_address = $intendedSelection.mac_address
            match_basis = ($attempts | Where-Object { $_.matches.Count -eq 1 -and $_.matches[0].name -eq $intendedSelection.name } | Select-Object -First 1).basis
          }
          matched_candidates = @($intendedMatchedCandidates)
          candidate_pool = @($candidatePool)
          rebind_required = $true
        }
        Exit 0
      }

      $selection = $intendedSelection
      $resolutionStatus = $intendedResolutionStatus
      $resolutionReason = $intendedResolutionReason
      $matchedCandidates = @($intendedMatchedCandidates)

      if (-not $switch) {
        $Ansible.Result = @{
          switch = @{
            exists = $false
            name = $switchName
            switch_type = $null
            adapter_interface_description = $null
          }
          selectors = @{
            adapter_name = $selectorName
            adapter_name_contains = $selectorNameContains
            adapter_interface_description = $selectorInterfaceDescription
            adapter_mac_address = $selectorMac
          }
          resolution_status = $resolutionStatus
          resolution_reason = $resolutionReason
          selected = if ($selection) {
            @{
              name = $selection.name
              interface_description = $selection.interface_description
              status = $selection.status
              mac_address = $selection.mac_address
              match_basis = ($attempts | Where-Object { $_.matches.Count -eq 1 -and $_.matches[0].name -eq $selection.name } | Select-Object -First 1).basis
            }
          } else {
            $null
          }
          matched_candidates = @($matchedCandidates)
          candidate_pool = @($candidatePool)
          rebind_required = $false
        }
      }
  register: _hyperv_external_adapter_resolution
  changed_when: false
  check_mode: false

- name: Preview Hyper-V external adapter resolution
  ansible.builtin.debug:
    var: _hyperv_external_adapter_resolution.result
  when:
    - ansible_check_mode | bool or
      (ansible_troubleshooting_mode | default(false) | bool) or
      (debug_remote_output | default(false) | bool) or
      (debug_collect_component_evidence | default(false) | bool)
  tags:
    - preview
    - evidence
    - debug_resources

- name: Require unique external adapter selection before create or rebind path
  ansible.builtin.assert:
    that:
      - _hyperv_external_adapter_resolution.result.resolution_status == 'selected'
      - (_hyperv_external_adapter_resolution.result.selected.name | default('')) | length > 0
    fail_msg: >-
      Hyper-V external adapter selection failed for switch
      '{{ _hyperv.switch_name | default("External") }}':
      {{ _hyperv_external_adapter_resolution.result.resolution_reason | default('unknown reason') }}
  when: >-
    not (_hyperv_external_adapter_resolution.result.switch.exists | default(false))
    or (_hyperv_external_adapter_resolution.result.rebind_required | default(false))

- name: Remove External VMSwitch when inventory adapter binding drifted
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $switchName = {{ (_hyperv.switch_name | default("External")) | to_json }}
      $existing = Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue
      if (-not $existing) {
        $Ansible.Result = "External switch already absent before rebind."
        Exit 0
      }
      Remove-VMSwitch -Name $switchName -Force -ErrorAction Stop
      $Ansible.Changed = $true
      $Ansible.Result = "Removed External switch '$switchName' for inventory adapter rebind."
  register: _vmswitch_remove_for_rebind
  when: _hyperv_external_adapter_resolution.result.rebind_required | default(false)
  vars:
    ansible_winrm_connection_timeout: "{{ hyperv_networking_switch_create_winrm_timeout }}"

- name: Wait for WinRM to reconnect after External VMSwitch removal
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    delay: 15
    sleep: 5
    timeout: "{{ hyperv_networking_reconnect_timeout }}"
  when: _vmswitch_remove_for_rebind is changed

- name: Create External VMSwitch with PowerShell when absent or after rebind
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = New-VMSwitch `
        -Name '{{ _hyperv.switch_name | default("External") }}' `
        -NetAdapterName '{{ _hyperv_external_adapter_resolution.result.selected.name }}' `
        -AllowManagementOS:{{ (_hyperv.allow_management_os | default(true) | bool) | ternary('$true', '$false') }} `
        2>&1 | Out-String
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = $result.Trim()
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Changed = $true
      $Ansible.Result = $result.Trim()
  register: _vmswitch_create
  when: >-
    not (_hyperv_external_adapter_resolution.result.switch.exists | default(false))
    or (_hyperv_external_adapter_resolution.result.rebind_required | default(false))
  vars:
    ansible_winrm_connection_timeout: "{{ hyperv_networking_switch_create_winrm_timeout }}"

- name: Wait for WinRM to reconnect after VMSwitch creation
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    delay: 15
    sleep: 5
    timeout: "{{ hyperv_networking_reconnect_timeout }}"
  when: _vmswitch_create is changed

- name: Re-probe External VMSwitch state after create or rebind path
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $switch = Get-VMSwitch -Name '{{ _hyperv.switch_name | default("External") }}' -ErrorAction Stop
      $Ansible.Result = @{
        exists = $true
        name = $switch.Name
        switch_type = $switch.SwitchType.ToString()
        adapter_interface_description = $switch.NetAdapterInterfaceDescription
      }
  register: _vmswitch_verify
  changed_when: false
  check_mode: false

- name: Require External VMSwitch to exist after Hyper-V networking
  ansible.builtin.assert:
    that:
      - _vmswitch_verify.result.exists | default(false)
      - (_vmswitch_verify.result.switch_type | default('')) == 'External'
    fail_msg: >-
      Hyper-V external switch '{{ _hyperv.switch_name | default('External') }}'
      is not present after hyperv_networking.
