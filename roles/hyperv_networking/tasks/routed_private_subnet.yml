---
# routed_private_subnet.yml — Keep the Internal guest network as a private
# subnet and make the Windows host the explicit forwarding point between the
# LAN and that guest subnet.

- name: Persist Windows IP router posture for routed guest subnet mode
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    name: IpEnableRouter
    data: 1
    type: dword

- name: Ensure Windows Routing role service is installed for routed guest subnet mode
  ansible.windows.win_feature:
    name: Routing
    include_management_tools: true
    state: present
  when: _hyperv.guest_remote_access_routing_enabled | default(false) | bool

- name: Ensure Remote Access is configured for routing-only mode
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      Import-Module RemoteAccess -ErrorAction Stop

      $current = Get-RemoteAccess -ErrorAction Stop
      if ($current.RoutingStatus -ne 'Installed') {
        Install-RemoteAccess -VpnType RoutingOnly -PassThru -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
        $current = Get-RemoteAccess -ErrorAction Stop
      }

      $Ansible.Result = @{
        routing_status = $current.RoutingStatus
      }
  register: _hyperv_routed_remote_access_role
  when: _hyperv.guest_remote_access_routing_enabled | default(false) | bool

- name: Ensure RemoteAccess service is running for routed guest subnet mode
  ansible.windows.win_service:
    name: RemoteAccess
    start_mode: manual
    state: started
  when: _hyperv.guest_remote_access_routing_enabled | default(false) | bool

- name: Ensure guest gateway IP and IPv4 forwarding are enabled for routed guest subnet mode
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $publicAlias = '{{ _hyperv_routed_public_adapter_alias }}'
      $privateAlias = '{{ _hyperv_routed_private_adapter_alias }}'
      $gatewayIp = '{{ _hyperv_routed_guest_gateway_ip }}'
      $prefixLength = {{ _hyperv_routed_guest_prefix_length }}

      $privateAddress = Get-NetIPAddress -InterfaceAlias $privateAlias -AddressFamily IPv4 -ErrorAction SilentlyContinue |
        Where-Object { $_.IPAddress -eq $gatewayIp } |
        Select-Object -First 1

      if (-not $privateAddress) {
        New-NetIPAddress `
          -InterfaceAlias $privateAlias `
          -IPAddress $gatewayIp `
          -PrefixLength $prefixLength `
          -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
      }

      $results = @()
      foreach ($alias in @($publicAlias, $privateAlias)) {
        $iface = Get-NetIPInterface -InterfaceAlias $alias -AddressFamily IPv4 -ErrorAction Stop | Select-Object -First 1
        if (
          $iface.Forwarding -ne 'Enabled' -or
          $iface.WeakHostReceive -ne 'Enabled' -or
          $iface.WeakHostSend -ne 'Enabled'
        ) {
          Set-NetIPInterface `
            -InterfaceAlias $alias `
            -AddressFamily IPv4 `
            -Forwarding Enabled `
            -WeakHostReceive Enabled `
            -WeakHostSend Enabled `
            -ErrorAction Stop
          $Ansible.Changed = $true
          $iface = Get-NetIPInterface -InterfaceAlias $alias -AddressFamily IPv4 -ErrorAction Stop | Select-Object -First 1
        }

        $results += [PSCustomObject]@{
          InterfaceAlias  = $iface.InterfaceAlias
          InterfaceIndex  = $iface.InterfaceIndex
          Forwarding      = $iface.Forwarding.ToString()
          WeakHostReceive = $iface.WeakHostReceive.ToString()
          WeakHostSend    = $iface.WeakHostSend.ToString()
          InterfaceMetric = $iface.InterfaceMetric
        }
      }

      $gatewayState = Get-NetIPAddress -InterfaceAlias $privateAlias -AddressFamily IPv4 -ErrorAction Stop |
        Where-Object { $_.IPAddress -eq $gatewayIp } |
        Select-Object -First 1

      $Ansible.Result = @{
        public_interface = $publicAlias
        private_interface = $privateAlias
        guest_gateway_ipv4 = if ($gatewayState) { $gatewayState.IPAddress } else { $null }
        guest_gateway_prefix_length = if ($gatewayState) { $gatewayState.PrefixLength } else { $null }
        forwarding = $results
      }
  register: _hyperv_routed_private_subnet
  vars:
    _hyperv_routed_public_adapter_alias: >-
      {{
        _hyperv.internal_ics_public_adapter_name
        | default(_hyperv.adapter_name | default('Wi-Fi'))
      }}
    _hyperv_routed_private_adapter_alias: >-
      {{
        _hyperv.internal_ics_private_adapter_alias
        | default('vEthernet (' ~ (_hyperv.guest_switch_name | default(_hyperv.internal_ics_switch_name | default('Guest'))) ~ ')')
      }}
    _hyperv_routed_guest_gateway_ip: "{{ (_hyperv.guest_gateway_ipv4 | default('192.168.137.1')).split('/')[0] }}"
    _hyperv_routed_guest_prefix_length: "{{ (_hyperv.guest_subnet_ipv4 | default('192.168.137.0/24')).split('/')[1] }}"

- name: Report routed guest-subnet forwarding status when troubleshooting
  ansible.builtin.debug:
    var: _hyperv_routed_private_subnet.result
  when:
    - (ansible_troubleshooting_mode | default(false) | bool) or
      (debug_remote_output | default(false) | bool) or
      (debug_collect_component_evidence | default(false) | bool)
  tags:
    - evidence
    - debug_resources

- name: Ensure host-side outbound NAT exists for routed guest subnet mode
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $natName = '{{ _hyperv_routed_nat_name }}'
      $prefix = '{{ _hyperv_routed_guest_subnet_prefix }}'

      $existing = Get-NetNat -Name $natName -ErrorAction SilentlyContinue | Select-Object -First 1

      if (-not $existing) {
        New-NetNat -Name $natName -InternalIPInterfaceAddressPrefix $prefix -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
      }
      elseif ($existing.InternalIPInterfaceAddressPrefix -ne $prefix) {
        Remove-NetNat -Name $natName -Confirm:$false -ErrorAction Stop
        New-NetNat -Name $natName -InternalIPInterfaceAddressPrefix $prefix -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
      }

      $natState = Get-NetNat -Name $natName -ErrorAction Stop | Select-Object -First 1

      $Ansible.Result = @{
        nat_name = $natState.Name
        guest_subnet_ipv4 = $natState.InternalIPInterfaceAddressPrefix
        active_sessions = $natState.ActiveSessionCount
      }
  register: _hyperv_routed_private_subnet_nat
  when: _hyperv.guest_outbound_nat_enabled | default(false) | bool
  vars:
    _hyperv_routed_nat_name: "{{ _hyperv.guest_outbound_nat_name | default('HyperVGuestNat') }}"
    _hyperv_routed_guest_subnet_prefix: "{{ _hyperv.guest_subnet_ipv4 | default('192.168.137.0/24') }}"

- name: Ensure host-side outbound NAT is absent when direct routed guest access is desired
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $natName = '{{ _hyperv_routed_nat_name }}'
      $existing = Get-NetNat -Name $natName -ErrorAction SilentlyContinue | Select-Object -First 1

      if ($existing) {
        Remove-NetNat -Name $natName -Confirm:$false -ErrorAction Stop
        $Ansible.Changed = $true
      }

      $Ansible.Result = @{
        nat_name = $natName
        present = [bool](Get-NetNat -Name $natName -ErrorAction SilentlyContinue | Select-Object -First 1)
      }
  register: _hyperv_routed_private_subnet_nat_absent
  when: not (_hyperv.guest_outbound_nat_enabled | default(false) | bool)
  vars:
    _hyperv_routed_nat_name: "{{ _hyperv.guest_outbound_nat_name | default('HyperVGuestNat') }}"

- name: Report routed guest-subnet NAT status when troubleshooting
  ansible.builtin.debug:
    msg:
      nat_enabled: "{{ _hyperv.guest_outbound_nat_enabled | default(false) | bool }}"
      nat_state: >-
        {{
          (_hyperv_routed_private_subnet_nat.result | default({}))
          if (_hyperv.guest_outbound_nat_enabled | default(false) | bool)
          else (_hyperv_routed_private_subnet_nat_absent.result | default({}))
        }}
  when:
    - (ansible_troubleshooting_mode | default(false) | bool) or
      (debug_remote_output | default(false) | bool) or
      (debug_collect_component_evidence | default(false) | bool)
  tags:
    - evidence
    - debug_resources

- name: Probe live publish surface before guest published TCP convergence
  ansible.builtin.include_tasks: published_port_surface_probe.yml
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'

- name: Attempt Hyper-V management IPv4 recovery when published listen addresses are missing
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $scriptPath = 'C:\ProgramData\Ansible\hyperv_networking\scripts\management_os_boot_recovery.ps1'
      if (-not (Test-Path $scriptPath)) {
        throw "Hyper-V management OS recovery script missing at $scriptPath"
      }

      $output = & $scriptPath `
        -ExpectedIPv4 '{{ host_ip }}' `
        -TaskName HyperVManagementOsBootRecovery `
        -TaskPath '\Ansible\HyperV\' 2>&1 | Out-String

      $Ansible.Changed = $true
      $Ansible.Result = @{
        expected_host_ip = '{{ host_ip }}'
        output = $output.Trim()
      }
  register: _hyperv_management_ip_recovery
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'
    - (host_ip | default('')) | length > 0
    - hyperv_networking_management_ip_recovery_enabled | bool
    - (_hyperv_published_port_surface.result.missing_listen_addresses | default([])) | length > 0

- name: Re-probe live publish surface after management IPv4 recovery
  ansible.builtin.include_tasks: published_port_surface_probe.yml
  when:
    - _hyperv_management_ip_recovery is changed

- name: Ensure expected management IPv4 exists on the public interface
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $publicAlias = '{{ _hyperv_routed_public_adapter_alias }}'
      $expectedIp = '{{ host_ip }}'
      $Ansible.Changed = $false

      $current = Get-NetIPAddress -InterfaceAlias $publicAlias -AddressFamily IPv4 -ErrorAction SilentlyContinue |
        Where-Object { $_.IPAddress -eq $expectedIp } |
        Select-Object -First 1

      if (-not $current) {
        $existingPublic = Get-NetIPAddress -InterfaceAlias $publicAlias -AddressFamily IPv4 -ErrorAction SilentlyContinue |
          Where-Object {
            $_.IPAddress -notlike '169.254.*' -and
            $_.IPAddress -ne '127.0.0.1'
          } |
          Select-Object -First 1

        $prefixLength = if ($existingPublic) { $existingPublic.PrefixLength } else { 24 }

        New-NetIPAddress `
          -InterfaceAlias $publicAlias `
          -IPAddress $expectedIp `
          -PrefixLength $prefixLength `
          -Type Unicast `
          -ErrorAction Stop | Out-Null

        $Ansible.Changed = $true
      }

      $final = Get-NetIPAddress -InterfaceAlias $publicAlias -AddressFamily IPv4 -ErrorAction SilentlyContinue |
        Select-Object InterfaceAlias,IPAddress,PrefixLength

      $Ansible.Result = @{
        public_interface = $publicAlias
        expected_host_ip = $expectedIp
        live_public_interface_ipv4 = @($final | ForEach-Object { $_.IPAddress })
      }
  register: _hyperv_management_ip_alias
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'
    - (host_ip | default('')) | length > 0
    - (_hyperv_published_port_surface.result.missing_listen_addresses | default([])) | length > 0
  vars:
    _hyperv_routed_public_adapter_alias: >-
      {{
        _hyperv.internal_ics_public_adapter_name
        | default(_hyperv.adapter_name | default('Wi-Fi'))
      }}

- name: Ensure modeled public IPv4 gateway and DNS exist on the public interface
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $publicAlias = '{{ _hyperv_routed_public_adapter_alias }}'
      $publicGateway = '{{ _hyperv_routed_public_gateway_ipv4 }}'
      $desiredDns = @'
      {{ _hyperv_routed_public_dns_servers_ipv4 | to_json }}
      '@ | ConvertFrom-Json

      $defaultRoute = Get-NetRoute `
        -InterfaceAlias $publicAlias `
        -DestinationPrefix '0.0.0.0/0' `
        -AddressFamily IPv4 `
        -ErrorAction SilentlyContinue |
        Sort-Object RouteMetric |
        Select-Object -First 1

      if ($null -eq $defaultRoute) {
        New-NetRoute `
          -InterfaceAlias $publicAlias `
          -DestinationPrefix '0.0.0.0/0' `
          -NextHop $publicGateway `
          -AddressFamily IPv4 `
          -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
      }
      elseif ($defaultRoute.NextHop -ne $publicGateway) {
        Get-NetRoute `
          -InterfaceAlias $publicAlias `
          -DestinationPrefix '0.0.0.0/0' `
          -AddressFamily IPv4 `
          -ErrorAction SilentlyContinue |
          Remove-NetRoute `
            -Confirm:$false `
            -ErrorAction Stop

        New-NetRoute `
          -InterfaceAlias $publicAlias `
          -DestinationPrefix '0.0.0.0/0' `
          -NextHop $publicGateway `
          -AddressFamily IPv4 `
          -ErrorAction Stop | Out-Null
        $Ansible.Changed = $true
      }

      $currentDns = @(
        Get-DnsClientServerAddress `
          -InterfaceAlias $publicAlias `
          -AddressFamily IPv4 `
          -ErrorAction SilentlyContinue |
        ForEach-Object { $_.ServerAddresses } |
        Where-Object { $_ }
      )

      if (($currentDns | ConvertTo-Json -Compress) -ne ($desiredDns | ConvertTo-Json -Compress)) {
        Set-DnsClientServerAddress `
          -InterfaceAlias $publicAlias `
          -ServerAddresses $desiredDns `
          -ErrorAction Stop
        $Ansible.Changed = $true
        $currentDns = @(
          Get-DnsClientServerAddress `
            -InterfaceAlias $publicAlias `
            -AddressFamily IPv4 `
            -ErrorAction Stop |
          ForEach-Object { $_.ServerAddresses } |
          Where-Object { $_ }
        )
      }

      $finalRoute = Get-NetRoute `
        -InterfaceAlias $publicAlias `
        -DestinationPrefix '0.0.0.0/0' `
        -AddressFamily IPv4 `
        -ErrorAction SilentlyContinue |
        Sort-Object RouteMetric |
        Select-Object -First 1

      $Ansible.Result = @{
        public_interface = $publicAlias
        gateway = if ($finalRoute) { $finalRoute.NextHop } else { $null }
        dns_servers_ipv4 = @($currentDns)
      }
  register: _hyperv_public_gateway_dns_state
  ignore_unreachable: true
  when:
    - (_hyperv.public_gateway_ipv4 | default('')) | length > 0
    - (_hyperv.public_dns_servers_ipv4 | default([])) | length > 0
  vars:
    _hyperv_routed_public_adapter_alias: >-
      {{
        _hyperv.internal_ics_public_adapter_name
        | default(_hyperv.adapter_name | default('Wi-Fi'))
      }}
    _hyperv_routed_public_gateway_ipv4: "{{ _hyperv.public_gateway_ipv4 }}"
    _hyperv_routed_public_dns_servers_ipv4: "{{ _hyperv.public_dns_servers_ipv4 }}"

- name: Clear transient host errors after public IPv4 gateway or DNS convergence
  ansible.builtin.meta: clear_host_errors
  when: _hyperv_public_gateway_dns_state.unreachable | default(false)

- name: Wait for host reconnect after public IPv4 gateway or DNS convergence
  ansible.builtin.wait_for_connection:
    timeout: 120
    sleep: 5
  when: _hyperv_public_gateway_dns_state.unreachable | default(false)

- name: Re-probe live publish surface after management IPv4 alias convergence
  ansible.builtin.include_tasks: published_port_surface_probe.yml
  when:
    - _hyperv_management_ip_alias is changed

- name: Require guest published listen addresses to exist on the Windows host
  ansible.builtin.assert:
    that:
      - (_hyperv_published_port_surface.result.missing_listen_addresses | default([])) | length == 0
    fail_msg: >-
      Missing guest published listen addresses on {{ inventory_hostname }} before
      portproxy convergence: {{
        _hyperv_published_port_surface.result.missing_listen_addresses | default([])
      }}. Live IPv4 addresses: {{
        _hyperv_published_port_surface.result.live_all_ipv4 | default([])
      }}.
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'

- name: Ensure IP Helper service is enabled for guest published TCP ports
  ansible.windows.win_service:
    name: iphlpsvc
    start_mode: auto
    state: started
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0

- name: Ensure guest published TCP ports are present on the Windows host
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $desired = @'
      {{ _hyperv_guest_published_tcp_ports | to_json }}
      '@ | ConvertFrom-Json

      $raw = netsh interface portproxy show v4tov4
      $existing = @{}
      foreach ($line in $raw) {
        if ($line -match '^\s*(\d+\.\d+\.\d+\.\d+)\s+(\d+)\s+(\d+\.\d+\.\d+\.\d+)\s+(\d+)\s*$') {
          $key = "$($matches[1]):$($matches[2])"
          $existing[$key] = @{
            listen_address = $matches[1]
            listen_port = [int]$matches[2]
            connect_address = $matches[3]
            connect_port = [int]$matches[4]
          }
        }
      }

      foreach ($entry in $desired) {
        $key = "$($entry.listen_address):$($entry.listen_port)"
        $current = $existing[$key]
        $needsReset = $false

        if ($null -eq $current) {
          $needsReset = $true
        }
        elseif (
          $current.connect_address -ne $entry.connect_address -or
          $current.connect_port -ne [int]$entry.connect_port
        ) {
          netsh interface portproxy delete v4tov4 listenaddress=$($entry.listen_address) listenport=$($entry.listen_port) | Out-Null
          $needsReset = $true
          $Ansible.Changed = $true
        }
        else {
          $listener = Get-NetTCPConnection `
            -LocalAddress $entry.listen_address `
            -LocalPort ([int]$entry.listen_port) `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $listener) {
            netsh interface portproxy delete v4tov4 listenaddress=$($entry.listen_address) listenport=$($entry.listen_port) | Out-Null
            $needsReset = $true
            $Ansible.Changed = $true
          }
        }

        if ($needsReset) {
          netsh interface portproxy add v4tov4 `
            listenaddress=$($entry.listen_address) `
            listenport=$($entry.listen_port) `
            connectaddress=$($entry.connect_address) `
            connectport=$($entry.connect_port) | Out-Null
          $Ansible.Changed = $true
        }
      }

      $final = @()
      foreach ($entry in $desired) {
        $final += [PSCustomObject]@{
          name = $entry.name
          listen_address = $entry.listen_address
          listen_port = [int]$entry.listen_port
          connect_address = $entry.connect_address
          connect_port = [int]$entry.connect_port
        }
      }

      $Ansible.Result = @{
        state = 'present'
        ports = $final
      }
  register: _hyperv_routed_private_subnet_published_ports
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'
  vars:
    _hyperv_guest_published_tcp_ports: "{{ _hyperv.guest_published_tcp_ports | default([]) }}"

- name: Restart IP Helper when guest published TCP ports change
  ansible.windows.win_service:
    name: iphlpsvc
    state: restarted
  when:
    - _hyperv_routed_private_subnet_published_ports is changed

- name: Ensure guest published TCP ports are absent on the Windows host
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $desired = @'
      {{ _hyperv_guest_published_tcp_ports | to_json }}
      '@ | ConvertFrom-Json

      foreach ($entry in $desired) {
        $raw = netsh interface portproxy show v4tov4
        $match = $false
        foreach ($line in $raw) {
          if ($line -match '^\s*(\d+\.\d+\.\d+\.\d+)\s+(\d+)\s+(\d+\.\d+\.\d+\.\d+)\s+(\d+)\s*$') {
            if (
              $matches[1] -eq $entry.listen_address -and
              [int]$matches[2] -eq [int]$entry.listen_port
            ) {
              $match = $true
            }
          }
        }

        if ($match) {
          netsh interface portproxy delete v4tov4 listenaddress=$($entry.listen_address) listenport=$($entry.listen_port) | Out-Null
          $Ansible.Changed = $true
        }
      }

      $Ansible.Result = @{
        state = 'absent'
        ports = $desired
      }
  register: _hyperv_routed_private_subnet_published_ports_absent
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'absent'
  vars:
    _hyperv_guest_published_tcp_ports: "{{ _hyperv.guest_published_tcp_ports | default([]) }}"

- name: Ensure Windows firewall rules exist for guest published TCP ports
  community.windows.win_firewall_rule:
    name: "Hyper-V Guest Published TCP {{ item.name | default(item.listen_port) }}"
    localport: "{{ item.listen_port }}"
    action: allow
    direction: in
    enabled: true
    protocol: tcp
    state: present
  loop: "{{ _hyperv.guest_published_tcp_ports | default([]) }}"
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'

- name: Report guest published TCP ports when troubleshooting
  ansible.builtin.debug:
    var: _hyperv_routed_private_subnet_published_ports.result
  when:
    - (_hyperv.guest_published_tcp_ports | default([])) | length > 0
    - (_hyperv.guest_published_tcp_ports_state | default('present')) == 'present'
    - (ansible_troubleshooting_mode | default(false) | bool) or
      (debug_remote_output | default(false) | bool) or
      (debug_collect_component_evidence | default(false) | bool)
  tags:
    - evidence
    - debug_resources
