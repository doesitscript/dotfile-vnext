---
# hyperv_feature.yml -- Enable Hyper-V and management tools.
# Shared task file included by hyperv_networking and windows_base.

- name: Enable Hyper-V feature
  ansible.windows.win_optional_feature:
    name:
      - Microsoft-Hyper-V
      - Microsoft-Hyper-V-Management-PowerShell
    state: present
    include_parent: true
  register: _hyperv_feature

- name: Enable Hyper-V Windows Feature
  ansible.windows.win_feature:
    name:
      - Hyper-V-Tools
      - NetworkVirtualization
    state: present

- name: Reboot after Hyper-V feature installation
  ansible.windows.win_reboot:
    msg: "Ansible reboot after Hyper-V feature install"
    reboot_timeout: 600
  when: _hyperv_feature.reboot_required | default(false)

- name: Wait for system after Hyper-V reboot
  ansible.builtin.wait_for_connection:
    timeout: 600
  when: _hyperv_feature.reboot_required | default(false)
