---
# hyperv_networking — Enable Hyper-V and create an External Virtual Switch.
#
# Pure infrastructure role. No guest (WSL, VM) awareness.
# Consumers (WSL bridged networking, dev VMs, etc.) use the switch independently.
#
# API contract: receives a single 'hyperv_config' dictionary.
# See defaults/main.yml for the full schema and defaults.
#
# Standalone:
#   ansible-playbook playbooks/hyperv_networking.yaml -i inventory/inventory.yaml --limit server-225-win
# Also invoked via include_role from playbooks/windows_base.yml (windows_base role).
# Runs when hyperv_config.external_switch_enabled == true in host_vars.
#
# WARNING: Changing a Virtual Switch to External can briefly disconnect the network.

# --- Resolve API contract ---
- name: Resolve hyperv_config contract
  ansible.builtin.set_fact:
    _hyperv: "{{ hyperv_config | default({}) }}"

- name: Determine whether Hyper-V networking changes are requested
  ansible.builtin.set_fact:
    _hyperv_networking_requested: >-
      {{
        (_hyperv.external_switch_enabled | default(false) | bool)
        or
        (_hyperv.internal_ics_switch_enabled | default(false) | bool)
      }}

# --- Phase 0: Seed one-time boot recovery before risky network changes ---
- name: Prepare Hyper-V management OS boot recovery
  ansible.builtin.include_tasks: management_os_boot_recovery_prepare.yml
  when:
    - _hyperv_networking_requested | bool
    - hyperv_feature_state == 'present'
    - (_hyperv.allow_management_os | default(true) | bool)
    - (_hyperv.management_os_boot_recovery_state | default('absent')) == 'present'

- name: Manage Hyper-V networking lifecycle
  block:
    # --- Phase 1: Enable Hyper-V features ---
    - name: Enable Hyper-V features
      ansible.builtin.include_tasks: hyperv_feature.yml
      when:
        - _hyperv_networking_requested | bool

    # --- Phase 2: Create or verify the External Virtual Switch ---
    - name: Create External Virtual Switch
      ansible.builtin.include_tasks: networking.yml
      when:
        - hyperv_feature_state == 'present'
        - (_hyperv.external_switch_enabled | default(false) | bool)

    # --- Phase 3: Create or verify the Internal VMSwitch and ICS pair ---
    - name: Create Internal Hyper-V guest switch and ICS sharing pair
      ansible.builtin.include_tasks: internal_ics.yml
      when:
        - hyperv_feature_state == 'present'
        - (_hyperv.internal_ics_switch_enabled | default(false) | bool)
  always:
    - name: Remove Hyper-V management OS boot recovery helper after reconnect
      ansible.builtin.include_tasks: management_os_boot_recovery_cleanup.yml
      when:
        - _hyperv_networking_requested | bool
        - hyperv_feature_state == 'present'
        - (_hyperv.allow_management_os | default(true) | bool)
        - (_hyperv.management_os_boot_recovery_state | default('absent')) == 'present'
