---
argument_specs:
  main:
    short_description: Hyper-V host networking and management OS IPv4
    description: >-
      Enables Hyper-V features, manages External/Internal Hyper-V switches, guest
      routed-subnet forwarding, portproxy publish surfaces, and optional static
      management OS IPv4 on the bridged management vNIC. See defaults/main.yml
      for the full hyperv_config schema.
    options:
      hyperv_config:
        type: dict
        required: false
        description: >-
          Hyper-V networking contract consumed by the role. Includes
          management_os_ipv4_mode (dhcp|static), management_os_ipv4_address,
          management_os_ipv4_prefix_length, and management_os_boot_recovery_state.
