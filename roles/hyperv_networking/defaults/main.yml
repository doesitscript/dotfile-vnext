---
# hyperv_networking — API contract.
#
# Pure infrastructure: enables Hyper-V and creates an External Virtual Switch
# bridged to a physical NIC. No guest (WSL, VM) awareness.
#
# Override in host_vars / group_vars or pass via include_role vars.
hyperv_config:
  external_switch_enabled: false
  switch_name: "WSL-Bridge"
  adapter_name: "Ethernet"
  allow_management_os: true
