---
# hyperv_networking — API contract.
#
# Pure infrastructure: enables Hyper-V and manages Hyper-V networking
# prerequisites. Supports the existing External VMSwitch path plus an Internal
# guest switch with Internet Connection Sharing for Wi-Fi-backed guests.
#
# Override adapter_name, switch_name, or allow_management_os in host_vars.
hyperv_feature_state: present
hyperv_networking_switch_create_winrm_timeout: 180
hyperv_networking_reconnect_timeout: 300
hyperv_config:
  external_switch_enabled: false
  switch_name: "External"
  adapter_name: "Wi-Fi"
  allow_management_os: true
  management_os_boot_recovery_state: absent
  management_os_boot_recovery_trigger_delay: "PT45S"
  internal_ics_switch_enabled: false
  internal_ics_sharing_enabled: true
  internal_ics_switch_name: "Guest"
  guest_network_mode: "ics"
  guest_switch_name: "{{ (hyperv_config | default({})).internal_ics_switch_name | default('Guest') }}"
  guest_subnet_ipv4: "192.168.137.0/24"
  guest_gateway_ipv4: "192.168.137.1"
  guest_outbound_nat_enabled: true
  guest_outbound_nat_name: "HyperVGuestNat"
  guest_published_tcp_ports: []
  guest_published_tcp_ports_state: present
  internal_ics_public_adapter_name: "{{ (hyperv_config | default({})).adapter_name | default('Wi-Fi') }}"
  internal_ics_private_adapter_alias: "vEthernet ({{ (hyperv_config | default({})).internal_ics_switch_name | default('Guest') }})"
  internal_ics_psmodule_state: present
