---
argument_specs:
  main:
    short_description: Manage a baseline user-scoped Codex config.toml file.
    options:
      codex_user_config_state:
        type: str
        default: absent
        choices:
          - present
          - absent
      codex_user_config_force:
        type: bool
        default: false
      codex_user_config_home:
        type: str
        required: false
      codex_user_config_path:
        type: str
        required: false
      codex_user_config_model:
        type: str
        default: gpt-5.4
      codex_user_config_model_reasoning_effort:
        type: str
        default: high
      codex_user_config_approval_policy:
        type: str
        default: never
