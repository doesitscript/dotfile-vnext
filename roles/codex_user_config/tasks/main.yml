---
- name: Validate codex_user_config state
  ansible.builtin.assert:
    that:
      - codex_user_config_state in ["present", "absent"]
    fail_msg: codex_user_config_state must be present or absent.

- name: Ensure Codex user config home exists
  ansible.builtin.file:
    path: "{{ codex_user_config_home }}"
    state: directory
    mode: "0700"
  when: codex_user_config_state == "present"

- name: Check whether Codex user config already exists
  ansible.builtin.stat:
    path: "{{ codex_user_config_path }}"
  register: codex_user_config_stat
  when: codex_user_config_state == "present"

- name: Back up existing Codex user config before forced overwrite
  ansible.builtin.copy:
    src: "{{ codex_user_config_path }}"
    dest: "{{ codex_user_config_path }}{{ codex_user_config_backup_suffix }}"
    remote_src: true
    mode: preserve
  when:
    - codex_user_config_state == "present"
    - codex_user_config_force | bool
    - codex_user_config_stat.stat.exists | default(false)

- name: Render Codex user config baseline
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ codex_user_config_path }}"
    mode: "0644"
  when:
    - codex_user_config_state == "present"
    - codex_user_config_force | bool or not (codex_user_config_stat.stat.exists | default(false))

- name: Report preserved Codex user config
  ansible.builtin.debug:
    msg: >-
      Preserving existing Codex user config at {{ codex_user_config_path }}
      because codex_user_config_force=false. Applying Codex 0.153+ memories
      migration without full overwrite (keeps MCP entries).
  when:
    - codex_user_config_state == "present"
    - codex_user_config_stat.stat.exists | default(false)
    - not (codex_user_config_force | bool)

# Codex 0.153+: top-level memories must be MemoriesToml (table), not a
# string/bool. Quoted scalars like memories = "true" break config load.
# Do not wipe the whole file (MCP servers live here); migrate surgically.
- name: Remove invalid quoted memories scalars from Codex user config
  ansible.builtin.replace:
    path: "{{ codex_user_config_path }}"
    regexp: '(?m)^memories\s*=\s*"(true|false)"\s*\n?'
    replace: ""
  when: codex_user_config_state == "present"

- name: Remove obsolete quoted shell_snapshot scalars from Codex user config
  ansible.builtin.replace:
    path: "{{ codex_user_config_path }}"
    regexp: '(?m)^shell_snapshot\s*=\s*"(true|false)"\s*\n?'
    replace: ""
  when: codex_user_config_state == "present"

- name: Ensure Codex [memories] table for Codex 0.153+
  ansible.builtin.blockinfile:
    path: "{{ codex_user_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: codex_memories_toml"
    create: true
    mode: "0644"
    block: |
      [memories]
      generate_memories = true
      use_memories = true
  when:
    - codex_user_config_state == "present"
    - codex_user_config_memories | bool

- name: Remove Codex [memories] table when memories disabled
  ansible.builtin.blockinfile:
    path: "{{ codex_user_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: codex_memories_toml"
    state: absent
  when:
    - codex_user_config_state == "present"
    - not (codex_user_config_memories | bool)

- name: Ensure macOS Codex shell locale policy in user config
  ansible.builtin.blockinfile:
    path: "{{ codex_user_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: macos_shell_locale"
    create: true
    mode: "0644"
    block: "{{ lookup('template', 'macos_shell_locale.toml.j2') }}"
  when:
    - codex_user_config_state == "present"
    - codex_user_config_macos_locale_normalize | bool

- name: Remove macOS Codex shell locale policy from user config
  ansible.builtin.blockinfile:
    path: "{{ codex_user_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: macos_shell_locale"
    state: absent
  when:
    - codex_user_config_state == "present"
    - not (codex_user_config_macos_locale_normalize | bool)

- name: Remove Codex user config
  ansible.builtin.file:
    path: "{{ codex_user_config_path }}"
    state: absent
  when: codex_user_config_state == "absent"
