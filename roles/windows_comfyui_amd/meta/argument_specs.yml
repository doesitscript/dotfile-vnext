---
argument_specs:
  main:
    short_description: ComfyUI with AMD ROCm PyTorch on Windows GPU desktops
    options:
      windows_comfyui_amd_state:
        type: str
        default: absent
        choices:
          - present
          - absent
        description: Lifecycle state for ComfyUI AMD runtime.
      windows_comfyui_amd_port:
        type: int
        default: 8188
        description: ComfyUI listen port.
      windows_comfyui_amd_install_root:
        type: str
        required: false
        description: Install root on the Windows host.
