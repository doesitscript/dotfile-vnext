---
- name: Validate windows_comfyui_amd_state
  ansible.builtin.assert:
    that:
      - windows_comfyui_amd_state in ['present', 'absent']
    fail_msg: "windows_comfyui_amd_state must be present or absent"

- name: Include present tasks
  ansible.builtin.include_tasks: present.yml
  when: windows_comfyui_amd_state == 'present'

- name: Include absent tasks
  ansible.builtin.include_tasks: absent.yml
  when: windows_comfyui_amd_state == 'absent'
