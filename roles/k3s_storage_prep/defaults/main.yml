---
k3s_storage_prep_d_mount: /mnt/d
k3s_storage_prep_data_root: /mnt/d/k3s

k3s_storage_prep_dirs:
  - /mnt/d/k3s/rancher
  - /mnt/d/k3s/kubelet

k3s_storage_prep_symlinks:
  - src: /mnt/d/k3s/rancher
    dest: /var/lib/rancher
  - src: /mnt/d/k3s/kubelet
    dest: /var/lib/kubelet

# Minimum free space on D: drive in MB
k3s_storage_prep_min_free_mb: 10240
