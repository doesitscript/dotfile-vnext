---
argument_specs:
  main:
    short_description: "Manage terraform-docs via Homebrew on macOS"
    options:
      terraform_docs_cli_state:
        type: str
        default: present
        choices: [present, absent]
        description: ["Whether terraform_docs_cli should be installed or removed."]
      terraform_docs_cli_homebrew_formula:
        type: str
        default: terraform-docs
        description: ["Homebrew formula used to manage this CLI."]
      terraform_docs_cli_verify:
        type: bool
        default: true
        description: ["Verify requested state after convergence."]
