---
# defaults file for ansible_ui_semaphore
ansible_ui_semaphore_state: present
ansible_ui_semaphore_version: "v2.17.38"
ansible_ui_semaphore_data_path: /opt/semaphore
ansible_ui_semaphore_user: root
ansible_ui_semaphore_group: root
# Host port 3001 → container port 3000 (3000 is occupied by Grafana)
ansible_ui_semaphore_http_port: "3001:3000"
ansible_ui_semaphore_remove_volumes_on_absent: false
