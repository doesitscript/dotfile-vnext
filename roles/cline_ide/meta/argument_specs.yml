---
argument_specs:
  main:
    short_description: Manage Cline IDE/CLI config for LiteLLM gateway lanes
    options:
      cline_ide_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      cline_ide_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
        description: >-
          Cline OpenAI Compatible base URL. Includes /v1 (unlike Continue
          apiBase).
      cline_ide_api_key:
        type: str
        required: false
        default: ""
      cline_ide_model:
        type: str
        required: false
        default: "qwen3-coder-30b-a3b"
        description: Default / last-used model id (must be in cline_ide_models).
      cline_ide_models:
        type: list
        elements: dict
        required: false
        description: >-
          LiteLLM lane catalog written to models.json (name, model,
          context_window, max_output_tokens, temperature, top_p, capabilities).
      cline_ide_default_temperature:
        type: float
        required: false
        default: 0.7
        description: Default sampling temperature when a model entry omits temperature.
      cline_ide_default_top_p:
        type: float
        required: false
        default: 0.8
        description: Default top_p when a model entry omits top_p.
      cline_ide_default_max_output_tokens:
        type: int
        required: false
        default: 8192
        description: Default max output tokens when a model entry omits max_output_tokens.
      cline_ide_providers_merge:
        type: bool
        required: false
        default: true
        description: Preserve non-managed provider entries when rewriting providers.json.
      cline_ide_mcp_servers:
        type: list
        elements: dict
        required: false
        description: MCP server list (Continue-shaped); rendered to mcpServers object.
      cline_ide_require_api_key:
        type: bool
        required: false
        default: true
