---
argument_specs:
  main:
    short_description: Manage Cline IDE/CLI config for LiteLLM gateway lanes
    options:
      cline_ide_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      cline_ide_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
        description: >-
          Cline OpenAI Compatible base URL. Includes /v1 (unlike Continue
          apiBase).
      cline_ide_api_key:
        type: str
        required: false
        default: ""
      cline_ide_model:
        type: str
        required: false
        default: "qwen2.5-coder-32b@k3s02-vllm"
      cline_ide_mcp_servers:
        type: list
        elements: dict
        required: false
        description: MCP server list (Continue-shaped); rendered to mcpServers object.
      cline_ide_require_api_key:
        type: bool
        required: false
        default: true
