---
# Cline IDE/CLI config pointing at the shared LiteLLM gateway.
# Lifecycle: cline_ide_state: present|absent
# Authority: https://docs.cline.bot/getting-started/config.md
# Provider shape: ~/.cline/data/settings/providers.json (openai-compatible)
# Model catalog: ~/.cline/data/settings/models.json
# CLI MCP: ~/.cline/mcp.json (same render as IDE MCP settings)
cline_ide_state: absent
cline_ide_config_root: "{{ ansible_env.HOME }}/.cline"
cline_ide_data_settings_dir: "{{ cline_ide_config_root }}/data/settings"
cline_ide_providers_path: "{{ cline_ide_data_settings_dir }}/providers.json"
cline_ide_models_path: "{{ cline_ide_data_settings_dir }}/models.json"
cline_ide_mcp_settings_path: "{{ cline_ide_data_settings_dir }}/cline_mcp_settings.json"
cline_ide_mcp_cli_path: "{{ cline_ide_config_root }}/mcp.json"
# Cline OpenAI-compatible base URL includes /v1 (unlike Continue apiBase).
cline_ide_gateway_api_base: "http://litellm.hom.lab/v1"
cline_ide_api_key: ""
cline_ide_require_api_key: true
cline_ide_vault_file_path: "{{ inventory_dir }}/../vault/shared.vault.yml"
cline_ide_provider_id: "openai-compatible"
cline_ide_provider_display_name: "Homelab LiteLLM"
# Default / last-used model id (must exist in cline_ide_models). Plain LiteLLM id.
cline_ide_model: "{{ ai_cli_default_chat_model | default('qwen3.6-35b-a3b') }}"
cline_ide_default_context_window: 32768
cline_ide_default_max_output_tokens: 8192
# Qwen3.6 NVFP4 card SciCode-style defaults when a model entry omits sampling keys.
cline_ide_default_temperature: 0.6
cline_ide_default_top_p: 0.95
cline_ide_default_capabilities:
  - streaming
  - tools
# When true, preserve non-managed provider entries (e.g. Cline cloud auth).
cline_ide_providers_merge: true
cline_ide_modes: {}
# LiteLLM lanes available in the Cline model picker (SSOT: ai_cli_commissioned_models).
cline_ide_models:
  - name: "Qwen3.6-35B-A3B"
    model: "qwen3.6-35b-a3b"
    roles:
      - chat
      - agent
    context_window: 32768
    max_output_tokens: 8192
    temperature: 0.6
    top_p: 0.95
    capabilities:
      - streaming
      - tools
  - name: "Qwen3-Coder-30B-A3B (pending sequential)"
    model: "qwen3-coder-30b-a3b"
    enabled: false
    roles:
      - chat
      - agent
    context_window: 32768
    max_output_tokens: 8192
    temperature: 0.7
    top_p: 0.8
    capabilities:
      - streaming
      - tools
  - name: "qwen2.5-coder:14b"
    model: "qwen2.5-coder-14b"
    roles:
      - edit
    context_window: 12000
    max_output_tokens: 4096
    temperature: 0.2
    top_p: 0.9
    capabilities:
      - streaming
      - tools
  - name: "qwen2.5-coder:7b"
    model: "qwen2.5-coder-7b"
    roles:
      - apply
    context_window: 12000
    max_output_tokens: 4096
    temperature: 0.2
    top_p: 0.9
    capabilities:
      - streaming
      - tools
  - name: "qwen2.5-coder:1.5b-base-q8_0"
    model: "qwen2.5-coder-1.5b-base-q8_0"
    roles:
      - autocomplete
    context_window: 12768
    max_output_tokens: 256
    temperature: 0.0
    capabilities:
      - streaming
  - name: "nomic-embed-text"
    model: "nomic-embed-text"
    roles:
      - embed
    context_window: 8192
    max_output_tokens: 1
    temperature: 0.0
    capabilities: []
  - name: "gpt-oss:20b"
    model: "gpt-oss-20b"
    roles:
      - chat
      - agent
    context_window: 131072
    max_output_tokens: 8192
    temperature: 1.0
    top_p: 0.95
    capabilities:
      - streaming
      - tools
  - name: "Gemini 2.5 Flash (Daily Driver)"
    model: "gemini-2.5-flash"
    roles:
      - chat
      - agent
    context_window: 1048576
    max_output_tokens: 8192
    temperature: 0.3
    capabilities:
      - streaming
      - tools
  - name: "Gemini 2.5 Flash (Long Context 1M)"
    model: "gemini-2.5-flash-long-context"
    roles:
      - chat
      - agent
    context_window: 1048576
    max_output_tokens: 8192
    temperature: 0.3
    capabilities:
      - streaming
      - tools
  - name: "Gemini 2.5 Pro (Deep Reasoning)"
    model: "gemini-2.5-pro"
    roles:
      - chat
      - agent
    context_window: 1048576
    max_output_tokens: 8192
    temperature: 0.2
    capabilities:
      - streaming
      - tools
  - name: "Gemini 2.5 Flash Lite (Bulk)"
    model: "gemini-2.5-flash-lite"
    roles:
      - chat
      - agent
    context_window: 1048576
    max_output_tokens: 4096
    temperature: 0.3
    capabilities:
      - streaming
      - tools
# MCP servers as a list (same shape as continue_ide_mcp_servers); rendered to
# Cline mcpServers object keyed by name.
cline_ide_mcp_servers: []
# Also merge legacy VS Code settings.json keys used by some Cline builds.
cline_ide_vscode_settings_merge: true
cline_ide_vscode_settings_path: >-
  {{ ansible_env.HOME }}/Library/Application Support/Code/User/settings.json
