---
# User-scoped local Codex configurations. Gateway credentials are fetched at
# launch time and are intentionally never rendered into these files.
codex_homelab_profiles_state: absent
codex_homelab_profiles_user_home: "{{ ansible_env.HOME }}"
codex_homelab_profiles_bin_dir: "{{ codex_homelab_profiles_user_home }}/bin"
codex_homelab_profiles_launcher_path: "{{ codex_homelab_profiles_bin_dir }}/codex-homelab"
codex_homelab_profiles_home_root: "{{ codex_homelab_profiles_user_home }}/.codex-homelab"
codex_homelab_profiles_desktop_home: "{{ codex_homelab_profiles_home_root }}/desktop"
codex_homelab_profiles_desktop_config_path: "{{ codex_homelab_profiles_desktop_home }}/config.toml"
codex_homelab_profiles_desktop_catalog_path: "{{ codex_homelab_profiles_desktop_home }}/model-catalog.json"
codex_homelab_profiles_instructions_path: "{{ codex_homelab_profiles_desktop_home }}/instructions.md"
codex_homelab_profiles_model: "qwen2.5-coder-14b@desktop"
codex_homelab_profiles_context_window: 12000
codex_homelab_profiles_gateway_base_url: "http://litellm.hom.lab/v1"
codex_homelab_profiles_gateway_secret_host: "hom-lab-ctl-k3s-02"
codex_homelab_profiles_gateway_secret_namespace: "litellm"
codex_homelab_profiles_gateway_secret_name: "litellm-env-secret"
codex_homelab_profiles_gateway_secret_key: "PROXY_MASTER_KEY"
codex_homelab_profiles_multi_terminal_bashrc: "{{ codex_homelab_profiles_user_home }}/.bashrc.d/codex-multi-terminal.bash"
codex_homelab_profiles_multi_terminal_state: absent
# cx-* default cwd roots (home Mac layout). Work-laptop overrides these.
codex_homelab_profiles_develop_root: "{{ codex_homelab_profiles_user_home }}/develop"
codex_homelab_profiles_repo_primary: "{{ codex_homelab_profiles_develop_root }}/dotfile-vnext"
codex_homelab_profiles_repo_skills: "{{ codex_homelab_profiles_develop_root }}/global-skills"
codex_homelab_profiles_repo_research: "{{ codex_homelab_profiles_develop_root }}/homelab-reference-library"
codex_homelab_profiles_codex_home: "{{ codex_homelab_profiles_user_home }}/.codex"
codex_homelab_profiles_local_catalog_path: "{{ codex_homelab_profiles_codex_home }}/local-model-catalog.json"
codex_homelab_profiles_catalog_renderer_path: "{{ codex_homelab_profiles_bin_dir }}/render_local_model_catalog"
