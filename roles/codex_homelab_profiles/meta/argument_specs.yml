---
argument_specs:
  main:
    short_description: Manage user-scoped Codex profiles for homelab LiteLLM routes
    options:
      codex_homelab_profiles_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      codex_homelab_profiles_model:
        type: str
        required: false
        default: qwen2.5-coder-14b@desktop
        description: Explicit desktop LiteLLM route for the isolated Codex home.
      codex_homelab_profiles_context_window:
        type: int
        required: false
        default: 12000
        description: Measured context contract for the desktop coding-chat model.
      codex_homelab_profiles_gateway_base_url:
        type: str
        required: false
        default: http://litellm.hom.lab/v1
        description: OpenAI-compatible LiteLLM Responses API base URL.
      codex_homelab_profiles_multi_terminal_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
        description: Deploy cx-* helpers, shared ~/.codex profiles, and catalog renderer.
