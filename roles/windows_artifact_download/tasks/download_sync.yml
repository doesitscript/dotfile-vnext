---
- name: Download or resume Windows artifact (sync)
  ansible.windows.win_command:
    argv:
      - curl.exe
      - --fail
      - --location
      - --continue-at
      - "{{ '-' if (windows_artifact_resume | bool) else '0' }}"
      - --retry
      - "{{ windows_artifact_retries | string }}"
      - --retry-delay
      - "{{ windows_artifact_retry_delay_seconds | string }}"
      - --retry-all-errors
      - --connect-timeout
      - "{{ windows_artifact_connect_timeout_seconds | string }}"
      - --speed-limit
      - "{{ windows_artifact_stalled_min_bps | string }}"
      - --speed-time
      - "{{ windows_artifact_stalled_timeout_seconds | string }}"
      - --output
      - "{{ windows_artifact_partial_path }}"
      - "{{ windows_artifact_url }}"
  register: windows_artifact_download_sync
  vars:
    ansible_ssh_args: >-
      -o ControlMaster=no -o ServerAliveInterval=30 -o ServerAliveCountMax=120
