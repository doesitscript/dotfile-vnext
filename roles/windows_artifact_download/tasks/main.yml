---
- name: Validate artifact input
  ansible.builtin.include_tasks: validate.yml

- name: Ensure artifact directory exists
  ansible.windows.win_file:
    path: "{{ windows_artifact_directory }}"
    state: directory
  when: windows_artifact_create_destination_directory | bool

- name: Hydrate artifact from cold/shared cache when configured
  ansible.builtin.include_tasks: hydrate_from_cold.yml

- name: Inspect artifact state
  ansible.builtin.include_tasks: inspect.yml

- name: Download artifact
  ansible.builtin.include_tasks: download.yml
  when: windows_artifact_download_required | bool

- name: Verify artifact
  ansible.builtin.include_tasks: verify.yml
  when: windows_artifact_download_required | bool

- name: Publish artifact
  ansible.builtin.include_tasks: publish.yml
  when: windows_artifact_download_required | bool

- name: Seed published artifact into cold/shared cache when configured
  ansible.builtin.include_tasks: seed_cold.yml
  when: >-
    (windows_artifact_cold_paths | default([]) | length) > 0
    and (
      (windows_artifact_download_required | default(false) | bool)
      or (
        (
          windows_artifact_cache_results[windows_artifact_id ~ '-hydrate'].source
          | default('')
        ) == 'hot_already'
      )
    )
