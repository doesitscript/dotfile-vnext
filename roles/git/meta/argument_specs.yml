---
argument_specs:
  main:
    short_description: Configure git on macOS, Ubuntu, and Windows.
    description: >
      Installs and configures git: global gitconfig, global gitattributes,
      and a symlinked global gitignore. On macOS sets the osxkeychain
      credential helper. Reads dotfiles_home and dotfiles_user_home from
      inventory (group_vars/all.yaml).
    options:
      full_name:
        type: str
        required: false
        description: >
          Full name written to [user] name in .gitconfig.
          Defaults to $GIT_AUTHOR_NAME, then $USER.
      git_email:
        type: str
        required: false
        description: >
          Email written to [user] email in .gitconfig.
        default: "1589359+doesitscale@users.noreply.github.com"
      git_user:
        type: str
        required: false
        description: >
          GitHub username. Defaults to $GITHUB_USER, then $USER.
      git_signing_key:
        type: str
        required: false
        description: >
          GPG key ID used for commit signing. Leave blank to disable signing.
        default: ""
