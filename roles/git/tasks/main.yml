- name: Process git role for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == "Darwin"

- name: Process git role for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Process git role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"

- name: Ensure global gitignore is linked on Unix-like systems
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/roles/git/files/gitignore_global.link"
    dest: "{{ dotfiles_user_home }}/.gitignore_global"
    state: link
    force: true
  register: gitignore_link_result
  when: ansible_facts['system'] != "Windows"

- name: Show global gitignore link location (Unix)
  ansible.builtin.debug:
    msg: >-
      Global gitignore linked: {{ dotfiles_user_home }}/.gitignore_global ->
      {{ dotfiles_home }}/roles/git/files/gitignore_global.link
      ({{ 'created' if gitignore_link_result is changed else 'already present' }})
  when: ansible_facts['system'] != "Windows"

- name: Check whether gitconfig already exists
  ansible.builtin.stat:
    path: "{{ dotfiles_user_home }}/.gitconfig"
  register: gitconfig_stat

- name: Back up existing gitconfig once
  ansible.builtin.copy:
    src: "{{ dotfiles_user_home }}/.gitconfig"
    dest: "{{ dotfiles_user_home }}/.gitconfig.bak"
    remote_src: true
    force: false
    mode: "0644"
  when: gitconfig_stat.stat.exists

- name: Ensure gitconfig matches template
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ dotfiles_user_home }}/.gitconfig"
    mode: "0644"

- name: Ensure gitattributes matches template
  ansible.builtin.template:
    src: gitattributes.j2
    dest: "{{ dotfiles_user_home }}/.gitattributes"
    mode: "0644"
