---
# macOS: install PowerShell via Homebrew cask

- name: Check whether pwsh is already installed
  ansible.builtin.command: pwsh --version
  changed_when: false
  failed_when: false
  register: pwsh_version_check

- name: Install PowerShell cask via Homebrew
  community.general.homebrew_cask:
    name: powershell
    state: present
  when: pwsh_version_check.rc != 0

- name: Report installed PowerShell version
  ansible.builtin.debug:
    msg: "pwsh {{ pwsh_version_check.stdout | default('(just installed — re-run to confirm version)') }}"
