---
argument_specs:
  main:
    short_description: Install PowerShell 7+ and configure global encoding profile
    description:
      - Installs PowerShell 7+ on macOS and Ubuntu.
      - On Windows, deploys the AllUsersAllHosts profile enforcing UTF-8 encoding
        for both Windows PowerShell 5.1 and PowerShell 7 (when installed).
    options:
      pwsh_global_encoding_enabled:
        type: bool
        required: false
        default: true
        description:
          - When true, deploys $PSDefaultParameterValues['*:Encoding'] = 'utf8'
            to both PS5.1 and PS7 AllUsersAllHosts profiles on Windows.
          - Set to false to skip profile deployment for a host.
