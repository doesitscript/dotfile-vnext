---
argument_specs:
  main:
    short_description: >-
      Export the LocalMachine Remote Desktop TLS leaf certificate for Mac
      Microsoft Remote Desktop trust import.
    options:
      windows_rdp_certificate_export_state:
        type: str
        required: false
        choices: [present, absent]
        default: present
      windows_rdp_certificate_export_remote_dir:
        type: path
        required: false
      windows_rdp_certificate_export_store_location:
        type: str
        required: false
        default: LocalMachine
      windows_rdp_certificate_export_store_name:
        type: str
        required: false
        default: "Remote Desktop"
      windows_rdp_certificate_export_file_type:
        type: str
        required: false
        choices: [der, pem]
        default: der
      windows_rdp_certificate_export_fetch_dest:
        type: path
        required: false
