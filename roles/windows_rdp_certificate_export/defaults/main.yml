---
# Export the machine Remote Desktop TLS leaf cert (public only) for Mac clients.
windows_rdp_certificate_export_state: present
windows_rdp_certificate_export_remote_dir: "C:\\ProgramData\\homelab\\rdp-certs"
windows_rdp_certificate_export_store_location: LocalMachine
windows_rdp_certificate_export_store_name: "Remote Desktop"
windows_rdp_certificate_export_file_type: der
# Controller-side cache (fetched under this path / {{ inventory_hostname }}/).
windows_rdp_certificate_export_fetch_dest: "{{ playbook_dir }}/../.cache/rdp-certs"
