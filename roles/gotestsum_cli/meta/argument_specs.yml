---
argument_specs:
  main:
    short_description: "Manage gotestsum Go test reporter via Homebrew on macOS"
    options:
      gotestsum_cli_state:
        type: str
        default: present
        choices: [present, absent]
        description: ["Whether gotestsum_cli should be installed or removed."]
      gotestsum_cli_homebrew_formula:
        type: str
        default: gotestsum
        description: ["Homebrew formula used to manage this CLI."]
      gotestsum_cli_verify:
        type: bool
        default: true
        description: ["Verify requested state after convergence."]
