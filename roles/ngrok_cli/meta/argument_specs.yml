---
argument_specs:
  main:
    short_description: Manage ngrok on macOS through Homebrew cask
    options:
      ngrok_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether the Homebrew ngrok cask should be installed or removed.
      ngrok_cli_homebrew_cask:
        type: str
        default: ngrok
        description:
          - Homebrew cask name that provides the ngrok CLI.
      ngrok_cli_verify:
        type: bool
        default: true
        description:
          - Verify the requested cask state after convergence.
