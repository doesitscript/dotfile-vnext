---
argument_specs:
  main:
    short_description: Apply macOS notification and widget niceties on the controller.
    options:
      mac_user_niceties_state:
        type: str
        default: present
        choices:
          - present
      mac_user_niceties_disable_notification_bundle_ids:
        type: list
        elements: str
        default:
          - "com.apple.news"
          - "com.apple.iCal"
          - "com.apple.reminders"
          - "com.apple.ScreenTimeNotifications"
          - "com.apple.ScreenTimeEnabledNotifications"
      mac_user_niceties_clear_widgets:
        type: bool
        default: true
      mac_user_niceties_restart_notification_services:
        type: bool
        default: true
