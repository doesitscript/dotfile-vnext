---
- name: Restart macOS notification services
  ansible.builtin.command: >-
    /bin/bash -lc "killall usernoted 2>/dev/null || true; killall NotificationCenter 2>/dev/null || true; killall cfprefsd 2>/dev/null || true"
  changed_when: false
  when: mac_user_niceties_restart_notification_services | bool
