---
# Lifecycle control for controller niceties.
mac_user_niceties_state: present

# Disable notification permission/alert flags for these app bundles.
mac_user_niceties_disable_notification_bundle_ids:
  - "com.apple.news"
  - "com.apple.iCal"
  - "com.apple.reminders"
  - "com.apple.ScreenTimeNotifications"
  - "com.apple.ScreenTimeEnabledNotifications"

# Remove configured Notification Center widgets.
mac_user_niceties_clear_widgets: true

# Restart services so preference changes are reloaded.
mac_user_niceties_restart_notification_services: true
