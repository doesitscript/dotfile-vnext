---
argument_specs:
  main:
    short_description: Manage OpenLens on macOS through Homebrew cask
    options:
      openlens_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether the Homebrew OpenLens cask should be installed or removed.
      openlens_cask_name:
        type: str
        default: openlens
        description:
          - Homebrew cask name that provides the OpenLens desktop application.
      openlens_app_path:
        type: str
        default: /Applications/OpenLens.app
        description:
          - Expected OpenLens app bundle path after install.
      openlens_verify_install:
        type: bool
        default: true
        description:
          - Verify the requested app-bundle state after convergence.
