---
argument_specs:
  main:
    short_description: Report (or later enforce) runtime_planes against policy catalog.
    options:
      runtime_plane_state:
        type: str
        required: false
        default: absent
        choices: [present, absent]
      runtime_plane_apply:
        type: bool
        required: false
        default: false
      runtime_plane_require_classification:
        type: bool
        required: false
        default: true
      runtime_plane_policy_root:
        type: path
        required: false
