---
argument_specs:
  main:
    short_description: Resolve and dispatch inventory-driven Windows application capabilities
    options:
      windows_applications:
        type: list
        elements: str
        required: false
        description: Explicit host application capability IDs (intent contract).
      windows_applications_filter:
        type: list
        elements: str
        required: false
        description: Optional subset filter; empty means all host intent IDs.
      windows_applications_catalog_path:
        type: str
        required: false
      windows_applications_process_order_path:
        type: str
        required: false
      windows_applications_verify_dispatch:
        type: bool
        required: false
        default: false
      windows_applications_preview_only:
        type: bool
        required: false
        default: false
