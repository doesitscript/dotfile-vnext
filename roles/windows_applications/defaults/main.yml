---
# Host intent default: no applications commissioned until inventory lists them.
# Do not discover applications by scanning roles/.
windows_applications: []

# Optional playbook filter (e.g. Steam recovery wrapper). Empty = all intent IDs.
windows_applications_filter: []

# Inventory group / pattern for the Windows application phase.
windows_applications_hosts: windows_hosts

# Policy paths (controller-relative via playbook_dir / role).
windows_applications_catalog_path: "{{ playbook_dir }}/../policy/capability_catalog.yml"
windows_applications_process_order_path: "{{ playbook_dir }}/../policy/process_order.yml"

# When true, dispatch only verify-tagged role tasks (orchestrator sets this).
windows_applications_verify_dispatch: false

# When true, resolve + receipt only; do not include_role.
windows_applications_preview_only: false
