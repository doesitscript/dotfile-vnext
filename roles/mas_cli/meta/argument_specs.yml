---
argument_specs:
  main:
    short_description: "Install the mas Mac App Store CLI"
    options:
      mas_cli_formula_name:
        type: str
        default: mas
        description:
          - "Homebrew formula name for the Mac App Store CLI."
      mas_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether mas should be installed or removed."
