---
# k3s_traefik_routes — Ingress CRs from k3s_traefik_routes_entries (K3s Traefik, not installed here).

k3s_traefik_routes_state: present

k3s_traefik_routes_class_name: traefik

k3s_traefik_routes_lan_publish_host: ""

k3s_traefik_routes_entries: []

k3s_traefik_routes_kubeconfig: /etc/rancher/k3s/k3s.yaml

k3s_traefik_routes_verify_backends: true
k3s_traefik_routes_verify_ingress_objects: true
k3s_traefik_routes_verify_endpoint_slices: true
k3s_traefik_routes_verify_host_header: true
k3s_traefik_routes_probe_host: "127.0.0.1"
k3s_traefik_routes_probe_status_codes:
  - 200
  - 204
  - 301
  - 302
  - 307
  - 308
  - 401
  - 403
