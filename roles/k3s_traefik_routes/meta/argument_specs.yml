---
argument_specs:
  main:
    short_description: Apply K3s Traefik Ingress routes from the route registry
    description:
      - Manages Ingress CRs for kube-system Traefik on hom-lab-ctl-k3s-02.
      - Does not install Traefik. Registry SSOT is k3s_traefik_routes_entries in k3s_cluster.yaml.
    options:
      k3s_traefik_routes_state:
        type: str
        choices:
          - present
          - absent
        default: absent
      k3s_traefik_routes_class_name:
        type: str
        default: traefik
      k3s_traefik_routes_verify_backends:
        type: bool
        default: true
      k3s_traefik_routes_verify_ingress_objects:
        type: bool
        default: true
      k3s_traefik_routes_verify_endpoint_slices:
        type: bool
        default: true
      k3s_traefik_routes_verify_host_header:
        type: bool
        default: true
      k3s_traefik_routes_probe_host:
        type: str
        default: "127.0.0.1"
      k3s_traefik_routes_probe_status_codes:
        type: list
        elements: int
        required: false
