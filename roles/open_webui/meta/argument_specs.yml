---
argument_specs:
  main:
    short_description: Deploy Open WebUI Compose as OpenAI-compatible client to LiteLLM.
    options:
      open_webui_state:
        type: str
        required: false
        default: absent
        choices: [present, absent]
      open_webui_compose_project:
        type: str
        required: false
        default: openwebui
      open_webui_image_tag:
        type: str
        required: false
      open_webui_openai_api_base_url:
        type: str
        required: false
      open_webui_require_ai_client_ui_role:
        type: bool
        required: false
        default: true
        description: When true, refuse present unless host matched ai-client-ui (or allow_workloads open_webui).
