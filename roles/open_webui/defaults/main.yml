---
# open_webui — Compose Open WebUI (OpenAI-compatible client → LiteLLM).
# Defaults conservative; commission via host_vars open_webui_state: present.

open_webui_state: absent

open_webui_compose_project: openwebui
open_webui_project_src: "{{ linux_stacks_root }}/openwebui"
open_webui_data_src: "{{ linux_data_root }}/openwebui"

open_webui_image_repo: ghcr.io/open-webui/open-webui
# Pin deliberately; bump via inventory when upgrading.
open_webui_image_tag: "v0.6.18"

open_webui_host_port: 3080
open_webui_container_port: 8080

open_webui_enable_openai_api: true
open_webui_openai_api_base_url: "http://litellm.hom.lab/v1"
# Prefer vault_open_webui_openai_api_key; fall back to LiteLLM master only for bootstrap.
open_webui_openai_api_key: >-
  {{ vault_open_webui_openai_api_key
     | default(vault_k3s_litellm_gateway_master_key)
     | default(k3s_litellm_gateway_master_key)
     | default('sk-Pass@w0rd1') }}
open_webui_enable_openai_api_passthrough: false
open_webui_enable_ollama_api: false

# Local Automatic1111 on HVH-01 (GTX 1060) — no cloud image APIs.
open_webui_enable_image_generation: false
open_webui_image_generation_engine: automatic1111
open_webui_automatic1111_base_url: "http://a1111-hvh01.hom.lab:7860"
open_webui_comfyui_base_url: "http://comfyui.hom.lab:30188"
open_webui_image_size: "512x512"
open_webui_image_steps: 25
# Override in host_vars for commissioned hosts (e.g. 768x768 / 35 steps).

# Arena Model — pin combatants so it does not randomly hit continue-*/autocomplete/smart-router.
# Vision/image attachments: only Gemma4 (and studio-coach → same backend) are multimodal.
# Ornith (vLLM), qwen3.6-27b, and gpt-oss-20b reject image payloads; keep them out of
# Arena or image chats fail 400. Re-add text-only models here only for text-vs-text fights.
open_webui_enable_evaluation_arena_models: true
open_webui_evaluation_arena_model_ids:
  - gemma4-12b
open_webui_evaluation_arena_admin_email: "joshcastillo@gmail.com"
# Prefer vault; fall back matches lab bootstrap password used for WebUI admin.
open_webui_evaluation_arena_admin_password: "{{ vault_main_openwebui_admin_password | default('Pass@w0rd1') }}"

open_webui_require_ai_client_ui_role: true
open_webui_docker_engine_host: "{{ inventory_hostname }}"
