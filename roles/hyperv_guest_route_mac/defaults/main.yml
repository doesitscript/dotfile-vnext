---
hyperv_guest_route_mac_state: absent
hyperv_guest_route_mac_network_service: "Wi-Fi"

# Preferred multi-route interface. Each route is:
#   destination: "192.168.137.0"
#   mask: "255.255.255.0"
#   gateway: "192.168.50.158"
hyperv_guest_route_mac_routes: []

# Legacy single-route interface kept for direct role callers.
hyperv_guest_route_target_subnet: "192.168.137.0"
hyperv_guest_route_target_mask: "255.255.255.0"
hyperv_guest_route_gateway: "{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default('192.168.50.158') }}"
