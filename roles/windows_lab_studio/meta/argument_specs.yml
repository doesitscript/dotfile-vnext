---
argument_specs:
  main:
    short_description: Deploy lab studio prompt/coaching assets to Windows share
    options:
      windows_lab_studio_state:
        type: str
        default: absent
        choices:
          - present
          - absent
        description: Lifecycle state for lab studio assets on the share.
      windows_lab_studio_root:
        type: str
        required: false
        description: Root path for studio assets on the Windows share.
