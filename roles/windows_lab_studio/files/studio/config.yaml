# Lab studio profile — end-to-end still solutions
# Source of truth for share layout; pixels stay on A1111 / ComfyUI runtimes.

content_policy: lab_docs_and_ops_visuals_only

hosts:
  phase_a_stills: a1111-hvh01.hom.lab:7860
  phase_b_stills: comfyui.hom.lab:30188
  chat_ui: open-webui.hom.lab:3080
  chat_gateway: litellm.hom.lab

solutions:
  lab_doc_still:
    alias: positive-negative-prompt-assist
    engine: automatic1111
    path: Open WebUI Images → sdapi txt2img
    prompt_dir: prompts/lab_doc_still
    out_dir: images/output/lab_doc
  controlnet_mock:
    alias: positive-negative-prompt-assist
    engine: automatic1111
    path: Direct A1111 Web UI → img2img + ControlNet
    prompt_dir: prompts/controlnet_mock
    out_dir: images/output/mocks
  ops_change_card:
    alias: positive-negative-prompt-assist
    engine: comfyui
    path: change-card still graph
    prompt_dir: prompts/ops_change_card
    out_dir: images/output/cards
  agent_storyboard:
    alias: positive-negative-prompt-assist
    engine: comfyui
    path: storyboard stills graph
    prompt_dir: prompts/agent_storyboard
    out_dir: images/output/storyboards
