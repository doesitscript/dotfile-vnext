---
# windows_lab_studio — lab studio share assets.
# Seeds prompts/coaching for documented A1111 + ComfyUI E2E still solutions.
# Does not install A1111 or ComfyUI runtimes.

windows_lab_studio_state: absent

# Deploy root on HVH-01 public share
windows_lab_studio_root: 'F:\shares\public\studio'

windows_lab_studio_dirs:
  - "{{ windows_lab_studio_root }}"
  - "{{ windows_lab_studio_root }}\\images\\input"
  - "{{ windows_lab_studio_root }}\\images\\input\\lab_doc"
  - "{{ windows_lab_studio_root }}\\images\\input\\mocks"
  - "{{ windows_lab_studio_root }}\\images\\output"
  - "{{ windows_lab_studio_root }}\\images\\output\\lab_doc"
  - "{{ windows_lab_studio_root }}\\images\\output\\mocks"
  - "{{ windows_lab_studio_root }}\\images\\output\\cards"
  - "{{ windows_lab_studio_root }}\\images\\output\\storyboards"
  - "{{ windows_lab_studio_root }}\\prompts\\lab_doc_still"
  - "{{ windows_lab_studio_root }}\\prompts\\controlnet_mock"
  - "{{ windows_lab_studio_root }}\\prompts\\ops_change_card"
  - "{{ windows_lab_studio_root }}\\prompts\\agent_storyboard"
  - "{{ windows_lab_studio_root }}\\coaching"
  - "{{ windows_lab_studio_root }}\\examples"
  - "{{ windows_lab_studio_root }}\\loras"
