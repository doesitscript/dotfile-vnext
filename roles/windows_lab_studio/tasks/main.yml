---
- name: Validate windows_lab_studio_state
  ansible.builtin.assert:
    that:
      - windows_lab_studio_state in ['present', 'absent']
    fail_msg: "windows_lab_studio_state must be present or absent"

- name: Include present tasks
  ansible.builtin.include_tasks: present.yml
  when: windows_lab_studio_state == 'present'

- name: Include absent tasks
  ansible.builtin.include_tasks: absent.yml
  when: windows_lab_studio_state == 'absent'
