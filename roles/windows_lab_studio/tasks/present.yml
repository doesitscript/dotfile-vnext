---
# Module matrix: win_file (dirs) + win_copy (asset tree). No shell installers.

- name: Ensure lab studio directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop: "{{ windows_lab_studio_dirs }}"

- name: Deploy lab studio asset tree to share
  ansible.windows.win_copy:
    src: studio/
    dest: "{{ windows_lab_studio_root }}\\"
    newline_sequence: '\n'

- name: Write Phase B runtime note on share
  ansible.windows.win_copy:
    content: |
      Phase B pixels: k3s ComfyUI on hom-lab-ctl-k3s-02 (RTX 5090)
        http://comfyui.hom.lab:30188/
      Phase A stills: Automatic1111 on HVH-01
        http://a1111-hvh01.hom.lab:7860/
      Desktop Ollama: chat coaching only (positive-negative-prompt-assist).
      Studio assets on this share are lab-doc / ops visuals.
      Plans:
        docs/plans/2026-08-06--automatic1111-lab-setup-diagrams-implemented/
        docs/plans/2026-08-06--comfyui-lab-setup-diagrams-implemented/
    dest: "{{ windows_lab_studio_root }}\\PHASE_B_COMFYUI_K3S.txt"
    newline_sequence: '\n'
