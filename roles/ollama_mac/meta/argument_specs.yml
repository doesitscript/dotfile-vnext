---
argument_specs:
  main:
    short_description: Manage Ollama desktop app + CLI on macOS (cask or Monterey zip).
    options:
      ollama_mac_state:
        type: str
        default: absent
        choices:
          - present
          - absent
      ollama_mac_install_method:
        type: str
        default: auto
        choices:
          - auto
          - cask
          - github_zip
      ollama_mac_cask_name:
        type: str
        default: ollama-app
      ollama_mac_app_path:
        type: str
        default: /Applications/Ollama.app
      ollama_mac_bundled_cli_path:
        type: str
        default: /Applications/Ollama.app/Contents/Resources/ollama
      ollama_mac_cli_link_path:
        type: str
        required: false
      ollama_mac_formula_fallback:
        type: bool
        default: true
      ollama_mac_formula_name:
        type: str
        default: ollama
      ollama_mac_github_version:
        type: str
        default: "0.9.6"
      ollama_mac_github_zip_url:
        type: str
        required: false
      ollama_mac_github_zip_checksum:
        type: str
        required: false
      ollama_mac_download_dir:
        type: str
        required: false
      ollama_mac_download_path:
        type: str
        required: false
      ollama_mac_extract_dir:
        type: str
        required: false
      ollama_mac_verify_install:
        type: bool
        default: true
      ollama_mac_cask_min_macos_major:
        type: int
        default: 14
