---
- name: Probe Hyper-V Ubuntu VM state before removal
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $vm = Get-VM -Name '{{ hyperv_ubuntu_vm_name }}' -ErrorAction SilentlyContinue
      $Ansible.Result = @{
        exists = [bool]$vm
        state = if ($vm) { $vm.State.ToString() } else { $null }
      }
  register: _hyperv_ubuntu_vm_absent_probe
  changed_when: false

- name: Stop Hyper-V Ubuntu VM before removal when present
  ansible.windows.win_powershell:
    error_action: continue
    script: |
      $Ansible.Changed = $false
      $vm = Get-VM -Name '{{ hyperv_ubuntu_vm_name }}' -ErrorAction Stop
      if ($vm.State.ToString() -ne 'Off') {
        try {
          Stop-VM -Name '{{ hyperv_ubuntu_vm_name }}' -TurnOff -Force -ErrorAction Stop
          $Ansible.Changed = $true
          $Ansible.Result = @{
            stop_attempted = $true
            stop_result = 'stopped'
          }
        } catch {
          $Ansible.Result = @{
            stop_attempted = $true
            stop_result = 'proceed_to_force_remove'
            stop_error = $_.Exception.Message
          }
        }
      }
  when: _hyperv_ubuntu_vm_absent_probe.result.exists | default(false)

- name: Remove Hyper-V Ubuntu VM when present
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      if (Get-VM -Name '{{ hyperv_ubuntu_vm_name }}' -ErrorAction SilentlyContinue) {
        Remove-VM -Name '{{ hyperv_ubuntu_vm_name }}' -Force
        $Ansible.Changed = $true
      }
  when: _hyperv_ubuntu_vm_absent_probe.result.exists | default(false)

- name: Remove Hyper-V Ubuntu VM instance-state files while preserving cached source artifacts
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ hyperv_ubuntu_vm_host_vm_dir }}"
    - "{{ hyperv_ubuntu_vm_host_vhdx_path }}"
    - "{{ hyperv_ubuntu_vm_host_seed_iso_path }}"
    - "{{ hyperv_ubuntu_vm_host_metadata_path }}"

- name: Ensure Hyper-V Ubuntu VM host root directory exists for retained cached artifacts
  ansible.windows.win_file:
    path: "{{ hyperv_ubuntu_vm_host_root_dir }}"
    state: directory

- name: Remove Hyper-V Ubuntu VM controller staging directory
  ansible.builtin.file:
    path: "{{ hyperv_ubuntu_vm_controller_staging_dir }}"
    state: absent
  delegate_to: "{{ hyperv_ubuntu_vm_controller_host }}"

- name: Clear Hyper-V Ubuntu VM cached connection facts from the inventory host
  ansible.builtin.set_fact:
    ansible_host: ""
    host_ip: ""
    ssh_port: ""
    ssh_user: ""
    ansible_python_interpreter: ""
    cacheable: true
  delegate_to: "{{ hyperv_ubuntu_vm_inventory_host }}"
  delegate_facts: true

- name: Report Hyper-V Ubuntu VM removal summary
  ansible.builtin.debug:
    msg:
      vm_name: "{{ hyperv_ubuntu_vm_name }}"
      removed: "{{ _hyperv_ubuntu_vm_absent_probe.result.exists | default(false) }}"
