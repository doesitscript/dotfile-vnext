---
argument_specs:
  main:
    short_description: Manage a Hyper-V-native Ubuntu cloud-image VM on a Windows host.
    options:
      hyperv_ubuntu_vm_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_ubuntu_vm_name:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_inventory_host:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_generation:
        type: int
        default: 2
      hyperv_ubuntu_vm_cpus:
        type: int
        default: 4
      hyperv_ubuntu_vm_memory:
        type: str
        default: "8G"
      hyperv_ubuntu_vm_disk:
        type: str
        default: "40G"
      hyperv_ubuntu_vm_switch_name:
        type: str
        default: External
      hyperv_ubuntu_vm_bootstrap_user:
        type: str
        default: joshc
      hyperv_ubuntu_vm_hostname:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_ssh_port:
        type: int
        default: 22
      hyperv_ubuntu_vm_python_interpreter:
        type: str
        default: /usr/bin/python3
      hyperv_ubuntu_vm_secure_boot_template:
        type: str
        default: MicrosoftUEFICertificateAuthority
      hyperv_ubuntu_vm_secure_boot_enabled:
        type: bool
        default: true
      hyperv_ubuntu_vm_verify_ssh:
        type: bool
        default: true
      hyperv_ubuntu_vm_wait_for_ip_retries:
        type: int
        default: 60
      hyperv_ubuntu_vm_wait_for_ip_delay:
        type: int
        default: 10
      hyperv_ubuntu_vm_wait_for_ssh_timeout:
        type: int
        default: 300
      hyperv_ubuntu_vm_cloud_init_install_packages:
        type: bool
        default: false
      hyperv_ubuntu_vm_cloud_init_refresh_dhcp:
        type: bool
        default: false
      hyperv_ubuntu_vm_source_mode:
        type: str
        default: azure_cloud_image
        choices: [azure_cloud_image, quick_create_desktop, server_iso_installer]
      hyperv_ubuntu_vm_publish_connection_facts:
        type: bool
        default: true
      ansible_troubleshooting_mode:
        type: bool
        default: false
      debug_remote_output:
        type: bool
        default: false
      debug_collect_component_evidence:
        type: bool
        default: false
      hyperv_ubuntu_vm_cloud_image_url:
        type: str
        default: https://cloud-images.ubuntu.com/releases/server/24.04/release/ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz
      hyperv_ubuntu_vm_cloud_image_filename:
        type: str
        default: ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz
      hyperv_ubuntu_vm_source_vhd_name:
        type: str
        default: livecd.ubuntu-cpc.azure.vhd
      hyperv_ubuntu_vm_quick_create_image_url:
        type: str
        default: https://partner-images.canonical.com/hyper-v/desktop/noble/release/current/ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
      hyperv_ubuntu_vm_quick_create_image_filename:
        type: str
        default: ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
      hyperv_ubuntu_vm_quick_create_checksum_url:
        type: str
        default: https://partner-images.canonical.com/hyper-v/desktop/noble/release/current/SHA256SUMS
      hyperv_ubuntu_vm_quick_create_checksum:
        type: str
        default: cf9167f8d95e49a6ccfb09a55eb77f6f89b4bc1a2e15f04df1db57e3d1fba837
      hyperv_ubuntu_vm_quick_create_source_vhdx_name:
        type: str
        default: livecd.ubuntu-desktop-hyperv.vhdx
      hyperv_ubuntu_vm_quick_create_download_job_name:
        type: str
        default: server-225-ubuntu-quick-create-download
      hyperv_ubuntu_vm_quick_create_download_retries:
        type: int
        default: 960
      hyperv_ubuntu_vm_quick_create_download_poll_delay:
        type: int
        default: 15
      hyperv_ubuntu_vm_server_iso_url:
        type: str
        default: https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso
      hyperv_ubuntu_vm_server_iso_filename:
        type: str
        default: ubuntu-24.04.4-live-server-amd64.iso
      hyperv_ubuntu_vm_server_iso_checksum_url:
        type: str
        default: https://releases.ubuntu.com/24.04/SHA256SUMS
      hyperv_ubuntu_vm_server_iso_checksum:
        type: str
        default: e907d92eeec9df64163a7e454cbc8d7755e8ddc7ed42f99dbc80c40f1a138433
      hyperv_ubuntu_vm_server_iso_download_job_name:
        type: str
        default: server-225-ubuntu-server-iso-download
      hyperv_ubuntu_vm_server_iso_download_retries:
        type: int
        default: 960
      hyperv_ubuntu_vm_server_iso_download_poll_delay:
        type: int
        default: 15
      hyperv_ubuntu_vm_server_iso_autoinstall_enabled:
        type: bool
        default: true
      hyperv_ubuntu_vm_server_iso_customization_version:
        type: str
        default: autoinstall-v11-efi-grub-handoff
      hyperv_ubuntu_vm_server_iso_kernel_args:
        type: str
        default: autoinstall
      hyperv_ubuntu_vm_autoinstall_locale:
        type: str
        default: en_US.UTF-8
      hyperv_ubuntu_vm_autoinstall_keyboard_layout:
        type: str
        default: us
      hyperv_ubuntu_vm_autoinstall_password:
        type: str
      hyperv_ubuntu_vm_autoinstall_updates:
        type: str
        default: all
        choices: [security, all]
      hyperv_ubuntu_vm_autoinstall_network_interface_name:
        type: str
        default: eth0
      hyperv_ubuntu_vm_autoinstall_network_method:
        type: str
        default: dhcp
        choices: [dhcp, static]
      hyperv_ubuntu_vm_autoinstall_network_ipv4:
        type: str
        default: 192.168.137.10
      hyperv_ubuntu_vm_autoinstall_network_prefix_length:
        type: int
        default: 24
      hyperv_ubuntu_vm_autoinstall_network_gateway4:
        type: str
        default: 192.168.137.1
      hyperv_ubuntu_vm_autoinstall_network_dns_servers:
        type: list
        elements: str
        default:
          - 192.168.50.1
      hyperv_ubuntu_vm_host_archive_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz
      hyperv_ubuntu_vm_host_root_dir:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu
      hyperv_ubuntu_vm_host_vm_dir:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\vm
      hyperv_ubuntu_vm_host_image_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz
      hyperv_ubuntu_vm_host_source_vhd_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\livecd.ubuntu-cpc.azure.vhd
      hyperv_ubuntu_vm_host_quick_create_archive_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
      hyperv_ubuntu_vm_host_quick_create_source_vhdx_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx
      hyperv_ubuntu_vm_host_vhdx_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu.vhdx
      hyperv_ubuntu_vm_host_server_iso_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\ubuntu-24.04.4-live-server-amd64.iso
      hyperv_ubuntu_vm_host_server_iso_custom_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-autoinstall.iso
      hyperv_ubuntu_vm_host_server_iso_custom_signature_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-autoinstall.signature
      hyperv_ubuntu_vm_host_seed_iso_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-cidata.iso
      hyperv_ubuntu_vm_host_metadata_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-state.json
      hyperv_ubuntu_vm_controller_staging_dir:
        type: str
      hyperv_ubuntu_vm_controller_cache_dir:
        type: str
      hyperv_ubuntu_vm_controller_user_data_path:
        type: str
      hyperv_ubuntu_vm_controller_meta_data_path:
        type: str
      hyperv_ubuntu_vm_controller_seed_iso_path:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_cache_path:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_extract_dir:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_custom_dir:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_custom_path:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_custom_signature_path:
        type: str
      hyperv_ubuntu_vm_controller_server_iso_efi_image_path:
        type: str
      hyperv_ubuntu_vm_controller_xorriso_command:
        type: str
        default: /usr/local/bin/xorriso
      controller_ssh_public_key_path:
        type: str
        default: "~/.ssh/id_ed25519_ansible.pub"
