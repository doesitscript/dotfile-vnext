---
argument_specs:
  main:
    short_description: Manage a Hyper-V-native Ubuntu cloud-image VM on a Windows host.
    options:
      hyperv_ubuntu_vm_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_ubuntu_vm_name:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_inventory_host:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_generation:
        type: int
        default: 2
      hyperv_ubuntu_vm_cpus:
        type: int
        default: 4
      hyperv_ubuntu_vm_memory:
        type: str
        default: "8G"
      hyperv_ubuntu_vm_disk:
        type: str
        default: "40G"
      hyperv_ubuntu_vm_switch_name:
        type: str
        default: External
      hyperv_ubuntu_vm_user:
        type: str
        default: ubuntu
      hyperv_ubuntu_vm_hostname:
        type: str
        default: server-225-ubuntu
      hyperv_ubuntu_vm_ssh_port:
        type: int
        default: 22
      hyperv_ubuntu_vm_python_interpreter:
        type: str
        default: /usr/bin/python3
      hyperv_ubuntu_vm_secure_boot_template:
        type: str
        default: MicrosoftUEFICertificateAuthority
      hyperv_ubuntu_vm_verify_ssh:
        type: bool
        default: true
      hyperv_ubuntu_vm_wait_for_ip_retries:
        type: int
        default: 60
      hyperv_ubuntu_vm_wait_for_ip_delay:
        type: int
        default: 10
      hyperv_ubuntu_vm_wait_for_ssh_timeout:
        type: int
        default: 300
      ansible_troubleshooting_mode:
        type: bool
        default: false
      debug_remote_output:
        type: bool
        default: false
      debug_collect_component_evidence:
        type: bool
        default: false
      hyperv_ubuntu_vm_cloud_image_url:
        type: str
        default: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
      hyperv_ubuntu_vm_cloud_image_filename:
        type: str
        default: noble-server-cloudimg-amd64.img
      hyperv_ubuntu_vm_host_root_dir:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu
      hyperv_ubuntu_vm_host_vm_dir:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\vm
      hyperv_ubuntu_vm_host_image_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\noble-server-cloudimg-amd64.img
      hyperv_ubuntu_vm_host_vhdx_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu.vhdx
      hyperv_ubuntu_vm_host_seed_iso_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-cidata.iso
      hyperv_ubuntu_vm_host_metadata_path:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_vm\server-225-ubuntu\server-225-ubuntu-state.json
      hyperv_ubuntu_vm_controller_staging_dir:
        type: str
      hyperv_ubuntu_vm_controller_user_data_path:
        type: str
      hyperv_ubuntu_vm_controller_meta_data_path:
        type: str
      hyperv_ubuntu_vm_controller_seed_iso_path:
        type: str
      hyperv_ubuntu_vm_windows_package_qemu:
        type: str
        default: qemu
      hyperv_ubuntu_vm_controller_iso_python_package:
        type: str
        default: pycdlib
      controller_ssh_public_key_path:
        type: str
        default: "~/.ssh/id_ed25519_ansible.pub"
