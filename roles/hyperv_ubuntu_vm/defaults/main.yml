---
hyperv_ubuntu_vm_state: present
hyperv_ubuntu_vm_name: >-
  {{ (physical_node | default(inventory_hostname | regex_replace('-win$', ''))) ~ '-ubuntu' }}
hyperv_ubuntu_vm_inventory_host: "{{ hyperv_ubuntu_vm_name }}"
hyperv_ubuntu_vm_generation: 2
hyperv_ubuntu_vm_cpus: 4
hyperv_ubuntu_vm_memory: "8G"
hyperv_ubuntu_vm_disk: "40G"
hyperv_ubuntu_vm_switch_name: >-
  {{
    (
      (hyperv_config | default({})).guest_switch_name
      if (
        ((hyperv_config | default({})).internal_ics_switch_enabled | default(false) | bool)
        and
        (((hyperv_config | default({})).guest_network_mode | default('ics')) in ['ics', 'routed_private_subnet'])
      )
      else (hyperv_config | default({})).switch_name
    ) | default('External')
  }}
hyperv_ubuntu_vm_bootstrap_user: joshc
hyperv_ubuntu_vm_hostname: "{{ hyperv_ubuntu_vm_name }}"
hyperv_ubuntu_vm_ssh_port: 22
hyperv_ubuntu_vm_python_interpreter: /usr/bin/python3
hyperv_ubuntu_vm_secure_boot_template: "MicrosoftUEFICertificateAuthority"
hyperv_ubuntu_vm_secure_boot_enabled: false
hyperv_ubuntu_vm_verify_ssh: true
hyperv_ubuntu_vm_controller_ssh_verify_mode: inventory
hyperv_ubuntu_vm_wait_for_ip_retries: 60
hyperv_ubuntu_vm_wait_for_ip_delay: 10
hyperv_ubuntu_vm_wait_for_ssh_timeout: 300
hyperv_ubuntu_vm_download_timeout: 300
hyperv_ubuntu_vm_cloud_init_install_packages: false
hyperv_ubuntu_vm_cloud_init_refresh_dhcp: false
hyperv_ubuntu_vm_source_mode: azure_cloud_image
hyperv_ubuntu_vm_publish_connection_facts: true
# Azure cloud-image offline seed defaults to off on server lanes. Historical bootstrap
# used wsl.exe --mount on the Windows Hyper-V host; that path is desktop/bootstrap
# only. Hyper-V server automation must use linux_openssh_delegate (future) or
# server_iso_installer instead of WSL.
hyperv_ubuntu_vm_cloud_image_offline_seed_enabled: false
hyperv_ubuntu_vm_cloud_image_offline_seed_version: offline-seed-v2
# disabled | wsl (legacy desktop/bootstrap) | linux_openssh_delegate (OpenSSH guest)
hyperv_ubuntu_vm_cloud_image_offline_seed_mount_provider: disabled
# Inventory host for linux_openssh_delegate, e.g. hom-lab-ctl-dkr-02 on the same physical node.
hyperv_ubuntu_vm_cloud_image_offline_seed_linux_delegate_host: ""
hyperv_ubuntu_vm_cloud_image_offline_mount_partition: 1
hyperv_ubuntu_vm_cloud_image_offline_mount_name: "{{ hyperv_ubuntu_vm_name }}-root"
# WSL-only mount root when mount_provider=wsl. Do not use on Hyper-V server lanes.
hyperv_ubuntu_vm_cloud_image_offline_root_mount: >-
  /mnt/wsl/{{ hyperv_ubuntu_vm_cloud_image_offline_mount_name }}
hyperv_ubuntu_vm_bootstrap_uid: 1000
hyperv_ubuntu_vm_bootstrap_gid: "{{ hyperv_ubuntu_vm_bootstrap_uid }}"
hyperv_ubuntu_vm_grow_root_filesystem_enabled: true
ansible_troubleshooting_mode: false
debug_remote_output: false
debug_collect_component_evidence: false

hyperv_ubuntu_vm_cloud_image_url: "https://cloud-images.ubuntu.com/releases/server/24.04/release/ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz"
hyperv_ubuntu_vm_cloud_image_filename: "{{ hyperv_ubuntu_vm_cloud_image_url.split('/')[-1] }}"
hyperv_ubuntu_vm_source_vhd_name: "livecd.ubuntu-cpc.azure.vhd"
hyperv_ubuntu_vm_quick_create_image_url: >-
  https://partner-images.canonical.com/hyper-v/desktop/noble/release/current/ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
hyperv_ubuntu_vm_quick_create_image_filename: "{{ hyperv_ubuntu_vm_quick_create_image_url.split('/')[-1] }}"
hyperv_ubuntu_vm_quick_create_checksum_url: >-
  {{
    hyperv_ubuntu_vm_quick_create_image_url
    | regex_replace('/[^/]+$', '/SHA256SUMS')
  }}
hyperv_ubuntu_vm_quick_create_checksum: "cf9167f8d95e49a6ccfb09a55eb77f6f89b4bc1a2e15f04df1db57e3d1fba837"
hyperv_ubuntu_vm_quick_create_source_vhdx_name: "livecd.ubuntu-desktop-hyperv.vhdx"
hyperv_ubuntu_vm_quick_create_download_job_name: "{{ hyperv_ubuntu_vm_name }}-quick-create-download"
hyperv_ubuntu_vm_quick_create_download_retries: 960
hyperv_ubuntu_vm_quick_create_download_poll_delay: 15
hyperv_ubuntu_vm_server_iso_url: "https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso"
hyperv_ubuntu_vm_server_iso_filename: "{{ hyperv_ubuntu_vm_server_iso_url.split('/')[-1] }}"
hyperv_ubuntu_vm_server_iso_checksum_url: "https://releases.ubuntu.com/24.04/SHA256SUMS"
hyperv_ubuntu_vm_server_iso_checksum: "e907d92eeec9df64163a7e454cbc8d7755e8ddc7ed42f99dbc80c40f1a138433"
hyperv_ubuntu_vm_server_iso_download_job_name: "{{ hyperv_ubuntu_vm_name }}-server-iso-download"
hyperv_ubuntu_vm_server_iso_download_retries: 960
hyperv_ubuntu_vm_server_iso_download_poll_delay: 15
hyperv_ubuntu_vm_server_iso_autoinstall_enabled: true
# auto keeps installer media attached for new or in-progress installer VMs.
# detached is the day-2 state for already-installed server-ISO guests.
hyperv_ubuntu_vm_server_iso_installer_media_state: auto

# Shared Hyper-V Cache Infrastructure (Plan 00b)
# Central Windows share for ISOs, cloud images, and remastered installers.
# Eliminates slow Mac-controller scp uploads and enables reuse across hosts.
hyperv_ubuntu_vm_shared_cache_enabled: true
hyperv_ubuntu_vm_shared_cache_unc: "\\\\hom-lab-ctl-hvh-02\\public\\hyperv-cache"
hyperv_ubuntu_vm_shared_cache_ubuntu_isos: "{{ hyperv_ubuntu_vm_shared_cache_unc }}\\ubuntu-isos"
hyperv_ubuntu_vm_shared_cache_cloud_images: "{{ hyperv_ubuntu_vm_shared_cache_unc }}\\ubuntu-cloud-images"
hyperv_ubuntu_vm_shared_cache_remastered_isos: "{{ hyperv_ubuntu_vm_shared_cache_unc }}\\remastered-isos"
hyperv_ubuntu_vm_shared_cache_staging: "{{ hyperv_ubuntu_vm_shared_cache_unc }}\\staging"
# Remaster delegate host: auto-detect (Ubuntu VM > Windows > Mac)
# Set to specific inventory_hostname to force delegate, or 'auto' for detection
hyperv_ubuntu_vm_remaster_delegate_host: auto
hyperv_ubuntu_vm_remaster_delegate_prefer_ubuntu: true
hyperv_ubuntu_vm_remaster_delegate_prefer_windows: true
hyperv_ubuntu_vm_server_iso_customization_version: autoinstall-v13-cdrom-kernel-path
hyperv_ubuntu_vm_server_iso_kernel_args: autoinstall subiquity.autoinstallpath=cdrom/autoinstall.yaml
hyperv_ubuntu_vm_autoinstall_locale: en_US.UTF-8
hyperv_ubuntu_vm_autoinstall_keyboard_layout: us
hyperv_ubuntu_vm_autoinstall_password: "{{ win_password | default('Pass@w0rd1') }}"
hyperv_ubuntu_vm_autoinstall_password_hash_salt: >-
  {{ hyperv_ubuntu_vm_name | hash('sha256') | regex_replace('^(.{16}).*$', '\1') }}
hyperv_ubuntu_vm_autoinstall_updates: all
hyperv_ubuntu_vm_autoinstall_network_interface_name: eth0
hyperv_ubuntu_vm_autoinstall_network_method: dhcp
hyperv_ubuntu_vm_autoinstall_network_ipv4: "192.168.137.10"
hyperv_ubuntu_vm_autoinstall_network_prefix_length: 24
hyperv_ubuntu_vm_autoinstall_network_gateway4: "{{ ((hyperv_config | default({})).guest_gateway_ipv4 | default('192.168.137.1')).split('/')[0] }}"
hyperv_ubuntu_vm_autoinstall_network_dns_servers:
  - "192.168.50.1"

hyperv_ubuntu_vm_host_root_dir: "C:\\ProgramData\\Ansible\\hyperv_ubuntu_vm\\{{ hyperv_ubuntu_vm_name }}"
hyperv_ubuntu_vm_host_vm_dir: "{{ hyperv_ubuntu_vm_host_root_dir }}\\vm"
hyperv_ubuntu_vm_host_archive_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_cloud_image_filename }}"
hyperv_ubuntu_vm_host_image_path: "{{ hyperv_ubuntu_vm_host_archive_path }}"
hyperv_ubuntu_vm_host_source_vhd_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_source_vhd_name }}"
hyperv_ubuntu_vm_host_quick_create_archive_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_quick_create_image_filename }}"
hyperv_ubuntu_vm_host_quick_create_source_vhdx_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_quick_create_source_vhdx_name }}"
hyperv_ubuntu_vm_host_server_iso_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_server_iso_filename }}"
hyperv_ubuntu_vm_host_server_iso_custom_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_name }}-autoinstall.iso"
hyperv_ubuntu_vm_host_server_iso_custom_signature_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_name }}-autoinstall.signature"
hyperv_ubuntu_vm_host_vhdx_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_name }}.vhdx"
hyperv_ubuntu_vm_host_seed_iso_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_name }}-cidata.iso"
hyperv_ubuntu_vm_host_metadata_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\{{ hyperv_ubuntu_vm_name }}-state.json"
hyperv_ubuntu_vm_host_offline_seed_script_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\azure-offline-seed.sh"
hyperv_ubuntu_vm_host_offline_seed_signature_path: "{{ hyperv_ubuntu_vm_host_root_dir }}\\azure-offline-seed.signature"

hyperv_ubuntu_vm_controller_host: "{{ groups['execution_nodes'][0] }}"
hyperv_ubuntu_vm_controller_cache_dir: >-
  {{ hostvars[hyperv_ubuntu_vm_controller_host].dotfiles_user_home }}/.local/state/dotfile-vnext/hyperv_iso_work
hyperv_ubuntu_vm_controller_staging_dir: >-
  {{ hostvars[hyperv_ubuntu_vm_controller_host].dotfiles_user_home }}/.local/state/dotfile-vnext/hyperv_ubuntu_vm/{{ hyperv_ubuntu_vm_name }}
hyperv_ubuntu_vm_controller_seed_dir: "{{ hyperv_ubuntu_vm_controller_staging_dir }}/seed"
hyperv_ubuntu_vm_controller_user_data_path: "{{ hyperv_ubuntu_vm_controller_seed_dir }}/user-data"
hyperv_ubuntu_vm_controller_meta_data_path: "{{ hyperv_ubuntu_vm_controller_seed_dir }}/meta-data"
hyperv_ubuntu_vm_controller_seed_iso_path: "{{ hyperv_ubuntu_vm_controller_staging_dir }}/{{ hyperv_ubuntu_vm_name }}-cidata.iso"
hyperv_ubuntu_vm_controller_seed_signature_path: "{{ hyperv_ubuntu_vm_controller_staging_dir }}/seed.signature"
hyperv_ubuntu_vm_controller_server_iso_cache_path: "{{ hyperv_ubuntu_vm_controller_cache_dir }}/{{ hyperv_ubuntu_vm_server_iso_filename }}"
hyperv_ubuntu_vm_controller_server_iso_extract_dir: "{{ hyperv_ubuntu_vm_controller_cache_dir }}/{{ hyperv_ubuntu_vm_name }}-server-iso-extracted"
hyperv_ubuntu_vm_controller_server_iso_custom_dir: "{{ hyperv_ubuntu_vm_controller_cache_dir }}/{{ hyperv_ubuntu_vm_name }}-server-iso-custom"
hyperv_ubuntu_vm_controller_server_iso_custom_path: "{{ hyperv_ubuntu_vm_controller_cache_dir }}/{{ hyperv_ubuntu_vm_name }}-autoinstall.iso"
hyperv_ubuntu_vm_controller_server_iso_custom_signature_path: "{{ hyperv_ubuntu_vm_controller_cache_dir }}/{{ hyperv_ubuntu_vm_name }}-server-iso.signature"
hyperv_ubuntu_vm_controller_server_iso_efi_image_path: "{{ hyperv_ubuntu_vm_controller_server_iso_custom_dir }}/efi-partition.img"
hyperv_ubuntu_vm_controller_iso_command: /usr/bin/hdiutil
hyperv_ubuntu_vm_controller_xorriso_command: /usr/local/bin/xorriso
controller_ssh_public_key_path: "~/.ssh/id_ed25519_ansible.pub"
