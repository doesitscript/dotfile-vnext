---
- name: Resolve troubleshooting artifact stamp for Multipass Windows collection
  ansible.builtin.set_fact:
    __troubleshooting_artifact_stamp: >-
      {{
        troubleshooting_artifact_stamp
        if (troubleshooting_artifact_stamp | default('') | length > 0)
        else lookup('pipe', 'date +%Y%m%d-%H%M%S')
      }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting

- name: Define Multipass Windows artifact root for this run
  ansible.builtin.set_fact:
    __multipass_troubleshooting_artifact_dir: >-
      {{
        troubleshooting_artifact_root ~ '/' ~
        multipass_troubleshooting_scenario ~ '/' ~
        inventory_hostname ~ '/' ~
        hostvars['localhost']['__troubleshooting_artifact_stamp']
      }}
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting

- name: Ensure local artifact directories exist for Multipass Windows collection
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  loop:
    - "{{ __multipass_troubleshooting_artifact_dir }}"
    - "{{ __multipass_troubleshooting_artifact_dir }}/event_logs"
    - "{{ __multipass_troubleshooting_artifact_dir }}/installer_logs"
    - "{{ __multipass_troubleshooting_artifact_dir }}/app_logs"
    - "{{ __multipass_troubleshooting_artifact_dir }}/probes"
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting

- name: Collect Multipass Windows event entries
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $start = (Get-Date).AddMinutes(-30)
      $events = Get-WinEvent -FilterHashtable @{
        LogName = 'Application'
        StartTime = $start
      } -ErrorAction SilentlyContinue |
      Where-Object {
        $_.ProviderName -match 'Multipass|Hyper-V|HyperV|vmcompute|hns'
      } |
      Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message

      $events | ConvertTo-Json -Depth 5
  register: __multipass_event_entries
  changed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_event_logs

- name: Save Multipass Windows event entries locally
  ansible.builtin.copy:
    content: "{{ (__multipass_event_entries.output | default(['[]'])) | first }}"
    dest: "{{ __multipass_troubleshooting_artifact_dir }}/event_logs/multipass_events.json"
    mode: "0644"
  delegate_to: localhost
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_event_logs

- name: Collect Multipass Windows probe bundle
  ansible.windows.win_powershell:
    error_action: continue
    script: |
      $result = [ordered]@{}

      $result.multipass_version = (cmd.exe /c "multipass version 2>&1" | Out-String).Trim()
      $result.multipass_networks = (cmd.exe /c "multipass networks 2>&1" | Out-String).Trim()
      $result.multipass_networks_verbose = (cmd.exe /c "multipass -vvv networks 2>&1" | Out-String).Trim()
      $result.hypervisor_present = (Get-CimInstance Win32_ComputerSystem).HypervisorPresent
      $result.hyperv_hypervisor_feature = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-Hypervisor |
        Select-Object FeatureName, State
      $result.hyperv_feature = Get-WindowsFeature Hyper-V |
        Select-Object Name, InstallState
      $result.vm_switches = Get-VMSwitch |
        Select-Object Name, SwitchType, NetAdapterInterfaceDescription
      $result.net_adapters = Get-NetAdapter |
        Select-Object Name, InterfaceDescription, Status, MacAddress
      $result.winrm_service = Get-Service WinRM |
        Select-Object Status, Name
      $result.winrm_listener = (winrm enumerate winrm/config/Listener | Out-String).Trim()
      $result.test_wsman = try {
        Test-WSMan localhost | Select-Object wsmid, ProtocolVersion, ProductVendor, ProductVersion
      } catch {
        $_ | Out-String
      }
      $result.bcdedit = (bcdedit /enum '{current}' | Out-String).Trim()

      $result | ConvertTo-Json -Depth 6
  register: __multipass_probe_bundle
  changed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_probe_bundle
    - multipass_host_probes

- name: Save Multipass Windows probe bundle locally
  ansible.builtin.copy:
    content: "{{ (__multipass_probe_bundle.output | default(['{}'])) | first }}"
    dest: "{{ __multipass_troubleshooting_artifact_dir }}/probes/multipass_probe_bundle.json"
    mode: "0644"
  delegate_to: localhost
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_probe_bundle
    - multipass_host_probes

- name: Resolve Windows APPDATA and TEMP paths for Multipass artifact collection
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $result = [ordered]@{
        appdata = [Environment]::GetFolderPath('ApplicationData')
        temp = $env:TEMP
      }

      $result | ConvertTo-Json -Depth 3
  register: __multipass_windows_paths
  changed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_installer_logs
    - multipass_gui_logs

- name: Parse Windows APPDATA and TEMP paths for Multipass artifact collection
  ansible.builtin.set_fact:
    __multipass_windows_paths_json: "{{ ((__multipass_windows_paths.output | default(['{}'])) | first) | from_json }}"
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_installer_logs
    - multipass_gui_logs

- name: Find candidate Multipass installer logs in TEMP
  ansible.windows.win_find:
    paths:
      - "{{ __multipass_windows_paths_json['temp'] }}"
    patterns:
      - "*multipass*"
      - "MSI*.LOG"
    recurse: false
    file_type: file
  register: __multipass_temp_logs
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_installer_logs

- name: Fetch candidate Multipass installer logs
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ __multipass_troubleshooting_artifact_dir }}/installer_logs/"
    flat: false
  loop: "{{ __multipass_temp_logs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: __multipass_installer_log_fetch
  failed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_installer_logs

- name: Check Multipass GUI log path
  ansible.windows.win_stat:
    path: "{{ __multipass_windows_paths_json['appdata'] }}\\com.canonical\\Multipass GUI\\multipass_gui.log"
  register: __multipass_gui_log_stat
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_gui_logs

- name: Fetch Multipass GUI log
  ansible.builtin.fetch:
    src: "{{ __multipass_windows_paths_json['appdata'] }}\\com.canonical\\Multipass GUI\\multipass_gui.log"
    dest: "{{ __multipass_troubleshooting_artifact_dir }}/app_logs/"
    flat: false
  when: __multipass_gui_log_stat.stat.exists | default(false)
  register: __multipass_gui_log_fetch
  failed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
    - multipass_gui_logs

- name: Report saved Multipass troubleshooting artifact location
  ansible.builtin.debug:
    msg:
      troubleshooting_artifact_dir: "{{ __multipass_troubleshooting_artifact_dir }}"
      surface_tag_map:
        multipass_event_logs:
          - event_logs/multipass_events.json
        multipass_probe_bundle:
          - probes/multipass_probe_bundle.json
        multipass_host_probes:
          - probes/multipass_probe_bundle.json
        multipass_installer_logs:
          - installer_logs/*
        multipass_gui_logs:
          - app_logs/*
      collected_artifacts:
        - event_logs/multipass_events.json
        - probes/multipass_probe_bundle.json
        - installer_logs/*
        - app_logs/*
      missing_or_optional_artifacts: >-
        {{
          ['Multipass GUI log missing']
          if not (__multipass_gui_log_stat.stat.exists | default(false))
          else []
        }}
  changed_when: false
  tags:
    - multipass_troubleshooting
    - collect_troubleshooting
