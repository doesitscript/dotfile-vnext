---
fzf_tab_completion_state: absent
fzf_tab_completion_user_home: "{{ ansible_env.HOME }}"
fzf_tab_completion_clone_dir: "{{ fzf_tab_completion_user_home }}/.local/share/fzf-tab-completion"
fzf_tab_completion_clone_repo: https://github.com/lincheney/fzf-tab-completion.git
fzf_tab_completion_bin_dir: "{{ fzf_tab_completion_user_home }}/bin"
fzf_tab_completion_pythonpath_dir: "{{ fzf_tab_completion_user_home }}/.local/share/homelab-pythonpath"
fzf_tab_completion_bashrc_shell_completion: "{{ fzf_tab_completion_user_home }}/.bashrc.d/shell-completion.bash"
fzf_tab_completion_brew_packages:
  - fzf
  - gawk
  - grep
  - gnu-sed
  - coreutils
