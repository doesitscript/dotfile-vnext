---
argument_specs:
  main:
    short_description: "Deploy a Terratest Hello-World quickstart scaffold on macOS"
    options:
      terratest_quickstart_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether the Terratest quickstart tree should exist."
      terratest_quickstart_root:
        type: path
        required: false
        description:
          - "Absolute path for the quickstart project."
      terratest_quickstart_module_path:
        type: str
        default: github.com/doesitscript/terratest-quickstart
        description:
          - "Go module path used for go mod init when go.mod is missing."
      terratest_quickstart_go_package:
        type: str
        default: github.com/gruntwork-io/terratest@latest
        description:
          - "Terratest module version to pull with go get."
      terratest_quickstart_verify:
        type: bool
        default: true
        description:
          - "Verify go.mod lists terratest after present convergence."
