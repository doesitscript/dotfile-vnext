---
# docker_client/windows.yml — Install Docker CLI + Compose on Windows, create SSH context.
# The engine runs on a managed Linux VM host; authorize this Windows host's SSH
# key on that engine before creating the Docker context.

- name: Ensure Windows SSH key pair exists for Docker context
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $sshDir  = "$env:USERPROFILE\.ssh"
      $keyPath = "$sshDir\id_ed25519"
      if (-not (Test-Path $keyPath)) {
        New-Item -ItemType Directory -Path $sshDir -Force | Out-Null
        # Windows OpenSSH ssh-keygen reads the passphrase from the console (not stdin),
        # so piping/redirecting stdin hangs in WinRM sessions (no terminal attached).
        # Wrap in cmd.exe: """" is cmd's way to pass an empty string as -N argument.
        $escapedPath = $keyPath -replace '"', '""'
        cmd /c "ssh-keygen -t ed25519 -f ""$escapedPath"" -N """" -q 2>&1" | Out-Null
        $Ansible.Changed = $true
      }
      $pubKey = (Get-Content "$keyPath.pub" -Raw -ErrorAction Stop).Trim()
      $Ansible.Result = @{
        pub_key = $pubKey
        pub_key_prefix = $pubKey.Substring(0, [Math]::Min(40, $pubKey.Length))
      }
  register: _win_docker_keypair
  tags: [docker, docker-client]

- name: Authorize Windows SSH key on Linux Docker engine host
  ansible.posix.authorized_key:
    user: "{{ docker_engine_ssh_user }}"
    key: "{{ _win_docker_keypair.result.pub_key }}"
    state: present
  delegate_to: "{{ docker_engine_ssh_host }}"
  tags: [docker, docker-client]

- name: Ensure Windows SSH client config can reach Docker engine context host
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $sshDir = "$env:USERPROFILE\.ssh"
      $configPath = "$sshDir\config"
      $keyPath = "$sshDir\id_ed25519"
      $contextName = '{{ docker_context_name }}'
      $contextHost = '{{ docker_engine_ssh_context_host }}'
      $begin = "# BEGIN ANSIBLE docker context $contextName"
      $end = "# END ANSIBLE docker context $contextName"

      New-Item -ItemType Directory -Path $sshDir -Force | Out-Null

      $block = @"
      $begin
      Host $contextHost
          HostName $contextHost
          User {{ docker_engine_ssh_user }}
          Port {{ docker_engine_ssh_port }}
          IdentityFile $keyPath
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking no
          UserKnownHostsFile NUL
          ConnectTimeout 10
      $end
      "@.Trim()

      $current = ''
      if (Test-Path $configPath) {
        $current = Get-Content -LiteralPath $configPath -Raw -ErrorAction Stop
      }

      $pattern = "(?ms)^" + [regex]::Escape($begin) + ".*?^" + [regex]::Escape($end) + "\r?\n?"
      if ($current -match $pattern) {
        $updated = [regex]::Replace($current, $pattern, $block + [Environment]::NewLine)
      } elseif ([string]::IsNullOrWhiteSpace($current)) {
        $updated = $block + [Environment]::NewLine
      } else {
        $updated = $current.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $block + [Environment]::NewLine
      }

      if ($updated -ne $current) {
        Set-Content -LiteralPath $configPath -Value $updated -Encoding UTF8
        $Ansible.Changed = $true
      }
      $Ansible.Result = @{
        config_path = $configPath
        context_host = $contextHost
      }
  tags: [docker, docker-client]

- name: Install Docker CLI via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: docker-cli
    state: present

- name: Install Docker Compose via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: docker-compose
    state: present

- name: Ensure Docker SSH context on Windows ({{ docker_context_name }})
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $contextName = '{{ docker_context_name }}'
      $sshUri = 'ssh://{{ docker_engine_ssh_user }}@{{ docker_engine_ssh_context_host }}:{{ docker_engine_ssh_port }}'

      $existing = (docker context inspect $contextName 2>$null | ConvertFrom-Json -ErrorAction SilentlyContinue)
      $currentHost = ''
      if ($existing) { $currentHost = $existing.Endpoints.docker.Host }

      if ($currentHost -eq $sshUri) {
        $Ansible.Result = @{ context = $contextName; host = $sshUri; action = 'unchanged' }
      } else {
        $Ansible.Changed = $true
        if ($existing) { docker context rm $contextName -f 2>&1 | Out-Null }
        docker context create $contextName --docker "host=$sshUri" 2>&1 | Out-Null
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to create Docker context"
          $Ansible.Failed = $true
          Exit 1
        }
        docker context use $contextName 2>&1 | Out-Null
        $Ansible.Result = @{ context = $contextName; host = $sshUri; action = 'created' }
      }

- name: Report Docker client configuration (Windows)
  ansible.builtin.debug:
    msg: >-
      Context: {{ docker_context_name }}
      | Engine: ssh://{{ docker_engine_ssh_user }}@{{ docker_engine_ssh_context_host }}:{{ docker_engine_ssh_port }}
