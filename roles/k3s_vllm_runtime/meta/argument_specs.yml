---
argument_specs:
  main:
    short_description: Deploy vLLM OpenAI-compatible runtime on K3s
    options:
      k3s_vllm_runtime_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the vLLM runtime.
      k3s_vllm_runtime_namespace:
        type: str
        default: vllm-runtime
        description: Kubernetes namespace for vLLM.
      k3s_vllm_runtime_model:
        type: str
        default: Qwen/Qwen3-0.6B
        description: Hugging Face model ID passed to vLLM.
      k3s_vllm_runtime_gpu_count:
        type: int
        default: 1
        description: Number of NVIDIA GPUs requested by the runtime pod.
      k3s_vllm_runtime_hf_cache_backing_capacity_verified:
        type: bool
        default: false
        description: >-
          Fail-closed acknowledgement that the PVC request has verified
          physical backing capacity; a bound PVC alone is insufficient.
      k3s_vllm_runtime_hf_cache_backing_capacity_evidence_ref:
        type: str
        default: ""
        description: >-
          Repository receipt or approved evidence reference proving the
          selected cache backing capacity and rollback basis.
