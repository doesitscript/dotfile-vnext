---
argument_specs:
  main:
    short_description: Deploy vLLM OpenAI-compatible runtime on K3s
    options:
      k3s_vllm_runtime_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Lifecycle state for the vLLM runtime.
      k3s_vllm_runtime_namespace:
        type: str
        default: vllm-runtime
        description: Kubernetes namespace for vLLM.
      k3s_vllm_runtime_model:
        type: str
        default: Qwen/Qwen3-0.6B
        description: Hugging Face model ID passed to vLLM.
      k3s_vllm_runtime_gpu_count:
        type: int
        default: 1
        description: Number of NVIDIA GPUs requested by the runtime pod.
      k3s_vllm_runtime_hf_cache_backing_capacity_verified:
        type: bool
        default: false
        description: >-
          Fail-closed acknowledgement that the PVC request has verified
          physical backing capacity; a bound PVC alone is insufficient.
      k3s_vllm_runtime_hf_cache_backing_capacity_evidence_ref:
        type: str
        default: ""
        description: >-
          Repository receipt or approved evidence reference proving the
          selected cache backing capacity and rollback basis.
      k3s_vllm_runtime_hf_cache_backend:
        type: str
        default: pvc
        choices:
          - pvc
          - host_path
        description: >-
          Backing selected for the Hugging Face cache. host_path retains the
          source PVC and requires the explicit migration safety gates.
      k3s_vllm_runtime_hf_cache_host_mount_path:
        type: path
        default: /mnt/k3s-cache
        description: Exact verified mountpoint that owns the selected cache path.
      k3s_vllm_runtime_hf_cache_host_path:
        type: path
        default: /mnt/k3s-cache/hf
        description: Host directory mounted at the settled HF cache path.
      k3s_vllm_runtime_hf_cache_container_path:
        type: path
        default: /mnt/k3s-cache/hf
        description: >-
          Container mount path for the NVMe-backed Hugging Face cache. Keep this
          aligned with the absolute HF_HUB_CACHE path.
      k3s_vllm_runtime_hf_hub_cache_container_path:
        type: path
        default: /mnt/k3s-cache/hf/hub
        description: >-
          Absolute HF_HUB_CACHE path used by the vLLM container (C1). Must be
          under k3s_vllm_runtime_hf_cache_container_path. Never use
          TRANSFORMERS_CACHE.
      k3s_vllm_runtime_hf_cache_migration_apply:
        type: bool
        default: false
        description: >-
          Explicit mutation gate for quiescing vLLM and copying the retained
          source PVC cache to the verified host path.
      k3s_vllm_runtime_hf_cache_source_cleanup_apply:
        type: bool
        default: false
        description: >-
          Separate destructive-data gate for clearing the old root-backed PVC
          only after host-path health and model checks pass. Rollback recopies
          from the retained destination before restoring the prior deployment.
      k3s_vllm_runtime_hf_cache_retain_source_pvc:
        type: bool
        default: true
        description: >-
          Required data-safety acknowledgement that the original PVC remains
          available as the reversal source after host-path cutover.
      k3s_vllm_runtime_node_name:
        type: str
        default: ""
        description: Exact Kubernetes Node object used for post-cutover pressure checks.
