---
k3s_vllm_runtime_state: present
k3s_vllm_runtime_namespace: vllm-runtime
k3s_vllm_runtime_name: vllm-primary
k3s_vllm_runtime_image: vllm/vllm-openai:latest
k3s_vllm_runtime_model: Qwen/Qwen3-0.6B
k3s_vllm_runtime_served_model_name: experiment
k3s_vllm_runtime_replicas: 1
k3s_vllm_runtime_service_port: 8000
k3s_vllm_runtime_container_port: 8000
k3s_vllm_runtime_gpu_resource: nvidia.com/gpu
k3s_vllm_runtime_gpu_count: 1
k3s_vllm_runtime_cpu_request: "2"
k3s_vllm_runtime_memory_request: 8Gi
k3s_vllm_runtime_cpu_limit: "8"
k3s_vllm_runtime_memory_limit: 32Gi
k3s_vllm_runtime_hf_cache_size: 120Gi
k3s_vllm_runtime_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_vllm_runtime_hf_token: "{{ vault_hf_token | default('') }}"
k3s_vllm_runtime_extra_args: []
