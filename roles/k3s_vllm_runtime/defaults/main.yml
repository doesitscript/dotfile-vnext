---
k3s_vllm_runtime_state: present
k3s_vllm_runtime_namespace: vllm-runtime
k3s_vllm_runtime_name: vllm-primary
k3s_vllm_runtime_image: vllm/vllm-openai:latest
k3s_vllm_runtime_model: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
k3s_vllm_runtime_served_model_name: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
k3s_vllm_runtime_replicas: 1
k3s_vllm_runtime_deployment_strategy_type: Recreate
k3s_vllm_runtime_service_port: 8000
k3s_vllm_runtime_container_port: 8000
k3s_vllm_runtime_runtime_class_name: nvidia
k3s_vllm_runtime_gpu_resource: nvidia.com/gpu
k3s_vllm_runtime_gpu_count: 1
k3s_vllm_runtime_cpu_request: "2"
k3s_vllm_runtime_memory_request: 8Gi
k3s_vllm_runtime_cpu_limit: "8"
k3s_vllm_runtime_memory_limit: 32Gi
k3s_vllm_runtime_hf_cache_size: 120Gi
k3s_vllm_runtime_kubeconfig: /etc/rancher/k3s/k3s.yaml
# Prefer vault_hf_token from vault/shared.vault.yml (loaded in tasks/load_vault.yml).
k3s_vllm_runtime_hf_token: ""
k3s_vllm_runtime_enable_auto_tool_choice: false
k3s_vllm_runtime_tool_call_parser: ""
# Extra vLLM CLI args appended after model/host/port.
# Allowed recovery knob: --gpu-memory-utilization (within free VRAM).
# Do not trim model context length unless the operator explicitly requests it.
k3s_vllm_runtime_extra_args: []
