---
argument_specs:
  main:
    short_description: Manage a Multipass-backed Ubuntu VM on a Windows Hyper-V host.
    options:
      multipass_ubuntu_vm_state:
        type: str
        default: present
        choices: [present, absent]
      multipass_ubuntu_vm_name:
        type: str
        default: server-225-ubuntu
      multipass_ubuntu_vm_inventory_host:
        type: str
        default: server-225-ubuntu
      multipass_ubuntu_vm_image:
        type: str
        default: "24.04"
      multipass_ubuntu_vm_cpus:
        type: int
        default: 4
      multipass_ubuntu_vm_memory:
        type: str
        default: "8G"
      multipass_ubuntu_vm_disk:
        type: str
        default: "40G"
      multipass_ubuntu_vm_timeout:
        type: int
        default: 900
      multipass_ubuntu_vm_bridged:
        type: bool
        default: true
      multipass_ubuntu_vm_bridge_adapter_name:
        type: str
        default: ""
      multipass_ubuntu_vm_disable_wsl_feature:
        type: bool
        default: false
      multipass_ubuntu_vm_user:
        type: str
        default: ubuntu
      multipass_ubuntu_vm_hostname:
        type: str
        default: server-225-ubuntu
      multipass_ubuntu_vm_ssh_port:
        type: int
        default: 22
      multipass_ubuntu_vm_python_interpreter:
        type: str
        default: /usr/bin/python3
      multipass_ubuntu_vm_windows_version:
        type: str
        default: "1.16.0"
      multipass_ubuntu_vm_windows_installer_filename:
        type: str
        default: multipass-1.16.0+win-win64.msi
      multipass_ubuntu_vm_windows_installer_url:
        type: str
        default: https://github.com/canonical/multipass/releases/download/v1.16.0/multipass-1.16.0+win-win64.msi
      multipass_ubuntu_vm_windows_installer_path:
        type: str
        default: C:\ProgramData\Ansible\multipass\multipass-1.16.0+win-win64.msi
      multipass_ubuntu_vm_cloud_init_dir:
        type: str
        default: C:\ProgramData\Ansible\multipass
      multipass_ubuntu_vm_cloud_init_path:
        type: str
        default: C:\ProgramData\Ansible\multipass\server-225-ubuntu-cloud-init.yaml
      multipass_ubuntu_vm_metadata_path:
        type: str
        default: C:\ProgramData\Ansible\multipass\server-225-ubuntu-state.json
      multipass_ubuntu_vm_verify_ssh:
        type: bool
        default: true
      multipass_ubuntu_vm_wait_for_ssh_timeout:
        type: int
        default: 300
      controller_ssh_public_key_path:
        type: str
        default: "~/.ssh/id_ed25519_ansible.pub"
