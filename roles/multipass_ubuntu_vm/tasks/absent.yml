---
- name: Probe current Multipass VM state before removal
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $name = '{{ multipass_ubuntu_vm_name }}'
      $raw = cmd.exe /c "multipass info $name --format json 2>NUL"
      if ($LASTEXITCODE -eq 0 -and $raw) {
        $info = $raw | ConvertFrom-Json
        $node = $info.info.$name
        $Ansible.Result = @{
          exists = $true
          state = $node.state
        }
      } else {
        $Ansible.Result = @{
          exists = $false
          state = $null
        }
      }
  register: _multipass_vm_absent_probe
  changed_when: false
  failed_when: false

- name: Delete and purge Multipass VM when present
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = (& multipass delete '{{ multipass_ubuntu_vm_name }}' --purge 2>&1 | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = $result
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Changed = $true
      $Ansible.Result = $result
  when: _multipass_vm_absent_probe.result.exists | default(false)

- name: Remove Multipass cloud-init bootstrap file
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_cloud_init_path }}"
    state: absent

- name: Remove Multipass metadata file
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_metadata_path }}"
    state: absent

- name: Mark Multipass VM inventory host as not SSH-configured
  ansible.builtin.set_fact:
    ssh_configured: false
    cacheable: true
  delegate_to: "{{ multipass_ubuntu_vm_inventory_host }}"
  delegate_facts: true

- name: Report Multipass VM removal summary
  ansible.builtin.debug:
    msg:
      vm_name: "{{ multipass_ubuntu_vm_name }}"
      removed: "{{ _multipass_vm_absent_probe.result.exists | default(false) }}"
