---
- name: Probe current Multipass VM state before removal
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $name = '{{ multipass_ubuntu_vm_name }}'
      $raw = cmd.exe /c "multipass info $name --format json 2>NUL"
      if ($LASTEXITCODE -eq 0 -and $raw) {
        $info = $raw | ConvertFrom-Json
        $node = $info.info.$name
        $Ansible.Result = @{
          exists = $true
          state = $node.state
        }
      } else {
        $Ansible.Result = @{
          exists = $false
          state = $null
        }
      }
  register: _multipass_vm_absent_probe
  changed_when: false
  failed_when: false

- name: Probe installed Multipass package state before uninstall
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = [ordered]@{
        installed = $false
        version = $null
        uninstall_string = $null
        product_id = $null
      }

      $paths = @(
        'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
        'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
      )

      foreach ($path in $paths) {
        $entry = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue |
          Where-Object { $_.DisplayName -like 'Multipass*' } |
          Select-Object -First 1
        if ($entry) {
          $result.installed = $true
          $result.version = $entry.DisplayVersion
          $result.uninstall_string = $entry.UninstallString
          $result.product_id = $entry.PSChildName
          break
        }
      }

      $Ansible.Result = $result
  register: _multipass_package_absent_probe
  changed_when: false

- name: Delete and purge Multipass VM when present
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = (& multipass delete '{{ multipass_ubuntu_vm_name }}' --purge 2>&1 | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = $result
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Changed = $true
      $Ansible.Result = $result
  when: _multipass_vm_absent_probe.result.exists | default(false)

- name: Remove Multipass cloud-init bootstrap file
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_cloud_init_path }}"
    state: absent

- name: Remove Multipass metadata file
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_metadata_path }}"
    state: absent

- name: Stop Multipass Windows service before uninstall
  ansible.windows.win_service:
    name: Multipass
    state: stopped
  failed_when: false
  when: _multipass_package_absent_probe.result.installed | default(false)

- name: Terminate lingering Multipass daemon process before uninstall
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $killed = @()
      Get-Process -Name multipassd -ErrorAction SilentlyContinue | ForEach-Object {
        Stop-Process -Id $_.Id -Force
        $killed += @{
          id = $_.Id
          name = $_.Name
        }
      }

      if ($killed.Count -gt 0) {
        $Ansible.Changed = $true
      }

      $Ansible.Result = @{
        terminated = $killed
      }
  when: _multipass_package_absent_probe.result.installed | default(false)

- name: Uninstall Multipass Windows package when present
  ansible.windows.win_package:
    provider: msi
    product_id: "{{ _multipass_package_absent_probe.result.product_id }}"
    state: absent
  when: _multipass_package_absent_probe.result.installed | default(false)

- name: Remove Multipass staging directory
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_cloud_init_dir }}"
    state: absent

- name: Mark Multipass VM inventory host as not SSH-configured
  ansible.builtin.set_fact:
    ssh_configured: false
    cacheable: true
  delegate_to: "{{ multipass_ubuntu_vm_inventory_host }}"
  delegate_facts: true

- name: Report Multipass VM removal summary
  ansible.builtin.debug:
    msg:
      vm_name: "{{ multipass_ubuntu_vm_name }}"
      removed: "{{ _multipass_vm_absent_probe.result.exists | default(false) }}"
