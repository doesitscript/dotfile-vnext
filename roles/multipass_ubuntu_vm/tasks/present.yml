---
- name: Ensure bridged Multipass VM has a bridge adapter configured
  ansible.builtin.assert:
    that:
      - not (multipass_ubuntu_vm_bridged | bool) or (multipass_ubuntu_vm_bridge_adapter_name | length > 0)
    fail_msg: >-
      Bridged Multipass VM management requires multipass_ubuntu_vm_bridge_adapter_name.

- name: Probe installed Multipass package state on Windows
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = [ordered]@{
        installed = $false
        version = $null
        uninstall_string = $null
      }

      $paths = @(
        'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
        'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
      )

      foreach ($path in $paths) {
        $entry = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue |
          Where-Object { $_.DisplayName -like 'Multipass*' } |
          Select-Object -First 1
        if ($entry) {
          $result.installed = $true
          $result.version = $entry.DisplayVersion
          $result.uninstall_string = $entry.UninstallString
          break
        }
      }

      $Ansible.Result = $result
  register: _multipass_package_probe
  changed_when: false

- name: Stop WSL before disabling the feature for Multipass migration
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      wsl --shutdown 2>$null | Out-Null
  changed_when: false
  failed_when: false
  when: multipass_ubuntu_vm_disable_wsl_feature | bool

- name: Disable WSL optional feature for Multipass migration
  ansible.windows.win_optional_feature:
    name:
      - Microsoft-Windows-Subsystem-Linux
    state: absent
  register: _multipass_wsl_feature
  when: multipass_ubuntu_vm_disable_wsl_feature | bool

- name: Reboot after removing WSL optional feature
  ansible.windows.win_reboot:
    msg: "Ansible reboot after removing WSL optional feature for Multipass migration"
    reboot_timeout: 900
  when:
    - multipass_ubuntu_vm_disable_wsl_feature | bool
    - _multipass_wsl_feature.reboot_required | default(false)

- name: Ensure Multipass cloud-init staging directory exists
  ansible.windows.win_file:
    path: "{{ multipass_ubuntu_vm_cloud_init_dir }}"
    state: directory

- name: Download official Multipass Windows installer
  ansible.windows.win_get_url:
    url: "{{ multipass_ubuntu_vm_windows_installer_url }}"
    dest: "{{ multipass_ubuntu_vm_windows_installer_path }}"
    force: false
  when: >-
    not (_multipass_package_probe.result.installed | default(false)) or
    (_multipass_package_probe.result.version | default('')) != multipass_ubuntu_vm_windows_version

- name: Install official Multipass Windows installer
  ansible.windows.win_package:
    path: "{{ multipass_ubuntu_vm_windows_installer_path }}"
    arguments: /qn
    state: present
  when: >-
    not (_multipass_package_probe.result.installed | default(false)) or
    (_multipass_package_probe.result.version | default('')) != multipass_ubuntu_vm_windows_version

- name: Report Multipass Windows log and diagnostic locations
  ansible.builtin.debug:
    msg:
      multipass_logs:
        event_viewer: "Event Viewer -> Windows Logs/Application -> filter Event source 'Multipass'"
        installer_logs: "%TEMP%\\MSI*.LOG"
        gui_log: "%APPDATA%\\com.canonical\\Multipass GUI\\multipass_gui.log"
        cli_probe: "multipass -vvv version"
        network_probe: "multipass -vvv networks"
        daemon_verbosity: >-
          Set-ItemProperty HKLM:\System\CurrentControlSet\Services\Multipass
          -Name ImagePath -Value "'C:\Program Files\Multipass\bin\multipassd.exe'
          /svc --verbosity debug"
      host_network_diagnostics:
        hyperv_switch_probe: "Get-VMSwitch"
        adapter_probe: "Get-NetAdapter"
        hypervisor_probe: "Get-CimInstance Win32_ComputerSystem | Select-Object -ExpandProperty HypervisorPresent"
        optional_feature_probe: "Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-Hypervisor"
        server_feature_probe: "Get-WindowsFeature Hyper-V"

- name: Render Multipass cloud-init bootstrap file
  ansible.windows.win_template:
    src: cloud-init-user-data.yaml.j2
    dest: "{{ multipass_ubuntu_vm_cloud_init_path }}"
    newline_sequence: "\n"

- name: Read Multipass cloud-init checksum
  ansible.windows.win_stat:
    path: "{{ multipass_ubuntu_vm_cloud_init_path }}"
    get_checksum: true
  register: _multipass_cloud_init_stat

- name: Read Multipass metadata file state
  ansible.windows.win_stat:
    path: "{{ multipass_ubuntu_vm_metadata_path }}"
  register: _multipass_metadata_stat

- name: Read Multipass metadata file content
  ansible.builtin.slurp:
    path: "{{ multipass_ubuntu_vm_metadata_path }}"
  register: _multipass_metadata_slurp
  when: _multipass_metadata_stat.stat.exists | default(false)

- name: Resolve Multipass metadata fact
  ansible.builtin.set_fact:
    _multipass_metadata: >-
      {{ (_multipass_metadata_slurp.content | b64decode | from_json)
         if (_multipass_metadata_stat.stat.exists | default(false))
         else {} }}

- name: Probe current Multipass VM state
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = [ordered]@{
        exists = $false
        state = $null
        ipv4 = $null
        cpus = $null
        memory = $null
        disk = $null
        bridged = $null
        preferred_network = $null
        multipass = $null
      }

      $cmd = Get-Command multipass -ErrorAction SilentlyContinue
      if (-not $cmd) {
        $Ansible.Result = $result
        Exit 0
      }

      $result.multipass = $cmd.Source
      $preferred = cmd.exe /c "multipass get local.bridged-network 2>NUL"
      if ($LASTEXITCODE -eq 0) {
        $result.preferred_network = ($preferred | Out-String).Trim()
      }

      $name = '{{ multipass_ubuntu_vm_name }}'
      $raw = cmd.exe /c "multipass info $name --format json 2>NUL"
      if ($LASTEXITCODE -eq 0 -and $raw) {
        $info = $raw | ConvertFrom-Json
        $node = $info.info.$name
        $result.exists = $true
        $result.state = $node.state
        if ($node.ipv4) {
          $result.ipv4 = @($node.ipv4)[0]
        }

        foreach ($setting in @('cpus', 'memory', 'disk', 'bridged')) {
          $value = cmd.exe /c "multipass get local.$name.$setting 2>NUL"
          if ($LASTEXITCODE -eq 0) {
            $result[$setting] = ($value | Out-String).Trim()
          }
        }
      }

      $Ansible.Result = $result
  register: _multipass_vm_probe
  changed_when: false

- name: Reject cloud-init drift on an existing Multipass VM
  ansible.builtin.assert:
    that:
      - (_multipass_metadata.cloud_init_checksum | default(_multipass_cloud_init_stat.stat.checksum)) == _multipass_cloud_init_stat.stat.checksum
    fail_msg: >-
      Cloud-init input changed for existing instance '{{ multipass_ubuntu_vm_name }}'.
      This role treats cloud-init as bootstrap-only. Recreate the VM with
      multipass_ubuntu_vm_state=absent then present to apply the new Day-0 config.
  when: _multipass_vm_probe.result.exists | default(false)

- name: Reject bridge adapter drift on an existing Multipass VM
  ansible.builtin.assert:
    that:
      - (_multipass_metadata.bridge_adapter_name | default(multipass_ubuntu_vm_bridge_adapter_name)) == multipass_ubuntu_vm_bridge_adapter_name
    fail_msg: >-
      Bridge adapter changed for existing instance '{{ multipass_ubuntu_vm_name }}'.
      Recreate the VM to move it to a different bridged adapter intentionally.
  when:
    - multipass_ubuntu_vm_bridged | bool
    - _multipass_vm_probe.result.exists | default(false)
    - (_multipass_metadata.bridge_adapter_name | default('')) | length > 0

- name: Reject unknown bridged-network drift on an existing Multipass VM
  ansible.builtin.assert:
    that:
      - (_multipass_vm_probe.result.preferred_network | default('')) in ['', multipass_ubuntu_vm_bridge_adapter_name]
    fail_msg: >-
      The current preferred bridged network is '{{ _multipass_vm_probe.result.preferred_network | default('unset') }}',
      not '{{ multipass_ubuntu_vm_bridge_adapter_name }}'. Recreate or manually reconcile before re-running this role.
  when:
    - multipass_ubuntu_vm_bridged | bool
    - _multipass_vm_probe.result.exists | default(false)

- name: Probe Multipass bridged-network readiness
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = [ordered]@{
        rc = 0
        stdout = ''
      }
      $out = cmd.exe /c "multipass networks 2>&1"
      $result.rc = $LASTEXITCODE
      $result.stdout = ($out | Out-String).Trim()
      $Ansible.Result = $result
  register: _multipass_networks_probe
  changed_when: false
  failed_when: false
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
  tags:
    - evidence
    - debug_resources

- name: Report Multipass bridged-network probe output when troubleshooting
  ansible.builtin.debug:
    msg:
      rc: "{{ _multipass_networks_probe.result.rc | default('not-run') }}"
      stdout: "{{ _multipass_networks_probe.result.stdout | default('no output') }}"
  when:
    - _multipass_networks_probe is defined
    - (ansible_troubleshooting_mode | bool) or
      (debug_remote_output | bool) or
      (debug_collect_component_evidence | bool)
  tags:
    - evidence
    - debug_resources

- name: Probe Hyper-V boot launch configuration when Multipass reports hypervisor disabled
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $raw = (bcdedit /enum '{current}' | Out-String)
      $launchType = ''
      if ($raw -match 'hypervisorlaunchtype\s+(\w+)') {
        $launchType = $Matches[1].ToLowerInvariant()
      }
      $Ansible.Result = @{
        launch_type = $launchType
        raw = $raw.Trim()
      }
  register: _multipass_hypervisor_boot_probe
  changed_when: false
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
    - "'Hyper-V Hypervisor is disabled' in (_multipass_networks_probe.result.stdout | default(''))"
  tags:
    - evidence
    - debug_resources

- name: Ensure Hyper-V hypervisor boot launch type is auto
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      bcdedit /set hypervisorlaunchtype auto | Out-Null
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = 'Failed to set hypervisorlaunchtype to auto'
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Changed = $true
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
    - "'Hyper-V Hypervisor is disabled' in (_multipass_networks_probe.result.stdout | default(''))"
    - (_multipass_hypervisor_boot_probe.result.launch_type | default('')) != 'auto'

- name: Reboot Windows host if Hyper-V hypervisor is not yet ready for Multipass
  ansible.windows.win_reboot:
    msg: "Ansible reboot to activate Hyper-V hypervisor for Multipass"
    reboot_timeout: 900
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
    - "'Hyper-V Hypervisor is disabled' in (_multipass_networks_probe.result.stdout | default(''))"

- name: Re-probe Multipass bridged-network readiness after Hyper-V reboot
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = [ordered]@{
        rc = 0
        stdout = ''
      }
      $out = cmd.exe /c "multipass networks 2>&1"
      $result.rc = $LASTEXITCODE
      $result.stdout = ($out | Out-String).Trim()
      $Ansible.Result = $result
  register: _multipass_networks_probe
  changed_when: false
  failed_when: false
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
    - "'Hyper-V Hypervisor is disabled' in (_multipass_networks_probe.result.stdout | default(''))"

- name: Collect Hyper-V and Multipass diagnostics when bridged networking is still not ready
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false

      $serverFeatures = @()
      try {
        $serverFeatures = Get-WindowsFeature |
          Where-Object { $_.Name -like 'Hyper-V*' -or $_.Name -in @('NetworkVirtualization', 'Containers') } |
          Select-Object Name, InstallState
      } catch {
        $serverFeatures = @()
      }

      $optionalFeatures = @()
      try {
        $optionalFeatures = Get-WindowsOptionalFeature -Online |
          Where-Object {
            $_.FeatureName -like 'Microsoft-Hyper-V*' -or
            $_.FeatureName -in @(
              'VirtualMachinePlatform',
              'Microsoft-Windows-Subsystem-Linux',
              'Containers'
            )
          } |
          Select-Object FeatureName, State
      } catch {
        $optionalFeatures = @()
      }

      $bootRaw = (bcdedit /enum '{current}' | Out-String)
      $launchType = ''
      if ($bootRaw -match 'hypervisorlaunchtype\s+(\w+)') {
        $launchType = $Matches[1].ToLowerInvariant()
      }

      $hypervisorPresent = $null
      try {
        $hypervisorPresent = (Get-CimInstance Win32_ComputerSystem).HypervisorPresent
      } catch {
        $hypervisorPresent = $null
      }

      $mpVersion = (cmd.exe /c "multipass version 2>&1" | Out-String).Trim()
      $mpNetworks = (cmd.exe /c "multipass networks 2>&1" | Out-String).Trim()
      $mpVersionVerbose = (cmd.exe /c "multipass -vvv version 2>&1" | Out-String).Trim()
      $mpNetworksVerbose = (cmd.exe /c "multipass -vvv networks 2>&1" | Out-String).Trim()
      $mpLogs = @()
      try {
        $mpLogs = Get-WinEvent -ListLog *Multipass* -ErrorAction SilentlyContinue |
          Select-Object LogName, RecordCount, IsEnabled, LogFilePath
      } catch {
        $mpLogs = @()
      }
      $mpEvents = @()
      try {
        $mpEvents = Get-WinEvent -MaxEvents 20 -ErrorAction SilentlyContinue |
          Where-Object { $_.ProviderName -like 'Multipass*' -or $_.LogName -like '*Multipass*' } |
          Select-Object -First 10 TimeCreated, ProviderName, Id, LevelDisplayName, Message
      } catch {
        $mpEvents = @()
      }
      $vmSwitches = @()
      try {
        $vmSwitches = Get-VMSwitch | Select-Object Name, SwitchType, NetAdapterInterfaceDescription
      } catch {
        $vmSwitches = @()
      }
      $netAdapters = @()
      try {
        $netAdapters = Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, MacAddress
      } catch {
        $netAdapters = @()
      }

      $Ansible.Result = @{
        server_features = $serverFeatures
        optional_features = $optionalFeatures
        hypervisorlaunchtype = $launchType
        hypervisor_present = $hypervisorPresent
        multipass_version = $mpVersion
        multipass_version_verbose = $mpVersionVerbose
        multipass_networks = $mpNetworks
        multipass_networks_verbose = $mpNetworksVerbose
        multipass_logs = $mpLogs
        multipass_events = $mpEvents
        vm_switches = $vmSwitches
        net_adapters = $netAdapters
      }
  register: _multipass_host_diagnostics
  changed_when: false
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
  tags:
    - evidence
    - debug_resources

- name: Troubleshooting report for Multipass bridged-network failure
  ansible.builtin.debug:
    msg:
      troubleshooting_mode: "on"
      components:
        - "multipass_ubuntu_vm"
        - "Multipass Windows Hyper-V backend"
      evidence_surfaces_identified:
        - "Multipass Event Viewer provider/source"
        - "multipass -vvv networks"
        - "multipass version"
        - "Get-CimInstance Win32_ComputerSystem"
        - "Get-WindowsOptionalFeature Microsoft-Hyper-V*"
        - "Get-WindowsFeature Hyper-V"
        - "Get-VMSwitch"
        - "Get-NetAdapter"
        - "bcdedit /enum {current}"
      collected_this_run:
        - "multipass networks"
        - "bcdedit launch type probe"
        - "Hyper-V optional/server feature probes"
        - "HypervisorPresent probe"
        - "Multipass version"
        - "Multipass verbose networks probe"
        - "Multipass provider event entries"
        - "Get-VMSwitch"
        - "Get-NetAdapter"
      missing_this_run: >-
        {{
          [
            'Installer logs under %TEMP% (not collected)',
            'Multipass GUI log under %APPDATA% (not collected)'
          ] +
          (
            ['Dedicated Multipass log channel/file (not discovered by Get-WinEvent -ListLog *Multipass*)']
            if (_multipass_host_diagnostics.result.multipass_logs | default([]) | length == 0)
            else []
          )
        }}
      actual_output_seen_this_run:
        multipass_networks: "{{ _multipass_host_diagnostics.result.multipass_networks | default('not-collected') }}"
        multipass_networks_verbose: "{{ _multipass_host_diagnostics.result.multipass_networks_verbose | default('not-collected') }}"
        hypervisorlaunchtype: "{{ _multipass_host_diagnostics.result.hypervisorlaunchtype | default('not-collected') }}"
        hypervisor_present: "{{ _multipass_host_diagnostics.result.hypervisor_present | default('not-collected') }}"
  when:
    - (ansible_troubleshooting_mode | bool) or (debug_collect_component_evidence | bool)
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
  tags:
    - evidence
    - debug_resources

- name: Report Hyper-V and Multipass diagnostics when bridged networking is blocked
  ansible.builtin.debug:
    var: _multipass_host_diagnostics.result
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))
    - _multipass_networks_probe.result.rc | default(0) != 0
    - (ansible_troubleshooting_mode | bool) or
      (debug_collect_component_evidence | bool)
  tags:
    - evidence
    - debug_resources

- name: Verify Multipass bridged-network readiness before launch
  ansible.builtin.assert:
    that:
      - _multipass_networks_probe.result.rc | default(0) == 0
      - multipass_ubuntu_vm_bridge_adapter_name in (_multipass_networks_probe.result.stdout | default(''))
    fail_msg: >-
      Multipass bridged networking is not ready for '{{ multipass_ubuntu_vm_bridge_adapter_name }}'.
      networks output: {{ _multipass_networks_probe.result.stdout | default('no output') }}
      hypervisorlaunchtype: {{ _multipass_hypervisor_boot_probe.result.launch_type | default('unknown') }}
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))

- name: Set preferred bridged network for Multipass
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $current = (multipass get local.bridged-network 2>$null | Out-String).Trim()
      $desired = '{{ multipass_ubuntu_vm_bridge_adapter_name }}'
      if ($current -ne $desired) {
        multipass set "local.bridged-network=$desired"
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to set preferred bridged network to $desired"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
      }
  when:
    - multipass_ubuntu_vm_bridged | bool
    - not (_multipass_vm_probe.result.exists | default(false))

- name: Launch Multipass Ubuntu VM when absent
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $args = @(
        'multipass',
        'launch',
        '{{ multipass_ubuntu_vm_image }}',
        '--name', '"{{ multipass_ubuntu_vm_name }}"',
        '--cpus', '{{ multipass_ubuntu_vm_cpus }}',
        '--memory', '{{ multipass_ubuntu_vm_memory }}',
        '--disk', '{{ multipass_ubuntu_vm_disk }}',
        '--timeout', '{{ multipass_ubuntu_vm_timeout }}',
        '--cloud-init', '"{{ multipass_ubuntu_vm_cloud_init_path }}"'
      )
      if ({{ (multipass_ubuntu_vm_bridged | bool) | ternary('$true', '$false') }}) {
        $args += '--bridged'
      }
      $command = ($args -join ' ') + ' 2>&1'
      $result = (cmd.exe /c $command | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = $result
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Changed = $true
      $Ansible.Result = $result
  when: not (_multipass_vm_probe.result.exists | default(false))

- name: Probe Multipass VM state after create path
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $name = '{{ multipass_ubuntu_vm_name }}'
      $raw = multipass info $name --format json
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = @{ exists = $false }
        $Ansible.Failed = $true
        Exit 1
      }
      $info = $raw | ConvertFrom-Json
      $node = $info.info.$name
      $result = [ordered]@{
        exists = $true
        state = $node.state
        ipv4 = if ($node.ipv4) { @($node.ipv4)[0] } else { $null }
        cpus = (multipass get "local.$name.cpus" | Out-String).Trim()
        memory = (multipass get "local.$name.memory" | Out-String).Trim()
        disk = (multipass get "local.$name.disk" | Out-String).Trim()
        bridged = (multipass get "local.$name.bridged" 2>$null | Out-String).Trim()
      }
      $Ansible.Result = $result
  register: _multipass_vm_current
  changed_when: false

- name: Reconcile Multipass VM settings and ensure running state
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      function Normalize([string]$value) {
        if ($null -eq $value) { return '' }
        return (($value.Trim().ToUpper()) -replace '\.0(?=[KMGTP]?B?$)', '')
      }

      $Ansible.Changed = $false
      $name = '{{ multipass_ubuntu_vm_name }}'
      $state = '{{ _multipass_vm_current.result.state | default("") }}'
      $needsStop = $false
      $needsStart = $false

      $currentCpus = Normalize('{{ _multipass_vm_current.result.cpus | default("") }}')
      $currentMemory = Normalize('{{ _multipass_vm_current.result.memory | default("") }}')
      $currentDisk = Normalize('{{ _multipass_vm_current.result.disk | default("") }}')
      $currentBridged = Normalize('{{ _multipass_vm_current.result.bridged | default("") }}')

      $desiredCpus = Normalize('{{ multipass_ubuntu_vm_cpus }}')
      $desiredMemory = Normalize('{{ multipass_ubuntu_vm_memory }}')
      $desiredDisk = Normalize('{{ multipass_ubuntu_vm_disk }}')

      if ($currentCpus -ne $desiredCpus) { $needsStop = $true }
      if ($currentMemory -ne $desiredMemory) { $needsStop = $true }
      if ($currentDisk -ne $desiredDisk) { $needsStop = $true }
      if ({{ (multipass_ubuntu_vm_bridged | bool) | ternary('$true', '$false') }} -and $currentBridged -ne 'TRUE') { $needsStop = $true }

      if ($needsStop -and $state -eq 'Running') {
        multipass stop $name | Out-Null
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to stop instance $name before settings reconciliation"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
        $needsStart = $true
      }

      if ($currentCpus -ne $desiredCpus) {
        multipass set "local.$name.cpus={{ multipass_ubuntu_vm_cpus }}"
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to set CPU count for $name"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
        $needsStart = $true
      }

      if ($currentMemory -ne $desiredMemory) {
        multipass set "local.$name.memory={{ multipass_ubuntu_vm_memory }}"
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to set memory for $name"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
        $needsStart = $true
      }

      if ($currentDisk -ne $desiredDisk) {
        multipass set "local.$name.disk={{ multipass_ubuntu_vm_disk }}"
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to set disk for $name"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
        $needsStart = $true
      }

      if ({{ (multipass_ubuntu_vm_bridged | bool) | ternary('$true', '$false') }}) {
        if ($currentBridged -ne 'TRUE') {
          multipass set "local.$name.bridged=true"
          if ($LASTEXITCODE -ne 0) {
            $Ansible.Result = "Failed to enable bridged networking for $name"
            $Ansible.Failed = $true
            Exit 1
          }
          $Ansible.Changed = $true
          $needsStart = $true
        }
      } elseif ($currentBridged -eq 'TRUE') {
        $Ansible.Result = "Bridged networking cannot be removed in-place for $name. Recreate the VM instead."
        $Ansible.Failed = $true
        Exit 1
      }

      if ($needsStart -or $state -ne 'Running') {
        multipass start $name | Out-Null
        if ($LASTEXITCODE -ne 0) {
          $Ansible.Result = "Failed to start instance $name"
          $Ansible.Failed = $true
          Exit 1
        }
        $Ansible.Changed = $true
      }
  register: _multipass_vm_reconcile

- name: Wait for cloud-init to finish inside Multipass VM
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $result = (& multipass exec '{{ multipass_ubuntu_vm_name }}' -- cloud-init status --wait 2>&1 | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = $result
        $Ansible.Failed = $true
        Exit 1
      }
      $Ansible.Result = $result
  changed_when: false

- name: Probe final Multipass VM IP information
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $name = '{{ multipass_ubuntu_vm_name }}'
      $raw = multipass info $name --format json
      if ($LASTEXITCODE -ne 0) {
        $Ansible.Result = @{ exists = $false; ipv4 = $null }
        $Ansible.Failed = $true
        Exit 1
      }
      $info = $raw | ConvertFrom-Json
      $node = $info.info.$name
      $Ansible.Result = @{
        exists = $true
        state = $node.state
        ipv4 = if ($node.ipv4) { @($node.ipv4)[0] } else { $null }
      }
  register: _multipass_vm_final
  changed_when: false

- name: Require an IPv4 address from the Multipass VM
  ansible.builtin.assert:
    that:
      - (_multipass_vm_final.result.ipv4 | default('')) | length > 0
    fail_msg: >-
      Multipass instance '{{ multipass_ubuntu_vm_name }}' did not report an IPv4 address.

- name: Wait for SSH on the Multipass VM from the controller
  ansible.builtin.wait_for:
    host: "{{ _multipass_vm_final.result.ipv4 }}"
    port: "{{ multipass_ubuntu_vm_ssh_port }}"
    timeout: "{{ multipass_ubuntu_vm_wait_for_ssh_timeout }}"
  delegate_to: "{{ groups['execution_nodes'][0] }}"
  when: multipass_ubuntu_vm_verify_ssh | bool

- name: Publish Multipass VM metadata file
  ansible.windows.win_copy:
    dest: "{{ multipass_ubuntu_vm_metadata_path }}"
    content: |
      {
        "name": "{{ multipass_ubuntu_vm_name }}",
        "inventory_host": "{{ multipass_ubuntu_vm_inventory_host }}",
        "bridge_adapter_name": "{{ multipass_ubuntu_vm_bridge_adapter_name }}",
        "cloud_init_checksum": "{{ _multipass_cloud_init_stat.stat.checksum }}",
        "user": "{{ multipass_ubuntu_vm_user }}",
        "ssh_port": {{ multipass_ubuntu_vm_ssh_port }}
      }
    force: true

- name: Publish SSH-ready facts for Multipass VM inventory host
  ansible.builtin.set_fact:
    ansible_host: "{{ _multipass_vm_final.result.ipv4 }}"
    host_ip: "{{ _multipass_vm_final.result.ipv4 }}"
    ssh_configured: true
    ssh_port: "{{ multipass_ubuntu_vm_ssh_port }}"
    ssh_user: "{{ multipass_ubuntu_vm_user }}"
    ansible_python_interpreter: "{{ multipass_ubuntu_vm_python_interpreter }}"
    cacheable: true
  delegate_to: "{{ multipass_ubuntu_vm_inventory_host }}"
  delegate_facts: true

- name: Report Multipass Ubuntu VM summary
  ansible.builtin.debug:
    msg:
      vm_name: "{{ multipass_ubuntu_vm_name }}"
      inventory_host: "{{ multipass_ubuntu_vm_inventory_host }}"
      ip: "{{ _multipass_vm_final.result.ipv4 }}"
      ssh_user: "{{ multipass_ubuntu_vm_user }}"
      bridged: "{{ multipass_ubuntu_vm_bridged }}"
