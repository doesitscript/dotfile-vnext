---
- name: Resolve Multipass Ubuntu VM inventory contract
  ansible.builtin.assert:
    that:
      - multipass_ubuntu_vm_inventory_host in hostvars
    fail_msg: >-
      Inventory host '{{ multipass_ubuntu_vm_inventory_host }}' does not exist.
      Add it to inventory before managing this VM capability.

- name: Resolve controller public key from execution node
  ansible.builtin.slurp:
    src: "{{ controller_ssh_public_key_path }}"
  register: _multipass_controller_pubkey_slurp
  delegate_to: "{{ groups['execution_nodes'][0] }}"

- name: Set controller public key content fact for Multipass bootstrap
  ansible.builtin.set_fact:
    controller_pub_key_content: "{{ _multipass_controller_pubkey_slurp.content | b64decode | trim }}"

- name: Verify controller public key was loaded for Multipass bootstrap
  ansible.builtin.assert:
    that:
      - controller_pub_key_content | length > 0
    fail_msg: >-
      Controller public key is empty or missing.
      Ensure {{ controller_ssh_public_key_path }} exists on {{ groups['execution_nodes'][0] }}.

- name: Include Multipass present path
  ansible.builtin.include_tasks: present.yml
  when: multipass_ubuntu_vm_state == 'present'

- name: Include Multipass absent path
  ansible.builtin.include_tasks: absent.yml
  when: multipass_ubuntu_vm_state == 'absent'
