---
multipass_ubuntu_vm_state: present
multipass_ubuntu_vm_name: server-225-ubuntu
multipass_ubuntu_vm_inventory_host: server-225-ubuntu
multipass_ubuntu_vm_image: "24.04"
multipass_ubuntu_vm_cpus: 4
multipass_ubuntu_vm_memory: "8G"
multipass_ubuntu_vm_disk: "40G"
multipass_ubuntu_vm_timeout: 900
multipass_ubuntu_vm_bridged: true
multipass_ubuntu_vm_bridge_adapter_name: "{{ (hyperv_config | default({})).switch_name | default('') }}"
multipass_ubuntu_vm_disable_wsl_feature: false
multipass_ubuntu_vm_user: ubuntu
multipass_ubuntu_vm_hostname: "{{ multipass_ubuntu_vm_name }}"
multipass_ubuntu_vm_ssh_port: 22
multipass_ubuntu_vm_python_interpreter: /usr/bin/python3

multipass_ubuntu_vm_windows_version: "1.16.0"
multipass_ubuntu_vm_windows_installer_filename: >-
  multipass-{{ multipass_ubuntu_vm_windows_version }}+win-win64.msi
multipass_ubuntu_vm_windows_installer_url: >-
  https://github.com/canonical/multipass/releases/download/v{{ multipass_ubuntu_vm_windows_version }}/{{ multipass_ubuntu_vm_windows_installer_filename }}
multipass_ubuntu_vm_windows_installer_path: >-
  C:\ProgramData\Ansible\multipass\{{ multipass_ubuntu_vm_windows_installer_filename }}
multipass_ubuntu_vm_cloud_init_dir: C:\ProgramData\Ansible\multipass
multipass_ubuntu_vm_cloud_init_path: "{{ multipass_ubuntu_vm_cloud_init_dir }}\\{{ multipass_ubuntu_vm_name }}-cloud-init.yaml"
multipass_ubuntu_vm_metadata_path: "{{ multipass_ubuntu_vm_cloud_init_dir }}\\{{ multipass_ubuntu_vm_name }}-state.json"

multipass_ubuntu_vm_verify_ssh: true
multipass_ubuntu_vm_wait_for_ssh_timeout: 300

ansible_troubleshooting_mode: false
debug_remote_output: false
debug_collect_component_evidence: false

controller_ssh_public_key_path: "~/.ssh/id_ed25519_ansible.pub"
