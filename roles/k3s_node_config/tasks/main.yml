---
# k3s_node_config — Label and taint nodes after k3s cluster is up.
# Runs on the control plane node (server group) with local kubectl access.
# TODO: Replace steady-state kubectl label/taint mutation with a
# kubernetes.core-backed desired-state path once the role's node metadata
# contract is formalized.

- name: All k3s nodes are Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - wait
      - --for=condition=Ready
      - node
      - --all
      - --timeout=10s
  register: k3s_node_config_ready
  changed_when: false
  retries: 12
  delay: 10
  until: k3s_node_config_ready.rc == 0

- name: Node labels match declared state
  ansible.builtin.command: >-
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    label node {{ item.key }}
    {% for label in item.value | dict2items %}{{ label.key }}={{ label.value }} {% endfor %}
    --overwrite
  loop: "{{ k3s_node_config_labels | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: k3s_node_config_label
  changed_when:
    - "'labeled' in k3s_node_config_label.stdout"
    - "'not labeled' not in k3s_node_config_label.stdout"

- name: Node taints are present
  ansible.builtin.command: >-
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    taint node {{ item.0.key }}
    {{ item.1.key }}={{ item.1.value }}:{{ item.1.effect }}
    --overwrite
  loop: "{{ k3s_node_config_taints | default({}) | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }} {{ item.1.key }}"
  register: k3s_node_config_taint
  changed_when: "'tainted' in k3s_node_config_taint.stdout"
  when: (k3s_node_config_taints | default({}) | length) > 0

- name: Report current node labels and taints
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - nodes
      - -o
      - wide
  register: k3s_node_config_report
  changed_when: false

- name: Node configuration summary
  ansible.builtin.debug:
    msg: "{{ k3s_node_config_report.stdout_lines }}"
