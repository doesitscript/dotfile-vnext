---
# Toggle individual tool installs via host_vars/group_vars.
ansible_dev_tools_install: true
ansible_navigator_install: true
ansible_builder_install: true
ansible_lint_install: true

# The ansible meta-package needs --include-deps so that ansible-core CLIs
# (ansible, ansible-playbook, ansible-inventory, …) are exposed on PATH.
ansible_pipx_include_deps_packages:
  - ansible

# Standalone tools installed via plain pipx (no --include-deps needed).
ansible_pipx_packages:
  - ansible-lint
  - ansible-builder
