---
- name: Ensure .cursor directory exists in project root
  ansible.builtin.file:
    path: "{{ ansible_mcp_project_dir }}"
    state: directory
    mode: "0755"
  tags: [project]

- name: Check whether .cursor/mcp.json exists
  ansible.builtin.stat:
    path: "{{ ansible_mcp_project_dir }}/mcp.json"
  register: _mcp_json_stat
  tags: [project]

- name: Create .cursor/mcp.json with Ansible MCP server config
  ansible.builtin.copy:
    dest: "{{ ansible_mcp_project_dir }}/mcp.json"
    mode: "0644"
    content: |
      {
        "mcpServers": {
          "ansible": {
            "command": "node",
            "args": [
              "{{ ansible_mcp_cli_path }}"
            ],
            "env": {
              "WORKSPACE_ROOT": "{{ ansible_mcp_workspace_root }}"
            }
          }
        }
      }
  when: not _mcp_json_stat.stat.exists
  tags: [project]

- name: Ensure Ansible MCP server entry exists in .cursor/mcp.json
  when: _mcp_json_stat.stat.exists
  tags: [project]
  block:
    - name: Read existing .cursor/mcp.json
      ansible.builtin.slurp:
        src: "{{ ansible_mcp_project_dir }}/mcp.json"
      register: _mcp_json_raw

    - name: Merge Ansible MCP server into existing config
      vars:
        _existing: "{{ _mcp_json_raw.content | b64decode | from_json }}"
        _ansible_entry:
          command: node
          args:
            - "{{ ansible_mcp_cli_path }}"
          env:
            WORKSPACE_ROOT: "{{ ansible_mcp_workspace_root }}"
        _merged: >-
          {{ _existing | combine({
               'mcpServers': (_existing.mcpServers | default({})) | combine({
                 'ansible': _ansible_entry
               })
             }) }}
      ansible.builtin.copy:
        dest: "{{ ansible_mcp_project_dir }}/mcp.json"
        content: "{{ _merged | to_nice_json }}\n"
        mode: "0644"
      when: "'ansible' not in (_existing.mcpServers | default({}))"
