---
- name: Install ansible-dev-tools via pip (Ubuntu)
  ansible.builtin.pip:
    name: "{{ ansible_dev_tools_package }}"
    state: present
    executable: pip3
  become: false

- name: Install Ansible CLI tools via pipx (Ubuntu)
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ ansible_pipx_packages }}"
  register: _ansible_pipx_result
  changed_when: "'installed package' in _ansible_pipx_result.stdout"
  failed_when:
    - _ansible_pipx_result.rc != 0
    - "'already seems to be installed' not in _ansible_pipx_result.stderr"
  tags: pipx
