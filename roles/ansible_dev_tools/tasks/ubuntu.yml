---
- name: Ensure pipx binary path is initialized on Ubuntu
  ansible.builtin.command: pipx ensurepath
  changed_when: false
  failed_when: false
  tags: pipx

- name: Install ansible-dev-tools via pipx (Ubuntu)
  ansible.builtin.command: pipx install ansible-dev-tools
  register: _adt_pipx_result
  changed_when: "'installed package' in _adt_pipx_result.stdout"
  failed_when:
    - _adt_pipx_result.rc != 0
    - "'already seems to be installed' not in _adt_pipx_result.stderr"
  when: ansible_dev_tools_install | bool
  notify: Re-source shell profile
  tags: [ansible-dev-tools, pipx]

- name: Install ansible-navigator via pipx (Ubuntu)
  ansible.builtin.command: pipx install ansible-navigator
  register: _anav_pipx_result
  changed_when: "'installed package' in _anav_pipx_result.stdout"
  failed_when:
