---
- name: Install ansible-dev-tools via pip (Ubuntu)
  ansible.builtin.pip:
    name: ansible-dev-tools
    state: present
    executable: "{{ ansible_dev_tools_pip }}"
  become: false
  when: ansible_dev_tools_install | bool
  tags: [ansible-dev-tools]

- name: Install ansible-navigator via pip (Ubuntu)
  ansible.builtin.pip:
    name: ansible-navigator
    state: present
    executable: "{{ ansible_dev_tools_pip }}"
  become: false
  when: ansible_navigator_install | bool
  tags: [ansible-navigator]

- name: Install Ansible CLI tools via pipx (Ubuntu)
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ ansible_pipx_packages }}"
  register: _ansible_pipx_result
  changed_when: "'installed package' in _ansible_pipx_result.stdout"
  failed_when:
    - _ansible_pipx_result.rc != 0
    - "'already seems to be installed' not in _ansible_pipx_result.stderr"
  tags: pipx
