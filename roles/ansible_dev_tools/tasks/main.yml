---
- name: Process ansible_dev_tools role for macOS
  ansible.builtin.import_tasks: mac.yml
  when: ansible_facts['system'] == "Darwin"

- name: Process ansible_dev_tools role for Ubuntu
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Process ansible_dev_tools role for Windows
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['system'] == "Windows"

- name: Symlink Ansible Docker wrapper functions into ~/.bashrc.d (macOS only)
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/roles/ansible_dev_tools/files/ansible-functions.bash"
    dest: "{{ ansible_env.HOME }}/.bashrc.d/ansible-functions.bash"
    state: link
  when: ansible_facts['system'] == "Darwin"
