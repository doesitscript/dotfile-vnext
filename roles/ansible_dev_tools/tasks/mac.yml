---
# oniguruma is a C regex library required by ansible-navigator (via onigurumacffi).
# pip cannot install onigurumacffi without the system library headers present.
- name: Install oniguruma system library (required by ansible-navigator)
  community.general.homebrew:
    name: oniguruma
    state: present
  tags: brew

- name: Install Ansible dev tools into project venv
  ansible.builtin.pip:
    name: "{{ ansible_dev_tools_pip_packages }}"
    virtualenv: "{{ ansible_dev_tools_venv_path }}"
    state: present
  tags: pip

- name: Symlink project venv to ~/.ansible-venv for Cursor extension
  ansible.builtin.file:
    src: "{{ ansible_dev_tools_venv_path }}"
    dest: "{{ ansible_env.HOME }}/.ansible-venv"
    state: link
  tags: pip

- name: Ensure ~/.local/bin exists for globally visible Ansible shims
  ansible.builtin.file:
    path: "{{ ansible_dev_tools_global_bin_dir }}"
    state: directory
    mode: "0755"
  when: ansible_dev_tools_publish_venv_toolchain_globally | bool
  tags: [pip, path]

- name: Remove pipx-installed duplicate Ansible toolchain packages (macOS)
  ansible.builtin.command: "pipx uninstall {{ item }}"
  loop: "{{ ansible_dev_tools_pipx_conflicting_packages }}"
  register: _ansible_pipx_uninstall_result
  changed_when: "'uninstalled package' in (_ansible_pipx_uninstall_result.stdout | lower)"
  failed_when:
    - _ansible_pipx_uninstall_result.rc != 0
    - "'not installed' not in ((_ansible_pipx_uninstall_result.stderr | default('')) | lower)"
    - "'nothing to uninstall' not in ((_ansible_pipx_uninstall_result.stdout | default('')) | lower)"
  when: ansible_dev_tools_remove_mac_pipx_duplicates | bool
  tags: [pipx, path]

- name: Publish project venv Ansible tools into ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_dev_tools_venv_path }}/bin/{{ item }}"
    dest: "{{ ansible_dev_tools_global_bin_dir }}/{{ item }}"
    state: link
    force: true
  loop: "{{ ansible_dev_tools_global_cli_tools }}"
  when: ansible_dev_tools_publish_venv_toolchain_globally | bool
  tags: [pip, path]

- name: Deploy WinRM env vars to ~/.bashrc.d (role-owned, not shell_config sweep)
  ansible.builtin.copy:
    src: bashrc.d/winrm_env.bash
    dest: "{{ ansible_env.HOME }}/.bashrc.d/winrm_env.bash"
    mode: "0644"
  when: ansible_dev_tools_install | bool
  tags: shell
