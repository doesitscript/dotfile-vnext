---
# oniguruma is a C regex library required by ansible-navigator (via onigurumacffi).
# pip cannot install onigurumacffi without the system library headers present.
- name: Install oniguruma system library (required by ansible-navigator)
  community.general.homebrew:
    name: oniguruma
    state: present
  tags: brew

- name: Install Ansible dev tools into project venv
  ansible.builtin.pip:
    name: "{{ ansible_dev_tools_pip_packages }}"
    virtualenv: "{{ ansible_dev_tools_venv_path }}"
    state: present
  tags: pip

- name: Symlink project venv to ~/.ansible-venv for Cursor extension
  ansible.builtin.file:
    src: "{{ ansible_dev_tools_venv_path }}"
    dest: "{{ ansible_env.HOME }}/.ansible-venv"
    state: link
  tags: pip

- name: Install Ansible with dependency CLIs exposed via pipx (macOS)
  ansible.builtin.command: "pipx install --include-deps {{ item }}"
  loop: "{{ ansible_pipx_include_deps_packages }}"
  register: _ansible_deps_pipx_result
  changed_when: "'installed package' in _ansible_deps_pipx_result.stdout"
  failed_when:
    - _ansible_deps_pipx_result.rc != 0
    - "'already seems to be installed' not in _ansible_deps_pipx_result.stderr"
  tags: pipx

- name: Install standalone Ansible CLI tools via pipx (macOS)
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ ansible_pipx_packages }}"
  register: _ansible_pipx_result
  changed_when: "'installed package' in _ansible_pipx_result.stdout"
  failed_when:
    - _ansible_pipx_result.rc != 0
    - "'already seems to be installed' not in _ansible_pipx_result.stderr"
  tags: pipx
