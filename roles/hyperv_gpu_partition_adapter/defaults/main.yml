---
hyperv_gpu_partition_adapter_state: present
hyperv_gpu_partition_adapter_vm_name: "{{ hyperv_ubuntu_k3s_vm_hostname | default(hyperv_ubuntu_k3s_vm_inventory_host | default('')) }}"
hyperv_gpu_partition_adapter_hyperv_server: >-
  {{
    hyperv_management_endpoint
    | default(ansible_host | default(host_ip | default(os_hostname | default(inventory_hostname))))
  }}
hyperv_gpu_partition_adapter_require_iov_support: true
hyperv_gpu_partition_adapter_restart_vm_when_changed: true
hyperv_gpu_partition_adapter_vm_should_be_running: true
hyperv_gpu_partition_adapter_guest_controlled_cache_types: true
hyperv_gpu_partition_adapter_dynamic_memory_enabled: false
hyperv_gpu_partition_adapter_startup_memory_bytes: 10737418240
hyperv_gpu_partition_adapter_minimum_memory_bytes: 1073741824
hyperv_gpu_partition_adapter_low_mmio_space: 1GB
hyperv_gpu_partition_adapter_high_mmio_space: 32GB
hyperv_gpu_partition_adapter_checkpoint_type: Disabled
hyperv_gpu_partition_adapter_secure_boot_enabled: false
hyperv_gpu_partition_adapter_partition_vram_min: 1
hyperv_gpu_partition_adapter_partition_vram_max: 900000000
hyperv_gpu_partition_adapter_partition_vram_optimal: 900000000
hyperv_gpu_partition_adapter_partition_encode_min: 1
hyperv_gpu_partition_adapter_partition_encode_max: 16602000000000000000
hyperv_gpu_partition_adapter_partition_encode_optimal: 16602000000000000000
hyperv_gpu_partition_adapter_partition_decode_min: 1
hyperv_gpu_partition_adapter_partition_decode_max: 900000000
hyperv_gpu_partition_adapter_partition_decode_optimal: 900000000
hyperv_gpu_partition_adapter_partition_compute_min: 1
hyperv_gpu_partition_adapter_partition_compute_max: 900000000
hyperv_gpu_partition_adapter_partition_compute_optimal: 900000000
hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys: false
hyperv_gpu_partition_adapter_restart_vmms_when_policy_keys_change: true
