---
- name: Ensure Hyper-V GPU policy registry keys are present when required
  ansible.builtin.include_tasks: hyperv_gpu_policy_registry.yml
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool

- name: Inspect Hyper-V GPU partition state for target VM
  ansible.windows.win_powershell:
    script: |
      $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
      $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
      $vm = Get-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop
      $adapter = Get-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName -ErrorAction SilentlyContinue
      $partitionable = Get-VMHostPartitionableGpu -ComputerName $hypervServer -ErrorAction SilentlyContinue
      $vmHost = Get-VMHost -ComputerName $hypervServer

      $iovReasons = @()
      if ($null -ne $vmHost.IovSupportReasons) {
        $iovReasons = @($vmHost.IovSupportReasons | ForEach-Object { $_.ToString() })
      }

      [pscustomobject]@{
        vm_name = $vm.Name
        vm_state = $vm.State.ToString()
        has_partitionable_gpu = [bool]($partitionable)
        has_gpu_partition_adapter = [bool]($adapter)
        partitionable_gpu_name = if ($partitionable) { $partitionable[0].Name } else { $null }
        partitionable_gpu_instance_path = if ($partitionable) { $partitionable[0].Name } else { $null }
        iov_support = [bool]($vmHost.IovSupport)
        iov_support_reasons = $iovReasons
        iov_support_reason_text = ($iovReasons -join '; ')
      } | ConvertTo-Json -Compress
  register: hyperv_gpu_partition_adapter_probe
  changed_when: false
  check_mode: false

- name: Parse Hyper-V GPU partition probe
  ansible.builtin.set_fact:
    _hyperv_gpu_partition_adapter_probe: >-
      {{
        (
          hyperv_gpu_partition_adapter_probe.output | default([])
          | first
          | default(hyperv_gpu_partition_adapter_probe.stdout | default('{}'))
        ) | from_json
      }}
  changed_when: false

- name: Validate Hyper-V host exposes a partitionable GPU
  ansible.builtin.assert:
    that:
      - _hyperv_gpu_partition_adapter_probe.has_partitionable_gpu | bool
    fail_msg: >-
      No partitionable GPU was detected on the Hyper-V host for
      {{ hyperv_gpu_partition_adapter_vm_name }}.

- name: Validate Hyper-V host satisfies SR-IOV prerequisites for GPU partitioning
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_iov_support | bool
  ansible.builtin.assert:
    that:
      - _hyperv_gpu_partition_adapter_probe.iov_support | bool
    fail_msg: >-
      Hyper-V host for {{ hyperv_gpu_partition_adapter_vm_name }} does not
      satisfy SR-IOV/GPU partition prerequisites. Host reported:
      {{ _hyperv_gpu_partition_adapter_probe.iov_support_reason_text | default('unknown reason') }}.
      Resolve the BIOS/PCIe platform support gap before retrying GPU partition
      attachment.

- name: Ensure VM has GPU-partition-compatible Hyper-V settings
  when: hyperv_gpu_partition_adapter_state == 'present'
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
      $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
      $dynamicMemoryEnabled = [bool]::Parse('{{ hyperv_gpu_partition_adapter_dynamic_memory_enabled | string }}')
      Set-VM -ComputerName $hypervServer -VMName $vmName `
        -GuestControlledCacheTypes:([bool]::Parse('{{ hyperv_gpu_partition_adapter_guest_controlled_cache_types | string }}')) `
        -LowMemoryMappedIoSpace {{ hyperv_gpu_partition_adapter_low_mmio_space }} `
        -HighMemoryMappedIoSpace {{ hyperv_gpu_partition_adapter_high_mmio_space }} `
        -CheckpointType {{ hyperv_gpu_partition_adapter_checkpoint_type }}
      if ($dynamicMemoryEnabled) {
        Set-VMMemory -ComputerName $hypervServer -VMName $vmName `
          -DynamicMemoryEnabled $true `
          -StartupBytes {{ hyperv_gpu_partition_adapter_startup_memory_bytes }} `
          -MinimumBytes {{ hyperv_gpu_partition_adapter_minimum_memory_bytes }}
      }
      else {
        Set-VMMemory -ComputerName $hypervServer -VMName $vmName `
          -DynamicMemoryEnabled $false `
          -StartupBytes {{ hyperv_gpu_partition_adapter_startup_memory_bytes }}
      }
  register: hyperv_gpu_partition_adapter_vm_settings

- name: Ensure Hyper-V GPU partition adapter is attached to VM
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - not (_hyperv_gpu_partition_adapter_probe.has_gpu_partition_adapter | bool)
  block:
    - name: Stop VM before adding GPU partition adapter when restart is allowed
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $vm = Get-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop
          if ($vm.State -eq 'Running') {
            Stop-VM -ComputerName $hypervServer -Name $vmName -Force -Confirm:$false
          }
      when: hyperv_gpu_partition_adapter_restart_vm_when_changed | bool

    - name: Ensure VM firmware is GPU-partition-compatible while VM is stopped
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          Set-VMFirmware -ComputerName $hypervServer -VMName $vmName `
            -EnableSecureBoot {{ 'On' if hyperv_gpu_partition_adapter_secure_boot_enabled else 'Off' }}
      when: hyperv_gpu_partition_adapter_restart_vm_when_changed | bool

    - name: Attach GPU partition adapter to target VM
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          Add-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName -InstancePath '{{ _hyperv_gpu_partition_adapter_probe.partitionable_gpu_instance_path }}'
      register: hyperv_gpu_partition_adapter_attach

    - name: Start VM after GPU partition adapter change when desired
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          Start-VM -ComputerName $hypervServer -Name $vmName
      when:
        - hyperv_gpu_partition_adapter_restart_vm_when_changed | bool
        - hyperv_gpu_partition_adapter_vm_should_be_running | bool
  rescue:
    - name: Remove GPU partition adapter after failed attach/start attempt
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $adapter = Get-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName -ErrorAction SilentlyContinue
          if ($adapter) {
            Remove-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName
          }

    - name: Restore target VM to running state after failed GPU partition attempt
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $vm = Get-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop
          if ($vm.State -ne 'Running') {
            Start-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop | Out-Null
          }
      when: hyperv_gpu_partition_adapter_vm_should_be_running | bool

    - name: Fail with recovered GPU partition startup error details
      ansible.builtin.fail:
        msg: >-
          Hyper-V GPU partition attach/start failed for
          {{ hyperv_gpu_partition_adapter_vm_name }}, but the role removed the
          adapter and restored the VM to its prior running state. Review the
          preceding Hyper-V error details for the resource-reservation failure.

- name: Apply explicit GPU partition sizing for target VM
  when: hyperv_gpu_partition_adapter_state == 'present'
  ansible.windows.win_powershell:
    script: |
      $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
      $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
      Set-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName `
        -MinPartitionVRAM {{ hyperv_gpu_partition_adapter_partition_vram_min }} `
        -MaxPartitionVRAM {{ hyperv_gpu_partition_adapter_partition_vram_max }} `
        -OptimalPartitionVRAM {{ hyperv_gpu_partition_adapter_partition_vram_optimal }} `
        -MinPartitionEncode {{ hyperv_gpu_partition_adapter_partition_encode_min }} `
        -MaxPartitionEncode {{ hyperv_gpu_partition_adapter_partition_encode_max }} `
        -OptimalPartitionEncode {{ hyperv_gpu_partition_adapter_partition_encode_optimal }} `
        -MinPartitionDecode {{ hyperv_gpu_partition_adapter_partition_decode_min }} `
        -MaxPartitionDecode {{ hyperv_gpu_partition_adapter_partition_decode_max }} `
        -OptimalPartitionDecode {{ hyperv_gpu_partition_adapter_partition_decode_optimal }} `
        -MinPartitionCompute {{ hyperv_gpu_partition_adapter_partition_compute_min }} `
        -MaxPartitionCompute {{ hyperv_gpu_partition_adapter_partition_compute_max }} `
        -OptimalPartitionCompute {{ hyperv_gpu_partition_adapter_partition_compute_optimal }}

- name: Remove Hyper-V GPU partition adapter from VM
  when: hyperv_gpu_partition_adapter_state == 'absent'
  ansible.windows.win_powershell:
    script: |
      $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
      $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
      $adapter = Get-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName -ErrorAction SilentlyContinue
      if ($adapter) {
        Remove-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName
      }
  register: hyperv_gpu_partition_adapter_remove

- name: Ensure target VM is running after GPU partition reconciliation
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_vm_should_be_running | bool
  block:
    - name: Start target VM when not already running
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $vm = Get-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop
          if ($vm.State -ne 'Running') {
            Start-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop | Out-Null
          }
      register: hyperv_gpu_partition_adapter_vm_start
  rescue:
    - name: Remove GPU partition adapter after failed post-reconciliation start
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $adapter = Get-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName -ErrorAction SilentlyContinue
          if ($adapter) {
            Remove-VMGpuPartitionAdapter -ComputerName $hypervServer -VMName $vmName
          }

    - name: Restore target VM after failed post-reconciliation start
      ansible.windows.win_powershell:
        script: |
          $hypervServer = '{{ hyperv_gpu_partition_adapter_hyperv_server }}'
          $vmName = '{{ hyperv_gpu_partition_adapter_vm_name }}'
          $vm = Get-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop
          if ($vm.State -ne 'Running') {
            Start-VM -ComputerName $hypervServer -Name $vmName -ErrorAction Stop | Out-Null
          }

    - name: Fail with recovered post-reconciliation GPU partition error
      ansible.builtin.fail:
        msg: >-
          Hyper-V GPU partition reconciliation failed to leave
          '{{ hyperv_gpu_partition_adapter_vm_name }}' bootable. The role removed
          the adapter and restored the VM to a running state. Review the
          preceding Hyper-V GPU partition resource-reservation error details.

- name: Report Hyper-V GPU partition adapter state
  ansible.builtin.debug:
    msg:
      vm_name: "{{ _hyperv_gpu_partition_adapter_probe.vm_name }}"
      vm_state: "{{ _hyperv_gpu_partition_adapter_probe.vm_state }}"
      has_partitionable_gpu: "{{ _hyperv_gpu_partition_adapter_probe.has_partitionable_gpu }}"
      had_gpu_partition_adapter: "{{ _hyperv_gpu_partition_adapter_probe.has_gpu_partition_adapter }}"
      iov_support: "{{ _hyperv_gpu_partition_adapter_probe.iov_support }}"
      iov_support_reasons: "{{ _hyperv_gpu_partition_adapter_probe.iov_support_reasons }}"
      iov_support_reason_text: "{{ _hyperv_gpu_partition_adapter_probe.iov_support_reason_text }}"
