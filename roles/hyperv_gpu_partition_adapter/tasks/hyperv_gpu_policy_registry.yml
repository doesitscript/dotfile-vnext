---
- name: Ensure Hyper-V GPU policy registry path exists
  ansible.windows.win_powershell:
    script: |
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\HyperV'
      if (-not (Test-Path -LiteralPath $path)) {
        New-Item -Path $path -Force | Out-Null
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  register: hyperv_gpu_partition_adapter_policy_path
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool

- name: Ensure Hyper-V RequireSecureDeviceAssignment policy key is disabled
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\HyperV
    name: RequireSecureDeviceAssignment
  register: hyperv_gpu_partition_adapter_require_secure_device_assignment_stat
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool

- name: Set Hyper-V RequireSecureDeviceAssignment policy key to 0
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\HyperV
    name: RequireSecureDeviceAssignment
    data: 0
    type: dword
  register: hyperv_gpu_partition_adapter_require_secure_device_assignment_set
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool
    - >-
      not (hyperv_gpu_partition_adapter_require_secure_device_assignment_stat.exists | default(false) | bool)
      or (hyperv_gpu_partition_adapter_require_secure_device_assignment_stat.value | default(1) | int != 0)

- name: Ensure Hyper-V RequireSupportedDeviceAssignment policy key is disabled
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\HyperV
    name: RequireSupportedDeviceAssignment
  register: hyperv_gpu_partition_adapter_require_supported_device_assignment_stat
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool

- name: Set Hyper-V RequireSupportedDeviceAssignment policy key to 0
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\HyperV
    name: RequireSupportedDeviceAssignment
    data: 0
    type: dword
  register: hyperv_gpu_partition_adapter_require_supported_device_assignment_set
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool
    - >-
      not (hyperv_gpu_partition_adapter_require_supported_device_assignment_stat.exists | default(false) | bool)
      or (hyperv_gpu_partition_adapter_require_supported_device_assignment_stat.value | default(1) | int != 0)

- name: Restart Hyper-V Virtual Machine Management service after GPU policy key change
  ansible.windows.win_service:
    name: vmms
    state: restarted
  when:
    - hyperv_gpu_partition_adapter_state == 'present'
    - hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys | bool
    - hyperv_gpu_partition_adapter_restart_vmms_when_policy_keys_change | bool
    - >-
      (hyperv_gpu_partition_adapter_require_secure_device_assignment_set is defined
      and hyperv_gpu_partition_adapter_require_secure_device_assignment_set is changed)
      or (hyperv_gpu_partition_adapter_require_supported_device_assignment_set is defined
      and hyperv_gpu_partition_adapter_require_supported_device_assignment_set is changed)
