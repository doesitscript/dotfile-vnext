---
stern_cli_state: present
stern_cli_homebrew_formula: stern
stern_cli_verify: true
stern_cli_install_bash_completion: true
stern_cli_bash_completion_path: >-
  {{ (common_bash_completion_directory | default((ansible_env.HOMEBREW_PREFIX | default('/usr/local')) ~ '/etc/bash_completion.d')) ~ '/stern' }}
stern_cli_install_usage_note: true
stern_cli_usage_note_path: "{{ ansible_env.HOME }}/.config/dotfile-vnext/ai/tool-guides/stern.md"
