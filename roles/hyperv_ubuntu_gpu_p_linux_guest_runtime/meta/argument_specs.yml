---
argument_specs:
  main:
    short_description: Manage Hyper-V Ubuntu GPU-P runtime on a Linux guest.
    options:
      hyperv_ubuntu_gpu_p_linux_guest_runtime_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_ubuntu_gpu_p_linux_guest_runtime_skip_artifact_sync:
        type: bool
        default: false
        description: >-
          Skip Windows SMB artifact sync and reuse the existing guest runtime manifest
          when the Windows host share is unreachable but local /usr/lib/wsl is present.
      hyperv_ubuntu_gpu_p_linux_guest_target_kernel:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_dxgkrnl_repo_url:
        type: str
        default: https://github.com/staralt/dxgkrnl-dkms.git
      hyperv_ubuntu_gpu_p_dxgkrnl_repo_version:
        type: str
        default: 02565c968e19af86d84fe074d9fba8f059af65a2
      hyperv_ubuntu_gpu_p_wsl2_kernel_repo_url:
        type: str
        default: https://github.com/microsoft/WSL2-Linux-Kernel.git
      hyperv_ubuntu_gpu_p_install_vgem:
        type: bool
        default: false
      hyperv_ubuntu_gpu_p_guest_wsl_root:
        type: str
        default: /usr/lib/wsl
      hyperv_ubuntu_gpu_p_guest_state_manifest_path:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/state.json
      hyperv_ubuntu_gpu_p_guest_work_root:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime
      hyperv_ubuntu_gpu_p_guest_repo_cache_root:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/repo-cache
      hyperv_ubuntu_gpu_p_guest_build_root:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/build
      hyperv_ubuntu_gpu_p_guest_artifact_stage_root:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/artifact
      hyperv_ubuntu_gpu_p_guest_artifact_extract_root:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/artifact/payload
      hyperv_ubuntu_gpu_p_guest_artifact_mount_path:
        type: str
        default: /mnt/hyperv_ubuntu_gpu_p_runtime_share
      hyperv_ubuntu_gpu_p_guest_artifact_credentials_path:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/smb.creds
      hyperv_ubuntu_gpu_p_guest_artifact_receipt_path:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/artifact/publish-receipt.json
      hyperv_ubuntu_gpu_p_guest_artifact_manifest_path:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/artifact/payload-manifest.json
      hyperv_ubuntu_gpu_p_guest_artifact_driver_contract_path:
        type: str
        default: /var/lib/ansible/hyperv_ubuntu_gpu_p_runtime/artifact/driver-contract.json
      hyperv_ubuntu_gpu_p_guest_artifact_share_name:
        type: str
        default: public
      hyperv_ubuntu_gpu_p_guest_artifact_share_relative_root:
        type: str
        default: artifacts/hyperv_ubuntu_gpu_p_runtime/current
      hyperv_ubuntu_gpu_p_guest_artifact_mount_opts:
        type: str
        default: rw,vers=3,sec=ntlmssp
      hyperv_ubuntu_gpu_p_guest_ldso_file:
        type: str
        default: /etc/ld.so.conf.d/ld.wsl.conf
      hyperv_ubuntu_gpu_p_guest_root_owner:
        type: str
        default: root
      hyperv_ubuntu_gpu_p_guest_root_group:
        type: str
        default: root
      hyperv_ubuntu_gpu_p_guest_wsl_root_mode:
        type: str
        default: "0755"
      hyperv_ubuntu_gpu_p_guest_wsl_lib_mode:
        type: str
        default: "0755"
      hyperv_ubuntu_gpu_p_guest_wsl_drivers_mode:
        type: str
        default: "0555"
