  ansible.builtin.copy:
    dest: "{{ hyperv_ubuntu_gpu_p_guest_ldso_file }}"
    owner: "{{ hyperv_ubuntu_gpu_p_guest_root_owner }}"
    group: "{{ hyperv_ubuntu_gpu_p_guest_root_group }}"
    mode: "0644"
    content: |
      {{ hyperv_ubuntu_gpu_p_guest_wsl_root }}/lib
  register: hyperv_ubuntu_gpu_p_linux_guest_runtime_ldso

- name: Ensure /etc/environment PATH includes /usr/lib/wsl/lib
  ansible.builtin.lineinfile:
