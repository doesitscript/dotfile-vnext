    regexp: '^(PATH=".*?)(?::/usr/lib/wsl/lib)?(")$'
    line: '\1:{{ hyperv_ubuntu_gpu_p_guest_environment_path_append }}\2'
    backrefs: true
  register: hyperv_ubuntu_gpu_p_linux_guest_runtime_environment_path

- name: Refresh guest linker cache
  ansible.builtin.command:
    argv:
      - ldconfig
  register: hyperv_ubuntu_gpu_p_linux_guest_runtime_ldconfig
  changed_when: true

- name: Write guest runtime state manifest
  ansible.builtin.copy:
    dest: "{{ hyperv_ubuntu_gpu_p_guest_state_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_manifest | to_nice_json }}"
  vars:
    hyperv_ubuntu_gpu_p_linux_guest_runtime_manifest:
      target_kernel: "{{ hyperv_ubuntu_gpu_p_linux_guest_target_kernel }}"
      wsl_branch: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_wsl_branch }}"
      dxgkrnl_version: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
      dxgkrnl_repo_url: "{{ hyperv_ubuntu_gpu_p_dxgkrnl_repo_url }}"
      dxgkrnl_repo_version: "{{ hyperv_ubuntu_gpu_p_dxgkrnl_repo_version }}"
      wsl2_kernel_repo_url: "{{ hyperv_ubuntu_gpu_p_wsl2_kernel_repo_url }}"
      wsl2_kernel_repo_version: "{{ hyperv_ubuntu_gpu_p_wsl_kernel_branch_commit_map[hyperv_ubuntu_gpu_p_linux_guest_runtime_wsl_branch] }}"
      driverstore_folder: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_driverstore_folder }}"
      managed_lib_files: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_managed_lib_files }}"
      managed_driverstore_files: "{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_managed_driverstore_files }}"
      managed_symlinks: "{{ hyperv_ubuntu_gpu_p_guest_managed_symlinks }}"
      vgem_installed: "{{ hyperv_ubuntu_gpu_p_install_vgem | bool }}"
  register: hyperv_ubuntu_gpu_p_linux_guest_runtime_manifest_write

- name: Determine whether guest reboot is required
  ansible.builtin.set_fact:
    hyperv_ubuntu_gpu_p_linux_guest_runtime_reboot_required: >-
      {{
        (not (hyperv_ubuntu_gpu_p_linux_guest_runtime_dxg_installed | bool))
        or (hyperv_ubuntu_gpu_p_install_vgem | bool and not (hyperv_ubuntu_gpu_p_linux_guest_runtime_vgem_installed | bool))
        or (hyperv_ubuntu_gpu_p_linux_guest_runtime_symlinks is changed)
        or (hyperv_ubuntu_gpu_p_linux_guest_runtime_ldso is changed)
        or (hyperv_ubuntu_gpu_p_linux_guest_runtime_environment_path is changed)
      }}
  changed_when: false

- name: Reboot guest after runtime changes
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: hyperv_ubuntu_gpu_p_linux_guest_runtime_reboot_required | bool
