    - name: Reset target dxgkrnl source tree under /usr/src
      ansible.builtin.file:
        path: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
        state: absent

    - name: Create target dxgkrnl source tree under /usr/src
      ansible.builtin.file:
        path: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy patched dxgkrnl source files into /usr/src
      ansible.builtin.copy:
        remote_src: true
        src: "{{ hyperv_ubuntu_gpu_p_guest_build_root }}/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/drivers/hv/dxgkrnl/"
        dest: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/"

    - name: Copy patched include tree into /usr/src
      ansible.builtin.copy:
        remote_src: true
        src: "{{ hyperv_ubuntu_gpu_p_guest_build_root }}/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/include/"
        dest: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/include/"

    - name: Force dxgkrnl module build mode in Makefile
      ansible.builtin.replace:
        path: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/Makefile"
        regexp: '\\$\\(CONFIG_DXGKRNL\\)'
        replace: m

    - name: Append dxgkrnl extra Makefile flags
      ansible.builtin.blockinfile:
        path: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/Makefile"
        marker: "# {mark} ANSIBLE MANAGED BLOCK hyperv_ubuntu_gpu_p_dxgkrnl"
        block: |
          ifeq ($(shell echo ${kernelver} | egrep "\+deb[0-9]+"),)
          KERNEL_INCLUDE_PATH = /lib/modules/${kernelver}/build/include
          else
          KERNEL_INCLUDE_PATH = /lib/modules/${kernelver}/source/include
          endif
          EXTRA_CFLAGS += -I$(PWD)/include -D_MAIN_KERNEL_ -I${KERNEL_INCLUDE_PATH}/linux -include ${KERNEL_INCLUDE_PATH}/linux/vmalloc.h
          ccflags-y += ${EXTRA_CFLAGS}

    - name: Write dxgkrnl dkms.conf
      ansible.builtin.template:
        src: dxgkrnl-dkms.conf.j2
        dest: "/usr/src/dxgkrnl-{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}/dkms.conf"
        owner: root
        group: root
        mode: "0644"

    - name: Add dxgkrnl dkms module
      ansible.builtin.command:
        argv:
          - dkms
          - add
          - "-k"
          - "{{ hyperv_ubuntu_gpu_p_linux_guest_target_kernel }}"
          - "dxgkrnl/{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
      register: hyperv_ubuntu_gpu_p_linux_guest_runtime_dkms_add
      changed_when: true

    - name: Build dxgkrnl dkms module
      ansible.builtin.command:
        argv:
          - dkms
          - build
          - "-k"
          - "{{ hyperv_ubuntu_gpu_p_linux_guest_target_kernel }}"
          - "dxgkrnl/{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
          - --force
      register: hyperv_ubuntu_gpu_p_linux_guest_runtime_dkms_build
      changed_when: true

    - name: Install dxgkrnl dkms module
      ansible.builtin.command:
        argv:
          - dkms
          - install
          - "-k"
          - "{{ hyperv_ubuntu_gpu_p_linux_guest_target_kernel }}"
          - "dxgkrnl/{{ hyperv_ubuntu_gpu_p_linux_guest_runtime_dxgkrnl_version }}"
          - --force
      register: hyperv_ubuntu_gpu_p_linux_guest_runtime_dkms_install
      changed_when: true

