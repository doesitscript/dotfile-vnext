---
- name: Include macOS tasks
  ansible.builtin.include_tasks:
    file: mac.yml
    apply:
      tags: [cursor, cursor_unix, cursor_install, cursor_cli, cursor_pet]
  when: ansible_facts['system'] == "Darwin"
  tags: [cursor, cursor_unix, cursor_install, cursor_cli, cursor_pet]

- name: Include Ubuntu tasks
  ansible.builtin.include_tasks:
    file: ubuntu.yml
    apply:
      tags: [cursor, cursor_unix]
  when: ansible_facts['distribution'] == "Ubuntu"
  tags: [cursor, cursor_unix]

- name: Include Windows tasks
  ansible.builtin.include_tasks:
    file: windows.yml
    apply:
      tags: [cursor, cursor_windows]
  when: (ansible_facts['system'] | default('')) in ['Windows', 'Win32NT']
  tags: [cursor, cursor_windows]

- name: Install Cursor extensions
  ansible.builtin.include_tasks:
    file: extensions.yml
    apply:
      tags: [cursor, cursor_extensions]
  tags: [cursor, cursor_extensions]

- name: Ensure Cursor settings.json has LF + UTF-8-no-BOM
  ansible.builtin.include_tasks:
    file: settings.yml
    apply:
      tags: [cursor, cursor_settings]
  when: >
    cursor_settings_enabled | default(true) | bool
    and (ansible_facts['system'] | default('')) not in ['Windows', 'Win32NT']
  tags: [cursor, cursor_settings]

- name: Ensure Cursor macOS terminal locale env for Homebrew Bash
  ansible.builtin.include_tasks:
    file: macos_locale_env.yml
    apply:
      tags: [cursor, cursor_settings, locale]
  when: >
    cursor_settings_enabled | default(true) | bool
    and (ansible_facts['system'] | default('')) == 'Darwin'
  tags: [cursor, cursor_settings, locale]

- name: Deploy AI agent profile contract for Cursor and Codex
  ansible.builtin.include_tasks:
    file: ai_agent_profiles.yml
    apply:
      tags: [cursor, cursor_ai_profiles]
  when: cursor_ai_agent_profiles_enabled | default(true) | bool
  tags: [cursor, cursor_ai_profiles]

- name: Deploy Cursor marketplace plugin contract
  ansible.builtin.include_tasks:
    file: marketplace_plugins.yml
    apply:
      tags: [cursor, cursor_marketplace_plugins]
  when: cursor_marketplace_plugins_enabled | default(true) | bool
  tags: [cursor, cursor_marketplace_plugins]
