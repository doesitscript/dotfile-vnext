---
- name: Deploy Cursor editor configuration to .bashrc.d
  ansible.builtin.template:
    src: cursor.bash.j2
    dest: "{{ ansible_env.HOME }}/.bashrc.d/cursor.bash"
    mode: "0644"

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"
