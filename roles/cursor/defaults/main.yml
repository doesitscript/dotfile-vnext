---
# Cursor editor role defaults

# Shared Codex Cursor extension contract.
cursor_openai_extension_id: "openai.chatgpt"
cursor_openai_extension_version: "{{ codex_tooling_version_contract.cursor_extension | default('') }}"

# Extensions installed via CLI (bypasses marketplace GUI issues).
# Force reinstall by default so Cursor converges to the latest marketplace
# release instead of keeping an older cached extension install.
cursor_extensions_force_reinstall: true
cursor_extensions:
  - ms-python.python
  - ms-python.debugpy
  - redhat.vscode-yaml
  # Continue → LiteLLM config owned by roles/continue_ide
  - Continue.continue
  # Cline (marketplace id remains saoudrizwan.claude-dev)
  - saoudrizwan.claude-dev
  # Kilo Code Cursor/VS Code extension
  - kilocode.Kilo-Code
  - >-
      {{
        cursor_openai_extension_id
        ~ (
          '@' ~ cursor_openai_extension_version
          if (cursor_openai_extension_version | default('') | length) > 0
          else ''
        )
      }}

# Platform-specific path to Cursor settings.json.
# Prevents BOM and CRLF contamination in all files edited with Cursor.
cursor_settings_path: >-
  {{ (dotfiles_user_home | default(ansible_user_dir))
     + ('\\AppData\\Roaming\\Cursor\\User\\settings.json'
        if ansible_facts['system'] == 'Windows'
        else ('/Library/Application Support/Cursor/User/settings.json'
              if ansible_facts['system'] == 'Darwin'
              else '/.config/Cursor/User/settings.json')) }}

# Set to false to skip the settings.json merge for this node.
cursor_settings_enabled: true

# Cursor agent terminals must find user-owned CLIs even without login startup.
# Keep VS Code's runtime substitution; never freeze the controller's PATH here.
cursor_macos_terminal_path: >-
  {{ dotfiles_user_home | default(ansible_user_dir) }}/.local/bin:{{ dotfiles_user_home | default(ansible_user_dir) }}/bin:${env:PATH}

# Settings merged idempotently — only keys not already present are added.
# Existing user values are always preserved.
# This enforces LF line endings and UTF-8-no-BOM across all files edited with Cursor,
# preventing CRLF contamination and BOM characters in source-controlled files.
cursor_settings_lf_utf8:
  files.eol: "\n"
  files.encoding: "utf8"
  files.insertFinalNewline: true
  files.trimFinalNewlines: true

# Cursor CLI (agent binary) — separate Homebrew cask from the IDE.
# cursor_cli_version pins the cask to the version tracked in the version contract.
# state: present = install if absent, do not auto-upgrade (version-contract-driven upgrades only).
# Set cursor_cli_enabled: false in host/group vars to skip install entirely.
cursor_cli_enabled: true
cursor_cli_version: "{{ codex_tooling_version_contract.cursor_cli | default('') }}"
cursor_cli_cask_state: present

# Project-scoped AI agent/profile declarations for Cursor and Codex-compatible
# clients. These files do not pretend to configure Cursor's account/model UI;
# they give the project a stable, repo-managed contract that agents can read.
cursor_ai_agent_profiles_enabled: true
cursor_ai_agent_profiles_project_root: "{{ dotfiles_home | default(playbook_dir | dirname) }}"
cursor_ai_agent_profiles_source_path: "{{ cursor_ai_agent_profiles_project_root }}/inventory/group_vars/all/ai_agent_profiles.yml"
cursor_ai_model_catalog_source_path: "{{ cursor_ai_agent_profiles_project_root }}/inventory/group_vars/model_catalog/manifest.yml"
cursor_ai_agent_profiles_cursor_path: "{{ cursor_ai_agent_profiles_project_root }}/.cursor/ai-agent-profiles.json"
cursor_ai_agent_profiles_codex_path: "{{ cursor_ai_agent_profiles_project_root }}/.codex/ai-agent-profiles.json"
cursor_ai_agent_profiles_rule_path: "{{ cursor_ai_agent_profiles_project_root }}/.cursor/rules/framework-ai-agent-model-lanes.mdc"
cursor_ai_agent_profiles_codex_doc_path: "{{ cursor_ai_agent_profiles_project_root }}/.codex/AI_AGENT_PROFILES.md"

# ── Manual model setup notes ─────────────────────────────────────────────────
# These models require one-time UI configuration on each Mac.
# They cannot be automated via Ansible because providers store config in
# VS Code Secrets (encrypted keychain) or in Cursor's account/server state.
#
# Cursor Settings > Models (OpenAI-compatible provider):
#   Base URL: http://litellm.hom.lab/v1
#   API key: LITELLM_MASTER_KEY (from vault)
#   Add each model ID:
#     gemini-2.5-flash   # daily driver
#     gemini-2.5-flash-long-context      # 1M context
#     gemini-2.5-pro      # hard reasoning
#     gemini-2.5-flash-lite         # bulk / cheap
#
# Cline (saoudrizwan.claude-dev) sidebar → Settings:
#   API Provider: OpenAI Compatible
#   Base URL: http://litellm.hom.lab/v1
#   API key: LITELLM_MASTER_KEY (from vault)
#   Model ID: one of the four Gemini IDs above (set per-session as needed)
# ─────────────────────────────────────────────────────────────────────────────

# Cursor marketplace plugins use a separate subsystem from VS Code extensions.
# Track required plugin slugs in the repo and verify their installed manifests
# on macOS instead of trying to install them with `cursor --install-extension`.
cursor_marketplace_plugins_enabled: true
cursor_marketplace_plugins_project_root: "{{ cursor_ai_agent_profiles_project_root }}"
cursor_marketplace_plugins_required: []
cursor_marketplace_plugins_contract_path: "{{ cursor_marketplace_plugins_project_root }}/.cursor/marketplace-plugins.json"
cursor_marketplace_plugins_codex_doc_path: "{{ cursor_marketplace_plugins_project_root }}/.codex/CURSOR_MARKETPLACE_PLUGINS.md"
cursor_marketplace_plugins_cache_root: "{{ (dotfiles_user_home | default(ansible_user_dir)) + '/.cursor/plugins/cache/cursor-public' }}"

# User-scope Cursor MCP for the multiagents peer. Project .cursor/mcp.json is
# not enough: Cursor Agent loads ~/.cursor/mcp.json without the project-MCP
# allowlist. Upstream install-mcp does not write Cursor configs.
# multiagents has no cursor agent type; claude is the generic stdio adapter.
cursor_multiagents_mcp_enabled: "{{ (multiagents_state | default('absent')) == 'present' }}"
cursor_multiagents_mcp_require_cli: false
cursor_multiagents_mcp_server_key: multiagents-peer
cursor_multiagents_mcp_agent_type: claude
cursor_multiagents_mcp_user_config_path: "{{ ansible_env.HOME }}/.cursor/mcp.json"
cursor_multiagents_mcp_bun_bin: "{{ ansible_env.HOME }}/.bun/bin/bun"
cursor_multiagents_mcp_cli: "{{ ansible_env.HOME }}/.bun/install/global/node_modules/multiagents/cli.ts"
cursor_multiagents_mcp_role_path: roles/cursor
cursor_multiagents_mcp_entry:
  command: "{{ cursor_multiagents_mcp_bun_bin }}"
  args:
    - "{{ cursor_multiagents_mcp_cli }}"
    - mcp-server
    - --agent-type
    - "{{ cursor_multiagents_mcp_agent_type }}"
  env:
    PATH: "{{ cursor_multiagents_mcp_bun_bin | dirname }}:/usr/bin:/bin:/usr/sbin:/sbin"
    _MCP_ANSIBLE_ROLE_PATH: "{{ cursor_multiagents_mcp_role_path }}"
