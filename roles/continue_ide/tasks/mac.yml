---
- name: Load shared vault for Continue LiteLLM API key when unset
  when:
    - continue_ide_state == "present"
    - continue_ide_api_key | default('') | length == 0
  block:
    - name: Include shared vault for Continue
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/../vault/shared.vault.yml"
        name: continue_ide_vault_vars
      no_log: true

    - name: Resolve Continue API key from LiteLLM master key vault var
      ansible.builtin.set_fact:
        continue_ide_api_key: >-
          {{
            continue_ide_vault_vars.vault_k3s_litellm_gateway_master_key
            | default('')
          }}
      no_log: true

- name: Ensure Continue config directory exists
  ansible.builtin.file:
    path: "{{ continue_ide_config_dir }}"
    state: directory
    mode: "0700"
  when: continue_ide_state == "present"

- name: Deploy Continue config for LiteLLM lanes
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ continue_ide_config_path }}"
    mode: "0600"
  when: continue_ide_state == "present"
  no_log: true

- name: Remove Continue config managed by this role
  ansible.builtin.file:
    path: "{{ continue_ide_config_path }}"
    state: absent
  when: continue_ide_state == "absent"

- name: Report Continue IDE config path
  ansible.builtin.debug:
    msg: >-
      continue_ide_state={{ continue_ide_state }}
      config={{ continue_ide_config_path }}
      api_base={{ continue_ide_gateway_api_base }}
      api_key_set={{ (continue_ide_api_key | default('') | length > 0) | bool }}
