---
- name: Check Continue LiteLLM vault file
  ansible.builtin.stat:
    path: "{{ continue_ide_vault_file_path }}"
  register: _continue_ide_vault_stat
  when:
    - continue_ide_state == "present"
    - continue_ide_api_key | default('') | length == 0

- name: Load shared vault for Continue LiteLLM API key when unset
  when:
    - continue_ide_state == "present"
    - continue_ide_api_key | default('') | length == 0
    - _continue_ide_vault_stat.stat.exists | default(false)
  ansible.builtin.include_vars:
    file: "{{ continue_ide_vault_file_path }}"
    name: continue_ide_vault_vars
  no_log: true

- name: Ensure Continue config directory exists
  ansible.builtin.file:
    path: "{{ continue_ide_config_dir }}"
    state: directory
    mode: "0700"
  when: continue_ide_state == "present"

- name: Resolve Continue LiteLLM API key for render
  ansible.builtin.set_fact:
    continue_ide_render_api_key: >-
      {{
        continue_ide_api_key
        if (continue_ide_api_key | default('') | length > 0)
        else (
          (continue_ide_vault_vars | default({}))['vault_k3s_litellm_gateway_master_key']
          | default('REPLACE_WITH_LITELLM_KEY')
        )
      }}
  when: continue_ide_state == "present"
  no_log: true

- name: Resolve Continue model catalog from commissioned SSOT
  ansible.builtin.set_fact:
    continue_ide_models: []
  when:
    - continue_ide_state == "present"
    - ai_cli_commissioned_models is defined

- name: Translate commissioned model rows to Continue schema
  ansible.builtin.set_fact:
    continue_ide_models: >-
      {{
        continue_ide_models
        + [
            {
              'name': item.display_name | default(item.id),
              'model': item.id,
              'enabled':
                (continue_ide_autocomplete_enabled | bool)
                if item.id == 'qwen2.5-coder-1.5b-base-q8_0'
                else item.enabled | default(true),
              'roles': item.labels | default([]) | intersect(['chat', 'edit', 'apply', 'autocomplete', 'embed']),
              'capabilities': ['tool_use'] if 'tools' in (item.labels | default([])) else []
            }
            | combine(
                {
                  'default_completion_options': {
                    'contextLength': item.context | default(32768),
                    'maxTokens': item.max_output | default(4096),
                    'temperature': item.temperature | default(0.2)
                  }
                  | combine(
                      {'topP': item.top_p}
                      if item.top_p is defined else {}
                    )
                }
              )
            | combine(
                {
                  'use_legacy_completions_endpoint': true,
                  'autocomplete_options': {
                    'debounceDelay': 250,
                    'maxPromptTokens': 1024,
                    'onlyMyCode': true
                  }
                }
                if item.id == 'qwen2.5-coder-1.5b-base-q8_0' else {}
              )
          ]
      }}
  loop: "{{ ai_cli_commissioned_models }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - continue_ide_state == "present"
    - ai_cli_commissioned_models is defined
    - >-
      (
        item.labels | default([])
        | intersect(ai_cli_client_model_contracts.continue_ide.accept_roles | default(['chat', 'edit', 'apply', 'autocomplete', 'embed']))
        | length
      ) > 0

- name: Require a real LiteLLM key for Continue when present
  ansible.builtin.assert:
    that:
      - continue_ide_models | default([]) | length > 0
      - >-
        (not (continue_ide_require_api_key | default(true) | bool))
        or (
          (continue_ide_render_api_key | default('') | length > 0)
          and (continue_ide_render_api_key | default('') != 'REPLACE_WITH_LITELLM_KEY')
        )
    fail_msg: >-
      continue_ide_state=present but models are empty or the LiteLLM API key
      is still REPLACE_WITH_LITELLM_KEY. Hydrate vault/shared.vault.yml
      (vault_k3s_litellm_gateway_master_key) or set continue_ide_api_key.
      Without a real key Continue's UI often looks empty / unconfigured.
  when: continue_ide_state == "present"

- name: Check pinned Firebase CLI for Continue MCP
  vars:
    _continue_ide_npm_executable: "{{ work_laptop_nvm_exec if (work_laptop_nvm_exec | default('') | length > 0) else 'npm' }}"
    _continue_ide_npm_args:
      - list
      - --global
      - --depth=0
      - "firebase-tools@{{ continue_ide_firebase_tools_version | default('15.30.0') }}"
  ansible.builtin.command:
    argv:
      - "{{ _continue_ide_npm_executable }}"
      - "{{ _continue_ide_npm_args[0] }}"
      - "{{ _continue_ide_npm_args[1] }}"
      - "{{ _continue_ide_npm_args[2] }}"
      - "{{ _continue_ide_npm_args[3] }}"
  register: continue_ide_firebase_cli_check
  changed_when: false
  failed_when: false
  when:
    - continue_ide_state == "present"
    - continue_ide_provision_firebase_cli | default(false) | bool

- name: Install pinned Firebase CLI for Continue MCP
  vars:
    _continue_ide_npm_executable: "{{ work_laptop_nvm_exec if (work_laptop_nvm_exec | default('') | length > 0) else 'npm' }}"
    _continue_ide_npm_args:
      - install
      - --global
      - "firebase-tools@{{ continue_ide_firebase_tools_version | default('15.30.0') }}"
  ansible.builtin.command:
    argv:
      - "{{ _continue_ide_npm_executable }}"
      - "{{ _continue_ide_npm_args[0] }}"
      - "{{ _continue_ide_npm_args[1] }}"
      - "{{ _continue_ide_npm_args[2] }}"
  changed_when: continue_ide_firebase_cli_check.rc | default(1) != 0
  when:
    - continue_ide_state == "present"
    - continue_ide_provision_firebase_cli | default(false) | bool
    - continue_ide_firebase_cli_check.rc | default(1) != 0

- name: Require Continue stdio MCP entries to include a usable command
  ansible.builtin.assert:
    that:
      - >-
        (
          continue_ide_mcp_servers | default([])
          | selectattr('type', 'defined')
          | selectattr('type', 'equalto', 'stdio')
          | list
          | length
        ) == 0
        or
        (
          continue_ide_mcp_servers | default([])
          | selectattr('type', 'defined')
          | selectattr('type', 'equalto', 'stdio')
          | rejectattr('command', 'defined')
          | list
          | length
        ) == 0
      - >-
        (
          continue_ide_mcp_servers | default([])
          | map(attribute='command', default='')
          | select('search', 'error|undefined', ignorecase=True)
          | list
          | length
        ) == 0
    fail_msg: >-
      continue_ide_mcp_servers has a stdio entry missing `command`, or command
      contains an Ansible template error (often undefined dotfiles_home).
      Continue rejects the whole config.yaml when stdio MCP omits command.
      Fix host_vars / set dotfiles_home on the play, then re-run.
  when:
    - continue_ide_state == "present"
    - (continue_ide_mcp_servers | default([]) | length) > 0

- name: Deploy Continue config for LiteLLM lanes
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ continue_ide_config_path }}"
    mode: "0600"
  when: continue_ide_state == "present"
  no_log: true

# Full-file template replace (no force / no merge). Local edits/comments in
# ~/.continue/config.yaml are discarded on every present run. Desired state is
# continue_ide_models (+ local models) with enabled|default(true); disable an
# entry with enabled: false. Autocomplete uses that same flag via
# continue_ide_autocomplete_enabled on the FIM model entry in role defaults.
- name: Verify Continue autocomplete role is present when FIM is enabled
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -F
      - --
      - '- "autocomplete"'
      - "{{ continue_ide_config_path }}"
  register: continue_ide_autocomplete_grep
  changed_when: false
  failed_when: continue_ide_autocomplete_grep.rc != 0
  when:
    - continue_ide_state == "present"
    - continue_ide_autocomplete_enabled | default(false) | bool

- name: Verify Continue config.yaml has models
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -E
      - "^models:|[[:space:]]+- name:"
      - "{{ continue_ide_config_path }}"
  register: continue_ide_config_grep
  changed_when: false
  failed_when: continue_ide_config_grep.rc != 0
  when: continue_ide_state == "present"

- name: Remove Continue config managed by this role
  ansible.builtin.file:
    path: "{{ continue_ide_config_path }}"
    state: absent
  when: continue_ide_state == "absent"

- name: Report Continue IDE config path
  ansible.builtin.debug:
    msg: >-
      continue_ide_state={{ continue_ide_state }}
      autocomplete_enabled={{ continue_ide_autocomplete_enabled | default(false) }}
      config={{ continue_ide_config_path }}
      api_base={{ continue_ide_gateway_api_base }}
      model_count={{ continue_ide_models | default([]) | length }}
      mcp_server_count={{ continue_ide_mcp_servers | default([]) | length }}
      api_key_from_inventory={{ (continue_ide_api_key | default('') | length > 0) | bool }}
      api_key_resolved={{
        (continue_ide_render_api_key | default('') | length > 0)
        and (continue_ide_render_api_key | default('') != 'REPLACE_WITH_LITELLM_KEY')
      }}
  when: continue_ide_state == "present"
