---
argument_specs:
  main:
    short_description: Manage Continue IDE config for LiteLLM gateway lanes
    options:
      continue_ide_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      continue_ide_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab"
        description: >-
          Continue apiBase without /v1. Continue probes GET {apiBase}; this
          LiteLLM gateway 404s on bare /v1.
      continue_ide_api_key:
        type: str
        required: false
        default: ""
      continue_ide_config_path:
        type: str
        required: false
        default: "{{ ansible_env.HOME }}/.continue/config.yaml"
      continue_ide_config_name:
        type: str
        required: false
        default: "Homelab Continue via LiteLLM"
      continue_ide_config_version:
        type: str
        required: false
        default: "1.0.0"
      continue_ide_config_schema:
        type: str
        required: false
        default: "v1"
      continue_ide_provider:
        type: str
        required: false
        default: "openai"
      continue_ide_autocomplete_enabled:
        type: bool
        required: false
        default: false
        description: >-
          Render autocomplete-role models only when explicitly enabled. Keep
          disabled for remote-backed lanes.
      continue_ide_models:
        type: list
        elements: dict
        required: false
        description: Commissioned Continue model entries (name, model, roles).
      continue_ide_blocked_lanes:
        type: list
        elements: str
        required: false
        description: Blocked lane notes rendered as comments in config.yaml.
