---
argument_specs:
  main:
    short_description: Manage Continue IDE config for LiteLLM gateway lanes
    options:
      continue_ide_state:
        type: str
        required: false
        default: absent
        choices:
          - present
          - absent
      continue_ide_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
      continue_ide_api_key:
        type: str
        required: false
        default: ""
      continue_ide_config_path:
        type: str
        required: false
        default: "{{ ansible_env.HOME }}/.continue/config.yaml"
