---
# Continue IDE config pointing at the shared LiteLLM gateway.
# Lifecycle: continue_ide_state: present|absent
#
# Commissioned LiteLLM lane ids (cross-client SSOT):
#   inventory/group_vars/all/ai_cli_apps.yml → ai_cli_commissioned_models
# Deploy all AI CLI apps: playbook tag ai_cli_apps (alias ai_clients).
# Model field = plain LiteLLM id (same as Cline). OpenCode/Kilo add litellm/ only
# for their provider/model selection string — catalog keys stay plain.
continue_ide_state: absent
continue_ide_config_dir: "{{ ansible_env.HOME }}/.continue"
continue_ide_config_path: "{{ continue_ide_config_dir }}/config.yaml"
# Continue probes GET {apiBase}; omit /v1 on this gateway.
continue_ide_gateway_api_base: "http://litellm.hom.lab"
continue_ide_api_key: ""
# Fail present runs when vault/inventory still leave REPLACE_WITH_LITELLM_KEY.
continue_ide_require_api_key: true
# Default matches parent-repo playbooks (inventory/ → ../vault). Override on packets.
continue_ide_vault_file_path: "{{ inventory_dir }}/../vault/shared.vault.yml"
continue_ide_config_name: "Homelab Continue via LiteLLM"
continue_ide_config_version: "1.0.0"
continue_ide_config_schema: "v1"
continue_ide_provider: "openai"
continue_ide_mcp_servers: []
# List entries may set enabled: false. Continue has no native toggle — those
# entries render as YAML comments in config.yaml (catalog kept for commission).
# Cline mirrors the list and uses mcpServers.*.disabled instead.
continue_ide_rules: []
# Packet/work-laptop: pin firebase-tools for Continue MCP (nvm-exec prefix safe).
continue_ide_provision_firebase_cli: false
continue_ide_firebase_tools_version: "15.30.0"
# Shared completion caps — align with vLLM --max-model-len 32768 on 5090.
continue_ide_default_context_length: 32768
continue_ide_default_max_tokens: 4096
continue_ide_autocomplete_debounce_delay: 250
# Hosts that should not ship remote FIM set continue_ide_autocomplete_enabled:
# false (role default). That flips enabled on the autocomplete model entry only —
# the template has no role-specific omit gate; it renders every enabled entry.
continue_ide_autocomplete_enabled: false
# Client-local models (Jan / DMR openai / legacy ollama). Prefer openai provider.
# Legacy alias continue_ide_ollama_local_models still accepted by the template.
continue_ide_local_models: []
continue_ide_ollama_local_models: []
# Commissioned lanes — plain ids; must exist on GET /v1/models.
# OPEN: newer role picks (e.g. Edit 14B) do not auto-retire older catalog rows
# (e.g. prior Edit 7B). See docs/lessons-learned/continue/do-not-auto-retire-older-model-entries.md
continue_ide_models:
  - name: "Qwen3-Coder-30B-A3B"
    model: "qwen3-coder-30b-a3b"
    capabilities:
      - tool_use
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      # Leave headroom: input + maxTokens must stay <= 32768 (inbox 2026-09-12).
      maxTokens: 4096
      temperature: 0.7
      topP: 0.8
  - name: "Qwen3.6-35B-A3B (pending sequential)"
    model: "qwen3.6-35b-a3b"
    enabled: false
    capabilities:
      - tool_use
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.6
      topP: 0.95
  - name: "qwen2.5-coder:14b"
    model: "qwen2.5-coder-14b"
    roles:
      - edit
    default_completion_options:
      contextLength: 12000
      maxTokens: 4096
      temperature: 0.2
  - name: "qwen2.5-coder:7b"
    model: "qwen2.5-coder-7b"
    roles:
      - apply
    default_completion_options:
      contextLength: 12000
      maxTokens: 4096
      temperature: 0.2
  # Autocomplete = FIM only (not chat). Ollama GGUF tag
  # qwen2.5-coder:1.5b-base-q8_0 (llama.cpp on HVH-01). Modelfile TEMPLATE uses
  # <|fim_prefix|>/<|fim_suffix|>/<|fim_middle|> when .Suffix is set; Continue
  # promptTemplates.autocomplete must match. Legacy completions → /v1/completions.
  #
  # Other FIM candidates (NOT commissioned — verify before trying):
  #   - granite-code:8b / granite-code:8b-base (IBM Granite Code; paper trains FIM)
  #   - starcoder2:3b or starcoder2:7b (well-rated FIM family; prefer base/default
  #     tags over *-instruct). 15b usually too large for GTX 1060 6GB.
  # Gate if tried: (1) ollama show <tag> TEMPLATE must emit FIM tokens when
  # .Suffix is set; (2) LiteLLM POST /v1/completions FIM smoke HTTP 200 + text;
  # (3) Continue promptTemplates may need retuning if tokens differ from
  # <|fim_prefix|>/<|fim_suffix|>/<|fim_middle|>. Chat-only success ≠ FIM OK.
  - name: "qwen2.5-coder:1.5b-base-q8_0"
    model: "qwen2.5-coder-1.5b-base-q8_0"
    # Same generic enabled flag as any other model — not a template special case.
    enabled: "{{ continue_ide_autocomplete_enabled | bool }}"
    roles:
      - autocomplete
    use_legacy_completions_endpoint: true
    default_completion_options:
      # Operator-chosen FIM context (was 4096); keep maxTokens 256 for Tab-complete.
      contextLength: 12768
      maxTokens: 256
      temperature: 0.0
    autocomplete_options:
      debounceDelay: 250
      maxPromptTokens: 1024
      onlyMyCode: true
  - name: "nomic-embed-text"
    model: "nomic-embed-text"
    roles:
      - embed
  - name: "gpt-oss:20b"
    model: "gpt-oss-20b"
    roles:
      - chat
    default_completion_options:
      contextLength: 131072
      maxTokens: 4096
      temperature: 1.0
      topP: 0.95
  - name: "Gemini 2.5 Flash (Daily Driver)"
    model: "gemini-2.5-flash"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 4096
      temperature: 0.3
  - name: "Gemini 2.5 Flash (Long Context 1M)"
    model: "gemini-2.5-flash-long-context"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 4096
      temperature: 0.3
  - name: "Gemini 2.5 Pro (Deep Reasoning)"
    model: "gemini-2.5-pro"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 4096
      temperature: 0.2
  - name: "Gemini 2.5 Flash Lite (Bulk)"
    model: "gemini-2.5-flash-lite"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 4096
      temperature: 0.3
continue_ide_blocked_lanes:
  - "qwen2.5-coder-14b on 5090 (superseded by Qwen3.6 / Qwen3-Coder sequential lane)"
  - "Remote FIM model entry uses enabled via continue_ide_autocomplete_enabled (mac-dev true)."
