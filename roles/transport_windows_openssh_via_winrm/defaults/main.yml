---
# Inventory: set win_ssh_user per host (or use win_user / ansible_user from inventory); no hardcoded usernames.
win_ssh_port: 22
# win_ssh_user: set in host_vars/group_vars (e.g. same as win_user or ansible_user)

# invariant paths
administrators_authorized_keys_path: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
sshd_config_path: "C:\\ProgramData\\ssh\\sshd_config"

# capability string: keep explicit (no $cap null mistakes)
openssh_server_capability: "OpenSSH.Server~~~~0.0.1.0"

# verification (runs from execution node without changing inventory transport)
verify_ssh_from_execnode: true
verify_ssh_connect_timeout_seconds: 15
