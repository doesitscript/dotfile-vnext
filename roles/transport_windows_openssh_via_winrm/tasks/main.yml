---
- name: Ensure OpenSSH Server capability installed (explicit capability)
  ansible.windows.win_shell: |
    $capName = "{{ openssh_server_capability }}"
    $state = (Get-WindowsCapability -Online -Name $capName).State
    if ($state -ne "Installed") {
      Add-WindowsCapability -Online -Name $capName | Out-Null
      Write-Output "INSTALLED"
    } else {
      Write-Output "AlreadyInstalled"
    }
  register: ssh_install
  changed_when: "'INSTALLED' in (ssh_install.stdout | default(''))"

- name: Ensure sshd service is running
  ansible.windows.win_service:
    name: sshd
    state: started
    start_mode: auto

- name: Ensure SSH firewall rule
  community.windows.win_firewall_rule:
    name: sshd-Server-In-TCP
    localport: "{{ win_ssh_port }}"
    protocol: tcp
    action: allow
    direction: in
    state: present
    enabled: true

# DO NOT DELETE OR "SIMPLIFY" THIS INVARIANT BLOCK
# administrators_authorized_keys: create file and set ACL (no inheritance; Administrators + SYSTEM FullControl only)

- name: Ensure administrators_authorized_keys file exists
  ansible.windows.win_file:
    path: "{{ administrators_authorized_keys_path }}"
    state: touch

- name: Disable ACL inheritance on administrators_authorized_keys (do not reorganize)
  ansible.windows.win_acl_inheritance:
    path: "{{ administrators_authorized_keys_path }}"
    state: absent
    reorganize: false

- name: Grant Administrators FullControl on administrators_authorized_keys
  ansible.windows.win_acl:
    path: "{{ administrators_authorized_keys_path }}"
    user: Administrators
    type: allow
    rights: FullControl
    state: present

- name: Grant SYSTEM FullControl on administrators_authorized_keys
  ansible.windows.win_acl:
    path: "{{ administrators_authorized_keys_path }}"
    user: SYSTEM
    type: allow
    rights: FullControl
    state: present

- name: Install public key in administrators_authorized_keys (from execution node host facts)
  community.windows.win_lineinfile:
    path: "{{ administrators_authorized_keys_path }}"
    line: "{{ hostvars[groups['execution_nodes'][0]].execution_node_pub_key_content }}"
    create: true
    state: present
  register: install_pub_key_result
  when:
    - hostvars[groups['execution_nodes'][0]].execution_node_pub_key_content is defined
    - hostvars[groups['execution_nodes'][0]].execution_node_pub_key_content | length > 0

- name: Restart sshd after key or capability change
  ansible.windows.win_service:
    name: sshd
    state: restarted
  when: install_pub_key_result is changed or ssh_install is changed

# verification: this is the "capability scaled across two computers" example (mac verifies windows SSH without changing inventory transport)
- name: Verify port 22 reachable from execution node
  when: verify_ssh_from_execnode | bool
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
    port: "{{ win_ssh_port }}"
    timeout: 30
  delegate_to: "{{ groups['execution_nodes'][0] }}"

- name: Verify SSH key auth works from execution node (non-destructive)
  when: verify_ssh_from_execnode | bool
  ansible.builtin.shell: |
    ssh -i "{{ hostvars[groups['execution_nodes'][0]].execution_node_pub_key_path | default(lookup('env','HOME') ~ '/.ssh/id_ed25519_ansible') }}" \
      -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout={{ verify_ssh_connect_timeout_seconds }} \
      "{{ win_ssh_user | default(win_user) | default(ansible_user) }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}" \
      'exit 0'
  register: ssh_verify
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups['execution_nodes'][0] }}"

- name: Fail if SSH verification failed (skip known WSL DefaultShell parsing issue on Windows)
  when:
    - verify_ssh_from_execnode | bool
    - ssh_verify.rc | default(0) != 0
    - not (ssh_verify.rc == 127 and (ssh_verify.stderr | default('')) is search('Ubuntu-24.04'))
  ansible.builtin.fail:
    msg: "ssh verification failed for {{ inventory_hostname }} (rc {{ ssh_verify.rc | default('') }}): {{ ssh_verify.stderr | default('') }}"
