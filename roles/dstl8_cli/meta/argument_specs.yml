---
argument_specs:
  main:
    short_description: >-
      Manage Dstl8 on macOS through Homebrew and install AI/operator runtime-feedback guidance
    options:
      dstl8_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - Whether the Homebrew Dstl8 formula should be installed or removed.
      dstl8_cli_homebrew_tap:
        type: str
        default: control-theory/dstl8
        description:
          - Homebrew tap required before the Dstl8 formula can be managed.
      dstl8_cli_homebrew_formula:
        type: str
        default: dstl8
        description:
          - Homebrew formula name that provides the Dstl8 CLI after the tap exists.
      dstl8_cli_verify_formula_name:
        type: str
        default: dstl8
        description:
          - Bare formula name used for verification commands such as brew list.
      dstl8_cli_verify:
        type: bool
        default: true
        description:
          - Verify the requested formula state after convergence.
      dstl8_cli_install_bash_completion:
        type: bool
        default: true
        description:
          - Whether to install the managed Dstl8 bash completion file on macOS.
      dstl8_cli_bash_completion_path:
        type: str
        default: >-
          {{ (common_bash_completion_directory | default((ansible_env.HOMEBREW_PREFIX | default('/usr/local')) ~ '/etc/bash_completion.d')) ~ '/dstl8' }}
        description:
          - Filesystem path for the managed Dstl8 bash completion file.
      dstl8_cli_install_usage_note:
        type: bool
        default: true
        description:
          - Whether to install the managed Dstl8 AI/operator usage note on macOS.
      dstl8_cli_usage_note_path:
        type: str
        default: "{{ ansible_env.HOME }}/.config/dotfile-vnext/ai/tool-guides/dstl8.md"
        description:
          - Filesystem path for the managed Dstl8 usage note rendered on macOS.
