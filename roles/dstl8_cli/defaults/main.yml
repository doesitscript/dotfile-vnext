---
dstl8_cli_state: present
dstl8_cli_homebrew_tap: control-theory/dstl8
dstl8_cli_homebrew_formula: dstl8
dstl8_cli_verify_formula_name: dstl8
dstl8_cli_verify: true
dstl8_cli_install_bash_completion: true
dstl8_cli_bash_completion_path: >-
  {{ (common_bash_completion_directory | default((ansible_env.HOMEBREW_PREFIX | default('/usr/local')) ~ '/etc/bash_completion.d')) ~ '/dstl8' }}
dstl8_cli_install_usage_note: true
dstl8_cli_usage_note_path: "{{ ansible_env.HOME }}/.config/dotfile-vnext/ai/tool-guides/dstl8.md"
