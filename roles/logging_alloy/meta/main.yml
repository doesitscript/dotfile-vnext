---
galaxy_info:
  role_name: logging_alloy
  description: >-
    Deploy and configure Grafana Alloy log-collection agent across all surfaces:
    Windows (Event Log + OpenSSH), WSL/Linux (journald), and macOS (file-based).
  min_ansible_version: "2.14"
  platforms:
    - name: Windows
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: MacOSX
      versions:
        - all

dependencies: []
