---
argument_specs:
  main:
    short_description: "Install and manage the Terraform CLI on macOS"
    options:
      terraform_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether Terraform CLI should be installed or removed."
      terraform_cli_homebrew_tap:
        type: str
        default: hashicorp/tap
        description:
          - "Homebrew tap that publishes the Terraform formula."
      terraform_cli_homebrew_formula:
        type: str
        default: hashicorp/tap/terraform
        description:
          - "Homebrew formula used to manage Terraform CLI."
      terraform_cli_verify:
        type: bool
        default: true
        description:
          - "Verify the requested Terraform CLI state after convergence."
