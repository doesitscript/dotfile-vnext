---
- name: Remove Ubuntu managed update curtailment
  ansible.builtin.include_tasks: ubuntu_absent.yml
  when: >-
    (
      ansible_facts.get('distribution', '')
      if (ansible_facts | default({})) is mapping
      else ''
    ) == 'Ubuntu'
    or (ansible_distribution | default('')) == 'Ubuntu'
  tags:
    - managed_update_policy
    - managed_update_policy_ubuntu

- name: Remove Windows managed update curtailment
  ansible.builtin.include_tasks: windows_absent.yml
  when: >-
    (
      ansible_facts.get('system', '')
      if (ansible_facts | default({})) is mapping
      else ''
    ) in ['Windows', 'Win32NT']
    or (ansible_system | default('')) in ['Windows', 'Win32NT']
  tags:
    - managed_update_policy
    - managed_update_policy_windows

- name: Remove macOS managed update curtailment
  ansible.builtin.include_tasks: macos_absent.yml
  when: >-
    (
      ansible_facts.get('system', '')
      if (ansible_facts | default({})) is mapping
      else ''
    ) == 'Darwin'
    or (ansible_system | default('')) == 'Darwin'
  tags:
    - managed_update_policy
    - managed_update_policy_macos
