---
- name: Remove Windows Automatic Updates NoAutoUpdate policy value
  ansible.windows.win_regedit:
    path: "{{ managed_update_policy_windows_au_reg_path }}"
    name: NoAutoUpdate
    state: absent
  when: managed_update_policy_windows_no_auto_update | bool
  tags:
    - managed_update_policy
    - managed_update_policy_windows

- name: Remove Windows Automatic Updates AUOptions policy value
  ansible.windows.win_regedit:
    path: "{{ managed_update_policy_windows_au_reg_path }}"
    name: AUOptions
    state: absent
  when: managed_update_policy_windows_no_auto_update | bool
  tags:
    - managed_update_policy
    - managed_update_policy_windows

- name: Unpin listed Chocolatey packages
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: present
    pinned: false
  loop: "{{ managed_update_policy_chocolatey_pin_packages }}"
  when: managed_update_policy_chocolatey_pin_packages | length > 0
  tags:
    - managed_update_policy
    - managed_update_policy_windows
