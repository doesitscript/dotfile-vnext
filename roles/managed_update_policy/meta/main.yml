---
galaxy_info:
  author: Josh Christenson
  role_name: managed_update_policy
  description: >-
    Curtail unattended OS and package-manager upgrades so Ansible inventory
    pins remain authoritative (Ubuntu apt/UA, Windows Update AU, Homebrew).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: Windows
      versions:
        - all
    - name: MacOSX
      versions:
        - all

dependencies: []
