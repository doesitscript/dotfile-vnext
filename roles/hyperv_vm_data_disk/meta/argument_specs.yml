---
argument_specs:
  main:
    short_description: Manage one explicitly selected Hyper-V VM data disk.
    options:
      hyperv_vm_data_disk_state:
        type: str
        choices: [present, absent]
      hyperv_vm_data_disk_apply:
        type: bool
      hyperv_vm_data_disk_vm_name:
        type: str
      hyperv_vm_data_disk_vhdx_path:
        type: str
      hyperv_vm_data_disk_size_gib:
        type: int
      hyperv_vm_data_disk_type:
        type: str
        choices: ["", fixed, dynamic]
      hyperv_vm_data_disk_host_reserve_gib:
        type: int
      hyperv_vm_data_disk_controller_number:
        type: int
      hyperv_vm_data_disk_controller_location:
        type: int
      hyperv_vm_data_disk_backup_evidence_ref:
        type: str
      hyperv_vm_data_disk_authority_ref:
        type: str
      hyperv_vm_data_disk_detach_authorized:
        type: bool
