---
- name: Validate Hyper-V data-disk lifecycle state
  ansible.builtin.assert:
    that:
      - hyperv_vm_data_disk_state in ['present', 'absent']
    fail_msg: "hyperv_vm_data_disk_state must be present or absent."

- name: Include Hyper-V data-disk present path
  ansible.builtin.include_tasks: present.yml
  when: hyperv_vm_data_disk_state == 'present'

- name: Include Hyper-V data-disk absent path
  ansible.builtin.include_tasks: absent.yml
  when: hyperv_vm_data_disk_state == 'absent'
