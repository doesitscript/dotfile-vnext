---
- name: Validate Hyper-V Ubuntu GPU-P Windows artifact publish state
  ansible.builtin.assert:
    that:
      - hyperv_ubuntu_gpu_p_windows_artifact_publish_state in ['present', 'absent']
    fail_msg: >-
      hyperv_ubuntu_gpu_p_windows_artifact_publish_state must be present or absent.

- name: Run Hyper-V Ubuntu GPU-P Windows artifact publish lifecycle
  ansible.builtin.include_tasks: "{{ hyperv_ubuntu_gpu_p_windows_artifact_publish_state }}.yml"
