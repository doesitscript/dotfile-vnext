---
argument_specs:
  main:
    short_description: Build and publish a Hyper-V Ubuntu GPU-P runtime artifact set to a managed Windows SMB share.
    options:
      hyperv_ubuntu_gpu_p_windows_artifact_publish_state:
        type: str
        default: present
        choices: [present, absent]
      hyperv_ubuntu_gpu_p_windows_artifact_publish_wsl_exe_path:
        type: str
        default: C:\Windows\System32\wsl.exe
      hyperv_ubuntu_gpu_p_windows_artifact_publish_programfiles_wsl_lib_path:
        type: str
        default: C:\Program Files\WSL\lib
      hyperv_ubuntu_gpu_p_windows_artifact_publish_lxss_lib_path:
        type: str
        default: C:\Windows\System32\lxss\lib
      hyperv_ubuntu_gpu_p_windows_artifact_publish_driverstore_root:
        type: str
        default: C:\Windows\System32\DriverStore\FileRepository
      hyperv_ubuntu_gpu_p_windows_artifact_publish_temp_root:
        type: str
        default: C:\ProgramData\Ansible\hyperv_ubuntu_gpu_p_runtime\windows_payload
      hyperv_ubuntu_gpu_p_windows_artifact_publish_export_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_publish_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_publish_payload_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_share_root:
        type: str
        default: F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime
      hyperv_ubuntu_gpu_p_windows_artifact_publish_share_current_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_share_runs_root:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_expected_driver_version:
        type: str
        required: false
      hyperv_ubuntu_gpu_p_windows_artifact_publish_driver_contract_path:
        type: str
        required: false
