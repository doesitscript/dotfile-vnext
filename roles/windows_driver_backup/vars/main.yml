---
# Internal constants for the managed Windows driver backup capability.
__windows_driver_backup_required_surface_type: "windows_host"
__windows_driver_backup_required_system_usage_class: "managed_service_node"
__windows_driver_backup_required_availability_expectation: "expected_continuous"
__windows_driver_backup_required_automation_management_model: "infrastructure_managed"

__windows_driver_backup_runtime_mode: "driver-export"
__windows_driver_backup_export_tool: "pnputil"
__windows_driver_backup_manifest_schema: "castle.backup.windows-drivers.driver-export.v1"
__windows_driver_backup_current_manifest_path: >-
  {{ windows_driver_backup_manifests_dir }}\current.json
__windows_driver_backup_latest_run_manifest_path: >-
  {{ windows_driver_backup_runs_dir }}\latest.json
