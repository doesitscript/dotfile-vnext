---
argument_specs:
  main:
    short_description: Managed Windows driver backup
    description: >-
      Exports third-party Windows drivers into the repo-managed backup schema
      using a cumulative current tree plus run manifests.
    options:
      windows_driver_backup_state:
        type: str
        required: false
        description: Lifecycle control point for the Windows driver backup capability.
      windows_driver_backup_run_mode:
        type: str
        required: false
        description: >-
          Export behavior. auto bootstraps once then no-ops, incremental exports
          newly unbacked third-party drivers, and force rebuilds the managed export.
      windows_driver_backup_target_drive:
        type: str
        required: false
        description: Intended backup repository drive letter, without colon.
      windows_driver_backup_target_label:
        type: str
        required: false
        description: Expected filesystem label for the backup repository drive.
      windows_driver_backup_namespace:
        type: str
        required: false
        description: Accepted backup naming contract namespace.
      windows_driver_backup_site:
        type: str
        required: false
        description: Accepted backup naming contract site.
      windows_driver_backup_environment:
        type: str
        required: false
        description: Accepted backup naming contract environment.
      windows_driver_backup_stage:
        type: str
        required: false
        description: Accepted backup naming contract stage.
      windows_driver_backup_node_name:
        type: str
        required: false
        description: Accepted backup naming contract node identifier.
      windows_driver_backup_repository_root:
        type: str
        required: false
        description: Physical root for the backupsets zone.
      windows_driver_backup_catalog_root:
        type: str
        required: false
        description: Physical root for the backup-catalog zone.
      windows_driver_backup_context_root:
        type: str
        required: false
        description: Contract-aligned host context root beneath backupsets.
      windows_driver_backup_catalog_context_root:
        type: str
        required: false
        description: Contract-aligned host context root beneath backup-catalog.
      windows_driver_backup_artifact_root:
        type: str
        required: false
        description: Managed driver-export artifact root beneath backupsets.
      windows_driver_backup_current_export_root:
        type: str
        required: false
        description: Cumulative current export root for backed-up drivers.
      windows_driver_backup_logs_dir:
        type: str
        required: false
        description: Catalog directory reserved for driver-backup logs.
      windows_driver_backup_manifests_dir:
        type: str
        required: false
        description: Catalog directory for current-state manifests.
      windows_driver_backup_runs_dir:
        type: str
        required: false
        description: Catalog directory for per-run manifests.
      windows_driver_backup_readme_path:
        type: str
        required: false
        description: Host-local README path describing the managed driver backup capability.
