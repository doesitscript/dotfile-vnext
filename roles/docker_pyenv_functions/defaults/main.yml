---
# Opt-in Docker pyenv shell wrappers. Default absent — not enabled on hosts.
# Set docker_pyenv_functions_state: present on a host and include the role
# from a playbook to deploy ~/.bashrc.d/docker-pyenv-functions.bash.
docker_pyenv_functions_state: absent

docker_pyenv_functions_link_dest: "{{ ansible_env.HOME }}/.bashrc.d/docker-pyenv-functions.bash"

docker_pyenv_functions_link_src: "{{ dotfiles_home }}/roles/docker_pyenv_functions/functions.bash"
