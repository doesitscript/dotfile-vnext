---
argument_specs:
  main:
    short_description: "Manage Checkov IaC scanner via Homebrew on macOS"
    options:
      checkov_cli_state:
        type: str
        default: present
        choices: [present, absent]
        description: ["Whether checkov_cli should be installed or removed."]
      checkov_cli_homebrew_formula:
        type: str
        default: checkov
        description: ["Homebrew formula used to manage this CLI."]
      checkov_cli_verify:
        type: bool
        default: true
        description: ["Verify requested state after convergence."]
