---
argument_specs:
  main:
    short_description: Classify inventory hosts from policy/*.yml (capability selectors).
    options:
      classify_host_state:
        type: str
        required: false
        default: present
        choices: [present, absent]
        description: present runs classification; absent is a no-op skip.
      classify_host_policy_root:
        type: path
        required: false
        description: Absolute or playbook-relative path to policy/ directory.
      classify_host_fail_on_unknown_hardware:
        type: bool
        required: false
        default: true
      classify_host_fail_on_exclusive_hardware:
        type: bool
        required: false
        default: true
      classify_host_fail_on_unknown_planes:
        type: bool
        required: false
        default: false
      classify_host_print_summary:
        type: bool
        required: false
        default: true
