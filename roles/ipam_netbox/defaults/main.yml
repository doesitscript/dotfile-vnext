      slug: hvh
      color: "6c757d"
      vm_role: false
  device_name_migrations:
    - old_name: server-225
      new_name: hom-lab-ctl-hvh-02
    - old_name: exec-hvh-01
      new_name: hom-lab-ctl-hvh-02
    - old_name: "{{ 'network-server' ~ '-win' }}"
      new_name: hom-lab-ctl-hvh-01
    - old_name: network-server
      new_name: hom-lab-ctl-hvh-01
    - old_name: primary-hvh-01
      new_name: hom-lab-ctl-hvh-01
  devices:
    - inventory_host: hom-lab-ctl-hvh-01
      name: hom-lab-ctl-hvh-01
      tenant: home
      legacy_aliases:
        - "{{ 'network-server' ~ '-win' }}"
        - network-server
        - primary-hvh-01
      device_type: custom-server
      device_role: hvh
      platform: windows-server-2025
      site: homelab
      status: active
      tags:
        - ansible-managed
        - ctl
        - authoritative-data
        - home
        - homelab
        - hyperv
        - infra
        - lab
        - lan-exposed-services
        - primary
      interfaces:
        - name: mgmt0
          type: Virtual
          enabled: true
          mgmt_only: true
          address: "{{ hostvars['hom-lab-ctl-hvh-01'].host_ip | default(hostvars['hom-lab-ctl-hvh-01'].ansible_host) }}/24"
          description: hom-lab-ctl-hvh-01 management address from Ansible inventory
    - inventory_host: hom-lab-ctl-hvh-02
      name: hom-lab-ctl-hvh-02
      tenant: home
      legacy_aliases:
        - hom-lab-ctl-hvh-02
        - server-225
        - exec-hvh-01
      device_type: custom-server
      device_role: hvh
      platform: windows-server-2025
      site: homelab
      status: active
      tags:
        - ansible-managed
        - ctl
        - execution
        - experimental
        - home
        - homelab
        - hyperv
        - infra
        - lab
        - non-authoritative-data
      interfaces:
        - name: mgmt0
          type: Virtual
          enabled: true
          mgmt_only: true
          address: "{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default(hostvars['hom-lab-ctl-hvh-02'].ansible_host) }}/24"
          description: hom-lab-ctl-hvh-02 management address from Ansible inventory

