---
# defaults file for ipam_netbox
ipam_netbox_state: present
ipam_netbox_version: v4.0.2
ipam_netbox_data_path: /opt/netbox
ipam_netbox_user: root
ipam_netbox_group: root
ipam_netbox_http_port: "8000:8080"
ipam_netbox_remove_volumes_on_absent: false

# API endpoint used by controller-side NetBox modules.
# The LAN portproxy path is reachable from mac-dev even when the routed guest
# subnet is not reachable from every controller process.
ipam_netbox_api_url: "http://{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default(ansible_host) }}:{{ ipam_netbox_http_port.split(':')[0] }}"
ipam_netbox_api_token_description: dotfile-vnext Ansible automation
# Controller-side vault path workaround:
# playbook_dir/../vault.yml breaks when playbook_dir is the repo root (ad-hoc
# include_role). role_path always resolves to roles/ipam_netbox, so two dirnames
# reach the project root reliably. Consumers load vault via tasks/load_vault.yml.
ipam_netbox_project_root: "{{ role_path | dirname | dirname }}"
ipam_netbox_vault_file: "{{ ipam_netbox_project_root }}/vault.yml"
# Windows host LAN address used in portproxy-published access points.
ipam_netbox_lan_publish_host: "{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default('192.168.50.158') }}"

# Backup naming contract (docs/backup/backup-naming-contract.md)
# These values are the accepted defaults for this project.
# Override in host_vars or group_vars only when targeting a different site/env.
ipam_netbox_backup_namespace: castle
ipam_netbox_backup_site: home
ipam_netbox_backup_environment: lab
ipam_netbox_backup_stage: authoritative
ipam_netbox_backup_node: server-225-ubuntu
# Host-side root for backup artifacts (inside the naming contract tree)
ipam_netbox_backup_root: /opt/netbox/backups

ipam_netbox_server_225_model:
  site:
    name: homelab
    slug: homelab
    status: active
    time_zone: America/Chicago
  tags:
    - name: ansible-managed
      slug: ansible-managed
      description: Object state owned by the dotfile-vnext Ansible repo
      color: "0d6efd"
    - name: homelab
      slug: homelab
      description: Scoped to this homelab environment
      color: "198754"
    - name: hyperv
      slug: hyperv
      description: Hyper-V virtualization layer
      color: "6c757d"
    - name: docker
      slug: docker
      description: Docker runtime layer
      color: "0dcaf0"
    - name: k3s
      slug: k3s
      description: K3s Kubernetes runtime layer
      color: "326ce5"
    - name: infra
      slug: infra
      description: Infrastructure service or host
      color: "6610f2"
    - name: primary
      slug: primary
      description: Primary host or service instance for a capability
      color: "fd7e14"
    - name: execution
      slug: execution
      description: Execution-oriented host or service instance
      color: "d63384"
    - name: home
      slug: home
      description: Home tenant/context segment for Cloud Posse-style names
      color: "20c997"
    - name: lab
      slug: lab
      description: Lab environment/context segment for Cloud Posse-style names
      color: "0dcaf0"
    - name: ctl
      slug: ctl
      description: Control-plane/context segment for infrastructure hosts
      color: "ffc107"
    - name: experimental
      slug: experimental
      description: Experimental host or service posture
      color: "adb5bd"
    - name: non-authoritative-data
      slug: non-authoritative-data
      description: Host is not the authoritative source for durable data
      color: "6f42c1"
    - name: authoritative-data
      slug: authoritative-data
      description: Host is an authoritative source for durable data
      color: "198754"
    - name: lan-exposed-services
      slug: lan-exposed-services
      description: Host intentionally exposes managed services on the LAN
      color: "fd7e14"
    - name: service-endpoint
      slug: service-endpoint
      description: Application service endpoint modeled in NetBox
      color: "0d6efd"
    - name: web-ui
      slug: web-ui
      description: Browser-accessible web UI
      color: "6610f2"
    - name: observability
      slug: observability
      description: Observability or telemetry service
      color: "6c757d"
  tenants:
    - name: home
      slug: home
      description: Home infrastructure ownership/context boundary
  manufacturers:
    - name: custom
      slug: custom
  device_types:
    - model: custom-server
      slug: custom-server
      manufacturer: custom
  platforms:
    - name: Windows Server 2025
      slug: windows-server-2025
    - name: Ubuntu 24.04
      slug: ubuntu-24-04
  device_roles:
    - name: hvh
      slug: hvh
      color: "6c757d"
      vm_role: false
    - name: dkr
      slug: dkr
      color: "0dcaf0"
      vm_role: true
    - name: k3s
      slug: k3s
      color: "326ce5"
      vm_role: true
  cluster_types:
    - name: hyperv
      slug: hyperv
  cluster:
    name: server-225-hyperv
    cluster_type: hyperv
    site: homelab
    status: active
  device:
    name: hom-lab-ctl-hvh-02
    tenant: home
    legacy_aliases:
      - hom-lab-ctl-hvh-02
      - server-225
      - exec-hvh-01
    device_type: custom-server
    device_role: hvh
    platform: windows-server-2025
    site: homelab
    status: active
    tags:
      - ansible-managed
      - ctl
      - execution
      - experimental
      - home
      - homelab
      - hyperv
      - infra
      - lab
      - non-authoritative-data
  virtual_machine:
    name: server-225-ubuntu
    cluster: server-225-hyperv
    site: homelab
    role: dkr
    platform: ubuntu-24-04
    status: active
    vcpus: 4
    memory: 8192
  vm_interface:
    virtual_machine: server-225-ubuntu
    name: eth0
  vm_ip:
    address: 192.168.137.10/24
    description: server-225 Ubuntu VM routed private subnet interface
  k3s_virtual_machine:
    name: hom-lab-ctl-k3s-02
    cluster: server-225-hyperv
    site: homelab
    role: k3s
    platform: ubuntu-24-04
    status: staged
    vcpus: 4
    memory: 8192
    tags:
      - ansible-managed
      - experimental
      - homelab
      - hyperv
      - infra
      - k3s
  k3s_vm_interface:
    virtual_machine: hom-lab-ctl-k3s-02
    name: eth0
  k3s_vm_ip:
    address: 192.168.137.11/24
    description: hom-lab-ctl-k3s-02 routed private subnet interface for RTX 5090 K3s stub lane
  services:
    - name: netbox-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 8000
      ipaddresses:
        - address: 192.168.137.10/24
      description: NetBox source-of-truth web UI and API
      primary_access_point: "http://{{ ipam_netbox_lan_publish_host }}:8000/"
      comments: |-
        docker:
          container: netbox-netbox-1
          image: netboxcommunity/netbox:v4.0.2
          published_port: "8000:8080"
        access_points:
          lan: http://192.168.50.158:8000/
          direct_guest: http://192.168.137.10:8000/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - docker
        - homelab
    - name: semaphore-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3001
      ipaddresses:
        - address: 192.168.137.10/24
      description: Semaphore Ansible UI web endpoint
      primary_access_point: "http://{{ ipam_netbox_lan_publish_host }}:3001/"
      comments: |-
        docker:
          container: semaphore-semaphore-1
          image: semaphoreui/semaphore:v2.17.38
          published_port: "3001:3000"
        access_points:
          lan: http://192.168.50.158:3001/
          direct_guest: http://192.168.137.10:3001/
        credentials:
          username: admin
          password_source: vault_semaphore_admin_password
          note: password intentionally not stored in NetBox service comments
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - docker
        - homelab
    - name: loki-http
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3100
      ipaddresses:
        - address: 192.168.137.10/24
      description: Loki HTTP ingestion/query endpoint
      primary_access_point: "http://{{ ipam_netbox_lan_publish_host }}:3100/loki/api/v1/push"
      comments: |-
        docker:
          container: loki
          image: grafana/loki:3.6.7
          published_port: "3100:3100"
        access_points:
          lan_push_api: http://192.168.50.158:3100/loki/api/v1/push
          direct_guest: http://192.168.137.10:3100/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - observability
        - infra
        - docker
        - homelab
    - name: grafana-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3000
      ipaddresses:
        - address: 192.168.137.10/24
      description: Grafana observability dashboard web UI
      primary_access_point: http://192.168.137.10:3000/
      comments: |-
        docker:
          container: grafana
          image: grafana/grafana:latest
          published_port: "3000:3000"
        access_points:
          direct_guest: http://192.168.137.10:3000/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: docker host port publish on the Ubuntu VM; no Windows LAN portproxy currently configured
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - observability
        - infra
        - docker
        - homelab
    - name: postgres-fuzlang
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 5432
      ipaddresses:
        - address: 192.168.137.10/24
      description: External PostgreSQL for Langfuse and LiteLLM (fuzlang network stack)
      primary_access_point: postgresql://192.168.137.10:5432/langfuse
      comments: |-
        docker:
          container: fuzlang-net-postgres-1
          compose_project: fuzlang-net
          published_port: "0.0.0.0:5432:5432"
        access_points:
          direct_guest: postgresql://192.168.137.10:5432/langfuse
        credentials:
          username: langfuse
          password_source: vault_network_postgres_password
          database: langfuse
          note: password intentionally not stored in NetBox service comments
        consumers:
          - hom-lab-ctl-k3s-02/langfuse (external DATABASE_URL)
          - hom-lab-ctl-k3s-02/litellm (external PostgreSQL)
      tags:
        - ansible-managed
        - service-endpoint
        - infra
        - docker
        - homelab
        - authoritative-data
    - name: minio-api
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 9000
      ipaddresses:
        - address: 192.168.137.10/24
      description: MinIO S3-compatible API (fuzlang network stack)
      primary_access_point: http://192.168.137.10:9000/
      comments: |-
        docker:
          container: fuzlang-net-minio-1
          compose_project: fuzlang-net
          image: minio/minio:RELEASE.2024-01-31T20-20-33Z
          published_port: "0.0.0.0:9000:9000"
        access_points:
          direct_guest: http://192.168.137.10:9000/
        credentials:
          username: minioadmin
          password_source: vault_network_minio_root_password
          note: password intentionally not stored in NetBox service comments
      tags:
        - ansible-managed
        - service-endpoint
        - infra
        - docker
        - homelab
    - name: minio-console
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 9001
      ipaddresses:
        - address: 192.168.137.10/24
      description: MinIO web console (fuzlang network stack)
      primary_access_point: http://192.168.137.10:9001/
      comments: |-
        docker:
          container: fuzlang-net-minio-1
          compose_project: fuzlang-net
          published_port: "0.0.0.0:9001:9001"
        access_points:
          direct_guest: http://192.168.137.10:9001/
        credentials:
          username: minioadmin
          password_source: vault_network_minio_root_password
          note: password intentionally not stored in NetBox service comments
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - docker
        - homelab
    - name: langfuse-k3s-web
      virtual_machine: hom-lab-ctl-k3s-02
      protocol: tcp
      ports:
        - 30000
      ipaddresses:
        - address: 192.168.137.11/24
      description: Langfuse platform web UI on K3s (NodePort)
      primary_access_point: "http://{{ ipam_netbox_lan_publish_host }}:30000/"
      comments: |-
        k8s:
          namespace: langfuse
          release: langfuse
          service: langfuse-web
          exposure: NodePort 30000 -> 3000
        access_points:
          lan: http://192.168.50.158:30000/
          direct_guest: http://192.168.137.11:30000/
        credentials:
          username: signup-at-first-login
          password_source: n/a
          stack_secrets:
            nextauth: vault_network_langfuse_nextauth_secret
            salt: vault_network_langfuse_salt
            public_key: vault_shared_langfuse_public_key
            secret_key: vault_shared_langfuse_secret_key
          note: UI password is user-created; stack secrets live in vault/network.vault.yml and vault/shared.vault.yml
        published_by:
          device: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - k3s
        - homelab
        - lan-exposed-services
    - name: litellm-k3s-gateway
      virtual_machine: hom-lab-ctl-k3s-02
      protocol: tcp
      ports:
        - 30400
      ipaddresses:
        - address: 192.168.137.11/24
      description: LiteLLM OpenAI-compatible gateway on K3s (supplemental NodePort)
      primary_access_point: "http://{{ ipam_netbox_lan_publish_host }}:30400/"
      comments: |-
        k8s:
          namespace: litellm
          release: litellm
          service: litellm-lan
          exposure: NodePort 30400 -> 4000
        access_points:
          lan: http://192.168.50.158:30400/
          direct_guest: http://192.168.137.11:30400/
          in_cluster: http://litellm.litellm.svc.cluster.local:4000
        credentials:
          master_key_source: vault_k3s_litellm_gateway_master_key
          postgres_username: langfuse
          postgres_password_source: vault_network_postgres_password
          note: master key and DB password intentionally not stored in NetBox service comments
        langfuse_integration:
          host: http://langfuse-web.langfuse.svc.cluster.local:3000
        published_by:
          device: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - infra
        - k3s
        - homelab
        - lan-exposed-services

