---
# defaults file for ipam_netbox
ipam_netbox_state: present
ipam_netbox_version: v4.0.2
ipam_netbox_data_path: /opt/netbox
ipam_netbox_user: root
ipam_netbox_group: root
ipam_netbox_http_port: "8000:8080"
ipam_netbox_remove_volumes_on_absent: false

# API endpoint used by controller-side NetBox modules.
# The LAN portproxy path is reachable from mac-dev even when the routed guest
# subnet is not reachable from every controller process.
ipam_netbox_api_url: "http://{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default(ansible_host) }}:{{ ipam_netbox_http_port.split(':')[0] }}"
ipam_netbox_api_token_description: dotfile-vnext Ansible automation

# Backup naming contract (docs/backup/backup-naming-contract.md)
# These values are the accepted defaults for this project.
# Override in host_vars or group_vars only when targeting a different site/env.
ipam_netbox_backup_namespace: castle
ipam_netbox_backup_site: home
ipam_netbox_backup_environment: lab
ipam_netbox_backup_stage: authoritative
ipam_netbox_backup_node: server-225-ubuntu
# Host-side root for backup artifacts (inside the naming contract tree)
ipam_netbox_backup_root: /opt/netbox/backups

ipam_netbox_server_225_model:
  site:
    name: homelab
    slug: homelab
    status: active
    time_zone: America/Chicago
  tags:
    - name: ansible-managed
      slug: ansible-managed
      description: Object state owned by the dotfile-vnext Ansible repo
      color: "0d6efd"
    - name: homelab
      slug: homelab
      description: Scoped to this homelab environment
      color: "198754"
    - name: hyperv
      slug: hyperv
      description: Hyper-V virtualization layer
      color: "6c757d"
    - name: docker
      slug: docker
      description: Docker runtime layer
      color: "0dcaf0"
    - name: k3s
      slug: k3s
      description: K3s Kubernetes runtime layer
      color: "326ce5"
    - name: infra
      slug: infra
      description: Infrastructure service or host
      color: "6610f2"
    - name: primary
      slug: primary
      description: Primary host or service instance for a capability
      color: "fd7e14"
    - name: execution
      slug: execution
      description: Execution-oriented host or service instance
      color: "d63384"
    - name: home
      slug: home
      description: Home tenant/context segment for Cloud Posse-style names
      color: "20c997"
    - name: lab
      slug: lab
      description: Lab environment/context segment for Cloud Posse-style names
      color: "0dcaf0"
    - name: ctl
      slug: ctl
      description: Control-plane/context segment for infrastructure hosts
      color: "ffc107"
    - name: experimental
      slug: experimental
      description: Experimental host or service posture
      color: "adb5bd"
    - name: non-authoritative-data
      slug: non-authoritative-data
      description: Host is not the authoritative source for durable data
      color: "6f42c1"
    - name: authoritative-data
      slug: authoritative-data
      description: Host is an authoritative source for durable data
      color: "198754"
    - name: lan-exposed-services
      slug: lan-exposed-services
      description: Host intentionally exposes managed services on the LAN
      color: "fd7e14"
    - name: service-endpoint
      slug: service-endpoint
      description: Application service endpoint modeled in NetBox
      color: "0d6efd"
    - name: web-ui
      slug: web-ui
      description: Browser-accessible web UI
      color: "6610f2"
    - name: observability
      slug: observability
      description: Observability or telemetry service
      color: "6c757d"
  tenants:
    - name: home
      slug: home
      description: Home infrastructure ownership/context boundary
  manufacturers:
    - name: custom
      slug: custom
  device_types:
    - model: custom-server
      slug: custom-server
      manufacturer: custom
  platforms:
    - name: Windows Server 2025
      slug: windows-server-2025
    - name: Ubuntu 24.04
      slug: ubuntu-24-04
  device_roles:
    - name: hvh
      slug: hvh
      color: "6c757d"
      vm_role: false
    - name: dkr
      slug: dkr
      color: "0dcaf0"
      vm_role: true
    - name: k3s
      slug: k3s
      color: "326ce5"
      vm_role: true
  cluster_types:
    - name: hyperv
      slug: hyperv
  cluster:
    name: server-225-hyperv
    cluster_type: hyperv
    site: homelab
    status: active
  device:
    name: hom-lab-ctl-hvh-02
    tenant: home
    legacy_aliases:
      - hom-lab-ctl-hvh-02
      - server-225
      - exec-hvh-01
    device_type: custom-server
    device_role: hvh
    platform: windows-server-2025
    site: homelab
    status: active
    tags:
      - ansible-managed
      - ctl
      - execution
      - experimental
      - home
      - homelab
      - hyperv
      - infra
      - lab
      - non-authoritative-data
  virtual_machine:
    name: server-225-ubuntu
    cluster: server-225-hyperv
    site: homelab
    role: dkr
    platform: ubuntu-24-04
    status: active
    vcpus: 4
    memory: 8192
  vm_interface:
    virtual_machine: server-225-ubuntu
    name: eth0
  vm_ip:
    address: 192.168.137.10/24
    description: server-225 Ubuntu VM routed private subnet interface
  k3s_virtual_machine:
    name: hom-lab-ctl-k3s-02
    cluster: server-225-hyperv
    site: homelab
    role: k3s
    platform: ubuntu-24-04
    status: staged
    vcpus: 4
    memory: 8192
    tags:
      - ansible-managed
      - experimental
      - homelab
      - hyperv
      - infra
      - k3s
  k3s_vm_interface:
    virtual_machine: hom-lab-ctl-k3s-02
    name: eth0
  k3s_vm_ip:
    address: 192.168.137.11/24
    description: hom-lab-ctl-k3s-02 routed private subnet interface for RTX 5090 K3s stub lane
  services:
    - name: netbox-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 8000
      ipaddresses:
        - address: 192.168.137.10/24
      description: NetBox source-of-truth web UI and API
      comments: |-
        docker:
          container: netbox-netbox-1
          image: netboxcommunity/netbox:v4.0.2
          published_port: "8000:8080"
        access_urls:
          lan: http://192.168.50.158:8000/
          direct_guest: http://192.168.137.10:8000/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - docker
        - homelab
    - name: semaphore-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3001
      ipaddresses:
        - address: 192.168.137.10/24
      description: Semaphore Ansible UI web endpoint
      comments: |-
        docker:
          container: semaphore-semaphore-1
          image: semaphoreui/semaphore:v2.17.38
          published_port: "3001:3000"
        access_urls:
          lan: http://192.168.50.158:3001/
          direct_guest: http://192.168.137.10:3001/
        credentials:
          username: admin
          password_source: vault_semaphore_admin_password
          note: password intentionally not stored in NetBox service comments
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - infra
        - docker
        - homelab
    - name: loki-http
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3100
      ipaddresses:
        - address: 192.168.137.10/24
      description: Loki HTTP ingestion/query endpoint
      comments: |-
        docker:
          container: loki
          image: grafana/loki:3.6.7
          published_port: "3100:3100"
        access_urls:
          lan_push_api: http://192.168.50.158:3100/loki/api/v1/push
          direct_guest: http://192.168.137.10:3100/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: windows netsh portproxy
      tags:
        - ansible-managed
        - service-endpoint
        - observability
        - infra
        - docker
        - homelab
    - name: grafana-web
      virtual_machine: server-225-ubuntu
      protocol: tcp
      ports:
        - 3000
      ipaddresses:
        - address: 192.168.137.10/24
      description: Grafana observability dashboard web UI
      comments: |-
        docker:
          container: grafana
          image: grafana/grafana:latest
          published_port: "3000:3000"
        access_urls:
          direct_guest: http://192.168.137.10:3000/
        published_by:
          device: hom-lab-ctl-hvh-02
          legacy_alias: hom-lab-ctl-hvh-02
          mechanism: docker host port publish on the Ubuntu VM; no Windows LAN portproxy currently configured
      tags:
        - ansible-managed
        - service-endpoint
        - web-ui
        - observability
        - infra
        - docker
        - homelab

ipam_netbox_windows_share_hosts_model:
  site: "{{ ipam_netbox_server_225_model.site }}"
  tags: "{{ ipam_netbox_server_225_model.tags }}"
  tenants: "{{ ipam_netbox_server_225_model.tenants }}"
  manufacturers: "{{ ipam_netbox_server_225_model.manufacturers }}"
  device_types: "{{ ipam_netbox_server_225_model.device_types }}"
  platforms: "{{ ipam_netbox_server_225_model.platforms }}"
  device_roles:
    - name: hvh
      slug: hvh
      color: "6c757d"
      vm_role: false
  device_name_migrations:
    - old_name: server-225
      new_name: hom-lab-ctl-hvh-02
    - old_name: exec-hvh-01
      new_name: hom-lab-ctl-hvh-02
    - old_name: "{{ 'network-server' ~ '-win' }}"
      new_name: hom-lab-ctl-hvh-01
    - old_name: network-server
      new_name: hom-lab-ctl-hvh-01
    - old_name: primary-hvh-01
      new_name: hom-lab-ctl-hvh-01
  devices:
    - inventory_host: hom-lab-ctl-hvh-01
      name: hom-lab-ctl-hvh-01
      tenant: home
      legacy_aliases:
        - "{{ 'network-server' ~ '-win' }}"
        - network-server
        - primary-hvh-01
      device_type: custom-server
      device_role: hvh
      platform: windows-server-2025
      site: homelab
      status: active
      tags:
        - ansible-managed
        - ctl
        - authoritative-data
        - home
        - homelab
        - hyperv
        - infra
        - lab
        - lan-exposed-services
        - primary
      interfaces:
        - name: mgmt0
          type: Virtual
          enabled: true
          mgmt_only: true
          address: "{{ hostvars['hom-lab-ctl-hvh-01'].host_ip | default(hostvars['hom-lab-ctl-hvh-01'].ansible_host) }}/24"
          description: hom-lab-ctl-hvh-01 management address from Ansible inventory
    - inventory_host: hom-lab-ctl-hvh-02
      name: hom-lab-ctl-hvh-02
      tenant: home
      legacy_aliases:
        - hom-lab-ctl-hvh-02
        - server-225
        - exec-hvh-01
      device_type: custom-server
      device_role: hvh
      platform: windows-server-2025
      site: homelab
      status: active
      tags:
        - ansible-managed
        - ctl
        - execution
        - experimental
        - home
        - homelab
        - hyperv
        - infra
        - lab
        - non-authoritative-data
      interfaces:
        - name: mgmt0
          type: Virtual
          enabled: true
          mgmt_only: true
          address: "{{ hostvars['hom-lab-ctl-hvh-02'].host_ip | default(hostvars['hom-lab-ctl-hvh-02'].ansible_host) }}/24"
          description: hom-lab-ctl-hvh-02 management address from Ansible inventory

