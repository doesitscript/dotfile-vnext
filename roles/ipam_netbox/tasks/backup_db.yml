---
# NetBox backup — database + media directory.
#
# Follows the project backup naming contract:
#   docs/backup/backup-naming-contract.md
#
# Path shape (host and controller):
#   <root>/castle/home/lab/authoritative/server-225-ubuntu/
#     postgres/basebackup/<timestamp>/netbox.dump
#     netbox/media-archive/<timestamp>/netbox-media.tar.gz
#
# Timestamp format: YYYY-MM-DDTHHMMSSZ  (e.g. 2026-05-08T110802Z)
#
# Source of truth:
#   NetBox official: https://netboxlabs.com/docs/netbox/administration/replicating-netbox/
#   Backup contract: docs/backup/backup-naming-contract.md
#
# Full replication requires both artifacts:
#   1. postgres/basebackup  — the database (pg_dump custom format)
#   2. netbox/media-archive — uploaded files not in the database
#
# Usage:
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass \
#     --tags ipam_netbox_backup_db
#
# Output (controller): artifacts/backupsets/castle/home/lab/authoritative/
#                         server-225-ubuntu/postgres/basebackup/<ts>/netbox.dump
#                         server-225-ubuntu/netbox/media-archive/<ts>/netbox-media.tar.gz
# Also retained on host at: {{ ipam_netbox_backup_root }}/...
#
# Vault: use tasks/load_vault.yml — not playbook_dir/../vault.yml (see load_vault.yml).

- name: Include vault variables for NetBox backup
  ansible.builtin.include_tasks: load_vault.yml
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Set contract-compliant backup timestamp (YYYY-MM-DDTHHMMSSZ)
  ansible.builtin.set_fact:
    _ipam_netbox_backup_ts: >-
      {{ ansible_date_time.date }}T{{
         ansible_date_time.time | regex_replace(':', '') }}Z
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Resolve contract path prefix
  ansible.builtin.set_fact:
    _ipam_netbox_backup_contract: >-
      {{ ipam_netbox_backup_namespace }}/{{ ipam_netbox_backup_site }}/{{
         ipam_netbox_backup_environment }}/{{ ipam_netbox_backup_stage }}/{{
         ipam_netbox_backup_node }}
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

# ── Database backup ─────────────────────────────────────────────────────────

- name: Ensure postgres basebackup directory exists on host
  ansible.builtin.file:
    path: >-
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
         _ipam_netbox_backup_ts }}
    state: directory
    mode: "0750"
  become: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Run pg_dump inside postgres container
  become: true
  community.docker.docker_container_exec:
    container: netbox-postgres-1
    command: >-
      pg_dump
      -U {{ vault_vars.vault_netbox_db_user }}
      -d {{ vault_vars.vault_netbox_db_name }}
      --format=custom
      --exclude-table-data=core_objectchange
      --file=/tmp/netbox.dump
    env:
      PGPASSWORD: "{{ vault_vars.vault_netbox_db_password }}"
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Copy database dump from container to host
  become: true
  ansible.builtin.command:
    cmd: >-
      docker cp
      netbox-postgres-1:/tmp/netbox.dump
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
         _ipam_netbox_backup_ts }}/netbox.dump
  changed_when: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

# ── Media backup ─────────────────────────────────────────────────────────────

- name: Ensure netbox media-archive directory exists on host
  ansible.builtin.file:
    path: >-
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
         _ipam_netbox_backup_ts }}
    state: directory
    mode: "0750"
  become: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Archive NetBox media directory from container
  become: true
  community.docker.docker_container_exec:
    container: netbox-netbox-1
    command: >-
      tar -czf /tmp/netbox-media.tar.gz -C /opt/netbox/netbox media/
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Copy media archive from container to host
  become: true
  ansible.builtin.command:
    cmd: >-
      docker cp
      netbox-netbox-1:/tmp/netbox-media.tar.gz
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
         _ipam_netbox_backup_ts }}/netbox-media.tar.gz
  changed_when: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

# ── Fetch to controller ───────────────────────────────────────────────────────

- name: Ensure controller backupsets directory exists
  ansible.builtin.file:
    path: >-
      {{ playbook_dir }}/../artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
         _ipam_netbox_backup_ts }}
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Fetch database dump to controller
  become: true
  ansible.builtin.fetch:
    src: >-
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
         _ipam_netbox_backup_ts }}/netbox.dump
    dest: >-
      {{ playbook_dir }}/../artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
         _ipam_netbox_backup_ts }}/netbox.dump
    flat: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Ensure controller media-archive directory exists
  ansible.builtin.file:
    path: >-
      {{ playbook_dir }}/../artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
         _ipam_netbox_backup_ts }}
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

- name: Fetch media archive to controller
  become: true
  ansible.builtin.fetch:
    src: >-
      {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
         _ipam_netbox_backup_ts }}/netbox-media.tar.gz
    dest: >-
      {{ playbook_dir }}/../artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
         _ipam_netbox_backup_ts }}/netbox-media.tar.gz
    flat: true
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db

# ── Report ────────────────────────────────────────────────────────────────────

- name: Report backup locations
  ansible.builtin.debug:
    msg:
      contract_path: "{{ _ipam_netbox_backup_contract }}"
      timestamp: "{{ _ipam_netbox_backup_ts }}"
      db_host: >-
        {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
           _ipam_netbox_backup_ts }}/netbox.dump
      db_controller: >-
        artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/postgres/basebackup/{{
           _ipam_netbox_backup_ts }}/netbox.dump
      media_host: >-
        {{ ipam_netbox_backup_root }}/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
           _ipam_netbox_backup_ts }}/netbox-media.tar.gz
      media_controller: >-
        artifacts/backupsets/{{ _ipam_netbox_backup_contract }}/netbox/media-archive/{{
           _ipam_netbox_backup_ts }}/netbox-media.tar.gz
      restore_db: >-
        pg_restore -U {{ vault_vars.vault_netbox_db_user }}
        -d {{ vault_vars.vault_netbox_db_name }} --clean netbox.dump
      durable_destination: >-
        E:\backupsets\{{ _ipam_netbox_backup_contract | replace('/', '\\') }}\
        (move from controller artifacts/ — see backup-naming-contract.md)
      reference:
        - docs/backup/backup-naming-contract.md
        - https://netboxlabs.com/docs/netbox/administration/replicating-netbox/
  tags:
    - ipam_netbox
    - ipam_netbox_backup_db
