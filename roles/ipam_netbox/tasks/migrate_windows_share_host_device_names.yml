---
- name: Define Windows share-host device name migrations
  ansible.builtin.set_fact:
    _ipam_netbox_windows_share_host_device_name_migrations: "{{ ipam_netbox_windows_share_hosts_model.device_name_migrations }}"
  tags:
    - ipam_netbox
    - ipam_netbox_seed_windows_share_hosts_model

- name: Query legacy Windows share-host NetBox device names
  ansible.builtin.uri:
    url: "{{ ipam_netbox_api_url }}/api/dcim/devices/?name={{ item.old_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
    status_code: 200
    validate_certs: false
  loop: "{{ _ipam_netbox_windows_share_host_device_name_migrations }}"
  loop_control:
    label: "{{ item.old_name }} -> {{ item.new_name }}"
  register: _ipam_netbox_windows_share_host_legacy_device_queries
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_windows_share_hosts_model

- name: Query target Windows share-host NetBox device names
  ansible.builtin.uri:
    url: "{{ ipam_netbox_api_url }}/api/dcim/devices/?name={{ item.new_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
    status_code: 200
    validate_certs: false
  loop: "{{ _ipam_netbox_windows_share_host_device_name_migrations }}"
  loop_control:
    label: "{{ item.old_name }} -> {{ item.new_name }}"
  register: _ipam_netbox_windows_share_host_target_device_queries
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_windows_share_hosts_model

- name: Fail if legacy and target Windows share-host devices both exist
  ansible.builtin.fail:
    msg: >-
      NetBox already has both legacy device
      {{ _ipam_netbox_windows_share_host_device_name_migrations[item].old_name }}
      and target device
      {{ _ipam_netbox_windows_share_host_device_name_migrations[item].new_name }}.
      Resolve the duplicate manually before seeding the share-host model.
  loop: "{{ range(0, _ipam_netbox_windows_share_host_device_name_migrations | length) | list }}"
  when:
    - _ipam_netbox_windows_share_host_legacy_device_queries.results[item].json.results | length > 0
    - _ipam_netbox_windows_share_host_target_device_queries.results[item].json.results | length > 0
  tags:
    - ipam_netbox
    - ipam_netbox_seed_windows_share_hosts_model

- name: Patch legacy Windows share-host NetBox device names
  ansible.builtin.uri:
    url: >-
      {{ ipam_netbox_api_url }}/api/dcim/devices/{{
      _ipam_netbox_windows_share_host_legacy_device_queries.results[item].json.results[0].id
      }}/
    method: PATCH
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ _ipam_netbox_windows_share_host_device_name_migrations[item].new_name }}"
    status_code: 200
    validate_certs: false
  loop: "{{ range(0, _ipam_netbox_windows_share_host_device_name_migrations | length) | list }}"
  loop_control:
    label: >-
      {{ _ipam_netbox_windows_share_host_device_name_migrations[item].old_name }}
      -> {{ _ipam_netbox_windows_share_host_device_name_migrations[item].new_name }}
  when:
    - _ipam_netbox_windows_share_host_legacy_device_queries.results[item].json.results | length > 0
    - _ipam_netbox_windows_share_host_target_device_queries.results[item].json.results | length == 0
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_windows_share_hosts_model
