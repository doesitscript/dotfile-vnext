---
# Vault: use tasks/load_vault.yml — not playbook_dir/../vault.yml (see load_vault.yml).
- name: Include vault variables for NetBox API token
  ansible.builtin.include_tasks: load_vault.yml
  tags:
    - ipam_netbox
    - ipam_netbox_seed_tags

- name: Require NetBox API token for tag seeding
  ansible.builtin.assert:
    that:
      - vault_vars.vault_netbox_api_token is defined
      - vault_vars.vault_netbox_api_token | length > 0
    fail_msg: >-
      vault_netbox_api_token is required in vault.yml before NetBox API seeding
      can run.
  tags:
    - ipam_netbox
    - ipam_netbox_seed_tags

- name: Ensure dedicated NetBox API token before tag seeding
  ansible.builtin.include_tasks:
    file: ensure_api_token.yml
    apply:
      tags:
        - ipam_netbox
        - ipam_netbox_api_token
        - ipam_netbox_seed_tags
  when: ipam_netbox_bootstrap_api_token_on_host | bool
  tags:
    - ipam_netbox
    - ipam_netbox_api_token
    - ipam_netbox_seed_tags

# Seed canonical NetBox object tags via the NetBox API.
#
# depends_on (policy/process_order.yml → netbox_capability_tags):
#   - netbox_api_reachable
#   - vault_yml_decryptable  (ansible-vault view vault.yml)
# soft: capability_selectors vocabulary already defined in policy/execution_roles.yml
#
# These tags are applied to objects WITHIN NetBox (devices, prefixes, IPs, VMs, etc.)
# to identify resources by ownership, environment, and managing role.
# This is separate from Ansible play tags (--tags on the CLI).
#
# Requirements:
#   - netbox.netbox collection: ansible-galaxy collection install netbox.netbox
#   - vault_netbox_api_token must be defined in vault.yml
#   - connection: local / delegate_to: localhost — the API call runs from the control node
#
# Run standalone:
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --vault-password-file vault_pass.sh \
#     --tags ipam_netbox_seed_tags
#
- name: Seed canonical NetBox object tags
  netbox.netbox.netbox_tag:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      description: "{{ item.description }}"
      color: "{{ item.color }}"
    state: present
  loop:
    - name: "ansible-managed"
      slug: "ansible-managed"
      description: "Object state owned by the dotfile-vnext Ansible repo"
      color: "0d6efd"
    - name: "homelab"
      slug: "homelab"
      description: "Scoped to this homelab environment"
      color: "198754"
    - name: "ipam-netbox-role"
      slug: "ipam-netbox-role"
      description: "Provisioned by the ipam_netbox Ansible role"
      color: "6f42c1"
    - name: "traefik-routed"
      slug: "traefik-routed"
      description: "Service reaches LAN via K3s Traefik ingress on GPU lane"
      color: "fd7e14"
    - name: "web-ui"
      slug: "web-ui"
      description: "Browser-facing web UI service endpoint"
      color: "20c997"
    - name: "lan-exposed-services"
      slug: "lan-exposed-services"
      description: "Service published to the homelab LAN (portproxy or ingress)"
      color: "ffc107"
    - name: "k3s"
      slug: "k3s"
      description: "Kubernetes (K3s) runtime layer"
      color: "326ce5"
    # Capability-selector vocabulary (policy/execution_roles.yml) — tag before CF.
    - name: "openai-compatible-edge"
      slug: "openai-compatible-edge"
      description: "May host OpenAI-compatible human clients (e.g. Open WebUI)"
      color: "0dcaf0"
    - name: "companion-ui"
      slug: "companion-ui"
      description: "Chat/companion UI role (not agent runtime)"
      color: "6610f2"
    - name: "authoritative-storage"
      slug: "authoritative-storage"
      description: "Owns durable DB/object data (Postgres, MinIO, …)"
      color: "dc3545"
    - name: "low-tier-gpu"
      slug: "low-tier-gpu"
      description: "Small local models / autocomplete only"
      color: "adb5bd"
    - name: "primary-ai-compute"
      slug: "primary-ai-compute"
      description: "Flagship GPU / primary local inference lane"
      color: "212529"
    - name: "desktop-amd-runtime"
      slug: "desktop-amd-runtime"
      description: "Windows AMD desktop host-local Ollama (Vulkan)"
      color: "ed1c24"
    - name: "k3s-ai-plane"
      slug: "k3s-ai-plane"
      description: "K3s AI plane (LiteLLM / LangGraph / vLLM)"
      color: "326ce5"
    - name: "k3s-storage-plane"
      slug: "k3s-storage-plane"
      description: "Storage-lane K3s (not primary UI / large GPU)"
      color: "6c757d"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_tags
