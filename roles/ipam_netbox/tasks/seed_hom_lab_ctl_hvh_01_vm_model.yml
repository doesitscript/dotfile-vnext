---
# Vault: use tasks/load_vault.yml — not playbook_dir/../vault.yml (see load_vault.yml).
- name: Include vault variables for NetBox API token
  ansible.builtin.include_tasks: load_vault.yml
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Preview hom-lab-hvh-01 VM NetBox model seed
  ansible.builtin.debug:
    msg:
      api_url: "{{ ipam_netbox_api_url }}"
      change_class: "idempotent NetBox source-of-truth modeling"
      apply: "ansible-playbook playbooks/deploy_ipam_netbox.yaml --tags ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model"
      verify:
        - "NetBox contains cluster hom-lab-hvh-01"
        - "NetBox contains VMs hom-lab-ctl-dkr-01 and hom-lab-ctl-k3s-01"
        - "NetBox VM hom-lab-ctl-k3s-01 has role k3s and tag k3s"
        - "NetBox VM hom-lab-ctl-dkr-01 has service objects for Postgres, Redis, ClickHouse, and MinIO"
        - "Stale duplicate service objects on hom-lab-ctl-dkr-02 are previewed before removal"
        - "Storage-lane langfuse-web is removed from NetBox while compose is disabled on hom-lab-ctl-dkr-01"
      undo: "manual NetBox object cleanup unless an absent seed path is added"
      model:
        site: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.site }}"
        tags: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.tags | map(attribute='slug') | list }}"
        platforms: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.platforms | map(attribute='slug') | list }}"
        device_roles: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.device_roles | map(attribute='slug') | list }}"
        cluster: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.name }}"
        virtual_machines: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.virtual_machines | map(attribute='name') | list }}"
        services: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.services | map(attribute='name') | list }}"
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Query live NetBox storage-lane services by declared name
  ansible.builtin.uri:
    url: >-
      {{ ipam_netbox_api_url }}/api/ipam/services/?name={{ item.name | urlencode }}
    method: GET
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
      Accept: application/json
    return_content: true
    status_code: [200]
    validate_certs: false
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.services }}"
  loop_control:
    label: "{{ item.name }}"
  register: ipam_netbox_hvh01_service_name_lookups
  when:
    - vault_vars.vault_netbox_api_token is defined
    - vault_vars.vault_netbox_api_token | length > 0
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Build stale storage-lane service cleanup candidates
  ansible.builtin.set_fact:
    ipam_netbox_hvh01_stale_service_cleanup_candidates: >-
      {{
        (ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]))
        + stale_matches
      }}
  vars:
    stale_matches: >-
      {{
        (item.json.results | default([]))
        | rejectattr('virtual_machine', 'none')
        | selectattr('virtual_machine', 'mapping')
        | rejectattr('virtual_machine.name', 'undefined')
        | rejectattr('virtual_machine.name', 'equalto', item.item.virtual_machine)
        | list
      }}
  loop: "{{ ipam_netbox_hvh01_service_name_lookups.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - vault_vars.vault_netbox_api_token is defined
    - vault_vars.vault_netbox_api_token | length > 0
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Query retired storage-lane Langfuse service objects
  ansible.builtin.uri:
    url: "{{ ipam_netbox_api_url }}/api/ipam/services/?name=langfuse-web"
    method: GET
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
      Accept: application/json
    return_content: true
    status_code: [200]
    validate_certs: false
  register: ipam_netbox_hvh01_retired_langfuse_service_lookup
  when:
    - vault_vars.vault_netbox_api_token is defined
    - vault_vars.vault_netbox_api_token | length > 0
    - not (hostvars['hom-lab-ctl-dkr-01'].stacks_network_langfuse_compose_enabled | default(true) | bool)
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Append retired storage-lane Langfuse cleanup candidates
  ansible.builtin.set_fact:
    ipam_netbox_hvh01_stale_service_cleanup_candidates: >-
      {{
        (ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]))
        + (
          (ipam_netbox_hvh01_retired_langfuse_service_lookup.json.results | default([]))
          | rejectattr('virtual_machine', 'none')
          | selectattr('virtual_machine', 'mapping')
          | selectattr('virtual_machine.name', 'equalto', 'hom-lab-ctl-dkr-01')
          | list
        )
      }}
  when:
    - ipam_netbox_hvh01_retired_langfuse_service_lookup is defined
    - not (hostvars['hom-lab-ctl-dkr-01'].stacks_network_langfuse_compose_enabled | default(true) | bool)
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Preview stale storage-lane service cleanup candidates
  ansible.builtin.debug:
    msg:
      cleanup_candidates: >-
        {{
          (ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]))
          | map(attribute='name')
          | list
        }}
      cleanup_pairs: >-
        {{
          (ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]))
          | map(attribute='virtual_machine')
          | map(attribute='name')
          | list
        }}
  when:
    - vault_vars.vault_netbox_api_token is defined
    - vault_vars.vault_netbox_api_token | length > 0
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Require NetBox API token for hom-lab-hvh-01 VM model seeding
  ansible.builtin.assert:
    that:
      - vault_vars.vault_netbox_api_token is defined
      - vault_vars.vault_netbox_api_token | length > 0
    fail_msg: >-
      vault_netbox_api_token is required in vault.yml before NetBox API seeding
      can run. Run the preview tag to inspect the intended model without the
      token.
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Ensure dedicated NetBox API token before hom-lab-hvh-01 VM model seeding
  ansible.builtin.include_tasks:
    file: ensure_api_token.yml
    apply:
      tags:
        - ipam_netbox
        - ipam_netbox_api_token
        - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
  tags:
    - ipam_netbox
    - ipam_netbox_api_token
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Ensure NetBox Service custom fields before hom-lab-hvh-01 service seeding
  ansible.builtin.include_tasks: seed_custom_fields.yml
  tags:
    - ipam_netbox
    - ipam_netbox_seed_custom_fields
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox tags
  netbox.netbox.netbox_tag:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      description: "{{ item.description }}"
      color: "{{ item.color }}"
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.tags }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Remove stale duplicate storage-lane service objects from NetBox
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: DELETE
    headers:
      Authorization: "Token {{ vault_vars.vault_netbox_api_token }}"
      Accept: application/json
    validate_certs: false
    status_code: [204]
  loop: "{{ ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]) }}"
  loop_control:
    label: "{{ item.name }} on {{ item.virtual_machine.name }}"
  when:
    - ipam_netbox_hvh01_stale_service_cleanup_candidates | default([]) | length > 0
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox site
  netbox.netbox.netbox_site:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.site.name }}"
      slug: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.site.slug }}"
      status: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.site.status }}"
      time_zone: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.site.time_zone }}"
      tags:
        - homelab
        - ansible-managed
    state: present
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox tenants
  netbox.netbox.netbox_tenant:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      description: "{{ item.description }}"
      tags:
        - ansible-managed
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.tenants }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox platforms
  netbox.netbox.netbox_platform:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      tags:
        - ansible-managed
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.platforms }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox VM roles
  netbox.netbox.netbox_device_role:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      color: "{{ item.color }}"
      vm_role: "{{ item.vm_role }}"
      tags:
        - ansible-managed
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.device_roles }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox cluster types
  netbox.netbox.netbox_cluster_type:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      slug: "{{ item.slug }}"
      tags:
        - ansible-managed
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster_types }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 NetBox cluster
  netbox.netbox.netbox_cluster:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.name }}"
      cluster_type: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.cluster_type }}"
      site: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.site }}"
      status: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.status }}"
      tags: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.cluster.tags }}"
    state: present
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 Ubuntu VMs
  netbox.netbox.netbox_virtual_machine:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      cluster: "{{ item.cluster }}"
      site: "{{ item.site }}"
      virtual_machine_role: "{{ item.role }}"
      platform: "{{ item.platform }}"
      status: "{{ item.status }}"
      vcpus: "{{ item.vcpus }}"
      memory: "{{ item.memory }}"
      tags: "{{ item.tags }}"
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.virtual_machines }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 Ubuntu VM interfaces
  netbox.netbox.netbox_vm_interface:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      virtual_machine: "{{ item.0.name }}"
      name: "{{ item.1.name }}"
      tags:
        - ansible-managed
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.virtual_machines | subelements('interfaces') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.name }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 Ubuntu VM IP addresses
  netbox.netbox.netbox_ip_address:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      address: "{{ item.1.address }}"
      description: "{{ item.1.description }}"
      assigned_object:
        virtual_machine: "{{ item.0.name }}"
        name: "{{ item.1.name }}"
      tags:
        - ansible-managed
        - homelab
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.virtual_machines | subelements('interfaces') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.address }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Set hom-lab-hvh-01 Ubuntu VM primary IPv4
  netbox.netbox.netbox_virtual_machine:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.0.name }}"
      cluster: "{{ item.0.cluster }}"
      primary_ip4: "{{ item.1.address }}"
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.virtual_machines | subelements('interfaces') }}"
  loop_control:
    label: "{{ item.0.name }} primary {{ item.1.address }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model

- name: Seed hom-lab-hvh-01 application services
  netbox.netbox.netbox_service:
    netbox_url: "{{ ipam_netbox_api_url }}"
    netbox_token: "{{ vault_vars.vault_netbox_api_token }}"
    validate_certs: false
    data:
      name: "{{ item.name }}"
      virtual_machine: "{{ item.virtual_machine }}"
      protocol: "{{ item.protocol }}"
      ports: "{{ item.ports }}"
      ipaddresses: "{{ item.ipaddresses }}"
      description: "{{ item.description }}"
      comments: >-
        {{
          [
            item.comments,
            'primary_access_point: ' ~ item.primary_access_point
          ] | reject('equalto', None) | join('\n')
        }}
      custom_fields: "{{ item.custom_fields | default(omit) }}"
      tags: "{{ item.tags }}"
    state: present
  loop: "{{ ipam_netbox_hom_lab_ctl_hvh_01_vm_model.services }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  tags:
    - ipam_netbox
    - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
