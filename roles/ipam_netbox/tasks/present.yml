---
# Vault: use tasks/load_vault.yml — not playbook_dir/../vault.yml (see load_vault.yml).
- name: Include vault variables
  ansible.builtin.include_tasks: load_vault.yml
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Ensure NetBox data directories exist
  ansible.builtin.file:
    path: "{{ ipam_netbox_data_path }}/{{ item }}"
    state: directory
    owner: "{{ ipam_netbox_user }}"
    group: "{{ ipam_netbox_group }}"
    mode: '0755'
  loop:
    - netbox-media-files
    - netbox-postgres
    - netbox-redis-cache-data
    - netbox-redis-data
    - netbox-reports-files
    - netbox-scripts-files
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Render .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ipam_netbox_data_path }}/.env"
    owner: "{{ ipam_netbox_user }}"
    group: "{{ ipam_netbox_group }}"
    mode: '0600'
  no_log: true
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Render docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ipam_netbox_data_path }}/docker-compose.yml"
    owner: "{{ ipam_netbox_user }}"
    group: "{{ ipam_netbox_group }}"
    mode: '0644'
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Pre-pull NetBox Docker images
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop:
    - "docker.io/netboxcommunity/netbox:{{ ipam_netbox_version }}"
    - "docker.io/postgres:16-alpine"
    - "docker.io/valkey/valkey:7-alpine"
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Deploy NetBox stack
  community.docker.docker_compose_v2:
    project_src: "{{ ipam_netbox_data_path }}"
    state: present
  register: compose_result
  tags:
    - ipam_netbox
    - ipam_netbox_present

- name: Smoke test NetBox
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ipam_netbox_http_port.split(':')[0] }}/login/"
    method: GET
    status_code: 200
  register: smoke_test_result
  until: smoke_test_result.status == 200
  retries: 10
  delay: 10
  tags:
    - ipam_netbox
    - ipam_netbox_present
    - ipam_netbox_smoke_test
