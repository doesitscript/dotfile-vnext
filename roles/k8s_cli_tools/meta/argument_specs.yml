---
argument_specs:
  main:
    short_description: Install Kubernetes CLI tools on macOS
    description:
      - Installs essential K8s CLI tools via Homebrew
      - Includes cluster management, debugging, and GitOps tools
      - Supports version pinning through inventory contracts
      - Installs Krew plugins automatically
    author: Josh
    options:
      k8s_cli_tools_state:
        description: Install (present) or remove (absent) all tools
        type: str
        required: false
        default: present
        choices:
          - present
          - absent

      k8s_cli_tools_k9s_version:
        description: K9s version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_kubecolor_version:
        description: kubecolor version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_stern_version:
        description: Stern version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_kubectx_version:
        description: kubectx/kubens version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_helm_version:
        description: Helm version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_krew_version:
        description: Krew version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_kubeseal_version:
        description: kubeseal version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_kustomize_version:
        description: Kustomize version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_k8sgpt_version:
        description: K8sGPT version from k8s_tooling_version_contract
        type: str
        required: false
        default: ""

      k8s_cli_tools_krew_plugins:
        description: List of Krew plugins to install via kubectl krew
        type: list
        required: false
        default:
          - name: kubent
            enabled: true
          - name: tree
            enabled: true
        elements: dict
        options:
          name:
            description: Plugin name (as recognized by kubectl krew)
            type: str
            required: true
          enabled:
            description: Whether to install this plugin
            type: bool
            required: false
            default: true
