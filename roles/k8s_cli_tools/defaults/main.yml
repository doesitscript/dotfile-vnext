---
# k8s_cli_tools role defaults

# Role lifecycle state — present or absent
k8s_cli_tools_state: present

# Version contracts — pin via inventory/group_vars/all.yaml k8s_tooling_version_contract
k8s_cli_tools_k9s_version: "{{ k8s_tooling_version_contract.k9s | default('') }}"
k8s_cli_tools_kubecolor_version: "{{ k8s_tooling_version_contract.kubecolor | default('') }}"
k8s_cli_tools_stern_version: "{{ k8s_tooling_version_contract.stern | default('') }}"
k8s_cli_tools_kubectx_version: "{{ k8s_tooling_version_contract.kubectx | default('') }}"
k8s_cli_tools_helm_version: "{{ k8s_tooling_version_contract.helm | default('') }}"
k8s_cli_tools_krew_version: "{{ k8s_tooling_version_contract.krew | default('') }}"
k8s_cli_tools_kubeseal_version: "{{ k8s_tooling_version_contract.kubeseal | default('') }}"
k8s_cli_tools_kustomize_version: "{{ k8s_tooling_version_contract.kustomize | default('') }}"
k8s_cli_tools_k8sgpt_version: "{{ k8s_tooling_version_contract.k8sgpt | default('') }}"

# Krew plugins to install after krew itself is present
k8s_cli_tools_krew_plugins:
  - name: kubent
    enabled: true
  - name: tree
    enabled: true
