---
# Install Kubernetes CLI tools on macOS via Homebrew

# ─── Core K8s Management Tools ─────────────────────────────────────────────

- name: Install K9s via Homebrew
  community.general.homebrew:
    name: k9s
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - k9s

- name: Install kubecolor via Homebrew
  community.general.homebrew:
    name: kubecolor
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - kubecolor

- name: Install Stern via Homebrew
  community.general.homebrew:
    name: stern
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - stern

- name: Check installed K9s formula for bash completion preview
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --formula
      - k9s
  register: k8s_cli_tools_k9s_completion_preview
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - ansible_check_mode
  tags:
    - k9s

- name: Generate K9s bash completion
  ansible.builtin.command:
    argv:
      - k9s
      - completion
      - bash
  register: k8s_cli_tools_k9s_bash_completion
  changed_when: false
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - not ansible_check_mode or k8s_cli_tools_k9s_completion_preview.rc == 0
  tags:
    - k9s

- name: Install K9s bash completion
  ansible.builtin.copy:
    content: "{{ k8s_cli_tools_k9s_bash_completion.stdout }}"
    dest: "{{ k8s_cli_tools_k9s_bash_completion_path }}"
    mode: "0644"
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - k8s_cli_tools_k9s_bash_completion.stdout | length > 0
  tags:
    - k9s

- name: Explain K9s bash completion preview limitations when the formula is absent
  ansible.builtin.debug:
    msg:
      - "Check mode note: live apply will generate K9s bash completion after the formula is installed."
      - "Planned completion path: {{ k8s_cli_tools_k9s_bash_completion_path }}"
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - ansible_check_mode
    - k8s_cli_tools_k9s_completion_preview.rc != 0
  tags:
    - k9s

- name: Check installed Stern formula for bash completion preview
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --formula
      - stern
  register: k8s_cli_tools_stern_completion_preview
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - ansible_check_mode
  tags:
    - stern

- name: Generate Stern bash completion from k8s_cli_tools
  ansible.builtin.command:
    argv:
      - stern
      - --completion=bash
  register: k8s_cli_tools_stern_bash_completion
  changed_when: false
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - not ansible_check_mode or k8s_cli_tools_stern_completion_preview.rc == 0
  tags:
    - stern

- name: Install Stern bash completion from k8s_cli_tools
  ansible.builtin.copy:
    content: "{{ k8s_cli_tools_stern_bash_completion.stdout }}"
    dest: "{{ k8s_cli_tools_stern_bash_completion_path }}"
    mode: "0644"
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - k8s_cli_tools_stern_bash_completion.stdout | length > 0
  tags:
    - stern

- name: Explain Stern bash completion preview limitations when the formula is absent
  ansible.builtin.debug:
    msg:
      - "Check mode note: live apply will generate Stern bash completion after the formula is installed."
      - "Planned completion path: {{ k8s_cli_tools_stern_bash_completion_path }}"
  when:
    - k8s_cli_tools_state == "present"
    - k8s_cli_tools_install_bash_completion | bool
    - ansible_check_mode
    - k8s_cli_tools_stern_completion_preview.rc != 0
  tags:
    - stern

- name: Install kubectx and kubens via Homebrew
  community.general.homebrew:
    name: kubectx
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - kubectx
    - kubens

- name: Remove K9s bash completion
  ansible.builtin.file:
    path: "{{ k8s_cli_tools_k9s_bash_completion_path }}"
    state: absent
  when:
    - k8s_cli_tools_state == "absent"
    - k8s_cli_tools_install_bash_completion | bool
  tags:
    - k9s

- name: Remove Stern bash completion from k8s_cli_tools
  ansible.builtin.file:
    path: "{{ k8s_cli_tools_stern_bash_completion_path }}"
    state: absent
  when:
    - k8s_cli_tools_state == "absent"
    - k8s_cli_tools_install_bash_completion | bool
  tags:
    - stern

- name: Install Helm via Homebrew
  community.general.homebrew:
    name: helm
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - helm

# ─── Plugin Manager and Extensions ─────────────────────────────────────────

- name: Install Krew plugin manager via Homebrew
  community.general.homebrew:
    name: krew
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - krew

- name: Ensure KREW_ROOT is set for plugin installation
  ansible.builtin.set_fact:
    k8s_cli_tools_krew_root: "{{ ansible_env.HOME }}/.krew"
  when: k8s_cli_tools_state == "present"
  tags:
    - krew

- name: Install Krew plugins
  ansible.builtin.command:
    argv:
      - kubectl
      - krew
      - install
      - "{{ item.name }}"
  environment:
    PATH: "{{ k8s_cli_tools_krew_root }}/bin:{{ ansible_env.PATH }}"
  loop: "{{ k8s_cli_tools_krew_plugins }}"
  when:
    - k8s_cli_tools_state == "present"
    - item.enabled | bool
  register: k8s_cli_tools_krew_install
  changed_when: "'Already installed' not in k8s_cli_tools_krew_install.stderr"
  failed_when:
    - k8s_cli_tools_krew_install.rc != 0
    - "'Already installed' not in k8s_cli_tools_krew_install.stderr"
  tags:
    - krew
    - krew_plugins

# ─── GitOps and Configuration Management ───────────────────────────────────

- name: Install kubeseal via Homebrew
  community.general.homebrew:
    name: kubeseal
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - kubeseal

- name: Install Kustomize via Homebrew
  community.general.homebrew:
    name: kustomize
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - kustomize

# ─── AI-Powered Diagnostics ───────────────────────────────────────────────

- name: Install K8sGPT via Homebrew
  community.general.homebrew:
    name: k8sgpt
    state: "{{ k8s_cli_tools_state }}"
  tags:
    - k8sgpt

# ─── Installation Summary ─────────────────────────────────────────────────

- name: Report K8s CLI tools installation status
  ansible.builtin.debug:
    msg:
      - "K8s CLI Tools State: {{ k8s_cli_tools_state }}"
      - "Core Tools: k9s, kubecolor, stern, kubectx/kubens, helm"
      - "Managed bash completions: {{ [k8s_cli_tools_k9s_bash_completion_path, k8s_cli_tools_stern_bash_completion_path] if k8s_cli_tools_install_bash_completion | bool else ['disabled'] }}"
      - "Plugin Manager: krew"
      - "Krew Plugins: {{ k8s_cli_tools_krew_plugins | selectattr('enabled') | map(attribute='name') | list | join(', ') }}"
      - "GitOps Tools: kubeseal, kustomize"
      - "AI Tools: k8sgpt"
  when: k8s_cli_tools_state == "present"
