---
argument_specs:
  main:
    short_description: "Install aider AI pair programmer and deploy homelab LiteLLM config"
    description: >
      Installs aider via pipx and deploys ~/.aider.conf.yml (model/gateway config)
      and ~/.aider.mcp.json (context7 + firecrawl MCP servers).
    options:
      aider_state:
        type: str
        required: false
        default: present
        description: "present to install and configure, absent to remove config files"
      aider_api_key:
        type: str
        required: false
        default: ""
        description: "LiteLLM gateway master key; loaded from vault when empty"
      aider_gateway_api_base:
        type: str
        required: false
        default: "http://litellm.hom.lab/v1"
        description: "Base URL for the OpenAI-compatible endpoint"
      aider_default_model:
        type: str
        required: false
        description: "Default model in openai/<model-id> format"
