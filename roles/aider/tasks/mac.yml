---
- name: Check aider vault file
  ansible.builtin.stat:
    path: "{{ aider_vault_file_path }}"
  register: _aider_vault_stat
  when:
    - aider_state == "present"
    - aider_api_key | default('') | length == 0

- name: Load shared vault for aider API keys when unset
  ansible.builtin.include_vars:
    file: "{{ aider_vault_file_path }}"
    name: _aider_vault_vars
  when:
    - aider_state == "present"
    - aider_api_key | default('') | length == 0
    - _aider_vault_stat.stat.exists | default(false)
  no_log: true

- name: Resolve aider LiteLLM API key for render
  ansible.builtin.set_fact:
    aider_render_api_key: >-
      {{
        aider_api_key
        if aider_api_key | default('') | length > 0
        else (_aider_vault_vars[aider_vault_key] | default('REPLACE_WITH_LITELLM_KEY'))
      }}
    aider_render_firecrawl_api_key: >-
      {{
        aider_firecrawl_api_key
        if aider_firecrawl_api_key | default('') | length > 0
        else (_aider_vault_vars[aider_firecrawl_vault_key] | default('REPLACE_WITH_FIRECRAWL_KEY'))
      }}
  no_log: true
  when: aider_state == "present"

- name: Convert legacy aider_yes inventory to yes-always (Aider 0.86+)
  ansible.builtin.set_fact:
    aider_render_yes_always: >-
      {{
        aider_yes_always
        if (aider_yes_always is not none)
        else (aider_yes | default(true))
      }}
  when: aider_state == "present"

- name: Build pipx install argv for aider
  ansible.builtin.set_fact:
    _aider_pipx_argv: >-
      {{
        ['pipx', 'install']
        + (
          ['--python', aider_pipx_python]
          if (aider_pipx_python | default('') | length > 0)
          else []
        )
        + [aider_pipx_package]
      }}
  when: aider_state == "present"

- name: Install aider via pipx
  ansible.builtin.command:
    argv: "{{ _aider_pipx_argv }}"
  register: _aider_pipx_result
  changed_when: "'installed package' in _aider_pipx_result.stdout"
  failed_when:
    - _aider_pipx_result.rc != 0
    - "'already seems to be installed' not in _aider_pipx_result.stderr"
  when: aider_state == "present"

- name: Deploy aider config
  ansible.builtin.template:
    src: aider.conf.yml.j2
    dest: "{{ aider_config_path }}"
    mode: "0600"
  when: aider_state == "present"

- name: Deploy aider MCP config
  ansible.builtin.template:
    src: aider.mcp.json.j2
    dest: "{{ aider_mcp_config_path }}"
    mode: "0600"
  when: aider_state == "present"

- name: Deploy packet-root .aiderignore for map noise control
  ansible.builtin.template:
    src: aiderignore.j2
    dest: "{{ aider_repo_ignore_path }}"
    mode: "0644"
  when:
    - aider_state == "present"
    - aider_deploy_repo_ignore | default(true) | bool

- name: Remove aider config files managed by this role
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ aider_config_path }}"
    - "{{ aider_mcp_config_path }}"
  when: aider_state == "absent"

- name: Probe aider version (fails if managed config is invalid)
  ansible.builtin.command:
    argv: [aider, --version]
  register: _aider_version_probe
  changed_when: false
  when:
    - aider_state == "present"
    - not ansible_check_mode

- name: Report aider state
  ansible.builtin.debug:
    msg:
      aider_state: "{{ aider_state }}"
      config: "{{ aider_config_path }}"
      mcp_config: "{{ aider_mcp_config_path }}"
      default_model: "{{ aider_default_model }}"
      yes_always: "{{ aider_render_yes_always | default(true) }}"
      map_tokens: "{{ aider_map_tokens | default(2048) }}"
      version: "{{ _aider_version_probe.stdout | default('not installed') }}"
  when: aider_state == "present"
