---
aider_state: present

aider_config_path: "{{ ansible_env.HOME }}/.aider.conf.yml"
aider_mcp_config_path: "{{ ansible_env.HOME }}/.aider.mcp.json"

# API key — resolved from vault when empty.
aider_api_key: ""
aider_gateway_api_base: "http://litellm.hom.lab/v1"
aider_default_model: "openai/qwen2.5-coder-32b@k3s02-vllm"

# Vault source for API key when aider_api_key is unset.
aider_vault_file_path: "{{ dotfiles_home }}/vault/shared.vault.yml"
aider_vault_key: "vault_k3s_litellm_gateway_master_key"

# Firecrawl API key for MCP server (loaded from vault when empty).
aider_firecrawl_api_key: ""
aider_firecrawl_vault_key: "vault_firecrawl_mcp_api_key"

# Install via pipx into the user's pipx environment.
aider_pipx_package: "aider-chat"

# MCP servers to inject into the aider MCP config.
aider_mcp_context7_enabled: true
aider_mcp_firecrawl_enabled: true
