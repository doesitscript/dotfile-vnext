---
aider_state: present

aider_config_path: "{{ ansible_env.HOME }}/.aider.conf.yml"
aider_mcp_config_path: "{{ ansible_env.HOME }}/.aider.mcp.json"

# API key — resolved from vault when empty.
aider_api_key: ""
aider_gateway_api_base: "http://litellm.hom.lab/v1"
aider_default_model: "openai/qwen2.5-coder-32b@k3s02-vllm"

# Vault source for API key when aider_api_key is unset.
aider_vault_file_path: "{{ dotfiles_home }}/vault/shared.vault.yml"
aider_vault_key: "vault_k3s_litellm_gateway_master_key"

# Firecrawl API key for MCP server (loaded from vault when empty).
aider_firecrawl_api_key: ""
aider_firecrawl_vault_key: "vault_firecrawl_mcp_api_key"

# Install via pipx into the user's pipx environment.
aider_pipx_package: "aider-chat"
# Empty = let pipx pick the interpreter. Work-laptop / Homebrew Apple Silicon
# often needs an explicit 3.12: /opt/homebrew/bin/python3.12
aider_pipx_python: "/opt/homebrew/bin/python3.12"

# Write/edit workflow (intake: Aider must create files, not only suggest shell)
aider_auto_commits: false
aider_dirty_commits: true
aider_suggest_shell_commands: false
# Aider 0.86+ requires yes-always. Emitting legacy `yes:` makes the CLI reject
# the managed config after every apply — treat key renames as conversion.
aider_yes_always: true
# Deprecated inventory alias (pre-0.86). When set, tasks map it onto yes-always.
aider_yes: null
aider_git: true
aider_skip_sanity_check_repo: false
aider_read_files: []
aider_map_tokens: 2048
aider_map_refresh: files

# Deploy repo-root .aiderignore next to the packet playbook when present.
aider_deploy_repo_ignore: true
aider_repo_ignore_path: "{{ playbook_dir }}/.aiderignore"

# MCP servers to inject into the aider MCP config.
aider_mcp_context7_enabled: true
aider_mcp_firecrawl_enabled: true
