---
# Cursor editor role defaults

# WSL distro name used by the OpenSSH default shell wrapper on Windows.
# Must match the installed WSL distribution (wsl --list).
cursor_wsl_distro: "Ubuntu-24.04"

# OpenSSH DefaultShell wrapper path on Windows.
# The wrapper routes interactive SSH to a WSL login shell and
# command-mode SSH to WSL bash -c (required for Ansible and Cursor Remote-SSH).
cursor_wsl_wrapper_path: 'C:\ProgramData\ssh\wsl-bash-wrapper.cmd'

# Remote SSH host entries deployed to ~/.ssh/config on the controller (Mac/Linux).
# Each entry creates a Host block for Cursor Remote-SSH connections.
# Set to [] to skip SSH config deployment.
cursor_remote_ssh_hosts:
  - name: server-225-wsl
    hostname: "{{ hostvars['server-225-wsl']['ansible_host'] | default('DESKTOP-VLLM') }}"
    user: "{{ hostvars['server-225-wsl']['ansible_user'] | default('joshc') }}"
    port: "{{ hostvars['server-225-wsl']['ansible_port'] | default(22) }}"
    identity_file: "~/.ssh/id_ed25519_ansible"
