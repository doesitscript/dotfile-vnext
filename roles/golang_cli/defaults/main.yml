---
# Install and manage Go via Homebrew (Terratest and other Go tooling).
golang_cli_state: present
golang_cli_homebrew_formula: go
golang_cli_verify: true
# Terratest docs currently cite Go >= 1.26; Homebrew go is usually close.
# Keep a practical floor so day-2 apply does not hard-fail on 1.22–1.25 hosts.
golang_cli_min_version: "1.22"
