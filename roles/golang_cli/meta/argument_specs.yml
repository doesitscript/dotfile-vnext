---
argument_specs:
  main:
    short_description: "Install and manage Go via Homebrew on macOS"
    options:
      golang_cli_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description:
          - "Whether the Go toolchain should be installed or removed."
      golang_cli_homebrew_formula:
        type: str
        default: go
        description:
          - "Homebrew formula used to manage Go."
      golang_cli_verify:
        type: bool
        default: true
        description:
          - "Verify Go is present or absent after convergence."
      golang_cli_min_version:
        type: str
        default: "1.22"
        description:
          - "Minimum Go version required when state is present (Terratest docs cite 1.26)."
