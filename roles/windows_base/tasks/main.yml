---
# windows_base — Shared Windows base configuration.
#
# Enables Windows features, configures power settings, creates data directories,
# configures Defender exclusions, enables long paths, disables Secure Boot updates.
#
# API contract: windows_base_config dictionary (see defaults/main.yml).
# Data directories come from group_vars: windows_data_root, stacks_root, data_root.
#
# Consumed by: server_225/windows_base, dev_3090/windows_base, network_server/windows_base.

- name: Resolve windows_base_config contract
  ansible.builtin.set_fact:
    windows_base_cfg: "{{ windows_base_config | default({}) }}"

# --- Windows Features ---

# TODO: disabled — Hyper-V feature installation must live in roles/hyperv_networking only.
# Invoke via playbooks/hyperv_networking.yaml, not from windows_base.
# when: windows_base_cfg.enable_hyperv | default(true) | bool
- name: Enable Hyper-V features
  ansible.builtin.include_role:
    name: hyperv_networking
    tasks_from: hyperv_feature.yml
  when: false


# Containers
- name: Enable Containers feature
  ansible.windows.win_optional_feature:
    name:
      - Containers
    state: present
  register: windows_base_containers
  when: windows_base_cfg.enable_containers | default(true) | bool

- name: Enable Virtual Machine Platform feature
  ansible.windows.win_optional_feature:
    name:
      - VirtualMachinePlatform
    state: present
  register: windows_base_vmp
  when: windows_base_cfg.enable_vmp | default(true) | bool

- name: Reboot if Windows features were installed
  ansible.windows.win_reboot:
    msg: "Ansible reboot after Windows feature installation"
    reboot_timeout: 600
  when: >-
    (windows_base_containers is defined and windows_base_containers is changed) or
    (windows_base_vmp is defined and windows_base_vmp is changed)

- name: Wait for system to come back online after reboot
  ansible.builtin.wait_for_connection:
    timeout: 600
  when: >-
    (windows_base_containers is defined and windows_base_containers is changed) or
    (windows_base_vmp is defined and windows_base_vmp is changed)

# --- Power Management ---

- name: Set power plan to High Performance
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $current = (powercfg /getactivescheme) -match '([a-f0-9-]{36})'
      if ($Matches[1] -ne '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c') {
        powercfg /setactive SCHEME_MIN
        $Ansible.Changed = $true
      }
  when: windows_base_cfg.high_performance_power | default(true) | bool

- name: Disable sleep and hibernate
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      powercfg -change -standby-timeout-ac 0
      powercfg -change -hibernate-timeout-ac 0
      $Ansible.Changed = $true
  when: windows_base_cfg.disable_sleep | default(true) | bool

- name: Disable USB selective suspend
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      powercfg -setacvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0
      powercfg -setactive SCHEME_CURRENT
      $Ansible.Changed = $true
  when: windows_base_cfg.disable_usb_suspend | default(true) | bool

# --- Data Directories ---

- name: Verify data drive exists
  ansible.windows.win_stat:
    path: >-
      {{ windows_data_root[:2] + '\\' }}
  register: windows_base_data_drive
  failed_when: not windows_base_data_drive.stat.exists

- name: Create data root directory
  ansible.windows.win_file:
    path: "{{ windows_data_root }}"
    state: directory

- name: Create stacks directory
  ansible.windows.win_file:
    path: "{{ stacks_root }}"
    state: directory

- name: Create data directory
  ansible.windows.win_file:
    path: "{{ data_root }}"
    state: directory

# --- Windows Defender ---

- name: Disable Windows Defender indexing on data directories
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $paths = @('{{ windows_data_root }}', '{{ stacks_root }}', '{{ data_root }}')
      foreach ($path in $paths) {
        if (Test-Path $path) {
          attrib.exe +s $path
          $Ansible.Changed = $true
        }
      }
  when: windows_base_cfg.defender_exclusions | default(true) | bool

- name: Add Windows Defender exclusions for data directories
  ansible.windows.win_powershell:
    error_action: silently_continue
    script: |
      $Ansible.Changed = $false
      $paths = @('{{ windows_data_root }}', '{{ stacks_root }}', '{{ data_root }}')
      foreach ($path in $paths) {
        if (Test-Path $path) {
          Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          $Ansible.Changed = $true
        }
      }
  when: windows_base_cfg.defender_exclusions | default(true) | bool

# --- Registry ---

- name: Enable long paths in Windows
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
    name: LongPathsEnabled
    data: 1
    type: dword
  when: windows_base_cfg.long_paths | default(true) | bool

- name: Disable UEFI Secure Boot DB/DBX/SBAT update attempts
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State
    name: UEFIUpdateDisabled
    data: 1
    type: dword
    state: present
  when: windows_base_cfg.disable_secure_boot_updates | default(true) | bool
