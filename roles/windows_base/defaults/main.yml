---
# windows_base — API contract.
#
# Shared Windows base configuration: features, power management, data directories.
# Override in host_vars / group_vars per node.
windows_base_config:
  enable_hyperv: true
  enable_containers: true
  enable_vmp: true
  enable_wsl: false
  high_performance_power: true
  disable_sleep: true
  disable_usb_suspend: true
  defender_exclusions: true
  long_paths: true
  disable_secure_boot_updates: true
