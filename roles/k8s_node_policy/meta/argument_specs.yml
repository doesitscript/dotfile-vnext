---
argument_specs:
  main:
    short_description: Report or apply K8s node labels/taints from host_classification.
    options:
      k8s_node_policy_state:
        type: str
        required: false
        default: absent
        choices: [present, absent]
      k8s_node_policy_apply:
        type: bool
        required: false
        default: false
        description: When true with state present, mutate node labels/taints (not implemented until gated).
      k8s_node_policy_require_classification:
        type: bool
        required: false
        default: true
