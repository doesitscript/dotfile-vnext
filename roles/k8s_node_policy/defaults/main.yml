---
# k8s_node_policy — apply or report node labels/taints from classify_host output.
# Default: report only. Live kubectl mutate requires explicit apply gate.

k8s_node_policy_state: absent
k8s_node_policy_apply: false
k8s_node_policy_require_classification: true
k8s_node_policy_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
# Defaults to inventory_hostname (must match `kubectl get nodes` name).
k8s_node_policy_node_name: "{{ inventory_hostname }}"
