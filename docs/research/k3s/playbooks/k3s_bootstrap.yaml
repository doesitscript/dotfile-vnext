---
# k3s Cluster Bootstrap Playbook
# Initializes control plane on network_server-wsl and agents on all workers

- name: k3s Cluster Bootstrap
  hosts: localhost
  gather_facts: true

  vars:
    k3s_token: "{{ lookup('env', 'K3S_TOKEN') | default('') }}"

  pre_tasks:
    - name: Validate k3s token is set
      ansible.builtin.fail:
        msg: "K3S_TOKEN environment variable must be set before running this playbook"
      when: k3s_token == ""

    - name: Display cluster bootstrap parameters
      ansible.builtin.debug:
        msg:
          - "k3s Version: {{ k3s_version }}"
          - "Control Plane API: {{ k3s_api_url }}"
          - "CNI: {{ k3s_cni }}"
          - "Cluster DNS: {{ k3s_cluster_dns }}"

  tasks:
    - name: "Phase 1: Initialize k3s Control Plane (network_server-wsl)"
      ansible.builtin.include_role:
        name: k3s_control_plane
      vars:
        k3s_version: "{{ k3s_version }}"
        k3s_token: "{{ k3s_token }}"

    - name: "Wait for control plane to stabilize"
      ansible.builtin.pause:
        seconds: 20

    - name: "Phase 2: Deploy k3s Agents (server-225-wsl, dev-3090-wsl)"
      ansible.builtin.include_role:
        name: k3s_agent
      vars:
        k3s_version: "{{ k3s_version }}"
        k3s_token: "{{ k3s_token }}"
        k3s_label_node_type: "{{ item.node_type }}"
        k3s_taint_inference_only: "{{ item.taint_inference | default(false) }}"
      loop:
        - node_type: "gpu-compute"
          taint_inference: false
        - node_type: "gpu-inference"
          taint_inference: true

    - name: "Wait for all agents to join"
      ansible.builtin.pause:
        seconds: 15

    - name: "Phase 3: Verify all nodes are Ready"
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get nodes -o wide
      register: all_nodes
      changed_when: false

    - name: Display all nodes status
      ansible.builtin.debug:
        msg: "{{ all_nodes.stdout }}"

    - name: "Phase 4: Set up persistent storage"
      ansible.builtin.include_role:
        name: k3s_storage

    - name: "Phase 5: Deploy workloads namespace"
      ansible.builtin.include_role:
        name: k3s_workloads

  post_tasks:
    - name: Cluster bootstrap complete
      ansible.builtin.debug:
        msg:
          - "✓ k3s cluster bootstrap complete!"
          - "✓ Control Plane: {{ k3s_api_url }}"
          - "✓ Nodes: control + 2 agents"
          - "✓ CNI: {{ k3s_cni }}"
          - "✓ Storage: local-storage configured"
          - "✓ Namespace: {{ workload_namespace }} ready"
          - ""
          - "Next steps:"
          - "  1. Extract kubeconfig: kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get nodes"
          - "  2. Deploy workloads: ansible-playbook playbooks/k3s_deploy_workloads.yaml"
