---
# k3s Control Plane Defaults

k3s_version: "v1.28.4"
k3s_channel: "stable"
k3s_install_dir: /usr/local/bin
k3s_data_dir: /var/lib/rancher/k3s

# API Server Configuration
k3s_api_host: "192.168.50.38"
k3s_api_port: 6443
k3s_api_url: "https://{{ k3s_api_host }}:{{ k3s_api_port }}"

# Cluster Configuration
k3s_cni: flannel
k3s_cluster_dns: "10.43.0.10"
k3s_cluster_domain: "cluster.local"

# Control plane specifics
k3s_etcd_ha: true
k3s_disable_local_storage: false

# Security
k3s_token: "" # MUST be set per environment/execution

# Kubeconfig extraction
k3s_kubeconfig_src: "/etc/rancher/k3s/k3s.yaml"
k3s_kubeconfig_dest_dir: "/tmp/k3s-kubeconfigs"

# Feature gates
k3s_feature_gates: []
