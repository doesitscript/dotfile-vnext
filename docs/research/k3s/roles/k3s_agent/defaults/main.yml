---
# k3s Agent Defaults

k3s_version: "v1.28.4"
k3s_install_dir: /usr/local/bin
k3s_data_dir: /var/lib/rancher/k3s

# API Server Configuration (for joining cluster)
k3s_api_url: "https://192.168.50.38:6443"
k3s_token: "" # MUST be set per environment/execution

# Node Configuration
k3s_label_node_type: "" # e.g., gpu-compute, gpu-inference
k3s_taint_inference_only: false # If true, apply inference=true:NoSchedule taint

# GPU Support
k3s_gpu_enabled: false
k3s_nvidia_runtime: ""

# Feature gates
k3s_feature_gates: []
