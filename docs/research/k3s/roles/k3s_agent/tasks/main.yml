---
# k3s Agent Installation Tasks

- name: Check if k3s-agent is already installed
  ansible.builtin.stat:
    path: "{{ k3s_install_dir }}/k3s-agent"
  register: k3s_agent_binary_stat

- name: Download and install k3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
    K3S_TOKEN="{{ k3s_token }}" \
    K3S_URL="{{ k3s_api_url }}" \
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    INSTALL_K3S_SKIP_ENABLE=true \
    bash -s - agent
  when: not k3s_agent_binary_stat.stat.exists
  register: k3s_agent_install_result
  changed_when: "'installed' in k3s_agent_install_result.stderr"

- name: Enable and start k3s-agent service
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true
  register: k3s_agent_service_result

- name: Wait for agent to register with control plane
  ansible.builtin.pause:
    seconds: 15

- name: Label node with node type (if specified)
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl \
      --kubeconfig=/etc/rancher/k3s/k3s.yaml \
      label node {{ ansible_hostname }} \
      node-type={{ k3s_label_node_type }} \
      --overwrite=true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: k3s_label_node_type != ""
  changed_when: true

- name: Apply inference-only taint (if configured)
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl \
      --kubeconfig=/etc/rancher/k3s/k3s.yaml \
      taint node {{ ansible_hostname }} \
      inference=true:NoSchedule \
      --overwrite=true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: k3s_taint_inference_only | bool
  changed_when: true

- name: Verify agent is Ready
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl \
      --kubeconfig=/etc/rancher/k3s/k3s.yaml \
      get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: agent_ready
  until: agent_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Display agent status
  ansible.builtin.debug:
    msg:
      - "k3s agent joined cluster: {{ ansible_hostname }}"
      - "Node Type: {{ k3s_label_node_type | default('(none)') }}"
      - "Inference-Only: {{ k3s_taint_inference_only | default(false) }}"
