---
# k3s Storage Setup Tasks

- name: Ensure persistent volume mount point exists
  ansible.builtin.file:
    path: "{{ persistent_volume_path }}"
    state: directory
    mode: "0755"
  become: true

- name: Set ownership and permissions for PV path
  ansible.builtin.file:
    path: "{{ persistent_volume_path }}"
    owner: "{{ storage_uid }}"
    group: "{{ storage_gid }}"
    mode: "{{ storage_mode }}"
    recurse: true
  become: true

- name: Create StorageClass manifest
  ansible.builtin.template:
    src: storage_class.yml.j2
    dest: /tmp/storage_class.yml
    mode: "0644"

- name: Create PersistentVolume manifest
  ansible.builtin.template:
    src: persistent_volume.yml.j2
    dest: /tmp/persistent_volume.yml
    mode: "0644"

- name: Apply StorageClass
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f /tmp/storage_class.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Apply PersistentVolume
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f /tmp/persistent_volume.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Wait for PersistentVolume to be Available
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pv local-storage-network-server -o jsonpath='{.status.phase}'
  register: pv_phase
  until: pv_phase.stdout == "Available"
  retries: 10
  delay: 5
  changed_when: false

- name: Display storage readiness
  ansible.builtin.debug:
    msg:
      - "StorageClass '{{ storageclass_name }}' created"
      - "PersistentVolume 'local-storage-network-server' available"
      - "Mount path: {{ persistent_volume_path }}"
