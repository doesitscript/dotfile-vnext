---
# k3s Storage Defaults

# Storage paths
persistent_volume_path: "/mnt/d/ai/data/k3s-volumes"
storageclass_name: "local-storage"
storageclass_provisioner: "kubernetes.io/local"

# PersistentVolume configuration
pv_capacity: "500Gi"
pv_access_mode: "ReadWriteOnce"

# Storage permissions
storage_uid: 0
storage_gid: 0
storage_mode: "0755"

# Manifest application
kubectl_config: ~/.kube/config
kubeconfig_context: "default"
