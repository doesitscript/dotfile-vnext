---
# k3s Workloads Deployment Tasks

- name: Wait for cluster API availability
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml cluster-info
  retries: 20
  delay: 10
  changed_when: false

- name: Create ai-infra namespace
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml create namespace {{ workload_namespace }} --dry-run=client -o yaml | \
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Create namespace manifest
  ansible.builtin.template:
    src: namespace.yml.j2
    dest: /tmp/namespace.yml
    mode: "0644"

- name: Apply namespace manifest
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f /tmp/namespace.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Display workload deployment readiness
  ansible.builtin.debug:
    msg:
      - "Kubernetes namespace '{{ workload_namespace }}' created"
      - "Ready for workload manifests deployment"
      - "Use k3s_manifests playbook to deploy individual components"
