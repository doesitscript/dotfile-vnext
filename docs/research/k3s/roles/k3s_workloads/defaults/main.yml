---
# k3s Workloads Defaults

# Namespace Configuration
workload_namespace: "ai-infra"

# Component Replicas
postgres_replica_count: 1
model_server_replica_count: 2
log_collector_replica_count: 1
dashboard_replica_count: 1

# Feature Toggles
log_collector_enabled: true
dashboard_enabled: true
workflow_engine_enabled: false # Future

# Resource Requests (can be overridden per host_vars)
postgres_memory_request: "1Gi"
postgres_memory_limit: "2Gi"
model_server_memory_request: "4Gi"
model_server_memory_limit: "8Gi"
model_server_gpu_request: 1

# Manifest application
kubectl_config: ~/.kube/config
kubeconfig_context: "default"
manifests_wait_timeout: 300 # seconds
