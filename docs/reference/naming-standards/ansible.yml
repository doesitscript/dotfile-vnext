---
schema_id: ansible
schema_version: 1
status: integrated
owner: naming-standards

collection_naming:
  pattern: "<namespace>.<collection>"
  namespace:
    regex: "^[a-z][a-z0-9_]*$"
    project_default: cst
  collection:
    regex: "^[a-z][a-z0-9_]*$"
    project_default: lab
  imported_example:
    namespace: cas
    collection: lab
    status: candidate
    normalized_note: "Useful pattern only; not active project identity."
  metadata_tags:
    required:
      - naming-schema
      - netbox
      - infrastructure

role_naming:
  pattern: "<capability>"
  case: snake_case
  no_hyphens: true
  capability_focused: true
  variable_prefix: "<role_name>_"
  vault_variable_prefix: "vault_<role_name>_"
  lifecycle_state_variable: "<role_name>_state"

playbook_tags:
  role_specific_pattern: "<role_name>_<operation>"
  global_tags:
    schema: "Run schema validation or preflight tasks."
    always: "Required validation tasks that should run unless explicitly skipped."
  namespace_rule: "Ansible tags use underscores; NetBox tags use hyphens."

inventory_patterns:
  hostname_schema:
    default: "<tenant>-<environment>-<domain>-<role>-<idx>"
    physical_hyperv_windows_host: "<tenant>-<environment>-<role>-<idx>"
  imported_hostname_schema: "{tenant}-{env}-{site}-{role}-{seq##}"
  field_aliases:
    env: environment
    site: environment
    seq: idx
  hosts_mapping_reference: inventory/hosts_mapping.yaml
  live_registry: docs/reference/naming-standards/live-object-registry.yml

inventory_group_kinds:
  lane:
    description: Hyper-V physical lane — purpose-based group_vars, not a hostname copy
    integrated:
      - hyperv_lane_gpu
      - hyperv_lane_storage
    retired_replaced_by_lane:
      - server_225
      - hvh_02
  capability:
    description: Automation intent (windows_hosts, linux_vm_hosts, k3s_cluster_*)
    examples:
      - windows_hosts
      - linux_vm_hosts
      - execution_nodes
      - logging_server

legacy_alias_policy:
  active_functional_reference: forbidden
  documentation_reference: allowed_only_if_legacy_marked
  registry_quarantine: live-object-registry.yml retired_aliases

schema_preflight:
  status: scaffolded
  preferred_entrypoint: playbooks/validate_naming_schema.yml
  fail_message_prefix: "SCHEMA VIOLATION"
  regex: "^([a-z0-9]{2,3}-[a-z0-9]{2,3}-[a-z0-9]{2,3}-[a-z0-9]{2,3}-[0-9]{2}|[a-z0-9]{2,3}-[a-z0-9]{2,3}-[a-z0-9]{2,3}-[0-9]{2})$"
  segment_order:
    default:
      - tenant
      - environment
      - domain
      - role
      - idx
    physical_hyperv_windows_host:
      - tenant
      - environment
      - role
      - idx
  imported_sources:
    - docs/intake/schema-design-proposal-netbox-ansible-context/ansible_provision_all.txt
    - docs/intake/schema-design-proposal-netbox-ansible-context/ansible_validate_schema.txt

k3s_traefik_routes:
  status: integrated
  role: k3s_traefik_routes
  lifecycle_variable: k3s_traefik_routes_state
  registry_variable: k3s_traefik_routes_entries
  registry_location: inventory/group_vars/k3s_cluster.yaml
  live_registry: live-object-registry.yml ingress_routes
  patterns:
    route_key: "<product>-<surface>"
    ingress_name: "<route_key>-ingress"
  tags:
    - k3s_traefik_routes
    - k3s_traefik_routes_apply
    - k3s_traefik_routes_verify
    - k3s_traefik_routes_preview
  note: >
    Shared Ingress CR lifecycle for K3s kube-system Traefik. Does not install Traefik.

homelab_hosts_file_web_catalog:
  status: integrated
  variable: homelab_hosts_file_web_catalog
  group_vars: inventory/group_vars/all/homelab_hosts_file.yml
  sources:
    - k3s_traefik_routes_entries
    - guest_published_tcp_ports on HOM-LAB-HVH-02
    - guest_direct HTTP on hom-lab-ctl-dkr-02
  live_registry: live-object-registry.yml ingress_routes guest_portproxy_catalog
  note: DNS-3b SSOT for interim /etc/hosts web rows and curl verify matrix

homelab_hosts_file_mac:
  status: integrated
  role: homelab_hosts_file_mac
  lifecycle_variable: homelab_hosts_file_mac_enabled
  galaxy_role: loz-hurst.hosts_file
  data_source: homelab_hosts_file_web_catalog with mac_hosts_enabled true
  mac_hosts_workaround_source: homelab_router_gt6_mac_hosts_workaround
  note: mac-dev /etc/hosts for operator hostnames; add_short_name false

guest_published_tcp_ports:
  status: integrated
  variable: guest_published_tcp_ports
  host_vars: inventory/host_vars/HOM-LAB-HVH-02.yaml
  name_pattern: "<runtime>-<product-or-purpose>[-<detail>]"
  integrated_examples:
    - name: k3s-traefik-http
      purpose: K3s Traefik HTTP front door on HOM-LAB-HVH-02 LAN port 80
    - name: langfuse-k3s
      purpose: Langfuse web UI NodePort fallback on hom-lab-ctl-k3s-02
    - name: litellm-k3s
      purpose: LiteLLM gateway NodePort fallback on hom-lab-ctl-k3s-02
  live_registry: live-object-registry.yml guest_portproxy_catalog

model_lane_aliases:
  status: candidate
  variable: k3s_litellm_gateway_model_list
  registry_location: docs/reference/naming-standards/live-object-registry.yml model_lanes
  slug_pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  trace_metadata_key: model_lane
  routing_policy_enum:
    - local-5090
    - local-only
    - local-preferred
    - local-or-azure
    - azure-allowed
    - migration
  integrated_plan: docs/plans/2026-05-29--ai-litellm-model-lanes-incomplete-wip/README.md
  note: >
    Client-facing LiteLLM model_name aliases. These are not inventory groups
    and do not create gpu_lane_* NetBox taxonomy.

model_catalog_manifest:
  status: candidate
  variable: model_catalog_manifest
  group_vars: inventory/group_vars/model_catalog/manifest.yml
  registry_location: docs/reference/naming-standards/live-object-registry.yml model_catalog_entries
  storage_root_unc: "\\\\HOM-LAB-HVH-01\\public\\models\\huggingface"
  status_enum:
    - pending_research
    - provisional_example
    - candidate
    - downloaded
    - served
    - deferred
  required_entry_fields:
    - lane
    - purpose
    - status
    - storage_host
    - unc_path
  optional_entry_fields:
    - hf_repo_id
    - example_hf_repo_id
    - candidate_family
    - quantization
    - vram_gb_estimate
    - serving_runtime
    - research_sources
    - selection_blockers
  integrated_plan: docs/plans/2026-05-29--ai-model-catalog-hf-storage-incomplete-wip/README.md
