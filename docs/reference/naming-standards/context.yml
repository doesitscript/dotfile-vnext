---
schema_id: context
schema_version: 1
status: integrated
owner: naming-standards

rules:
  default_code_length: "2-3"
  delimiter: "-"
  case: lowercase
  canonical_index_field: idx
  imported_index_aliases:
    - seq
    - sequence
    - nn
  index:
    width: 2
    start: "01"
    reserved:
      - "00"
    regex: "^[0-9]{2}$"

context_fields:
  namespace:
    code: cst
    full: castle
    required_in_metadata: true
    render_default: false
    sources:
      - cloud-posse-context
      - project-decision
  tenant:
    code: hom
    full: home
    required_in_metadata: true
    render_default: true
    netbox_preferred_field: tenant
  environment:
    code: lab
    full: lab
    required_in_metadata: true
    render_default: true
    netbox_preferred_field: site
  domain:
    code: ctl
    full: control-plane
    required_in_metadata: true
    render_default: true
    netbox_preferred_field: config_context
    replaces:
      - auth
      - aut
  domain_exe:
    code: exe
    full: execution-plane
    required_in_metadata: false
    render_default: true
    status: candidate
    notes: >
      Proposed for mac-dev → hom-lab-exe-mac-01. Not integrated until edge-dev
      plan is approved. See live-object-registry.yml candidates.
  domain_dev:
    code: dev
    full: development-workstation
    required_in_metadata: false
    render_default: true
    status: candidate
    notes: >
      Proposed for dev-workstation-win → hom-lab-dev-wks-01. Not integrated until
      edge-dev plan is approved.
  workload:
    code: aix
    full: ai-experiment
    required_in_metadata: false
    render_default: false
    notes: >
      Primary use: Azure AI resources (azure-ai.yml). Candidate reuse for
      hom-lab-aix-gpu-01 (dev-3090-win) — document dual-use before promoting to
      integrated host domain; see live-object-registry.yml candidates.
  site:
    code: lab
    full: lab
    required_in_metadata: true
    render_default: false
    netbox_preferred_field: site
    notes: "Current project collapses environment and homelab site into lab until a separate site code registry is accepted."
  private_dns_zone:
    code: hom.lab
    full: homelab-private-dns-zone
    required_in_metadata: false
    render_default: false
    status: integrated
    authoritative_for:
      - ASUS GT6 DHCP domain name
      - operator_service_hostname LAN cutover (langfuse.hom.lab)
    notes: >
      Not a hostname segment. Set on router DHCP; service FQDNs use explicit
      product label plus this zone.

imported_examples:
  cas:
    status: candidate
    source: docs/intake/schema-design-proposal-netbox-ansible-context
    normalized_use: "Example tenant only; not active project tenant."
  hom:
    status: integrated
    source: docs/intake/schema-design-proposal-netbox-ansible-context
    normalized_use: "Accepted active tenant code for home."

required_context_tags:
  namespace: cst
  tenant: hom
  environment: lab
  domain: ctl

value_by_surface:
  status: integrated
  registry: netbox.yml
  note: >
    Hostnames and config-context JSON use compact codes. NetBox tenant slug and
    backup catalog paths may use full words (home, castle) by documented policy.
  namespace:
    code: cst
    full: castle
  tenant:
    code: hom
    full: home
