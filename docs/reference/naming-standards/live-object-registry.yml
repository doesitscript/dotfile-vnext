---
schema_id: live-object-registry
schema_version: 1
status: integrated
owner: naming-standards
last_reconciled: "2026-05-27"

metadata:
  authority_note: >
    Current names for repo-managed homelab objects. Sources of truth for rows:
    roles/ipam_netbox/defaults/main.yml, inventory/inventory.yaml,
    inventory/hosts_mapping.yaml. Retired strings appear only under retired_aliases.
  naming_schema_version: 1
  netbox_site_slug: homelab
  netbox_tenant_slug: home

naming_layers:
  inventory_hostname:
    description: Ansible inventory key and NetBox device/VM name when seeded
    authoritative_for:
      - ansible --limit
      - nb_inventory host key when modeled in NetBox
      - NetBox object name for repo-managed devices and VMs
  os_hostname:
    description: Windows COMPUTERNAME or Linux hostname on the guest OS
    authoritative_for:
      - bootstrap autodetect (physical_nodes.os_hostname)
      - on-machine identity; may differ from inventory_hostname until rename
  router_hostname:
    description: DHCP/DNS label on the LAN router
    authoritative_for:
      - router UI and DNS when used
    note: May differ from os_hostname and inventory_hostname
  ansible_connect_target:
    description: host_vars ansible_host — what Ansible dials for SSH/WinRM
    authoritative_for:
      - connection transport only
  host_ip:
    description: Stable IPv4 for probes, routing, and service URLs
    authoritative_for:
      - TCP checks and guest routing documentation
  physical_node:
    description: Metadata grouping key in hosts_mapping — not a hostname
    authoritative_for:
      - bootstrap lane detection only
  ansible_group:
    description: Inventory group for capability or Hyper-V lane scope
    authoritative_for:
      - group_vars loading and playbook targeting
    note: Lane groups (hyperv_lane_*) are not NetBox objects

