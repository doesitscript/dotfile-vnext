model_lanes:
  status: candidate
  source_plan: docs/plans/2026-05-29--ai-litellm-model-lanes-incomplete-wip/README.md
  variable: k3s_litellm_gateway_model_list
  trace_metadata_key: model_lane
  entries:
    - slug: deepreinforce-ai/Ornith-1.0-35B-GGUF
      purpose: architecture, refactors, hard coding
      routing_policy: local-5090
      primary_guest: hom-lab-ctl-k3s-02
      catalog_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      status: pending_research
    - slug: deepreinforce-ai/Ornith-1.0-35B-GGUF-no-trim
      purpose: >-
        Same Ornith weights on vllm-primary without LiteLLM trim_messages /
        adaptive max_tokens (raw 32k; overflow fails at vLLM)
      routing_policy: local-primary-no-trim
      primary_guest: hom-lab-ctl-k3s-02
      catalog_lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      status: selected
      notes: gateway alias only; not a separate weight download
    - slug: code-fast
      purpose: autocomplete, small edits, repo questions
      routing_policy: local-preferred
      primary_guest: null
      primary_host: HOM-LAB-HVH-01
      catalog_lane: code-fast
      status: selected
      notes: >-
        LiteLLM alias to Ollama qwen2.5-coder:1.5b on HVH-01 GTX 1060
        (same backend as code-autocomplete-1.5b). Not a separate 7B runtime.
    - slug: code-autocomplete-1.5b
      purpose: Continue autocomplete Qwen2.5-Coder 1.5B
      routing_policy: local-continue-autocomplete
      primary_guest: null
      primary_host: HOM-LAB-HVH-01
      catalog_lane: code-autocomplete-1.5b
      status: selected
      notes: Client alias; backend is Ollama on HVH-01 via LiteLLM openai/ route.
    - slug: code-review
      purpose: critique, risk finding, test review
      routing_policy: local-secondary-review
      primary_guest: null
      primary_host: HOM-LAB-HVH-01
      catalog_lane: code-review
      status: selected_secondary_runtime
    - slug: code-test
      purpose: test generation and focused test repair
      routing_policy: local-preferred
      primary_guest: null
      catalog_lane: code-test
      status: pending_research
    - slug: ripi-private
      purpose: private planning, governance, and conversation
      routing_policy: local-only
      primary_guest: null
      catalog_lane: ripi-private
      status: pending_research
    - slug: embeddings-local
      purpose: local retrieval and index embeddings
      routing_policy: local-only
      primary_guest: null
      catalog_lane: embeddings-local
      status: pending_research
    - slug: public-research
      purpose: public docs, comparison, and research
      routing_policy: azure-allowed
      primary_guest: null
      catalog_lane: public-research
      status: deferred
    - slug: experiment
      purpose: smoke tests and trial models
      routing_policy: local-only
      primary_guest: hom-lab-ctl-k3s-02
      catalog_lane: experiment
      status: provisional_example
    - slug: gpt-4o-mini
      purpose: migration fallback
      routing_policy: migration
      primary_guest: null
      catalog_lane: null
      status: migration
    - slug: default
      purpose: migration fallback
      routing_policy: migration
      primary_guest: null
      catalog_lane: null
      status: migration

model_catalog_entries:
  status: candidate
  source_plan: docs/plans/2026-05-29--ai-model-catalog-hf-storage-incomplete-wip/README.md
  manifest: inventory/group_vars/model_catalog/manifest.yml
  storage_host: HOM-LAB-HVH-01
  storage_root_unc: "\\\\HOM-LAB-HVH-01\\public\\models\\huggingface"
  entries:
    - lane: deepreinforce-ai/Ornith-1.0-35B-GGUF
      status: pending_research
      example_hf_repo_id: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      candidate_family: large coding model suitable for 5090 vLLM
      research_sources:
        - https://huggingface.co/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
    - lane: experiment
      status: provisional_example
      example_hf_repo_id: Qwen/Qwen3-0.6B
      candidate_family: small smoke/trial model
      research_sources:
        - https://huggingface.co/Qwen/Qwen3-0.6B
    - lane: code-fast
      status: selected
      candidate_family: Qwen2.5-Coder 1.5B via Ollama on HVH-01
      selected_hf_repo_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    - lane: code-autocomplete-1.5b
      status: selected
      candidate_family: Qwen2.5-Coder 1.5B via Ollama on HVH-01
      selected_hf_repo_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    - lane: code-review
      status: selected_secondary_runtime
      candidate_family: small Ollama-hosted code-review/support model on GTX 1060 6GB
    - lane: code-test
      status: pending_research
      candidate_family: test generation/repair model
    - lane: ripi-private
      status: pending_research
      candidate_family: private local reasoning/planning model
    - lane: embeddings-local
      status: pending_research
      candidate_family: embedding model
    - lane: public-research
      status: deferred
      candidate_family: cloud/provider route unless local model is selected

