---
schema_id: render-patterns
schema_version: 1
status: integrated
owner: naming-standards

defaults:
  delimiter: "-"
  canonical_index_field: idx
  idx_width: 2
  base_context_order:
    - tenant
    - environment
    - domain
  full_context_order:
    - namespace
    - tenant
    - environment
    - domain

# Layered service identity — slug, VM, URL today, logical hostname, FQDN later.
# See docs/plans/2026-05-27--service-identity-dns-future-state/README.md
service_identity_layers:
  L1_netbox_service_slug:
    description: NetBox service.name and stack-facing slug
    example: netbox-web
    avoid_for:
      - VM hostname
      - DNS SAN
  L2_parent_vm:
    description: inventory_hostname of the VM that runs the service
    pattern_ref: virtual_machine
    example: hom-lab-ctl-dkr-02
  L3_primary_access_point:
    description: How operators reach the service today (IP, portproxy, guest URL)
    stored_in: roles/ipam_netbox/defaults/main.yml
    example: "http://192.168.50.158:8000/"
    note: Not a naming pattern; operational URL until DNS exists.
  L4_logical_service_hostname:
    description: Stable host-style identity for DNS, certs, ingress, LB backends
    pattern_ref: service
    example: hom-lab-ctl-nbx-01
    status: documented_phase_0
    not_netbox_service_name: true
  L5_fqdn:
    description: Logical hostname plus zone when internal or public DNS exists
    example: null
    status: unset_until_zone_chosen
  L6_canonical_id:
    description: Long-form documentation and catalog metadata
    pattern_ref: canonical_id
    example: cst-hom-lab-ctl-service-netbox-01

patterns:
  baseline_resource:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<role>-<idx>"
    example: hom-lab-ctl-hvh-01
    source_aliases:
      - "{tenant}-{env}-{site}-{role}-{seq##}"
      - "<namespace?>-<tenant>-<environment>-<stage>-<role_code>-<nn>"
  canonical_id:
    status: integrated
    pattern: "<namespace>-<tenant>-<environment>-<domain>-<resource_class>-<name>-<idx>"
    example: cst-hom-lab-ctl-service-netbox-01
    use_for:
      - metadata
      - documentation
      - cloud labels
    avoid_for:
      - short hostnames
  physical_device:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<role>-<idx>"
    example: hom-lab-ctl-hvh-01
    source_pattern: "{role}-{node}"
    note: "Node or asset numbers are metadata unless accepted into a hardware code registry."
  os_instance:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<role>-<os_code>-<idx>"
    example: hom-lab-ctl-hvh-win-01
    source_pattern: "{role}-{node}-{os}"
    note: "Use only when separate OS identity must be rendered; otherwise OS belongs in platform."
  virtual_machine:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<role>-<idx>"
    example: hom-lab-ctl-k3s-01
    source_pattern: "{role}-{node}-{vm_role}-{ordinal}"
    note: "VM placement belongs in NetBox cluster fields."
  service:
    status: integrated
    layer: L4_logical_service_hostname
    pattern: "<tenant>-<environment>-<domain>-<service>-<idx>"
    example: hom-lab-ctl-nbx-01
    source_pattern: "{namespace}-{tenant}-{environment}-{stage}-{service}-{ordinal}"
    use_for:
      - logical_service_hostname metadata
      - future DNS label stem
      - TLS cert SAN
      - ingress host / LB backend identity
    avoid_for:
      - NetBox service.name
      - VM inventory_hostname
      - compose service container_name unless explicitly aligned
    live_netbox_slug_note: >
      Seeds use L1 slugs (netbox-web) on L2 VMs; L4 is registry metadata until
      Phase 2 seeds or custom fields. Do not rename L1 to L4 without approval.
  storage:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<data_class>-<purpose>-<idx>"
    example: hom-lab-ctl-hot-model-01
    source_pattern: "{namespace}-{tenant}-{environment}-{stage}-{data_class}-{purpose}-{ordinal}"
  azure_resource:
    status: integrated
    pattern: "<type>-<tenant>-<environment>-<domain>-<component>-<idx>"
    example: oai-hom-lab-aix-api-01
    note: "Provider-specific constraints are stored in provider schema files."
  hyperv_cluster:
    status: integrated
    pattern: "<tenant>-<environment>-<domain>-<role>-<idx>"
    examples:
      - hom-lab-ctl-hvh-01
      - hom-lab-ctl-hvh-02
    note: >-
      Hyper-V meaning belongs in NetBox cluster_type metadata. The cluster name
      stays on the compact baseline schema and may match the owning hvh device
      name because object type provides the disambiguation.
  diagram_canonical_id:
    status: integrated
    pattern: "<namespace>-<tenant>-<environment>-<domain>-dia-<name>-<idx>"
    examples:
      - cst-hom-lab-ctl-dia-gpu-topology-01
      - cst-hom-lab-ctl-dia-gpu-control-01
      - cst-hom-lab-ctl-dia-gpu-services-01
    use_for:
      - documentation diagrams under docs/diagrams/
    avoid_for:
      - hostnames
      - NetBox object names
    note: >-
      `dia` is a reserved diagram-family marker for documentation artifacts. It
      is intentionally kept in the identifier so diagram files are visually
      distinguishable from infrastructure object names and other canonical IDs.

integrated_host_examples:
  status: integrated
  note: "Current homelab inventory_hostname values; see live-object-registry.yml."
  hosts:
    - hom-lab-ctl-hvh-01
    - hom-lab-ctl-hvh-02
    - hom-lab-ctl-dkr-01
    - hom-lab-ctl-dkr-02
    - hom-lab-ctl-k3s-01
    - hom-lab-ctl-k3s-02

field_aliases:
  env: environment
  stage: domain
  role_code: role
  seq: idx
  sequence: idx
  ordinal: idx
  nn: idx
