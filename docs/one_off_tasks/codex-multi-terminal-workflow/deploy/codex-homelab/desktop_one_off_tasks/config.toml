# ONE-OFF TRIAL — source: docs/one_off_tasks/codex-multi-terminal-workflow/deploy/codex-homelab/
# Install: deploy/install_one_off_tasks.sh → ~/.codex-homelab/desktop_one_off_tasks/config.toml
# Isolated CODEX_HOME keeps desktop 14B out of the shared ~/.codex skill inventory.
# Select: cx-desktop  OR  codex-homelab_one_off_tasks desktop

model = "qwen2.5-coder-14b@desktop"
model_provider = "homelab-litellm"
model_catalog_json = "/Users/joshc/.codex/local-model-catalog_one_off_tasks.json"
model_reasoning_effort = "low"
model_context_window = 12000
model_auto_compact_token_limit = 10000
model_instructions_file = "/Users/joshc/.codex/instructions-implement_one_off_tasks.md"
web_search = "disabled"

[model_providers.homelab-litellm]
name = "Homelab LiteLLM"
base_url = "http://litellm.hom.lab/v1"
env_key = "LITELLM_API_KEY"
wire_api = "responses"
request_max_retries = 1
stream_max_retries = 1
stream_idle_timeout_ms = 120000
