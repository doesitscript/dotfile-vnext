                              . Cursor validates the model name against an internal list of known models, and any name that is not in that list gets rejected as Model Name is Invalid. The case sensitivity tip above won’t help. The issue isn’t the casing, it’s that a custom name from your LiteLLM proxy fails validation, even when you’re using your own API key.

We’re tracking this on our side, but we don’t have an exact ETA yet.

A workaround that sometimes works is to map your LiteLLM model to a model name that Cursor already recognizes, like gpt-4o or claude-sonnet-4, then call it by that name from Cursor. Not ideal, but it can bypass the validation.
