interface:
  display_name: "Storage Plan Implementer (Light Beta)"
  short_description: "Intake refined handoff; chunk and adapt into Ansible owners"
  default_prompt: "Use $storage-plan-implementer-light-beta: read the refined technical handoff as work instructions, chunk functional areas, implement into project Ansible owners, then hand the freeze to Evaluator."
policy:
  allow_implicit_invocation: false
orchestration:
  workflow_id: "evaluator-implementer-light-loop"
  role: "implementer"
  counterpart_role: "evaluator"
  stage_id: "implementation"
  invocation_model: "single-grouped-artifact-pass"
  required_inputs: ["project_root", "plan_dir"]
  optional_consultation_inputs: ["consultation_request_path", "consultation_expert_path", "consultation_research_path"]
  execution_contract: "../../../orchestration/implementation-beta-contract.md"
  runtime_adapter: "../../../runtime/run-implementation.ts"
  owns_approval: false
  owns_runtime: false
  owns_scheduler: false
