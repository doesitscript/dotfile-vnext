interface:
  display_name: "On-site Expert Consultation (Light)"
  short_description: "Resolve one bounded technical implementation fork"
  default_prompt: "Use $onsite-expert-consultation-light-beta for the supplied bounded consultation request."
policy:
  allow_implicit_invocation: false
orchestration:
  workflow_id: "resident-expert-researcher-sidecar"
  role: "onsite-expert-coordinator"
  counterpart_role: "researcher"
  stage_id: "implementation-consultation"
  invocation_model: "one-bounded-artifact-pass"
  required_inputs: ["project_root", "plan_dir", "consultation_request_path"]
  read_only: true
  owns_approval: false
  owns_runtime: false
  owns_scheduler: false
