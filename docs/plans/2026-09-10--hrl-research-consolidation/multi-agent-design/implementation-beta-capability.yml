discovery: Explicit absolute skill-file paths in launch prompts; no global or project-runtime installation required.
apply: Prefer paired-plan-orchestrator-beta on implementation-campaign; it runs the mature pair via multiagents and manages lifecycle. Manual role adapters remain available.
verify: Bun artifact, resume, policy and intake tests; real snapshot check; four skill validators; parent-orchestration-validation.md records isolated live proof. Actual infrastructure evidence belongs to later role passes.
undo: Revert only this adapter package's changes when requested; preserve upstream evidence and any implementation campaign outputs. This does not undo later infrastructure changes.
update_behavior: Preserve mature global roles, frozen snapshots and user work; update adapters, prompts, contract and tests together.
removal_behavior: Remove only owned adapter files and integration anchors when requested; do not delete campaign receipts, shared runtime services or source skills.
path_convention: owned_files relative to this manifest; integration_files relative to project root
