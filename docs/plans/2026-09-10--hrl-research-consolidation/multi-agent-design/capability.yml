id: phase-scoped-plan-preparation
status: trial
scope: current-phase-preparation-only
workflow_pattern: docs/codex_framework/multi-agent/agent-workflow-registry/patterns/phase-scoped-plan-preparation.md
owned_files:
  - multi-agent-onsite-expert/skill-drafts/phase-scoped-onsite-expert-coordinator-draft/SKILL.md
  - multi-agent-onsite-expert/skill-drafts/phase-scoped-onsite-expert-coordinator-draft/agents/openai.yaml
  - researchers/skill-drafts/phase-scoped-researcher-draft/SKILL.md
  - researchers/skill-drafts/phase-scoped-researcher-draft/agents/openai.yaml
  - agent-prompts/execution-contract.md
  - agent-prompts/onsite-expert-coordinator-draft-prompt.md
  - agent-prompts/researcher-draft-prompt.md
  - coordination-flow.mmd
  - runtime/
  - capability.yml
  - START-HERE.md
  - CURRENT-PHASE-PREPARATION-PLAN.md
  - runtime-validation-2026-09-10.md
  - validation-2026-09-11.md
integration_files:
  - docs/codex_framework/multi-agent/README.md
  - docs/codex_framework/multi-agent/agent-workflow-registry/README.md
  - docs/codex_framework/multi-agent/agent-workflow-registry/patterns/phase-scoped-plan-preparation.md
dependencies:
  - global-skills: multiagents-runtime-contract
  - global-skills: multiagents-runtime-operator
update_behavior: Preserve user changes and reviewed run artifacts; update owned skills, prompts, adapter and schema together, then validate and test a fresh run.
removal_behavior: Stop exact manifest-owned runs before removing this package; remove only its registry anchors and owned source files when explicitly requested. Preserve source plans, other roles and evidence by default.
apply: bun run runtime/run-preparation.ts /absolute/config.json
verify: Validate both skills and adapter tests, then run the same roles on a read-only source plan with isolated generated outputs and independent hash-bound review.
undo: Stop the named run through its owner manifest; retain evidence and offer cleanup of exact disposable paths. Revert only this package's owned changes when requested.
change_class: controller-local workflow and bootstrap runtime
path_convention: owned_files relative to this manifest; integration_files relative to project root
