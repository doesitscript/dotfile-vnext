interface:
  display_name: "Research-to-decision Synthesizer (Beta)"
  short_description: "Turn Expert research into bounded planning packets"
  default_prompt: "Use $research-to-decision-synthesizer-beta to classify the nominated Expert research document for the supplied campaign."
policy:
  allow_implicit_invocation: false
# Project integration metadata, not a native scheduler.
orchestration:
  workflow_id: "guided-research-application"
  role: "research-synthesizer"
  counterpart_roles: ["onsite-expert", "planner-coordinator"]
  stage_id: "planning"
  invocation_model: "bounded-artifact-pass"
  read_only: true
  owns_approval: false
  owns_runtime: false
  owns_scheduler: false
