interface:
  display_name: "Researcher Consultation (Light)"
  short_description: "Verify evidence for one bounded Expert recommendation"
  default_prompt: "Use $researcher-consultation-light-beta for the supplied Expert consultation and request."
policy:
  allow_implicit_invocation: false
orchestration:
  workflow_id: "resident-expert-researcher-sidecar"
  role: "researcher"
  counterpart_role: "onsite-expert-coordinator"
  stage_id: "implementation-consultation"
  invocation_model: "one-bounded-artifact-pass"
  required_inputs: ["project_root", "plan_dir", "consultation_request_path", "coordinator_output_path"]
  read_only: true
  owns_approval: false
  owns_runtime: false
  owns_scheduler: false
