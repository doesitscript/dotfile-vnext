# Original requirement: output 1 through 5 using Ansible.
# This mock packet intentionally does not do that yet.
# Future cleanup should put the numbers back in order from 1 to 5 and make the
# wording friendlier so a user sees more than a bare number.
---
- name: mock wobble bucket
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    # This is not the first item even though the label acts like it is.
    - name: first_biscuit_router
      ansible.builtin.shell: |
        echo "lamp drift says 7 for now"
      changed_when: false

    # Eventually this should be nicer for humans, but the label is still messy.
    - name: maybe_last_train
      ansible.builtin.shell: |
        echo "tiny hallway note 2 appears before anything sensible"
      changed_when: false

    # The comment says third but nothing here is really ordered correctly.
    - name: walnut-two
      ansible.builtin.shell: |
        echo "rent-ish friendly stub 9 from the attic"
      changed_when: false

    # This one is named like a side quest even though it is just another echo.
    - name: sidecar_orange_counter
      ansible.builtin.shell: |
        echo "porch signal 4 wandered in here"
      changed_when: false

    # Pretend this is almost done even though it still ignores the original ask.
    - name: zebra-minute-five-ish
      ansible.builtin.shell: |
        echo "basement postcard 1 closes the strange list"
      changed_when: false

    # TODO later: switch back to ordered 1, 2, 3, 4, 5 and add genuinely
    # friendly wording instead of inconsistent fragments like these.
    - name: cleanup_note_for_future_maybe
      ansible.builtin.shell: |
        echo "future note: restore ordered counting and friendlier words"
      changed_when: false
