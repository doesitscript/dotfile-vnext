node_default_version: "20"
npm_global_packages: []

work_laptop_codex_cli_state: present

codex_user_config_state: present
codex_user_config_model: "gpt-5.4"
codex_user_config_model_reasoning_effort: "high"
codex_user_config_approval_policy: "never"
codex_user_config_memories: true
codex_user_config_shell_snapshot: true
codex_user_config_desktop_conversation_detail_mode: "STEPS_COMMANDS"
codex_user_config_desktop_ambient_suggestions_enabled: false
codex_user_config_desktop_follow_up_queue_mode: "queue"

codex_homelab_profiles_state: present
codex_homelab_profiles_multi_terminal_state: present
codex_homelab_profiles_model: "ministral-3-8b"
codex_homelab_profiles_context_window: 24000

vscode_extensions:
  - Continue.continue
  - saoudrizwan.claude-dev
  - openai.chatgpt
  - hashicorp.terraform
  - redhat.ansible
  - redhat.vscode-yaml
  - kilocode.kilo-code

# cx-* wrappers: work laptop repos live under Documents/develop (not ~/develop).
codex_homelab_profiles_develop_root: "{{ ansible_env.HOME }}/Documents/develop"
codex_homelab_profiles_repo_primary: "{{ codex_homelab_profiles_develop_root }}/work-laptop-ai-tools"
codex_homelab_profiles_repo_skills: "{{ codex_homelab_profiles_develop_root }}/global-skills"
codex_homelab_profiles_repo_research: "{{ codex_homelab_profiles_develop_root }}/homelab-reference-library"

terraform_cli_state: present

terraform_mcp_state: present
terraform_mcp_targets:
  - codex
terraform_mcp_codex_config_path: "{{ ansible_env.HOME }}/.codex/config.toml"

aws_mcp_state: present
aws_mcp_targets:
  - codex
aws_mcp_codex_config_path: "{{ ansible_env.HOME }}/.codex/config.toml"

aws_iac_mcp_state: present
aws_iac_mcp_targets:
  - codex
aws_iac_mcp_codex_config_path: "{{ ansible_env.HOME }}/.codex/config.toml"
aws_iac_mcp_aws_region: "us-east-1"
# When non-empty, Continue AWS IaC MCP env sets AWS_PROFILE (SSO/login still operator-run).
aws_iac_mcp_aws_profile: ""
# Prefer Homebrew uv path so Continue never gets an empty command (inbox/config.yaml bug).
aws_iac_mcp_command: "/opt/homebrew/opt/uv/bin/uvx"


# ---------------------------------------------------------------------------
# MCP catalog. Commissioned clients for this slice (NOT VS Code native MCP):
#   - Continue extension (~/.continue/config.yaml via continue_ide_mcp_servers)
#   - Cline extension (~/.cline via cline_ide_mcp_servers; mirrors Continue list)
#   - Codex CLI + Codex VS Code extension (~/.codex/config.toml via *_targets: [codex])
# Remaining catalog entries stay absent. Do not add vscode to *_targets.
# ---------------------------------------------------------------------------
work_laptop_mcp_env_dir: "{{ ansible_env.HOME }}/.config/work-laptop-ai-tools/mcp/env.d"
work_laptop_mcp_vault_file: "{{ playbook_dir }}/vault/shared.vault.yml"
work_laptop_mcp_codex_config_path: "{{ ansible_env.HOME }}/.codex/config.toml"
work_laptop_nvm_exec: "{{ playbook_dir }}/bin/work-laptop-nvm-exec"

ripgrep_cli_state: present

context7_mcp_state: present
context7_mcp_targets: [codex]
context7_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
context7_mcp_env_file_path: "{{ work_laptop_mcp_env_dir }}/context7.env"
context7_mcp_wrapper_path: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
context7_mcp_vault_file_path: "{{ work_laptop_mcp_vault_file }}"

firecrawl_mcp_state: absent
firecrawl_mcp_targets: [codex]
firecrawl_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
firecrawl_mcp_env_file_path: "{{ work_laptop_mcp_env_dir }}/firecrawl.env"
firecrawl_mcp_wrapper_path: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
firecrawl_mcp_vault_file_path: "{{ work_laptop_mcp_vault_file }}"

morph_mcp_state: present
morph_mcp_targets: [codex]
morph_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
morph_mcp_env_file_path: "{{ work_laptop_mcp_env_dir }}/morph.env"
morph_mcp_wrapper_path: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
morph_mcp_vault_file_path: "{{ work_laptop_mcp_vault_file }}"
# WarpGrep habit layer: Continue user rules + packet AGENTS.md. Skip Cursor /
# Copilot project files and VS Code native mcp.json on this slice.
morph_mcp_continue_enabled: true
morph_mcp_continue_rule_path: "{{ ansible_env.HOME }}/.continue/rules/morph-warpgrep-evaluation.md"
morph_mcp_routing_enable_agents_md: true
morph_mcp_routing_enable_codex_explorer: false
morph_mcp_routing_enable_codex_default: false
morph_mcp_routing_enable_codex_worker: false
morph_mcp_routing_enable_cursor_rule: false
morph_mcp_routing_enable_copilot_instructions: false

playwright_mcp_state: absent
playwright_mcp_targets: [codex]
playwright_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

fetch_mcp_state: absent
fetch_mcp_targets: [codex]
fetch_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

firebase_mcp_state: present
firebase_mcp_targets: [codex]
firebase_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
firebase_mcp_env_file_path: "{{ work_laptop_mcp_env_dir }}/firebase.env"
firebase_mcp_wrapper_path: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
firebase_mcp_vault_file_path: "{{ work_laptop_mcp_vault_file }}"
firebase_mcp_credentials_file_path: "{{ ansible_env.HOME }}/.config/work-laptop-ai-tools/mcp/credentials/firebase-service-account.json"

drawio_mcp_state: absent
drawio_mcp_targets: [codex]
drawio_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
drawio_mcp_codex_wrapper_path: "{{ playbook_dir }}/bin/drawio-mcp-codex-stdio-wrapper.js"

netbox_mcp_state: absent
netbox_mcp_targets: [codex]
netbox_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
# Literal URL so role arg-spec/defaults never touch parent hostvars on this packet.
netbox_mcp_url: "http://netbox.hom.lab:8000"

openai_docs_mcp_state: absent
openai_docs_mcp_targets: [codex]
openai_docs_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

langfuse_docs_mcp_state: absent
langfuse_docs_mcp_targets: [codex]
langfuse_docs_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

huggingface_mcp_state: absent
huggingface_mcp_targets: [codex]
huggingface_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

# Roles without native present|absent — playbook uses when: on these flags.
mcp_sysoperator_state: absent
mcp_sysoperator_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
mcp_sysoperator_project_dir: "{{ ansible_env.HOME }}/.vscode"

redhat_ansible_mcp_state: absent
redhat_ansible_project_dir: "{{ ansible_env.HOME }}/.vscode"
redhat_ansible_workspace_root: "{{ playbook_dir }}"

# Permanent stability policy as of 2026-09-02:
# - do not enable editor autocomplete against remote LiteLLM, vLLM, or remote Ollama lanes
# - do not enable Zed edit predictions against remote infrastructure
# - only revisit autocomplete/predictions with a deliberately local-only small model on this Mac
# zetbrush/multiagents (Bun + CLI). Peer MCP is wired into Continue below.
# Operator still runs `multiagents setup` / broker once after first install.
multiagents_tooling_version_contract:
  cli: "0.5.0"
  bun: "1.4.0"
multiagents_state: present
multiagents_root_dir: "{{ ansible_env.HOME }}/.config/work-laptop-ai-tools/multiagents"
multiagents_data_dir: "{{ multiagents_root_dir }}/data"
multiagents_scenarios_dir: "{{ multiagents_root_dir }}/scenarios"
multiagents_layout_readme_path: "{{ multiagents_root_dir }}/README.md"
multiagents_usage_note_path: "{{ ansible_env.HOME }}/.config/work-laptop-ai-tools/ai/tool-guides/multiagents.md"
multiagents_continue_peer_agent_type: custom

# Jan desktop local RAG. Document source is the work-laptop HRL checkout.
# Do not point this at ~/develop or the HVH public share.
jan_ide_state: present
jan_ide_rag_corpus_path: "{{ ansible_env.HOME }}/Documents/develop/homelab-reference-library"
jan_ide_local_models_path: "{{ ansible_env.HOME }}/models"
jan_ide_chat_model_repo: Qwen/Qwen3-4B-GGUF
jan_ide_chat_model_file: Qwen3-4B-Q4_K_M.gguf
jan_ide_chat_model_relpath: huggingface/Qwen--Qwen3-4B-GGUF/Qwen3-4B-Q4_K_M.gguf

continue_ide_state: present
continue_ide_api_key: ""
continue_ide_require_api_key: true
continue_ide_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
# Local DMR/llama.cpp autocomplete is allowed; remote LiteLLM/vLLM autocomplete stays blocked.
continue_ide_autocomplete_enabled: true
# Pin firebase-tools for Continue MCP (sibling 2026-09-10); use nvm-exec, not npx@latest.
continue_ide_provision_firebase_cli: true
continue_ide_firebase_tools_version: "15.30.0"
continue_ide_models:
  # Primary local chat — Qwen3-Coder AWQ on 5090 (sequential with Qwen3.6).
  - name: "Chat Qwen3-Coder-30B-A3B (5090 vLLM)"
    model: "qwen3-coder-30b-a3b"
    capabilities:
      - tool_use
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      # Leave headroom: input + maxTokens must stay <= 32768 (inbox 2026-09-12).
      maxTokens: 4096
      temperature: 0.7
      topP: 0.8
  - name: "Chat Qwen3.6-35B-A3B (pending sequential vLLM)"
    model: "qwen3.6-35b-a3b"
    enabled: false
    capabilities:
      - tool_use
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.6
      topP: 0.95
  # Edit/apply via LiteLLM — aligned with ai_cli_apps.yml (14B edit, 7B apply).
  - name: "qwen2.5-coder:14b"
    model: "qwen2.5-coder-14b"
    roles:
      - edit
    default_completion_options:
      contextLength: 12000
      maxTokens: 4096
      temperature: 0.2
  - name: "qwen2.5-coder:7b"
    model: "qwen2.5-coder-7b"
    roles:
      - apply
    default_completion_options:
      contextLength: 12000
      maxTokens: 4096
      temperature: 0.2
  - name: "qwen2.5-coder:1.5b-base-q8_0"
    model: "qwen2.5-coder-1.5b-base-q8_0"
    enabled: "{{ continue_ide_autocomplete_enabled | bool }}"
    roles:
      - autocomplete
    use_legacy_completions_endpoint: true
    default_completion_options:
      contextLength: 12768
      maxTokens: 256
      temperature: 0.0
  - name: "nomic-embed-text"
    model: "nomic-embed-text"
    roles:
      - embed
  - name: "gpt-oss:20b"
    model: "gpt-oss-20b"
    roles:
      - chat
    default_completion_options:
      contextLength: 131072
      maxTokens: 8192
      temperature: 1.0
      topP: 0.95
  # Optional public Gemini lanes (same as parent continue_ide defaults / mac Continue example).
  - name: "Gemini 2.5 Flash (Daily Driver)"
    model: "gemini-2.5-flash"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 8192
      temperature: 0.3
  - name: "Gemini 2.5 Flash (Long Context 1M)"
    model: "gemini-2.5-flash-long-context"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 8192
      temperature: 0.3
  - name: "Gemini 2.5 Pro (Deep Reasoning)"
    model: "gemini-2.5-pro"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 8192
      temperature: 0.2
  - name: "Gemini 2.5 Flash Lite (Bulk)"
    model: "gemini-2.5-flash-lite"
    roles:
      - chat
    default_completion_options:
      contextLength: 1048576
      maxTokens: 4096
      temperature: 0.3
# Docker Model Runner — Continue may point at a local DMR API; Ansible install
# automation stays DISABLED until commissioned.
# Docs: DOCKER-MODEL-RUNNER.md ; examples: helpers/docker-model-runner/examples/
# Jan / Ollama Continue recipes live in parent docs only (not deployed here):
# docs/brainstorming_designs/2026-09-09--continue-mac-local-model-patterns/
# docs/lessons-learned/continue/jan-and-ollama-local-autocomplete.md
work_laptop_docker_model_runner_enabled: false
work_laptop_docker_model_runner_automation: disabled

# Sole Continue autocomplete owner: LiteLLM gateway qwen2.5-coder-1.5b-base-q8_0
# above (HVH-01 Ollama GGUF). Do not assign autocomplete to a second model —
# Continue docs + laptop 2026-09-12: dual autocomplete roles break Tab-complete.
# DMR entry kept as a catalog alternate with roles: [] (no Jan / Ollama).
# Edit/apply stay on LiteLLM above.
continue_ide_local_models:
  - name: "Qwen 2.5 Coder 1.5B (Docker Model Runner — alternate, no role)"
    provider: "openai"
    api_base: "http://127.0.0.1:12434/engines/llama.cpp/v1"
    api_key: "docker-model-runner"
    model: "local/qwen2.5-coder-autocomplete:1.5b-q8_0"
    roles: []
    default_completion_options:
      contextLength: 8192
      maxTokens: 128
      temperature: 0.1
  - name: "Nomic Embed Text (LM Studio Embeddings)"
    provider: "openai"
    api_base: "http://127.0.0.1:1234/v1"
    api_key: "lm-studio"
    model: "continue-nomic-embed"
    # Inbox 2026-09-12: keep as inactive evaluation inventory; gateway
    # nomic-embed-text owns the sole embed role while LM Studio is compared.
    enabled: false
    roles:
      - embed
# Legacy alias for continue_ide template; must stay empty (no provider:ollama).
continue_ide_ollama_local_models: []
continue_ide_mcp_servers:
  - name: "Terraform MCP"
    type: "stdio"
    command: "{{ ansible_env.HOME }}/.local/bin/terraform-mcp-server"
    args:
      - "stdio"
  - name: "AWS MCP"
    type: "streamable-http"
    # Inbox 2026-09-10: base URL initializes (200 + Mcp-Session-Id); ?oauth=initialize
    # returned a bearer challenge on direct initialize and is not the working candidate.
    url: "https://aws-mcp.us-east-1.api.aws/mcp"
  - name: "AWS IaC MCP"
    type: "stdio"
    # Pin package (laptop 2026-09-10); omit AWS_REGION by default (working consumer config).
    command: "{{ aws_iac_mcp_command | default('/opt/homebrew/opt/uv/bin/uvx') }}"
    args:
      - "awslabs.aws-iac-mcp-server@1.0.26"
    env: "{{ {'FASTMCP_LOG_LEVEL': 'ERROR'} | combine(({'AWS_PROFILE': aws_iac_mcp_aws_profile}) if ((aws_iac_mcp_aws_profile | default('') | length) > 0) else {}) }}"
  - name: context7
    type: stdio
    command: "{{ work_laptop_nvm_exec }}"
    args:
      - context7-mcp
  - name: firebase
    type: stdio
    command: "{{ work_laptop_nvm_exec }}"
    args:
      - firebase
      - mcp
  # WarpGrep: do not list continue_ide_rules for morph — morph role drops
  # ~/.continue/rules/morph-warpgrep-evaluation.md (Continue loads it).
  - name: morph-mcp
    type: stdio
    command: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
    args:
      - "{{ work_laptop_mcp_env_dir }}/morph.env"
      - "{{ work_laptop_nvm_exec }}"
      - morph-mcp
    env:
      WORKSPACE_MODE: "true"
      # Prefer npm global + ~/.local/bin; do not dump full GUI PATH from inbox.
      PATH: "{{ ansible_env.HOME }}/.npm-packages/bin:{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  # zetbrush/multiagents peer MCP (requires multiagents_state=present + Bun).
  # Agent types are claude|codex|gemini|custom; Continue uses custom (ClaudeAdapter).
  - name: multiagents-peer
    type: stdio
    command: "{{ multiagents_bun_install_dir | default(ansible_env.HOME ~ '/.bun/bin') }}/multiagents"
    args:
      - mcp-server
      - --agent-type
      - "{{ multiagents_continue_peer_agent_type | default('custom') }}"
    env:
      PATH: "{{ multiagents_bun_install_dir | default(ansible_env.HOME ~ '/.bun/bin') }}:{{ ansible_env.PATH }}"
continue_ide_blocked_lanes:
  - "qwen2.5-coder-14b (undersized for 5090 — prefer qwen3-coder-30b-a3b)"
  - "qwen2.5-coder-32b (replaced 2026-09-10 by qwen3-coder-30b-a3b)"
  - "Remote autocomplete disabled on 2026-09-02 due editor and remote-backend stability risk; only revisit with a local-only model on this Mac."

# Cline (saoudrizwan.claude-dev) — same LiteLLM lanes as Continue; baseUrl includes /v1.
cline_ide_state: present
cline_ide_api_key: ""
cline_ide_require_api_key: true
cline_ide_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
cline_ide_gateway_api_base: "http://litellm.hom.lab/v1"
cline_ide_model: "{{ ai_cli_default_chat_model | default('qwen3-coder-30b-a3b') }}"
# Sampling defaults live in roles/cline_ide — override only when needed.
cline_ide_default_max_output_tokens: 4096
cline_ide_default_temperature: 0.7
cline_ide_default_top_p: 0.8
cline_ide_models:
  - name: "Chat Qwen3-Coder-30B-A3B (5090 vLLM)"
    model: "qwen3-coder-30b-a3b"
    roles:
      - chat
      - agent
    context_window: 32768
    max_output_tokens: 4096
    temperature: 0.7
    top_p: 0.8
    capabilities:
      - streaming
      - tools
  - name: "Chat Qwen3.6-35B-A3B (pending sequential)"
    model: "qwen3.6-35b-a3b"
    enabled: false
    roles:
      - chat
      - agent
    context_window: 32768
    max_output_tokens: 4096
    temperature: 0.6
    top_p: 0.95
