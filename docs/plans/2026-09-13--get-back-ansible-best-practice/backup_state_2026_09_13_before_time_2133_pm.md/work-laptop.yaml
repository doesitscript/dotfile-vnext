node_role: work-laptop-ai-tools
node_purpose: interactive_desktop
management_boundary: user_managed
authority_level: non-authoritative
outbound_only: true
os: macOS

work_laptop_packet_scope:
  - hosts_file
  - codex_cli
  - codex_user_config
  - codex_profiles
  - terraform_cli
  - aws_iac_mcp
  - vscode_mcp
  - vscode_continue
  - vscode_cline
  - zed_ide
  - jan_ide
  - opencode_cli
  - kilo_ide
  - aider
  - ai_cli_apps

# Labels for AI CLI / IDE client grouping (see inventory/group_vars/all/ai_cli_apps.yml).
ai_cli_apps_labels:
  - ai-cli-apps
  - litellm-clients
  - openai-compatible-edge

