cline_ide_mcp_servers: "{{ continue_ide_mcp_servers }}"

# Cline terminal CLI (npm package `cline`). Models/MCP owned by cline_ide.
# Transform vs home Mac: work laptop keeps node_default_version=20 for other
# tools; cline_cli installs Node 24 via nvm without changing that default.
# npm globals may land under ~/.npmrc prefix — role resolves `npm prefix -g`.
cline_cli_state: present
cline_cli_node_version: "24"

# ansible-dev-tools (Red Hat meta-package) requires Python >=3.10.
# The work laptop packet venv runs Python 3.9.6 (macOS system Python).
# Ansible core is already installed via scripts/requirements.txt in bootstrap.
# Override to only the libraries that are compatible and useful on Python 3.9.
ansible_dev_tools_pip_packages:
  - pynetbox
  - pytz

# --- opencode CLI ---
opencode_cli_state: present
opencode_cli_default_model: "{{ ai_cli_opencode_default_model | default('litellm/qwen3-coder-30b-a3b') }}"
# Prefer role defaults (SSOT-aligned). Keep packet overrides only when needed.
# opencode_cli_models inherited from roles/opencode_cli/defaults when unset.
opencode_cli_mcp_context7_enabled: true
opencode_cli_mcp_firecrawl_enabled: true

# --- aider ---
aider_state: present
aider_default_model: "{{ ai_cli_aider_default_model | default('openai/qwen3-coder-30b-a3b') }}"
aider_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
aider_pipx_python: "/opt/homebrew/bin/python3.12"
aider_dirty_commits: true
aider_suggest_shell_commands: false
aider_yes_always: true
aider_map_tokens: 2048
aider_map_refresh: files
aider_deploy_repo_ignore: true
aider_mcp_context7_enabled: true
aider_mcp_firecrawl_enabled: true

# --- Kilo IDE ---
# merge (default): convert config.json→kilo.jsonc once; merge managed slices;
# do not wipe user MCP/custom agents. Use overwrite only for recovery.
kilo_ide_state: present
kilo_ide_apply_mode: merge
kilo_ide_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
kilo_ide_default_model: "{{ ai_cli_kilo_default_model | default('litellm/qwen3-coder-30b-a3b') }}"
kilo_ide_small_model: "{{ ai_cli_kilo_small_model | default('litellm/qwen2.5-coder-7b') }}"
kilo_ide_default_agent: "code"
# kilo_ide_models / kilo_ide_agents inherited from role defaults (SSOT-aligned).

# --- morph MCP ---
morph_mcp_state: present
morph_mcp_targets:
  - cursor_user
  - vscode
  - codex
# Use HOME-scoped paths so the server is available globally, not just in the packet root.
morph_mcp_vscode_config_path: "{{ ansible_env.HOME }}/.vscode/mcp.json"
morph_mcp_cursor_user_config_path: "{{ ansible_env.HOME }}/.cursor/mcp.json"
# Disable project-routing markers — they target dotfile-vnext files, not the packet.
morph_mcp_routing_enable_agents_md: false
morph_mcp_routing_enable_codex_explorer: false
morph_mcp_routing_enable_codex_default: false
morph_mcp_routing_enable_codex_worker: false
morph_mcp_routing_enable_cursor_rule: false
morph_mcp_routing_enable_copilot_instructions: false
morph_mcp_continue_enabled: false

# --- context7 MCP ---
context7_mcp_state: present
context7_mcp_targets:
  - vscode
  - codex
context7_mcp_vscode_config_path: "{{ ansible_env.HOME }}/.vscode/mcp.json"
# Override vault path to the packet vault (packet has no mac_dev.vault.yml).
context7_mcp_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"

# --- firecrawl MCP ---
firecrawl_mcp_state: present
firecrawl_mcp_targets:
  - vscode
  - codex
firecrawl_mcp_vscode_config_path: "{{ ansible_env.HOME }}/.vscode/mcp.json"
# Override vault path to the packet vault.
firecrawl_mcp_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"

