# Concurrent editing note: Codex owns this profile template; Cursor should not rewrite it.
# Direct profile template. The launcher uses the lean isolated desktop home in
# desktop-isolated-home.config.toml; use this only for an explicit --profile run.
# Keep the gateway secret out of this file; provide it through LITELLM_API_KEY.

model = "qwen2.5-coder-14b@desktop"
model_provider = "homelab-litellm"
model_catalog_json = "/Users/joshc/.codex/local-model-catalog.json"
model_reasoning_effort = "low"
model_context_window = 12000
model_auto_compact_token_limit = 10000
model_instructions_file = "/Users/joshc/.codex/local-model-instructions.md"
web_search = "disabled"

[model_providers.homelab-litellm]
name = "Homelab LiteLLM"
base_url = "http://litellm.hom.lab/v1"
env_key = "LITELLM_API_KEY"
wire_api = "responses"
request_max_retries = 1
stream_max_retries = 1
stream_idle_timeout_ms = 120000
