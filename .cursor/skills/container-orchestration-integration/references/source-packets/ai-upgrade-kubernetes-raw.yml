      - NAMING_POLICY.md
  - id: ai_upgrade_002
    source_lines: "47-105"
    primary_domain: ansible
    summary: Use a layered execution model covering NetBox inventory, node bootstrap, cluster services, and host-level Docker services.
    source_terms:
      - roles/base-node
      - roles/docker-host
      - roles/k8s-node
      - roles/k8s-core
      - roles/k8s-apps-*
      - roles/traefik
  - id: ai_upgrade_003
    source_lines: "149-191"
    primary_domain: ansible
    summary: Prefer declarative Ansible modules over shell, including kubernetes.core and community.docker modules.
    source_terms:
