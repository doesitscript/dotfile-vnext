items:
  - id: ai_upgrade_001
    source_lines: "5-40"
    primary_domain: ansible
    summary: Introduce a top-level README plus separate policy files for Ansible, Kubernetes, Docker, NetBox, and naming.
    source_terms:
      - README.md
      - ARCHITECTURE.md
      - policy/ANSIBLE_POLICY.md
      - policy/KUBERNETES_POLICY.md
      - policy/DOCKER_POLICY.md
