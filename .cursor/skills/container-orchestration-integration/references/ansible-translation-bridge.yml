packet_id: ansible-translation-bridge
packet_kind: bridge_packet
status: active
primary_domain: ansible
repo_authorities:
  - AGENTS.md
  - .cursor/rules/ansible-knowledge-gate.mdc
  - .cursor/rules/framework-partner-process.mdc
  - .cursor/rules/framework-project-maturity-router.mdc
  - inventory/inventory.yaml
  - roles/automation_awx/README.md

translation_rules:
  - Preserve capability-focused playbook composition instead of importing a new top-level policy tree.
  - Preserve repo-first role, playbook, naming, and lifecycle interfaces when imported guidance uses generic examples.
  - Keep Docker and K3s as separate runtime lanes even when imported guidance treats them as neighboring folders in one idealized tree.
  - Use repo gates and knowledge receipts rather than copying source note prose into active policy.

settled_decisions:
  - imported_items:
      - ai_upgrade_001
      - ai_upgrade_013
    outcome: >
      Capture imported structure as a removable capability family and packet set
      instead of creating a new competing `policy/` tree or generic repo
      layout.
  - imported_items:
      - ai_upgrade_003
      - ai_upgrade_004
      - ai_upgrade_012
    outcome: >
      Imported module preference, composable roles, and AI-generation
      constraints are accepted through existing Ansible and framework rule
      surfaces.

future_alignment_paths:
  - id: awx_alignment_path
    paths:
      - roles/automation_awx/README.md
      - roles/automation_awx/tasks/present.yml
      - roles/automation_awx/tasks/absent.yml
    note: >
      AWX stays as a future replacement/alignment path and is not active cleanup
      scope for this capability slice.
