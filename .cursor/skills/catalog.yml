version: 1

discovery_order:
  - .cursor/skills/catalog.yml
  - per-skill capability.yml
  - per-skill SKILL.md
  - companion rule files
  - docs/codex_framework/*

skills:
  - name: ansible-coordinator
    family: ansible
    status: legacy-skill-only
    skill_file: .cursor/skills/ansible-coordinator/SKILL.md
    summary: Planning session coordinator. Dispatches planner, researcher, and observer specialists in parallel and synthesizes their outputs into one integrated response.
  - name: ansible-maturity-observer
    family: ansible
    status: legacy-skill-only
    skill_file: .cursor/skills/ansible-maturity-observer/SKILL.md
    summary: Readonly subagent invoked by the planner or coordinator at lock-in points. Reviews Ansible artifacts in scope and appends lightweight maturity tags to plan outputs.
  - name: ansible-planner
    family: ansible
    status: legacy-skill-only
    skill_file: .cursor/skills/ansible-planner/SKILL.md
    summary: Plan architecture moments and refine implementation shape into a durable plan.
  - name: ansible-researcher
    family: ansible
    status: legacy-skill-only
    skill_file: .cursor/skills/ansible-researcher/SKILL.md
    summary: Research novel or under-grounded topics before planning or execution continues.
  - name: archive-conversation-context
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/archive-conversation-context/SKILL.md
    summary: Save provided conversation text into durable dated repo notes.
  - name: capture-wsl-systemctl
    family: ansible
    status: legacy-skill-only
    skill_file: .cursor/skills/capture-wsl-systemctl/SKILL.md
    summary: Capture WSL systemctl state for diagnostics and documentation.
  - name: generate-mcp-briefing
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/generate-mcp-briefing/SKILL.md
    summary: Refresh the repo-local MCP briefing from current tool surfaces.
  - name: generate-project-state-report
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/generate-project-state-report/SKILL.md
    summary: Build a durable project-state report from active repo surfaces.
  - name: github-issue-workflow
    family: github
    status: manifest-backed
    skill_file: .cursor/skills/github-issue-workflow/SKILL.md
    capability_file: .cursor/skills/github-issue-workflow/capability.yml
    summary: Turn concrete brainstorming or resumable work into single-repo or multi-repo durable GitHub issue sets.
  - name: grouped-git-commits
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/grouped-git-commits/SKILL.md
    summary: Stage and commit current work in coherent groups.
  - name: register-doc-sources
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/register-doc-sources/SKILL.md
    summary: Register repo documentation sources for later use.
  - name: sanitize-envrc
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/sanitize-envrc/SKILL.md
    summary: Clean `.envrc` content into a safer and more portable form.
  - name: zip-project-root
    family: framework
    status: legacy-skill-only
    skill_file: .cursor/skills/zip-project-root/SKILL.md
    summary: Create a zip archive of the project root.
