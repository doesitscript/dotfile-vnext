name: example-skill
family: framework
kind: skill
portable: true

summary: One-line machine-readable summary of the capability.

capabilities:
  - example_capability
  - another_capability

suggested_roles:
  - planner_steward

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/example-skill/SKILL.md
readme_file: .cursor/skills/example-skill/README.md

companion_rules:
  - .cursor/rules/framework-example-skill.mdc

references:
  - .cursor/skills/example-skill/references/examples.md

owned_files:
  - .cursor/skills/example-skill/SKILL.md
  - .cursor/skills/example-skill/README.md
  - .cursor/skills/example-skill/capability.yml
  - .cursor/skills/example-skill/references/examples.md
  - .cursor/rules/framework-example-skill.mdc

update_behavior:
  strategy: replace-owned-files
  notes: Re-dropping an updated skill should replace the files listed under owned_files unless the repo intentionally forks the capability.

removal_behavior:
  strategy: remove-owned-files
  notes: Start removal from owned_files so companion rules and examples are not orphaned.
