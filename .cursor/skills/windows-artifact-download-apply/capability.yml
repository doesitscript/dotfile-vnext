name: windows-artifact-download-apply
family: ansible
kind: skill
portable: false

summary: >-
  Pin and apply large Windows HTTP(S) artifacts via windows_artifact_download
  (resume, checksum, async) instead of temp curl playbooks.

capabilities:
  - windows_artifact_contract
  - large_setup_exe_download
  - anti_tmp_download_playbook

suggested_roles:
  - executor
  - planner

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/windows-artifact-download-apply/SKILL.md

references:
  - .cursor/skills/windows-artifact-download-apply/scripts/print_artifact_contract.py
  - roles/windows_artifact_download/README.md

owned_files:
  - .cursor/skills/windows-artifact-download-apply/SKILL.md
  - .cursor/skills/windows-artifact-download-apply/capability.yml
  - .cursor/skills/windows-artifact-download-apply/README.md
  - .cursor/skills/windows-artifact-download-apply/references/contract.md
  - .cursor/skills/windows-artifact-download-apply/references/related-artifacts.md
  - .cursor/skills/windows-artifact-download-apply/scripts/print_artifact_contract.py

update_behavior:
  strategy: replace-owned-files

removal_behavior:
  strategy: remove-owned-files
