name: github-issue-workflow
family: github
kind: skill
portable: true

summary: Turn concrete brainstorming, resumable work, and durable follow-ups into GitHub issue tracking.

capabilities:
  - github_issue_create
  - github_issue_update
  - github_issue_close
  - issue_label_schema
  - repo_backlink_guidance

suggested_roles:
  - planner_steward
  - researcher
  - executor

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/github-issue-workflow/SKILL.md
readme_file: .cursor/skills/github-issue-workflow/README.md

companion_rules:
  - .cursor/rules/framework-github-issue-workflow.mdc

references:
  - .cursor/skills/github-issue-workflow/references/examples.md

owned_files:
  - .cursor/skills/github-issue-workflow/SKILL.md
  - .cursor/skills/github-issue-workflow/README.md
  - .cursor/skills/github-issue-workflow/capability.yml
  - .cursor/skills/github-issue-workflow/references/examples.md
  - .cursor/rules/framework-github-issue-workflow.mdc

update_behavior:
  strategy: replace-owned-files
  notes: Re-dropping an updated version of this skill should replace the files listed under owned_files so the companion rule and examples stay aligned.

removal_behavior:
  strategy: remove-owned-files
  notes: Start removal from owned_files so the skill folder and companion rule are removed together.
