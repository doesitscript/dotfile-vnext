name: ansible-knowledge-gate
family: ansible
kind: skill
portable: false

summary: Require repo and Ansible authority checks before Ansible design or implementation.

capabilities:
  - ansible_authority_gate
  - ansible_module_discovery
  - ansible_knowledge_receipt
  - ansible_validation_planning

suggested_roles:
  - planner_steward
  - researcher
  - executor

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/ansible-knowledge-gate/SKILL.md
readme_file: .cursor/skills/ansible-knowledge-gate/README.md

companion_rules:
  - .cursor/rules/ansible-knowledge-gate.mdc

references:
  - .cursor/skills/ansible-knowledge-gate/references/knowledge-receipt.md

owned_files:
  - .cursor/skills/ansible-knowledge-gate/SKILL.md
  - .cursor/skills/ansible-knowledge-gate/README.md
  - .cursor/skills/ansible-knowledge-gate/capability.yml
  - .cursor/skills/ansible-knowledge-gate/references/knowledge-receipt.md
  - .cursor/rules/ansible-knowledge-gate.mdc

update_behavior:
  strategy: replace-owned-files
  notes: Update the skill and companion rule together so enforcement and workflow stay aligned.

removal_behavior:
  strategy: remove-owned-files
  notes: Remove the files listed in owned_files and the catalog entry together.
