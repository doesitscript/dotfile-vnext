name: netbox-knowledge-gate
family: netbox
kind: skill
portable: false

summary: Require repo and NetBox authority checks before NetBox modeling or source-of-truth changes.

capabilities:
  - netbox_authority_gate
  - netbox_modeling_gate
  - netbox_knowledge_receipt
  - nb_inventory_design_check

suggested_roles:
  - planner_steward
  - researcher
  - executor

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/netbox-knowledge-gate/SKILL.md
readme_file: .cursor/skills/netbox-knowledge-gate/README.md

companion_rules:
  - .cursor/rules/netbox-knowledge-gate.mdc

references:
  - .cursor/skills/netbox-knowledge-gate/references/knowledge-receipt.md

owned_files:
  - .cursor/skills/netbox-knowledge-gate/SKILL.md
  - .cursor/skills/netbox-knowledge-gate/README.md
  - .cursor/skills/netbox-knowledge-gate/capability.yml
  - .cursor/skills/netbox-knowledge-gate/references/knowledge-receipt.md
  - .cursor/rules/netbox-knowledge-gate.mdc

update_behavior:
  strategy: replace-owned-files
  notes: Update the skill and companion rule together so enforcement and workflow stay aligned.

removal_behavior:
  strategy: remove-owned-files
  notes: Remove the files listed in owned_files and the catalog entry together.
