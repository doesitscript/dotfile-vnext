  short_description: "Help with Legacy Runtime Skill Migration tasks"
  default_prompt: "Use $legacy-runtime-skill-migration when an old .cursor/skills workflow should be migrated into dotfile-vnext's project skill library under skills/, then bridged back into runtime discovery. Use for move this legacy runtime skill into the project store, replace runtime-only authoring with project-owned skills, or de-emphasize a legacy .cursor operational skill after a replacement exists."
