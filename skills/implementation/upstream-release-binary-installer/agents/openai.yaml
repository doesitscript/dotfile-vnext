interface:
  display_name: "Upstream Release Binary Installer"
  short_description: "Help with Upstream Release Binary Installer tasks"
  default_prompt: "Use $upstream-release-binary-installer when a repo-managed tool should install from a pinned upstream release binary instead of Homebrew, pip, or another package manager, especially on macOS where formulae may trigger long source builds. Use for release asset URL, checksum pinning, arch map, extraction path, or check-mode-safe binary install design."
