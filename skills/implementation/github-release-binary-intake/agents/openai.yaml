interface:
  display_name: "GitHub Release Binary Intake"
  short_description: "Help with GitHub Release Binary Intake tasks"
  default_prompt: "Use $github-release-binary-intake when a macOS or cross-platform tool should install from a pinned GitHub release asset and the repo needs version, asset, checksum, and arch details captured before Ansible tasks are finalized. Use for latest release asset mapping, checksum file discovery, or darwin arm64/amd64 binary intake."
