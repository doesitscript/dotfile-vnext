interface:
  display_name: "Tool Capability Intake"
  short_description: "Help with Tool Capability Intake tasks"
  default_prompt: "Use $tool-capability-intake when adding, replacing, or refactoring a repo-managed tool capability in dotfile-vnext, especially when the work must choose between extending an existing role, creating a new role, or changing install strategy. Use for install tool X, add CLI role, convert package-manager installs to a better lifecycle contract, or when an ad-hoc host install must become present|absent Ansible first."
