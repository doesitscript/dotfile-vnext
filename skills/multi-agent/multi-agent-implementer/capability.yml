name: multi-agent-implementer
family: codex-framework
kind: skill
portable: false

summary: Bootstrap and run the project-owned implementer side of a paired evaluator/implementer correction loop on a plan packet.

capabilities:
  - paired_plan_packet_implementer_bootstrap
  - plan_dir_auto_detection
  - evaluator_artifact_routing
  - implementer_role_boundary_enforcement
  - evaluator_signoff_gated_closeout
  - plan_local_documentation_packet_pattern

suggested_roles:
  - executor
  - planner_steward

trigger_style: explicit_or_repo_guided

skill_file: .cursor/skills/multi-agent-implementer/SKILL.md
readme_file: skills/multi-agent/README.md

references:
