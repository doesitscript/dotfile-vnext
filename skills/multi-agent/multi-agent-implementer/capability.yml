update_behavior:
  strategy: replace-owned-files
  notes: Update the parent skill, child skills, workflow docs, and role docs together so the paired-loop contract does not drift.

removal_behavior:
  strategy: remove-owned-files
  notes: Start with the owned_files list so the implementer family, workflow pattern, and companion docs are removed together rather than left partially active.
