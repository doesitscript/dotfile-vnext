interface:
  display_name: "Single Host Ansible Rollout"
  short_description: "Help with Single Host Ansible Rollout tasks"
  default_prompt: "Use $single-host-ansible-rollout when a repo-managed capability needs preview-first Ansible execution against one host, with target scope proof, check-mode output, live apply, direct post-apply verification, and failure evidence. This is also the project's single-host apply-and-receipt workflow. Use for mac-dev rollout, list-hosts preview, check diff, rerun after a fix, or capture the exact failure before changing strategy."
