    description: Use when dotfile-vnext project skills under skills/ should be made runtime-discoverable
      in .cursor/skills through managed symlinks, or when the managed runtime catalog entries need to
      be refreshed after a skill update. Use for link project skills, refresh runtime skill catalog, or
      replace stale copied runtime skill folders with managed symlinks.
    path: implementation/project-skill-runtime-bridge/SKILL.md
    scope: project
    category: implementation
    purpose: Bridge source-controlled project skills into runtime discovery with managed symlinks
    status: reviewed
    triggers:
