    - a user asks to preserve hand-edited runtime copies instead of managed links
    handoff_from: []
    handoff_to: []
    complements:
    - tool-capability-intake
    - tool-usage-note-and-discoverability
    references:
    - implementation/project-skill-runtime-bridge/references/sources-and-precedence.md
    - implementation/project-skill-runtime-bridge/references/related-artifacts.md
    scripts:
