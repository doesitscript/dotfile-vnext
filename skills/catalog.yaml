schema_version: 2
description: 'Registry of reusable project skills in dotfile-vnext. Paths are relative to skills/. Match
  on description and triggers first, then load only the matched SKILL.md.

  '
skills:
  tool-capability-intake:
    name: tool-capability-intake
    description: Use when adding, replacing, or refactoring a repo-managed tool capability in dotfile-vnext,
      especially when the work must choose between extending an existing role, creating a new role, or
      changing install strategy. Use for install tool X, add CLI role, convert package-manager installs
      to a better lifecycle contract, or when an ad-hoc host install must become present|absent Ansible
      first. Do not use for rollout-only execution after the design is already settled; for Windows HVH
      tools prefer windows-tool-capability-intake; for HF weight trees prefer hf-model-weight-lifecycle.
    path: implementation/tool-capability-intake/SKILL.md
    scope: project
    category: implementation
    purpose: Define the repo-owned capability shape before edits and rollout
    status: reviewed
    triggers:
    - install this tool on mac-dev
    - create a role for this cli
    - should this extend an existing role or be a new role
    - switch this installer strategy
    - make this ad-hoc install into ansible
    do_not_use_when:
    - preview apply verify is the only remaining step
    - metadata and usage docs are the only requested change
    - windows hvh tool install is the primary ask
    - hf weight download or remove is the primary ask
    handoff_from: []
    handoff_to:
    - windows-tool-capability-intake
    - hf-model-weight-lifecycle
    - macos-tool-install-decider-and-scaffold
    - upstream-release-binary-installer
    - tool-usage-note-and-discoverability
    - single-host-ansible-rollout
    complements:
    - windows-tool-capability-intake
    - hf-model-weight-lifecycle
    - upstream-release-binary-installer
    - tool-usage-note-and-discoverability
    - single-host-ansible-rollout
    references:
    - implementation/tool-capability-intake/references/sources-and-precedence.md
    - implementation/tool-capability-intake/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: tool-capability-intake
  tool-playbook-placement-advisor:
    name: tool-playbook-placement-advisor
    description: 'Use when a new or refactored tool capability needs a clear home in dotfile-vnext before
      implementation: deploy_development_nodes.yaml, deploy_k8s_cli_tools.yaml, another existing playbook,
      or a composed tag path. Use for should this tool live with k8s cli tools, where should this role
      be wired, or does this belong in a shared substrate role.'
    path: implementation/tool-playbook-placement-advisor/SKILL.md
    scope: project
    category: implementation
    purpose: Choose the owning playbook and role lane for a tool capability before implementation
    status: reviewed
    triggers:
    - should this tool live in deploy_development_nodes or deploy_k8s_cli_tools
    - where should this role be wired
    - does this belong in a shared substrate role
    - choose the playbook home before we implement this tool
    do_not_use_when:
    - the playbook home is already settled
    - only install-path design is the remaining question
    handoff_from:
    - tool-capability-intake
    handoff_to:
    - tool-capability-intake
    - macos-tool-install-decider-and-scaffold
    complements:
    - tool-capability-intake
    - macos-tool-install-decider-and-scaffold
    references:
    - implementation/tool-playbook-placement-advisor/references/sources-and-precedence.md
    - implementation/tool-playbook-placement-advisor/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: tool-playbook-placement-advisor
  windows-tool-capability-intake:
    name: windows-tool-capability-intake
    description: Use when adding or changing a Windows-host tool capability in dotfile-vnext (HVH-01/HVH-02),
      especially Chocolatey, py -m pip, WinRM/OpenSSH PowerShell surfaces, or present|absent role scaffolding
      before any host mutation. Use for install this on HOM-LAB-HVH-01, Windows pip package role, Chocolatey
      CLI role, or scaffold Windows tool lifecycle. Do not use for mac-dev tools (use macos-tool-install-decider-and-scaffold)
      or for HF weight trees (use hf-model-weight-lifecycle).
    path: implementation/windows-tool-capability-intake/SKILL.md
    scope: project
    category: implementation
    purpose: Shape Windows tool capabilities with present|absent before host mutation
    status: reviewed
    aliases:
    - windows tool intake
    - hvh tool role
    target_surface:
    - HOM-LAB-HVH-01
    - HOM-LAB-HVH-02
    triggers:
    - install this on HOM-LAB-HVH-01
    - windows pip package role
    - chocolatey cli role
    - scaffold windows tool lifecycle
    - present absent for windows tool
    do_not_use_when:
    - mac-dev is the target host
    - hf weight tree download or remove is the only ask
    - rollout-only execution is the remaining work
    handoff_from:
    - tool-capability-intake
    - ansible-knowledge-gate
    handoff_to:
    - tool-role-docs-pack
    - single-host-ansible-rollout
    - hf-model-weight-lifecycle
    complements:
    - tool-capability-intake
    - hf-model-weight-lifecycle
    - single-host-ansible-rollout
    references:
    - implementation/windows-tool-capability-intake/references/sources-and-precedence.md
    - implementation/windows-tool-capability-intake/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: windows-tool-capability-intake
  hf-model-weight-lifecycle:
    name: hf-model-weight-lifecycle
    description: Use when downloading, removing, or commissioning Hugging Face model weights on the HVH-01
      share in dotfile-vnext, and when those weights must be owned by Ansible present|absent rather than
      ad-hoc snapshot_download. Use for download this HF model to the share, remove DiffuCoder weights,
      model_catalog unc_path lifecycle, or commission weights before LiteLLM/Continue. Do not use for
      Hub client pip install alone (use windows-tool-capability-intake / huggingface_hub role) or for
      authoring HRL model-doc packs (use model-doc-pack-preflight + HRL).
    path: implementation/hf-model-weight-lifecycle/SKILL.md
    scope: project
    category: implementation
    purpose: Own HF weight trees with Ansible present|absent separate from Hub client and LiteLLM routes
    status: reviewed
    aliases:
    - huggingface weights
    - model weight lifecycle
    - snapshot_download ansible
    target_surface:
    - HOM-LAB-HVH-01
    triggers:
    - download this hf model to the share
    - remove DiffuCoder weights
    - model_catalog unc_path lifecycle
    - commission weights before litellm
    - ansible present absent for huggingface weights
    do_not_use_when:
    - only the huggingface_hub pip client needs install
    - authoring an HRL model-doc-pack is the only ask
    - liteLLM route wiring already has live backends and weights are settled
    handoff_from:
    - tool-capability-intake
    - windows-tool-capability-intake
    - model-doc-pack-preflight
    handoff_to:
    - model-doc-pack-preflight
    - windows-tool-capability-intake
    - single-host-ansible-rollout
    complements:
    - model-doc-pack-preflight
    - windows-tool-capability-intake
    - tool-capability-intake
    - single-host-ansible-rollout
    references:
    - implementation/hf-model-weight-lifecycle/references/sources-and-precedence.md
    - implementation/hf-model-weight-lifecycle/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: hf-model-weight-lifecycle
  macos-tool-install-decider-and-scaffold:
    name: macos-tool-install-decider-and-scaffold
    description: Use when a macOS developer tool should be added to dotfile-vnext and the install strategy
      needs to be chosen before implementation, plus role/playbook surfaces scaffolded in the repo pattern.
      Use for install this tool on mac-dev, choose brew vs release binary, or scaffold the role before
      rollout.
    path: implementation/macos-tool-install-decider-and-scaffold/SKILL.md
    scope: project
    category: implementation
    purpose: Choose the right macOS install path early and scaffold repo-aligned surfaces
    status: reviewed
    aliases:
    - mac tool decider
    - mac role scaffold
    target_surface:
    - mac-dev
    part_of_flows:
    - macos-tool-role-default-flow
    preferred_prompt: Use skill macos-tool-install-decider-and-scaffold to install <tool> on mac-dev,
      prefer brew package installation, then tool-role-docs-pack and single-host-apply-and-receipt.
    triggers:
    - install this tool on mac-dev
    - choose brew or release binary before you build the role
    - scaffold the role for this macos cli
    - add this mac dev tool to the playbook
    do_not_use_when:
    - github release intake is the only missing step
    - rollout-only execution is the remaining work
    handoff_from: []
    handoff_to:
    - github-release-binary-intake
    - tool-role-docs-pack
    - tool-usage-note-and-discoverability
    - macos-ansible-install-validator
    - single-host-apply-and-receipt
    - single-host-ansible-rollout
    complements:
    - tool-capability-intake
    - github-release-binary-intake
    - tool-role-docs-pack
    - tool-usage-note-and-discoverability
    - single-host-apply-and-receipt
    - single-host-ansible-rollout
    companion_skills:
    - tool-role-docs-pack
    - single-host-apply-and-receipt
    references:
    - implementation/macos-tool-install-decider-and-scaffold/references/sources-and-precedence.md
    - implementation/macos-tool-install-decider-and-scaffold/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: macos-tool-install-decider-and-scaffold
  macos-tool-role-default-flow:
    name: macos-tool-role-default-flow
    description: 'Use when a macOS CLI or developer tool should follow the repo''s default end-to-end
      workflow on mac-dev: choose the install family, scaffold the role/playbook surfaces, package the
      docs, then preview/apply/verify with a single-host receipt. Use for the usual mac tool stack, default
      mac tool flow, or install this tool the standard way.'
    path: implementation/macos-tool-role-default-flow/SKILL.md
    scope: project
    category: implementation
    purpose: One entrypoint for the repo's default macOS tool install plus docs plus single-host receipt
      flow
    status: reviewed
    aliases:
    - default mac tool flow
    - usual mac tool stack
    - josh default tool flow
    target_surface:
    - mac-dev
    default_for:
    - install a macOS CLI or developer tool on mac-dev with the repo-standard role, docs pack, and single-host
      receipt
    preferred_prompt: Use skill macos-tool-role-default-flow to install <tool> on mac-dev, prefer Homebrew,
      then docs-pack and single-host-apply-and-receipt.
    triggers:
    - use the default mac tool install flow
    - use the usual mac tool stack
    - install this tool the standard way on mac-dev
    - use the repo default mac tool workflow
    do_not_use_when:
    - only one narrow slice remains, like docs-only or rollout-only work
    - the target host is not mac-dev
    handoff_from: []
    handoff_to:
    - macos-tool-install-decider-and-scaffold
    - tool-role-docs-pack
    - single-host-apply-and-receipt
    complements:
    - macos-tool-install-decider-and-scaffold
    - tool-role-docs-pack
    - single-host-apply-and-receipt
    companion_skills:
    - macos-tool-install-decider-and-scaffold
    - tool-role-docs-pack
    - single-host-apply-and-receipt
    recommended_sequence:
    - macos-tool-install-decider-and-scaffold
    - tool-role-docs-pack
    - single-host-apply-and-receipt
    references: []
    runtime_bridge:
      enabled: true
      cursor_skill_name: macos-tool-role-default-flow
  macos-cli-completion-pack:
    name: macos-cli-completion-pack
    description: Use when a repo-managed macOS CLI should add, repair, or standardize Bash completion
      wiring across the shared shell substrate and the owning role. Use for Gonzo, Dstl8, Stern, K9s,
      Kubectl, or similar completion install paths, loader expectations, and verification hooks.
    path: implementation/macos-cli-completion-pack/SKILL.md
    scope: project
    category: implementation
    purpose: Standardize managed Bash completion wiring for repo-owned macOS CLIs
    status: reviewed
    triggers:
    - add bash completion for this macos cli
    - standardize the completion wiring for this tool
    - fix the shared loader and completion path for this mac tool
    - make this tool follow the gonzo stern dstl8 completion pattern
    do_not_use_when:
    - only interactive proof remains
    - the cli does not expose a bash completion surface
    handoff_from:
    - macos-tool-install-decider-and-scaffold
    - tool-role-docs-pack
    handoff_to:
    - macos-ansible-install-validator
    - interactive-shell-completion-proof
    - single-host-apply-and-receipt
    complements:
    - macos-ansible-install-validator
    - interactive-shell-completion-proof
    - single-host-apply-and-receipt
    references:
    - implementation/macos-cli-completion-pack/references/sources-and-precedence.md
    - implementation/macos-cli-completion-pack/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: macos-cli-completion-pack
  upstream-release-binary-installer:
    name: upstream-release-binary-installer
    description: Use when a repo-managed tool should install from a pinned upstream release binary instead
      of Homebrew, pip, or another package manager, especially on macOS where formulae may trigger long
      source builds. Use for release asset URL, checksum pinning, arch map, extraction path, or check-mode-safe
      binary install design.
    path: implementation/upstream-release-binary-installer/SKILL.md
    scope: project
    category: implementation
    purpose: Design pinned upstream binary install paths with Ansible-safe verification
    status: reviewed
    triggers:
    - install from upstream release binary
    - skip homebrew and pin the binary asset
    - map darwin arm64 amd64 release assets
    - checksum and extract this release archive
    do_not_use_when:
    - a stable repo-native module or package-manager path already fits
    - only rollout evidence is requested
    handoff_from:
    - tool-capability-intake
    handoff_to:
    - tool-usage-note-and-discoverability
    - single-host-ansible-rollout
    complements:
    - tool-capability-intake
    - single-host-ansible-rollout
    references:
    - implementation/upstream-release-binary-installer/references/sources-and-precedence.md
    - implementation/upstream-release-binary-installer/references/related-artifacts.md
    runtime_bridge:
      enabled: true
      cursor_skill_name: upstream-release-binary-installer
  github-release-binary-intake:
    name: github-release-binary-intake
    description: Use when a tool should install from a pinned GitHub release asset and the repo needs
      version, asset, checksum, and arch details captured before Ansible tasks are finalized. Use for
      latest release asset mapping, checksum file discovery, or darwin arm64 and amd64 binary intake.
    path: implementation/github-release-binary-intake/SKILL.md
    scope: project
    category: implementation
    purpose: Capture GitHub release binary metadata as a pinned install contract
    status: reviewed
    triggers:
    - pin the github release binary for this tool
    - map the latest release asset and checksums
    - find the darwin arm64 and amd64 assets from github releases
    - capture release date version and asset names
    do_not_use_when:
    - the upstream source is not github releases
    - live rollout is the only remaining step
    handoff_from:
    - macos-tool-install-decider-and-scaffold
    handoff_to:
    - tool-usage-note-and-discoverability
    - macos-ansible-install-validator
    - single-host-ansible-rollout
    complements:
    - upstream-release-binary-installer
    - macos-ansible-install-validator
    - single-host-ansible-rollout
    references:
    - implementation/github-release-binary-intake/references/sources-and-precedence.md
    - implementation/github-release-binary-intake/references/related-artifacts.md
    scripts:
    - implementation/github-release-binary-intake/scripts/inspect_github_release.py
    runtime_bridge:
      enabled: true
      cursor_skill_name: github-release-binary-intake
  project-skill-runtime-bridge:
