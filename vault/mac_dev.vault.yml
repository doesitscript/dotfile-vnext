---
# Mac controller secrets vault.
# This file is plain YAML with selected inline !vault values. Do not use
# `ansible-vault edit` unless the whole file has first been encrypted with
# `ansible-vault encrypt`.
#
# To store a single secret on macOS:
#   1. Run:
#      bin/codex-env ansible-vault encrypt_string --stdin-name vault_example_name | pbcopy
#   2. Paste the raw secret in the terminal.
#   3. Press Ctrl-D to finish input.
#   4. The encrypted YAML block is now on the clipboard.
#   5. Replace the matching empty/plain value in this file, for example:
#      vault_example_name: ""
#      becomes:
#      vault_example_name: !vault |
#                $ANSIBLE_VAULT;1.1;AES256
#                ...
#
# This file is the intended durable home for mac-dev-specific Tunnelblick/OpenVPN
# secrets, local admin/become credentials, and client config content.

# mac-dev local admin password for become on the controller surface.
vault_mac_dev_become_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          32636333643835653734653731323839656236363230356130316537613938376137393932353532
          3636623039646331346361366138393763336662666162620a643435363432323431356437666663
          32366464333463353334363937613065646565653166306466623563616630633939336637383138
          6266663631333532360a333230303931393335386432303931323166363939376137393464383034
          3463

# Tunnelblick router profile: router-openvpn
vault_tunnelblick_mac_router_openvpn_auth_username: ""
vault_tunnelblick_mac_router_openvpn_auth_password: "REPLACE_WITH_REAL_VALUE"

# If the router exports a plain .ovpn and you want the repo to manage it as text,
# store the full file content here after encrypting this file.
vault_tunnelblick_mac_router_openvpn_ovpn_content: ""

