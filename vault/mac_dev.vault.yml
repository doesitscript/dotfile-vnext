---
# Mac controller secrets vault.
# Encrypt this file before storing real values:
#   ansible-vault encrypt vault/mac_dev.vault.yml
# or edit it in place:
#   ansible-vault edit vault/mac_dev.vault.yml
#
# This file is the intended durable home for mac-dev-specific Tunnelblick/OpenVPN
# secrets and client config content.

# Tunnelblick router profile: router-openvpn
vault_tunnelblick_mac_router_openvpn_auth_username: ""
vault_tunnelblick_mac_router_openvpn_auth_password: "REPLACE_WITH_REAL_VALUE"

# If the router exports a plain .ovpn and you want the repo to manage it as text,
# store the full file content here after encrypting this file.
vault_tunnelblick_mac_router_openvpn_ovpn_content: ""
