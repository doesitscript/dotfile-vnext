---
# Shared Secrets Vault
# Encrypt with: ansible-vault encrypt vault/shared.vault.yml
# These secrets are readable by mac-dev, main, network, and dev nodes
# DO NOT commit unencrypted secrets to git

vault_shared_langfuse_public_key: lf_pk_Pass@w0rd1
vault_shared_langfuse_secret_key: lf_sk_Pass@w0rd1

vault_shared_minio_access_key: minioadmin
vault_shared_minio_secret_key: Pass@w0rd1

# Provider API keys — consumed by k3s_litellm_gateway (litellm-env-secret) and Jupyter/workbench.
# Set your real key: ansible-vault edit vault/shared.vault.yml
vault_shared_openai_api_key: ""

# LiteLLM proxy master key — maps to PROXY_MASTER_KEY in litellm-env-secret.
vault_k3s_litellm_gateway_master_key: "sk-Pass@w0rd1"

# Ansible SSH public key (one line, e.g. ssh-ed25519 AAAA... user@host).
vault_ansible_ssh_public_key: ""
