---
# Shared Secrets Vault
# Encrypted with: ansible-vault encrypt vault/shared.vault.yml
# These secrets are readable by mac-dev, main, network, and dev nodes
# DO NOT commit unencrypted secrets to git

vault_server_225_win_password: "Pass@w0rd1"

# Langfuse shared keys (for API access from main/dev nodes)
FUZLANG_LANGFUSE_PUBLIC_KEY: "{{ vault_shared_langfuse_public_key | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"
FUZLANG_LANGFUSE_SECRET_KEY: "{{ vault_shared_langfuse_secret_key | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

# MinIO shared keys (for API access from main/dev nodes)
FUZLANG_MINIO_ACCESS_KEY: "{{ vault_shared_minio_access_key | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"
FUZLANG_MINIO_SECRET_KEY: "{{ vault_shared_minio_secret_key | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

# Ansible SSH public key (one line, e.g. ssh-ed25519 AAAA... user@host). Used by playbooks/bootstrap_local.yml
# to install into WSL authorized_keys so Mac can SSH in.
# Optional: if unset, bootstrap uses bootstrap/id_ed25519_ansible.pub when present (deprecated: bootstrap/mac_ssh_key.pub).
vault_ansible_ssh_public_key: ""

