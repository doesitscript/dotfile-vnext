---
# Network Node Only Secrets Vault
# Encrypted with: ansible-vault encrypt vault/network.vault.yml
# These secrets are only on network-server node
# DO NOT commit unencrypted secrets to git

# Postgres
FUZLANG_POSTGRES_USER: "{{ vault_network_postgres_user | default('langfuse') }}"
FUZLANG_POSTGRES_PASSWORD: "{{ vault_network_postgres_password | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"
FUZLANG_POSTGRES_DB: "{{ vault_network_postgres_db | default('langfuse') }}"

# ClickHouse (if using auth)
FUZLANG_CLICKHOUSE_PASSWORD: "{{ vault_network_clickhouse_password | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

# Redis (if using auth)
FUZLANG_REDIS_PASSWORD: "{{ vault_network_redis_password | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

# Langfuse node-only secrets
FUZLANG_LANGFUSE_NEXTAUTH_SECRET: "{{ vault_network_langfuse_nextauth_secret | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"
FUZLANG_LANGFUSE_SALT: "{{ vault_network_langfuse_salt | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"
FUZLANG_LANGFUSE_ENCRYPTION_KEY: "{{ vault_network_langfuse_encryption_key | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

# MinIO root credentials
FUZLANG_MINIO_ROOT_USER: "{{ vault_network_minio_root_user | default('minioadmin') }}"
FUZLANG_MINIO_ROOT_PASSWORD: "{{ vault_network_minio_root_password | default('PLACEHOLDER_REPLACE_WITH_VAULT') }}"

