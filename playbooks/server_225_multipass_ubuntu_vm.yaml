---
# End-to-end bootstrap for the Multipass-backed Ubuntu VM on server-225.
#
# Runs:
#   1. controller key setup (or reuse)
#   2. Hyper-V feature prerequisite on the Windows host
#   3. Multipass Ubuntu VM lifecycle on the Windows host
#   4. controller SSH config refresh after VM facts are published
#
# Diagnostics:
#   The multipass_ubuntu_vm role emits Windows Multipass troubleshooting
#   resources during execution, including Event Viewer / installer / GUI log
#   locations plus CLI and host feature probes. See the role README for the
#   durable research summary behind those diagnostics.
#   Resource ownership / evidence mapping:
#     - role `multipass_ubuntu_vm`
#       - live CLI and host probes
#       - tags: evidence, debug_resources
#     - role `troubleshooting_collectors`
#       - saved artifact harvesting
#       - tags: multipass_troubleshooting, collect_troubleshooting
#       - surface tags: multipass_event_logs, multipass_probe_bundle,
#         multipass_host_probes, multipass_installer_logs,
#         multipass_gui_logs
#   Optional artifact harvesting can be invoked through the same playbook path
#   with:
#     --tags multipass_troubleshooting
#   or:
#     -e multipass_collect_troubleshooting=true
#
# Example:
#   .venv/bin/ansible-playbook playbooks/server_225_multipass_ubuntu_vm.yaml \
#     -i inventory/inventory.yaml \
#     --limit 'execution_nodes,server-225-win'
#

- name: Access - controller identity
  hosts: execution_nodes
  connection: local
  gather_facts: true

  roles:
    - access_identity_controller

- name: Server-225 Hyper-V Multipass Ubuntu VM
  hosts: server-225-win
  gather_facts: false

  tasks:
    - name: Ensure Hyper-V feature prerequisite is ready
      ansible.builtin.include_role:
        name: hyperv_networking
        tasks_from: hyperv_feature.yml
        apply:
          tags:
            - hyperv_feature_prereq
      tags:
        - hyperv_feature_prereq

    - name: Ensure Multipass Ubuntu VM capability
      ansible.builtin.include_role:
        name: multipass_ubuntu_vm
        apply:
          tags:
            - multipass_ubuntu_vm
            - evidence
            - debug_resources
      tags:
        - multipass_ubuntu_vm
        - evidence
        - debug_resources

    - name: Collect Multipass troubleshooting artifacts when requested
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: multipass_windows.yml
        apply:
          tags:
            - multipass_troubleshooting
            - collect_troubleshooting
      when: >-
        (multipass_collect_troubleshooting | default(false)) or
        ('multipass_troubleshooting' in (ansible_run_tags | default([]))) or
        ('collect_troubleshooting' in (ansible_run_tags | default([])))
      tags:
        - multipass_troubleshooting
        - collect_troubleshooting

- name: Access - update controller SSH client config
  hosts: execution_nodes
  connection: local
  gather_facts: true

  tasks:
    - name: Generate SSH client config from deployed targets
      ansible.builtin.include_role:
        name: access_identity_controller
        tasks_from: ssh_config.yml
