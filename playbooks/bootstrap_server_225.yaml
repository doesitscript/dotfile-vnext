---
# Bootstrap Server-225 (main node)
# Targets: server-225-win (WinRM)
# Purpose: Make Windows host structurally ready

- name: Bootstrap Server-225 Windows host
  hosts: server-225-win
  become: false
  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force

    - name: Ensure WinRM HTTP firewall rule (port 5985)
      ansible.windows.win_firewall_rule:
        name: WinRM-HTTP-In-TCP
        display_name: WinRM HTTP (5985)
        localport: 5985
        protocol: tcp
        action: allow
        direction: in
        state: present

    - name: Check if WinRM HTTPS listener exists
      ansible.windows.win_shell: |
        $listeners = winrm enumerate winrm/config/Listener | Select-String -Pattern "Transport = HTTPS" -SimpleMatch
        if ($listeners) { "exists" } else { "missing" }
      register: winrm_https_check
      changed_when: false

    - name: Create self-signed certificate for WinRM HTTPS
      ansible.windows.win_shell: |
        $cert = New-SelfSignedCertificate -DnsName $env:COMPUTERNAME -CertStoreLocation Cert:\LocalMachine\My
        $cert.Thumbprint
      register: winrm_cert_thumbprint
      when: winrm_https_check.stdout == "missing"

    - name: Configure WinRM HTTPS listener
      ansible.windows.win_shell: |
        $certThumb = "{{ winrm_cert_thumbprint.stdout | trim }}"
        winrm create winrm/config/Listener?Address=*+Transport=HTTPS "@{Hostname='$env:COMPUTERNAME'; CertificateThumbprint='$certThumb'}"
      when: winrm_https_check.stdout == "missing"

    - name: Ensure WinRM HTTPS firewall rule (port 5985)
      ansible.windows.win_firewall_rule:
        name: WinRM-HTTPS-In-TCP
        display_name: WinRM HTTPS (5985)
        localport: 5985
        protocol: tcp
        action: allow
        direction: in
        state: present

    - name: Set TrustedHosts when explicitly provided
      ansible.windows.win_shell: Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value "{{ winrm_trustedhosts }}" -Force
      when: winrm_trustedhosts is defined

  roles:
    - role: common/baseline
    - role: package_manager
    - role: python
    - role: server_225/windows_base
    - role: server_225/wsl2
    - role: server_225/task_scheduler_autostart
    - role: server_225/gpu_driver_validation
    - role: common/firewall



