---
# Apply shared Windows base configuration to all managed Windows hosts.
# Enables Windows features, configures power, data directories, Defender exclusions,
# registry settings (long paths, Secure Boot update suppression), and base
# firewall rules (ICMP ping response).
#
# This is the canonical playbook for ALL common Windows base setup.
# Node-specific roles live in playbooks/provision_<node>.yaml.
#
# Commands:
#   All hosts:
#     ansible-playbook playbooks/windows_base.yml
#
#   Single host:
#     ansible-playbook playbooks/windows_base.yml --limit HOM-LAB-HVH-02
#
#   Firewall only (targeted):
#     ansible-playbook playbooks/windows_base.yml --tags firewall_icmp
#
#   Disk usage tools only:
#     ansible-playbook playbooks/windows_base.yml --tags disk_usage_tools
#
- name: Apply Windows base configuration
  hosts: windows_hosts
  gather_facts: false

  pre_tasks:
    - name: Skip hosts without WinRM connection configuration
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'winrm'
      tags: [always]

    - name: Set Windows OS identity facts without SMBIOS collection
      ansible.builtin.set_fact:
        ansible_os_family: "Windows"
        ansible_system: "Win32NT"
        ansible_distribution: "Windows"
      tags: [always]

  tasks:
    - name: Apply shared Windows base configuration
      ansible.builtin.include_role:
        name: windows_base

    - name: Ensure PowerShell global encoding profile (PS5.1 + PS7)
      ansible.builtin.include_role:
        name: pwsh
      when: pwsh_global_encoding_enabled | default(true) | bool

    - name: Apply disk usage tools
      ansible.builtin.include_role:
        name: disk_usage_tools
        apply:
          tags:
            - disk_usage_tools
            - windirstat
      tags: [disk_usage_tools, windirstat]

    - name: Apply base Windows firewall rules
      ansible.builtin.include_role:
        name: common/firewall
      tags: [firewall, firewall_icmp]
