---
# Apply shared Windows base configuration to all managed Windows hosts.
# Enables Windows features, configures power, data directories, Defender exclusions,
# and registry settings (long paths, Secure Boot update suppression).
#
# Commands:
#   All hosts:
#     ansible-playbook playbooks/windows_base.yaml -i inventory/inventory.yaml
#
#   Single host:
#     ansible-playbook playbooks/windows_base.yaml -i inventory/inventory.yaml --limit server-225-win
#
- name: Apply Windows base configuration
  hosts: windows_hosts
  gather_facts: false

  pre_tasks:
    - name: Skip hosts without WinRM connection configuration
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'winrm'
      tags: [always]

  tasks:
    - name: Apply shared Windows base configuration
      ansible.builtin.include_role:
        name: windows_base
