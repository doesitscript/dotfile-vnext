---
# Deploy development tooling to nodes designated as development nodes.
#
# Deploys: common/shell_config (.bashrc.d pattern, PATH, aliases)
#          direnv (installation + bash hook)
#          cursor (editor config, extensions, LF/UTF-8 settings)
#          speech_central (Speech Central install on mac-dev via mas_cli dependency)
#          remote_desktop_mac (macOS-only Microsoft Remote Desktop install)
#          tunnelblick_mac (macOS-only deprecated Tunnelblick install for Monterey)
#
# A node is a development node when node_purpose: development is set in its
# group_vars file. This uses Ansible's group_by module to dynamically classify
# nodes at runtime — no static host lists required.
#
# To designate a new node as a development node: add node_purpose: development
# to its group_vars file. No changes to this playbook are needed.
#
# Usage:
#   # All development nodes
#   ansible-playbook playbooks/deploy_development_nodes.yaml
#
#   # One specific surface
#   ansible-playbook playbooks/deploy_development_nodes.yaml --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --limit server-225-ubuntu
#
#   # Targeted role runs (no reinstall)
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags shell_config
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags direnv
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_settings
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_extensions
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags vscode_extensions
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags speech_central --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags remote_desktop_mac --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags tunnelblick_mac --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags tunnelblick_mac --limit mac-dev -e tunnelblick_mac_state=absent
#
#   # Windows surface only
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_windows --limit server-225-win
#
# After deployment:
#   source ~/.bashrc  # Reload shell to activate
#   direnv allow      # In directories with .envrc files
#
# Current development nodes (node_purpose: development in group_vars):
#   - mac-dev          (group_vars/mac_dev.yaml)
#   - server-225-win   (group_vars/server_225.yaml)
#   - server-225-ubuntu (group_vars/server_225.yaml)

- name: Classify nodes by purpose
  hosts: all
  gather_facts: false
  tasks:
    - name: Group development nodes from node_purpose variable
      ansible.builtin.group_by:
        key: "node_purpose_{{ node_purpose | default('unclassified') }}"
      changed_when: false
      tags: [always]

- name: Deploy development tooling to development nodes
  hosts: node_purpose_development
  gather_facts: true
  become: false
  pre_tasks:
    - name: Load mac-dev vault for controller-local secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vault/mac_dev.vault.yml"
      no_log: true
      when: inventory_hostname in groups["mac_dev"]

    - name: Set mac-dev become password from vault
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_mac_dev_become_password }}"
      no_log: true
      when:
        - inventory_hostname in groups["mac_dev"]
        - vault_mac_dev_become_password is defined
  roles:
    - role: common/shell_config
    - role: direnv
    - role: cursor
    - role: speech_central
      tags: [speech_central]
    - role: remote_desktop_mac
      tags: [remote_desktop_mac]
    - role: tunnelblick_mac
      tags: [tunnelblick_mac]
    - role: common/vscode
