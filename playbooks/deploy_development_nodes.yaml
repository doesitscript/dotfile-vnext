---
# Deploy development tooling to nodes designated as development nodes.
#
# Deploys: common/shell_config (.bashrc.d pattern, PATH, aliases)
#          direnv (installation + bash hook)
#          git (global gitconfig, gitattributes, gitignore_global symlink)
#          cursor (editor config, extensions, LF/UTF-8 settings)
#          common/agent_skills (repo-owned Cursor/Codex skill symlinks)
#          langfuse_cli (Langfuse CLI for tracing and evaluation)
#          litellm_cli (LiteLLM CLI on macOS via pipx)
#          terraform_cli (Terraform CLI on macOS through the official HashiCorp Homebrew tap)
#          aws_cli (AWS CLI on macOS through Homebrew awscli formula)
#          speech_central (Speech Central install on mac-dev via mas_cli dependency)
#          remote_desktop_mac (macOS-only Microsoft Remote Desktop install)
#          tunnelblick_mac (macOS-only deprecated Tunnelblick install for Monterey)
#          mac_user_niceties (macOS notification + widget quality-of-life defaults)
#          netcat_cli (GNU netcat on macOS through the Homebrew netcat formula)
#          localtunnel_cli (localtunnel CLI on macOS through the Homebrew localtunnel formula)
#          ngrok_cli (ngrok CLI on macOS through the Homebrew ngrok cask)
#          k3s_mac_client (macOS kubectl + kubeconfig for the homelab K3s cluster)
#          homelab_hosts_file_mac (macOS /etc/hosts from Traefik registry + router workaround)
#          Linux guest hosts file: playbooks/site.yaml or homelab_hosts_file.yaml (not this play)
#
# A node is a development node when node_purpose: development is set in its
# group_vars file. This uses Ansible's group_by module to dynamically classify
# nodes at runtime — no static host lists required.
#
# To designate a new node as a development node: add node_purpose: development
# to its group_vars file. No changes to this playbook are needed.
#
# Usage:
#   # All development nodes
#   ansible-playbook playbooks/deploy_development_nodes.yaml
#
#   # One specific surface
#   ansible-playbook playbooks/deploy_development_nodes.yaml --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --limit hom-lab-ctl-dkr-02
#
#   # Targeted role runs (no reinstall)
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags shell_config
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags python
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags direnv
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags git
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_settings
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_extensions
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags vscode_extensions
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags agent_skills --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags langfuse --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags langfuse_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags litellm_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags terraform_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags aws_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags speech_central --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags remote_desktop_mac --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags stirling_pdf --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags tunnelblick_mac --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags tunnelblick_mac --limit mac-dev -e tunnelblick_mac_state=absent
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags mac_user_niceties --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags netcat_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags localtunnel_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags ngrok_cli --limit mac-dev
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags k3s_mac_client --limit mac-dev

#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags homelab_hosts_file_mac --limit mac-dev -e homelab_hosts_file_mac_enabled=true
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags postgresql_client --limit mac-dev
#
#   # Windows surface only
#   ansible-playbook playbooks/deploy_development_nodes.yaml --tags cursor_windows --limit HOM-LAB-HVH-02
#
# After deployment:
#   source ~/.bashrc  # Reload shell to activate
#   direnv allow      # In directories with .envrc files
#
# Current development nodes (node_purpose: development in group_vars):
#   - mac-dev           (group_vars/mac_dev.yaml)
#   - HOM-LAB-HVH-02    (group_vars/hyperv_lane_gpu/main.yml)
#   - hom-lab-ctl-dkr-02 (group_vars/hyperv_lane_gpu/main.yml)

- name: Classify nodes by purpose
  hosts: all
  gather_facts: false
  tasks:
    - name: Group development nodes from node_purpose variable
      ansible.builtin.group_by:
        key: "node_purpose_{{ node_purpose | default('unclassified') }}"
      changed_when: false
      tags: [always]

- name: Deploy development tooling to development nodes
  hosts: node_purpose_development
  gather_facts: true
  become: false
  pre_tasks:
    - name: Establish development node path contract
      ansible.builtin.set_fact:
        dotfiles_home: "{{ dotfiles_home | default(playbook_dir | dirname) }}"
        dotfiles_user_home: "{{ dotfiles_user_home | default(ansible_facts['env']['HOME'] | default(ansible_user_dir)) }}"
      tags: [always]

    - name: Load mac-dev vault for controller-local secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vault/mac_dev.vault.yml"
      no_log: true
      when: inventory_hostname in groups["mac_dev"]
      tags: [always]

    - name: Set mac-dev become password from vault
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_mac_dev_become_password }}"
      no_log: true
      when:
        - inventory_hostname in groups["mac_dev"]
        - vault_mac_dev_become_password is defined
      tags: [always]
  roles:
    - role: common/shell_config
    - role: direnv
    - role: python
      tags: [python]
    - role: git
      tags: [git]
    - role: cursor
    - role: common/agent_skills
      tags: [agent_skills]
    - role: langfuse_cli
      tags: [langfuse, langfuse_cli]
    - role: litellm_cli
      when: ansible_system == "Darwin"
      tags: [litellm, litellm_cli]
    - role: terraform_cli
      when: ansible_system == "Darwin"
      tags: [terraform_cli]
    - role: aws_cli
      when: ansible_system == "Darwin"
      tags: [aws_cli]
    - role: speech_central
      tags: [speech_central]
    - role: remote_desktop_mac
      tags: [remote_desktop_mac]
    - role: stirling_pdf
      when: ansible_system == "Darwin"
      tags: [stirling_pdf]
    - role: tunnelblick_mac
      tags: [tunnelblick_mac]
    - role: mac_user_niceties
      tags: [mac_user_niceties]
    - role: netcat_cli
      when: ansible_system == "Darwin"
      tags: [netcat_cli]
    - role: localtunnel_cli
      when: ansible_system == "Darwin"
      tags: [localtunnel_cli]
    - role: ngrok_cli
      when: ansible_system == "Darwin"
      tags: [ngrok_cli]
    - role: hyperv_guest_route_mac
      when: ansible_system == "Darwin"
      tags: [hyperv_guest_route_mac, k3s_mac_client]
    - role: k3s_mac_client
      when: ansible_system == "Darwin"
      tags: [k3s_mac_client]
    - role: homelab_hosts_file_mac
      when: ansible_system == "Darwin"
      tags: [homelab_hosts_file_mac]
    - role: common/postgresql_client
      tags: [postgresql_client]
    - role: common/vscode
