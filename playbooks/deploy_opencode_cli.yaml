#   ansible-playbook playbooks/deploy_opencode_cli.yaml --limit mac-dev
- name: Deploy OpenCode CLI homelab config
  hosts: mac-dev
  gather_facts: true
  become: false
  roles:
    - role: opencode_cli
      when: ansible_system == "Darwin"
      tags: [opencode, opencode_cli]
