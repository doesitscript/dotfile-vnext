---
# Deploy OpenCode CLI + homelab LiteLLM config (mac-dev).
#
#   ansible-playbook playbooks/deploy_opencode_cli.yaml --limit mac-dev
- name: Deploy OpenCode CLI homelab config
  hosts: mac-dev
  gather_facts: true
  become: false
  pre_tasks:
    - name: Establish OpenCode repository path contract
      ansible.builtin.set_fact:
        dotfiles_home: "{{ dotfiles_home | default(playbook_dir | dirname) }}"
        dotfiles_user_home: "{{ dotfiles_user_home | default(ansible_facts['env']['HOME'] | default(ansible_user_dir)) }}"
  roles:
    - role: opencode_cli
      when: ansible_system == "Darwin"
      tags: [opencode, opencode_cli]
