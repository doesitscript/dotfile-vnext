---
# llm_compute_windows.yaml — Prepare Windows GPU hosts for LLM workloads.
#
# Installs and pins the NVIDIA Studio Driver via Chocolatey.
# Targets GPU-capable Windows hosts only.
#
# Usage:
#   source .envrc && source .venv/bin/activate
#   ansible-playbook playbooks/llm_compute_windows.yaml -i inventory/inventory.yaml
#   ansible-playbook playbooks/llm_compute_windows.yaml -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02
#   ansible-playbook playbooks/llm_compute_windows.yaml -i inventory/inventory.yaml --check --diff

- name: Prepare Windows GPU hosts for LLM compute
  hosts: "{{ llm_compute_windows_hosts | default('windows_server_2025:&windows_nvidia_gpu_hosts') }}"
  gather_facts: false
  roles:
    - llm_compute_windows
