---
# Node-specific provisioning for server-225 Windows host.
# This is the canonical entry point for host-specific provisioning on
# server-225-win. Shared low-level role playbooks may still exist for focused
# validation, but normal host setup should come through this playbook.
#
# Run AFTER windows_base.yml (which handles shared base setup for all Windows hosts):
#   ansible-playbook playbooks/windows_base.yml --limit server-225-win
#   ansible-playbook playbooks/provision_server_225.yaml
#
# Or targeted by tag:
#   ansible-playbook playbooks/provision_server_225.yaml --tags gpu_driver_validation
#
- name: Provision server-225 Windows host (node-specific)
  hosts: server-225-win
  become: false

  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force

  tasks:
    - name: Configure Hyper-V host networking
      ansible.builtin.include_role:
        name: hyperv_networking
        apply:
          tags:
            - hyperv
            - hyperv_networking
      when: >-
        (
          (hyperv_config | default({})).external_switch_enabled | default(false) | bool
        ) or (
          (hyperv_config | default({})).internal_ics_switch_enabled | default(false) | bool
        )
      tags:
        - hyperv
        - hyperv_networking

    - name: Validate GPU driver state
      ansible.builtin.include_role:
        name: server_225/gpu_driver_validation
      tags:
        - gpu_driver_validation
