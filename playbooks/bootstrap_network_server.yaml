---
# Bootstrap network-server node
# Targets: network-server-win (WinRM)
# Purpose: Make Windows host structurally ready

- name: Bootstrap network-server Windows host
  hosts: network-server-win
  become: false
  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force

    - name: Ensure WinRM HTTPS listener is configured
      ansible.windows.win_shell: |
        $existing = winrm enumerate winrm/config/Listener | Select-String -Pattern "Transport = HTTPS" -SimpleMatch
        if (-not $existing) {
          $cert = New-SelfSignedCertificate -DnsName $env:COMPUTERNAME -CertStoreLocation Cert:\LocalMachine\My
          winrm create winrm/config/Listener?Address=*+Transport=HTTPS "@{Hostname='$env:COMPUTERNAME'; CertificateThumbprint='$($cert.Thumbprint)'}"
        }

    - name: Open WinRM HTTPS firewall rule
      ansible.windows.win_firewall_rule:
        name: WinRM-HTTPS
        localport: 5986
        protocol: TCP
        action: allow
        direction: in
        state: present

    - name: Set TrustedHosts when explicitly provided
      ansible.windows.win_shell: Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value "{{ winrm_trustedhosts }}" -Force
      when: winrm_trustedhosts is defined

  roles:
    - role: common/baseline
    - role: package_manager
    - role: python
    - role: network_server/windows_base
    - role: network_server/docker_runtime
    - role: network_server/storage_layout
    - role: network_server/backup_baseline
    - role: common/firewall



