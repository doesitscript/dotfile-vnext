---
# Hyper-V Networking: enable Hyper-V features and manage Hyper-V switch
# prerequisites, including the existing External switch path and the Internal
# guest-switch + ICS path.
#
# Low-level shared validation/apply surface. The canonical capability entry
# point is playbooks/configure_hyperv_windows_hosts.yaml, which derives the
# target set from host intent instead of server-named wrappers.
#
# TODO:
# - tighten external-adapter verification to prefer and confirm MAC identity
#   whenever Windows exposes a usable physical-adapter MAC for the selected
#   Hyper-V uplink, so recreated-switch paths are protected from alias and
#   interface-description drift.
#
# Commands:
#   Full run:
#     ansible-playbook playbooks/configure_hyperv_windows_hosts.yaml -i inventory/inventory.yaml
#
#   Dry run (check mode):
#     ansible-playbook playbooks/configure_hyperv_windows_hosts.yaml \
#       -i inventory/inventory.yaml --check --tags hyperv_windows_host_preview
#
- name: Hyper-V networking infrastructure
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Configure Hyper-V bridge infrastructure
      ansible.builtin.include_role:
        name: hyperv_networking
      when: >-
        (
          (hyperv_config | default({})).external_switch_enabled | default(false) | bool
        ) or (
          (hyperv_config | default({})).internal_ics_switch_enabled | default(false) | bool
        )
