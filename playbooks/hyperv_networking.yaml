---
# Hyper-V Networking: enable Hyper-V features and manage Hyper-V switch
# prerequisites, including the existing External switch path and the Internal
# guest-switch + ICS path.
#
# Commands:
#   Full run:
#     ansible-playbook playbooks/hyperv_networking.yaml -i inventory/inventory.yaml --limit server-225-win
#
#   Dry run (check mode):
#     ansible-playbook playbooks/hyperv_networking.yaml -i inventory/inventory.yaml --limit server-225-win --check
#
- name: Hyper-V networking infrastructure
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Configure Hyper-V bridge infrastructure
      ansible.builtin.include_role:
        name: hyperv_networking
      when: >-
        (
          (hyperv_config | default({})).external_switch_enabled | default(false) | bool
        ) or (
          (hyperv_config | default({})).internal_ics_switch_enabled | default(false) | bool
        )
