---
# Hyper-V Networking: enable Hyper-V features and create an External Virtual Switch.
# Targets windows_hosts with hyperv_config.external_switch_enabled == true in host_vars.
#
# Commands:
#   Full run:
#     ansible-playbook playbooks/hyperv_networking.yaml -i inventory/inventory.yaml --limit server-225-win
#
#   Dry run (check mode):
#     ansible-playbook playbooks/hyperv_networking.yaml -i inventory/inventory.yaml --limit server-225-win --check
#
- name: Hyper-V networking infrastructure
  hosts: windows_hosts
  gather_facts: false

  pre_tasks:
    - name: Skip hosts not yet deployed
      ansible.builtin.meta: end_host
      when: not (ansible_facts.get('ssh_configured', false) | bool)
      tags: [always]

  tasks:
    - name: Configure Hyper-V bridge infrastructure
      ansible.builtin.include_role:
        name: hyperv_networking
      when: (hyperv_config | default({})).external_switch_enabled | default(false) | bool
