---
# Set up OpenSSH Server on Windows via WinRM from the Mac.
# Target: windows_hosts. Pre-tasks: PSRemoting, WinRM firewall 5985, optional TrustedHosts.
# Tasks: OpenSSH Server capability, firewall sshd (win_ssh_port), host keys from vault or ssh-keygen -A, sshd service, .ssh dir, .mgmt/ansible_ssh.pub → authorized_keys.
# Current state is gathered by playbooks/current_state_openssh_winrm.yaml → facts/current_state_openssh_winrm.json.
# Summary (grounded in that state): docs/setup_openssh_via_winrm_summary.md
# Run: source .envrc && .venv/bin/ansible-playbook playbooks/setup_openssh_via_winrm.yaml -i inventory/inventory.yaml --limit server-225-win
# Use --ask-vault-pass if using vault/openssh_host_keys.vault.yml. Temporary; to be merged into bootstrap_windows.yaml.

- name: Setup OpenSSH Server on Windows via WinRM (from Mac)
  hosts: windows_hosts
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    ansible_ssh_pub_path: "{{ repo_root }}/.mgmt/ansible_ssh.pub"
    openssh_host_keys_vault_path: "{{ repo_root }}/vault/openssh_host_keys.vault.yml"
  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force -SkipNetworkProfileCheck

    - name: Ensure WinRM HTTP firewall rule (port 5985)
      community.windows.win_firewall_rule:
        name: WinRM-HTTP-In-TCP
        display_name: WinRM HTTP (5985)
        localport: 5985
        protocol: tcp
        action: allow
        direction: in
        state: present

    - name: Set TrustedHosts when explicitly provided
      ansible.windows.win_shell: Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value "{{ winrm_trustedhosts }}" -Force
      when: winrm_trustedhosts is defined

  tasks:
    - name: Install OpenSSH Server (Windows capability)
      ansible.windows.win_shell: |
        $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' -ErrorAction SilentlyContinue | Where-Object State -ne Installed
        if ($cap) {
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
        }
      register: openssh_install
      changed_when: openssh_install.rc == 0 and ('Installed' in (openssh_install.stdout or ''))

    - name: Open firewall for OpenSSH Server
      community.windows.win_firewall_rule:
        name: sshd
        display_name: "OpenSSH Server (Port {{ win_ssh_port | default(22) }})"
        localport: "{{ win_ssh_port | default(22) }}"
        protocol: tcp
        action: allow
        direction: in
        state: present

    - name: Verify OpenSSH firewall rule port matches win_ssh_port
      ansible.windows.win_shell: |
        $expectedPort = {{ win_ssh_port | default(22) }}
        $rule = Get-NetFirewallRule -Name 'sshd' -ErrorAction Stop
        $portFilter = $rule | Get-NetFirewallPortFilter
        $actualPorts = @($portFilter.LocalPort)
        if ($actualPorts -notcontains $expectedPort) {
          Write-Error "Firewall rule 'sshd' LocalPort is $($actualPorts -join ','); expected $expectedPort (win_ssh_port)."
        }
        Write-Output "OK: sshd rule LocalPort=$($actualPorts -join ',')"
      register: fw_verify
      changed_when: false

    - name: Check if OpenSSH host keys vault exists on controller
      ansible.builtin.stat:
        path: "{{ openssh_host_keys_vault_path }}"
      register: openssh_host_keys_vault_stat
      delegate_to: localhost
      run_once: true

    - name: Load OpenSSH host keys from vault when present
      ansible.builtin.include_vars:
        file: "{{ openssh_host_keys_vault_path }}"
      delegate_to: localhost
      run_once: true
      when: openssh_host_keys_vault_stat.stat.exists

    - name: Deploy OpenSSH host keys from vault to Windows
      ansible.windows.win_copy:
        content: "{{ item.value }}"
        dest: "C:\\ProgramData\\ssh\\{{ item.key }}"
      loop: "{{ vault_openssh_host_keys | dict2items }}"
      when: vault_openssh_host_keys is defined

    - name: Ensure OpenSSH host keys exist (fallback when vault not used)
      ansible.windows.win_shell: |
        $sshDir = 'C:\ProgramData\ssh'
        if ((Test-Path $sshDir) -and -not (Get-ChildItem (Join-Path $sshDir 'ssh_host_*_key') -ErrorAction SilentlyContinue)) {
          Push-Location $sshDir
          if (Get-Command ssh-keygen -ErrorAction SilentlyContinue) { ssh-keygen -A 2>&1 | Out-Null }
          Pop-Location
        }
      failed_when: false
      when: vault_openssh_host_keys is not defined

    - name: Set sshd service to Automatic and start
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto
      register: sshd_service_result
      failed_when: false

    - name: Ensure user .ssh directory exists
      ansible.windows.win_file:
        path: "{{ ansible_env.USERPROFILE }}\\.ssh"
        state: directory
        mode: "0700"

    - name: Check if ansible public key file exists on controller
      ansible.builtin.stat:
        path: "{{ ansible_ssh_pub_path }}"
      register: ansible_pub_key_file
      delegate_to: localhost
      run_once: true

    - name: Read ansible public key from controller and set for host
      ansible.builtin.set_fact:
        ansible_pub_key_content: "{{ lookup('file', ansible_ssh_pub_path) | trim }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      when: ansible_pub_key_file.stat.exists

    - name: Add Mac (controller) public key to Windows authorized_keys
      community.windows.win_lineinfile:
        path: "{{ ansible_env.USERPROFILE }}\\.ssh\\authorized_keys"
        line: "{{ ansible_pub_key_content }}"
        create: true
        state: present
      when:
        - ansible_pub_key_file.stat.exists
        - ansible_pub_key_content is defined
        - ansible_pub_key_content | length > 0

  post_tasks:
    - name: OpenSSH setup summary
      ansible.builtin.debug:
        msg:
          - "OpenSSH Server configured (port {{ win_ssh_port | default(22) }})."
          - "Connect: ssh -p {{ win_ssh_port | default(22) }} {{ ansible_user }}@{{ ansible_host }}"
