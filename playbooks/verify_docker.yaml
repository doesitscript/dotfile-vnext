---
# ============================================================
# Verify Docker: validates Docker Engine and Docker Compose v2
# on the target host. Non-destructive. No changes.
#
# Run it:
#   ansible-playbook playbooks/verify_docker.yaml -i inventory/inventory.yaml
#
# Optional (run only verify_docker tasks by tag):
#   ansible-playbook playbooks/verify_docker.yaml -i inventory/inventory.yaml --tags verify
#
# If your WSL host is in another group (e.g. wsl_hosts), change
# hosts: below accordingly.
# ============================================================

- hosts: linux
  become: true
  roles:
    - verify_docker
