---
# This playbook deploys NetBox, our source of truth for infrastructure data.
# It targets the primary Ubuntu Docker host, `server-225-ubuntu`.
#
# The deployment is managed by the `ipam_netbox` role, which uses
# Docker Compose to stand up the entire NetBox stack. All configuration,
# including secrets, is managed by Ansible, ensuring a repeatable and
# version-controlled deployment.
#
# Tags:
#   ipam_netbox          — full deploy (or remove with ipam_netbox_state=absent)
#   ipam_netbox_present  — deploy path only
#   ipam_netbox_absent   — remove path only
#   ipam_netbox_smoke_test — health check only
#   ipam_netbox_api_token — ensure the dedicated repo NetBox API token exists
#   ipam_netbox_seed_tags  — seed canonical object tags into NetBox via API
#   ipam_netbox_seed_server_225_model_preview — preview first NetBox object model
#   ipam_netbox_seed_server_225_model — seed first server-225 NetBox object model
#   ipam_netbox_migrate_display_names — one-time rename mixed-case display names to lowercase
#   ipam_netbox_backup_db — pg_dump NetBox postgres to artifacts/netbox-backups/
#
# Examples:
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_smoke_test
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_tags
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_server_225_model_preview
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass -e ipam_netbox_state=absent

- name: Deploy Source of Truth (NetBox)
  hosts: server-225-ubuntu
  become: true
  roles:
    - role: ipam_netbox
      tags:
        - ipam_netbox

- name: Seed NetBox object tags
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed canonical NetBox tags via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_tags
      tags:
        - ipam_netbox_seed_tags

- name: Seed server-225 NetBox model
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed server-225 NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_server_225_model
      tags:
        - ipam_netbox_seed_server_225_model
        - ipam_netbox_seed_server_225_model_preview

- name: Migrate NetBox display names to lowercase
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Patch mixed-case display names to lowercase via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_display_names
      tags:
        - ipam_netbox_migrate_display_names

- name: Backup NetBox database
  hosts: server-225-ubuntu
  gather_facts: true
  tasks:
    - name: Run pg_dump and fetch to controller
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: backup_db
      tags:
        - ipam_netbox_backup_db
