---
# This playbook deploys NetBox, our source of truth for infrastructure data.
# It targets the primary Ubuntu Docker host, `server-225-ubuntu`.
#
# The deployment is managed by the `ipam_netbox` role, which uses
# Docker Compose to stand up the entire NetBox stack. All configuration,
# including secrets, is managed by Ansible, ensuring a repeatable and
# version-controlled deployment.
#
# Tags:
#   ipam_netbox          — full deploy (or remove with ipam_netbox_state=absent)
#   ipam_netbox_present  — deploy path only
#   ipam_netbox_absent   — remove path only
#   ipam_netbox_smoke_test — health check only
#   ipam_netbox_api_token — ensure the dedicated repo NetBox API token exists
#   ipam_netbox_repo_consistency — verify repo references match NetBox naming decisions
#   ipam_netbox_seed_tags  — seed canonical object tags into NetBox via API
#   ipam_netbox_seed_server_225_model_preview — preview first NetBox object model
#   ipam_netbox_seed_server_225_model — seed first server-225 NetBox object model
#   ipam_netbox_seed_windows_share_hosts_model_preview — preview Windows share-host NetBox model
#   ipam_netbox_seed_windows_share_hosts_model — seed Windows share-host NetBox model
#   ipam_netbox_seed_network_server_vm_model_preview — preview network-server VM model
#   ipam_netbox_seed_network_server_vm_model — seed network-server VM model
#   ipam_netbox_migrate_display_names — one-time rename mixed-case display names to lowercase
#   ipam_netbox_migrate_compact_naming_schema — one-time reconcile NetBox names/slugs to compact schema
#   ipam_netbox_backup_db — pg_dump NetBox postgres to artifacts/netbox-backups/
#
# Examples:
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_smoke_test
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_repo_consistency
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_tags
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_server_225_model_preview
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_windows_share_hosts_model_preview
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass -e ipam_netbox_state=absent

- name: Deploy Source of Truth (NetBox)
  hosts: server-225-ubuntu
  become: true
  roles:
    - role: ipam_netbox
      tags:
        - ipam_netbox

- name: Seed NetBox object tags
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed canonical NetBox tags via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_tags
      tags:
        - ipam_netbox_seed_tags

- name: Verify NetBox/repo naming consistency
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure repo active references match NetBox source-of-truth names
      ansible.builtin.command:
        cmd: scripts/validate_netbox_repo_consistency.sh
        chdir: "{{ playbook_dir }}/.."
      check_mode: false
      changed_when: false
      tags:
        - ipam_netbox_repo_consistency
        - ipam_netbox_seed_server_225_model
        - ipam_netbox_seed_server_225_model_preview
        - ipam_netbox_seed_windows_share_hosts_model
        - ipam_netbox_seed_windows_share_hosts_model_preview
        - ipam_netbox_seed_network_server_vm_model
        - ipam_netbox_seed_network_server_vm_model_preview

- name: Seed server-225 NetBox model
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed server-225 NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_server_225_model
      tags:
        - ipam_netbox_seed_server_225_model
        - ipam_netbox_seed_server_225_model_preview

- name: Seed Windows share-host NetBox model
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed Windows share-host NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_windows_share_hosts_model
      tags:
        - ipam_netbox_seed_windows_share_hosts_model
        - ipam_netbox_seed_windows_share_hosts_model_preview

- name: Seed network-server VM NetBox model
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Seed network-server VM NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_network_server_vm_model
      tags:
        - ipam_netbox_seed_network_server_vm_model
        - ipam_netbox_seed_network_server_vm_model_preview

- name: Migrate NetBox display names to lowercase
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Patch mixed-case display names to lowercase via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_display_names
      tags:
        - ipam_netbox_migrate_display_names

- name: Migrate NetBox names and slugs to compact naming schema
  hosts: server-225-ubuntu
  gather_facts: false
  tasks:
    - name: Patch legacy NetBox names and role/tag slugs to compact schema via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_compact_naming_schema
      tags:
        - ipam_netbox_migrate_compact_naming_schema

- name: Backup NetBox database
  hosts: server-225-ubuntu
  gather_facts: true
  tasks:
    - name: Run pg_dump and fetch to controller
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: backup_db
      tags:
        - ipam_netbox_backup_db
