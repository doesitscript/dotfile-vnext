---
# This playbook deploys NetBox, our source of truth for infrastructure data.
# It targets the primary Ubuntu Docker host, `hom-lab-ctl-dkr-02`.
#
# The deployment is managed by the `ipam_netbox` role, which uses
# Docker Compose to stand up the entire NetBox stack. All configuration,
# including secrets, is managed by Ansible, ensuring a repeatable and
# version-controlled deployment.
#
# Tags:
#   ipam_netbox          — full deploy (or remove with ipam_netbox_state=absent)
#   ipam_netbox_present  — deploy path only
#   ipam_netbox_absent   — remove path only
#   ipam_netbox_smoke_test — health check only
#   ipam_netbox_api_token — ensure the dedicated repo NetBox API token exists
#   ipam_netbox_repo_consistency — verify repo references match NetBox naming decisions
#   ipam_netbox_seed_tags  — seed canonical object tags into NetBox via API
#   ipam_netbox_seed_custom_fields — seed Service custom field definitions via API
#   ipam_netbox_seed_hom_lab_ctl_hvh_02_model_preview — preview GPU-lane NetBox model
#   ipam_netbox_seed_hom_lab_ctl_hvh_02_model — seed GPU-lane (HOM-LAB-HVH-02) NetBox model
#   ipam_netbox_seed_windows_share_hosts_model_preview — preview Windows share-host NetBox model
#   ipam_netbox_seed_windows_share_hosts_model — seed Windows share-host NetBox model
#   ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview — preview storage-lane VM model
#   ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model — seed storage-lane (HOM-LAB-HVH-01) VM model
#   ipam_netbox_service_inventory_discovery_preview — read-only Docker/K3s runtime discovery + NetBox comparison
#   ipam_netbox_service_inventory_discovery — alias for the same read-only service inventory discovery workflow
#   ipam_netbox_seed_prefixes_preview — preview homelab IPAM /24 prefixes
#   ipam_netbox_seed_prefixes — seed homelab IPAM prefixes (50/138/137)
#   ipam_netbox_seed_config_contexts_preview — preview homelab config contexts
#   ipam_netbox_seed_config_contexts — seed homelab config contexts
#   ipam_netbox_purge_legacy_vms — remove superseded NetBox VMs (e.g. server-225-ubuntu)
#   ipam_netbox_migrate_legacy_cluster_names — rename legacy cluster slugs to compact schema
#   ipam_netbox_migrate_display_names — one-time rename mixed-case display names to lowercase
#   ipam_netbox_migrate_compact_naming_schema — one-time reconcile NetBox names/slugs to compact schema
#   ipam_netbox_backup_db — pg_dump NetBox postgres to artifacts/netbox-backups/
#
# Examples:
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_smoke_test
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_repo_consistency
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_tags
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_custom_fields
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_hom_lab_ctl_hvh_02_model_preview
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass --tags ipam_netbox_seed_windows_share_hosts_model_preview
#   ansible-playbook playbooks/deploy_ipam_netbox.yaml --ask-vault-pass -e ipam_netbox_state=absent

- name: Deploy Source of Truth (NetBox)
  hosts: hom-lab-ctl-dkr-02
  become: true
  roles:
    - role: ipam_netbox
      tags:
        - ipam_netbox

- name: Seed NetBox object tags
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed canonical NetBox tags via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_tags
      tags:
        - ipam_netbox_seed_tags

- name: Seed NetBox Service custom field definitions
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed Service custom fields via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_custom_fields
      tags:
        - ipam_netbox_seed_custom_fields

- name: Verify NetBox/repo naming consistency
  hosts: execution_nodes
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure repo active references match NetBox source-of-truth names
      ansible.builtin.command:
        cmd: scripts/validate_netbox_repo_consistency.sh
        chdir: "{{ playbook_dir }}/.."
      check_mode: false
      changed_when: false
      tags:
        - ipam_netbox_repo_consistency
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model_preview
        - ipam_netbox_seed_windows_share_hosts_model
        - ipam_netbox_seed_windows_share_hosts_model_preview
        - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
        - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview
        - ipam_netbox_seed_prefixes
        - ipam_netbox_seed_config_contexts

- name: Purge legacy NetBox VMs
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Remove superseded NetBox VM objects
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: purge_legacy_netbox_objects
      tags:
        - ipam_netbox_purge_legacy_vms

- name: Migrate legacy Hyper-V cluster names in NetBox
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Rename legacy cluster slugs to compact-schema names
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_legacy_cluster_names
      tags:
        - ipam_netbox_migrate_legacy_cluster_names

- name: Seed homelab IPAM prefixes
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed homelab /24 prefixes via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_prefixes
      tags:
        - ipam_netbox_seed_prefixes
        - ipam_netbox_seed_prefixes_preview

- name: Seed homelab NetBox config contexts
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed homelab config contexts via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_config_contexts
      tags:
        - ipam_netbox_seed_config_contexts
        - ipam_netbox_seed_config_contexts_preview

- name: Seed HOM-LAB-HVH-02 NetBox model
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed GPU-lane NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_hom_lab_ctl_hvh_02_model
      tags:
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model_preview

- name: Seed Windows share-host NetBox model
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed Windows share-host NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_windows_share_hosts_model
      tags:
        - ipam_netbox_seed_windows_share_hosts_model
        - ipam_netbox_seed_windows_share_hosts_model_preview

- name: Seed HOM-LAB-HVH-01 VM NetBox model
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Seed storage-lane VM NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_hom_lab_ctl_hvh_01_vm_model
      tags:
        - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model
        - ipam_netbox_seed_hom_lab_ctl_hvh_01_vm_model_preview

- name: Discover runtime service inventory on Docker VMs
  hosts: hom-lab-ctl-dkr-01,hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Collect Docker runtime service facts
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: discover_service_inventory_docker
      tags:
        - ipam_netbox_service_inventory_discovery
        - ipam_netbox_service_inventory_discovery_preview

- name: Discover runtime service inventory on K3s VMs
  hosts: hom-lab-ctl-k3s-01,hom-lab-ctl-k3s-02
  gather_facts: false
  tasks:
    - name: Collect K3s runtime service facts
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: discover_service_inventory_k3s
      tags:
        - ipam_netbox_service_inventory_discovery
        - ipam_netbox_service_inventory_discovery_preview

- name: Discover guest-direct runtime service inventory on Linux VMs
  hosts: linux_vm_hosts
  gather_facts: false
  tasks:
    - name: Collect guest-direct runtime service facts
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: discover_service_inventory_guest_direct
      tags:
        - ipam_netbox_service_inventory_discovery
        - ipam_netbox_service_inventory_discovery_preview

- name: Compare curated, runtime, and live NetBox service inventory
  hosts: execution_nodes
  connection: local
  gather_facts: false
  tasks:
    - name: Render read-only NetBox service inventory comparison
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: discover_service_inventory_report
      tags:
        - ipam_netbox_service_inventory_discovery
        - ipam_netbox_service_inventory_discovery_preview

- name: Migrate NetBox display names to lowercase
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Patch mixed-case display names to lowercase via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_display_names
      tags:
        - ipam_netbox_migrate_display_names

- name: Migrate NetBox names and slugs to compact naming schema
  hosts: hom-lab-ctl-dkr-02
  gather_facts: false
  tasks:
    - name: Patch legacy NetBox names and role/tag slugs to compact schema via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: migrate_compact_naming_schema
      tags:
        - ipam_netbox_migrate_compact_naming_schema

- name: Backup NetBox database
  hosts: hom-lab-ctl-dkr-02
  gather_facts: true
  tasks:
    - name: Run pg_dump and fetch to controller
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: backup_db
      tags:
        - ipam_netbox_backup_db
