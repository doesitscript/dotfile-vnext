---
# Gather and cache facts from all reachable hosts.
#
# This playbook connects to every host in the inventory, runs Ansible's
# setup module, and writes a per-host YAML snapshot to inventory/facts/.
# It also populates the jsonfile fact cache (.facts_cache/) configured
# in ansible.cfg, so subsequent playbooks can reference facts from
# hosts that were previously gathered without re-connecting.
#
# Usage:
#   # All reachable hosts (skips unreachable gracefully)
#   ansible-playbook playbooks/gather_facts.yaml
#
#   # Only Windows hosts (WinRM)
#   ansible-playbook playbooks/gather_facts.yaml --limit windows_hosts
#
#   # Only Linux VM hosts
#   ansible-playbook playbooks/gather_facts.yaml --limit linux_vm_hosts
#
#   # Single host
#   ansible-playbook playbooks/gather_facts.yaml --limit HOM-LAB-HVH-02
#
#   # Just the local Mac
#   ansible-playbook playbooks/gather_facts.yaml --limit mac-dev
#

- name: Gather facts from local controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure inventory/facts directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../inventory/facts"
        state: directory
        mode: "0755"
      run_once: true

    - name: Write host fact snapshot (execution_nodes)
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbooks/gather_facts.yaml
          # Host: {{ inventory_hostname }}
          # Gathered: {{ ansible_date_time.iso8601 }}
          {{ {'system': ansible_system,
              'distribution': ansible_distribution | default('N/A'),
              'distribution_version': ansible_distribution_version | default('N/A'),
              'os_family': ansible_os_family,
              'architecture': ansible_architecture,
              'kernel': ansible_kernel,
              'hostname': ansible_hostname,
              'fqdn': ansible_fqdn,
              'default_ipv4': ansible_default_ipv4 | default({}),
              'processor': ansible_processor | default('N/A'),
              'processor_cores': ansible_processor_cores | default('N/A'),
              'processor_vcpus': ansible_processor_vcpus | default('N/A'),
              'memtotal_mb': ansible_memtotal_mb | default('N/A'),
              'memfree_mb': ansible_memfree_mb | default('N/A'),
              'python_version': ansible_python_version,
              'pkg_mgr': ansible_pkg_mgr,
              'service_mgr': ansible_service_mgr,
              'uptime_seconds': ansible_uptime_seconds | default('N/A'),
              'interfaces': ansible_interfaces | default([]),
              'dns': ansible_dns | default({}),
              'user_id': ansible_user_id,
              'env_home': ansible_env.HOME | default('N/A')} | to_nice_yaml }}
        dest: "{{ playbook_dir }}/../inventory/facts/{{ inventory_hostname }}.yaml"
        mode: "0644"
      delegate_to: "{{ groups['execution_nodes'][0] }}"

- name: Gather facts from Windows hosts (WinRM)
  hosts: windows_hosts
  gather_facts: true
  ignore_unreachable: true

  tasks:
    - name: Write host fact snapshot (windows_hosts)
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbooks/gather_facts.yaml
          # Host: {{ inventory_hostname }}
          # Gathered: {{ ansible_date_time.iso8601 | default('unknown') }}
          {{ {'system': ansible_system | default('N/A'),
              'os_name': ansible_os_name | default('N/A'),
              'os_family': ansible_os_family | default('N/A'),
              'distribution': ansible_distribution | default('N/A'),
              'distribution_version': ansible_distribution_version | default('N/A'),
              'architecture': ansible_architecture | default('N/A'),
              'hostname': ansible_hostname | default('N/A'),
              'fqdn': ansible_fqdn | default('N/A'),
              'ip_addresses': ansible_ip_addresses | default([]),
              'processor': ansible_processor | default([]),
              'processor_cores': ansible_processor_cores | default('N/A'),
              'processor_count': ansible_processor_count | default('N/A'),
              'memtotal_mb': ansible_memtotal_mb | default('N/A'),
              'windows_domain': ansible_windows_domain | default('N/A'),
              'windows_domain_role': ansible_windows_domain_role | default('N/A'),
              'uptime_seconds': ansible_uptime_seconds | default('N/A'),
              'powershell_version': ansible_powershell_version | default('N/A'),
              'env_computername': ansible_env.COMPUTERNAME | default('N/A'),
              'env_username': ansible_env.USERNAME | default('N/A')} | to_nice_yaml }}
        dest: "{{ playbook_dir }}/../inventory/facts/{{ inventory_hostname }}.yaml"
        mode: "0644"
      delegate_to: "{{ groups['execution_nodes'][0] }}"
      when: not (ansible_host is undefined)

- name: Gather facts from Linux VM hosts
  hosts: linux_vm_hosts
  gather_facts: true
  ignore_unreachable: true

  tasks:
    - name: Write host fact snapshot (linux_vm_hosts)
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbooks/gather_facts.yaml
          # Host: {{ inventory_hostname }}
          # Gathered: {{ ansible_date_time.iso8601 }}
          {{ {'system': ansible_system,
              'distribution': ansible_distribution | default('N/A'),
              'distribution_version': ansible_distribution_version | default('N/A'),
              'os_family': ansible_os_family,
              'architecture': ansible_architecture,
              'kernel': ansible_kernel,
              'hostname': ansible_hostname,
              'fqdn': ansible_fqdn,
              'default_ipv4': ansible_default_ipv4 | default({}),
              'processor': ansible_processor | default('N/A'),
              'processor_cores': ansible_processor_cores | default('N/A'),
              'processor_vcpus': ansible_processor_vcpus | default('N/A'),
              'memtotal_mb': ansible_memtotal_mb | default('N/A'),
              'memfree_mb': ansible_memfree_mb | default('N/A'),
              'python_version': ansible_python_version,
              'pkg_mgr': ansible_pkg_mgr,
              'service_mgr': ansible_service_mgr,
              'uptime_seconds': ansible_uptime_seconds | default('N/A'),
              'interfaces': ansible_interfaces | default([]),
              'dns': ansible_dns | default({}),
              'user_id': ansible_user_id,
              'env_home': ansible_env.HOME | default('N/A')} | to_nice_yaml }}
        dest: "{{ playbook_dir }}/../inventory/facts/{{ inventory_hostname }}.yaml"
        mode: "0644"
      delegate_to: "{{ groups['execution_nodes'][0] }}"
      when: ansible_date_time is defined

- name: Summarize gathered facts
  hosts: execution_nodes
  connection: local
  gather_facts: false

  tasks:
    - name: List all fact snapshots
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../inventory/facts"
        patterns: "*.yaml"
      register: _fact_files

    - name : Report gathered hosts
      ansible.builtin.debug:
        msg: >-
          Gathered facts for {{ _fact_files.files | length }} host(s).
          Snapshots saved to inventory/facts/.
          Fact cache also updated at .facts_cache/ (per ansible.cfg).
