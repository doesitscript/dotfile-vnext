---
# Validate Windows OpenSSH configuration (firewall rule port + sshd service).
# Run: ansible-playbook playbooks/validate/validate_windows_openssh.yaml -i inventory/inventory.yaml [--limit server-225-win]
# Uses modules only (no win_shell/command); requires community.windows and ansible.windows.

- name: Validate Windows OpenSSH configuration
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Gather firewall rule info (sshd-Server-In-TCP)
      ansible.windows.win_powershell:
        script: |
          $rule = Get-NetFirewallRule -Name 'sshd-Server-In-TCP' -ErrorAction Stop
          $portFilter = $rule | Get-NetFirewallPortFilter
          [PSCustomObject]@{
            name = $rule.Name
            enabled = $rule.Enabled
            localport = $portFilter.LocalPort
          }
      register: sshd_rule_result

    - name: Assert firewall rule exists and port matches win_ssh_port
      ansible.builtin.assert:
        that:
          - sshd_rule_result.output is defined
          - sshd_rule_result.output.localport is defined
          - (sshd_rule_result.output.localport | list | first | default(sshd_rule_result.output.localport) | string) == (win_ssh_port | default(22) | string)
        fail_msg: "sshd firewall rule does not match win_ssh_port (expected {{ win_ssh_port | default(22) }})"

    - name: Check sshd service is running
      ansible.windows.win_service_info:
        name: sshd
      register: sshd_info

    - name: Assert sshd service is running
      ansible.builtin.assert:
        that:
          - sshd_info.exists | default(false) | bool
          - sshd_info.services | length > 0
          - sshd_info.services[0].state == "started"
        fail_msg: "sshd service is not running"
