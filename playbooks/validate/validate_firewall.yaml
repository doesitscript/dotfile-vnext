---
# Validate key Windows firewall rules (WinRM HTTP 5985 + OpenSSH sshd). Assert state only.
# Run: ansible-playbook playbooks/validate/validate_firewall.yaml -i inventory/inventory.yaml [--limit server-225-win]
# community.windows has no win_firewall_rule_info; we gather via win_powershell and assert.

- name: Validate Windows firewall rules
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Gather WinRM HTTP firewall rule info
      ansible.windows.win_powershell:
        script: |
          $rule = Get-NetFirewallRule -Name 'WinRM-HTTP-In-TCP' -ErrorAction Stop
          $portFilter = $rule | Get-NetFirewallPortFilter
          [PSCustomObject]@{
            name = $rule.Name
            enabled = $rule.Enabled
            localport = $portFilter.LocalPort
          }
      register: winrm_rule_result

    - name: Assert WinRM HTTP rule exists and allows port 5985
      ansible.builtin.assert:
        that:
          - winrm_rule_result.output is defined
          - winrm_rule_result.output.enabled | default(false) | bool
          - winrm_rule_result.output.localport is defined
          - (winrm_rule_result.output.localport | list | first | default(winrm_rule_result.output.localport) | string) == "5985"
        fail_msg: "WinRM-HTTP-In-TCP firewall rule missing or port not 5985"

    - name: Gather OpenSSH (sshd) firewall rule info
      ansible.windows.win_powershell:
        script: |
          $rule = Get-NetFirewallRule -Name 'sshd-Server-In-TCP' -ErrorAction Stop
          $portFilter = $rule | Get-NetFirewallPortFilter
          [PSCustomObject]@{
            name = $rule.Name
            enabled = $rule.Enabled
            localport = $portFilter.LocalPort
          }
      register: sshd_rule_result

    - name: Assert sshd firewall rule exists and port matches win_ssh_port
      ansible.builtin.assert:
        that:
          - sshd_rule_result.output is defined
          - sshd_rule_result.output.localport is defined
          - (sshd_rule_result.output.localport | list | first | default(sshd_rule_result.output.localport) | string) == (win_ssh_port | default(22) | string)
        fail_msg: "sshd-Server-In-TCP firewall rule does not match win_ssh_port (expected {{ win_ssh_port | default(22) }})"
