---
# Access: enable OpenSSH on Windows (via WinRM), set up administrators_authorized_keys and controller key.
# Run after access_controller. Targets windows_hosts.
#
# Prerequisite: for hosts with hyperv_config.external_switch_enabled=true, run
# playbooks/hyperv_networking.yaml before this playbook. For full end-to-end
# provisioning in the correct order, use playbooks/provision_windows_host.yml.
#
# Commands:
#   Windows-only run (admin + user on Windows hosts):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win
#
#   Full access pipeline (controller + Windows + generated SSH surfaces):
#     ansible-playbook playbooks/access.yaml -i inventory/inventory.yaml
#
#   Admin only (OpenSSH, sshd, firewall, shell):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags admin
#
#   User only (user SSH keys):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags user
#
#   Debug diagnostics only:
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags debug
#
# Troubleshooting:
#   Run with --tags collect_windows_remote_access to trigger artifact collection
#   (WinRM, OpenSSH, firewall) alongside the normal identity run.
#   Artifacts land at: artifacts/troubleshooting/windows_remote_access/<host>/<timestamp>/
#   Or run the dedicated collector directly:
#     .venv/bin/ansible-playbook playbooks/troubleshoot/collect_windows_remote_access_artifacts.yaml \
#       -i inventory/inventory.yaml
#
# Linux guest access is not configured here. Once a Hyper-V Ubuntu guest exists
# and has realized SSH connection facts, its generated `-ubuntu` SSH surface is
# rendered by the controller pass in playbooks/access.yaml.
#
- name: Access - windows identity
  hosts: windows_hosts
  gather_facts: false

  pre_tasks:
    - name: Skip hosts without WinRM connection configuration
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'winrm'
      tags: [always]

  tasks:
    - name: Configure Windows identity
      ansible.builtin.include_role:
        name: access_identity_windows
      tags: [always]
