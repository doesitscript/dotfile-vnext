---
# Access: enable OpenSSH on Windows (via WinRM), set up administrators_authorized_keys and controller key.
# Run after access_controller. Targets windows_hosts.
#
# Prerequisite: for hosts that also own Hyper-V guest networking, run
# playbooks/configure_hyperv_windows_hosts.yaml first. For the canonical
# full-stack convergence in the correct order, use playbooks/site.yaml.
#
# Commands:
#   Windows-only run (admin + user on Windows hosts):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02
#
#   Explicit troubleshooting target outside windows_hosts:
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml \
#       -e access_windows_target=dev-workstation-win --limit dev-workstation-win
#
#   Full access pipeline (controller + Windows + generated SSH surfaces):
#     ansible-playbook playbooks/access.yaml -i inventory/inventory.yaml
#
#   Admin only (OpenSSH, sshd, firewall, shell):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02 --tags admin
#
#   User only (user SSH keys):
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02 --tags user
#
#   Debug diagnostics only:
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02 --tags debug
#
# Troubleshooting:
#   Run with --tags collect_windows_remote_access to trigger artifact collection
#   (WinRM, OpenSSH, firewall) alongside the normal identity run:
#     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml \
#       --limit hom-lab-ctl-hvh-02 --tags collect_windows_remote_access
#   Artifacts land at: artifacts/troubleshooting/windows_remote_access/<host>/<timestamp>/
#
#   Or run the dedicated collector directly (no lifecycle side effects):
#     ansible-playbook playbooks/troubleshoot/collect_windows_remote_access_artifacts.yaml \
#       -i inventory/inventory.yaml --limit hom-lab-ctl-hvh-02
#
# Linux guest access is partially configured here for Windows Hyper-V hosts:
# this role ensures the Windows host has a managed outbound SSH key/config for
# its companion Ubuntu guests. Guest-side authorization of that Windows-host
# key is applied by the Hyper-V Ubuntu VM lifecycle role after the guest is
# SSH-ready. Controller-side SSH config rendering still happens in
# playbooks/access.yaml or the canonical playbooks/site.yaml path.
#
- name: Access - windows identity
  hosts: "{{ access_windows_target | default('windows_hosts') }}"
  gather_facts: false

  pre_tasks:
    # WinRM was the original bootstrap transport; OpenSSH is now valid for steady-state
    # convergence once sshd is up (see hom-lab-ctl-hvh-02, dev-workstation-win).
    - name: Skip hosts without a Windows remote connection (WinRM or SSH)
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) not in ['winrm', 'ssh']
      tags: [always]

  tasks:
    - name: Configure Windows identity
      ansible.builtin.include_role:
        name: access_identity_windows
      tags: [always]

    - name: Collect Windows remote access troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: windows_remote_access.yml
      tags:
        - never
        - collect_windows_remote_access
