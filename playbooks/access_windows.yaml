---
# Access: enable OpenSSH on Windows (via WinRM), set up administrators_authorized_keys and controller key.
# Run after access_controller. Targets windows_hosts.
#
# Commands:
#   Full run (admin + user):  ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win
#   Admin only (main.yml):    ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags admin
#   User only (user.yml):     ansible-playbook playbooks/access_windows.yaml -i inventory/inventory.yaml --limit server-225-win --tags user
#
- name: Access - windows identity
  hosts: windows_hosts
  gather_facts: false

  roles:
    - access_identity_windows
