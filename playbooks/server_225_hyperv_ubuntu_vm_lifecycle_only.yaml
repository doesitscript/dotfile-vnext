---
# Fast VM-only control surface for the server-225 Hyper-V Ubuntu guest.
#
# Use this when controller identity, Hyper-V networking, and controller guest
# routing are already converged and you want a tight VM rebuild / lifecycle
# loop.
#
# The canonical full-stack entrypoint is playbooks/site.yaml.
#
# Commands:
#   Fast lifecycle loop:
#     ansible-playbook playbooks/server_225_hyperv_ubuntu_vm_lifecycle_only.yaml \
#       -i inventory/inventory.yaml --limit server-225-win
#
- name: Server-225 Hyper-V Ubuntu VM lifecycle only
  hosts: "{{ hyperv_ubuntu_vm_windows_host | default('server-225-win') }}"
  gather_facts: false
  tags: [hyperv_vm_lifecycle, collect_hyperv]

  tasks:
    - name: Ensure Hyper-V Ubuntu VM capability is in the requested lifecycle state
      ansible.builtin.include_role:
        name: hyperv_ubuntu_vm

    - name: Collect Hyper-V Ubuntu VM troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: hyperv_ubuntu_vm.yml
      tags:
        - never
        - collect_hyperv
