---
# MCP Servers: build container images + configure IDE clients.
#
# Two-phase pattern (same as docker.yaml):
#   1) Build images on WSL hosts (Docker engine)
#   2) Configure mcp.json on client hosts (Docker CLI)
#
# Commands:
#   ansible-playbook playbooks/mcp_servers.yaml
#   ansible-playbook playbooks/mcp_servers.yaml --limit mac-dev    # configure only
#   ansible-playbook playbooks/mcp_servers.yaml -e _force_mcp_rebuild=true

- name: MCP Servers - build container images
  hosts: wsl_hosts
  gather_facts: true
  ignore_unreachable: true

  tasks:
    - name: Build MCP server images on Docker host
      ansible.builtin.include_role:
        name: mcp_servers
        tasks_from: build.yml
      when: docker_engine_in_wsl | default(false)

- name: MCP Servers - configure IDE clients
  hosts: docker_clients
  gather_facts: true

  tasks:
    - name: Configure Cursor MCP server settings
      ansible.builtin.include_role:
        name: mcp_servers
        tasks_from: configure.yml
