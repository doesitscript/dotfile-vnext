---
# One-off: inventory + fact gather for Mac and server-225 to see where we're at.
# Run from Mac (repo root):
#   .venv/bin/ansible-playbook playbooks/sync_facts_mac_server225.yaml -i inventory/inventory.yaml
# If server-225-wsl SSH is not up yet, limit to WinRM + Mac only:
#   .venv/bin/ansible-playbook playbooks/sync_facts_mac_server225.yaml -i inventory/inventory.yaml --limit mac-dev,server-225-win
# Writes: facts/sync_report_mac_server225.json

- name: Show inventory (what the repo thinks) for Mac and server-225
  hosts: localhost
  gather_facts: false
  vars:
    inventory_hosts:
      - mac-dev
      - server-225-win
      - server-225-wsl
  tasks:
    - name: Inventory summary for {{ item }}
      ansible.builtin.debug:
        msg: |
          --- {{ item }} ---
          connection: {{ hostvars[item].ansible_connection | default('(not set)') }}
          ansible_host: {{ hostvars[item].ansible_host | default('(not set)') }}
          ansible_user: {{ hostvars[item].ansible_user | default('(not set)') }}
          ansible_port: {{ hostvars[item].ansible_port | default('(default)') }}
          physical_node: {{ hostvars[item].physical_node | default('(not set)') }}
          surface_type: {{ hostvars[item].surface_type | default('(not set)') }}
      loop: "{{ inventory_hosts }}"
      when: item in hostvars

- name: Gather facts from Mac and server-225 (and optionally server-225-wsl)
  hosts: mac_dev,server_225
  gather_facts: true
  become: false
  vars:
    facts_dir: "{{ playbook_dir }}/../facts"
    report_file: "{{ facts_dir }}/sync_report_mac_server225.json"
  tasks:
    - name: Build per-host summary (Unix and Windows)
      ansible.builtin.set_fact:
        host_summary:
          inventory_name: "{{ inventory_hostname }}"
          connection: "{{ ansible_connection }}"
          ansible_host: "{{ ansible_host | default('') }}"
          ansible_user: "{{ ansible_user | default('') }}"
          gathered_hostname: "{{ ansible_facts['hostname'] | default(ansible_facts['ansible_hostname'] | default('')) }}"
          gathered_fqdn: "{{ ansible_facts['fqdn'] | default(ansible_facts['ansible_fqdn'] | default('')) }}"
          os_family: "{{ ansible_facts['os_family'] | default(ansible_facts['ansible_os_family'] | default('')) }}"
          distribution: "{{ ansible_facts['distribution'] | default(ansible_facts['ansible_distribution'] | default('')) }}"
          distribution_version: "{{ ansible_facts['distribution_version'] | default(ansible_facts['ansible_distribution_version'] | default('')) }}"
          ip_addresses: "{{ ansible_facts['default_ipv4']['address'] if (ansible_facts.get('default_ipv4') and ansible_facts['default_ipv4'].get('address')) else (ansible_facts.get('ansible_ip_addresses') or []) }}"

    - name: Show gathered summary for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "{{ host_summary }}"

    - name: Ensure facts directory exists
      ansible.builtin.file:
        path: "{{ facts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Build combined sync report from all hosts in play
      ansible.builtin.set_fact:
        combined_sync_report: "{{ combined_sync_report | default({}) | combine({ item: hostvars[item].host_summary }) }}"
      loop: "{{ ansible_play_hosts }}"
      when: hostvars[item].host_summary is defined
      delegate_to: localhost
      run_once: true

    - name: Write combined sync report to {{ report_file }}
      ansible.builtin.copy:
        content: "{{ combined_sync_report | to_json(indent=2) }}"
        dest: "{{ report_file }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true

    - name: Sync report written
      ansible.builtin.debug:
        msg: "Report written to {{ report_file }}"
      delegate_to: localhost
      run_once: true
