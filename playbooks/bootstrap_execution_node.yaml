---
# Bootstrap execution node (Mac).
# Ensures local Ansible environment and SSH identity exist.
# Does NOT manage remote transport.
# ansible-playbook playbooks/bootstrap_execution_node.yaml -i inventory/inventory.yaml --limit mac-dev
# ansible-playbook playbooks/bootstrap_execution_node.yaml -i inventory/inventory.yaml --limit execution_nodes


- name: Bootstrap execution node
  hosts: execution_nodes
  gather_facts: false

  vars:
    ssh_dir: "{{ lookup('env','HOME') }}/.ssh"
    ansible_ssh_private_key_path: "{{ ssh_dir }}/id_ed25519_ansible"

  tasks:
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: "0700"

    - name: Ensure ansible SSH key pair exists
      community.crypto.openssh_keypair:
        path: "{{ ansible_ssh_private_key_path }}"
        type: ed25519
        state: present
        force: false

    - name: Display key location
      ansible.builtin.debug:
        msg: "Execution node SSH identity ensured at {{ ansible_ssh_private_key_path }}"
