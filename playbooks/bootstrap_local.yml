---
# Bootstrap local node (runs inside WSL on each Windows node)
# Sets up SSH, generates ansible SSH key pair, writes host_vars

# This playbook must run inside WSL on the server (e.g. invoked by bootstrap-ansible-local.ps1 after bootstrap-local.sh).
# Do not run from the Mac: use "fz bootstrap --limit mac-dev" on the Mac instead.
- name: Bootstrap local node (WSL side)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Override with -e bootstrap_node=<node-slug> when needed.
    physical_node: "{{ bootstrap_node | default(ansible_facts['hostname'] | lower) }}"
    repo_root: "{{ playbook_dir }}/.."
    facts_path_windows: "{{ repo_root }}/facts/{{ physical_node }}.json"
    host_vars_dir: "{{ repo_root }}/inventory/host_vars"
    windows_hostvars_path: "{{ host_vars_dir }}/{{ physical_node }}-win.yaml"
    wsl_hostvars_path: "{{ host_vars_dir }}/{{ physical_node }}-wsl.yaml"
    wsl_ssh_port: 22
    mac_public_key_path: "{{ playbook_dir }}/../bootstrap/mac_ssh_key.pub"
  tasks:
    - name: Fail if not running in WSL (this playbook is for server WSL only, not Mac)
      ansible.builtin.fail:
        msg: >-
          This playbook must run inside WSL on the server (e.g. via bootstrap-ansible-local.ps1).
          On the Mac use: ./bin/fz bootstrap --limit mac-dev
      when: ansible_facts['system'] != 'Linux'

    - name: Ensure host_vars directory exists
      ansible.builtin.file:
        path: "{{ host_vars_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Windows facts file exists for this node
      ansible.builtin.stat:
        path: "{{ facts_path_windows }}"
      register: windows_facts_file

    - name: Stop when Windows facts file is missing
      ansible.builtin.fail:
        msg: >-
          Missing facts file {{ facts_path_windows }}.
          Run one of these to create it:
          From Windows (Admin): .\bin\bootstrap-local.ps1 -FactsOnly
          From WSL: ./bin/fz collect-facts
          Or pass -e bootstrap_node=<node-slug>.
      when: not windows_facts_file.stat.exists

    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
      become: true

    - name: Enable and start SSH
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true
      become: true

    - name: Allow passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ lookup('env', 'USER') }}"
        content: |
          {{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD:ALL
        mode: "0440"
      become: true

    - name: Ensure sshd allows pubkey authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
      become: true

    - name: Ensure sshd allows password authentication (for josh with win_password)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication yes"
      become: true

    - name: Restart ssh service
      ansible.builtin.service:
        name: ssh
        state: restarted
      become: true

    - name: Check whether mac public key file exists
      ansible.builtin.stat:
        path: "{{ mac_public_key_path }}"
      register: mac_public_key_file

    - name: Ensure ~/.ssh directory exists for bootstrap user
      ansible.builtin.file:
        path: "/home/{{ ansible_facts['user_id'] }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
      become: true

    - name: Add localhost to known_hosts so SSH does not prompt for fingerprint
      ansible.builtin.shell: |
        ssh-keyscan -H 127.0.0.1 localhost 2>/dev/null >> "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts" || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install mac public key for bootstrap user
      ansible.posix.authorized_key:
        user: "{{ ansible_facts['user_id'] }}"
        key: "{{ lookup('file', mac_public_key_path) }}"
        state: present
      become: true
      when: mac_public_key_file.stat.exists

    # Ansible SSH key lives only on the execution node (Mac) at ~/.ssh/id_ed25519_ansible. Deploy to this WSL by running playbooks from the Mac (e.g. fz bootstrap --limit <win>, fz deploy main --limit <wsl>).
    - name: Display SSH setup summary
      ansible.builtin.debug:
        msg:
          - "SSH server configured and running"
          - "localhost is in known_hosts (no fingerprint prompt)"
          - "From this WSL use: ssh {{ ansible_facts['user_id'] }}@localhost"
          - "Host vars will be written with SSH connection info"
          - "Deploy Ansible key to this host by running playbooks from the Mac (key at ~/.ssh/id_ed25519_ansible on Mac)"

    - name: Read Windows facts JSON
      ansible.builtin.slurp:
        src: "{{ facts_path_windows }}"
      register: winfacts_raw

    - name: Parse Windows facts
      ansible.builtin.set_fact:
        winfacts: "{{ (winfacts_raw.content | b64decode) | from_json }}"

    - name: Choose host IP from Windows facts
      ansible.builtin.set_fact:
        host_ip: "{{ winfacts.windows.host_ip }}"

    - name: Read existing Windows host_vars to preserve credentials
      ansible.builtin.slurp:
        src: "{{ windows_hostvars_path }}"
      register: existing_win_hostvars_raw
      ignore_errors: true

    - name: Parse existing Windows host_vars
      ansible.builtin.set_fact:
        existing_win_hostvars: "{{ (existing_win_hostvars_raw.content | default('') | b64decode | default('') | regex_replace('\\x00', '')) | from_yaml }}"
      when: existing_win_hostvars_raw is defined and existing_win_hostvars_raw.content is defined

    - name: Set win_user for templating
      ansible.builtin.set_fact:
        win_user: "{{ existing_win_hostvars.win_user | default('josh') }}"
      when: existing_win_hostvars is defined

    - name: Set default win_user when existing file missing
      ansible.builtin.set_fact:
        win_user: "josh"
      when: win_user is not defined

    - name: Set win_password for templating
      ansible.builtin.set_fact:
        win_password: "{{ existing_win_hostvars.win_password | default('') }}"
      when: existing_win_hostvars is defined

    - name: Set default win_password when existing file missing
      ansible.builtin.set_fact:
        win_password: ""
      when: win_password is not defined

    - name: Set WSL user password from win_password (so ssh josh@localhost works with password)
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        password: "{{ win_password | password_hash('sha512') }}"
        update_password: always
      become: true
      when: win_password is defined and win_password | length > 0

    - name: Choose WSL user
      ansible.builtin.set_fact:
        wsl_user: "{{ ansible_facts['user_id'] }}"

    - name: Choose WSL distro name
      ansible.builtin.shell: |
        (wsl.exe -l -q 2>/dev/null || true) | head -n 1 | tr -d '\r'
      register: distro_name
      changed_when: false

    # Strip control characters so generated YAML is valid (no binary/encoding issues on Windows mount)
    - name: Set clean WSL distro name for template
      ansible.builtin.set_fact:
        distro_name_clean: "{{ (distro_name.stdout | default('')) | regex_replace('[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]', '') | trim }}"

    - name: Set clean host_ip for template
      ansible.builtin.set_fact:
        host_ip_clean: "{{ (host_ip | default('')) | regex_replace('[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]', '') | trim }}"

    - name: Set clean wsl_user for template
      ansible.builtin.set_fact:
        wsl_user_clean: "{{ (wsl_user | default('')) | regex_replace('[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]', '') | trim }}"

    - name: Set clean physical_node for template
      ansible.builtin.set_fact:
        physical_node_clean: "{{ (physical_node | default('')) | regex_replace('[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]', '') | trim }}"

    - name: Read existing WSL host_vars to preserve credentials
      ansible.builtin.slurp:
        src: "{{ wsl_hostvars_path }}"
      register: existing_wsl_hostvars_raw
      ignore_errors: true

    - name: Parse existing WSL host_vars (strip control chars so broken/encoding issues can be read)
      ansible.builtin.set_fact:
        existing_wsl_hostvars: "{{ (existing_wsl_hostvars_raw.content | default('') | b64decode | default('') | regex_replace('[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]', '')) | from_yaml }}"
      when: existing_wsl_hostvars_raw is defined and existing_wsl_hostvars_raw.content is defined

    - name: Set wsl_password for templating
      ansible.builtin.set_fact:
        wsl_password: "{{ existing_wsl_hostvars.wsl_password }}"
      when: existing_wsl_hostvars is defined and (existing_wsl_hostvars.wsl_password | default('')) | length > 0

    - name: Write host_vars for Windows surface
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/host_vars_windows.yml.j2"
        dest: "{{ windows_hostvars_path }}"
        mode: "0644"

    - name: Write host_vars for WSL surface (clean vars to avoid control chars / encoding issues)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/host_vars_wsl.yml.j2"
        dest: "{{ wsl_hostvars_path }}"
        mode: "0644"
      vars:
        host_ip: "{{ host_ip_clean }}"
        wsl_user: "{{ wsl_user_clean }}"
        physical_node: "{{ physical_node_clean }}"

    - name: Display bootstrap completion summary
      ansible.builtin.debug:
        msg:
          - "Bootstrap complete for node: {{ physical_node }}"
          - "SSH connection info collected and stored in: {{ wsl_hostvars_path }}"
          - "SSH host: {{ host_ip }}"
          - "SSH user: {{ wsl_user }}"
          - "SSH port: {{ wsl_ssh_port }}"
          - "Deploy Ansible key from Mac (~/.ssh/id_ed25519_ansible.pub) by running playbooks from the Mac."
          - "Mac can now connect using: ansible {{ physical_node }}-wsl -m ping -i inventory/inventory.yaml"
