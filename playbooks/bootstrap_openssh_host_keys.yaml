---
# Generate OpenSSH host keys and store them in vault (for Windows).
# Run on the Mac (control node). Keys are written to bootstrap/openssh_host_keys/ then slurped
# into vault/openssh_host_keys.vault.yml (encrypted). Bootstrap Windows playbook deploys from vault.
# Usage: ansible-playbook playbooks/bootstrap_openssh_host_keys.yaml
#        ansible-playbook playbooks/bootstrap_openssh_host_keys.yaml -e force=true  # regenerate
# Requires: --ask-vault-pass or ANSIBLE_VAULT_PASSWORD_FILE when encrypting.
- name: Generate OpenSSH host keys for Windows and store in vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    force_flag: "{{ force | default(false) | bool }}"
    keys_dir: "{{ repo_root }}/bootstrap/openssh_host_keys"
    openssh_host_keys_vault_path: "{{ repo_root }}/vault/openssh_host_keys.vault.yml"
  tasks:
    - name: Run bootstrap-openssh-host-keys script
      ansible.builtin.shell: "{{ repo_root }}/bin/bootstrap-openssh-host-keys.sh {{ '--force' if force_flag else '' }}"
      args:
        executable: /bin/bash
      register: script_run
      changed_when: script_run.rc == 0
      failed_when: script_run.rc != 0

    - name: Stat OpenSSH host key files (ed25519)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ keys_dir }}/ssh_host_ed25519_key"
        - "{{ keys_dir }}/ssh_host_ed25519_key.pub"
      register: host_key_stats_ed25519

    - name: Stat OpenSSH host key files (rsa)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ keys_dir }}/ssh_host_rsa_key"
        - "{{ keys_dir }}/ssh_host_rsa_key.pub"
      register: host_key_stats_rsa

    - name: Ensure all four host key files exist
      ansible.builtin.assert:
        that:
          - host_key_stats_ed25519.results[0].stat.exists
          - host_key_stats_ed25519.results[1].stat.exists
          - host_key_stats_rsa.results[0].stat.exists
          - host_key_stats_rsa.results[1].stat.exists
        fail_msg: "One or more host key files missing under {{ keys_dir }}. Re-run the script."

    - name: Slurp OpenSSH host key files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ keys_dir }}/ssh_host_ed25519_key"
        - "{{ keys_dir }}/ssh_host_ed25519_key.pub"
        - "{{ keys_dir }}/ssh_host_rsa_key"
        - "{{ keys_dir }}/ssh_host_rsa_key.pub"
      register: host_key_slurps

    - name: Set decoded host key contents for vault template
      ansible.builtin.set_fact:
        host_key_ed25519_content: "{{ (host_key_slurps.results[0].content | b64decode) }}"
        host_key_ed25519_pub_content: "{{ (host_key_slurps.results[1].content | b64decode) }}"
        host_key_rsa_content: "{{ (host_key_slurps.results[2].content | b64decode) }}"
        host_key_rsa_pub_content: "{{ (host_key_slurps.results[3].content | b64decode) }}"

    - name: Ensure vault directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}/vault"
        state: directory
        mode: "0755"

    - name: Write OpenSSH host keys vault file (plain, before encrypt)
      ansible.builtin.template:
        src: "openssh_host_keys_vault.yml.j2"
        dest: "{{ openssh_host_keys_vault_path }}"
        mode: "0644"

    - name: Check if vault file already exists
      ansible.builtin.stat:
        path: "{{ openssh_host_keys_vault_path }}"
      register: vault_file_stat

    - name: Decrypt existing vault file if forcing regeneration
      ansible.builtin.shell: |
        cd "{{ repo_root }}" && .venv/bin/ansible-vault decrypt vault/openssh_host_keys.vault.yml
      args:
        executable: /bin/bash
      when: force_flag | bool and vault_file_stat.stat.exists
      ignore_errors: true

    - name: Encrypt OpenSSH host keys vault file
      ansible.builtin.shell: |
        cd "{{ repo_root }}" && .venv/bin/ansible-vault encrypt vault/openssh_host_keys.vault.yml
      args:
        executable: /bin/bash

    - name: OpenSSH host keys stored in vault
      ansible.builtin.debug:
        msg: "Host keys written to {{ openssh_host_keys_vault_path }} (encrypted). Deploy to Windows with: ./bin/fz bootstrap --limit server-225-win"
