---
# Validate AI agent client profile declarations against published gateway and
# model-catalog identity (lane ∪ aliases ∪ client_model_id).
#
# Catalog identity contract:
#   inventory/group_vars/model_catalog/LANE-IDENTITY.md
#
# Usage:
#   bin/codex-env ansible-playbook playbooks/validate_ai_agent_client_profiles.yaml \
#     -i inventory/inventory.yaml

- name: Validate AI agent client profile declarations
  hosts: execution_nodes
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/model_catalog/manifest.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/all/ai_agent_profiles.yml"
    # Traefik route registry SSOT (directory group_vars, not a flat k3s_cluster.yaml)
    - "{{ playbook_dir }}/../inventory/group_vars/k3s_cluster/main.yml"
  vars:
    _required_agent_roles:
      - planner
      - coder
      - tester
      - reviewer
      - documenter
      - steward
    _required_trace_metadata_keys:
      - agent_role
      - model_lane
      - routing_policy
      - context_class
  tasks:
    - name: Resolve model catalog reference names for agent profile validation
      ansible.builtin.include_tasks: tasks/resolve_model_catalog_reference_names.yml

    - name: Resolve declared AI agent gateway route from Traefik registry
      ansible.builtin.set_fact:
        _ai_agent_gateway_routes: >-
          {{
            k3s_traefik_routes_entries
            | selectattr('netbox_service_slug', 'equalto', ai_agent_client_profiles.gateway.service_slug)
            | list
          }}
      changed_when: false

    - name: Assert declared AI agent gateway service slug resolves to one published route
      ansible.builtin.assert:
        that:
          - _ai_agent_gateway_routes | length == 1
        fail_msg: >-
          AI agent gateway service slug {{
            ai_agent_client_profiles.gateway.service_slug
          }} must resolve to exactly one published K3s ingress route.

    - name: Derive expected AI agent gateway OpenAI base URL from published route
      ansible.builtin.set_fact:
        _ai_agent_gateway_route: "{{ _ai_agent_gateway_routes | first }}"
        _ai_agent_gateway_expected_openai_base_url: >-
          {{
            ai_agent_client_profiles.gateway.openai_scheme
            ~ '://'
            ~ (_ai_agent_gateway_routes | first).hostname
            ~ ai_agent_client_profiles.gateway.openai_api_path
          }}
      changed_when: false

    - name: Validate required agent role declarations
      ansible.builtin.assert:
        that:
          - item in ai_agent_client_profiles.roles
        fail_msg: "Missing AI agent client profile role: {{ item }}"
      loop: "{{ _required_agent_roles }}"

    - name: Validate trace metadata contract
      ansible.builtin.assert:
        that:
          - item in ai_agent_client_profiles.trace_metadata_keys
        fail_msg: "Missing AI agent trace metadata key: {{ item }}"
      loop: "{{ _required_trace_metadata_keys }}"

    - name: Validate client gateway resolves to the published LiteLLM gateway contract
      ansible.builtin.assert:
        that:
          - ai_agent_client_profiles.gateway.openai_scheme in ['http', 'https']
          - ai_agent_client_profiles.gateway.openai_api_path is match('^/')
          - _ai_agent_gateway_route.deployed_by_role == 'k3s_litellm_gateway'
          - _ai_agent_gateway_route.namespace == 'litellm'
          - _ai_agent_gateway_route.service_name == 'litellm'
          - ai_agent_client_profiles.gateway.openai_base_url == _ai_agent_gateway_expected_openai_base_url
        fail_msg: >-
          AI agent clients must target the published LiteLLM gateway contract derived from
          service slug {{ ai_agent_client_profiles.gateway.service_slug }}.

    - name: Validate every agent default and alternate lane resolves in the model catalog
      ansible.builtin.assert:
        that:
          - item.value.default_lane in model_catalog_reference_names
          - item.value.alternate_lane in model_catalog_reference_names
        fail_msg: >-
          AI agent role {{ item.key }} references unresolved lanes:
          default={{ item.value.default_lane }},
          alternate={{ item.value.alternate_lane }}.
          Register a catalog row whose lane equals the LiteLLM client model id
          (see inventory/group_vars/model_catalog/LANE-IDENTITY.md). Purpose
          labels are not accepted.
      loop: "{{ ai_agent_client_profiles.roles | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Summarize validated AI agent profile contract
      ansible.builtin.debug:
        msg:
          gateway: "{{ ai_agent_client_profiles.gateway.openai_base_url }}"
          gateway_service_slug: "{{ ai_agent_client_profiles.gateway.service_slug }}"
          gateway_route_key: "{{ _ai_agent_gateway_route.route_key }}"
          gateway_deployed_by_role: "{{ _ai_agent_gateway_route.deployed_by_role }}"
          roles: "{{ ai_agent_client_profiles.roles.keys() | list }}"
          catalog_reference_name_count: "{{ model_catalog_reference_names | length }}"
          trace_metadata_keys: "{{ ai_agent_client_profiles.trace_metadata_keys }}"
