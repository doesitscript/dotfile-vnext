---
# Compatibility wrapper: K3s-only VHDX move now uses the shared list playbook.
# Prefer playbooks/hyperv_move_vm_storage.yaml with hyperv_vm_storage_move_targets.
#
# Preview / apply:
#   ansible-playbook playbooks/hyperv_move_k3s_vm_storage.yaml \
#     -i inventory/inventory.yaml --limit HOM-LAB-HVH-02 [--check]
#
- name: Hyper-V K3s VM storage relocation (wrapper seed)
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Seed K3s-only move target when list unset
      ansible.builtin.set_fact:
        hyperv_vm_storage_move_targets:
          - vm_name: "{{ hyperv_ubuntu_k3s_vm_hostname }}"
            vhdx_path: "{{ hyperv_ubuntu_k3s_vm_host_vhdx_path }}"
            start_after: true
      when:
        - (hyperv_vm_storage_move_targets | default([]) | length) == 0
        - hyperv_ubuntu_k3s_vm_hostname | default('') | length > 0
        - hyperv_ubuntu_k3s_vm_host_vhdx_path | default('') | length > 0

- name: Import shared Hyper-V VM storage relocation
  ansible.builtin.import_playbook: hyperv_move_vm_storage.yaml
