---
# Verify entire fabric
# Targets: Mixed (Windows checks on -win, Linux checks on -wsl, endpoints from mac-dev)
# Purpose: Verify all nodes are correctly configured and services are running

- name: Verify Windows hosts
  hosts: windows_hosts
  become: false
  roles:
    - role: common/baseline
    - role: common/health_checks
    - role: common/secrets_verify
    - role: common/docker_runtime_verify
    - role: common/volume_location_verify
    - role: common/gpu_verify
    - role: common/scheduled_task_verify

- name: Verify WSL hosts
  hosts: wsl_hosts
  become: false
  roles:
    - role: common/baseline
    - role: common/health_checks
    - role: common/secrets_verify
    - role: common/docker_runtime_verify
    - role: common/volume_location_verify
    - role: common/gpu_verify

- name: Verify macOS host
  hosts: mac-dev
  become: false
  roles:
    - role: common/baseline
    - role: common/health_checks
    - role: common/endpoint_verify



