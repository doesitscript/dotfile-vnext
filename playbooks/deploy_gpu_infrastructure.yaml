---
- name: Gather GPU-P readiness evidence on all Windows Server 2025 GPU hosts
  hosts: "windows_server_2025:&windows_nvidia_gpu_hosts"
  gather_facts: false
  roles:
    - role: hyperv_gpu_p_host_precheck
      vars:
        hyperv_gpu_p_host_precheck_require_iov_support: >-
          {{
            ((runtime_planes | default({})).get('hyperv_gpu_partitioning', {})).get('enabled', false)
            | bool
          }}
        hyperv_gpu_p_host_precheck_require_partitionable_gpu: >-
          {{
            ((runtime_planes | default({})).get('hyperv_gpu_partitioning', {})).get('enabled', false)
            | bool
          }}
      tags:
        - hyperv_gpu_p_host_precheck
        - gpu_infra
        - ai_ml_platform

- name: Ensure Hyper-V GPU partition is attached on active GPU-P Windows hosts
  hosts: "windows_server_2025:&hyperv_gpu_partition_enabled_hosts"
  gather_facts: false
  roles:
    - role: hyperv_gpu_partition_adapter
      vars:
        hyperv_gpu_partition_adapter_vm_name: >-
          {{
            hyperv_ubuntu_k3s_vm_hostname
            | default(hyperv_ubuntu_k3s_vm_inventory_host)
          }}
      tags:
        - hyperv_gpu_partition_adapter
        - gpu_infra
        - ai_ml_platform

- name: Install guest-side NVIDIA runtime packages on derived K3s GPU guests
  hosts: "container_orchestrator_k3s:&gpu_workload_nodes"
  gather_facts: false
  become: true
  roles:
    - role: k3s_nvidia_runtime
      tags:
        - k3s_nvidia_runtime
        - gpu_infra
        - ai_ml_platform

- name: Label derived K3s GPU nodes for NVIDIA workloads
  hosts: "container_orchestrator_k3s:&gpu_workload_nodes"
  gather_facts: false
  become: true
  roles:
    - role: k3s_node_config
      tags:
        - k3s_node_config
        - gpu_infra
        - ai_ml_platform

- name: Deploy NVIDIA device plugin to derived K3s GPU clusters
  hosts: "container_orchestrator_k3s:&gpu_workload_nodes"
  gather_facts: false
  become: true
  roles:
    - role: k3s_nvidia_device_plugin
      tags:
        - k3s_nvidia_device_plugin
        - gpu_infra
        - ai_ml_platform

- name: Validate derived K3s GPU infrastructure prerequisites
  hosts: "container_orchestrator_k3s:&gpu_workload_nodes"
  gather_facts: false
  become: false

  roles:
    - role: k3s_node_gpu_prereqs
      tags:
        - k3s_node_gpu_prereqs
        - gpu_infra
        - ai_ml_platform
