---
# Canonical full-stack entrypoint for the active lab stack.
#
# This playbook is the top-level desired-state path:
#   1. Windows base
#   2. Hyper-V networking
#   3. Access / identity surfaces
#   4. Controller route to the guest subnet
#   5. Hyper-V Ubuntu guest lifecycle for opted-in Windows hosts
#   6. Controller SSH config refresh after guest lifecycle
#   7. Docker engine / client verification
#
# Narrower playbooks remain available for faster loops and troubleshooting:
#   - playbooks/provision_windows_host.yml              — Windows baseline only
#   - playbooks/hyperv_ubuntu_vm.yaml                   — guest-oriented orchestration
#   - playbooks/hyperv_ubuntu_vm_lifecycle_only.yaml
#                                                     — fast VM reinstall loop
#   - playbooks/access.yaml                             — identity/access only
#   - playbooks/docker.yaml                             — Docker only
#
# Commands:
#   Full active-stack converge:
#     ansible-playbook playbooks/site.yaml -i inventory/inventory.yaml
#
#   Limit to one physical node stack:
#     ansible-playbook playbooks/site.yaml -i inventory/inventory.yaml \
#       --limit 'execution_nodes,network-server-win,network-server-ubuntu,mac-dev'
#
- name: Site - Windows base
  import_playbook: windows_base.yml

- name: Site - Hyper-V networking
  import_playbook: hyperv_networking.yaml

- name: Site - access surfaces
  import_playbook: access.yaml

- name: Site - route guest private subnet from the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  tasks:
    - name: Ensure the controller can route to the Hyper-V guest subnet
      ansible.builtin.include_role:
        name: hyperv_guest_route_mac
      when: (hyperv_guest_route_mac_state | default('absent')) == 'present'

- name: Site - Hyper-V Ubuntu guest lifecycle
  import_playbook: hyperv_ubuntu_vm_lifecycle_only.yaml

- name: Site - refresh controller SSH client config after guest lifecycle
  hosts: execution_nodes
  connection: local
  gather_facts: true

  tasks:
    - name: Generate SSH client config from deployed targets
      ansible.builtin.include_role:
        name: access_identity_controller
        tasks_from: ssh_config.yml

- name: Site - Docker surfaces
  import_playbook: docker.yaml
