---
# Canonical full-stack entrypoint for the active lab stack.
#
# This playbook is the top-level desired-state path:
#   1. Windows base
#   2. Access / identity surfaces
#   3. Docker Ubuntu VM lifecycle for opted-in Windows hosts
#   4. Docker engine / client verification
#
# Narrower playbooks remain available for faster loops and troubleshooting:
#   - playbooks/provision_windows_host.yml              — Windows baseline only
#   - playbooks/hyperv_ubuntu_docker_vm.yaml            — Docker VM orchestration
#   - playbooks/access.yaml                             — identity/access only
#   - playbooks/docker.yaml                             — Docker only
#
# Commands:
#   Full active-stack converge:
#     ansible-playbook playbooks/site.yaml -i inventory/inventory.yaml
#
#   Staged rollout / troubleshooting limit:
#     Only use --limit when intentionally narrowing the otherwise scalable
#     full active-stack converge.
#     ansible-playbook playbooks/site.yaml -i inventory/inventory.yaml \
#       --limit 'network-server-win,nsrv-dkr-01'
#
- name: Site - Windows base
  import_playbook: windows_base.yml

- name: Site - access surfaces
  import_playbook: access.yaml

- name: Site - Hyper-V Docker Ubuntu guest lifecycle
  import_playbook: hyperv_ubuntu_docker_vm.yaml

- name: Site - Docker surfaces
  import_playbook: docker.yaml
