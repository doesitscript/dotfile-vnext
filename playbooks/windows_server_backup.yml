---
# Apply the Windows Server Backup baseline to managed Windows hosts.
#
# Commands:
#   Preview first:
#     Read-only inspection. Shows eligibility, current backup state, whether a
#     backup job is running, and what apply would do next. Does not mutate.
#     Technically this works because preview tasks are tagged
#     `never,backup_preview`, so they run only when that tag is requested.
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_preview
#
#   First target / first test:
#     Real lifecycle apply. Enforces present/absent and may seed or reconcile
#     automatic backup state when the host needs it.
#     A plain playbook run reaches this path because apply tasks are part of the
#     default execution set unless you filter to preview-only tags.
#     ansible-playbook playbooks/windows_server_backup.yml --limit hom-lab-ctl-hvh-01
#
#   Manual backup trigger with generated name/description:
#     ansible-playbook playbooks/windows_server_backup.yml --limit hom-lab-ctl-hvh-01 -e windows_server_backup_manual_run_now=true
#
#   Manual backup trigger with custom description:
#     ansible-playbook playbooks/windows_server_backup.yml \
#       --limit hom-lab-ctl-hvh-01 \
#       -e windows_server_backup_manual_run_now=true \
#       -e 'windows_server_backup_manual_description=Before storage stack refactor'
#
#   Later, when both Windows hosts are configured:
#     ansible-playbook playbooks/windows_server_backup.yml
#
#   Change the automatic interval for a run:
#     ansible-playbook playbooks/windows_server_backup.yml \
#       --limit hom-lab-ctl-hvh-01 \
#       -e windows_server_backup_automatic_interval_days=21
#
#   Remove the capability from a host after setting
#   windows_server_backup_state=absent in inventory:
#     ansible-playbook playbooks/windows_server_backup.yml \
#       --limit hom-lab-ctl-hvh-01
#
- name: Classify Windows Server Backup policy scope
  hosts: all
  gather_facts: false

  tasks:
    - name: Derive Windows Server Backup policy inputs
      ansible.builtin.set_fact:
        windows_server_backup_candidate: >-
          {{ (surface_type | default('')) == 'windows_host' }}
        windows_server_backup_metadata_eligible: >-
          {{
            (operation_model | default('')) == 'service'
            and (management_boundary | default('')) == 'infra_managed'
            and (availability_expectation | default('')) == 'expected_continuous'
          }}
        windows_server_backup_should_manage: >-
          {{
            (surface_type | default('')) == 'windows_host'
            and (operation_model | default('')) == 'service'
            and (management_boundary | default('')) == 'infra_managed'
            and (availability_expectation | default('')) == 'expected_continuous'
          }}
        windows_server_backup_lifecycle_ready: >-
          {{ (windows_server_backup_state | default('unset')) in ['present', 'absent'] }}
      changed_when: false
      tags:
        - always

    - name: Group Windows Server Backup candidate hosts
      ansible.builtin.group_by:
        key: >-
          windows_server_backup_candidate_{{
            windows_server_backup_candidate | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

    - name: Group Windows Server Backup metadata-eligible hosts
      ansible.builtin.group_by:
        key: >-
          windows_server_backup_metadata_eligible_{{
            windows_server_backup_metadata_eligible | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

    - name: Group Windows Server Backup policy-managed hosts
      ansible.builtin.group_by:
        key: >-
          windows_server_backup_should_manage_{{
            windows_server_backup_should_manage | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

- name: Preview Windows backup baseline eligibility from inventory metadata
  hosts: localhost
  gather_facts: false
  vars:
    windows_server_backup_preview_hosts: >-
      {{ query('inventory_hostnames', 'windows_server_backup_candidate_true') }}

  tasks:
    - name: Summarize Windows backup baseline eligibility
      ansible.builtin.debug:
        msg:
          - "Host: {{ item }}"
          - "Surface type: {{ hostvars[item]['surface_type'] | default('unset') }}"
          - "Operation model: {{ hostvars[item]['operation_model'] | default('unset') }}"
          - "Management boundary: {{ hostvars[item]['management_boundary'] | default('unset') }}"
          - "Availability expectation: {{ hostvars[item]['availability_expectation'] | default('unset') }}"
          - "Windows candidate: {{ hostvars[item]['windows_server_backup_candidate'] | default(false) }}"
          - "Metadata eligible: {{ hostvars[item]['windows_server_backup_metadata_eligible'] | default(false) }}"
          - "Derived policy should manage: {{ hostvars[item]['windows_server_backup_should_manage'] | default(false) }}"
          - >-
            Requested state: {{
              hostvars[item]['windows_server_backup_state'] | default('unset')
            }}
          - "Lifecycle state ready: {{ hostvars[item]['windows_server_backup_lifecycle_ready'] | default(false) }}"
          - >-
            Will apply on normal run: {{
              (hostvars[item]['windows_server_backup_should_manage'] | default(false))
              and (hostvars[item]['windows_server_backup_lifecycle_ready'] | default(false))
            }}
      loop: "{{ windows_server_backup_preview_hosts }}"
      tags:
        - never
        - backup_preview

- name: Preview and apply Windows Server Backup baseline
  hosts: windows_server_backup_should_manage_true
  gather_facts: false

  tasks:
    - name: Preview Windows backup baseline
      ansible.builtin.include_role:
        name: windows_server_backup
        tasks_from: preview.yml
        apply:
          tags:
            - backup_preview
      tags:
        - never
        - backup_preview

    - name: Apply Windows backup baseline
      ansible.builtin.include_role:
        name: windows_server_backup
        apply:
          tags:
            - backup_apply
      tags:
        - backup_apply
