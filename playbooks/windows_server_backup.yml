---
# Apply the Windows Server Backup baseline to managed Windows hosts.
#
# Commands:
#   Preview first:
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_preview
#
#   First target / first test:
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_apply --limit network-server-win
#
#   Manual backup trigger with generated name/description:
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_apply --limit network-server-win -e windows_server_backup_manual_run_now=true
#
#   Manual backup trigger with custom description:
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_apply \
#       --limit network-server-win \
#       -e windows_server_backup_manual_run_now=true \
#       -e 'windows_server_backup_manual_description=Before storage stack refactor'
#
#   Later, when both Windows hosts are configured:
#     ansible-playbook playbooks/windows_server_backup.yml --tags backup_apply
#
#   Change the automatic interval for a run:
#     ansible-playbook playbooks/windows_server_backup.yml \
#       --tags backup_apply \
#       --limit network-server-win \
#       -e windows_server_backup_automatic_interval_days=21
#
#   Remove the capability from a host after setting
#   windows_server_backup_state=absent in inventory:
#     ansible-playbook playbooks/windows_server_backup.yml \
#       --tags backup_apply \
#       --limit network-server-win
#
- name: Preview Windows backup baseline eligibility from inventory metadata
  hosts: localhost
  gather_facts: false
  vars:
    windows_server_backup_preview_hosts: >-
      {{ query('inventory_hostnames', 'windows_hosts:dev_3090:dev_workstation') }}

  tasks:
    - name: Summarize Windows backup baseline eligibility
      ansible.builtin.debug:
        msg:
          - "Host: {{ item }}"
          - "Surface type: {{ hostvars[item]['surface_type'] | default('unset') }}"
          - "System usage class: {{ hostvars[item]['system_usage_class'] | default('unset') }}"
          - "Availability expectation: {{ hostvars[item]['availability_expectation'] | default('unset') }}"
          - "Automation management model: {{ hostvars[item]['automation_management_model'] | default('unset') }}"
          - >-
            Metadata eligible: {{
              (hostvars[item]['surface_type'] | default('')) == 'windows_host'
              and (hostvars[item]['system_usage_class'] | default('')) == 'managed_service_node'
              and (hostvars[item]['availability_expectation'] | default('')) == 'expected_continuous'
              and (hostvars[item]['automation_management_model'] | default('')) == 'infrastructure_managed'
            }}
          - >-
            Requested state: {{
              hostvars[item]['windows_server_backup_state'] | default('absent')
            }}
          - >-
            Scheduled for role run: {{
              (
                (hostvars[item]['surface_type'] | default('')) == 'windows_host'
                and (hostvars[item]['system_usage_class'] | default('')) == 'managed_service_node'
                and (hostvars[item]['availability_expectation'] | default('')) == 'expected_continuous'
                and (hostvars[item]['automation_management_model'] | default('')) == 'infrastructure_managed'
                and ('windows_server_backup_state' in hostvars[item])
              )
            }}
      loop: "{{ windows_server_backup_preview_hosts }}"
      tags:
        - backup_preview

- name: Preview and apply Windows Server Backup baseline
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Preview Windows backup baseline
      ansible.builtin.include_role:
        name: windows_server_backup
        tasks_from: preview.yml
        apply:
          tags:
            - backup_preview
      tags:
        - backup_preview

    - name: Apply Windows backup baseline
      ansible.builtin.include_role:
        name: windows_server_backup
        apply:
          tags:
            - backup_apply
      when: "'windows_server_backup_state' in hostvars[inventory_hostname]"
      tags:
        - never
        - backup_apply
