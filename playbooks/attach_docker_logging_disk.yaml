---
# Create and attach the Docker VM logging VHDX on the shared LOGS-HOST SSD.
# Guest filesystem initialization is intentionally a separate step after the
# stable virtual-disk identity is discovered.
- name: Attach Docker guest logging VHDX
  hosts: windows_hosts
  gather_facts: false
  tags: [docker_logging_storage, hyperv_vm_data_disk]
  pre_tasks:
    - name: Require explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
        fail_msg: "Use --limit HOM-LAB-HVH-02 for the Docker logging VHDX."
      run_once: true
      tags: [always]
  tasks:
    - name: Create and attach Docker logging disk
      ansible.builtin.include_role:
        name: hyperv_vm_data_disk
      vars:
        hyperv_vm_data_disk_state: present
        hyperv_vm_data_disk_apply: true
        hyperv_vm_data_disk_vm_name: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.vm_name }}"
        hyperv_vm_data_disk_vhdx_path: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.vhdx_path }}"
        hyperv_vm_data_disk_size_gib: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.size_gib }}"
        hyperv_vm_data_disk_type: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.type }}"
        hyperv_vm_data_disk_host_reserve_gib: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.host_reserve_gib }}"
        hyperv_vm_data_disk_controller_number: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.controller_number }}"
        hyperv_vm_data_disk_controller_location: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_docker_logging_disk.controller_location }}"
        hyperv_vm_data_disk_backup_evidence_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/implementation-receipt.md
        hyperv_vm_data_disk_authority_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
        hyperv_vm_data_disk_detach_authorized: true
