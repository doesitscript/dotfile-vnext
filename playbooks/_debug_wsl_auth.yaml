---
- name: Debug SSH key gen on Windows
  hosts: network-server-win
  gather_facts: false
  tasks:
    - name: Clean up existing test key
      ansible.windows.win_powershell:
        script: |
          $keyPath = "$env:USERPROFILE\.ssh\id_ed25519"
          if (Test-Path $keyPath) { Remove-Item $keyPath, "$keyPath.pub" -Force }
          $Ansible.Result = 'cleaned'

    - name: Test cmd /c ssh-keygen -N empty string via cmd
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $keyPath = "$env:USERPROFILE\.ssh\id_ed25519"
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.ssh" -Force | Out-Null
          $escapedPath = $keyPath -replace '"', '""'
          $out = cmd /c "ssh-keygen -t ed25519 -f ""$escapedPath"" -N """" -q 2>&1"
          $Ansible.Changed = $true
          $Ansible.Result = @{exit = $LASTEXITCODE; pub_exists = (Test-Path "$keyPath.pub"); out = ($out -join '|')}
