---
# Docker Engine — install Docker Engine inside WSL distros.
#
# Architecture: ALL tasks delegate to the companion Windows host via WinRM and
# execute inside WSL through wsl.exe. No direct SSH connection to the WSL host
# is ever needed, which eliminates all WSL idle-shutdown timing issues entirely.
#
# wsl.exe auto-starts the distro on demand — no separate wake step required.
# A single wsl.exe session running the install script keeps WSL alive for the
# full duration of apt-get download + package installation (can be several min).
#
# Idempotent: skips installation when dockerd is already present in the distro.
#
# Commands:
#   ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml
#   ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml --limit server-225-wsl

- name: Docker Engine - install in WSL distros
  hosts: wsl_hosts
  gather_facts: false
  become: false

  tasks:
    # Write the bash install script to the Windows temp directory.
    # win_copy with a YAML content block avoids all PowerShell/bash quoting
    # conflicts (bash $() and ${} substitutions are literal in YAML and are
    # never evaluated by PowerShell). Jinja2 vars resolve from the WSL host context.
    - name: Write Docker bootstrap script to Windows temp dir
      ansible.windows.win_copy:
        content: |
          #!/bin/bash
          set -e
          rm -f /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          rm -f /etc/apt/keyrings/docker.asc
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          ARCH=$(dpkg --print-architecture)
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq
          apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          usermod -aG docker {{ wsl_user | default(ansible_user) }}
          systemctl enable docker
          systemctl start docker
        dest: 'C:\Windows\Temp\ansible-docker-setup.sh'
      delegate_to: "{{ physical_node }}-win"
      become: false
      ignore_unreachable: true
      ignore_errors: true
      when:
        - physical_node is defined
        - docker_engine_in_wsl | default(false)
      tags: [docker, docker-engine]

    # Run the bootstrap script via a single wsl.exe call.
    # wsl.exe auto-starts the distro if it is currently shut down.
    # The single session keeps WSL alive for the full apt install duration —
    # the WSL 15 s idle-shutdown timer only fires after wsl.exe exits.
    - name: Bootstrap Docker Engine in WSL via Windows companion
      ansible.windows.win_powershell:
        script: |
          $distro = '{{ wsl_distro | default("Ubuntu-24.04") }}'

          $dockerd = wsl.exe -d $distro -u root -- which dockerd
          if ($dockerd -match 'dockerd') {
            $Ansible.Changed = $false
            $Ansible.Result = 'Docker already installed — skipping bootstrap'
            return
          }

          # win_copy writes UTF-8 with BOM and CRLF line endings on Windows.
          # Bash does not handle BOM (it breaks the shebang) or CRLF endings.
          # Rewrite the file as UTF-8 NoBOM with LF endings before executing.
          $raw = [System.IO.File]::ReadAllText('C:\Windows\Temp\ansible-docker-setup.sh')
          $noBomUtf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText(
            'C:\Windows\Temp\ansible-docker-setup.sh',
            ($raw -replace "`r`n", "`n"),
            $noBomUtf8
          )

          wsl.exe -d $distro -u root -- bash /mnt/c/Windows/Temp/ansible-docker-setup.sh
          if ($LASTEXITCODE -ne 0) {
            $Ansible.Failed = $true
            $Ansible.Result = "Docker bootstrap failed with exit code $LASTEXITCODE"
          } else {
            $Ansible.Changed = $true
            $Ansible.Result = 'Docker Engine installed in ' + $distro
          }
      delegate_to: "{{ physical_node }}-win"
      become: false
      ignore_unreachable: true
      ignore_errors: true
      when:
        - physical_node is defined
        - docker_engine_in_wsl | default(false)
      tags: [docker, docker-engine]
