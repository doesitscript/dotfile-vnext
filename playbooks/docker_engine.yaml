---
# Docker Engine lifecycle for opted-in Ubuntu VM hosts.
#
# Public lifecycle interface:
#   runtime_planes.docker_engine.enabled: true | false
#   docker_engine_state: present | absent
#
# Commands:
#   Preview target selection:
#     ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml \
#       --check --tags docker_engine_preview
#
#   Apply to opted-in Docker engine hosts:
#     ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml
#
#   Staged rollout / troubleshooting limit:
#     Only use --limit when intentionally narrowing the otherwise scalable
#     all-opted-in run.
#     ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml \
#       --limit hom-lab-ctl-dkr-01
#
- name: Docker Engine - classify target hosts
  hosts: linux_vm_hosts
  gather_facts: false

  tasks:
    - name: Classify Docker Engine lifecycle eligibility
      ansible.builtin.set_fact:
        docker_engine_candidate: >-
          {{ (surface_type | default('')) == 'ubuntu_vm' }}
        docker_engine_runtime_requested: >-
          {{
            ((runtime_planes | default({})).get('docker_engine', {})).get('enabled', false)
            | bool
          }}
        docker_engine_lifecycle_ready: >-
          {{ (docker_engine_state | default('unset')) in ['present', 'absent'] }}
        docker_engine_should_manage: >-
          {{
            (surface_type | default('')) == 'ubuntu_vm'
            and (
              ((runtime_planes | default({})).get('docker_engine', {})).get('enabled', false)
              | bool
            )
            and (docker_engine_state | default('unset')) in ['present', 'absent']
          }}
        docker_engine_selection_reason: >-
          {% if (surface_type | default('')) != 'ubuntu_vm' %}
          not selected: not an Ubuntu VM surface
          {% elif not (((runtime_planes | default({})).get('docker_engine', {})).get('enabled', false) | bool) %}
          not selected: runtime_planes.docker_engine.enabled is not true
          {% elif (docker_engine_state | default('unset')) not in ['present', 'absent'] %}
          not selected: missing Docker Engine lifecycle state
          {% else %}
          eligible
          {% endif %}
      changed_when: false
      tags: [always]

    - name: Derive runtime group for Docker Engine hosts
      ansible.builtin.group_by:
        key: >-
          {{
            'runtime_docker_engine'
            if (docker_engine_should_manage | default(false) | bool)
            else 'runtime_docker_engine_excluded'
          }}
      changed_when: false
      tags: [always]

- name: Docker Engine - preview target selection
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [docker_engine_preview, always]

  tasks:
    - name: Preview Docker Engine host selection
      ansible.builtin.debug:
        msg: >-
          {{
            {
              'host': item,
              'selected': hostvars[item].docker_engine_should_manage | default(false),
              'candidate': hostvars[item].docker_engine_candidate | default(false),
              'runtime_requested': hostvars[item].docker_engine_runtime_requested | default(false),
              'state': hostvars[item].docker_engine_state | default('unset'),
              'surface_type': hostvars[item].surface_type | default('unset'),
              'reason': hostvars[item].docker_engine_selection_reason | default('not classified')
            }
          }}
      loop: "{{ query('inventory_hostnames', 'linux_vm_hosts') }}"

- name: Docker Engine - lifecycle
  hosts: linux_vm_hosts
  gather_facts: true
  become: true
  tags: [docker_engine_apply]

  tasks:
    - name: Ensure Docker Engine is present
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_users:
          - "{{ ansible_user }}"
        docker_install_compose: true
      when:
        - docker_engine_should_manage | default(false) | bool
        - docker_engine_state == 'present'

    - name: Ensure Docker Engine is absent
      when:
        - docker_engine_should_manage | default(false) | bool
        - docker_engine_state == 'absent'
      block:
        - name: Stop Docker service before package removal
          ansible.builtin.service:
            name: docker
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove Docker Engine packages
          ansible.builtin.apt:
            name:
              - containerd
              - containerd.io
              - docker-buildx-plugin
              - docker-ce
              - docker-ce-cli
              - docker-compose
              - docker-compose-plugin
              - docker-compose-v2
              - docker-doc
              - docker.io
              - podman-docker
              - runc
            state: absent
            autoremove: true
            purge: false
