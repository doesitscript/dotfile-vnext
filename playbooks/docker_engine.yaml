---
# Docker Engine — install Docker Engine on Linux VM hosts.
#
# Commands:
#   ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml
#   ansible-playbook playbooks/docker_engine.yaml -i inventory/inventory.yaml --limit server-225-ubuntu

- name: Docker Engine - install on Linux VM hosts
  hosts: linux_vm_hosts
  gather_facts: true
  become: true

  roles:
    - role: geerlingguy.docker
      vars:
        docker_users:
          - "{{ ansible_user }}"
        docker_install_compose: true
