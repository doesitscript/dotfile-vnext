---
# Dev environment setup: nvm/node, bash shell config, ansible dev tools.
#
# Controller (Mac) only:
#   ansible-playbook playbooks/role_only.yaml --limit execution_nodes
#
# Single Linux VM host (run from Mac after SSH is verified):
#   ansible-playbook playbooks/role_only.yaml --limit hom-lab-ctl-dkr-02
#
# Everything (Mac + all Linux VM hosts in `linux_vm_hosts`):
#   ansible-playbook playbooks/role_only.yaml
#

- name: Set up dev environment on controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools

- name: Set up dev environment on Linux VM hosts
  hosts: linux_vm_hosts
  gather_facts: true

  pre_tasks:
    - name: Skip Linux VM hosts without SSH access
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'ssh'
      tags: [always]

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools
