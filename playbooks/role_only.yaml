---
# Dev environment setup: nvm/node, bash shell config, ansible dev tools.
#
# Controller (Mac) only:
#   ansible-playbook playbooks/role_only.yaml --limit execution_nodes
#
# Single WSL host (run from Mac, reaches WSL over SSH):
#   ansible-playbook playbooks/role_only.yaml --limit server-225-wsl
#   ansible-playbook playbooks/role_only.yaml --limit network-server-wsl
#
# Everything (Mac + all deployed WSL hosts):
#   ansible-playbook playbooks/role_only.yaml
#

- name: Set up dev environment on controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools

- name: Set up dev environment on WSL hosts
  hosts: wsl_hosts
  gather_facts: true

  pre_tasks:
    - name: Skip WSL hosts without SSH access
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'ssh'
      tags: [always]

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools
