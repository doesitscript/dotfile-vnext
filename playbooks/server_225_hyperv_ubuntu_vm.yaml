---
# Specialized control surface for the Hyper-V-native Ubuntu VM on server-225.
#
# The canonical full-stack entrypoint is playbooks/site.yaml.
# Use this playbook when you want the guest-oriented orchestration without
# running the broader Docker/client stack.
#
# This playbook runs:
#   1. controller key setup (or reuse)
#   2. Hyper-V host networking prerequisite
#   3. controller route to the guest subnet
#   4. Hyper-V Ubuntu VM lifecycle on the Windows host
#   5. controller SSH config refresh after VM facts are published
#
# Commands:
#   Full run (all 4 plays):
#     ansible-playbook playbooks/server_225_hyperv_ubuntu_vm.yaml \
#       -i inventory/inventory.yaml --limit 'execution_nodes,server-225-win'
#
#   VM lifecycle only (controller identity, networking, guest-route already converged):
#     ansible-playbook playbooks/server_225_hyperv_ubuntu_vm.yaml \
#       -i inventory/inventory.yaml --limit 'execution_nodes,server-225-win' \
#       --tags hyperv_vm_lifecycle
#
# Troubleshooting:
#   Run with --tags collect_hyperv to trigger artifact collection alongside the
#   normal lifecycle run:
#     ansible-playbook playbooks/server_225_hyperv_ubuntu_vm.yaml \
#       -i inventory/inventory.yaml --limit 'execution_nodes,server-225-win' \
#       --tags collect_hyperv
#   Artifacts land at: artifacts/troubleshooting/hyperv_ubuntu_vm/<host>/<timestamp>/
#
#   Or run the dedicated collector directly (no lifecycle side effects):
#     ansible-playbook playbooks/troubleshoot/collect_hyperv_ubuntu_vm_artifacts.yaml \
#       -i inventory/inventory.yaml --limit server-225-win
#

- name: Access - controller identity
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_identity]

  roles:
    - access_identity_controller

- name: Server-225 Hyper-V networking prerequisites
  hosts: "{{ hyperv_ubuntu_vm_windows_host | default('server-225-win') }}"
  gather_facts: false
  tags: [hyperv_networking]

  tasks:
    - name: Ensure Hyper-V host networking prerequisites are ready
      ansible.builtin.include_role:
        name: hyperv_networking

- name: Access - route guest private subnet from the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [guest_route]

  tasks:
    - name: Ensure the controller can route to the Hyper-V guest subnet
      ansible.builtin.include_role:
        name: hyperv_guest_route_mac
      when: (hyperv_guest_route_mac_state | default('absent')) == 'present'

- name: Server-225 Hyper-V Ubuntu VM lifecycle
  hosts: "{{ hyperv_ubuntu_vm_windows_host | default('server-225-win') }}"
  gather_facts: false
  tags: [hyperv_vm_lifecycle, collect_hyperv]

  tasks:
    - name: Ensure Hyper-V Ubuntu VM capability is in the requested lifecycle state
      ansible.builtin.include_role:
        name: hyperv_ubuntu_vm

    - name: Collect Hyper-V Ubuntu VM troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: hyperv_ubuntu_vm.yml
      tags:
        - never
        - collect_hyperv

- name: Access - update controller SSH client config
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_ssh_config]

  tasks:
    - name: Generate SSH client config from deployed targets
      ansible.builtin.include_role:
        name: access_identity_controller
        tasks_from: ssh_config.yml
