---
# Manage macOS user-scoped Codex homes and launchers for explicit homelab lanes.
- name: Deploy Codex homelab profiles
  hosts: mac-dev
  gather_facts: true
  become: false
  roles:
    - role: codex_homelab_profiles
      when: ansible_system == 'Darwin'
      tags: [codex, codex_homelab_profiles]
