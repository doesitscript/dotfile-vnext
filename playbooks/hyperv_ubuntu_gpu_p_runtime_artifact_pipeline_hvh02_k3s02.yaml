---
# Pinned Hyper-V Ubuntu GPU-P artifact pipeline for HOM-LAB-HVH-02 + hom-lab-ctl-k3s-02.
#
# When LAN SSH to HOM-LAB-HVH-02 (192.168.50.158) is refused, override Windows hosts
# to the guest-gateway surface:
#
#   hyperv_ubuntu_gpu_p_runtime_windows_hosts: HOM-LAB-HVH-02-guest-gw
#
# See docs/reference/gpu-p-operational-contracts.md and docs/reference/connection-surfaces.md.
- import_playbook: hyperv_ubuntu_gpu_p_runtime_artifact_pipeline.yaml
  vars:
    hyperv_ubuntu_gpu_p_runtime_windows_hosts: HOM-LAB-HVH-02
    hyperv_ubuntu_gpu_p_runtime_guest_hosts: hom-lab-ctl-k3s-02
    hyperv_ubuntu_gpu_p_runtime_guest_vm_name: hom-lab-ctl-k3s-02
