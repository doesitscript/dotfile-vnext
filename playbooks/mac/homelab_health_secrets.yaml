---
# Render controller-local homelab health probe secrets (env.d pattern).
#
# Example:
#   ansible-playbook playbooks/mac/homelab_health_secrets.yaml \
#     -i inventory/inventory.yaml --limit mac-dev

- name: Render homelab health probe secrets on mac-dev
  hosts: execution_nodes
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Establish homelab health secrets path contract
      ansible.builtin.set_fact:
        dotfiles_home: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
      tags: [always]

  roles:
    - role: common/homelab_health_secrets
      tags: [homelab_health_secrets]
