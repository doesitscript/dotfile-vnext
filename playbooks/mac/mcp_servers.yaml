---
# Focused controller playbook for the Context7 MCP server on mac-dev.
#
# This entrypoint intentionally limits scope to the roles required to install
# Node.js/npm and wire Context7 into the repo's Cursor and Codex client config.
#
# Example:
#   .venv/bin/ansible-playbook playbooks/mac/mcp_servers.yaml \
#     -i inventory/inventory.yaml --limit mac-dev
#

- name: Converge Context7 MCP tooling on the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Establish mac MCP controller path contract
      ansible.builtin.set_fact:
        dotfiles_home: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
        dotfiles_user_home: "{{ dotfiles_user_home | default(ansible_facts['env']['HOME'] | default(ansible_user_dir)) }}"
      tags: [always]

  roles:
    - role: common/node
    - role: mcp_servers/context7
      tags: [context7]
