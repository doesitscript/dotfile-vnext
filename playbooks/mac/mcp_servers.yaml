---
# Focused controller playbook for the repo-local MCP servers on mac-dev.
#
# This entrypoint intentionally limits scope to the roles required to install
# the controller-local MCP servers and wire their Cursor and Codex client
# config blocks into the repo.
#
# Example:
#   .venv/bin/ansible-playbook playbooks/mac/mcp_servers.yaml \
#     -i inventory/inventory.yaml --limit mac-dev
#

- name: Converge repo-local MCP tooling on the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Establish mac MCP controller path contract
      ansible.builtin.set_fact:
        dotfiles_home: "{{ dotfiles_home | default(playbook_dir | dirname | dirname) }}"
        dotfiles_user_home: "{{ dotfiles_user_home | default(ansible_facts['env']['HOME'] | default(ansible_user_dir)) }}"
      tags: [always]

  roles:
    - role: common/node
    - role: mcp_servers/redhat-ansible
      tags: [redhat-ansible]
    - role: mcp_servers/openai_docs
      tags: [openai_docs]
    - role: mcp_servers/context7
      tags: [context7]
    - role: mcp_servers/firecrawl
      tags: [firecrawl]
    - role: ripgrep_cli
      tags: [morph, ripgrep]
    - role: mcp_servers/morph
      tags: [morph]
    - role: mcp_servers/playwright
      tags: [playwright]
    - role: mcp_servers/fetch
      tags: [fetch]
    - role: mcp_servers/firebase
      tags: [firebase]
    - role: mcp_servers/drawio
      tags: [drawio]
    - role: mcp_servers/netbox
      tags: [netbox]
    - role: mcp_servers/langfuse_docs
      tags: [langfuse_docs]
    - role: mcp_servers/huggingface
      tags: [huggingface]
    - role: mcp_servers/mcp-sysoperator
      tags: [mcp-sysoperator]
