---
# Converge git configuration on the Mac controller.
#
# Manages:
#   - ~/.gitconfig (from gitconfig.j2 template)
#   - ~/.gitattributes (global, LF line endings)
#   - ~/.gitignore_global (symlinked from roles/git/files/gitignore_global.link)
#   - macOS credential helper and aliases via gitconfig.j2
#
# Run:
#   .venv/bin/ansible-playbook playbooks/mac/git.yaml \
#     -i inventory/inventory.yaml --limit mac-dev
#
# Tags:
#   git              — full role
#   git_config       — gitconfig + gitattributes only
#   git_gitignore    — global gitignore symlink only

- name: Converge git configuration on the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  roles:
    - role: git
      tags: [git]
