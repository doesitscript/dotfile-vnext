---
# Configure dev-3090 Windows node to desired state.
# Idempotent — safe to re-run at any time.
# Targets: dev-3090-win (WinRM)

- name: Configure dev-3090 Windows host
  hosts: dev-3090-win
  become: false
  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force

    - name: Ensure WinRM HTTP firewall rule (port 5985)
      community.windows.win_firewall_rule:
        name: WinRM-HTTP-In-TCP
        display_name: WinRM HTTP (5985)
        localport: 5985
        protocol: tcp
        action: allow
        direction: in
        enabled: true
        state: present

    - name: Set TrustedHosts when explicitly provided
      ansible.windows.win_shell: Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value "{{ winrm_trustedhosts }}" -Force
      when: winrm_trustedhosts is defined

  roles:
    - role: common/baseline
    # - role: package_manager
    - role: python
    - role: dev_3090/windows_base
    - role: dev_3090/ssh
    - role: dev_3090/wsl2_or_windows_docker_runtime
    - role: dev_3090/gpu_driver_validation
    - role: common/firewall



