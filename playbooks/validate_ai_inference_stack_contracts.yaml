---
- name: Validate AI inference stack lane and runtime contracts
  hosts: execution_nodes
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/model_catalog/manifest.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/all/ai_agent_profiles.yml"
    - "{{ playbook_dir }}/../roles/k3s_litellm_gateway/defaults/main/model_client_ids.yml"
    - "{{ playbook_dir }}/../roles/k3s_litellm_gateway/defaults/main.yml"
    - "{{ playbook_dir }}/../roles/k3s_vllm_runtime/defaults/main.yml"
  vars:
    _required_lane_contract_names:
      - qwen2.5-coder-32b@k3s02-vllm
      - qwen2.5-coder-1.5b@hvh01
      - ministral-3-8b@desktop
    _required_enabled_gateway_routes:
      - "{{ k3s_litellm_gateway_client_model_id_kilo_vllm }}"
      - "{{ k3s_litellm_gateway_client_model_id_kilo_autocomplete }}"
      - "{{ k3s_litellm_gateway_client_model_id_kilo_fast }}"
  tasks:
    - name: Collect gateway and lane contract names
      ansible.builtin.set_fact:
        _gateway_route_names: "{{ k3s_litellm_gateway_model_list | map(attribute='model_name') | list }}"
        _gateway_no_openai_route_names: "{{ k3s_litellm_gateway_model_list_without_openai | map(attribute='model_name') | list }}"
        _lane_contract_names: "{{ k3s_litellm_gateway_lane_contract | map(attribute='lane') | list }}"
      changed_when: false

    - name: Validate Kilo lane vocabulary
      ansible.builtin.assert:
        that:
          - item in _lane_contract_names
        fail_msg: "Missing LiteLLM lane contract entry: {{ item }}"
      loop: "{{ _required_lane_contract_names }}"

    - name: Validate complexity smart-router is disabled
      ansible.builtin.assert:
        that:
          - not (k3s_litellm_gateway_complexity_router_enabled | bool)
        fail_msg: "MODEL GROUP smart-router must stay disabled in Kilo clean setup."

    - name: Validate Kilo 14B testing override when active
      ansible.builtin.assert:
        that:
          - hostvars['hom-lab-ctl-k3s-02'].k3s_vllm_runtime_model is search('14B')
          - hostvars['hom-lab-ctl-k3s-02'].k3s_litellm_gateway_kilo_lite_vllm_api_base | default('') | length > 0
        fail_msg: >-
          k3s_vllm_runtime_kilo_testing_active requires 14B vLLM + kilo_lite api_base on k3s-02.
      when: hostvars['hom-lab-ctl-k3s-02'].k3s_vllm_runtime_kilo_testing_active | default(false) | bool

    - name: Summarize validated Kilo inference contract
      ansible.builtin.debug:
        msg:
          lane_contract_names: "{{ _lane_contract_names }}"
          static_gateway_routes: "{{ _gateway_route_names }}"
          kilo_client_ids:
            vllm: "{{ k3s_litellm_gateway_client_model_id_kilo_vllm }}"
            autocomplete: "{{ k3s_litellm_gateway_client_model_id_kilo_autocomplete }}"
            fast: "{{ k3s_litellm_gateway_client_model_id_kilo_fast }}"
          primary_vllm_model: "{{ k3s_litellm_gateway_primary_vllm_model }}"
          gateway_url: "{{ ai_agent_client_profiles.gateway.openai_base_url }}"
