---
- name: Validate AI inference stack lane and runtime contracts
  hosts: execution_nodes
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/model_catalog/manifest.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/all/ai_agent_profiles.yml"
    - "{{ playbook_dir }}/../roles/k3s_litellm_gateway/defaults/main.yml"
    - "{{ playbook_dir }}/../roles/k3s_vllm_runtime/defaults/main.yml"
  vars:
    _required_lane_contract_names:
      - deepreinforce-ai/Ornith-1.0-35B-GGUF
      - code-fast
      - code-review
      - code-test
      - ripi-private
      - embeddings-local
      - public-research
      - experiment
    _required_enabled_gateway_routes:
      - deepreinforce-ai/Ornith-1.0-35B-GGUF
      - experiment
      - code-review
    _required_migration_gateway_routes:
      - gpt-4o-mini
      - default
  tasks:
    - name: Collect gateway and lane contract names
      ansible.builtin.set_fact:
        _gateway_route_names: "{{ k3s_litellm_gateway_model_list | map(attribute='model_name') | list }}"
        _gateway_no_openai_route_names: "{{ k3s_litellm_gateway_model_list_without_openai | map(attribute='model_name') | list }}"
        _lane_contract_names: "{{ k3s_litellm_gateway_lane_contract | map(attribute='lane') | list }}"
      changed_when: false

    - name: Validate full lane vocabulary remains visible
      ansible.builtin.assert:
        that:
          - item in _lane_contract_names
        fail_msg: "Missing LiteLLM lane contract entry: {{ item }}"
      loop: "{{ _required_lane_contract_names }}"

    - name: Validate explicitly enabled local gateway routes exist
      ansible.builtin.assert:
        that:
          - item in _gateway_route_names
        fail_msg: "Missing enabled LiteLLM gateway route: {{ item }}"
      loop: "{{ _required_enabled_gateway_routes }}"

    - name: Validate migration rows are preserved in the main gateway list
      ansible.builtin.assert:
        that:
          - item in _gateway_route_names
        fail_msg: "Missing preserved migration gateway route: {{ item }}"
      loop: "{{ _required_migration_gateway_routes }}"

    - name: Validate local-only fallback list still exposes useful lanes
      ansible.builtin.assert:
        that:
          - "'deepreinforce-ai/Ornith-1.0-35B-GGUF' in _gateway_no_openai_route_names"
          - "'experiment' in _gateway_no_openai_route_names"
          - "'code-review' in _gateway_no_openai_route_names"
          - "'default' in _gateway_no_openai_route_names"
        fail_msg: "LiteLLM local-only fallback must still expose deepreinforce-ai/Ornith-1.0-35B-GGUF, experiment, code-review, and default."

    - name: Validate every main gateway route carries required model metadata
      ansible.builtin.assert:
        that:
          - item.model_info is defined
          - item.model_info.model_lane is defined
          - item.model_info.routing_policy is defined
          - item.model_info.project is defined
          - item.model_info.source_registry is defined
          - item.model_info.model_catalog_manifest is defined
        fail_msg: "Gateway route {{ item.model_name }} is missing required model_info metadata."
      loop: "{{ k3s_litellm_gateway_model_list }}"
      loop_control:
        label: "{{ item.model_name }}"

    - name: Resolve main deepreinforce-ai/Ornith-1.0-35B-GGUF gateway row
      ansible.builtin.set_fact:
        _code_deep_route: "{{ (k3s_litellm_gateway_model_list | selectattr('model_name', 'equalto', 'deepreinforce-ai/Ornith-1.0-35B-GGUF') | list | first) }}"
        _experiment_route: "{{ (k3s_litellm_gateway_model_list | selectattr('model_name', 'equalto', 'experiment') | list | first) }}"
        _code_review_route: "{{ (k3s_litellm_gateway_model_list | selectattr('model_name', 'equalto', 'code-review') | list | first) }}"
      changed_when: false

    - name: Validate local coding lane points at the declared primary vLLM backend
      ansible.builtin.assert:
        that:
          - _code_deep_route.litellm_params.api_base == k3s_litellm_gateway_primary_vllm_api_base
          - _code_deep_route.litellm_params.model == 'hosted_vllm/' ~ k3s_litellm_gateway_primary_vllm_model
          - _code_deep_route.model_info.routing_policy == 'local-primary'
          - _experiment_route.litellm_params.api_base == k3s_litellm_gateway_primary_vllm_api_base
          - _code_review_route.litellm_params.api_base == k3s_litellm_gateway_secondary_review_ollama_api_base
          - _code_review_route.litellm_params.model == 'ollama/' ~ k3s_litellm_gateway_secondary_review_ollama_model
          - _code_review_route.model_info.routing_policy == 'local-secondary-review'
          - _code_review_route.model_info.backend_runtime == k3s_litellm_gateway_secondary_review_runtime_slug
        fail_msg: "Local LiteLLM lanes are not aligned to the declared primary vLLM backend."

    - name: Validate vLLM defaults match the declared primary local model
      ansible.builtin.assert:
        that:
          - k3s_vllm_runtime_model == k3s_litellm_gateway_primary_vllm_model
          - k3s_vllm_runtime_served_model_name == k3s_litellm_gateway_primary_vllm_model
          - k3s_litellm_gateway_primary_vllm_api_base is search('vllm-runtime\\.svc\\.cluster\\.local')
          - k3s_litellm_gateway_primary_vllm_api_base is not search('[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127\\.0\\.0\\.1')
        fail_msg: "vLLM runtime defaults are not aligned with the primary LiteLLM local-lane contract."

    - name: Validate tool-calling support is enabled for the primary vLLM lane
      ansible.builtin.assert:
        that:
          - hostvars['hom-lab-ctl-k3s-02'].k3s_vllm_runtime_enable_auto_tool_choice | default(false) | bool
          - hostvars['hom-lab-ctl-k3s-02'].k3s_vllm_runtime_tool_call_parser | default('') == 'hermes'
        fail_msg: "Primary vLLM lane must enable auto tool choice with the hermes parser for Qwen2.5-backed Cursor tool calls."

    - name: Validate deep local lane declares a no-OpenAI context-window fallback path
      ansible.builtin.assert:
        that:
          - k3s_litellm_gateway_enable_pre_call_checks | bool
          - >
            (
              k3s_litellm_gateway_context_window_fallbacks_without_openai
              | selectattr('deepreinforce-ai/Ornith-1.0-35B-GGUF', 'defined')
              | list
              | length
            ) > 0
          - >
            (
              (
                k3s_litellm_gateway_context_window_fallbacks_without_openai
                | selectattr('deepreinforce-ai/Ornith-1.0-35B-GGUF', 'defined')
                | map(attribute='deepreinforce-ai/Ornith-1.0-35B-GGUF')
                | first
              ) | default([])
            ) | select('equalto', 'code-review') | list | length > 0
        fail_msg: "Primary deep local lane must declare a context-window fallback path for no-OpenAI operation."

    - name: Summarize validated inference stack contract
      ansible.builtin.debug:
        msg:
          enabled_gateway_routes: "{{ _gateway_route_names }}"
          local_only_gateway_routes: "{{ _gateway_no_openai_route_names }}"
          lane_contract_names: "{{ _lane_contract_names }}"
          primary_vllm_model: "{{ k3s_vllm_runtime_model }}"
          primary_vllm_tool_call_parser: "{{ hostvars['hom-lab-ctl-k3s-02'].k3s_vllm_runtime_tool_call_parser | default('') }}"
          primary_context_window_fallbacks_with_openai: "{{ k3s_litellm_gateway_context_window_fallbacks_with_openai }}"
          primary_context_window_fallbacks_without_openai: "{{ k3s_litellm_gateway_context_window_fallbacks_without_openai }}"
          secondary_review_runtime: "{{ k3s_litellm_gateway_secondary_review_runtime_slug }}"
          secondary_review_api_base: "{{ k3s_litellm_gateway_secondary_review_ollama_api_base }}"
          gateway_url: "{{ ai_agent_client_profiles.gateway.openai_base_url }}"
