---
# Docker Ubuntu VM control surface for Hyper-V Windows hosts.
#
# This playbook configures Ubuntu VMs whose purpose is to run Docker Engine.
# The underlying hyperv_ubuntu_vm role remains generic so future VM classes
# such as k3s can compose it through their own playbooks and targeting rules.
#
# Public Docker VM lifecycle interface:
#   hyperv_ubuntu_docker_vm_state: present | absent
#   hyperv_ubuntu_docker_vm_hostname: <vm-name-and-guest-hostname>
#   hyperv_ubuntu_docker_vm_inventory_host: <inventory-host>
#
# Selection model:
#   - scan windows_hosts
#   - opt in hosts with hyperv_ubuntu_docker_vm_state: present|absent
#   - require hyperv_ubuntu_docker_vm_hostname
#   - preview selected and excluded Windows hosts before mutating roles run
#
# Commands:
#   Preview target selection:
#     ansible-playbook playbooks/hyperv_ubuntu_docker_vm.yaml \
#       -i inventory/inventory.yaml --check --tags docker_vm_preview
#
#   Full Docker VM orchestration for all opted-in Hyper-V Windows hosts:
#     ansible-playbook playbooks/hyperv_ubuntu_docker_vm.yaml \
#       -i inventory/inventory.yaml
#
#   Staged rollout / troubleshooting limit:
#     Only use --limit when intentionally narrowing the otherwise scalable
#     all-opted-in run.
#     ansible-playbook playbooks/hyperv_ubuntu_docker_vm.yaml \
#       -i inventory/inventory.yaml --limit network-server-win
#
# Troubleshooting:
#   Run with --tags collect_hyperv to trigger artifact collection alongside the
#   normal lifecycle run:
#     ansible-playbook playbooks/hyperv_ubuntu_docker_vm.yaml \
#       -i inventory/inventory.yaml --limit network-server-win --tags collect_hyperv
#   Artifacts land at: artifacts/troubleshooting/hyperv_ubuntu_vm/<host>/<timestamp>/
#

- name: Hyper-V Docker Ubuntu VM - classify target hosts
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Classify Docker Ubuntu VM lifecycle eligibility
      ansible.builtin.set_fact:
        hyperv_ubuntu_docker_vm_candidate: >-
          {{ (surface_type | default('')) == 'windows_host' }}
        hyperv_ubuntu_docker_vm_lifecycle_requested: >-
          {{ (hyperv_ubuntu_docker_vm_state | default('unset')) in ['present', 'absent'] }}
        hyperv_ubuntu_docker_vm_hostname_declared: >-
          {{ (hyperv_ubuntu_docker_vm_hostname | default('') | length) > 0 }}
        hyperv_ubuntu_docker_vm_effective_inventory_host: >-
          {{
            hyperv_ubuntu_docker_vm_inventory_host
            | default(hyperv_ubuntu_docker_vm_hostname | default(''))
          }}
        hyperv_ubuntu_docker_vm_should_manage: >-
          {{
            (surface_type | default('')) == 'windows_host'
            and (hyperv_ubuntu_docker_vm_state | default('unset')) in ['present', 'absent']
            and (hyperv_ubuntu_docker_vm_hostname | default('') | length) > 0
          }}
      changed_when: false
      tags: [always]

- name: Hyper-V Docker Ubuntu VM - preview target selection
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [docker_vm_preview, always]

  tasks:
    - name: Preview Docker Ubuntu VM host selection
      ansible.builtin.debug:
        msg: >-
          {{
            {
              'host': item,
              'selected': hostvars[item].hyperv_ubuntu_docker_vm_should_manage | default(false),
              'candidate': hostvars[item].hyperv_ubuntu_docker_vm_candidate | default(false),
              'state': hostvars[item].hyperv_ubuntu_docker_vm_state | default('unset'),
              'vm_name': (
                hostvars[item].hyperv_ubuntu_docker_vm_name
                | default(hostvars[item].hyperv_ubuntu_docker_vm_hostname | default('unset'))
              ),
              'vm_hostname': hostvars[item].hyperv_ubuntu_docker_vm_hostname | default('unset'),
              'guest_inventory_host': (
                hostvars[item].hyperv_ubuntu_docker_vm_inventory_host
                | default(hostvars[item].hyperv_ubuntu_docker_vm_hostname | default('unset'))
              ),
              'guest_ipv4': hostvars[item].hyperv_ubuntu_vm_autoinstall_network_ipv4 | default('unset'),
              'guest_subnet': (hostvars[item].hyperv_config | default({})).guest_subnet_ipv4 | default('unset'),
              'guest_switch': (hostvars[item].hyperv_config | default({})).guest_switch_name | default('unset'),
              'reason': (
                'eligible'
                if (hostvars[item].hyperv_ubuntu_docker_vm_should_manage | default(false))
                else 'not selected: missing Docker VM lifecycle state or hostname'
              )
            }
          }}
      loop: "{{ query('inventory_hostnames', 'windows_hosts') }}"

- name: Access - controller identity
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_identity]

  roles:
    - access_identity_controller

- name: Hyper-V Docker Ubuntu VM - host networking prerequisites
  hosts: windows_hosts
  gather_facts: false
  tags: [hyperv_networking, docker_vm_networking]

  tasks:
    - name: Ensure Hyper-V host networking prerequisites are ready
      ansible.builtin.include_role:
        name: hyperv_networking
      when: hyperv_ubuntu_docker_vm_should_manage | default(false) | bool

- name: Access - route configured guest private subnet from the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [guest_route]

  tasks:
    - name: Ensure the controller can route to configured Hyper-V guest subnets
      ansible.builtin.include_role:
        name: hyperv_guest_route_mac
      when: (hyperv_guest_route_mac_state | default('absent')) == 'present'

- name: Hyper-V Docker Ubuntu VM - lifecycle
  hosts: windows_hosts
  gather_facts: false
  tags: [docker_vm_lifecycle, collect_hyperv]

  tasks:
    - name: Ensure Docker Ubuntu VM is in the requested lifecycle state
      ansible.builtin.include_role:
        name: hyperv_ubuntu_vm
      vars:
        hyperv_ubuntu_vm_state: "{{ hyperv_ubuntu_docker_vm_state }}"
        hyperv_ubuntu_vm_name: >-
          {{
            hyperv_ubuntu_docker_vm_name
            | default(hyperv_ubuntu_docker_vm_hostname)
          }}
        hyperv_ubuntu_vm_hostname: "{{ hyperv_ubuntu_docker_vm_hostname }}"
        hyperv_ubuntu_vm_inventory_host: >-
          {{
            hyperv_ubuntu_docker_vm_inventory_host
            | default(hyperv_ubuntu_docker_vm_hostname)
          }}
      when: hyperv_ubuntu_docker_vm_should_manage | default(false) | bool

    - name: Collect Hyper-V Ubuntu VM troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: hyperv_ubuntu_vm.yml
      vars:
        hyperv_ubuntu_vm_name: >-
          {{
            hyperv_ubuntu_docker_vm_name
            | default(hyperv_ubuntu_docker_vm_hostname)
          }}
      when: hyperv_ubuntu_docker_vm_should_manage | default(false) | bool
      tags:
        - never
        - collect_hyperv

- name: Access - update controller SSH client config
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_ssh_config]

  tasks:
    - name: Generate SSH client config from deployed targets
      ansible.builtin.include_role:
        name: access_identity_controller
        tasks_from: ssh_config.yml
