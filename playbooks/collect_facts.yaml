---
# Collect facts for a node and write to facts/<node>.json
# Usage: run with -e node=mac-dev (and --limit mac-dev when using fz collect-facts)
# For Windows hosts, facts are collected by running on that host: .\bin\bootstrap-local.ps1 -FactsOnly

- name: Collect facts for node and write to facts directory
  hosts: "{{ node }}"
  gather_facts: true
  become: false
  vars:
    facts_dir: "{{ playbook_dir }}/../facts"
    facts_file: "{{ facts_dir }}/{{ node }}.json"
  tasks:
    - name: Ensure facts directory exists
      ansible.builtin.file:
        path: "{{ facts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Build facts payload for this node
      ansible.builtin.set_fact:
        node_facts_payload:
          physical_node: "{{ node }}"
          hostname: "{{ ansible_facts['hostname'] }}"
          fqdn: "{{ ansible_facts['fqdn'] | default('') }}"
          ip: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
          os: "{{ ansible_facts['system'] }}"
          distribution: "{{ ansible_facts['distribution'] | default(ansible_facts['os_family'] | default('')) }}"

    - name: Write facts to {{ facts_file }}
      ansible.builtin.copy:
        content: "{{ node_facts_payload | to_json(indent=2) }}"
        dest: "{{ facts_file }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
