---
- name: Preview or repurpose the explicitly authorized Hyper-V SSDs
  hosts: windows_hosts
  gather_facts: false
  tags: [physical_ssd_repurpose]
  pre_tasks:
    - name: Require explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
        fail_msg: "Use --limit HOM-LAB-HVH-02 for the physical SSD workflow."
      run_once: true
      tags: [always]
  roles:
    - role: windows_physical_ssd_repurpose
      windows_physical_ssd_repurpose_authority_ref: >-
        docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
