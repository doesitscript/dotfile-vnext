---
# Narrow Steam recovery / debug filter into deploy_applications.yaml.
# Does not duplicate classification or application discovery.
#
# Preview:
#   bin/codex-env ansible-playbook playbooks/deploy_windows_steam_client.yaml \
#     -i inventory/inventory.yaml --tags preview
#
# Verify:
#   bin/codex-env ansible-playbook playbooks/deploy_windows_steam_client.yaml \
#     -i inventory/inventory.yaml --tags verify
#
# Apply (rebuild / explicit):
#   bin/codex-env ansible-playbook playbooks/deploy_windows_steam_client.yaml \
#     -i inventory/inventory.yaml

- name: Steam client filter into Windows application orchestrator
  ansible.builtin.import_playbook: deploy_applications.yaml
  vars:
    windows_applications_filter:
      - windows_steam_client
