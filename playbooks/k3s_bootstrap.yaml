---
# k3s_bootstrap.yaml — Full k3s cluster bootstrap.
#
# This promotes the prepared hom-lab-ctl-k3s-01 VM/stub lane into a functional
# single-node k3s server. The preparatory path remains:
#   1. playbooks/hyperv_ubuntu_k3s_vm.yaml
#   2. playbooks/k3s_vm_stub.yaml
#
# Play order:
#   1. Load the vault-backed k3s token for cluster hosts
#   2. Guard that k3s_cluster contains only the approved single-node server
#   3. Open k3s firewall ports on the owning Hyper-V host (WinRM)
#   4. Deploy k3s cluster via official collection
#   5. Label and taint nodes from control plane
#
# Usage:
#   source .envrc
#   ansible-playbook playbooks/k3s_bootstrap.yaml -i inventory/inventory.yaml
#
# GPU plays are added separately after NVIDIA driver setup is confirmed.

# --- Play 0: Cluster secrets ---
- name: Load vault-backed k3s bootstrap token
  hosts: k3s_cluster
  gather_facts: false
  vars_files:
    - ../vault.yml
  tasks:
    - name: Publish k3s token for the official k3s collection
      ansible.builtin.set_fact:
        token: "{{ k3s_token }}"
      no_log: true
      tags:
        - always

# --- Play 1: Single-node guard ---
- name: Guard real k3s bootstrap target selection
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse real k3s bootstrap unless only hom-lab-ctl-k3s-01 is selected
      ansible.builtin.assert:
        that:
          - query('ansible.builtin.inventory_hostnames', 'server') == ['hom-lab-ctl-k3s-01']
          - query('ansible.builtin.inventory_hostnames', 'agent') | length == 0
          - "'hom-lab-ctl-dkr-01' not in query('ansible.builtin.inventory_hostnames', 'k3s_cluster')"
          - "'hom-lab-ctl-dkr-01' not in query('ansible.builtin.inventory_hostnames', 'server')"
          - "'hom-lab-ctl-dkr-01' not in query('ansible.builtin.inventory_hostnames', 'agent')"
          - hostvars['hom-lab-ctl-k3s-01'].ansible_host is defined
          - hostvars['hom-lab-ctl-k3s-01'].api_endpoint == hostvars['hom-lab-ctl-k3s-01'].ansible_host
          - hostvars['hom-lab-ctl-k3s-01'].token is defined
          - hostvars['hom-lab-ctl-k3s-01'].token | length > 0
          - hostvars['hom-lab-ctl-k3s-01'].k3s_server_location == '/var/lib/rancher/k3s'
        fail_msg: >-
          Real K3s bootstrap is allowed only for the single-node hom-lab-ctl-k3s-01
          server lane. Keep hom-lab-ctl-dkr-01 Docker-only, keep agent empty, and keep
          data-dir on /var/lib/rancher/k3s until a real secondary Linux data
          mount is added.
        success_msg: "k3s_cluster targets only hom-lab-ctl-k3s-01; continuing real bootstrap."
      tags:
        - always

# --- Play 2: Windows Firewall ---
- name: Open k3s firewall ports on the owning Hyper-V host
  hosts: hom-lab-hvh-01
  gather_facts: false
  roles:
    - k3s_firewall

# --- Play 3: Deploy k3s (official collection) ---
- name: Deploy k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site

# --- Play 4: Node Labels + Taints ---
- name: Configure k3s node labels and taints
  hosts: server
  become: true
  roles:
    - k3s_node_config
