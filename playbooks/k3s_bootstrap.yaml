---
# k3s_bootstrap.yaml — Full k3s cluster bootstrap.
#
# This is not part of the current nsrv-k3s-01 VM/stub slice. The current
# preparatory path is:
#   1. playbooks/hyperv_ubuntu_k3s_vm.yaml
#   2. playbooks/k3s_vm_stub.yaml
#
# Play order:
#   1. Guard that k3s_cluster is intentionally populated
#   2. Open firewall ports on Windows hosts (WinRM)
#   3. Prepare storage directories on direct Linux companion surfaces (SSH)
#   4. Deploy k3s cluster via official collection
#   5. Label and taint nodes from control plane
#
# Usage:
#   source .envrc
#   export K3S_TOKEN=$(openssl rand -base64 32 | tr '/' '_')
#   ansible-playbook playbooks/k3s_bootstrap.yaml -i inventory/inventory.yaml
#
# GPU plays are added separately after NVIDIA driver setup is confirmed.

# --- Play 0: Current-slice guard ---
- name: Guard real k3s bootstrap until k3s_cluster is populated
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse real k3s bootstrap when only the VM stub lane exists
      ansible.builtin.assert:
        that:
          - query('ansible.builtin.inventory_hostnames', 'k3s_cluster') | length > 0
          - query('ansible.builtin.inventory_hostnames', 'server') | length > 0
        fail_msg: >-
          Real K3s bootstrap is intentionally disabled for the current
          nsrv-k3s-01 VM/stub slice. Use playbooks/hyperv_ubuntu_k3s_vm.yaml
          and playbooks/k3s_vm_stub.yaml until nsrv-k3s-01 is explicitly
          promoted into k3s_cluster.children.server.
        success_msg: "k3s_cluster has server membership; continuing real bootstrap."
      tags:
        - always

# --- Play 1: Windows Firewall ---
- name: Open k3s firewall ports on Windows hosts
  hosts: server-225-win,home-lab-auth-hvh-01
  gather_facts: false
  roles:
    - k3s_firewall

# --- Play 2: Storage Prep (before k3s install) ---
- name: Prepare k3s storage directories on D drive
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_storage_prep

# --- Play 3: Deploy k3s (official collection) ---
- name: Deploy k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site

# --- Play 4: Node Labels + Taints ---
- name: Configure k3s node labels and taints
  hosts: server
  become: true
  roles:
    - k3s_node_config
