---
# Node-specific provisioning for dev-3090 Windows host.
# Applies roles that are only valid for this node.
#
# Run AFTER windows_base.yml (which handles shared base setup for all Windows hosts):
#   ansible-playbook playbooks/windows_base.yml --limit dev-3090-win
#   ansible-playbook playbooks/provision_dev_3090.yaml
#
# NOTE: dev-3090-win is not yet deployed (see inventory.yaml).
# The WinRM bootstrap pre_task is preserved here for first-run use.
#
- name: Provision dev-3090 Windows host (node-specific)
  hosts: dev-3090-win
  become: false

  pre_tasks:
    - name: Enable PowerShell remoting
      ansible.windows.win_shell: Enable-PSRemoting -Force

    - name: Ensure WinRM HTTP firewall rule (port 5985)
      community.windows.win_firewall_rule:
        name: WinRM-HTTP-In-TCP
        display_name: WinRM HTTP (5985)
        localport: 5985
        protocol: tcp
        action: allow
        direction: in
        enabled: true
        state: present

    - name: Set TrustedHosts when explicitly provided
      ansible.windows.win_shell: >-
        Set-Item -Path WSMan:\localhost\Client\TrustedHosts
        -Value "{{ winrm_trustedhosts }}" -Force
      when: winrm_trustedhosts is defined

  roles:
    - role: dev_3090/ssh
    - role: dev_3090/wsl2_or_windows_docker_runtime
    - role: dev_3090/gpu_driver_validation
