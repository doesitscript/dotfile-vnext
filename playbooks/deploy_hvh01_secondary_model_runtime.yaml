---
- import_playbook: llm_compute_windows_hvh01.yaml

- name: Deploy huggingface_hub client on hvh-01
  hosts: HOM-LAB-HVH-01
  gather_facts: false
  roles:
    - role: huggingface_hub
      tags:
        - huggingface_hub
        - ai_ml_platform
        - hvh01_secondary_runtime

- name: Converge host-local Ollama runtime lifecycle on hvh-01
  hosts: HOM-LAB-HVH-01
  gather_facts: false
  roles:
    - role: windows_ollama_runtime
      tags:
        - windows_ollama_runtime
        - ollama
        - ai_ml_platform
        - hvh01_secondary_runtime

- import_playbook: deploy_litellm_gateway.yaml
- import_playbook: validate_ai_inference_stack_contracts.yaml

- name: Verify hvh-01 secondary runtime and central gateway health
  hosts: execution_nodes
  gather_facts: false
  vars:
    _hvh01_secondary_ollama_state: >-
      {{ hostvars['HOM-LAB-HVH-01'].windows_ollama_runtime_state | default('absent') }}
    _hvh01_secondary_ollama_url: >-
      http://{{
        hostvars['HOM-LAB-HVH-01'].host_ip
        | default(hostvars['HOM-LAB-HVH-01'].ansible_host | default('HOM-LAB-HVH-01'))
      }}:{{
        hostvars['HOM-LAB-HVH-01'].windows_ollama_runtime_port | default(11434)
      }}
    _litellm_gateway_url: "{{ ai_agent_client_profiles.gateway.openai_base_url | regex_replace('/v1$', '') }}"
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all/ai_agent_profiles.yml"
  tasks:
    - name: Check hvh-01 secondary Ollama endpoint
      ansible.builtin.uri:
        url: "{{ _hvh01_secondary_ollama_url }}/api/tags"
        method: GET
        status_code: 200
        timeout: 10
      register: _hvh01_secondary_ollama_check
      changed_when: false
      when: _hvh01_secondary_ollama_state == 'present'

    - name: Check central LiteLLM gateway health
      ansible.builtin.uri:
        url: "{{ _litellm_gateway_url }}/health"
        method: GET
        status_code: [200, 401, 403]
        timeout: 10
      register: _litellm_gateway_check
      changed_when: false

    - name: Summarize hvh-01 secondary runtime verification
      ansible.builtin.debug:
        msg:
          hvh01_secondary_ollama_state: "{{ _hvh01_secondary_ollama_state }}"
          hvh01_secondary_ollama_url: "{{ _hvh01_secondary_ollama_url }}"
          hvh01_secondary_ollama_status: >-
            {{
              _hvh01_secondary_ollama_check.status
              if _hvh01_secondary_ollama_state == 'present'
              else 'skipped (state absent)'
            }}
          litellm_gateway_url: "{{ _litellm_gateway_url }}"
          litellm_gateway_status: "{{ _litellm_gateway_check.status }}"
