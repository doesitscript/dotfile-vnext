---
# Create and attach the cold/archive VHDX on the explicitly labeled H: host
# volume. Guest filesystem initialization is intentionally a later step after
# the newly attached disk's stable identity has been discovered.
- name: Attach K3s cold-artifacts VHDX
  hosts: windows_hosts
  gather_facts: false
  tags: [k3s_cold_artifacts, hyperv_vm_data_disk]
  pre_tasks:
    - name: Require explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
        fail_msg: "Use --limit HOM-LAB-HVH-02 for the cold-artifacts VHDX."
      run_once: true
      tags: [always]
  tasks:
    - name: Create and attach cold-artifacts VHDX
      ansible.builtin.include_role:
        name: hyperv_vm_data_disk
      vars:
        hyperv_vm_data_disk_state: present
        hyperv_vm_data_disk_apply: true
        hyperv_vm_data_disk_vm_name: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='vm_name') | first }}"
        hyperv_vm_data_disk_vhdx_path: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='vhdx_path') | first }}"
        hyperv_vm_data_disk_size_gib: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='size_gib') | first }}"
        hyperv_vm_data_disk_type: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='type') | first }}"
        hyperv_vm_data_disk_host_reserve_gib: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='host_reserve_gib') | first }}"
        hyperv_vm_data_disk_controller_number: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='controller_number') | first }}"
        hyperv_vm_data_disk_controller_location: "{{ hostvars['HOM-LAB-HVH-02'].hyperv_k3s_storage_disks | selectattr('name', 'equalto', 'cold_artifacts') | map(attribute='controller_location') | first }}"
        hyperv_vm_data_disk_backup_evidence_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/implementation-receipt.md
        hyperv_vm_data_disk_authority_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
        hyperv_vm_data_disk_detach_authorized: true
