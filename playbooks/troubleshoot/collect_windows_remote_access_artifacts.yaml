---
- name: Collect Windows remote access troubleshooting artifacts
  hosts: "{{ windows_remote_access_target | default('hom-lab-ctl-hvh-02') }}"
  gather_facts: false
  vars:
    windows_remote_access_artifact_groups:
      - control_surfaces
      - network_path
      - firewall_drop_path
  tasks:
    - name: Collect Windows remote access troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: windows_remote_access.yml
