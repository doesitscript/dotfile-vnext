  hosts: "windows_server_2025:&hyperv_gpu_partition_enabled_hosts"
  gather_facts: false
  tasks:
    - name: Stop and redirect to canonical runtime playbook
      ansible.builtin.fail:
        msg: |
          This troubleshoot playbook is deprecated.

          Use the canonical repo-native runtime entrypoint instead:
          playbooks/hyperv_ubuntu_gpu_p_runtime.yaml

          The canonical flow owns:
          - Hyper-V Windows payload collection
          - Linux guest dxgkrnl DKMS lifecycle
          - /usr/lib/wsl runtime layout
          - verification and absent cleanup
