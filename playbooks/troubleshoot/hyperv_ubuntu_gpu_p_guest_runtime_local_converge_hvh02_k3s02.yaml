- name: Converge Linux guest GPU-P runtime without Windows artifact sync
  hosts: hom-lab-ctl-k3s-02
  gather_facts: true
  become: true
  pre_tasks:
    - name: Assert pinned troubleshoot guest still maps to the intended Hyper-V host
      ansible.builtin.assert:
        that:
          - parent_hypervisor is defined
          - parent_hypervisor == 'HOM-LAB-HVH-02'
        fail_msg: >-
          Guest {{ inventory_hostname }} no longer maps to the pinned Hyper-V host HOM-LAB-HVH-02.
  roles:
    - role: hyperv_ubuntu_gpu_p_linux_guest_runtime
      vars:
        hyperv_ubuntu_gpu_p_linux_guest_runtime_skip_artifact_sync: >-
          {{ hyperv_ubuntu_gpu_p_linux_guest_runtime_skip_artifact_sync | default(true) | bool }}
      tags:
        - hyperv_ubuntu_gpu_p_linux_guest_runtime
        - gpu_infra
        - ai_ml_platform
