---
- name: Seed controller facts for guest-only GPU-P runtime convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Publish minimal host-side runtime receipt for guest-only convergence
      ansible.builtin.set_fact:
        hyperv_ubuntu_gpu_p_runtime_host_receipt:
          windows_host: hom-lab-ctl-hvh-02
          guest_vm_name: hom-lab-ctl-k3s-02
          driver_contract_path: C:\ProgramData\Ansible\llm_compute_windows\nvidia_driver_contract.json
          precheck_receipt_path: C:\ProgramData\Ansible\hyperv_gpu_p_host_precheck\receipt.json

- name: Converge Linux guest GPU-P runtime without Windows artifact sync
  hosts: hom-lab-ctl-k3s-02
  gather_facts: true
  become: true
  roles:
    - role: hyperv_ubuntu_gpu_p_linux_guest_runtime
      vars:
        hyperv_ubuntu_gpu_p_linux_guest_runtime_skip_artifact_sync: true
      tags:
        - hyperv_ubuntu_gpu_p_linux_guest_runtime
        - gpu_infra
        - ai_ml_platform
