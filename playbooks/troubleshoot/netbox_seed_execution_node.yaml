---
# Execution-node NetBox API seeding when hom-lab-ctl-dkr-02 SSH is unavailable.
# The included role tasks delegate API work to the execution node for vault/API access.
- name: Seed NetBox tags and Service custom fields (execution node)
  hosts: execution_nodes
  connection: local
  gather_facts: false
  tasks:
    - name: Seed canonical NetBox tags via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_tags
      tags:
        - ipam_netbox_seed_tags

    - name: Seed Service custom fields via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_custom_fields
      tags:
        - ipam_netbox_seed_custom_fields

- name: Seed HOM-LAB-HVH-02 NetBox model (execution node)
  hosts: execution_nodes
  connection: local
  gather_facts: false
  tasks:
    - name: Seed GPU-lane NetBox model via API
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_hom_lab_ctl_hvh_02_model
      tags:
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model
