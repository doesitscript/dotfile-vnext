---
# Controller-local NetBox API seeding when hom-lab-ctl-dkr-02 is unreachable.
# Use: bin/codex-env ansible-playbook playbooks/troubleshoot/netbox_api_seed_localhost.yml --ask-vault-pass
# Tags: ipam_netbox_seed_tags, ipam_netbox_seed_custom_fields, ipam_netbox_seed_hom_lab_ctl_hvh_02_model

- name: Seed NetBox API objects from controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipam_netbox_bootstrap_api_token_on_host: false
    ipam_netbox_api_url: "http://{{ hostvars['hom-lab-hvh-02'].host_ip }}:8000"
  tasks:
    - name: Seed NetBox tags
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_tags.yml
      tags:
        - ipam_netbox_seed_tags

    - name: Seed NetBox Service custom fields
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_custom_fields.yml
      tags:
        - ipam_netbox_seed_custom_fields

    - name: Seed hom-lab-hvh-02 NetBox model
      ansible.builtin.include_role:
        name: ipam_netbox
        tasks_from: seed_hom_lab_ctl_hvh_02_model.yml
      tags:
        - ipam_netbox_seed_hom_lab_ctl_hvh_02_model
