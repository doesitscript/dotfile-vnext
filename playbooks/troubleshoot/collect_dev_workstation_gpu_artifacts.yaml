---
# Collect GPU/FPS troubleshooting artifacts from dev-workstation-win.
#
# Usage:
#   bin/codex-env ansible-playbook playbooks/troubleshoot/collect_dev_workstation_gpu_artifacts.yaml \
#     -i inventory/inventory.yaml --limit dev-workstation-win

- name: Collect dev workstation GPU troubleshooting artifacts
  hosts: dev-workstation-win
  gather_facts: false
  tasks:
    - name: Collect dev workstation GPU troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: dev_workstation_win_gpu.yml
