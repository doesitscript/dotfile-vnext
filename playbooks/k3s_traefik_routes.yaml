---
# K3s Traefik Ingress routes from registry.
#
# Preview:
#   ansible-playbook playbooks/k3s_traefik_routes.yaml -i inventory/inventory.yaml \
#     --tags k3s_traefik_routes_preview -e k3s_traefik_routes_state=present
#
# Apply:
#   ansible-playbook playbooks/k3s_traefik_routes.yaml -i inventory/inventory.yaml \
#     --tags k3s_traefik_routes_apply -e k3s_traefik_routes_state=present

- name: Apply K3s Traefik ingress routes
  hosts: hom-lab-ctl-k3s-02
  gather_facts: false
  become: false

  roles:
    - role: k3s_traefik_routes
