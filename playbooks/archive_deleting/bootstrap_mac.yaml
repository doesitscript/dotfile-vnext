---
# Bootstrap mac-dev node
# Targets: mac-dev (SSH)
# Purpose: Set up development control plane
# Output: follows repo logging (ansible.cfg stdout_callback; task names and run from fz use log_step/log_ok)

# Ansible SSH key: single source of truth ~/.ssh/id_ed25519_ansible (and .pub). No repo copy, no .mgmt.
- name: Ensure ansible SSH key exists on Mac (canonical location only)
  hosts: mac-dev
  connection: local
  gather_facts: true
  vars:
    ansible_ssh_private_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_ansible"
    ansible_ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_ansible.pub"
  tasks:
    - name: Generate ansible SSH key pair (ed25519) in canonical location
      community.crypto.openssh_keypair:
        path: "{{ ansible_ssh_private_key_path }}"
        type: ed25519
        state: present
        force: false
      when: not ansible_ssh_key_stat.stat.exists

    - name: Display SSH key status
      ansible.builtin.debug:
        msg:
          - "Ansible SSH key at: {{ ansible_ssh_private_key_path }}"
          - "Public key at: {{ ansible_ssh_public_key_path }}"
          - "Deploy to Windows/WSL by running bootstrap from this Mac; key is read from here at run time."

- name: Bootstrap mac-dev node
  hosts: mac-dev
  become: false
  roles:
    - role: common/baseline
    - role: git
    - role: hub
    - role: mac_dev/homebrew
    - role: mac_dev/ansible_runner

- name: Write Mac facts to repo (facts/mac-dev.json)
  hosts: mac-dev
  gather_facts: true
  become: false
  vars:
    facts_dir: "{{ playbook_dir }}/../facts"
    facts_file: "{{ facts_dir }}/mac-dev.json"
  tasks:
    - name: Ensure facts directory exists
      ansible.builtin.file:
        path: "{{ facts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Build Mac facts payload
      ansible.builtin.set_fact:
        node_facts_payload:
          physical_node: mac-dev
          hostname: "{{ ansible_facts['hostname'] }}"
          fqdn: "{{ ansible_facts['fqdn'] | default('') }}"
          ip: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
          os: "{{ ansible_facts['system'] }}"
          distribution: "{{ ansible_facts['distribution'] | default(ansible_facts['os_family'] | default('')) }}"

    - name: Write facts to {{ facts_file }}
      ansible.builtin.copy:
        content: "{{ node_facts_payload | to_json(indent=2) }}"
        dest: "{{ facts_file }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
