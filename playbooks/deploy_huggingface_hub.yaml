---
# Deploy huggingface_hub (hf CLI) with present|absent lifecycle.
#
#   ansible-playbook playbooks/deploy_huggingface_hub.yaml --limit HOM-LAB-HVH-01
#   ansible-playbook playbooks/deploy_huggingface_hub.yaml --limit HOM-LAB-HVH-01 \
#     -e huggingface_hub_state=absent
- name: Deploy huggingface_hub on Windows hosts
  hosts: HOM-LAB-HVH-01
  gather_facts: false
  roles:
    - role: huggingface_hub
      tags: [huggingface_hub, ai_ml_platform]
