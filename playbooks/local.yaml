---
# Dev environment setup: nvm/node, bash shell config, ansible dev tools.
#
# Controller (Mac) only:
#   ansible-playbook playbooks/local.yaml --limit execution_nodes
#
# Single Linux companion host (run from Mac after SSH is verified):
#   ansible-playbook playbooks/local.yaml --limit server-225-wsl
#   ansible-playbook playbooks/local.yaml --limit network-server-wsl
#
# Everything (Mac + all SSH-ready Linux companion hosts in `wsl_hosts`):
#   ansible-playbook playbooks/local.yaml
#

- name: Set up dev environment on controller
  hosts: execution_nodes
  connection: local
  gather_facts: true

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools
    - role: mcp_inspector
    - role: mcp_servers/redhat-ansible
    - role: mcp_servers/mcp-sysoperator
    - role: mcp_servers/ansible-mcp
    - role: mcp_servers/openai_docs

- name: Set up dev environment on SSH-ready Linux companion hosts
  hosts: wsl_hosts
  gather_facts: true

  pre_tasks:
    - name: Skip Linux companion hosts without SSH access
      ansible.builtin.meta: end_host
      when: (ansible_connection | default('ssh')) != 'ssh'
      tags: [always]

  roles:
    - role: common/node
    - role: common/shell_config
    - role: ansible_dev_tools
    - role: mcp_servers/redhat-ansible
    - role: mcp_servers/mcp-sysoperator
    - role: mcp_servers/ansible-mcp
    - role: mcp_servers/openai_docs
