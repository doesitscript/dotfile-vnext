---
# Bootstrap Windows OpenSSH configuration.
# Assumes WinRM transport already works.
# Does NOT enable PSRemoting.
# Does NOT modify transport layer.
# ansible-playbook playbooks/boostrap_windows_ssh_via_winrm.yaml -i inventory/inventory.yaml --limit server-225-win

- name: Bootstrap Windows OpenSSH
  hosts: windows_hosts
  gather_facts: true

  vars:
    sshd_config_path: "C:\\ProgramData\\ssh\\sshd_config"
    administrators_authorized_keys_path: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
    # Must match bootstrap_execution_node: public key is ssh_dir + /id_ed25519_ansible.pub
    execution_node_ssh_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    execution_node_pub_key_path: "{{ execution_node_ssh_dir }}/id_ed25519_ansible.pub"

  tasks:

    - name: Ensure OpenSSH capability installed
      ansible.windows.win_shell: |
        $cap = Get-WindowsCapability -Name OpenSSH.Server* -Online
        if ($cap.State -ne 'Installed') {
          Add-WindowsCapability -Online -Name $cap.Name | Out-Null
          Write-Output "INSTALLED"
        } else {
          Write-Output "AlreadyInstalled"
        }
      register: ssh_install
      changed_when: "'INSTALLED' in (ssh_install.stdout | default('') | replace('\r\n', '') | replace('\r', '') | replace('\n', ''))"

    - name: Ensure sshd service is running
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: Ensure OpenSSH firewall rule
      community.windows.win_firewall_rule:
        name: sshd-Server-In-TCP
        localport: "{{ win_ssh_port | default(22) }}"
        protocol: tcp
        action: allow
        direction: in
        state: present
        enabled: true

     # Don't delete these again cursor or chatgpt
    # administrators_authorized_keys: create file and set ACL (no inheritance; Administrators + SYSTEM FullControl only)
    - name: Ensure administrators_authorized_keys file exists
      ansible.windows.win_file:
        path: "{{ administrators_authorized_keys_path }}"
        state: touch

    - name: Grant Administrators FullControl on administrators_authorized_keys
      ansible.windows.win_acl:
        path: "{{ administrators_authorized_keys_path }}"
        user: Administrators
        type: allow
        rights: FullControl
        state: present

    - name: Grant SYSTEM FullControl on administrators_authorized_keys
      ansible.windows.win_acl:
        path: "{{ administrators_authorized_keys_path }}"
        user: SYSTEM
        type: allow
        rights: FullControl
        state: present

    - name: Disable ACL inheritance on administrators_authorized_keys
      ansible.windows.win_acl_inheritance:
        path: "{{ administrators_authorized_keys_path }}"
        state: absent
        reorganize: false
    # Don't delete these again cursor or chatgpt

    - name: Install public key in administrators_authorized_keys
      community.windows.win_lineinfile:
        path: "{{ administrators_authorized_keys_path }}"
        line: "{{ lookup('file', execution_node_pub_key_path) | trim }}"
        create: true
        state: present
      register: install_pub_key_result

    - name: Restart sshd after key or capability change
      ansible.windows.win_service:
        name: sshd
        state: restarted
      when: install_pub_key_result is changed or ssh_install is changed
