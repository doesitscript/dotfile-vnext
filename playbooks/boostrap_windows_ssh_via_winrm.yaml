---
# Bootstrap Windows OpenSSH configuration.
# Run bootstrap_execution_node.yaml first so the SSH key exists on this machine.
# Assumes WinRM transport already works. Does NOT enable PSRemoting.
#
# ansible-playbook playbooks/boostrap_windows_ssh_via_winrm.yaml -i inventory/inventory.yaml --limit server-225-win

- name: Bootstrap Windows OpenSSH
  hosts: windows_hosts
  gather_facts: true

  vars:
    sshd_config_path: "C:\\ProgramData\\ssh\\sshd_config"
    execution_node_pub_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_ansible.pub"

  tasks:
    - name: Ensure execution node public key exists (run bootstrap_execution_node.yaml first)
      ansible.builtin.stat:
        path: "{{ execution_node_pub_key }}"
      register: execution_node_key_stat
      delegate_to: "{{ groups['execution_nodes'][0] }}"
      run_once: true

    - name: Fail if execution node SSH key missing
      ansible.builtin.fail:
        msg: "Public key not found at {{ execution_node_pub_key }}. Run: ansible-playbook playbooks/bootstrap_execution_node.yaml -i inventory/inventory.yaml"
      when: not execution_node_key_stat.stat.exists
      run_once: true

    - name: Ensure OpenSSH capability installed
      ansible.windows.win_shell: |
        $cap = Get-WindowsCapability -Name OpenSSH.Server* -Online
        if ($cap.State -ne 'Installed') {
          Add-WindowsCapability -Online -Name $cap.Name
        }
      changed_when: false

    - name: Ensure sshd service is running
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: Ensure OpenSSH firewall rule
      community.windows.win_firewall_rule:
        name: sshd-Server-In-TCP
        localport: "{{ win_ssh_port | default(22) }}"
        protocol: tcp
        action: allow
        direction: in
        state: present
        enabled: true

    - name: Ensure user .ssh directory exists
      ansible.windows.win_file:
        path: "{{ ansible_env.USERPROFILE }}\\.ssh"
        state: directory
        mode: "0700"

    - name: Read execution node public key
      ansible.builtin.set_fact:
        ansible_pub_key_content: "{{ lookup('file', execution_node_pub_key) | trim }}"
      delegate_to: "{{ groups['execution_nodes'][0] }}"
      delegate_facts: true
      run_once: true

    - name: Install public key in authorized_keys
      community.windows.win_lineinfile:
        path: "{{ ansible_env.USERPROFILE }}\\.ssh\\authorized_keys"
        line: "{{ ansible_pub_key_content }}"
        create: true
        state: present
