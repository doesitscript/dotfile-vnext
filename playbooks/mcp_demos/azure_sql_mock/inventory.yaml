---
# Azure MCP Server inventory — self-contained mock example.
# Uses stdio transport to the Azure MCP server via npx.
#
# This demo is fully self-contained: all variables come from
# group_vars/all.yml with safe mock defaults. In a production
# deployment, sensitive values would come from host_vars or vault.
all:
  children:
    mcp_servers:
      hosts:
        azure:
          ansible_connection: ansible.mcp.mcp
          ansible_mcp_server_name: azure
          ansible_mcp_server_args: []
          ansible_command_timeout: 3600
          ansible_mcp_manifest_path: "{{ playbook_dir }}/manifest.json"
