---
# GitHub MCP Server inventory — HTTP transport example.
# Unlike the AWS demos (stdio/uvx), this uses HTTP transport with
# bearer token authentication via GitHub Copilot's MCP endpoint.
all:
  children:
    mcp_servers:
      hosts:
        github:
          ansible_connection: ansible.mcp.mcp
          ansible_mcp_server_name: github
          ansible_mcp_manifest_path: "{{ playbook_dir }}/manifest.json"
          ansible_mcp_bearer_token: "{{ github_token }}"
