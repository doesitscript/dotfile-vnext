---
# GitHub MCP demo defaults.
# github_token MUST be provided at runtime (never commit tokens):
#   ansible-playbook -i inventory.yaml playbook.yaml -e github_token=ghp_...
#
# Optionally override repository details:
#   -e github_repository_name=my-test-repo
#   -e github_organization=my-org

# Repository to create
github_repository_name: "ansible-mcp-demo-repo"

# Branch for the PR
github_branch_name: "feature/ansible-mcp-demo"

# File to add to the new branch
file_path: "README.md"
file_content: |
  # Ansible MCP Demo Repository

  This repository was created by the `ansible.mcp` collection
  using the GitHub MCP Server over HTTP transport.

# Pull request details
pull_request_title: "Add README via ansible.mcp"
pull_request_body: |
  Automated PR created by the ansible.mcp GitHub demo playbook.

  This demonstrates using the GitHub MCP server's HTTP transport
  with bearer token authentication from Ansible.
