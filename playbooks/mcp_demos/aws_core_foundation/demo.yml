---
# AWS Core MCP Server Demo — Foundation Profile
#
# Demonstrates the AWS_FOUNDATION role which includes:
#   - AWS Knowledge Server: search_documentation, read_documentation,
#     list_regions, get_regional_availability, recommend
#   - AWS API Server: suggest_aws_commands, call_aws
#
# Usage:
#   ansible-playbook -i inventory.yaml demo.yml
#
# With a different region:
#   ansible-playbook -i inventory.yaml demo.yml -e aws_region=eu-west-1

- name: AWS Core MCP Server Demo - Foundation Integration
  hosts: aws_core_server
  gather_facts: false

  tasks:
    - name: Retrieve server information
      ansible.mcp.server_info:
      register: server_info

    - name: Display server details
      ansible.builtin.debug:
        msg: >-
          Connected to {{ server_info.server_info.serverInfo.name }}
          version {{ server_info.server_info.serverInfo.version }}

    - name: Discover available tools
      ansible.mcp.tools_info:
      register: tools_list

    - name: Display available tool count
      ansible.builtin.debug:
        msg: "Available tools: {{ tools_list.tools | length }}"

    - name: Display AWS Knowledge Server tools
      ansible.builtin.debug:
        msg: "Knowledge tools: {{ tools_list.tools | selectattr('name', 'search', 'aws_knowledge') | map(attribute='name') | list }}"

    - name: Display AWS API Server tools
      ansible.builtin.debug:
        msg: "API tools: {{ tools_list.tools | selectattr('name', 'search', 'aws_api') | map(attribute='name') | list }}"

    - name: Get AWS CLI command suggestions for EC2
      ansible.mcp.run_tool:
        name: aws_api_suggest_aws_commands
        args:
          query: "list EC2 instances"
      register: suggestions_result

    - name: Display command suggestions
      ansible.builtin.debug:
        msg: "{{ suggestions_result.content.0.text }}"

    - name: Search AWS documentation for S3 lifecycle policies
      ansible.mcp.run_tool:
        name: aws_knowledge_search_documentation
        args:
          query: "S3 lifecycle policies"
      register: docs_result

    - name: Display documentation search results
      ansible.builtin.debug:
        msg: "{{ docs_result.content.0.text | truncate(500) }}"
