---
# AWS Core MCP Server — Foundation profile.
# The MCP server appears as an Ansible inventory host using the
# ansible.mcp.mcp connection plugin (stdio transport via uvx).
all:
  children:
    mcp_servers:
      hosts:
        aws_core_server:
          ansible_connection: ansible.mcp.mcp
          ansible_mcp_server_name: awslabs.core-mcp-server
          ansible_mcp_server_args: []
          ansible_mcp_server_env:
            AWS_REGION: "{{ aws_region }}"
            AWS_PROFILE: "{{ aws_profile }}"
            FASTMCP_LOG_LEVEL: "{{ mcp_log_level }}"
            AWS_FOUNDATION: "true"
          ansible_mcp_manifest_path: "{{ playbook_dir }}/manifest.json"
