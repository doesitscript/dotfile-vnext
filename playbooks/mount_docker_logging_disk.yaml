---
# Initialize and mount the Docker guest logging filesystem. This is separate
# from Docker application data and from the K3s pod-log filesystem.
- name: Mount Docker guest logging filesystem
  hosts: logging_server
  gather_facts: false
  become: true
  tags: [docker_logging_storage, linux_data_disk_mount]
  pre_tasks:
    - name: Require explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
        fail_msg: "Use --limit hom-lab-ctl-dkr-02 for the Docker logging filesystem."
      run_once: true
      tags: [always]
  tasks:
    - name: Initialize and mount Docker guest logging disk
      ansible.builtin.include_role:
        name: linux_data_disk_mount
      vars:
        linux_data_disk_mount_state: present
        linux_data_disk_mount_apply: true
        linux_data_disk_mount_device_by_id: "{{ docker_logging_device_by_id }}"
        linux_data_disk_mount_expected_serial: "{{ docker_logging_expected_serial }}"
        linux_data_disk_mount_path: "{{ docker_logging_mount_path }}"
        linux_data_disk_mount_fstype: ext4
        linux_data_disk_mount_label: "{{ docker_logging_filesystem_label }}"
        linux_data_disk_mount_backup_evidence_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/implementation-receipt.md
        linux_data_disk_mount_authority_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
        linux_data_disk_mount_initialize_authorized: true
