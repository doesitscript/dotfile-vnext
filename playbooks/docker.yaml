---
# Docker-only orchestrator — engine + client + verification.
#
# The canonical full-stack entrypoint is playbooks/site.yaml.
# Use this playbook when you want Docker-only convergence or verification.
#
# Follows the same pattern as access.yaml:
#   1) docker_engine.yaml  — manage Docker Engine on opted-in Linux VM hosts
#   2) docker_client.yaml  — install Docker CLI on Mac + Windows, create SSH contexts
#   3) Verify play         — run `docker info` from each client through its SSH context
#
# Single command:
#   ansible-playbook playbooks/docker.yaml -i inventory/inventory.yaml
#
# Limit to one client:
#   ansible-playbook playbooks/docker.yaml -i inventory/inventory.yaml --limit 'linux_vm_hosts,mac-dev'

- name: Docker - engine
  import_playbook: docker_engine.yaml

- name: Docker - client
  import_playbook: docker_client.yaml

- name: Docker - verify client connectivity
  hosts: docker_clients
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Validate Docker client can reach engine
      ansible.builtin.include_role:
        name: verify_docker
        tasks_from: client.yml
