---
# Docker: full orchestrator — engine + client + verification.
#
# Follows the same pattern as access.yaml:
#   1) docker_engine.yaml  — install Docker Engine in WSL distros
#   2) docker_client.yaml  — install Docker CLI on Mac + Windows, create SSH contexts
#   3) Verify play         — run `docker info` from each client through its SSH context
#
# Single command:
#   ansible-playbook playbooks/docker.yaml -i inventory/inventory.yaml
#
# Limit to one client:
#   ansible-playbook playbooks/docker.yaml -i inventory/inventory.yaml --limit 'wsl_hosts,mac-dev'

- import_playbook: docker_engine.yaml
- import_playbook: docker_client.yaml

- name: Docker - verify client connectivity
  hosts: docker_clients
  gather_facts: false

  tasks:
    - name: Validate Docker client can reach engine
      ansible.builtin.include_role:
        name: verify_docker
        tasks_from: client.yml
