---
# Windows host baseline orchestrator.
#
# This playbook owns only the Windows-side baseline stack:
#   1. windows_base        — features, power, registry, firewall baseline
#   2. hyperv_networking   — Hyper-V features + Windows/guest networking
#   3. access              — controller keys + Windows OpenSSH surfaces
#
# The canonical full-stack entrypoint is playbooks/site.yaml.
# Use this playbook when you want the Windows baseline only.
#
# Usage:
#   Windows baseline for all Windows hosts:
#     ansible-playbook playbooks/provision_windows_host.yml
#
#   Single Windows host:
#     ansible-playbook playbooks/provision_windows_host.yml --limit server-225-win
#
- name: Step 1 - Windows base configuration
  import_playbook: windows_base.yml
- name: Step 2 - Hyper-V networking
  import_playbook: hyperv_networking.yaml
- name: Step 3 - SSH identity and access provisioning
  import_playbook: access.yaml
