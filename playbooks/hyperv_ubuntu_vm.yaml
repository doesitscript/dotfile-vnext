---
# Shared control surface for Hyper-V-native Ubuntu VM guests.
#
# Canonical full-stack entrypoint: playbooks/site.yaml.
# Use this playbook when you want guest-oriented orchestration without running
# the broader Docker/client stack.
#
# Selection model:
#   - scan windows_hosts
#   - opt in hosts with hyperv_ubuntu_vm_state: present|absent
#   - require a declared hyperv_ubuntu_vm_inventory_host
#   - preview the selected host, VM name, guest host, switch, subnet, and state
#     before any mutating role runs
#
# Commands:
#   Full guest orchestration for all opted-in Hyper-V Windows hosts:
#     ansible-playbook playbooks/hyperv_ubuntu_vm.yaml -i inventory/inventory.yaml
#
#   Limit to one physical node plus controller surfaces:
#     ansible-playbook playbooks/hyperv_ubuntu_vm.yaml -i inventory/inventory.yaml \
#       --limit 'execution_nodes,network-server-win,network-server-ubuntu,mac-dev'
#
#   VM lifecycle only after identity, networking, and routes are converged:
#     ansible-playbook playbooks/hyperv_ubuntu_vm.yaml -i inventory/inventory.yaml \
#       --tags hyperv_vm_lifecycle
#
# Troubleshooting:
#   Run with --tags collect_hyperv to trigger artifact collection alongside the
#   normal lifecycle run:
#     ansible-playbook playbooks/hyperv_ubuntu_vm.yaml -i inventory/inventory.yaml \
#       --limit network-server-win --tags collect_hyperv
#   Artifacts land at: artifacts/troubleshooting/hyperv_ubuntu_vm/<host>/<timestamp>/
#
#   Or run the dedicated collector directly (no lifecycle side effects):
#     ansible-playbook playbooks/troubleshoot/collect_hyperv_ubuntu_vm_artifacts.yaml \
#       -i inventory/inventory.yaml --limit network-server-win
#

- name: Hyper-V Ubuntu VM - classify target hosts
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: Classify Hyper-V Ubuntu VM lifecycle eligibility
      ansible.builtin.set_fact:
        hyperv_ubuntu_vm_candidate: >-
          {{
            (surface_type | default('')) == 'windows_host'
            and (hyperv_ubuntu_vm_state | default('unset')) in ['present', 'absent']
          }}
        hyperv_ubuntu_vm_lifecycle_requested: >-
          {{ (hyperv_ubuntu_vm_state | default('unset')) in ['present', 'absent'] }}
        hyperv_ubuntu_vm_guest_declared: >-
          {{ (hyperv_ubuntu_vm_inventory_host | default('') | length) > 0 }}
        hyperv_ubuntu_vm_should_manage: >-
          {{
            (surface_type | default('')) == 'windows_host'
            and (hyperv_ubuntu_vm_state | default('unset')) in ['present', 'absent']
            and (hyperv_ubuntu_vm_inventory_host | default('') | length) > 0
          }}
      changed_when: false
      tags: [always]

- name: Hyper-V Ubuntu VM - preview target selection
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [hyperv_vm_preview, always]

  tasks:
    - name: Preview Hyper-V Ubuntu VM host selection
      ansible.builtin.debug:
        msg: >-
          {{
            {
              'host': item,
              'selected': hostvars[item].hyperv_ubuntu_vm_should_manage | default(false),
              'candidate': hostvars[item].hyperv_ubuntu_vm_candidate | default(false),
              'state': hostvars[item].hyperv_ubuntu_vm_state | default('unset'),
              'vm_name': hostvars[item].hyperv_ubuntu_vm_name | default('unset'),
              'guest_inventory_host': hostvars[item].hyperv_ubuntu_vm_inventory_host | default('unset'),
              'guest_ipv4': hostvars[item].hyperv_ubuntu_vm_autoinstall_network_ipv4 | default('unset'),
              'guest_subnet': (hostvars[item].hyperv_config | default({})).guest_subnet_ipv4 | default('unset'),
              'guest_switch': (hostvars[item].hyperv_config | default({})).guest_switch_name | default('unset'),
              'reason': (
                'eligible'
                if (hostvars[item].hyperv_ubuntu_vm_should_manage | default(false))
                else 'not selected: missing lifecycle state or guest host'
              )
            }
          }}
      loop: "{{ query('inventory_hostnames', 'windows_hosts') }}"

- name: Access - controller identity
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_identity]

  roles:
    - access_identity_controller

- name: Hyper-V Ubuntu VM - host networking prerequisites
  hosts: windows_hosts
  gather_facts: false
  tags: [hyperv_networking]

  tasks:
    - name: Ensure Hyper-V host networking prerequisites are ready
      ansible.builtin.include_role:
        name: hyperv_networking
      when: hyperv_ubuntu_vm_should_manage | default(false) | bool

- name: Access - route configured guest private subnet from the controller
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [guest_route]

  tasks:
    - name: Ensure the controller can route to configured Hyper-V guest subnets
      ansible.builtin.include_role:
        name: hyperv_guest_route_mac
      when: (hyperv_guest_route_mac_state | default('absent')) == 'present'

- name: Hyper-V Ubuntu VM - lifecycle
  hosts: windows_hosts
  gather_facts: false
  tags: [hyperv_vm_lifecycle, collect_hyperv]

  tasks:
    - name: Ensure Hyper-V Ubuntu VM capability is in the requested lifecycle state
      ansible.builtin.include_role:
        name: hyperv_ubuntu_vm
      when: hyperv_ubuntu_vm_should_manage | default(false) | bool

    - name: Collect Hyper-V Ubuntu VM troubleshooting artifacts
      ansible.builtin.include_role:
        name: troubleshooting_collectors
        tasks_from: hyperv_ubuntu_vm.yml
      when: hyperv_ubuntu_vm_should_manage | default(false) | bool
      tags:
        - never
        - collect_hyperv

- name: Access - update controller SSH client config
  hosts: execution_nodes
  connection: local
  gather_facts: true
  tags: [controller_ssh_config]

  tasks:
    - name: Generate SSH client config from deployed targets
      ansible.builtin.include_role:
        name: access_identity_controller
        tasks_from: ssh_config.yml
