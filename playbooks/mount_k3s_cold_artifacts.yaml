---
# Initialize and mount only the newly attached cold-artifacts disk. This avoids
# replaying the already-converged containerd/local-path offload while the cold
# disk is commissioned.
- name: Mount K3s cold-artifacts disk
  hosts: container_orchestrator_k3s:&gpu_workload_nodes
  gather_facts: false
  become: true
  tags: [k3s_cold_artifacts, linux_data_disk_mount]
  pre_tasks:
    - name: Require explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | trim | length > 0
        fail_msg: "Use --limit hom-lab-ctl-k3s-02 for the cold-artifacts disk."
      run_once: true
      tags: [always]
  tasks:
    - name: Initialize and mount cold-artifacts disk
      ansible.builtin.include_role:
        name: linux_data_disk_mount
      vars:
        linux_data_disk_mount_state: present
        linux_data_disk_mount_apply: true
        linux_data_disk_mount_device_by_id: /dev/disk/by-id/wwn-0x600224809dde1833df85e1e26e53dfa3
        linux_data_disk_mount_expected_serial: "600224809dde1833df85e1e26e53dfa3"
        linux_data_disk_mount_path: /mnt/k3s-cold
        linux_data_disk_mount_fstype: ext4
        linux_data_disk_mount_label: k3s-cold
        linux_data_disk_mount_backup_evidence_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/implementation-receipt.md
        linux_data_disk_mount_authority_ref: >-
          docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
        linux_data_disk_mount_initialize_authorized: true
