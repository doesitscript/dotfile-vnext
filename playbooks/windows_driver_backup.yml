---
# Apply the managed Windows driver backup capability to Windows service hosts.
#
# Commands:
#   Preview first:
#     ansible-playbook playbooks/windows_driver_backup.yml --tags driver_backup_preview
#
#   Apply the managed driver backup capability:
#     ansible-playbook playbooks/windows_driver_backup.yml --tags driver_backup_apply
#
#   Explicit incremental driver backup:
#     ansible-playbook playbooks/windows_driver_backup.yml \
#       --tags driver_backup_apply \
#       -e windows_driver_backup_run_mode=incremental
#
#   Explicit force rebuild of the managed driver backup tree:
#     ansible-playbook playbooks/windows_driver_backup.yml \
#       --tags driver_backup_apply \
#       -e windows_driver_backup_run_mode=force
#
#   Remove the capability from the managed Windows service hosts after setting
#   windows_driver_backup_state=absent in inventory:
#     ansible-playbook playbooks/windows_driver_backup.yml \
#       --tags driver_backup_apply
#
- name: Classify Windows driver backup policy scope
  hosts: all
  gather_facts: false

  tasks:
    - name: Derive Windows driver backup policy inputs
      ansible.builtin.set_fact:
        windows_driver_backup_candidate: >-
          {{ (surface_type | default('')) == 'windows_host' }}
        windows_driver_backup_metadata_eligible: >-
          {{
            (operation_model | default('')) == 'service'
            and (management_boundary | default('')) == 'infra_managed'
            and (availability_expectation | default('')) == 'expected_continuous'
          }}
        windows_driver_backup_should_manage: >-
          {{
            (surface_type | default('')) == 'windows_host'
            and (operation_model | default('')) == 'service'
            and (management_boundary | default('')) == 'infra_managed'
            and (availability_expectation | default('')) == 'expected_continuous'
          }}
        windows_driver_backup_lifecycle_ready: >-
          {{ (windows_driver_backup_state | default('unset')) in ['present', 'absent'] }}
      changed_when: false
      tags:
        - always

    - name: Group Windows driver backup candidate hosts
      ansible.builtin.group_by:
        key: >-
          windows_driver_backup_candidate_{{
            windows_driver_backup_candidate | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

    - name: Group Windows driver backup metadata-eligible hosts
      ansible.builtin.group_by:
        key: >-
          windows_driver_backup_metadata_eligible_{{
            windows_driver_backup_metadata_eligible | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

    - name: Group Windows driver backup policy-managed hosts
      ansible.builtin.group_by:
        key: >-
          windows_driver_backup_should_manage_{{
            windows_driver_backup_should_manage | ternary('true', 'false')
          }}
      changed_when: false
      tags:
        - always

- name: Preview Windows driver backup eligibility from inventory metadata
  hosts: localhost
  gather_facts: false
  vars:
    windows_driver_backup_preview_hosts: >-
      {{ query('inventory_hostnames', 'windows_driver_backup_candidate_true') }}

  tasks:
    - name: Summarize Windows driver backup eligibility
      ansible.builtin.debug:
        msg:
          - "Host: {{ item }}"
          - "Surface type: {{ hostvars[item]['surface_type'] | default('unset') }}"
          - "Operation model: {{ hostvars[item]['operation_model'] | default('unset') }}"
          - "Management boundary: {{ hostvars[item]['management_boundary'] | default('unset') }}"
          - "Availability expectation: {{ hostvars[item]['availability_expectation'] | default('unset') }}"
          - "Windows candidate: {{ hostvars[item]['windows_driver_backup_candidate'] | default(false) }}"
          - "Metadata eligible: {{ hostvars[item]['windows_driver_backup_metadata_eligible'] | default(false) }}"
          - "Derived policy should manage: {{ hostvars[item]['windows_driver_backup_should_manage'] | default(false) }}"
          - >-
            Requested state: {{
              hostvars[item]['windows_driver_backup_state'] | default('unset')
            }}
          - "Lifecycle state ready: {{ hostvars[item]['windows_driver_backup_lifecycle_ready'] | default(false) }}"
          - >-
            Will apply on normal run: {{
              (hostvars[item]['windows_driver_backup_should_manage'] | default(false))
              and (hostvars[item]['windows_driver_backup_lifecycle_ready'] | default(false))
            }}
      loop: "{{ windows_driver_backup_preview_hosts }}"
      tags:
        - driver_backup_preview

- name: Preview and apply Windows driver backup capability
  hosts: windows_driver_backup_should_manage_true
  gather_facts: false

  tasks:
    - name: Preview Windows driver backup capability
      ansible.builtin.include_role:
        name: windows_driver_backup
        tasks_from: preview.yml
        apply:
          tags:
            - driver_backup_preview
      tags:
        - driver_backup_preview

    - name: Apply Windows driver backup capability
      ansible.builtin.include_role:
        name: windows_driver_backup
        apply:
          tags:
            - driver_backup_apply
      tags:
        - never
        - driver_backup_apply
