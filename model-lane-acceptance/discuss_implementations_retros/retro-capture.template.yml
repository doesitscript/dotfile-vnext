---
# Minimal retro capture template — model + gateway + client day-2
#
# Copy this file (or fill in place) when discussing an implementation.
# Do NOT invent model ids here — refresh from the three authorities below.
#
# First use focus: Continue. Cline / Codex sections are reserved stubs.
#
# Related fuller day-2 scaffold (optional):
#   inventory/group_vars/all/ai_cli_client_day2-INPUTS.template.yml

schema: model_lane_retro_capture_v0

meta:
  date: ""
  title: ""
  # continue | cline | codex | multi
  focus_client: continue
  # draft | in_progress | closed
  status: draft
  notes: ""

# ---------------------------------------------------------------------------
# Authorities (read these; do not duplicate full SSOT)
# ---------------------------------------------------------------------------
authorities:
  client_model_ids: roles/k3s_litellm_gateway/defaults/main/model_client_ids.yml
  runtime_backends: inventory/host_vars/hom-lab-ctl-k3s-02.yaml
  commissioned_ssot: inventory/group_vars/all/ai_cli_apps.yml

# ---------------------------------------------------------------------------
# 1) Runner — where the weight is served (vLLM, Ollama, …)
# ---------------------------------------------------------------------------
runner:
  kind: "" # vllm | ollama | other
  host_or_surface: "" # e.g. hom-lab-ctl-k3s-02 / ollama-hvh01
  model_id: "" # HF repo, Ollama tag, or served name
  key_flags: {} # e.g. tool_call_parser, max_model_len, gpu_memory_utilization
  notes: ""

# ---------------------------------------------------------------------------
# 2) LiteLLM — gateway route / sampling / model_info involved
# ---------------------------------------------------------------------------
litellm:
  client_model_name: "" # plain id from model_client_ids.yml
  backend_model: "" # hosted_vllm/… or ollama tag behind the route
  api_base_internal: ""
  sampling: {} # temperature, top_p, top_k, repetition_penalty, …
  model_info: {} # max_tokens, max_input_tokens, max_output_tokens, notes, …
  notes: ""

# ---------------------------------------------------------------------------
# 3) Client day-2 inputs — Continue first; room for others later
# ---------------------------------------------------------------------------
clients:
  continue:
    status: in_scope # in_scope | reserved | n_a
    # Snapshot of role-bearing entries / knobs you actually changed or reviewed
    roles: {} # chat | edit | apply | autocomplete | embed → model id
    default_completion_options: {} # contextLength, maxTokens, temperature, …
    capabilities: [] # e.g. tool_use
    other: {} # promptTemplates, useLegacyCompletionsEndpoint, local models, …
    notes: ""

  cline:
    status: reserved
    model: ""
    context_window: null
    max_output_tokens: null
    other: {}
    notes: ""

  codex:
    status: reserved
    profile: ""
    model: ""
    other: {}
    notes: ""

# ---------------------------------------------------------------------------
# Retro outcome (optional, fill when closing the discussion)
# ---------------------------------------------------------------------------
outcome:
  keep_model: null # true | false | null
  changes_applied: []
  follow_ups: []
