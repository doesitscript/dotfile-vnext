# dotfile-vnext: which local AI client uses which LiteLLM model@host lane.
# Acceptance manifests in gateway/ and codex/ must align with this map.
#
# Status: approved | experimental | pending_research
# Stack implementer intake example (Codex campaign):
# docs/plans/2026-09-01--homelab-model-lane-atdd-coordination/examples/stack-implementer-intake-client-model-map.example.md
# ATDD coordination plan:
# docs/plans/2026-09-01--homelab-model-lane-atdd-coordination/README.md

clients:
  model_iteration_candidates:
    product: 2026-09-11 model iteration qualification
    status: pending
    acceptance: gateway/pending/model-iteration-2026-09-11.yml
    lanes:
      - model: Qwen3-Coder-30B-A3B
        lane: qwen3-coder-30b-a3b
        runtime: vllm
        status: published_pending_behavioral_receipts
      - model: Qwen3.6-35B-A3B
        lane: qwen3.6-35b-a3b
        runtime: vllm_sequential
        status: pending_runtime_publication
      - model: gpt-oss-20b
        lane: gpt-oss-20b
        runtime: ollama
        status: pending_gateway_publication
      - model: Devstral Small 2
        lane: devstral-small-2@k3s02-llama-cpp
        runtime: llama_cpp
        status: pending_runtime_publication
      - model: GLM-4.6
        lane: glm-4.6@k3s02-llama-cpp
        runtime: llama_cpp
        status: pending_runtime_publication

  continue:
    product: Continue IDE (VS Code-compatible)
    host: mac-dev
    lanes:
      - role: chat_quality
        lane: qwen3-coder-30b-a3b
        status: pending_behavioral_qualification
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
      - role: edit_apply
        lane: qwen2.5-coder-7b@desktop
        status: approved
        acceptance: gateway/manifest.yml
      - role: autocomplete_fim
        lane: qwen2.5-coder-1.5b@hvh01
        status: approved
        acceptance: gateway/manifest.yml
        notes: >-
          Human need = Tab/ghost-text FIM. ATDD:
          gateway/continue-embed-and-fim-atdd.md §2. Run -m llm_fim.
      - role: embed_codebase
        lane: nomic-embed-text@hvh01
        status: contract_written_harness_gap
        acceptance: gateway/continue-embed-and-fim-atdd.md
        pending_manifest: gateway/pending/continue-embed-nomic-hvh01.yml
        notes: >-
          Human need = @Codebase/@Docs vectors (768 dims). Ops smoke passed
          2026-09-12; pytest type:embed not in harness yet.

# Codex + OpenCode chat/tools lanes aligned to Qwen3.6-35B-A3B primary
# (qwen3.6-35b-a3b). Desktop 7B stays for fast/edit only.
  codex_cli:
    product: codex-homelab terminal profiles
    profiles:
      - profile: qwen3.6-35b-a3b
        launcher: deep
        config: roles/codex_homelab_profiles/files/codex-profiles/qwen3.6-35b-a3b.config.toml
        lane: qwen3.6-35b-a3b
        status: pending_behavioral_qualification
        acceptance: codex/pending/tool-loop.yml
        notes: Chat is live; tool-call behavior is not yet qualified. Replaces opaque local-deep.
      - profile: fast
        lane: qwen2.5-coder-7b@desktop
        status: experimental
      - profile: qwen3.6-35b-a3b-tools
        launcher: tools
        config: roles/codex_homelab_profiles/files/codex-profiles/qwen3.6-35b-a3b-tools.config.toml
        lane: qwen3.6-35b-a3b
        status: pending_behavioral_qualification
        acceptance: codex/pending/tool-loop.yml
        notes: Same Qwen3.6 model with tools instructions; replaces opaque local-tools.
      - profile: hom-lab
        lane: qwen2.5-coder-7b@desktop
        status: experimental

  opencode:
    product: OpenCode CLI
    lanes:
      - role: edit
        lane: qwen2.5-coder-7b@desktop
        status: approved
        acceptance: gateway/manifest.yml
      - role: chat_agent_primary
        lane: qwen3.6-35b-a3b
        status: pending_behavioral_qualification
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
      - role: generalist_evaluation
        lane: qwen3.6-35b-a3b
        status: pending_runtime_publication
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
      - role: alternate_agent_evaluation
        lane: devstral-small-2@k3s02-llama-cpp
        status: pending_runtime_publication
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
      - role: experimental_chat_evaluation
        lane: glm-4.6@k3s02-llama-cpp
        status: pending_runtime_publication
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
      - role: small_generalist_evaluation
        lane: gpt-oss-20b
        status: pending_gateway_publication
        acceptance: gateway/pending/model-iteration-2026-09-11.yml
