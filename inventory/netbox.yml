---
plugin: netbox.netbox.nb_inventory
# LAN portproxy on HOM-LAB-HVH-02 (roles/ipam_netbox/README.md Network Access).
# SSH tunnel instead: use inventory/netbox_tunnel.yml (127.0.0.1:18000).
# Token: NETBOX_TOKEN from bin/load-netbox-controller-env.sh (.envrc / bin/codex-env).
api_endpoint: http://192.168.50.158:8000
token: "{{ lookup('env', 'NETBOX_TOKEN') | default('') }}"
validate_certs: false
config_context: true
interfaces: true
group_by:
  - sites
  - tags
  - device_roles
  - platforms
  - cluster
  - is_virtual
query_filters:
  - tag: ansible-managed
device_query_filters:
  - tag: ansible-managed
vm_query_filters:
  - tag: ansible-managed
compose:
  ansible_host: primary_ip4.address.split('/')[0]
