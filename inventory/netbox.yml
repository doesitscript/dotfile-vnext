---
plugin: netbox.netbox.nb_inventory
# LAN portproxy; use http://127.0.0.1:18000 when SSH tunnel is active (Mac controller)
api_endpoint: http://127.0.0.1:18000
token: "{{ lookup('env', 'NETBOX_TOKEN') | default('') }}"
validate_certs: false
config_context: true
interfaces: true
group_by:
  - sites
  - tags
  - device_roles
  - platforms
  - cluster
  - is_virtual
query_filters:
  - tag: ansible-managed
device_query_filters:
  - tag: ansible-managed
vm_query_filters:
  - tag: ansible-managed
compose:
  ansible_host: primary_ip4.address.split('/')[0]
