---
# FUZLANG Infrastructure Inventory
# Inventory hostnames should follow the NetBox source-of-truth name when a
# modeled NetBox object exists. Older `*-win` names are legacy control aliases,
# not current source-of-truth names.
# Linux VM guests still use explicit OS/runtime suffixes until their NetBox
# naming migration is planned.
#
# Group names (server_225, network_server, dev_3090, mac_dev) match:
#   - group_vars/<group>.yaml or group_vars/<group>/  (so Ansible loads the right vars)
#   - physical node / host_vars "base" naming (server-225 -> server_225, etc.)
# host_vars files are only for inventory host names such as
# hom-lab-ctl-hvh-01, hom-lab-ctl-hvh-02, server-225-ubuntu, mac-dev, etc.

all:
  children:
    # Execution plane: host(s) where Ansible runs and where the SSH key lives (~/.ssh/id_ed25519_ansible).
    execution_nodes:
      hosts:
        mac-dev:
      vars:
        ansible_connection: local

    # Online Windows host surfaces (WinRM). This is the default execution group
    # for normal Windows desired-state applies. Temporarily offline or
    # not-yet-provisioned Windows surfaces stay out of this group to avoid
    # slow unreachable-host timeouts during routine runs.
    windows_hosts:
      hosts:
        hom-lab-ctl-hvh-02:
          # All connection details in host_vars/hom-lab-ctl-hvh-02.yaml

        hom-lab-ctl-hvh-01:
          # All connection details in host_vars/hom-lab-ctl-hvh-01.yaml

    # All known Windows OS surfaces, regardless of current reachability. Use
    # this group for inventory/reporting and desired-state scope discussions,
    # not as the default mutation target.
    windows_os_hosts:
      children:
        windows_hosts: {}
        windows_hosts_offline: {}
        windows_hosts_deferred: {}

    # Deployed Windows hosts that are temporarily offline or intentionally not
    # in the normal online execution set. Move hosts into windows_hosts when
    # they should participate in routine Windows desired-state applies.
    windows_hosts_offline:
      hosts:
        dev-workstation-win:

    # Windows hosts that expose repo-managed SMB file shares.
    # This is intentionally narrower than windows_hosts so share mutations stay
    # scoped to hosts with explicit file-share intent.
    windows_file_share_hosts:
      hosts:
        hom-lab-ctl-hvh-02:
        hom-lab-ctl-hvh-01:

    # Additive IPv6 fallback/control-plane surfaces for Windows hosts.
    # Keep these out of normal windows_hosts targeting so they remain explicit
    # operator/troubleshooting entry points instead of changing the default path.
    windows_hosts_ipv6_fallback:
      hosts:
        hom-lab-ctl-hvh-02-ipv6:
          # IPv6 WinRM fallback for hom-lab-ctl-hvh-02

    # Not-yet-deployed Windows hosts. Move to windows_hosts when ready to provision.
    # Deferred hosts stay absent from active groups so they are never targeted.
    windows_hosts_deferred:
      hosts:
        dev-3090-win:

    # Linux VMs that are directly reachable over SSH.
    # Hyper-V-native guests should use the explicit -ubuntu naming model.
    linux_vm_hosts:
      hosts:
        server-225-ubuntu:
          # Active Hyper-V Ubuntu guest on hom-lab-ctl-hvh-02.
        hom-lab-ctl-k3s-02:
          # Planned K3s Ubuntu guest on the RTX 5090 server-225 host.
        hom-lab-ctl-dkr-01:
          # Planned Docker Ubuntu guest on hom-lab-ctl-hvh-01.
        hom-lab-ctl-k3s-01:
          # Planned K3s Ubuntu guest on hom-lab-ctl-hvh-01.

    # K3s VM prep/stub targets. These hosts are ready for base VM and
    # readiness-stub work only; real K3s installation stays behind k3s_cluster.
    k3s_vm_stub_hosts:
      hosts:
        hom-lab-ctl-k3s-01:
        hom-lab-ctl-k3s-02:

    # SSH targets: hosts that may need an entry in the controller's ~/.ssh/config.
    # Windows hosts render from OpenSSH desired state. Linux VMs render when
    # they have realized connection facts.
    ssh_targets:
      children:
        windows_hosts: {}
        linux_vm_hosts: {}

    # Docker clients: hosts that need the Docker CLI + SSH context to a Docker engine.
    # The engine itself runs on the Linux companion side; these are consumers only.
    docker_clients:
      children:
        execution_nodes: {}
      hosts:
        hom-lab-ctl-hvh-02:
        hom-lab-ctl-hvh-01:
        # dev-workstation-win: # deferred — add back when provisioned

    # Physical-node groups (names match group_vars/<group>.yaml and host_vars base names)
    server_225:
      hosts:
        hom-lab-ctl-hvh-02:
        server-225-ubuntu:

    network_server:
      hosts:
        hom-lab-ctl-hvh-01:
        hom-lab-ctl-dkr-01:
        hom-lab-ctl-k3s-01:

    dev_3090:
      hosts:
        dev-3090-win:

    dev_workstation:
      hosts:
        dev-workstation-win:

    # -- k3s cluster groups (collection expects k3s_cluster > server + agent) ----------
    # Single-node K3s server lane on the dedicated Hyper-V Ubuntu VM. VM
    # prep/stub work remains available through k3s_vm_stub_hosts as preflight.
    # k3s_version, token, api_endpoint live in group_vars/k3s_cluster.yaml -- do not duplicate here.
    k3s_cluster:
      children:
        server:
          hosts:
            hom-lab-ctl-k3s-01:
        agent:
          hosts: {}

    # Loki logging server — host that runs the Loki Docker container.
    # Change the host here to move the Loki server to a different node.
    logging_server:
      hosts:
        server-225-ubuntu:

    mac_dev:
      hosts:
        mac-dev:
          ansible_host: "Joshs-MBP" # mac-dev IP or hostname (preserved capitalization)
          ansible_connection: local # Use local connection since Ansible runs on this Mac
          ansible_user: "joshc"
          surface_type: macos

  vars:
    ansible_python_interpreter: auto
