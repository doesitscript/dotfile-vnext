---
# FUZLANG Infrastructure Inventory
# Dual-surface model: each Windows host has -win and -wsl inventory hostnames.
# `-win` is the bootstrap surface (WinRM). `-wsl` starts as a companion identity
# behind `-win` and becomes a direct SSH surface only after SSH is configured.
#
# Group names (server_225, network_server, dev_3090, mac_dev) match:
#   - group_vars/<group>.yaml  (so Ansible loads the right vars)
#   - physical node / host_vars "base" naming (server-225 -> server_225, etc.)
# host_vars files are only for inventory host names: server-225-win, server-225-wsl, mac-dev, etc.

all:
  children:
    # Execution plane: host(s) where Ansible runs and where the SSH key lives (~/.ssh/id_ed25519_ansible).
    execution_nodes:
      hosts:
        mac-dev:
      vars:
        ansible_connection: local

    # Windows host surfaces (WinRM)
    # ansible_host and connection details come from host_vars/<node>-win.yaml
    # These files are generated by bin/bootstrap-local.ps1 on each Windows node
    windows_hosts:
      hosts:
        server-225-win:
          # All connection details in host_vars/server-225-win.yaml

        network-server-win:
          # All connection details in host_vars/network-server-win.yaml

    # Additive IPv6 fallback/control-plane surfaces for Windows hosts.
    # Keep these out of normal windows_hosts targeting so they remain explicit
    # operator/troubleshooting entry points instead of changing the default path.
    windows_hosts_ipv6_fallback:
      hosts:
        server-225-win-ipv6:
          # IPv6 WinRM fallback for server-225-win

    # Not-yet-deployed Windows hosts. Move to windows_hosts when ready to provision.
    # Follows k3s_agents_deferred pattern — absent from active groups = never targeted.
    windows_hosts_deferred:
      hosts: {}
        # dev-3090-win:        # enable when provisioned
        # dev-workstation-win: # enable when provisioned

    # Linux companion hosts reachable directly over SSH.
    # Historical note: the inventory hostnames still use the -wsl suffix.
    # ansible_host and connection details come from host_vars/<node>-wsl.yaml.
    # These files are generated by bin/bootstrap-local.ps1 on each Windows node.
    wsl_hosts:
      hosts:
        server-225-wsl:
          # All connection details in host_vars/server-225-wsl.yaml

        network-server-wsl:
          # All connection details in host_vars/network-server-wsl.yaml

    # Not-yet-promoted Linux companion hosts. Move to wsl_hosts when SSH is ready.
    wsl_hosts_deferred:
      hosts: {}
        # dev-3090-wsl: # enable when provisioned

    # Linux VMs that are directly reachable over SSH.
    # These are not WSL companion surfaces and should not inherit the legacy -wsl naming model.
    linux_vm_hosts:
      hosts:
        server-225-ubuntu:
          # Reserved Ubuntu VM inventory surface on server-225.
          # The Hyper-V-native replacement will reuse this inventory host.

    # SSH targets: hosts that may need an entry in the controller's ~/.ssh/config.
    # Windows hosts render from OpenSSH desired state. Active wsl_hosts render
    # by group membership. Linux VMs render when they have realized connection
    # facts.
    ssh_targets:
      children:
        windows_hosts: {}
        wsl_hosts: {}
        linux_vm_hosts: {}

    # Docker clients: hosts that need the Docker CLI + SSH context to a Docker engine.
    # The engine itself runs on the Linux companion side; these are consumers only.
    docker_clients:
      children:
        execution_nodes: {}
      hosts:
        server-225-win:
        network-server-win:
        # dev-workstation-win: # deferred — add back when provisioned

    # Physical-node groups (names match group_vars/<group>.yaml and host_vars base names)
    server_225:
      hosts:
        server-225-win:
        server-225-wsl:
        server-225-ubuntu:

    network_server:
      hosts:
        network-server-win:
        network-server-wsl:

    dev_3090:
      hosts:
        dev-3090-win:
        dev-3090-wsl:

    dev_workstation:
      hosts:
        dev-workstation-win:
        dev-workstation-wsl:  # Linux companion not yet promoted to direct SSH use

    # -- k3s cluster groups (collection expects k3s_cluster > server + agent) ----------
    # k3s_version, token, api_endpoint live in group_vars/k3s_cluster.yaml -- do not duplicate here.
    # Only place hosts here after the Linux companion side is directly reachable over SSH.
    k3s_cluster:
      children:
        server:
          hosts:
            network-server-wsl:
        agent:
          hosts:
            server-225-wsl:

    # Deferred k3s nodes -- NOT under k3s_cluster so the collection won't target them.
    # Move to k3s_cluster > agent when direct SSH + RAM are ready.
    k3s_agents_deferred:
      hosts: {}
        # dev-workstation-wsl:  # enable when WSL + SSH set up

    # Loki logging server — host that runs the Loki Docker container.
    # Change the host here to move the Loki server to a different node.
    logging_server:
      hosts:
        network-server-wsl:

    mac_dev:
      hosts:
        mac-dev:
          ansible_host: "Joshs-MBP" # mac-dev IP or hostname (preserved capitalization)
          ansible_connection: local # Use local connection since Ansible runs on this Mac
          ansible_user: "joshc"
          surface_type: macos

  vars:
    ansible_python_interpreter: auto
