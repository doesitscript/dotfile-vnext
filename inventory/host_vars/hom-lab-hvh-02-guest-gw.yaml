---
# Inventory name: HOM-LAB-HVH-02-guest-gw
# Guest-switch gateway fallback/control-plane surface for HOM-LAB-HVH-02.
# Not in default windows_hosts targeting — use with --limit when LAN SSH fails.
# Primary connection: SSH. WinRM retained only as commented legacy fallback.
ansible_host: "192.168.137.1"
ansible_connection: ssh
ansible_port: 22
ansible_user: "joshc"
ansible_ssh_private_key_file: "/Users/joshc/.ssh/id_ed25519_ansible"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_shell_type: "powershell"
ansible_shell_executable: "powershell.exe"
surface_type: "windows_host"
physical_node: "HOM-LAB-HVH-02"
guest_gateway_for: "HOM-LAB-HVH-02"
host_ip: "192.168.50.158"
hyperv_management_endpoint: "{{ ansible_host }}"
os_hostname: "HOM-LAB-HVH-02"
hyperv_ubuntu_k3s_vm_hostname: "hom-lab-ctl-k3s-02"
hyperv_ubuntu_k3s_vm_inventory_host: "hom-lab-ctl-k3s-02"
verify_ssh_from_execnode: true

