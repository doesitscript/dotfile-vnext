---
# Active Hyper-V-native Docker Ubuntu VM surface on HOM-LAB-HVH-01.
# Inventory identity and desired guest hostname / Hyper-V VM name are
# hom-lab-ctl-dkr-01.

physical_node: "HOM-LAB-HVH-01"
surface_type: "ubuntu_vm"
node_classes:
  - docker_runtime
  - storage_observability
hardware_classes:
  - bulk_storage
runtime_planes:
  docker_engine:
    enabled: true
    purpose: storage_observability
policy_classes:
  - authoritative_data
  - lan_exposed_services
ansible_host: "192.168.138.10"
host_ip: "192.168.138.10"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "HOM-LAB-HVH-01"
docker_engine_state: present
ansible_ssh_common_args: >-
  -o ProxyJump=HOM-LAB-HVH-01
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
stacks_network_langfuse_compose_enabled: false
