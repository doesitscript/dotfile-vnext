---
# Inventory name: hom-lab-ctl-k3s-02
#   Ansible/NetBox schema alias. NOT necessarily the guest OS hostname.
# Connect target: ansible_host / host_ip (192.168.137.11)
# physical_node: server-225 — metadata grouping key, NOT a hostname.
# ssh_proxy_jump_host: hom-lab-ctl-hvh-02 — inventory alias for ProxyJump/SSH config.

physical_node: "server-225"
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  k3s_node:
    enabled: true
    purpose: gpu_worker_stub
policy_classes:
  - experimental
  - non_authoritative_data
ansible_host: "192.168.137.11"
host_ip: "192.168.137.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "hom-lab-ctl-hvh-02"
# Same Hyper-V host lane as server-225-ubuntu — use guest IP, not inventory names, in DB URLs.
fuzlang_external_postgres_connect_address: "192.168.137.10"
ansible_ssh_common_args: >-
  -o ProxyJump=hom-lab-ctl-hvh-02
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
k3s_readiness_stub_expected_runtime: absent
