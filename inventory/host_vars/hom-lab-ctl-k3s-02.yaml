---
# Inventory name: hom-lab-ctl-k3s-02
#   Ansible/NetBox schema alias. NOT necessarily the guest OS hostname.
# Connect target: ansible_host / host_ip (192.168.137.11)
# physical_node: hom-lab-ctl-hvh-02 — metadata grouping key, NOT a hostname.
# ssh_proxy_jump_host: hom-lab-ctl-hvh-02 — inventory alias for ProxyJump/SSH config.

physical_node: "hom-lab-ctl-hvh-02"
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  k3s_node:
    enabled: true
    purpose: gpu_inference_runtime
policy_classes:
  - experimental
  - non_authoritative_data
ansible_host: "192.168.137.11"
host_ip: "192.168.137.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "hom-lab-ctl-hvh-02"
# External fuzlang data-plane services now prefer the storage-lane Windows
# published route so the path is stable from anywhere on the LAN.
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
k3s_readiness_stub_expected_runtime: present

# Operator /etc/hosts for hom.lab URLs (LAN publish IP via portproxy).
homelab_hosts_file_linux_enabled: true
