---
# Inventory name: hom-lab-ctl-k3s-02
#   Ansible/NetBox schema alias. NOT necessarily the guest OS hostname.
# Connect target: ansible_host / host_ip (192.168.137.11)
# physical_node: HOM-LAB-HVH-02 — metadata grouping key, NOT a hostname.
# ssh_proxy_jump_host: HOM-LAB-HVH-02 — inventory alias for ProxyJump/SSH config.

physical_node: "HOM-LAB-HVH-02"
host_kind: "vm"
parent_hypervisor: "HOM-LAB-HVH-02"
workload_runtime:
  type: k3s
  role: server
node_capabilities:
  - k3s_node
  - container_orchestrator_node
  - gpu_workload_node
  - nvidia_container_runtime
  - ai_inference_stack_node
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  k3s_node:
    enabled: true
    purpose: gpu_inference_runtime
policy_classes:
  - experimental
  - non_authoritative_data
gpu_contract:
  vendor: nvidia
  partitioned: true
  passthrough_mode: gpu_p
  workloads_enabled: true
  runtime: nvidia_container_runtime
ansible_host: "192.168.137.11"
host_ip: "192.168.137.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ansible_ssh_private_key_file: "~/.ssh/id_ed25519_ansible"
ssh_proxy_jump_host: "HOM-LAB-HVH-02"
# External Langfuse platform data-plane services prefer the storage-lane Windows
# published route so the path is stable from anywhere on the LAN.
ansible_ssh_common_args: >-
  -o ProxyJump=HOM-LAB-HVH-02
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
k3s_readiness_stub_expected_runtime: present
k3s_vllm_runtime_cpu_request: "1200m"
k3s_vllm_runtime_memory_request: 2Gi
k3s_vllm_runtime_memory_limit: 8Gi
k3s_vllm_runtime_enable_auto_tool_choice: true
k3s_vllm_runtime_tool_call_parser: "qwen2_5_coder"
k3s_vllm_runtime_tool_parser_plugin_enabled: true
# 5090 vLLM — Qwen2.5-Coder-32B AWQ @ 32k context.
# Memory tuning (vLLM docs): fp8 KV cache shrinks KV pool ~50% without lowering
# --max-model-len; gpu-memory-utilization sets KV budget from free VRAM after weights.
# Prior 32B deploy failed during K3s apiserver restart — not confirmed OOM.
k3s_vllm_runtime_model: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
k3s_vllm_runtime_served_model_name: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
k3s_vllm_runtime_extra_args:
  - --gpu-memory-utilization
  - "0.92"
  - --max-model-len
  - "32768"
  - --kv-cache-dtype
  - "fp8"
  - --max-num-seqs
  - "4"
k3s_langfuse_platform_web_cpu_request: "150m"
k3s_langfuse_platform_web_memory_request: "512Mi"
k3s_langfuse_platform_worker_cpu_request: "100m"
k3s_langfuse_platform_worker_memory_request: "384Mi"

# Operator /etc/hosts for hom.lab URLs (LAN publish IP via portproxy).
homelab_hosts_file_linux_enabled: true

# Pod DNS: publish catalog *.hom.lab into K3s CoreDNS (coredns-custom).
k3s_coredns_homelab_hosts_state: present

# Hyper-V GPU-P guests use the Windows DriverStore via
# hyperv_ubuntu_gpu_p_linux_guest_runtime — not apt nvidia-driver-*.
k3s_nvidia_runtime_install_guest_driver: false
k3s_nvidia_runtime_remove_guest_driver: false
k3s_nvidia_runtime_validate_nvidia_smi: false

# Reach Hyper-V host SMB/SSH via Guest-switch gateway from this VM.
hyperv_ubuntu_gpu_p_linux_guest_runtime_share_host_override: >-
  {{
    hostvars[parent_hypervisor].hyperv_config.guest_gateway_ipv4
    | default('192.168.137.1')
    | regex_replace('/.*', '')
  }}

# Additive shared-service deployment profile for AI playbook work.
ai_service_profile:
  description: GPU-lane K3s guest that hosts the shared AI inference stack services.
  tags:
    - ai-service-profile
    - k3s
    - gpu-lane
    - shared-services
  deployable_services:
    - service_key: litellm_gateway
      description: Shared LiteLLM gateway target for OpenAI-compatible client access.
      deployed_by_role: k3s_litellm_gateway
      service_slug: litellm-k3s-gateway
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - litellm
        - gateway
        - deploy-target
        - ai-inference-stack
    - service_key: langfuse_platform
      description: Shared Langfuse observability target on the GPU-lane K3s guest.
      deployed_by_role: k3s_langfuse_platform
      service_slug: langfuse-k3s-web
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - langfuse
        - observability
        - deploy-target
    - service_key: vllm_primary_runtime
      description: Primary local vLLM for qwen2.5-coder-32b@k3s02-vllm (Continue chat).
      deployed_by_role: k3s_vllm_runtime
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - vllm
        - runtime
        - primary

# Continue edit (desktop Ollama qwen2.5-coder:7b).
k3s_litellm_gateway_primary_vllm_api_base: "http://vllm-primary.vllm-runtime.svc.cluster.local:8000/v1"
k3s_litellm_gateway_primary_vllm_model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
k3s_litellm_gateway_continue_edit_api_base: "http://ollama-desktop.hom.lab:11434/v1"
k3s_litellm_gateway_continue_edit_model: "qwen2.5-coder:7b"
k3s_litellm_gateway_continue_edit_provider: "openai"

# Kilo autocomplete (HVH-01 Ollama).
k3s_litellm_gateway_autocomplete_1_5b_api_base: "http://ollama-hvh01.hom.lab:11434/v1"
k3s_litellm_gateway_autocomplete_1_5b_model: "qwen2.5-coder:1.5b"
k3s_litellm_gateway_autocomplete_1_5b_provider: "openai"

# RETIRED (Kilo clean setup) — Continue / Open WebUI / non-Kilo desktop models:
# k3s_litellm_gateway_continue_edit_api_base: "http://ollama-desktop.hom.lab:11434/v1"
# k3s_litellm_gateway_continue_apply_api_base: "http://ollama-hvh01.hom.lab:11434/v1"
# k3s_litellm_gateway_gemma4_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_qwen36_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_gpt_oss_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_devstral_chat_api_base: "http://ollama-desktop.hom.lab:11434"

# Kilo fallback (desktop Ollama).
k3s_litellm_gateway_kilo_fast_chat_api_base: "http://ollama-desktop.hom.lab:11434"
k3s_litellm_gateway_kilo_fast_chat_model: "ministral-3:8b"
k3s_litellm_gateway_kilo_fast_chat_provider: "ollama"

# ---------------------------------------------------------------------------
# GPU time-share on this host (single nvidia.com/gpu) — Phase B on vs off
# Doc: docs/reference/k3s-02-gpu-timeshare-phase-b.md
#
# Exactly one of vLLM / ComfyUI / Ollama should be present on the GPU.
# LiteLLM gateway stays up either way; only the vLLM primary backend moves.
#
# --- Phase B OFF (default steady-state: Ornith for LiteLLM) ---
#   k3s_vllm_runtime_state: present
#   k3s_comfyui_runtime_state: absent
#   k3s_ollama_runtime_state: absent
# Playbooks (order matters — tear down Comfy before bringing Ornith up):
#   ansible-playbook playbooks/deploy_comfyui_runtime.yaml --limit hom-lab-ctl-k3s-02
#   ansible-playbook playbooks/deploy_vllm_runtime.yaml --limit hom-lab-ctl-k3s-02
#
# --- Phase B ON (ComfyUI holds the 5090; Ornith paused) ---
#   k3s_vllm_runtime_state: absent
#   k3s_comfyui_runtime_state: present
#   k3s_ollama_runtime_state: absent
# Playbooks (order matters — tear down Ornith before bringing Comfy up):
#   ansible-playbook playbooks/deploy_vllm_runtime.yaml --limit hom-lab-ctl-k3s-02
#   ansible-playbook playbooks/deploy_comfyui_runtime.yaml --limit hom-lab-ctl-k3s-02
#
# Current values below = Phase B OFF.
# ---------------------------------------------------------------------------
k3s_vllm_runtime_state: present
k3s_ollama_runtime_state: absent
k3s_comfyui_runtime_state: absent

# ComfyUI pod memory (used only when k3s_comfyui_runtime_state: present).
k3s_comfyui_runtime_memory_request: 4Gi
k3s_comfyui_runtime_memory_limit: 20Gi

# RETIRED (Kilo clean setup) — Open WebUI / prompt-assist / devstral gateway rows:
# k3s_litellm_gateway_gemma4_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_qwen36_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_gpt_oss_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_positive_negative_prompt_assist_chat_api_base: "http://ollama-desktop.hom.lab:11434"
# k3s_litellm_gateway_devstral_chat_api_base: "http://ollama-desktop.hom.lab:11434"

# Kilo fallback when 5090 vLLM path is down (ministral on desktop Ollama).
k3s_litellm_gateway_kilo_fast_chat_api_base: "http://ollama-desktop.hom.lab:11434"
k3s_litellm_gateway_kilo_fast_chat_model: "ministral-3:8b"
k3s_litellm_gateway_kilo_fast_chat_provider: "ollama"
