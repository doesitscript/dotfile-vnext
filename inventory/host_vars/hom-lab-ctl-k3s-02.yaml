---
# Inventory name: hom-lab-ctl-k3s-02
#   Ansible/NetBox schema alias. NOT necessarily the guest OS hostname.
# Connect target: ansible_host / host_ip (192.168.137.11)
# physical_node: HOM-LAB-HVH-02 — metadata grouping key, NOT a hostname.
# ssh_proxy_jump_host: HOM-LAB-HVH-02 — inventory alias for ProxyJump/SSH config.

physical_node: "HOM-LAB-HVH-02"
host_kind: "vm"
parent_hypervisor: "HOM-LAB-HVH-02"
workload_runtime:
  type: k3s
  role: server
node_capabilities:
  - k3s_node
  - container_orchestrator_node
  - gpu_workload_node
  - nvidia_container_runtime
  - ai_inference_stack_node
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  k3s_node:
    enabled: true
    purpose: gpu_inference_runtime
policy_classes:
  - experimental
  - non_authoritative_data
gpu_contract:
  vendor: nvidia
  partitioned: true
  passthrough_mode: gpu_p
  workloads_enabled: true
  runtime: nvidia_container_runtime
ansible_host: "192.168.137.11"
host_ip: "192.168.137.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ansible_ssh_private_key_file: "~/.ssh/id_ed25519_ansible"
ssh_proxy_jump_host: "HOM-LAB-HVH-02"
# External Langfuse platform data-plane services prefer the storage-lane Windows
# published route so the path is stable from anywhere on the LAN.
ansible_ssh_common_args: >-
  -o ProxyJump=HOM-LAB-HVH-02
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
k3s_readiness_stub_expected_runtime: present
k3s_vllm_runtime_cpu_request: "1200m"
k3s_vllm_runtime_memory_request: 2Gi
k3s_vllm_runtime_memory_limit: 8Gi
k3s_vllm_runtime_hf_cache_backing_capacity_verified: true
k3s_vllm_runtime_hf_cache_backing_capacity_evidence_ref: >-
  docs/plans/2026-09-10--k3s-02-storage-upgrade/implementation-receipt.md
# Selected non-RAID design: separate cache and logs/scratch VHDXs. Mutation is
# enabled only after each attached disk's stable by-id path and serial are
# recorded by the storage campaign receipt.
k3s_storage_offload_category: ephemeral_cache
k3s_storage_offload_durability: reproducible_expensive
k3s_storage_offload_mechanism: bind_mount
k3s_storage_offload_device_by: LABEL=k3s-cache
k3s_vllm_runtime_hf_cache_backend: host_path
k3s_vllm_runtime_hf_cache_host_mount_path: /mnt/k3s-cache
k3s_vllm_runtime_hf_cache_host_path: /mnt/k3s-cache/hf
k3s_vllm_runtime_hf_cache_container_path: /mnt/k3s-cache/hf
k3s_vllm_runtime_hf_hub_cache_container_path: /mnt/k3s-cache/hf/hub
k3s_vllm_runtime_hf_cache_minimum_free_gib: 120
k3s_vllm_runtime_hf_cache_migration_apply: true
k3s_vllm_runtime_hf_cache_source_cleanup_apply: false
k3s_vllm_runtime_hf_cache_retain_source_pvc: true
k3s_vllm_runtime_node_name: hom-lab-ctl-k3s-02
k3s_storage_offload_state: present
k3s_storage_offload_apply: true
k3s_storage_offload_mount_path: /mnt/k3s-cache
k3s_storage_offload_containerd_source_path: /var/lib/rancher/k3s/agent/containerd
k3s_storage_offload_containerd_destination_path: /mnt/k3s-cache/containerd
k3s_storage_offload_containerd_backup_path: /var/lib/rancher/k3s/agent/containerd.ansible-pre-offload
k3s_storage_offload_local_path_destination: /mnt/k3s-cache/local-path
k3s_storage_offload_expected_local_path_root: /var/lib/rancher/k3s/storage
k3s_storage_offload_local_path_backup_file: /var/lib/ansible/k3s-storage-offload/local-path-config.json
k3s_storage_offload_retain_containerd_backup: true
k3s_storage_offload_mount_fstype: ext4
k3s_storage_offload_authority_ref: docs/plans/2026-09-10--k3s-02-storage-upgrade/draft-plan-v1-researched.md
k3s_storage_offload_imagefs_verification_required: true
linux_data_disk_mounts:
  - name: cache
    device_by_id: /dev/disk/by-id/wwn-0x60022480737317e55fd3cd8e3fafbe4a
    expected_serial: "60022480737317e55fd3cd8e3fafbe4a"
    path: /mnt/k3s-cache
    fstype: ext4
    label: k3s-cache
    category: ephemeral_cache
    durability: reproducible_expensive
    mechanism: bind_mount
  - name: logs_scratch
    device_by_id: /dev/disk/by-id/wwn-0x60022480f30acb542946b808b5379d44
    expected_serial: "60022480f30acb542946b808b5379d44"
    path: /mnt/k3s-logs
    fstype: ext4
    label: k3s-logs
    category: logs_and_metrics
    durability: reproducible
    mechanism: bind_mount
  - name: cold_artifacts
    device_by_id: /dev/disk/by-id/wwn-0x600224809dde1833df85e1e26e53dfa3
    expected_serial: "600224809dde1833df85e1e26e53dfa3"
    path: /mnt/k3s-cold
    fstype: ext4
    label: k3s-cold
    category: cold_artifacts
    durability: reproducible
    mechanism: host_path
# Separate optional logs/scratch mount. Do not place Prometheus TSDB or unique
# PVC data here. The host SSDs are user-authorized for future repurposing.
k3s_storage_logs_scratch_category: logs_and_metrics
k3s_storage_logs_scratch_durability: reproducible
k3s_storage_logs_scratch_mechanism: bind_mount
k3s_storage_logs_scratch_mount_path: /mnt/k3s-logs
k3s_storage_logs_scratch_device_by: LABEL=k3s-logs
k3s_storage_logs_scratch_expected_serial: "60022480f30acb542946b808b5379d44"
k3s_storage_logs_scratch_apply: true
storage_capacity_monitor_state: present
storage_capacity_monitor_warning_percent: 75
storage_capacity_monitor_critical_percent: 90
storage_capacity_monitor_mounts:
  - path: /
    required: true
  - path: /mnt/k3s-cache
    required: false
  - path: /mnt/k3s-logs
    required: false
  - path: /mnt/k3s-cold
    required: false
storage_capacity_monitor_require_alloy: true
storage_capacity_monitor_journal_system_max_use: 1G
k3s_cold_artifact_migrations:
  - name: qwen3_6_experimental_model_archive
    source_path: /mnt/k3s-cache/hf/hub/models--nvidia--Qwen3.6-35B-A3B-NVFP4
    destination_path: /mnt/k3s-cold/models/huggingface/models--nvidia--Qwen3.6-35B-A3B-NVFP4
    expected_source_mount: /mnt/k3s-cache
    expected_destination_mount: /mnt/k3s-cold
    purpose: inactive_model_archive_for_later_promotion
k3s_vllm_runtime_enable_auto_tool_choice: true
k3s_vllm_runtime_sleep_mode_enabled: true
# Qwen3-Coder-30B AWQ: use built-in --tool-call-parser qwen3_coder (vLLM 0.29).
# Do NOT mount the qwen2_5_coder plugin — it imports removed vllm.entrypoints.openai.*
# paths and fails to load on current images. See roles/k3s_vllm_runtime/README.md.
k3s_vllm_runtime_tool_call_parser: "qwen3_coder"
k3s_vllm_runtime_tool_parser_plugin_enabled: false
k3s_vllm_runtime_tool_parser_plugin_chat_template_enabled: false
# 5090 sequential primary — Qwen3-Coder-30B-A3B AWQ-4bit @ 32k (cut over from Qwen3.6).
# Client-facing LiteLLM id: qwen3-coder-30b-a3b (no @k3s02-vllm suffix).
# Durable: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit on HF cache / SMB.
# Prior sequential: nvidia/Qwen3.6-35B-A3B-NVFP4 (keep weights; not concurrent).
k3s_vllm_runtime_model: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
k3s_vllm_runtime_served_model_name: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
k3s_vllm_runtime_extra_args:
  - --gpu-memory-utilization
  - "0.90"
  - --max-model-len
  - "32768"
  - --max-num-seqs
  - "6"
k3s_langfuse_platform_web_cpu_request: "150m"
k3s_langfuse_platform_web_memory_request: "512Mi"
k3s_langfuse_platform_worker_cpu_request: "100m"
k3s_langfuse_platform_worker_memory_request: "384Mi"

# Operator /etc/hosts for hom.lab URLs (LAN publish IP via portproxy).
homelab_hosts_file_linux_enabled: true

# Pod DNS: publish catalog *.hom.lab into K3s CoreDNS (coredns-custom).
k3s_coredns_homelab_hosts_state: present

# Hyper-V GPU-P guests use the Windows DriverStore via
# hyperv_ubuntu_gpu_p_linux_guest_runtime — not apt nvidia-driver-*.
k3s_nvidia_runtime_install_guest_driver: false
k3s_nvidia_runtime_remove_guest_driver: false
k3s_nvidia_runtime_validate_nvidia_smi: false

# GPU-P guest ABI / DKMS pins (live stable 2026-09-23). Bump only on request.
hyperv_ubuntu_gpu_p_linux_guest_runtime_state: present
hyperv_ubuntu_gpu_p_linux_guest_target_kernel: "7.0.0-1014-azure"
hyperv_ubuntu_gpu_p_linux_guest_dxgkrnl_version: "6.18-147941806"
hyperv_ubuntu_gpu_p_dxgkrnl_repo_version: 02565c968e19af86d84fe074d9fba8f059af65a2
hyperv_ubuntu_gpu_p_guest_pin_kernel_packages: true
hyperv_ubuntu_gpu_p_guest_disable_unattended_upgrades: true
hyperv_ubuntu_gpu_p_guest_disable_apt_periodic_timers: true

# Reach Hyper-V host SMB/SSH via Guest-switch gateway from this VM.
hyperv_ubuntu_gpu_p_linux_guest_runtime_share_host_override: >-
  {{
    hostvars[parent_hypervisor].hyperv_config.guest_gateway_ipv4
    | default('192.168.137.1')
    | regex_replace('/.*', '')
  }}

# Additive shared-service deployment profile for AI playbook work.
ai_service_profile:
  description: GPU-lane K3s guest that hosts the shared AI inference stack services.
  tags:
    - ai-service-profile
    - k3s
    - gpu-lane
    - shared-services
  deployable_services:
    - service_key: litellm_gateway
      description: Shared LiteLLM gateway target for OpenAI-compatible client access.
      deployed_by_role: k3s_litellm_gateway
      service_slug: litellm-k3s-gateway
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - litellm
        - gateway
        - deploy-target
        - ai-inference-stack
    - service_key: langfuse_platform
      description: Shared Langfuse observability target on the GPU-lane K3s guest.
      deployed_by_role: k3s_langfuse_platform
      service_slug: langfuse-k3s-web
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - langfuse
        - observability
        - deploy-target
    - service_key: vllm_primary_runtime
      description: Primary local vLLM for qwen3-coder-30b-a3b (Continue/OpenCode chat).
      deployed_by_role: k3s_vllm_runtime
      target_selector: "container_orchestrator_k3s:&gpu_workload_nodes"
      tags:
        - vllm
        - runtime
        - primary

# Commissioned LiteLLM backend registry. Host placement belongs in values,
# while logical backend IDs remain stable if a deployment moves.
k3s_litellm_gateway_local_backends:
  primary:
    api_base: "http://vllm-primary.vllm-runtime.svc.cluster.local:8000/v1"
    model: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
    provider: "hosted_vllm"
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    repetition_penalty: 1.05
  desktop_7b:
    api_base: "http://ollama-desktop.hom.lab:11434/v1"
    model: "qwen2.5-coder:7b"
    provider: "openai"
  desktop_14b:
    api_base: "http://ollama-desktop.hom.lab:11434/v1"
    model: "qwen2.5-coder:14b"
    provider: "openai"
  fim_1_5b:
    api_base: "http://ollama-hvh01.hom.lab:11434/v1"
    model: "qwen2.5-coder:1.5b-base-q8_0"
    provider: "openai"
  nomic:
    api_base: "http://ollama-hvh01.hom.lab:11434"
    model: "nomic-embed-text"
    provider: "ollama"
  desktop_gpt_oss:
    api_base: "http://ollama-desktop.hom.lab:11434"
    model: "gpt-oss:20b"
    provider: "ollama"
    temperature: 1.0
    top_p: 0.95
  desktop_ministral:
    api_base: "http://ollama-desktop.hom.lab:11434"
    model: "ministral-3:8b"
    provider: "ollama"

# Optional Open WebUI registry entries remain uncommissioned on this host.

# ---------------------------------------------------------------------------
# GPU time-share on this host (single nvidia.com/gpu) — Phase B on vs off
# Doc: docs/reference/k3s-02-gpu-timeshare-phase-b.md
#
# Exactly one of vLLM / ComfyUI / Ollama should be present on the GPU.
# LiteLLM gateway stays up either way; only the vLLM primary backend moves.
#
# --- Phase B OFF (default steady-state: Ornith for LiteLLM) ---
#   k3s_vllm_runtime_state: present
#   k3s_comfyui_runtime_state: absent
#   k3s_ollama_runtime_state: absent
# Playbooks (order matters — tear down Comfy before bringing Ornith up):
#   ansible-playbook playbooks/deploy_comfyui_runtime.yaml --limit hom-lab-ctl-k3s-02
#   ansible-playbook playbooks/deploy_vllm_runtime.yaml --limit hom-lab-ctl-k3s-02
#
# --- Phase B ON (ComfyUI holds the 5090; Ornith paused) ---
#   k3s_vllm_runtime_state: absent
#   k3s_comfyui_runtime_state: present
#   k3s_ollama_runtime_state: absent
# Playbooks (order matters — tear down Ornith before bringing Comfy up):
#   ansible-playbook playbooks/deploy_vllm_runtime.yaml --limit hom-lab-ctl-k3s-02
#   ansible-playbook playbooks/deploy_comfyui_runtime.yaml --limit hom-lab-ctl-k3s-02
#
# Current values below = Phase B OFF.
# ---------------------------------------------------------------------------
k3s_vllm_runtime_state: present
k3s_ollama_runtime_state: absent
k3s_comfyui_runtime_state: absent

# ComfyUI pod memory (used only when k3s_comfyui_runtime_state: present).
k3s_comfyui_runtime_memory_request: 4Gi
k3s_comfyui_runtime_memory_limit: 20Gi
