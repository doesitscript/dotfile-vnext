---
# Planned Hyper-V-native K3s Ubuntu VM surface on the RTX 5090 server-225 host.
# This is a baseline/stub target only until the GPU-enabled K3s plan promotes
# it into the real cluster.

physical_node: "server-225"
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  k3s_node:
    enabled: true
    purpose: gpu_worker_stub
policy_classes:
  - experimental
  - non_authoritative_data
ansible_host: "192.168.137.11"
host_ip: "192.168.137.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "hom-lab-ctl-hvh-02"
ansible_ssh_common_args: >-
  -o ProxyJump=hom-lab-ctl-hvh-02
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
k3s_readiness_stub_expected_runtime: absent
