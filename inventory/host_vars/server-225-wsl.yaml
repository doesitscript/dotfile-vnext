---
# WSL surface for server-225. wsl_distro/wsl_ssh_port align with group_vars/server_225.yaml.
# ansible_connection, ansible_ssh_private_key_file inherited from group_vars/wsl_hosts (matches controller Mac: ~/.ssh/id_ed25519_ansible from bootstrap_mac).
# i should be able to have a winrm one too for thissrver by amkdine a file like this and speicifying it at the cmdline
wsl_user: "joshc"
physical_node: "server-225"
ansible_port: 22
# Router-managed: DESKTOP-VLLM is the router-assigned hostname for server-225 (IP 192.168.50.158).
# server-225-wsl shares this hostname with server-225-win but uses port 22 (WSL sshd);
# server-225-win uses port 2222 (Windows sshd). No conflict.
# If ansible_host ever changes, update here and re-run access.yaml.
# The docker_client role self-heals the Docker context on the next run.
ansible_host: "DESKTOP-VLLM"
host_ip: "DESKTOP-VLLM"
surface_type: "wsl"
ansible_user: "joshc"
wsl_distro: "Ubuntu-24.04"
# WSL sshd listens on port 22, bound to all interfaces (0.0.0.0:22).
# WSL bridge NIC (5e:bb:f6:9e:ee:fa) shares 192.168.50.158 with the Windows host.
# Port 22 → WSL sshd; port 2222 → Windows sshd. No conflict.
# If the router assigns a separate IP to the WSL NIC, update ansible_host above.
wsl_ssh_port: 22
ansible_python_interpreter: "/usr/bin/python3"
# SSH paths (same names as windows; destinations identical in purpose).
ansible_ssh_dir_path: "/home/joshc/.ssh"
ansible_authorized_keys_path: "/home/joshc/.ssh/authorized_keys"

# Docker Engine — geerlingguy.docker installs Docker inside this WSL distro.
# Clients (mac-dev, server-225-win) connect via SSH Docker contexts.
docker_engine_in_wsl: true
