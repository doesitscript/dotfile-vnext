---
# Windows surface: WinRM for bootstrap; OpenSSH should land directly on Windows.
# NetBox/source-of-truth name: hom-lab-hvh-01.
# Legacy inventory/control alias: network-server.
# ai-net-server-mgmt resolves via LAN mDNS but not from Mac controller — use IP directly.
# Two Wi-Fi adapters will be active simultaneously once original adapter is restored.
# Primary adapter (ansible_host): 192.168.50.234 — secondary Wi-Fi, currently active.
# Secondary adapter (mgmt/fallback): 192.168.50.233 — original Wi-Fi (MAC 9c:c7:d3:10:68:5a), temporarily down.
# Router DHCP reservations: bind each adapter MAC to its own IP.
# Router hostname: ai-net-server-mgmt → 192.168.50.234 (current adapter).
# Revisit: when original adapter restored, decide final hostname strategy for both adapters.
# IMPORTANT: dual Wi-Fi naming is ambiguous here. Keep the live external-switch
# binding description pinned so preview/verification can prove the intended
# uplink before any recreate path.
ansible_host: "192.168.50.234"
ansible_connection: ssh
# Managed Windows OpenSSH steady-state port. Legacy 2222 experiments were
# retired by the repo-native access role.
ansible_port: 22
ansible_user: "joshc"
ansible_ssh_private_key_file: "/Users/joshc/.ssh/id_ed25519_ansible"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_shell_type: "powershell"
ansible_shell_executable: "powershell.exe"
surface_type: "windows_host"
os_hostname: "hom-lab-hvh-01"
hyperv_management_endpoint: "{{ ansible_host }}"
host_ip: "192.168.50.234"
physical_node: "hom-lab-hvh-01"
host_kind: "physical_server"
node_capabilities:
  - windows_server_2025
  - hyperv_host
  - nvidia_gpu_host
  - storage_lane_host
gpu_contract:
  vendor: nvidia
  partitioned: false
  passthrough_mode: none
  workloads_enabled: false
legacy_aliases:
  - network-server

# Legacy WinRM config (retained for reference, not active)
# ansible_connection: winrm
# winrm_port: 5985
# ansible_password: "Pass@w0rd1"
# win_password: "Pass@w0rd1"
# ansible_winrm_password: "Pass@w0rd1"
# ansible_winrm_scheme: "http"
# ansible_winrm_transport: "ntlm"
ansible_winrm_password: "Pass@w0rd1"
ansible_winrm_scheme: "http"
ansible_winrm_transport: "ntlm"
# HTTPS WinRM configuration (uncomment when HTTPS is enabled on server):
# winrm_port: 5986
# ansible_port: 5986
# ansible_winrm_scheme: "https"
# ansible_winrm_server_cert_validation: "ignore"

node_classes:
  - hyperv_host
  - docker_vm_host
  - docker_client
  - storage_observability
  - gpu_host
hardware_classes:
  - bulk_storage
  - nvidia_gpu
gpu: gtx-1060-6gb
runtime_planes:
  hyperv_host:
    enabled: true
  hyperv_docker_vm:
    enabled: true
  hyperv_k3s_vm:
    enabled: true
  secondary_model_runtime:
    enabled: true
    runtime: ollama-secondary-hvh-01
    lane: code-review
    capability_state: planned_apply
  hyperv_gpu_partitioning:
    enabled: false
    capability_state: blocked
    reason: "2026-07-09 live probe: IovSupport=False and Get-VMHostPartitionableGpu returned no GPU."
policy_classes:
  - authoritative_data
  - lan_exposed_services
guest_gpu_capability:
  state: blocked
  capability_class: host_has_gpu_but_not_guest_gpu_ready
  checked_date: "2026-07-09"
  probe_source: "live Hyper-V host probe over SSH + PowerShell"
  iov_support: false
  partitionable_gpu_visible: false
  nvidia_smi_nvml_ready: false
  block_reasons:
    - "Get-VMHost().IovSupport=False"
    - "Get-VMHostPartitionableGpu returned no GPU"
    - "nvidia-smi -L returned 'Failed to initialize NVML: Not Found'"
hyperv_networking_feature_prereqs_enabled: false

# AI model catalog storage root on the existing public SMB share.
# Operator decision D-4: the canonical HF root is
# \\hom-lab-hvh-01\public\models\huggingface. This is storage-lane
# desired state, not 5090 OS-disk runtime state.
windows_file_shares_extra_directories:
  - path: 'F:\shares\public\models'
    purpose: AI model catalog root
  - path: 'F:\shares\public\models\huggingface'
    purpose: Hugging Face model weights
  - path: 'F:\shares\public\models\ollama'
    purpose: Ollama model storage root
  - path: 'F:\shares\public\artifacts'
    purpose: Public share artifact root
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime'
    purpose: Hyper-V Ubuntu GPU-P runtime artifact root
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime\current'
    purpose: Current Hyper-V Ubuntu GPU-P runtime artifact set
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime\runs'
    purpose: Timestamped Hyper-V Ubuntu GPU-P runtime artifact history

# Infrastructure: Hyper-V External Switch (backbone, independent of any guest).
hyperv_config:
  external_switch_enabled: true
  switch_name: "External"
  adapter_interface_description: "TP-Link Wi-Fi 6 PCIe Adapter"
  adapter_name: "Wi-Fi"
  allow_management_os: true
  management_os_boot_recovery_state: present
  internal_ics_switch_enabled: true
  # Keep the Guest switch but manage routing explicitly instead of relying on
  # Windows ICS/NAT behavior.
  internal_ics_sharing_enabled: false
  internal_ics_switch_name: "Guest"
  guest_network_mode: "routed_private_subnet"
  guest_switch_name: "Guest"
  guest_subnet_ipv4: "192.168.138.0/24"
  guest_gateway_ipv4: "192.168.138.1"
  # Host-side outbound NAT gives routed lab guests internet/package access
  # without requiring the upstream LAN router to know this private subnet.
  guest_outbound_nat_enabled: true
  # Publish storage-lane services through the Windows LAN IP so operators and
  # cross-lane consumers do not have to rely on direct 192.168.138.x routing.
  guest_published_tcp_ports:
    - name: "postgres-fuzlang"
      listen_address: "192.168.50.234"
      listen_port: 5432
      connect_address: "192.168.138.10"
      connect_port: 5432
    - name: "redis-fuzlang"
      listen_address: "192.168.50.234"
      listen_port: 6379
      connect_address: "192.168.138.10"
      connect_port: 6379
    - name: "clickhouse-http"
      listen_address: "192.168.50.234"
      listen_port: 8123
      connect_address: "192.168.138.10"
      connect_port: 8123
    - name: "clickhouse-native"
      listen_address: "192.168.50.234"
      listen_port: 9004
      connect_address: "192.168.138.10"
      connect_port: 9004
    - name: "minio-api"
      listen_address: "192.168.50.234"
      listen_port: 9000
      connect_address: "192.168.138.10"
      connect_port: 9000
    - name: "minio-console"
      listen_address: "192.168.50.234"
      listen_port: 9001
      connect_address: "192.168.138.10"
      connect_port: 9001
  internal_ics_public_adapter_name: "vEthernet (External)"

# Docker client — reaches the central Hyper-V Ubuntu Docker engine via SSH.
docker_engine_ssh_host: "hom-lab-ctl-dkr-01"
docker_engine_ssh_context_host: "{{ hyperv_ubuntu_vm_autoinstall_network_ipv4 }}"
docker_engine_ssh_port: 22
docker_engine_ssh_user: "joshc"

# Hyper-V-native Docker Ubuntu VM companion for the hom-lab-hvh-01 physical node.
# Inventory identity remains hom-lab-ctl-dkr-01; the live Hyper-V VM / guest
# hostname is nsrv-dkr-01.
hyperv_ubuntu_docker_vm_state: present
hyperv_ubuntu_docker_vm_hostname: "nsrv-dkr-01"
hyperv_ubuntu_docker_vm_inventory_host: "hom-lab-ctl-dkr-01"
hyperv_ubuntu_vm_cpus: 4
hyperv_ubuntu_vm_memory: "8G"
hyperv_ubuntu_vm_disk: "40G"
hyperv_ubuntu_vm_bootstrap_user: "joshc"
hyperv_ubuntu_vm_ssh_port: 22
# Use the proven server cloud-image path for this milestone. The Server ISO
# autoinstall path remains in the role, but is still an installer-handoff
# research path until guest-side evidence collection is wired.
hyperv_ubuntu_vm_source_mode: "azure_cloud_image"
hyperv_ubuntu_vm_secure_boot_enabled: false
hyperv_ubuntu_vm_publish_connection_facts: false
hyperv_ubuntu_vm_autoinstall_network_method: "static"
hyperv_ubuntu_vm_autoinstall_network_ipv4: "192.168.138.10"
hyperv_ubuntu_vm_autoinstall_network_prefix_length: 24
hyperv_ubuntu_vm_autoinstall_network_gateway4: "192.168.138.1"
hyperv_ubuntu_vm_autoinstall_network_dns_servers:
  - "1.1.1.1"
  - "8.8.8.8"
hyperv_ubuntu_vm_quick_create_image_url: >-
  https://partner-images.canonical.com/hyper-v/desktop/noble/release/current/ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
hyperv_ubuntu_vm_server_iso_url: "https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso"

# Hyper-V-native K3s Ubuntu VM companion for the hom-lab-hvh-01 physical node.
# Inventory identity remains hom-lab-ctl-k3s-01; the live Hyper-V VM / guest
# hostname is nsrv-k3s-01.
hyperv_ubuntu_k3s_vm_state: present
hyperv_ubuntu_k3s_vm_hostname: "nsrv-k3s-01"
hyperv_ubuntu_k3s_vm_inventory_host: "hom-lab-ctl-k3s-01"
hyperv_ubuntu_k3s_vm_cpus: 4
hyperv_ubuntu_k3s_vm_memory: "8G"
hyperv_ubuntu_k3s_vm_disk: "60G"
hyperv_ubuntu_k3s_vm_bootstrap_user: "joshc"
hyperv_ubuntu_k3s_vm_ssh_port: 22
hyperv_ubuntu_k3s_vm_source_mode: "azure_cloud_image"
hyperv_ubuntu_k3s_vm_secure_boot_enabled: false
hyperv_ubuntu_k3s_vm_publish_connection_facts: false
hyperv_ubuntu_k3s_vm_autoinstall_network_method: "static"
hyperv_ubuntu_k3s_vm_autoinstall_network_ipv4: "192.168.138.11"
hyperv_ubuntu_k3s_vm_autoinstall_network_prefix_length: 24
hyperv_ubuntu_k3s_vm_autoinstall_network_gateway4: "192.168.138.1"
hyperv_ubuntu_k3s_vm_autoinstall_network_dns_servers:
  - "1.1.1.1"
  - "8.8.8.8"

# OpenSSH Server: base feature on Windows hosts unless explicitly set absent.
openssh_server_state: present

# Secondary host-local model runtime: Windows Ollama on the GTX 1060 6GB host.
windows_ollama_runtime_state: present
windows_ollama_runtime_bind_host: "0.0.0.0"
windows_ollama_runtime_port: 11434
windows_ollama_runtime_models_path: 'F:\shares\public\models\ollama'
windows_ollama_runtime_default_model: "qwen2.5-coder:3b"
windows_ollama_runtime_fallback_model: "qwen2.5-coder:1.5b"
windows_ollama_runtime_models_present:
  - "qwen2.5-coder:3b"
windows_ollama_runtime_model_aliases:
  - lane: code-review
    runtime_slug: ollama-secondary-hvh-01
    model: "qwen2.5-coder:3b"
    fallback_model: "qwen2.5-coder:1.5b"

# Live driver/runtime convergence on this Windows GPU host can take longer than
# the generic Windows reboot window, especially after GPU-driver changes.
llm_compute_windows_reboot_timeout: 1200
