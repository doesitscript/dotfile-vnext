---
# WSL surface for dev-3090 (RTX 2070 Machine)

wsl_user: "joshc"
physical_node: "dev-3090"
ansible_port: 22
# Router-managed: this IP is assigned statically by the router and has not been observed
# to change. If it ever does, update ansible_host here and re-run access.yaml.
ansible_host: "192.168.50.225"
host_ip: "192.168.50.225"
surface_type: "wsl"
ansible_user: "joshc"
wsl_distro: "Ubuntu-24.04"
wsl_ssh_port: 22
ansible_python_interpreter: "/usr/bin/python3"

# SSH paths
ansible_ssh_dir_path: "/home/joshc/.ssh"
ansible_authorized_keys_path: "/home/joshc/.ssh/authorized_keys"

# Docker Engine
docker_engine_in_wsl: true

# TODO: Add ssh_configured: true here after access.yaml runs against dev-3090-win
# and SSH is confirmed working on this WSL distro. Adding it before that would generate
# a non-functional Host entry in ~/.ssh/config for an unconfigured host.