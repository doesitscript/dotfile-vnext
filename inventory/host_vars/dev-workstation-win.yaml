---
# Inventory: dev-workstation-win (DESKTOP-C1ACPUM)
# Connect target: ansible_host = 192.168.50.132
# primary_connection: openssh (WinRM retained as secondary/bootstrap)
ansible_host: "192.168.50.132"
ansible_connection: ssh
ansible_port: 22
ansible_user: "joshc"
ansible_ssh_private_key_file: "/Users/joshc/.ssh/id_ed25519_ansible"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_shell_type: "powershell"
ansible_shell_executable: "powershell.exe"
surface_type: "windows_host"
host_ip: "192.168.50.132"
physical_node: "dev-workstation"
openssh_server_state: present
verify_ssh_from_execnode: true

windows_data_root: "D:\\ai"
stacks_root: "D:\\ai\\stacks"
data_root: "D:\\ai\\data"

