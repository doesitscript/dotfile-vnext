---
# Planned Hyper-V-native Docker Ubuntu VM surface on network-server-win.

physical_node: "network-server"
surface_type: "ubuntu_vm"
ansible_host: "192.168.138.10"
host_ip: "192.168.138.10"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "network-server-win"
docker_engine_state: present
ansible_ssh_common_args: >-
  -o ProxyJump=network-server-win
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
