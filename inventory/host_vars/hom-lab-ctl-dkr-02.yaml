---
# Inventory name: hom-lab-ctl-dkr-02
#   Ansible/NetBox schema alias for this managed surface. NOT the guest OS hostname.
# Connect target: ansible_host / host_ip (192.168.137.10)
#   Routed private guest IP used for SSH, Docker, and postgres TCP checks.
# physical_node: HOM-LAB-HVH-02
#   Metadata grouping key for group_vars/hyperv_lane_gpu — NOT a hostname.
# ssh_proxy_jump_host: HOM-LAB-HVH-02
#   Another inventory alias rendered into ~/.ssh/config as `Host HOM-LAB-HVH-02`.
#   That SSH entry uses HostName 192.168.50.158 (Windows LAN IP), not HOM-LAB-HVH-02.
# hyperv_ubuntu_docker_vm_hostname (in HOM-LAB-HVH-02 host_vars): planned VM name label only.

physical_node: "HOM-LAB-HVH-02"
surface_type: "ubuntu_vm"
inventory_surface_role: docker_engine
legacy_inventory_aliases:
  - server-225-ubuntu
node_classes:
  - docker_runtime
  - ai_worker
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  docker_engine:
    enabled: true
    purpose: ai_worker
policy_classes:
  - experimental
  - non_authoritative_data
ansible_host: "192.168.137.10"
host_ip: "192.168.137.10"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ansible_ssh_private_key_file: "~/.ssh/id_ed25519_ansible"
ssh_proxy_jump_host: "HOM-LAB-HVH-02"
docker_engine_state: present
logging_loki_public_endpoint: >-
  http://{{ hostvars['HOM-LAB-HVH-02'].host_ip | default('192.168.50.158') }}:3100/loki/api/v1/push

# Operator /etc/hosts for hom.lab URLs (LAN publish IP via portproxy).
homelab_hosts_file_linux_enabled: true
# Legacy duplicate fuzlang-net stack on the GPU lane is now retired in favor of
# the storage-lane Windows-published path on HOM-LAB-HVH-01 / dkr-01.
stacks_fuzlang_net_state: absent
stacks_network_purge_data_on_absent: true

# Open WebUI Option A — OpenAI-compatible client → LiteLLM (capability ai-client-ui).
open_webui_state: present

# Local image generation — A1111 on HVH-01 (GTX 1060 / CyberRealistic SD1.5).
# Phase B quality stills: point at ComfyUI on k3s-02 when time-share is active
# (IMAGE_GENERATION_ENGINE=comfyui + COMFYUI_BASE_URL). Default remains A1111
# for Open WebUI Image button (simple t2i); ComfyUI for FLUX / SDXL workflows.
open_webui_enable_image_generation: true
open_webui_image_generation_engine: automatic1111
open_webui_automatic1111_base_url: "http://a1111-hvh01.hom.lab:7860"
open_webui_comfyui_base_url: "http://comfyui.hom.lab:30188"
open_webui_image_size: "768x768"
open_webui_image_steps: 35

# Arena: vision-capable combatants only (Ornith / gpt-oss / qwen text-only reject images).
open_webui_enable_evaluation_arena_models: true
open_webui_evaluation_arena_model_ids:
  - gemma4-12b
  - studio-coach

ansible_ssh_common_args: >-
  -o ProxyJump=HOM-LAB-HVH-02
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
