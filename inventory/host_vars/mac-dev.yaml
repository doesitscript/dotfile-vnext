---
# mac-dev host_vars — Docker client configuration.
# The Docker engine runs on the Hyper-V Ubuntu guest on HOM-LAB-HVH-02.

# Capability selectors — Ansible/controller Mac (not a Compose/K3s workload host).
classification_status: controller
surface_type: macos
node_classes:
  - controller
  - macos_dev
policy_classes:
  - controller

# Labels for AI CLI / IDE client grouping (see inventory/group_vars/all/ai_cli_apps.yml).
# Deploy all commissioned clients: --tags ai_cli_apps
ai_cli_apps_labels:
  - ai-cli-apps
  - litellm-clients
  - openai-compatible-edge
  - mac-dev

# Docker client — reaches the Ubuntu guest Docker engine via SSH.
# Uses the generated SSH config alias so IdentityFile and other settings are inherited.
docker_engine_ssh_host: "hom-lab-ctl-dkr-02"
docker_engine_ssh_port: 22
docker_engine_ssh_user: "joshc"

# Permanent mounts for Windows public SMB shares on HVH hosts.
# UNC \\HOM-LAB-HVH-0N\public -> method-specific path (joshc via house remoting vault).
# method: automount (~/mnt/hvh-0N-public) | finder_login (~/HomelabSMB/hvh-0N-public)
macos_smb_public_mounts_state: present
macos_smb_public_mounts_method: finder_login

# Hyper-V Ubuntu VM guest-subnet access.
# Part 1 of the routed-private-subnet design gives mac-dev direct reachability
# to the guest IP through HOM-LAB-HVH-02 before the broader router/LAN route
# milestone.
hyperv_guest_route_mac_state: present
hyperv_guest_route_mac_network_service: "Wi-Fi"
hyperv_guest_route_mac_routes:
  - destination: "192.168.137.0"
    mask: "255.255.255.0"
    gateway: "192.168.50.158"
  - destination: "192.168.138.0"
    mask: "255.255.255.0"
    gateway: "192.168.50.234"
hyperv_guest_route_target_subnet: "192.168.137.0"
hyperv_guest_route_target_mask: "255.255.255.0"
hyperv_guest_route_gateway: "192.168.50.158"

# Operator hostnames for Traefik + guest workaround (loz-hurst.hosts_file).
homelab_hosts_file_mac_enabled: true

# Managed K3s client contexts on mac-dev.
# Direct API (no ssh -L) for both clusters once HyperVGuestNat is absent and
# Mac guest routes exist. Separate per-cluster kubeconfigs + bash KUBECONFIG
# export — do not merge into ~/.kube/config.
k3s_mac_client_manage_default_kubeconfig: false
k3s_mac_client_shell_kubeconfig_export: true
k3s_mac_client_clusters:
  - cluster_host: "hom-lab-ctl-k3s-01"
    context_name: "hom-lab-ctl-k3s-01"
    connection_mode: "direct"
  - cluster_host: "hom-lab-ctl-k3s-02"
    context_name: "hom-lab-ctl-k3s-02"
    connection_mode: "direct"
k3s_mac_client_default_context: "hom-lab-ctl-k3s-02"

# OpenLens Kubernetes IDE desired state.
openlens_state: present

# Ollama desktop app + CLI on macOS (Homebrew cask ollama-app).
ollama_mac_state: present

# Hugging Face Hub CLI (hf) for model search/download — ToolPiper/LM Studio
# substitutes on Monterey/Intel. Default HF_HOME → HomelabSMB hvh-01 public.
huggingface_cli_mac_state: present

# Terraform CLI package-management desired state.
terraform_cli_state: present

# LiteLLM CLI package-management desired state.
litellm_cli_state: present

# Continue IDE → LiteLLM (model list + sampling defaults live in roles/continue_ide).
# Plan 2026-09-12-mac_and_model_recommend: HVH-01 FIM autocomplete + nomic embed via gateway.
continue_ide_state: present
continue_ide_autocomplete_enabled: true

# Cline IDE + CLI → LiteLLM (plain model ids from ai_cli_apps.yml).
# cline_ide owns ~/.cline providers/models/MCP; cline_cli installs the npm binary.
cline_ide_state: present
cline_ide_model: "{{ ai_cli_default_chat_model }}"
cline_ide_mcp_servers: "{{ continue_ide_mcp_servers }}"
cline_cli_state: present
cline_cli_node_version: "24"

# OpenCode CLI → LiteLLM (selection = litellm/<plain id>; catalog keys plain).
opencode_cli_state: present
opencode_cli_default_model: "{{ ai_cli_opencode_default_model }}"

# Kilo IDE → same naming contract as OpenCode.
kilo_ide_state: present
kilo_ide_default_model: "{{ ai_cli_kilo_default_model }}"
kilo_ide_small_model: "{{ ai_cli_kilo_small_model }}"

# Aider CLI → openai/<plain id>.
aider_state: present
aider_default_model: "{{ ai_cli_aider_default_model }}"
aider_pipx_python: "/usr/local/bin/python3.12"

# Cursor marketplace plugins use Cursor's plugin subsystem, not
# `cursor --install-extension`. Track required slugs here and let `roles/cursor`
# verify the installed plugin manifest on this Mac.
cursor_marketplace_plugins_required:
  - superpowers

# Codex profiles: filenames = visible model id (not opaque local-deep / local-tools).
# deep → qwen3.6-35b-a3b ; tools → qwen3.6-35b-a3b-tools
codex_homelab_profiles_state: present
codex_homelab_profiles_multi_terminal_state: present
codex_homelab_profiles_model: "{{ ai_cli_default_chat_model }}"
codex_homelab_profiles_context_window: 32768

# User-scoped ~/.codex/config.toml — preserve existing file, but always
# converge the macOS shell locale policy block (Homebrew Bash rejects C.UTF-8).
codex_user_config_state: present
codex_user_config_force: false

# fzf-tab-completion for bash + Python REPL (promoted from one-off trial).
fzf_tab_completion_state: present

# GNU netcat package-management desired state.
netcat_cli_state: present

# just command runner package-management desired state.
just_cli_state: present

# ripgrep (rg) — Morph WarpGrep local codebase_search dependency.
ripgrep_cli_state: present

# Shared bash-completion substrate for repo-managed CLI completion files.
common_bash_completion_state: present

# Keep the mac-dev login shell aligned with the Homebrew Bash used interactively
# in Terminal so shell detection, completion runtime selection, and startup
# behavior all converge on the same Bash family.
shell_config_manage_login_shell: true
shell_config_login_shell_path: /usr/local/bin/bash

# Gonzo AI-native log analysis TUI desired state.
gonzo_cli_state: present

# Dstl8 runtime-feedback CLI desired state.
dstl8_cli_state: present

# multiagents CLI scaffold (Bun release binary + pinned package + managed layout).
# Settings ownership:
#   - lifecycle here: multiagents_state
#   - versions: inventory/group_vars/all/multiagents_tooling.yml
#   - role/docs: roles/multiagents/README.md
# MCP / broker / Codex·Cursor scenario wiring deferred (later pass).
multiagents_state: present

# MCP stack — Continue + Cursor user (~/.cursor/mcp.json) match work-laptop
# packet Continue catalog (Terraform, AWS, AWS IaC, context7, firebase, morph,
# multiagents-peer). Cursor user path override keeps Agent namespaces in
# ~/.cursor/mcp.json (same surface Morph already uses).
mac_dev_cursor_user_mcp_path: "{{ ansible_env.HOME }}/.cursor/mcp.json"
mac_dev_nvm_bin: "{{ ansible_env.HOME }}/.nvm/versions/node/v20.20.0/bin"
mac_dev_mcp_env_dir: "{{ ansible_env.HOME }}/.config/dotfile-vnext/mcp/env.d"

context7_mcp_state: present
context7_mcp_targets:
  - cursor
  - codex
context7_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"

firecrawl_mcp_state: present
firecrawl_mcp_targets:
  - cursor
  - codex
firecrawl_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"

morph_mcp_state: present
morph_mcp_targets:
  - cursor_user
  - codex

terraform_mcp_state: present
terraform_mcp_targets:
  - cursor
terraform_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"

aws_mcp_state: present
aws_mcp_targets:
  - cursor
aws_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"
# Working initialize URL (packet Continue); avoid ?oauth=initialize here.
aws_mcp_url: "https://aws-mcp.us-east-1.api.aws/mcp"

aws_iac_mcp_state: present
aws_iac_mcp_targets:
  - cursor
aws_iac_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"
aws_iac_mcp_package_name: "awslabs.aws-iac-mcp-server@1.0.26"
# Prefer existing uvx (pipx/local); skip Homebrew uv compile on Monterey.
aws_iac_mcp_command: "{{ ansible_env.HOME }}/.local/bin/uvx"

# Continue MCP list — same names/roles as work-laptop packet (home-Mac paths).
# Do NOT also list continue_ide_rules for morph-warpgrep-evaluation.md.
continue_ide_rules: []
continue_ide_mcp_servers:
  - name: "Terraform MCP"
    type: "stdio"
    command: "{{ ansible_env.HOME }}/.local/bin/terraform-mcp-server"
    args:
      - "stdio"
  - name: "AWS MCP"
    type: "streamable-http"
    url: "https://aws-mcp.us-east-1.api.aws/mcp"
  - name: "AWS IaC MCP"
    type: "stdio"
    command: "{{ ansible_env.HOME }}/.local/bin/uvx"
    args:
      - "awslabs.aws-iac-mcp-server@1.0.26"
    env:
      FASTMCP_LOG_LEVEL: "ERROR"
  - name: context7
    type: stdio
    command: "{{ mac_dev_nvm_bin }}/context7-mcp"
  - name: firebase
    type: stdio
    command: "{{ mac_dev_nvm_bin }}/firebase"
    args:
      - mcp
  - name: morph-mcp
    type: stdio
    command: "{{ ansible_env.HOME }}/develop/dotfile-vnext/bin/mcp-server-env-wrapper"
    args:
      - "{{ mac_dev_mcp_env_dir }}/morph.env"
      - "{{ mac_dev_nvm_bin }}/morph-mcp"
    cwd: "{{ ansible_env.HOME }}/develop/dotfile-vnext"
    env:
      WORKSPACE_MODE: "true"
  - name: multiagents-peer
    type: stdio
    command: "{{ ansible_env.HOME }}/.bun/bin/multiagents"
    args:
      - mcp-server
      - --agent-type
      - custom
    env:
      PATH: "{{ ansible_env.HOME }}/.bun/bin:{{ ansible_env.PATH }}"

playwright_mcp_state: present
playwright_mcp_targets:
  - cursor
  - codex
playwright_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"

fetch_mcp_state: present
fetch_mcp_targets:
  - cursor
  - codex
fetch_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"

firebase_mcp_state: present
firebase_mcp_targets:
  - cursor
  - codex
firebase_mcp_cursor_config_path: "{{ mac_dev_cursor_user_mcp_path }}"
# Match Continue: pinned firebase-tools binary (not npx @latest).
firebase_mcp_command: "{{ mac_dev_nvm_bin }}/firebase"
firebase_mcp_args:
  - mcp
continue_ide_provision_firebase_cli: true
continue_ide_firebase_tools_version: "15.30.0"
# multiagents Cursor MCP — match Continue/packet (absolute multiagents + custom).
cursor_multiagents_mcp_agent_type: custom
cursor_multiagents_mcp_entry:
  command: "{{ ansible_env.HOME }}/.bun/bin/multiagents"
  args:
    - mcp-server
    - --agent-type
    - "{{ cursor_multiagents_mcp_agent_type }}"
  env:
    PATH: "{{ ansible_env.HOME }}/.bun/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    _MCP_ANSIBLE_ROLE_PATH: roles/cursor
# Microsoft Remote Desktop — LAN bookmarks + RDP cert trust on this Mac.
# Applied via playbooks/remote_desktop_mac_lan.yaml (also wired in
# deploy_development_nodes under tag remote_desktop_mac for install-only).
remote_desktop_mac_state: present
remote_desktop_mac_manage_connections: true
remote_desktop_mac_trust_certs: true

# Tunnelblick profile staging.
# These values capture the current intended VPN profile shape for mac-dev, but
# the role does not yet install or import the VPN client profile itself.
# That work is blocked on the missing router-exported OpenVPN client config
# (.ovpn or .tblk bundle).
tunnelblick_mac_profiles:
  - name: "router-openvpn"
    state: present
    remote_address: "99.63.7.93"
    remote_netmask: "255.255.255.255"
    auth_username_vault_var: "vault_tunnelblick_mac_router_openvpn_auth_username"
    auth_password_vault_var: "vault_tunnelblick_mac_router_openvpn_auth_password"
    auth_password_env_var: "TUNNELBLICK_MAC_ROUTER_OPENVPN_AUTH_PASSWORD"
    auth_password_placeholder: "V7j________"
    ovpn_content_vault_var: "vault_tunnelblick_mac_router_openvpn_ovpn_content"
    local_client_export_path: "private/tunnelblick/router-openvpn.ovpn"
    client_export_status: "missing"
    setup_status: "staged_waiting_for_client_export"
