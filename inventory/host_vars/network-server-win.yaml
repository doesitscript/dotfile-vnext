---
# Windows surface: WinRM for bootstrap; OpenSSH should land directly on Windows.
# ai-net-server-mgmt resolves via LAN mDNS but not from Mac controller — use IP directly.
# Two Wi-Fi adapters will be active simultaneously once original adapter is restored.
# Primary adapter (ansible_host): 192.168.50.234 — secondary Wi-Fi, currently active.
# Secondary adapter (mgmt/fallback): 192.168.50.233 — original Wi-Fi (MAC 9c:c7:d3:10:68:5a), temporarily down.
# Router DHCP reservations: bind each adapter MAC to its own IP.
# Router hostname: ai-net-server-mgmt → 192.168.50.234 (current adapter).
# Revisit: when original adapter restored, decide final hostname strategy for both adapters.
# IMPORTANT: Hyper-V External Switch adapter_name must be verified below — Windows names
# dual Wi-Fi adapters "Wi-Fi" and "Wi-Fi 2"; lock the adapter_name to the exact string
# shown in Device Manager before both adapters are online simultaneously.
ansible_host: "192.168.50.234"
ansible_password: "Pass@w0rd1"
surface_type: "windows_host"
host_ip: "192.168.50.234"
ansible_connection: winrm
win_ssh_port: 2222
win_ssh_user: "joshc"
verify_ssh_from_execnode: true
winrm_port: 5985
ansible_port: 5985
win_user: "joshc"
ansible_user: "joshc"
physical_node: "network-server"
win_password: "Pass@w0rd1"
ansible_winrm_password: "Pass@w0rd1"
ansible_winrm_scheme: "http"
ansible_winrm_transport: "ntlm"
# HTTPS WinRM configuration (uncomment when HTTPS is enabled on server):
# winrm_port: 5986
# ansible_port: 5986
# ansible_winrm_scheme: "https"
# ansible_winrm_server_cert_validation: "ignore"

# Infrastructure: Hyper-V External Switch (backbone, independent of any guest).
hyperv_config:
  external_switch_enabled: true
  switch_name: "External"
  adapter_name: "Wi-Fi"
  allow_management_os: true

# Docker client — reaches the central Hyper-V Ubuntu Docker engine via SSH.
docker_engine_ssh_host: "network-server-ubuntu"
docker_engine_ssh_port: 22
docker_engine_ssh_user: "joshc"

# OpenSSH Server: base feature on Windows hosts unless explicitly set absent.
openssh_server_state: present
