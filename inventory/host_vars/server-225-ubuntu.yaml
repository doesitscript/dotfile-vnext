---
# Reserved inventory identity for the upcoming Hyper-V-native Ubuntu VM on the
# server-225 Hyper-V host.
# Keep the host entry because the replacement will reuse `server-225-ubuntu`,
# but there is currently no active VM lifecycle role bound to this host.
# SSH access is intentionally not predeclared here. The controller SSH alias
# should appear only after the Hyper-V Ubuntu deployment stabilizes and the VM
# has real connection facts (for example ansible_host) to publish.

physical_node: "server-225"
surface_type: "ubuntu_vm"
ansible_user: "ubuntu"
ansible_port: 22
