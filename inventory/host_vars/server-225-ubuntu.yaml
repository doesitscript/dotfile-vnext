---
# Multipass-backed Ubuntu VM on the server-225 Hyper-V host.
# ansible_host is published as a cacheable fact by the multipass_ubuntu_vm role
# after the VM is created and its bridged IP is known.

physical_node: "server-225"
surface_type: "ubuntu_vm"
ansible_user: "ubuntu"
ansible_port: 22
ssh_configured: false
