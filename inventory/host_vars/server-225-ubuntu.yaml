---
# Active Hyper-V-native Ubuntu VM surface on the server-225 Hyper-V host.
# This host now represents the routed-subnet guest directly rather than a
# future placeholder identity.

physical_node: "server-225"
surface_type: "ubuntu_vm"
ansible_host: "192.168.137.10"
host_ip: "192.168.137.10"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "server-225-win"
logging_loki_public_endpoint: "http://192.168.50.158:3100/loki/api/v1/push"
ansible_ssh_common_args: >-
  -o ProxyJump=server-225-win
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
