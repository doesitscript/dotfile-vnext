---
# Windows surface: WinRM for bootstrap; OpenSSH should land directly on Windows.
ansible_host: "DESKTOP-VLLM"
ansible_password: "Pass@w0rd1"
surface_type: "windows_host"
host_ip: "192.168.50.158"
ansible_connection: winrm
win_ssh_port: 22
win_ssh_user: "joshc"
verify_ssh_from_execnode: true
winrm_port: 5985
ansible_port: 5985
win_user: "joshc"
ansible_user: "joshc"
physical_node: "server-225"
win_password: "Pass@w0rd1"
ansible_winrm_password: "Pass@w0rd1"
ansible_winrm_scheme: "http"
ansible_winrm_transport: "ntlm"
# HTTPS WinRM configuration (uncomment when HTTPS is enabled on server):
# winrm_port: 5986
# ansible_port: 5986
# ansible_winrm_scheme: "https"
# ansible_winrm_server_cert_validation: "ignore"

# Infrastructure: Hyper-V External Switch (backbone, independent of any guest).
hyperv_config:
  external_switch_enabled: true
  switch_name: "External"
  adapter_name: "Wi-Fi"
  allow_management_os: true

# WSL: consumer of the bridge (requires hyperv_config.external_switch_enabled).
wsl_config:
  networking_mode: "bridged"
  gateway: "192.168.50.1"

# OpenSSH Server: base feature on Windows hosts unless explicitly set absent.
openssh_server_state: present

# Docker client — connects to the Docker engine in WSL.
# Hostname resolved via router DNS (WSL distro presents server-225-wsl to DHCP).
docker_engine_ssh_host: "server-225-wsl"
docker_engine_ssh_port: 22
docker_engine_ssh_user: "joshc"

# Hyper-V-native Ubuntu VM replacement for the retired Multipass path.
hyperv_ubuntu_vm_state: present
hyperv_ubuntu_vm_name: "server-225-ubuntu"
hyperv_ubuntu_vm_inventory_host: "server-225-ubuntu"
hyperv_ubuntu_vm_cpus: 4
hyperv_ubuntu_vm_memory: "8G"
hyperv_ubuntu_vm_disk: "40G"
hyperv_ubuntu_vm_user: "ubuntu"
hyperv_ubuntu_vm_hostname: "server-225-ubuntu"
hyperv_ubuntu_vm_ssh_port: 22
hyperv_ubuntu_vm_cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
