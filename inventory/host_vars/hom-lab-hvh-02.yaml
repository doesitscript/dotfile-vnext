---
# Inventory name: HOM-LAB-HVH-02
#   Ansible/NetBox schema alias for the HOM-LAB-HVH-02 Windows control surface.
# Connect target: ansible_host = 192.168.50.158 (permanent LAN IP pattern).
# physical_node: HOM-LAB-HVH-02 — metadata grouping key, NOT a hostname.
# Router/LAN IP: host_ip 192.168.50.158
# Manual SSH should prefer the repo-rendered Host alias HOM-LAB-HVH-02 from ~/.ssh/config.
ansible_host: "192.168.50.158"
ansible_connection: ssh
ansible_port: 22
ansible_user: "joshc"
ansible_ssh_private_key_file: "/Users/joshc/.ssh/id_ed25519_ansible"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_shell_type: "powershell"
ansible_shell_executable: "powershell.exe"
surface_type: "windows_host"
os_hostname: "HOM-LAB-HVH-02"
# Windows still exposes a truncated NetBIOS COMPUTERNAME here; do not use it as
# the Hyper-V management endpoint for repo automation.
windows_netbios_hostname: "HOM-LAB-HVH-02"
hyperv_management_endpoint: "{{ ansible_host }}"
host_ip: "192.168.50.158"
# Stable internal ULA observed in gathered facts and verified live from mac-dev.
host_ipv6: "fdfa:7038:521c:a5fa:7c9:f4a1:90b8:1b1e"
physical_node: "HOM-LAB-HVH-02"
host_kind: "physical_server"
node_capabilities:
  - windows_server_2025
  - hyperv_host
  - nvidia_gpu_host
  - gpu_partition_enabled_host
  - artifact_share_host
gpu_contract:
  vendor: nvidia
  partitioned: true
  passthrough_mode: gpu_p
  workloads_enabled: true
  driver_contract_path: "{{ llm_compute_windows_driver_contract_path }}"
verify_ssh_from_execnode: true

# Legacy WinRM config (retained for reference, not active)
# ansible_connection: winrm
# winrm_port: 5985
# ansible_winrm_password: "{{ vault_hyperv_lane_gpu_win_password }}"
# ansible_winrm_scheme: "http"
# ansible_winrm_transport: "ntlm"
# HTTPS WinRM configuration (uncomment when HTTPS is enabled on server):
# winrm_port: 5986
# ansible_port: 5986
# ansible_winrm_scheme: "https"
# ansible_winrm_server_cert_validation: "ignore"

node_classes:
  - hyperv_host
  - docker_vm_host
  - docker_client
  - gpu_host
hardware_classes:
  - nvidia_gpu
  - high_vram
runtime_planes:
  hyperv_host:
    enabled: true
  hyperv_docker_vm:
    enabled: true
  hyperv_k3s_vm:
    enabled: true
  hyperv_gpu_partitioning:
    enabled: true
    capability_state: active_apply
policy_classes:
  - experimental
  - non_authoritative_data
hyperv_networking_feature_prereqs_enabled: false

# GPU-P partition sizing — hvh-02 partitionable VRAM pool is ~1GB.
hyperv_gpu_partition_adapter_partition_vram_optimal: 500000000
hyperv_gpu_partition_adapter_partition_vram_max: 500000000
hyperv_gpu_partition_adapter_partition_compute_optimal: 500000000
hyperv_gpu_partition_adapter_partition_decode_optimal: 500000000
hyperv_gpu_partition_adapter_require_hyperv_gpu_policy_keys: true

# Hyper-V Ubuntu GPU-P runtime artifact root on the existing public SMB share.
# This keeps large WSL/DriverStore payload handoff off the interactive
# controller-to-Windows SSH path.
windows_file_shares_extra_directories:
  - path: 'F:\shares\public\artifacts'
    purpose: Public share artifact root
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime'
    purpose: Hyper-V Ubuntu GPU-P runtime artifact root
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime\current'
    purpose: Current Hyper-V Ubuntu GPU-P runtime artifact set
  - path: 'F:\shares\public\artifacts\hyperv_ubuntu_gpu_p_runtime\runs'
    purpose: Timestamped Hyper-V Ubuntu GPU-P runtime artifact history

# Infrastructure: Hyper-V External Switch (backbone, independent of any guest).
hyperv_config:
  external_switch_enabled: true
  switch_name: "External"
  adapter_interface_description: "RZ608 Wi-Fi 6E 80MHz"
  adapter_name: "Wi-Fi"
  allow_management_os: true
  management_os_boot_recovery_state: present
  internal_ics_switch_enabled: true
  # The direct routed-subnet milestone wants real guest IP reachability from
  # mac-dev, so keep the switch but do not keep Windows ICS/NAT in the path.
  internal_ics_sharing_enabled: false
  internal_ics_switch_name: "Guest"
  guest_network_mode: "routed_private_subnet"
  guest_switch_name: "Guest"
  guest_subnet_ipv4: "192.168.137.0/24"
  guest_gateway_ipv4: "192.168.137.1"
  # This host's management vNIC currently needs an explicit IPv4 default route
  # and DNS server to keep package/image egress alive after Hyper-V switch
  # convergence. The LAN router remains the modeled authority.
  public_gateway_ipv4: "192.168.50.1"
  public_dns_servers_ipv4:
    - "192.168.50.1"
  # Keep this lane in direct routed mode so controller-to-guest access uses the
  # explicit static-route path instead of host-side source NAT.
  guest_outbound_nat_enabled: false
  # Each entry here creates a netsh portproxy rule and a Windows Firewall inbound
  # rule on this host, forwarding LAN-side connections to the guest VM.
  # Format: listen_address/port = LAN-reachable endpoint on this host.
  #         connect_address/port = actual service on the guest VM.
  guest_published_tcp_ports:
    # Loki log aggregation (roles/network_server/stacks_logging)
    - name: "loki"
      listen_address: "192.168.50.158"
      listen_port: 3100
      connect_address: "192.168.137.10"
      connect_port: 3100
    # NetBox IPAM/DCIM web UI (roles/ipam_netbox, playbooks/deploy_ipam_netbox.yaml)
    - name: "netbox"
      listen_address: "192.168.50.158"
      listen_port: 8000
      connect_address: "192.168.137.10"
      connect_port: 8000
    # Semaphore Ansible UI (roles/ansible_ui_semaphore, playbooks/deploy_ansible_ui_semaphore.yaml)
    - name: "semaphore"
      listen_address: "192.168.50.158"
      listen_port: 3001
      connect_address: "192.168.137.10"
      connect_port: 3001
    # K3s Traefik HTTP front door (roles/k3s_traefik_routes, playbooks/k3s_traefik_routes.yaml)
    - name: "k3s-traefik-http"
      listen_address: "192.168.50.158"
      listen_port: 80
      connect_address: "192.168.137.11"
      connect_port: "{{ k3s_traefik_routes_http_node_port | default(30189) }}"
    # Langfuse K3s web UI (roles/k3s_langfuse_platform, playbooks/deploy_langfuse_platform.yaml)
    - name: "langfuse-k3s"
      listen_address: "192.168.50.158"
      listen_port: 30000
      connect_address: "192.168.137.11"
      connect_port: 30000
    # LiteLLM K3s gateway (roles/k3s_litellm_gateway supplemental NodePort litellm-lan)
    - name: "litellm-k3s"
      listen_address: "192.168.50.158"
      listen_port: 30400
      connect_address: "192.168.137.11"
      connect_port: 30400
  internal_ics_public_adapter_name: "vEthernet (External)"

# OpenSSH Server: base feature on Windows hosts unless explicitly set absent.
openssh_server_state: present

# Docker client — connects to the Docker engine on the Hyper-V Ubuntu guest.
docker_engine_ssh_host: "hom-lab-ctl-dkr-02"
docker_engine_ssh_context_host: "{{ hyperv_ubuntu_vm_autoinstall_network_ipv4 }}"
docker_engine_ssh_port: 22
docker_engine_ssh_user: "joshc"

# Hyper-V-native Docker Ubuntu VM replacement for the retired Multipass path.
hyperv_ubuntu_docker_vm_state: present
hyperv_ubuntu_docker_vm_hostname: "hom-lab-ctl-dkr-02"
hyperv_ubuntu_docker_vm_inventory_host: "hom-lab-ctl-dkr-02"
# One-time Hyper-V rename source when live VM still used server-225-ubuntu.
hyperv_ubuntu_docker_vm_legacy_hyperv_name: "server-225-ubuntu"
hyperv_ubuntu_vm_cpus: 4
hyperv_ubuntu_vm_memory: "8G"
hyperv_ubuntu_vm_disk: "40G"
hyperv_ubuntu_vm_bootstrap_user: "joshc"
hyperv_ubuntu_vm_ssh_port: 22
hyperv_ubuntu_vm_source_mode: "server_iso_installer"
hyperv_ubuntu_vm_server_iso_installer_media_state: "detached"
hyperv_ubuntu_vm_secure_boot_enabled: false
hyperv_ubuntu_vm_publish_connection_facts: false
hyperv_ubuntu_vm_autoinstall_network_method: "static"
hyperv_ubuntu_vm_autoinstall_network_ipv4: "192.168.137.10"
hyperv_ubuntu_vm_autoinstall_network_prefix_length: 24
hyperv_ubuntu_vm_autoinstall_network_gateway4: "192.168.137.1"
hyperv_ubuntu_vm_autoinstall_network_dns_servers:
  - "192.168.50.1"
hyperv_ubuntu_vm_quick_create_image_url: >-
  https://partner-images.canonical.com/hyper-v/desktop/noble/release/current/ubuntu-noble-hyperv-amd64-ubuntu-desktop-hyperv.vhdx.zip
hyperv_ubuntu_vm_server_iso_url: "https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso"

# Hyper-V-native K3s Ubuntu VM companion for the RTX 5090 server lane.
# This prepares the VM only. Real K3s installation and GPU enablement are
# handled by later plan slices after the baseline target exists.
hyperv_ubuntu_k3s_vm_state: present
hyperv_ubuntu_k3s_vm_hostname: "hom-lab-ctl-k3s-02"
hyperv_ubuntu_k3s_vm_inventory_host: "hom-lab-ctl-k3s-02"
hyperv_ubuntu_k3s_vm_cpus: 4
hyperv_ubuntu_k3s_vm_memory: "10G"
hyperv_ubuntu_k3s_vm_disk: "80G"
# Keep sustained K3s/container/PVC I/O off the Windows system disk.
hyperv_ubuntu_k3s_vm_host_vhdx_path: 'D:\ProgramData\Ansible\hyperv_ubuntu_vm\hom-lab-ctl-k3s-02\hom-lab-ctl-k3s-02.vhdx'
hyperv_ubuntu_k3s_vm_bootstrap_user: "joshc"
hyperv_ubuntu_k3s_vm_ssh_port: 22
# Azure cloud-image path: offline seed disabled on server lanes (no wsl.exe --mount).
hyperv_ubuntu_k3s_vm_cloud_image_offline_seed_enabled: false
hyperv_ubuntu_k3s_vm_cloud_image_offline_seed_mount_provider: disabled
hyperv_ubuntu_k3s_vm_source_mode: "azure_cloud_image"
hyperv_ubuntu_k3s_vm_secure_boot_enabled: false
hyperv_ubuntu_k3s_vm_publish_connection_facts: false
hyperv_ubuntu_k3s_vm_autoinstall_network_method: "static"
hyperv_ubuntu_k3s_vm_autoinstall_network_ipv4: "192.168.137.11"
hyperv_ubuntu_k3s_vm_autoinstall_network_prefix_length: 24
hyperv_ubuntu_k3s_vm_autoinstall_network_gateway4: "192.168.137.1"
hyperv_ubuntu_k3s_vm_autoinstall_network_dns_servers:
  - "192.168.50.1"

# Additive AI host profile for playbook targeting and inventory-driven selection.
ai_host_profile:
  description: Primary GPU / inference Hyper-V host with the flagship local AI compute role.
  tags:
    - ai-host-profile
    - primary-ai-compute
    - gpu-lane
    - windows
  infrastructure_role: primary_ai_compute_host
  compute:
    class: flagship
    priority: primary
    description: Primary compute lane for local-first coding and shared inference services.
    tags:
      - flagship
      - primary
      - local-first
  gpu:
    ai_tier: tier1
    role: ai_compute_primary
    compute_class: primary_ai_accelerator
    runtime_eligible: true
    partition_source: true
    workload_classes:
      - local_llm_inference
      - ai_agent_runtime
      - primary_model_runtime
      - gpu_partition_source
      - shared_gateway_support
    description: RTX 5090-backed primary accelerator lane and GPU partition source host.
    tags:
      - tier1
      - nvidia
      - gpu-p
      - shared-ai-runtime
  ai_runtime:
    shared_cluster_runtime:
      enabled: true
      runtime_plane: k3s_gpu_lane
      service_host: hom-lab-ctl-k3s-02
      purpose: shared_litellm_vllm_langfuse_stack
      tags:
        - k3s
        - shared-services
        - litellm
        - vllm
    routing:
      preferred_for:
        - large_local_models
        - primary_coding_models
        - high_context_reasoning
        - latency_sensitive_inference
      avoid_for:
        - bulk_storage
        - minio_primary
