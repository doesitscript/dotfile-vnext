---
# WSL surface for network-server.
# STATUS: WSL NOT YET INSTALLED — wsl.exe --list showed no distributions on 2026-02-25.
# ansible_host is the router DHCP reservation for the future bridged WSL instance.
# Update ansible_host/host_ip to actual WSL IP after Ubuntu-24.04 is provisioned.
# ansible_connection, ansible_ssh_private_key_file inherited from group_vars/wsl_hosts.
wsl_user: "joshc"
physical_node: "network-server"
ansible_port: 22
ansible_host: "192.168.50.240"
host_ip: "192.168.50.240"
surface_type: "wsl"
ansible_user: "joshc"
wsl_distro: "Ubuntu-24.04"
# WSL sshd listens on this port inside the distro.
# With bridged networking, WSL has its own LAN IP and is directly reachable.
# With NAT, netsh portproxy forwards this port from the Windows host to WSL.
# Windows sshd uses 2222/2223 — no conflict.
wsl_ssh_port: 22
ansible_python_interpreter: "/usr/bin/python3"
# SSH paths (same names as windows; destinations identical in purpose).
ansible_ssh_dir_path: "/home/joshc/.ssh"
ansible_authorized_keys_path: "/home/joshc/.ssh/authorized_keys"

# Docker Engine — geerlingguy.docker installs Docker inside this WSL distro.
# Clients (mac-dev, network-server) connect via SSH Docker contexts.
docker_engine_in_wsl: true

# log output locations
# journalctl -u ssh.service
#  tail -f /var/log/auth.log
# on windows: Get-WinEvent -LogName OpenSSH/Operational -Oldest | select -ExpandProperty Message
