---
# Planned Hyper-V-native K3s Ubuntu VM surface on home-lab-auth-hvh-01.
# This host is intentionally not in k3s_cluster yet; the current lane stops at
# VM readiness and verifies that k3s has not been installed.

physical_node: "home-lab-auth-hvh-01"
surface_type: "ubuntu_vm"
node_classes:
  - k3s_runtime
hardware_classes:
  - bulk_storage
runtime_planes:
  k3s_node:
    enabled: true
    purpose: control_plane_stub
policy_classes:
  - authoritative_data
  - lan_exposed_services
ansible_host: "192.168.138.11"
host_ip: "192.168.138.11"
ansible_user: "joshc"
ansible_port: 22
ansible_python_interpreter: "/usr/bin/python3"
ssh_proxy_jump_host: "home-lab-auth-hvh-01"
ansible_ssh_common_args: >-
  -o ProxyJump=home-lab-auth-hvh-01
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
k3s_readiness_stub_expected_runtime: absent
