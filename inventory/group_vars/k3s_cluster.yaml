---
# k3s cluster-wide variables
# Used by the k3s.orchestration collection and our custom roles.

k3s_version: "v1.31.12+k3s1"

# Token for node-to-node auth. Generate once, vault-encrypt, reuse.
# Generate: openssl rand -base64 32 | tr '/' '_'
# Encrypt: ansible-vault encrypt_string --name k3s_token '<value>'
token: "{{ k3s_token }}"

# Control-plane address for the dedicated single-node K3s VM. This is resolved
# per k3s_cluster host to avoid hostvars recursion during bootstrap guards.
api_endpoint: "{{ ansible_host }}"

# All k3s data on the Linux guest local filesystem
k3s_server_location: /var/lib/rancher/k3s

# Control plane config -- written to /etc/rancher/k3s/config.yaml on server nodes.
# Tighter reserves: control plane runs etcd-equivalent + API server.
server_config_yaml: |
  write-kubeconfig-mode: "0644"
  data-dir: /var/lib/rancher/k3s
  node-label:
    - "role=control"
  kubelet-arg:
    - "system-reserved=cpu=1,memory=1Gi"
    - "kube-reserved=cpu=1,memory=1Gi"
    - "eviction-hard=memory.available<256Mi,nodefs.available<10%"
  disable:
    - servicelb

# K3s Traefik ingress route registry (SSOT runtime mirror — see live-object-registry.yml ingress_routes)
k3s_traefik_routes_state: present

k3s_traefik_routes_class_name: traefik

k3s_traefik_routes_lan_publish_host: "{{ hostvars['HOM-LAB-HVH-02'].host_ip | default('192.168.50.158') }}"

k3s_traefik_routes_entries:
  - route_key: langfuse-web
    ingress_name: langfuse-web-ingress
    namespace: langfuse
    hostname: langfuse.hom.lab
    service_name: langfuse-web
    service_port: 3000
    path: /
    path_type: Prefix
    netbox_service_slug: langfuse-k3s-web
    logical_hostname: hom-lab-ctl-lfs-01
    deployed_by_role: k3s_langfuse_platform
    fallback_exposure: nodeport
    fallback_node_port: 30000
    mac_hosts_enabled: true
    tags:
      - web-ui
      - k3s
      - traefik-routed
      - lan-exposed-services
  - route_key: litellm-gateway
    ingress_name: litellm-gateway-ingress
    namespace: litellm
    hostname: litellm.hom.lab
    service_name: litellm
    service_port: 4000
    path: /
    path_type: Prefix
    netbox_service_slug: litellm-k3s-gateway
    logical_hostname: hom-lab-ctl-llm-01
    deployed_by_role: k3s_litellm_gateway
    fallback_exposure: nodeport
    fallback_node_port: 30400
    mac_hosts_enabled: true
    tags:
      - web-ui
      - k3s
      - traefik-routed
      - lan-exposed-services

# Agent config -- written to /etc/rancher/k3s/config.yaml on agent nodes.
agent_config_yaml: |
  data-dir: /var/lib/rancher/k3s
  kubelet-arg:
    - "system-reserved=cpu=500m,memory=512Mi"
    - "kube-reserved=cpu=500m,memory=512Mi"
    - "eviction-hard=memory.available<256Mi,nodefs.available<10%"
