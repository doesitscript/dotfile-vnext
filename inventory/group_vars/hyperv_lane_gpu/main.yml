---
# hyperv_lane_gpu — GPU/execution Hyper-V lane (hom-lab-ctl-hvh-02 + hom-lab-ctl-dkr-02)
# Directory form is used because this group also has vault.yml.
host_name: hom-lab-ctl-hvh-02
physical_node: hom-lab-ctl-hvh-02
lan_ip: "192.168.50.158"

node_role: primary-gpu-node
node_purpose: development  # drives deploy_development_nodes.yaml targeting — see group_vars/all.yaml
os: windows-server-2025
authority_level: execution
# High-level usage profile for targeting and exclusion decisions.
host_usage_profile: managed_service_node
# Second-order capability descriptors for dynamic grouping.
interaction_model: unattended
operation_model: service
management_boundary: infra_managed
# Expected uptime posture for this machine in normal life.
availability_expectation: expected_continuous
# How aggressively repo automation is allowed to manage this machine.
automation_management_model: infrastructure_managed
docker_runtime: hyperv-ubuntu-docker-engine
gpu: rtx-5090
persistent_data_allowed: limited_non_authoritative

# Storage paths
windows_data_root: "D:\\ai"
stacks_root: "D:\\ai\\stacks"
data_root: "D:\\ai\\data"
linux_stacks_root: "/srv/stacks"
linux_data_root: "/srv/data"
docker_engine_host: "hom-lab-ctl-dkr-02"

# Windows Server Backup baseline
# Opt this host into the same managed backup lifecycle surface as
# hom-lab-ctl-hvh-01 so a plain windows_hosts run evaluates and applies here.
windows_server_backup_state: present
windows_server_backup_target_drive: "E"
windows_server_backup_target_label: "backups"
windows_server_backup_automatic_interval_days: 7
