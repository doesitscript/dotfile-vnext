---
# dev-workstation (physical node: dev-workstation-win + dev-workstation-wsl eventually)
# group_vars filename matches inventory group name dev_workstation
host_name: dev-workstation
physical_node: dev-workstation
lan_ip: "192.168.50.70"

node_role: dev-gpu-node
os: windows-11
authority_level: execution
# gpu: TBD (from fact collection)
# persistent_data_allowed: TBD

# Windows base configuration (consumed by common/windows_base role)
# windows_base_config:
#   enable_wsl: true

# Storage paths (TBD from fact collection -- depends on disk layout)
# windows_data_root: "D:\\ai"
# wsl_mount_root: "/mnt/d/ai"
# stacks_root: "D:\\ai\\stacks"
# data_root: "D:\\ai\\data"

# WSL configuration (uncomment after WSL is set up)
# wsl_distro: "Ubuntu-24.04"
# wsl_ssh_port: 22
# systemd_in_wsl: true
# docker_engine_in_wsl: true
# docker_engine_on_windows: disabled
