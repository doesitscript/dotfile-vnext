---
# dev-workstation (physical node: dev-workstation-win)
# group_vars filename matches inventory group name dev_workstation
# Fact collection: 2026-02-24 via ansible.builtin.setup over WinRM
host_name: dev-workstation
physical_node: dev-workstation
lan_ip: "192.168.50.70"

node_role: gaming-desktop
# Traditional family gaming desktop. This is an interactive end-user machine,
# not a repo-managed service node or shared development control surface.
node_purpose: interactive_desktop  # excluded from deploy_development_nodes.yaml targeting
os: windows-10-pro
authority_level: execution
# High-level usage profile for targeting and exclusion decisions.
host_usage_profile: interactive_family_workstation
# Second-order capability descriptors for dynamic grouping.
interaction_model: interactive
operation_model: user_endpoint
management_boundary: user_managed
# Expected uptime posture for this machine in normal life.
availability_expectation: planned_optional
# How aggressively repo automation is allowed to manage this machine.
automation_management_model: opt_in_special_projects

# --- Hardware (from fact collection) ---
cpu: "Intel Core i7-6700K @ 4.00GHz"
cpu_cores: 4
cpu_threads: 8
ram_mb: 16345
system_vendor: "MSI"
motherboard: "MS-7A12"
bios_version: "1.A0"
bios_date: "07/04/2018"
architecture: "x86_64"
gpu: "AMD Radeon RX 9060 XT"
gpu_vram_bytes: 4293918720
gpu_driver_version: "32.0.23017.1001"
persistent_data_allowed: user_managed

# --- OS details ---
os_name: "Microsoft Windows 10 Pro"
os_version: "10.0.19045.0"
os_install_date: "2024-11-02"
powershell_version: 5
windows_domain: "WORKGROUP"
domain_member: false

# --- Network ---
# Primary NIC: ASUS USB-BE92 Nano (Wi-Fi) -- carries LAN IP
# Secondary NIC: Intel I219-V Ethernet -- currently APIPA (no DHCP)
primary_mac: "CC:28:AA:6C:D0:57"
ethernet_mac: "4C:CC:6A:63:AF:16"

