---
# homelab_hosts_file_* — interim DNS SSOT for /etc/hosts, K3s CoreDNS, and
# verify matrices (DNS-3b).
# Mirror: docs/reference/naming-standards/live-object-registry.yml ingress_routes,
# guest_direct_operator_services, guest_portproxy_catalog,
# homelab_router_gt6_mac_hosts_workaround.
#
# hosts_ip = IP written to /etc/hosts and to K3s CoreDNS (coredns-custom
#   hom.lab.server via role k3s_coredns_homelab_hosts). Name resolution only —
#   port lives in verify_url.
# Opt out of CoreDNS with coredns_hosts_enabled: false on a catalog row.
# Guest VM SSH names remain in homelab_router_gt6_mac_hosts_workaround (not duplicated here).

homelab_hosts_file_lan_publish_ip: >-
  {{ hostvars['HOM-LAB-HVH-02'].host_ip | default('192.168.50.158') }}

homelab_hosts_file_dkr_guest_ip: >-
  {{ hostvars['hom-lab-ctl-dkr-02'].ansible_host | default('192.168.137.10') }}

homelab_hosts_file_web_catalog:
  # Traefik ingress + NodePort interim (k3s_traefik_routes_entries)
  - catalog_key: langfuse-web
    hostname: langfuse.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://langfuse.hom.lab:30000/"
    source: k3s_traefik_routes_entries
    source_ref: langfuse-web
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: litellm-gateway
    hostname: litellm.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://litellm.hom.lab:30400/"
    source: k3s_traefik_routes_entries
    source_ref: litellm-gateway
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: jupyter-workbench
    hostname: jupyter.hom.lab
    hosts_ip: "{{ hostvars['hom-lab-ctl-k3s-02'].ansible_host | default('192.168.137.11') }}"
    verify_url: "http://jupyter.hom.lab:8888/lab"
    source: guest_direct
    source_ref: hom-lab-ctl-k3s-02
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  # LAN portproxy web UIs (guest_published_tcp_ports on HOM-LAB-HVH-02)
  - catalog_key: netbox-web
    hostname: netbox.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://netbox.hom.lab:8000/"
    source: guest_published_tcp_ports
    source_ref: netbox
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: semaphore-web
    hostname: semaphore.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://semaphore.hom.lab:3001/"
    source: guest_published_tcp_ports
    source_ref: semaphore
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: loki-http
    hostname: loki.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://loki.hom.lab:3100/ready"
    source: guest_published_tcp_ports
    source_ref: loki
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: openwebui-web
    hostname: openwebui.hom.lab
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "http://openwebui.hom.lab:3080/"
    source: guest_published_tcp_ports
    source_ref: openwebui
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  # Guest-direct HTTP (no LAN portproxy today)
  - catalog_key: grafana-web
    hostname: grafana.hom.lab
    hosts_ip: "{{ homelab_hosts_file_dkr_guest_ip }}"
    verify_url: "http://grafana.hom.lab:3000/"
    source: guest_direct
    source_ref: hom-lab-ctl-dkr-02
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  # Operator-facing Hyper-V host aliases.
  - catalog_key: HOM-LAB-HVH-02-host
    hostname: HOM-LAB-HVH-02
    hosts_ip: "{{ homelab_hosts_file_lan_publish_ip }}"
    verify_url: "ssh://HOM-LAB-HVH-02"
    source: inventory_host
    source_ref: HOM-LAB-HVH-02
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: HOM-LAB-HVH-01-host
    hostname: HOM-LAB-HVH-01
    hosts_ip: "{{ hostvars['HOM-LAB-HVH-01'].host_ip | default('192.168.50.234') }}"
    verify_url: "ssh://HOM-LAB-HVH-01"
    source: inventory_host
    source_ref: HOM-LAB-HVH-01
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  # Host-local Ollama OpenAI-compatible APIs (Continue backends via LiteLLM).
  - catalog_key: ollama-desktop
    hostname: ollama-desktop.hom.lab
    hosts_ip: "{{ hostvars['dev-workstation-win'].host_ip | default('192.168.50.133') }}"
    verify_url: "http://ollama-desktop.hom.lab:11434/api/tags"
    source: guest_direct
    source_ref: dev-workstation-win
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
  - catalog_key: ollama-hvh01
    hostname: ollama-hvh01.hom.lab
    hosts_ip: "{{ hostvars['HOM-LAB-HVH-01'].host_ip | default('192.168.50.234') }}"
    verify_url: "http://ollama-hvh01.hom.lab:11434/api/tags"
    source: guest_direct
    source_ref: HOM-LAB-HVH-01
    mac_hosts_enabled: true
    linux_hosts_enabled: true
    windows_hosts_enabled: true
