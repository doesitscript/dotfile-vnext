---
# External fuzlang data-plane contract
# These connect addresses are the preferred operator/runtime paths and should
# stay on the Windows LAN-published route for the storage lane unless the user
# explicitly changes that preference. They are NOT Ansible inventory hostnames.
fuzlang_storage_windows_publish_host: "192.168.50.234"

# External PostgreSQL
fuzlang_external_postgres_connect_address: "{{ fuzlang_storage_windows_publish_host }}"
fuzlang_external_postgres_host: "{{ fuzlang_external_postgres_connect_address }}"
fuzlang_external_postgres_port: 5432
fuzlang_external_postgres_user: langfuse
fuzlang_external_postgres_password: Pass@w0rd1
fuzlang_external_postgres_db: langfuse

# External Redis
fuzlang_external_redis_connect_address: "{{ fuzlang_storage_windows_publish_host }}"
fuzlang_external_redis_host: "{{ fuzlang_external_redis_connect_address }}"
fuzlang_external_redis_port: 6379
fuzlang_external_redis_password: Pass@w0rd1
fuzlang_external_redis_db: 0

# External ClickHouse
fuzlang_external_clickhouse_connect_address: "{{ fuzlang_storage_windows_publish_host }}"
fuzlang_external_clickhouse_host: "{{ fuzlang_external_clickhouse_connect_address }}"
fuzlang_external_clickhouse_http_port: 8123
fuzlang_external_clickhouse_native_port: 9004
fuzlang_external_clickhouse_user: default
fuzlang_external_clickhouse_password: Pass@w0rd1
fuzlang_external_clickhouse_db: default

# External S3 / MinIO
fuzlang_external_s3_connect_address: "{{ fuzlang_storage_windows_publish_host }}"
fuzlang_external_s3_host: "{{ fuzlang_external_s3_connect_address }}"
fuzlang_external_s3_port: 9000
fuzlang_external_s3_console_port: 9001
fuzlang_external_s3_endpoint: "http://{{ fuzlang_external_s3_host }}:{{ fuzlang_external_s3_port }}"
fuzlang_external_s3_bucket: langfuse
fuzlang_external_s3_region: auto
fuzlang_external_s3_force_path_style: true
