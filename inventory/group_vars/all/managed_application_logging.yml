---
# Root for logs emitted by configurable applications/tools that this project
# explicitly manages. This is not a replacement for system logs, Windows Event
# Logs, OpenSSH logs, K3s/Docker shared logs, Loki storage, or other
# infrastructure-owned logging paths.
#
# Application-owned paths should be built below this root:
#   {{ managed_application_log_root }}/<application>/<log-file-or-subdir>
#
# OS/class group vars provide the default. Host vars may override it when a
# host has a dedicated external log volume or another approved placement.
managed_application_log_root: ""

