homelab_router_gt6_dhcp_domain: hom.lab
homelab_router_gt6_dhcp_dns_server: "192.168.50.1"

homelab_router_gt6_static_routes:
  - destination: "192.168.137.0"
    mask: "255.255.255.0"
    gateway: "192.168.50.158"
    metric: 1
    interface: LAN
    status: operator_applied
  - destination: "192.168.138.0"
    mask: "255.255.255.0"
    gateway: "192.168.50.234"
    metric: 1
    interface: LAN
    status: operator_applied

