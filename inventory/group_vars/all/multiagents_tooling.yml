---
# Version contract for zetbrush/multiagents.
#
# Authority: shared pins for every host that commissions multiagents.
# Commission hosts separately via host_vars: multiagents_state: present|absent
# Role: roles/multiagents/
# Playbook tag: multiagents (playbooks/deploy_development_nodes.yaml)
#
# Bun is installed from oven-sh/bun GitHub release assets (not Homebrew —
# brew source-builds on older macOS). After bumping, re-apply:
#   ansible-playbook playbooks/deploy_development_nodes.yaml \
#     --tags multiagents --limit <host>
#
# Do not put version pins in host_vars unless a host needs an intentional fork.
multiagents_tooling_version_contract:
  cli: "0.5.0"
  bun: "1.4.0"
