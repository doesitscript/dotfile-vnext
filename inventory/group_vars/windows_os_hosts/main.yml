---
# Shared Windows remoting fallback contract.
# When a Windows SSH surface is unavailable, the best-effort access playbook
# must try the already-enabled WinRM/PowerShell remoting surface on the same
# host before giving up. This is a transport fallback only, not a bootstrap
# script path.

windows_remoting_fallback_enabled: true
windows_remoting_fallback_user: "joshc"
windows_remoting_fallback_port: 5985
windows_remoting_fallback_scheme: "http"
windows_remoting_fallback_transport: "ntlm"
windows_remoting_fallback_shell_type: "powershell"
windows_remoting_fallback_shell_executable: "powershell.exe"

# Default root for configurable application/tool logs on Windows. Host vars
# should override this when the host has a commissioned external application
# log root (for example, a LOGS-HOST-backed path). The existing Windows system
# log/event-log placements are intentionally out of scope and must not be
# changed by this variable.
managed_application_log_root: '%LOCALAPPDATA%\\dotfile-vnext\\logs'
