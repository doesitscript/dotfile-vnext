---
# mac-dev (Joshs-MBP) - physical node, single surface
# group_vars filename matches inventory group name mac_dev
host_name: mac-dev
physical_node: mac-dev
lan_ip: "192.168.50.33"

node_role: development-control-plane
os: macOS
authority_level: non-authoritative
persistent_data_allowed: false
outbound_only: true
ansible_python_interpreter: /usr/bin/python3
ansible_connection: local


# Official: Mac control plane uses bash (not zsh). Use these when writing
# profile/rc lines (e.g. sourcing rendered env for Ansible runner).
mac_shell_profile_file: ".bash_profile"   # login shells
mac_shell_rc_file: ".bashrc"             # interactive non-login

# Python versions to install with pyenv
pyenv_global_versions:
  - "3.12"
  - "3.11"
  - "3.10"

# Environment for plays that run ON this host (mac_dev). Does NOT set the controller
# process env—for WinRM/PSRP from this Mac you must export these in the shell
# (e.g. direnv/.envrc or source .env). See docs/winrm_from_mac.md.
environment:
  OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "yes"
  no_proxy: "*"
