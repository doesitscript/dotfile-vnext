---
# mac-dev (Joshs-MBP) - physical node, single surface
# group_vars filename matches inventory group name mac_dev
host_name: mac-dev
physical_node: mac-dev
lan_ip: "192.168.50.33"

node_role: development-control-plane
node_purpose: development
os: macOS
authority_level: non-authoritative
persistent_data_allowed: false
outbound_only: true
ansible_python_interpreter: /usr/bin/python3
ansible_connection: local


# Python versions to install with pyenv
pyenv_global_versions:
  - "3.12"
  - "3.11"
  - "3.10"

# Environment variables for macOS (winrm/psrp). Reserved name 'environment' -> mac_environment.
mac_environment:
  OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "yes"
  no_proxy: "*"
