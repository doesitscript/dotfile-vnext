---
# WSL SSH surfaces. Key and connection must match controller (Mac): key from bootstrap_mac → ~/.ssh/id_ed25519_ansible.
# ansible-doc -t shell -l to see the available shells
ansible_python_interpreter: /usr/bin/python3
ansible_connection: "ssh"
ansible_ssh_private_key_file: "~/.ssh/id_ed25519_ansible"
# SSH paths (same variable names as windows_hosts; destinations identical in purpose).
ansible_ssh_dir_path: "/home/joshc/.ssh"
ansible_authorized_keys_path: "/home/joshc/.ssh/authorized_keys"
# ansible_shell_type: "sh"