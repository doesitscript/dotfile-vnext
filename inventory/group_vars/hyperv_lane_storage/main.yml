---
# hyperv_lane_storage — storage/observability Hyper-V lane (HOM-LAB-HVH-01 + guests).
# NetBox/source-of-truth control host: HOM-LAB-HVH-01.
# Legacy aliases: network-server, AI-NET-SERVER.
#
# Hardware note (2026-09-01): storage lane by role only — do not assert more RAM
# or disk vs HVH-02. Recorded disk probe: docs/plans/2026-09-01--hvh01-network-uplink-current-state-incomplete/findings.md
host_name: HOM-LAB-HVH-01
physical_node: HOM-LAB-HVH-01
legacy_aliases:
  - network-server
lan_ip: "192.168.50.234"

node_role: storage-observability-node
os: windows-server-2025
authority_level: authoritative
# High-level usage profile for targeting and exclusion decisions.
host_usage_profile: managed_service_node
# Second-order capability descriptors for dynamic grouping.
interaction_model: unattended
operation_model: service
management_boundary: infra_managed
# Expected uptime posture for this machine in normal life.
availability_expectation: expected_continuous
# How aggressively repo automation is allowed to manage this machine.
automation_management_model: infrastructure_managed
docker_runtime: hyperv-ubuntu-docker-engine
persistent_data_allowed: true
docker_engine_host: "hom-lab-ctl-dkr-01"

# Storage paths (for apps storage like Postgres, etc.)
windows_data_root: "D:\\ai"
stacks_root: "D:\\ai\\stacks"
data_root: "D:\\ai\\data"
# Hyper-V VM / Ansible bulky trees on the labeled F: data volume (not C:/D:).
windows_data_drive_letter: "F"
windows_hyperv_ansible_root: "F:\\ProgramData\\Ansible"
windows_hyperv_vm_storage_root: "F:\\ProgramData\\Ansible\\hyperv_ubuntu_vm"
linux_stacks_root: "/srv/stacks"
linux_data_root: "/srv/data"
# minio_disk: "8TB WD Red Plus"

# Docker configuration (for Docker's basic image storage)
docker_data_root: "D:\\docker-data"  # non-OS disk

# Port exposure configuration (per contract)
# PostgreSQL exposed on LAN for K3s workloads
postgres_exposure: "0.0.0.0:5432:5432"  # lan - firewall_open: true
redis_exposure: "0.0.0.0:6379:6379"  # lan - firewall_open: true
clickhouse_http_exposure: "0.0.0.0:8123:8123"  # lan - firewall_open: true
clickhouse_native_exposure: "0.0.0.0:9004:9000"  # lan - firewall_open: true; avoid minio 9000 conflict
minio_api_exposure: "0.0.0.0:9000:9000"  # lan - firewall_open: true
minio_console_exposure: "0.0.0.0:9001:9001"  # lan - firewall_open: true
stacks_network_langfuse_compose_enabled: false
# This lane has existing MinIO data written by a newer image lineage; keep it
# on that lineage until a deliberate pinned-version migration is planned.
stacks_network_minio_image_tag: latest

# Task scheduler autostart
task_scheduler_enabled: true
task_scheduler_delay_seconds: 45

# Windows Server Backup baseline
# First milestone target: this is the first Windows host intended for the new
# backup playbook. The live baseline source remains HOM-LAB-HVH-02.
windows_server_backup_state: present
windows_server_backup_target_drive: "E"
windows_server_backup_target_label: "backups"
windows_server_backup_automatic_interval_days: 7
# Intentionally do not pin the temporary vendor label here.
# After the backup disks are normalized across hosts, set the shared expected
# label (for example: "backups") at the common inventory layer.
windows_server_backup_baseline_source_host: "HOM-LAB-HVH-02"

# Managed service data/backup disk layout
windows_managed_service_data_backup_disk_state: present
windows_managed_service_data_backup_disk_target_model: "TOSHIBA MK1059GSM"
windows_managed_service_data_backup_disk_target_serial_number: "70HDP1Z7T"
