---
ansible_connection: ssh
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: "~/.ssh/id_ed25519_ansible"
ansible_ssh_dir_path: "/home/{{ ansible_user }}/.ssh"
ansible_authorized_keys_path: "/home/{{ ansible_user }}/.ssh/authorized_keys"

# Default root for configurable application/tool logs on Linux guests. Override
# per host when an approved external logging filesystem is available. This does
# not govern journald, K3s, Docker, Loki, or other shared infrastructure logs.
managed_application_log_root: /var/log/dotfile-vnext
