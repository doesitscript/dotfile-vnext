---
# Host(s) that run Ansible and hold the canonical SSH key (~/.ssh/id_ed25519_ansible).
# Delegation to execution_nodes[0] reads the public key from that host at run time.
ansible_connection: local
# i don't know if i can delete this, i put htat line i nthe ma_dev

transport_execnode_ssh_key_basename: "id_ed25519_ansible"
transport_known_hosts_manage: true
transport_known_hosts_targets:
  - name: "hom-lab-hvh-02"
    host: "{{ hostvars['hom-lab-hvh-02'].ansible_host | default('hom-lab-hvh-02') }}"
    port: 22
