---
# dev-3090 (physical node: dev-3090-win)
# group_vars filename matches inventory group name dev_3090
host_name: dev-3090
physical_node: dev-3090
lan_ip: "192.168.50.191"

node_role: dev-gpu-node
node_purpose: development  # drives deploy_development_nodes.yaml targeting — see group_vars/all.yaml
os: windows-11
authority_level: execution
system_usage_class: interactive_family_workstation
availability_expectation: planned_optional
automation_management_model: opt_in_special_projects
docker_runtime: hyperv-ubuntu-docker-engine
gpu: rtx-3090
persistent_data_allowed: limited

# Storage paths
windows_data_root: "D:\\ai"
stacks_root: "D:\\ai\\stacks"
data_root: "D:\\ai\\data"
docker_engine_host: "server-225-ubuntu"

# Dev stack deployment flags (optional services)
deploy_dev_ollama: false  # Set to true to deploy dev_ollama
deploy_dev_litellm: false  # Set to true to deploy dev_litellm

# Port exposure configuration (per contract)
# Restricted services bind to localhost only by default
dev_ollama_exposure: "127.0.0.1:11434:11434"  # restricted - can be changed to "0.0.0.0:11434:11434" for LAN
dev_litellm_exposure: "127.0.0.1:4000:4000"  # restricted - can be changed to "0.0.0.0:4000:4000" for LAN
