---
# Variables for all hosts
timezone: America/Chicago  # POSIX timezone (for macOS/Linux)
timezone_windows: Central Standard Time  # Windows timezone name

# ─── Node Classification Schema ────────────────────────────────────────────
# node_purpose classifies a physical node's role in the infrastructure.
# Set it in the physical node's group_vars file (group_vars/<node>.yaml).
# It applies to all managed surfaces of that node, including Windows bootstrap
# hosts and any attached Linux VM guest surfaces.
#
# Playbooks use Ansible's group_by module to create runtime groups from this
# variable (e.g. node_purpose_development), then target those groups — no
# static host lists are needed. To add a node to a purpose group, set
# node_purpose here. No playbook or inventory changes required.
#
# Defined values and their playbooks:
#   development  → deploy_development_nodes.yaml
#                  Deploys: common/shell_config, direnv, cursor
#                  Current nodes: mac-dev, HOM-LAB-HVH-02, hom-lab-ctl-dkr-02
#   interactive_desktop → no broad shared playbook by default
#                  Traditional end-user desktops. These are intentionally kept
#                  out of repo-wide development-tooling and managed-service
#                  automation unless a capability explicitly opts them in.
#
# node_role is a descriptive label only — it does NOT drive playbook targeting.
# node_purpose drives targeting. node_role describes the hardware/function.
#
# Second-order capability classification surfaces:
# - interaction_model
#     unattended   → low-touch service/control surfaces
#     interactive  → human-driven desktop/endpoint surfaces
# - operation_model
#     service      → infrastructure/service delivery node
#     user_endpoint → traditional end-user workstation/desktop
# - management_boundary
#     infra_managed → normal repo-managed infrastructure automation is allowed
#     user_managed  → repo automation is opt-in and should default to exclusion
#
# These are intentionally capability-agnostic inputs for dynamic grouping.
# Example future derived groups:
#   windows_backup_candidate_true
#   windows_backup_metadata_eligible_true
#   windows_backup_management_policy_managed
# ────────────────────────────────────────────────────────────────────────────
# Legacy pointer only — do not treat fuzlang.contract.yaml as SSOT.
# See contracts/README.md (product contracts) and policy/ (capability policy).
contract_file: contracts/fuzlang.contract.yaml

# Langfuse platform external data plane: inventory/group_vars/all/langfuse_platform_external_services.yml
# (canonical). fuzlang_external_services.yml is deprecated compatibility aliases only.

# Dotfiles role path defaults (override per host/group if needed).
dotfiles_home: >-
  {{ 'D:\\develop\\dotfile-vnext'
     if ansible_facts['system'] == 'Windows'
     else ('/Users/' ~ ansible_facts['user_id'] ~ '/develop/dotfile-vnext'
           if ansible_facts['system'] == 'Darwin'
           else '/mnt/d/develop/dotfile-vnext') }}

dotfiles_user_home: >-
  {{ (ansible_facts['env'].USERPROFILE | default('C:\\Users\\' ~ ansible_facts['user_id']))
     if ansible_facts['system'] == 'Windows'
     else (ansible_facts['env'].HOME | default(ansible_facts['user_dir'])) }}

# ─── Logging stack ────────────────────────────────────────────────────────────
# Loki push endpoint — all Alloy agents on every host send logs here.
# It follows the active logging_server assignment instead of hardcoding a node
# name. If the active logging server needs a published/public endpoint distinct
# from its own host_ip, define logging_loki_public_endpoint on that host.
logging_alloy_loki_endpoint: >-
  {{
    hostvars[(groups['logging_server'] | first)].logging_loki_public_endpoint
    | default(
      'http://' ~ (
        hostvars[(groups['logging_server'] | first)].host_ip
        | default(hostvars[(groups['logging_server'] | first)].ansible_host)
      ) ~ ':3100/loki/api/v1/push'
    )
  }}

# ─── Codex / Cursor tooling versions ────────────────────────────────────────
# Shared version contract for the local Codex CLI, Cursor CLI, and Codex Cursor
# extension. These are different release streams, so they intentionally use
# separate fields while staying under one inventory-owned contract.
codex_tooling_version_contract:
  cli: "0.130.0"
  cursor_extension: "26.623.61825"
  cursor_cli: "2026.05.16-0338208"

# ─── Langfuse tooling versions ──────────────────────────────────────────────
# Version contract for Langfuse CLI and related tooling
langfuse_tooling_version_contract:
  cli: "0.0.10"

# ─── K8s tooling versions ───────────────────────────────────────────────────
# Version contract for Kubernetes CLI tools
k8s_tooling_version_contract:
  k9s: ""
  kubecolor: ""
  stern: ""
  kubectx: ""
  helm: ""
  krew: ""
  kubeseal: ""
  kustomize: ""
  k8sgpt: ""
