---
# logging_server group vars — non-sensitive overrides only.
#
# Vault pattern: sensitive values are defined in vault.yml (encrypted),
# then referenced here by name so this file stays human-readable.
# Run: ansible-vault encrypt inventory/group_vars/logging_server/vault.yml

# Loki data directory on the Hyper-V Ubuntu guest.
logging_loki_data_path: "/var/lib/loki"

# FUTURE — MinIO S3 backend upgrade path (captures the upgrade decision so it is not lost):
# When MinIO is running on home-lab-auth-hvh-01, switch Loki from filesystem to S3 object store:
#   1. In roles/logging_loki/templates/loki_config.yml.j2, replace storage backend:
#        storage_config:
#          aws:
#            s3: http://{{ vault_minio_user }}:{{ vault_minio_password }}@localhost:9000
#            s3forcepathstyle: true
#            bucketnames: loki-chunks
#   2. Add vault_minio_user and vault_minio_password to this vault.yml (then re-encrypt)
#   3. Create the loki-chunks bucket in MinIO before running the playbook
#   4. This is non-breaking — Loki queries across old filesystem data + new S3 data transparently

# Loki server push endpoint is set in group_vars/all.yaml so all Alloy agent hosts receive it.
# It should follow the home-lab-auth-hvh-01 Ubuntu guest when that logging role moves.

# Grafana admin password reference — value is in vault.yml (vault-encrypted).
logging_loki_grafana_admin_password: "{{ vault_logging_loki_grafana_admin_password }}"
