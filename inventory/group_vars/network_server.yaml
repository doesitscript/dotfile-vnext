---
# AI-NET-SERVER / network-server (physical node: network-server-win)
# group_vars filename matches inventory group name network_server
host_name: network-server
physical_node: network-server
lan_ip: "192.168.50.38"

node_role: storage-observability-node
os: windows-server-2025
authority_level: authoritative
docker_runtime: hyperv-ubuntu-docker-engine
persistent_data_allowed: true
docker_engine_host: "network-server-ubuntu"

# Storage paths (for apps storage like Postgres, etc.)
windows_data_root: "D:\\ai"
stacks_root: "D:\\ai\\stacks"
data_root: "D:\\ai\\data"
# minio_disk: "8TB WD Red Plus"

# Docker configuration (for Docker's basic image storage)
docker_data_root: "D:\\docker-data"  # non-OS disk

# Port exposure configuration (per contract)
# Restricted services bind to localhost only
postgres_exposure: "127.0.0.1:5432:5432"  # restricted - network_only
redis_exposure: "127.0.0.1:6379:6379"  # restricted - network_only
clickhouse_http_exposure: "127.0.0.1:8123:8123"  # restricted - network_only
clickhouse_native_exposure: "127.0.0.1:9000:9000"  # restricted - network_only
# LAN-exposed services bind to all interfaces
langfuse_exposure: "0.0.0.0:3000:3000"  # lan - firewall_open: true
minio_api_exposure: "0.0.0.0:9000:9000"  # lan - firewall_open: true
minio_console_exposure: "0.0.0.0:9001:9001"  # lan - firewall_open: true

# Task scheduler autostart
task_scheduler_enabled: true
task_scheduler_delay_seconds: 45

# Windows Server Backup baseline
# First milestone target: this is the first Windows host intended for the new
# backup playbook. The live baseline source remains server-225-win.
windows_server_backup_state: present
windows_server_backup_target_drive: "E"
# Intentionally do not pin the temporary vendor label here.
# After the backup disks are normalized across hosts, set the shared expected
# label (for example: "backups") at the common inventory layer.
windows_server_backup_baseline_source_host: "server-225-win"
