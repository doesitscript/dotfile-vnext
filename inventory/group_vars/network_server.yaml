---
# Variables for network-server node
node_role: storage-observability-node
os: windows-server-2025
authority_level: authoritative
docker_runtime: windows-docker-engine  # or wsl2 if chosen later
persistent_data_allowed: true

# Storage paths (placeholders - to be filled) # FOR OUR APPS STORAGE ANLIKE POSTGRESS OR ETC
windows_data_root: "<D>:\\ai"  # example: E:\\ai or D:\\ai
stacks_root: "<D>:\\ai\\stacks"
data_root: "<D>:\\ai\\data"
minio_disk: "8TB WD Red Plus"

# Docker configuration FOR DOCKERS BASIC IMAGE STOREAGE
docker_data_root: "<D>:\\docker-data"  # non-OS disk



