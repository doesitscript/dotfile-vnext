---
# Host and surface mapping reference (documentation + bootstrap hostname detection)
#
# Naming layers — do not mix these up:
# - inventory_hostname: Ansible/NetBox schema alias (hom-lab-ctl-hvh-02, hom-lab-ctl-dkr-02)
# - os_hostname: Windows COMPUTERNAME / Linux hostname on the machine itself
# - router_hostname: DHCP/DNS label on the LAN router (may differ from os_hostname)
# - ansible_connect_target: value in host_vars ansible_host (what Ansible/SSH dials)
# - host_ip / connect_address: stable IP for TCP checks and guest routing
# - physical_node: metadata grouping key — NOT a hostname
#
# Connection policy for this repo:
# - primary_connection: openssh (ansible_connection: ssh) — default for all active surfaces
# - secondary_connection: winrm — bootstrap/troubleshooting/fallback only unless explicitly targeted
#
# Authoritative runtime values live in inventory/host_vars/<inventory_hostname>.yaml .
# This file must stay aligned with those host_vars; when they diverge, host_vars win.

# Physical node mappings
# Bootstrap scripts (bin/bootstrap-local*.sh/ps1) auto-detect physical_node by matching
# the local machine's hostname (case-insensitive) against `os_hostname` below.
physical_nodes:
  hom-lab-ctl-hvh-02:
    os_hostname: "hom-lab-ctl-hvh-02"
    inventory_windows_host: hom-lab-ctl-hvh-02
    inventory_linux_vm_host: hom-lab-ctl-dkr-02
    ip_address: "192.168.50.158"
    ipv6_address: "fdfa:7038:521c:a5fa:7c9:f4a1:90b8:1b1e"
    # DNS hostname is now hom-lab-ctl-hvh-02; Windows still exposes a
    # truncated NetBIOS COMPUTERNAME that Hyper-V cmdlets must not use
    # implicitly for management resolution.
    hostname: "hom-lab-ctl-hvh-02"
    netbios_hostname: "HOM-LAB-CTL-HVH"
    legacy_physical_node_aliases:
      - server-225

  hom-lab-ctl-hvh-01:
    os_hostname: "hom-lab-ctl-hvh-01"
    router_hostname: "ai-net-server-mgmt"
    inventory_windows_host: hom-lab-ctl-hvh-01
    inventory_linux_vm_host: hom-lab-ctl-dkr-01
    ip_address: "192.168.50.234"
    ip_address_original: "192.168.50.233"
    legacy_aliases:
      - network-server
    # Bootstrap compatibility — must match Windows COMPUTERNAME
    hostname: "hom-lab-ctl-hvh-01"

  dev-3090:
    os_hostname: "Gaming-Desktop"
    inventory_windows_host: dev-3090-win
    ip_address: "192.168.50.191"
    hostname: "Gaming-Desktop"

  mac-dev:
    os_hostname: "Joshs-MBP"
    inventory_host: mac-dev
    ip_address: "192.168.50.33"
    hostname: "Joshs-MBP"

# Ansible surface mappings — one entry per inventory hostname
ansible_surfaces:
  # --- Windows control surfaces (SSH primary) ---

  hom-lab-ctl-hvh-02:
    physical_node: hom-lab-ctl-hvh-02
    surface_type: windows_host
    inventory_alias: true
    primary_connection: ssh
    secondary_connection: winrm
    ansible_connect_target: "192.168.50.158"
    connect_target_kind: ip_address
    ansible_port: 22
    host_ip: "192.168.50.158"
    os_hostname: "hom-lab-ctl-hvh-02"
    netbios_hostname: "HOM-LAB-CTL-HVH"
    host_vars: inventory/host_vars/hom-lab-ctl-hvh-02.yaml

  hom-lab-ctl-hvh-02-ipv6:
    physical_node: hom-lab-ctl-hvh-02
    surface_type: windows_host
    inventory_alias: true
    primary_connection: ssh
    secondary_connection: winrm
    ansible_connect_target: "fdfa:7038:521c:a5fa:7c9:f4a1:90b8:1b1e"
    connect_target_kind: ipv6_address
    ipv6_fallback_for: hom-lab-ctl-hvh-02
    host_ip: "192.168.50.158"
    host_vars: inventory/host_vars/hom-lab-ctl-hvh-02-ipv6.yaml
    notes: Explicit fallback surface — not in default windows_hosts group

  hom-lab-ctl-hvh-01:
    physical_node: hom-lab-ctl-hvh-01
    surface_type: windows_host
    inventory_alias: true
    primary_connection: ssh
    secondary_connection: winrm
    ansible_connect_target: "192.168.50.234"
    connect_target_kind: ip_address
    ansible_port: 2222
    host_ip: "192.168.50.234"
    router_hostname: ai-net-server-mgmt
    os_hostname: "AI-NET-SERVER"
    legacy_aliases:
      - network-server
    host_vars: inventory/host_vars/hom-lab-ctl-hvh-01.yaml
    notes: Uses IP for ansible_host because ai-net-server-mgmt is not reliably resolvable from mac-dev

  dev-3090-win:
    physical_node: dev-3090
    surface_type: windows_host
    inventory_alias: true
    primary_connection: ssh
    secondary_connection: winrm
    state: deferred
    host_vars: inventory/host_vars/dev-3090-win.yaml
    notes: Placeholder — no active ansible_host until provisioned

  # --- Hyper-V Ubuntu guest surfaces (SSH only) ---

  hom-lab-ctl-dkr-02:
    physical_node: hom-lab-ctl-hvh-02
    surface_type: ubuntu_vm
    inventory_alias: true
    primary_connection: ssh
    ansible_connect_target: "192.168.137.10"
    connect_target_kind: guest_ip
    host_ip: "192.168.137.10"
    ssh_proxy_jump_host: hom-lab-ctl-hvh-02
    host_vars: inventory/host_vars/hom-lab-ctl-dkr-02.yaml
    notes: Docker engine on hvh-02 guest subnet; guest OS hostname may differ from inventory name
    legacy_inventory_aliases:
      - server-225-ubuntu

  hom-lab-ctl-dkr-01:
    physical_node: hom-lab-ctl-hvh-01
    surface_type: ubuntu_vm
    inventory_alias: true
    primary_connection: ssh
    ansible_connect_target: "192.168.138.10"
    connect_target_kind: guest_ip
    host_ip: "192.168.138.10"
    ssh_proxy_jump_host: hom-lab-ctl-hvh-01
    host_vars: inventory/host_vars/hom-lab-ctl-dkr-01.yaml

  hom-lab-ctl-k3s-01:
    physical_node: hom-lab-ctl-hvh-01
    surface_type: ubuntu_vm
    inventory_alias: true
    primary_connection: ssh
    ansible_connect_target: "192.168.138.11"
    connect_target_kind: guest_ip
    host_ip: "192.168.138.11"
    ssh_proxy_jump_host: hom-lab-ctl-hvh-01
    host_vars: inventory/host_vars/hom-lab-ctl-k3s-01.yaml

  hom-lab-ctl-k3s-02:
    physical_node: hom-lab-ctl-hvh-02
    surface_type: ubuntu_vm
    inventory_alias: true
    primary_connection: ssh
    ansible_connect_target: "192.168.137.11"
    connect_target_kind: guest_ip
    host_ip: "192.168.137.11"
    ssh_proxy_jump_host: hom-lab-ctl-hvh-02
    host_vars: inventory/host_vars/hom-lab-ctl-k3s-02.yaml

  # --- macOS controller ---

  mac-dev:
    physical_node: mac-dev
    surface_type: macos_host
    inventory_alias: true
    primary_connection: ssh
    ansible_connect_target: "Joshs-MBP"
    connect_target_kind: os_hostname
    host_ip: "192.168.50.33"
    host_vars: inventory/host_vars/mac-dev.yaml

use_dns: true

# Quick reference — what to use where:
# | Use case                         | Use this field                         |
# |----------------------------------|----------------------------------------|
# | ansible-playbook --limit         | inventory_hostname                     |
# | ~/.ssh/config Host block         | inventory_hostname                     |
# | SSH HostName / ansible_host      | ansible_connect_target from host_vars  |
# | psql / TCP / K8s external DB URL | host_ip or fuzlang_*_connect_address   |
# | Bootstrap auto-detect on Windows | physical_nodes.*.os_hostname           |
# | NetBox / schema naming           | inventory_hostname (may lead OS rename)|
