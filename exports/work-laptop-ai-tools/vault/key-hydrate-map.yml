---
# Packet vault keys (names only). Hydrate copies matching parent values.
# Do not put secret values in this file.

packet_keys:
  - vault_shared_morph_api_key
  - vault_firecrawl_mcp_api_key
  - vault_context7_mcp_api_key
  - vault_firebase_mcp_service_account_json
  - vault_firebase_mcp_firebase_token
  - vault_firebase_mcp_extra_env
  - vault_k3s_litellm_gateway_master_key

# First match wins when the same key exists in more than one parent file.
parent_sources:
  - vault/shared.vault.yml
  - vault/mac_dev.vault.yml
