- name: Write work laptop packet receipt marker
  ansible.builtin.copy:
    dest: "{{ work_laptop_hello_marker_path }}"
    mode: "0600"
    content: |
      packet=work-laptop-ai-tools
      playbook_dir={{ playbook_dir }}
      inventory_hostname={{ inventory_hostname }}
      expected_local_hostname={{ expected_local_hostname }}
      scope={{ work_laptop_packet_scope | join(',') }}
