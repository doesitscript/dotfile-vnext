- name: Validate work_laptop_codex_cli state
  ansible.builtin.assert:
    that:
      - work_laptop_codex_cli_state in ["present", "absent"]
    fail_msg: work_laptop_codex_cli_state must be present or absent.

- name: Resolve npm executable from the managed nvm default
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/node/tasks/resolve_npm.yml"
  when: work_laptop_codex_cli_state in ["present", "absent"]

# Corporate / custom ~/.npmrc often sets prefix= (e.g. ~/.npm-packages). Global
# bins then land under that prefix, not next to the nvm npm binary.
# community.general.npm can report changed/ok without creating the shim at
# that prefix — always install with an explicit --prefix matching `npm prefix -g`.
- name: Resolve npm global prefix for Codex binary layout
  ansible.builtin.command:
    argv:
      - "{{ node_npm_executable }}"
      - prefix
      - -g
  register: work_laptop_codex_cli_npm_prefix_cmd
  changed_when: false
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"
  when: work_laptop_codex_cli_state in ["present", "absent"]

- name: Set Codex npm layout facts from global prefix
  ansible.builtin.set_fact:
    work_laptop_codex_cli_npm_prefix: "{{ work_laptop_codex_cli_npm_prefix_cmd.stdout | trim }}"
    work_laptop_codex_cli_command: >-
      {{ (work_laptop_codex_cli_npm_prefix_cmd.stdout | trim) }}/bin/codex
    work_laptop_codex_cli_module_path: >-
      {{ (work_laptop_codex_cli_npm_prefix_cmd.stdout | trim) }}/lib/node_modules/@openai/codex
  when: work_laptop_codex_cli_state in ["present", "absent"]

- name: Set Codex npm package name
  ansible.builtin.set_fact:
    work_laptop_codex_cli_package_name: >-
      {{
        work_laptop_codex_cli_package_base_name
        ~ (
          '@' ~ work_laptop_codex_cli_version
          if (work_laptop_codex_cli_version | default('') | length) > 0
          else ''
        )
      }}
  when: work_laptop_codex_cli_state == "present"

- name: Ensure npm global prefix directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ work_laptop_codex_cli_npm_prefix }}"
    - "{{ work_laptop_codex_cli_npm_prefix }}/bin"
    - "{{ work_laptop_codex_cli_npm_prefix }}/lib"
  when: work_laptop_codex_cli_state == "present"

- name: Install Codex CLI via npm into resolved global prefix
  ansible.builtin.command:
    argv:
      - "{{ node_npm_executable }}"
      - install
      - --global
      - --prefix
      - "{{ work_laptop_codex_cli_npm_prefix }}"
      - "{{ work_laptop_codex_cli_package_name }}"
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"
  register: work_laptop_codex_cli_npm_install
  changed_when: >-
    'added' in (work_laptop_codex_cli_npm_install.stdout | default(''))
    or 'changed' in (work_laptop_codex_cli_npm_install.stdout | default(''))
    or 'updated' in (work_laptop_codex_cli_npm_install.stdout | default(''))
  timeout: 300
  when: work_laptop_codex_cli_state == "present"

- name: Remove quarantine attribute from Codex npm module
  ansible.builtin.command:
    argv:
      - xattr
      - -dr
      - com.apple.quarantine
      - "{{ work_laptop_codex_cli_module_path }}"
  register: work_laptop_codex_cli_quarantine_remove
  changed_when: work_laptop_codex_cli_quarantine_remove.rc == 0
  failed_when: false
  when: work_laptop_codex_cli_state == "present"

- name: Check Codex CLI binary path after npm install
  ansible.builtin.stat:
    path: "{{ work_laptop_codex_cli_command }}"
  register: work_laptop_codex_cli_binary
  when: work_laptop_codex_cli_state == "present"

# Safety net for partial installs (module reported ok but shim missing).
- name: Repair missing Codex CLI binary with npm into resolved prefix
  ansible.builtin.command:
    argv:
      - "{{ node_npm_executable }}"
      - install
      - --global
      - --prefix
      - "{{ work_laptop_codex_cli_npm_prefix }}"
      - "{{ work_laptop_codex_cli_package_name }}"
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"
  changed_when: true
  timeout: 300
  when:
    - work_laptop_codex_cli_state == "present"
    - not (work_laptop_codex_cli_binary.stat.exists | default(false))

- name: Verify Codex CLI binary path after repair
  ansible.builtin.stat:
    path: "{{ work_laptop_codex_cli_command }}"
  register: work_laptop_codex_cli_binary
  when: work_laptop_codex_cli_state == "present"

- name: Require Codex CLI binary to exist after install
  ansible.builtin.assert:
    that:
      - work_laptop_codex_cli_binary.stat.exists | default(false)
      - work_laptop_codex_cli_binary.stat.executable | default(false)
    fail_msg: >-
      Codex CLI install did not produce an executable at
      {{ work_laptop_codex_cli_command }}
      (npm prefix -g={{ work_laptop_codex_cli_npm_prefix }}).
      Check ~/.npmrc prefix= and that {{ work_laptop_codex_cli_npm_prefix }}/bin
      is on PATH for interactive shells.
  when: work_laptop_codex_cli_state == "present"

# Keep interactive shells able to find prefix-global bins (Codex, context7-mcp, …).
- name: Ensure zsh PATH includes npm global prefix bin
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: work_laptop_npm_global_prefix_path"
    block: |
      # npm prefix -g (from ~/.npmrc); required when prefix != nvm node bin
      export PATH="{{ work_laptop_codex_cli_npm_prefix }}/bin:$PATH"
  when:
    - work_laptop_codex_cli_state == "present"
    - work_laptop_codex_cli_npm_prefix != (node_npm_executable | dirname | dirname)

- name: Remove Codex CLI via npm when absent
  ansible.builtin.command:
    argv:
      - "{{ node_npm_executable }}"
      - uninstall
      - --global
      - --prefix
      - "{{ work_laptop_codex_cli_npm_prefix }}"
      - "{{ work_laptop_codex_cli_package_base_name }}"
  environment:
    PATH: "{{ (node_npm_executable | dirname) ~ ':' ~ ansible_facts['env']['PATH'] }}"
  register: work_laptop_codex_cli_npm_uninstall
  changed_when: >-
    'removed' in (work_laptop_codex_cli_npm_uninstall.stdout | default(''))
  failed_when: false
  timeout: 300
  when: work_laptop_codex_cli_state == "absent"
