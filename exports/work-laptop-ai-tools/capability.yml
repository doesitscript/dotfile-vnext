name: work-laptop-ai-tools-export-packet
status: pilot
scope: implementation
owner_type: build_target_packet
owner_doc: exports/work-laptop-ai-tools/README.md
owned_files:
  - exports/work-laptop-ai-tools/.gitignore
  - exports/work-laptop-ai-tools/README.md
  - exports/work-laptop-ai-tools/ansible.cfg
  - exports/work-laptop-ai-tools/bootstrap/bootstrap-contract.sh
  - exports/work-laptop-ai-tools/bootstrap/bootstrap-tooling.yaml
  - exports/work-laptop-ai-tools/bootstrap/bootstrap-macos-ansible.sh
  - exports/work-laptop-ai-tools/capability.yml
  - exports/work-laptop-ai-tools/collections/requirements.yml
  - exports/work-laptop-ai-tools/export-manifest.yml
  - exports/work-laptop-ai-tools/scripts/requirements.txt
  - exports/work-laptop-ai-tools/playbook.yaml
  - exports/work-laptop-ai-tools/inventory.yaml
  - exports/work-laptop-ai-tools/host_vars/work-laptop.yaml
  - exports/work-laptop-ai-tools/roles/work_laptop_codex_cli/defaults/main.yml
  - exports/work-laptop-ai-tools/roles/work_laptop_codex_cli/tasks/main.yml
  - exports/work-laptop-ai-tools/roles/work_laptop_packet_receipt/tasks/main.yml
integration_files:
  - docs/plans/2026-09-02--work-laptop-export-pilot/README.md
update_behavior: >-
  Keep the packet isolated and local-run. Shared repo roles are sliced into the
  generated sibling build-target repo by the manifest sync skill; zip export
  remains explicit opt-in only and secondary.
removal_behavior: >-
  Remove the packet files listed in owned_files and the linked plan packet.
  Generated sibling repo contents may be discarded or the repo removed
  separately. No main inventory or host-mapping cleanup is required because
  this pilot does not integrate with those surfaces.
lifecycle:
  apply: local ansible-playbook run from the generated sibling repo checkout on the work laptop against inventory.yaml
  verify: contract validation, sibling repo sync, external bootstrap --help/--dry-run, external playbook syntax-check/list-hosts/list-tasks, and optional external apply; archive proof is explicit opt-in only
  undo: delete the marker file, remove the packet files, and discard the generated sibling repo contents if retiring the build target
  change_class: idempotent config pilot
