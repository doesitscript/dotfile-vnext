    inbound_sources:
      - "README Local Runtime Notes; laptop playbook UX"
    reapply: "Ensure vault_pass.sh + gitignored .vault_pass on laptop; ansible.cfg vault_password_file"
    generalize_to:
      - "Any packet playbook that would otherwise prompt for vault every run"

  - id: npm-global-prefix
