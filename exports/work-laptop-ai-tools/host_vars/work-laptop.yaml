node_role: work-laptop-ai-tools
node_purpose: interactive_desktop
management_boundary: user_managed
authority_level: non-authoritative
outbound_only: true
os: macOS

work_laptop_packet_scope:
  - hosts_file
  - codex_cli
  - codex_profiles
  - vscode_continue

work_laptop_model: "MacBook Pro 14-inch (November 2023)"
work_laptop_chip: "Apple M3 Pro"
work_laptop_macos_version: "Tahoe 26.6.1"
pyenv_global_versions:
  - "3.14.6"
python_vscode_extensions: []
vscode_cli_binary: code

work_laptop_hello_marker_path: "{{ ansible_env.HOME }}/.work-laptop-export-targeting.txt"

homelab_hosts_file_mac_enabled: true
