drawio_mcp_codex_wrapper_path: "{{ playbook_dir }}/bin/drawio-mcp-codex-stdio-wrapper.js"

netbox_mcp_state: absent
netbox_mcp_targets: [codex]
netbox_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
# Literal URL so role arg-spec/defaults never touch parent hostvars on this packet.
netbox_mcp_url: "http://netbox.hom.lab:8000"

openai_docs_mcp_state: absent
openai_docs_mcp_targets: [codex]
openai_docs_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

langfuse_docs_mcp_state: absent
langfuse_docs_mcp_targets: [codex]
langfuse_docs_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

huggingface_mcp_state: absent
huggingface_mcp_targets: [codex]
huggingface_mcp_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"

# Roles without native present|absent — playbook uses when: on these flags.
mcp_sysoperator_state: absent
mcp_sysoperator_codex_config_path: "{{ work_laptop_mcp_codex_config_path }}"
mcp_sysoperator_project_dir: "{{ ansible_env.HOME }}/.vscode"

redhat_ansible_mcp_state: absent
redhat_ansible_project_dir: "{{ ansible_env.HOME }}/.vscode"
redhat_ansible_workspace_root: "{{ playbook_dir }}"

# Permanent stability policy as of 2026-09-02:
# - do not enable editor autocomplete against remote LiteLLM, vLLM, or remote Ollama lanes
# - do not enable Zed edit predictions against remote infrastructure
# - only revisit autocomplete/predictions with a deliberately local-only small model on this Mac
continue_ide_state: present
continue_ide_api_key: ""
continue_ide_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
continue_ide_autocomplete_enabled: false
continue_ide_models:
  - name: "Chat Qwen2.5 Coder 32B (5090 vLLM)"
    model: "qwen2.5-coder-32b@k3s02-vllm"
    capabilities:
      - tool_use
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.3
  - name: "Edit Qwen2.5 Coder 7B (desktop Ollama)"
    model: "qwen2.5-coder-7b@desktop"
    capabilities:
      - tool_use
    roles:
      - edit
      - apply
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.2
continue_ide_mcp_servers:
  - name: "Terraform MCP"
    type: "stdio"
    command: "{{ ansible_env.HOME }}/.local/bin/terraform-mcp-server"
    args:
      - "stdio"
  - name: "AWS MCP"
    type: "streamable-http"
    url: "https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize"
  - name: "AWS IaC MCP"
    type: "stdio"
    command: "{{ aws_iac_mcp_command | default('uvx') }}"
    args:
      - "awslabs.aws-iac-mcp-server@latest"
    env:
      FASTMCP_LOG_LEVEL: "ERROR"
      AWS_REGION: "us-east-1"
  - name: context7
    type: stdio
    command: "{{ work_laptop_nvm_exec }}"
    args:
      - context7-mcp
  - name: firebase
    type: stdio
    command: "{{ work_laptop_nvm_exec }}"
    args:
      - npx
      - "-y"
      - firebase-tools@latest
      - mcp
  # WarpGrep: do not list continue_ide_rules for morph — morph role drops
  # ~/.continue/rules/morph-warpgrep-evaluation.md (Continue loads it).
  - name: morph-mcp
    type: stdio
    command: "{{ playbook_dir }}/bin/mcp-server-env-wrapper"
    args:
      - "{{ work_laptop_mcp_env_dir }}/morph.env"
      - "{{ work_laptop_nvm_exec }}"
      - morph-mcp
    env:
      WORKSPACE_MODE: "true"
      PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
continue_ide_blocked_lanes:
  - "qwen2.5-coder-14b@k3s02-vllm (undersized for 5090 — use 32B AWQ + fp8 KV)"
  - "Remote autocomplete disabled on 2026-09-02 due editor and remote-backend stability risk; only revisit with a local-only model on this Mac."

# ansible-dev-tools (Red Hat meta-package) requires Python >=3.10.
# The work laptop packet venv runs Python 3.9.6 (macOS system Python).
# Ansible core is already installed via scripts/requirements.txt in bootstrap.
# Override to only the libraries that are compatible and useful on Python 3.9.
ansible_dev_tools_pip_packages:
  - pynetbox
  - pytz

zed_ide_state: present
# Zed is already installed on the work laptop; manage config only — do not
# install or upgrade the Zed Homebrew cask from this packet.
zed_ide_install_cask: false
zed_ide_api_key: ""
zed_ide_vault_file_path: "{{ playbook_dir }}/vault/shared.vault.yml"
zed_ide_gateway_api_url: "http://litellm.hom.lab/v1"
zed_ide_models:
  - name: "qwen2.5-coder-32b@k3s02-vllm"
    display_name: "Homelab Qwen2.5 Coder 32B"
    max_tokens: 32768
    max_completion_tokens: 4096
  - name: "qwen2.5-coder-7b@desktop"
    display_name: "Homelab Qwen2.5 Coder 7B"
    max_tokens: 24000
    max_completion_tokens: 4096
  - name: "ministral-3-8b@desktop"
    display_name: "Homelab Ministral 3 8B"
    max_tokens: 24000
    max_completion_tokens: 4096
zed_ide_default_model:
  provider: "openai"
  model: "qwen2.5-coder-32b@k3s02-vllm"
zed_ide_inline_assistant_model:
  provider: "openai"
  model: "qwen2.5-coder-7b@desktop"
zed_ide_commit_message_model:
  provider: "openai"
  model: "qwen2.5-coder-7b@desktop"
zed_ide_thread_summary_model:
  provider: "openai"
  model: "ministral-3-8b@desktop"
zed_ide_compaction_model:
  provider: "openai"
  model: "qwen2.5-coder-32b@k3s02-vllm"
zed_ide_subagent_model:
  provider: "openai"
  model: "qwen2.5-coder-32b@k3s02-vllm"
zed_ide_inline_alternatives:
  - provider: "openai"
    model: "qwen2.5-coder-7b@desktop"
  - provider: "openai"
    model: "ministral-3-8b@desktop"
zed_ide_model_parameters:
  - provider: "openai"
    model: "qwen2.5-coder-32b@k3s02-vllm"
    temperature: 0.3
  - provider: "openai"
    model: "qwen2.5-coder-7b@desktop"
    temperature: 0.2
  - provider: "openai"
    model: "ministral-3-8b@desktop"
    temperature: 0.2
zed_ide_auto_compact:
  enabled: true
  threshold: "90%"
zed_ide_edit_predictions_enabled: false
zed_ide_edit_predictions:
  mode: "eager"
  provider: "ollama"
  ollama:
    api_url: "http://127.0.0.1:11434"
    model: "REPLACE_WITH_LOCAL_SMALL_MODEL"
    prompt_format: "qwen"
    max_output_tokens: 512
zed_ide_context_servers:
  terraform:
    command: "{{ terraform_mcp_command | default(ansible_env.HOME ~ '/.local/bin/terraform-mcp-server', true) }}"
    args:
      - "stdio"
    env:
      _MCP_ANSIBLE_ROLE_PATH: "roles/mcp_servers/terraform_mcp"
  "aws-mcp":
    url: "https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize"
  "aws-iac":
    command: "{{ aws_iac_mcp_command | default('uvx', true) }}"
    args:
      - "awslabs.aws-iac-mcp-server@latest"
    env:
      FASTMCP_LOG_LEVEL: "ERROR"
      AWS_REGION: "us-east-1"
