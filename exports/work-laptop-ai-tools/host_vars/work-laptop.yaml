node_default_version: "20"
npm_global_packages: []

work_laptop_codex_cli_state: present

codex_homelab_profiles_state: present
codex_homelab_profiles_multi_terminal_state: present
codex_homelab_profiles_model: "ministral-3-8b@desktop"
codex_homelab_profiles_context_window: 24000

vscode_extensions:
  - Continue.continue

continue_ide_state: present
continue_ide_api_key: "REPLACE_WITH_LITELLM_KEY"
continue_ide_models:
  - name: "Chat Qwen2.5 Coder 32B (5090 vLLM)"
    model: "qwen2.5-coder-32b@k3s02-vllm"
    roles:
      - chat
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.3
  - name: "Edit Qwen2.5 Coder 7B (desktop Ollama)"
    model: "qwen2.5-coder-7b@desktop"
    roles:
      - edit
      - apply
    default_completion_options:
      contextLength: 32768
      maxTokens: 4096
      temperature: 0.2
  - name: "Autocomplete Qwen2.5 Coder 1.5B (hvh01)"
    model: "qwen2.5-coder-1.5b@hvh01"
    roles:
      - autocomplete
    use_legacy_completions_endpoint: true
    autocomplete_options:
      debounceDelay: 250
      maxPromptTokens: 1024
      onlyMyCode: true
continue_ide_blocked_lanes:
  - "qwen2.5-coder-14b@k3s02-vllm (undersized for 5090 — use 32B AWQ + fp8 KV)"
