packet_name: work-laptop-ai-tools
archive_name: work-laptop-ai-tools.zip
include:
  - path: exports/work-laptop-ai-tools/README.md
  - path: exports/work-laptop-ai-tools/ansible.cfg
  - path: exports/work-laptop-ai-tools/bootstrap
  - path: exports/work-laptop-ai-tools/capability.yml
  - path: exports/work-laptop-ai-tools/collections
  - path: exports/work-laptop-ai-tools/export-manifest.yml
  - path: exports/work-laptop-ai-tools/playbook.yaml
  - path: exports/work-laptop-ai-tools/inventory.yaml
  - path: exports/work-laptop-ai-tools/host_vars
  - path: exports/work-laptop-ai-tools/scripts
  - path: exports/work-laptop-ai-tools/roles
  - path: roles/common/shell_config
    dest: roles/common/shell_config
  - path: roles/common/node
    dest: roles/common/node
  - path: roles/common/vscode
    dest: roles/common/vscode
  - path: roles/codex_homelab_profiles
    dest: roles/codex_homelab_profiles
  - path: roles/continue_ide
    dest: roles/continue_ide
  - path: roles/homelab_hosts_file_mac
    dest: roles/homelab_hosts_file_mac
  - path: roles/python
    dest: roles/python
  - path: roles/ansible_dev_tools
    dest: roles/ansible_dev_tools
  - path: roles/package_manager
    dest: roles/package_manager
exclude:
  - .git/**
  - .venv/**
  - .direnv/**
  - node_modules/**
notes:
  - The real target short hostname is MLLXLJJ2XVFJ.
  - This pilot intentionally ships no secrets or vault content.
  - Continue renders with a placeholder API key that must be replaced on the work laptop.
  - The Codex launcher expects SSH and kubectl access to hom-lab-ctl-k3s-02 for gateway-key lookup.
