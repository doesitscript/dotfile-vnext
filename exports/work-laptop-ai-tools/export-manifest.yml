notes:
  - The real target short hostname is MLLXLJJ2XVFJ.
  - Live secrets are not shipped; vault/ holds README + example only until operator-local vault is provided.
  - "Additional MCP roles are included; commissioned in host_vars: terraform, aws, aws_iac, context7, firebase, morph (+ ripgrep). Others stay absent."
  - "Morph WarpGrep needs operator-local vault/shared.vault.yml (vault_shared_morph_api_key) before the packet playbook will converge."
  - Slice-local agent skills live under `.agents/skills/` and ship with AGENTS.md.
  - Continue renders with a placeholder API key that must be replaced on the work laptop.
  - AWS MCP uses first-use OAuth against the official managed AWS endpoint.
  - The Codex launcher expects SSH and kubectl access to hom-lab-ctl-k3s-02 for gateway-key lookup.
  - The sibling repo is the primary generated build target; the zip archive remains optional.
