  - path: roles/mcp_servers/firecrawl
    dest: roles/mcp_servers/firecrawl
  - path: roles/mcp_servers/morph
    dest: roles/mcp_servers/morph
  - path: roles/mcp_servers/playwright
    dest: roles/mcp_servers/playwright
  - path: roles/mcp_servers/fetch
