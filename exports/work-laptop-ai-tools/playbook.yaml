- name: Export-only work laptop AI tools target packet
  hosts: work-laptop
  gather_facts: true
  become: false
  # Homebrew 6+ tap-trust breaks community.general.homebrew when the machine
  # already has untrusted third-party taps. Keep official formula installs working.
  # Also avoid brew install of one formula upgrading unrelated outdated kegs
  # (e.g. golangci-lint) and failing the whole Ansible homebrew task on link.
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    HOMEBREW_NO_AUTO_UPDATE: "1"

  vars:
    # Self-contained packet: resolve paths relative to the packet root and the
    # running user's home directory instead of a dotfile-vnext checkout.
    dotfiles_home: "{{ playbook_dir }}"
    dotfiles_user_home: "{{ ansible_facts['env']['HOME'] | default(ansible_user_dir) }}"

  pre_tasks:
    # Safety checks stay on full and recent-window applies.
    - name: Require explicit export mode
      tags: [always]
      ansible.builtin.assert:
        that:
          - work_laptop_export_mode | default(false) | bool
        fail_msg: >-
          This packet is export-only. Re-run with
          work_laptop_export_mode=true in the packet inventory or extra vars.

    - name: Require local execution
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
        fail_msg: This packet must run locally on the target MacBook.

    - name: Require expected local hostname
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_hostname == expected_local_hostname
        fail_msg: >-
          Hostname mismatch. Expected {{ expected_local_hostname }}, got
          {{ ansible_hostname }}.

    - name: Require macOS target
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == "Darwin"
        fail_msg: This packet currently supports macOS targets only.

    - name: Check whether Homebrew is available
      tags: [always]
      ansible.builtin.command:
        argv: [brew, --version]
      register: work_laptop_homebrew_check
      changed_when: false
      failed_when: false

    - name: Require Homebrew before package-managed tasks
      tags: [always]
      ansible.builtin.assert:
        that:
          - work_laptop_homebrew_check.rc == 0
        fail_msg: >-
          Homebrew is required before this packet can install VS Code, Python,
          and Codex CLI dependencies. Run
          ./bootstrap/bootstrap-macos-ansible.sh on the exported packet first,
          then re-run this playbook.

  roles:
    - role: homelab_hosts_file_mac
      tags: [hosts_file]
    - role: common/node
      tags: [ai_cli_apps, ai_clients, codex, codex_cli]
    - role: work_laptop_codex_cli
      tags: [ai_cli_apps, ai_clients, codex, codex_cli]
    - role: codex_user_config
      tags: [ai_cli_apps, ai_clients, codex, codex_user_config]
    - role: codex_homelab_profiles
      tags: [ai_cli_apps, ai_clients, codex, codex_profiles]
    - role: common/vscode
      tags: [vscode, vscode_continue, vscode_extensions]
    - role: terraform_cli
      tags: [terraform, terraform_cli]
    - role: mcp_servers/terraform_mcp
      tags: [mcp, terraform, terraform_mcp]
    - role: mcp_servers/aws_mcp
      tags: [mcp, aws, aws_mcp]
    - role: mcp_servers/aws_iac_mcp
      tags: [mcp, aws, aws_iac, aws_iac_mcp]
    # Optional MCP catalog (default absent in host_vars — not commissioned).
    - role: ripgrep_cli
      tags: [mcp, morph, ripgrep]
    - role: mcp_servers/context7
      tags: [mcp, context7]
    - role: mcp_servers/firecrawl
      tags: [mcp, firecrawl]
    - role: mcp_servers/morph
      tags: [mcp, morph]
    - role: mcp_servers/playwright
      tags: [mcp, playwright]
    - role: mcp_servers/fetch
      tags: [mcp, fetch]
    - role: mcp_servers/firebase
      tags: [mcp, firebase]
    - role: mcp_servers/drawio
      tags: [mcp, drawio]
    - role: mcp_servers/netbox
      tags: [mcp, netbox]
    - role: mcp_servers/openai_docs
      tags: [mcp, openai_docs]
    - role: mcp_servers/langfuse_docs
      tags: [mcp, langfuse_docs, recent_15]
    - role: mcp_servers/huggingface
      tags: [mcp, huggingface, recent_15]
    # Legacy-shaped roles without native present|absent — gate via host_vars.
    - role: mcp_servers/mcp-sysoperator
      when: mcp_sysoperator_state | default('absent') == 'present'
      tags: [mcp, mcp-sysoperator, recent_15]
    - role: mcp_servers/redhat-ansible
      when: redhat_ansible_mcp_state | default('absent') == 'present'
      tags: [mcp, redhat-ansible, recent_15]
    - role: continue_ide
      tags: [ai_cli_apps, ai_clients, continue, vscode_continue, recent_15]
    # Recent window: last 15 role entries, and the tighter last 10.
    # Append new sequential day-2 roles immediately above the receipt.
    # Give the new entry recent_15 and recent_10, then drop those tags from
    # the entry that fell out of each window. Check with
    # scripts/check_playbook_recent_window.py
    - role: multiagents
      tags: [multiagents, mcp, multiagents_peer, recent_15, recent_10]
    - role: jan_ide
      tags: [jan, jan_ide, recent_15, recent_10]
    - role: cline_ide
      tags: [ai_cli_apps, ai_clients, cline, vscode_cline, recent_15, recent_10]
    - role: zed_ide
      tags: [ai_cli_apps, ai_clients, zed, zed_ide, recent_15, recent_10]
    - role: opencode_cli
      tags: [ai_cli_apps, ai_clients, opencode, opencode_cli, recent_15, recent_10]
    - role: kilo_ide
      tags: [ai_cli_apps, ai_clients, kilo, kilo_ide, recent_15, recent_10]
    - role: aider
      tags: [ai_cli_apps, ai_clients, aider, recent_15, recent_10]
    - role: mcp_servers/morph
      tags: [mcp, morph, morph_mcp, recent_15, recent_10]
    - role: mcp_servers/context7
      tags: [mcp, context7, context7_mcp, recent_15]
    - role: mcp_servers/firecrawl
      tags: [mcp, firecrawl, firecrawl_mcp, recent_15, recent_10]
    - role: work_laptop_packet_receipt
      tags: [always, recent_15, recent_10]
