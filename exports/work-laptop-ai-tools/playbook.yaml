- name: Export-only work laptop AI tools target packet
  hosts: work-laptop
  gather_facts: true
  become: false
  # Homebrew 6+ tap-trust breaks community.general.homebrew when the machine
  # already has untrusted third-party taps. Keep official formula installs working.
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

  vars:
    # Self-contained packet: resolve paths relative to the packet root and the
    # running user's home directory instead of a dotfile-vnext checkout.
    dotfiles_home: "{{ playbook_dir }}"
    dotfiles_user_home: "{{ ansible_facts['env']['HOME'] | default(ansible_user_dir) }}"

  pre_tasks:
    - name: Require explicit export mode
      ansible.builtin.assert:
        that:
          - work_laptop_export_mode | default(false) | bool
        fail_msg: >-
          This packet is export-only. Re-run with
          work_laptop_export_mode=true in the packet inventory or extra vars.

    - name: Require local execution
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
        fail_msg: This packet must run locally on the target MacBook.

    - name: Require expected local hostname
      ansible.builtin.assert:
        that:
          - ansible_hostname == expected_local_hostname
        fail_msg: >-
          Hostname mismatch. Expected {{ expected_local_hostname }}, got
          {{ ansible_hostname }}.

    - name: Require macOS target
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == "Darwin"
        fail_msg: This packet currently supports macOS targets only.

    - name: Check whether Homebrew is available
      ansible.builtin.command:
        argv: [brew, --version]
      register: work_laptop_homebrew_check
      changed_when: false
      failed_when: false

    - name: Require Homebrew before package-managed tasks
      ansible.builtin.assert:
        that:
          - work_laptop_homebrew_check.rc == 0
        fail_msg: >-
          Homebrew is required before this packet can install VS Code, Python,
          and Codex CLI dependencies. Run
          ./bootstrap/bootstrap-macos-ansible.sh on the exported packet first,
          then re-run this playbook.

  roles:
    - role: homelab_hosts_file_mac
      tags: [hosts_file]
    - role: common/node
      tags: [codex, codex_cli]
    - role: work_laptop_codex_cli
      tags: [codex, codex_cli]
    - role: codex_user_config
      tags: [codex, codex_user_config]
    - role: codex_homelab_profiles
      tags: [codex, codex_profiles]
    - role: common/vscode
      tags: [vscode, vscode_continue, vscode_extensions]
    - role: terraform_cli
      tags: [terraform, terraform_cli]
    - role: mcp_servers/terraform_mcp
      tags: [mcp, terraform, terraform_mcp]
    - role: mcp_servers/aws_mcp
      tags: [mcp, aws, aws_mcp]
    - role: mcp_servers/aws_iac_mcp
      tags: [mcp, aws, aws_iac, aws_iac_mcp]
    - role: continue_ide
      tags: [continue, vscode_continue]
    - role: zed_ide
      tags: [zed, zed_ide]
    - role: work_laptop_packet_receipt
      tags: [always]
